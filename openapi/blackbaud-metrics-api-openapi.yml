openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: CSRconnect Metrics API'
  description: This API is for YourCause CSRconnect from Blackbaud.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/csr-connect
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/csr-connect
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Metrics
paths:
  /v1/metrics/charities:
    get:
      operationId: GetCharityMetrics
      summary: Get top charities (PREVIEW)
      description: 'Returns the top charities supported by the authenticated affiliate for both giving and volunteering. Each collection contains a high-level giving or volunteering summary.


        Each charity''s `charity_id` is the unique identifier for the organization in CSRconnect and can be used to fetch a more granular summary for that organization.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      responses:
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: Authentication credentials were missing or invalid.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '400':
          description: Returned when the specified request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: The request was invalid or missing required parameters.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '200':
          description: Returned when the operation succeeds. The response body contains giving and volunteering summaries for the top charities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharityMetricsResponse'
              example:
                give:
                - charity_id: 1001
                  charity_name: City Food Bank
                  charity_registration_number: 12-3456789
                  total_donors: 42
                  total_transactions: 58
                  total_amount: 9600
                volunteer:
                - charity_id: 1001
                  charity_name: City Food Bank
                  charity_registration_number: 12-3456789
                  total_opportunities: 6
                  total_hours: 320.5
                  total_participants: 76
        '403':
          description: Returned when the user does not have rights to view charity metrics.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Forbidden
                status: 403
                detail: You do not have permission to access this resource.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '404':
          description: Returned when no charity metrics are found for the affiliate.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: The requested resource could not be found.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
      tags:
      - Metrics
  /v1/metrics/charities/{charity_id}:
    get:
      operationId: GetCharityMetricsById
      summary: Get charity data (PREVIEW)
      description: 'Returns giving and volunteering totals for a single charity. You can use the `v1/metrics/charities` endpoint to pull identifiers for the top charities; for a charity not returned there, the identifier can be found using CSRconnect admin tools and reporting.


        Returns 400 Bad Request if charity_id does not correspond to a known charity.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: charity_id
        in: path
        required: true
        schema:
          type: integer
        description: The unique identifier for the charity in CSRconnect.
      responses:
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: Authentication credentials were missing or invalid.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '400':
          description: Returned when the specified request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: The request was invalid or missing required parameters.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '200':
          description: Returned when the operation succeeds. The response body contains giving and volunteering totals for the specified charity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharityMetricsByIdResponse'
              example:
                charity_id: 1001
                charity_name: City Food Bank
                charity_registration_number: 12-3456789
                image_url: https://example.org/images/city-food-bank.png
                give:
                - donation_type: OneTime
                  total_amount: 6500
                  total_donors: 30
                  total_transactions: 35
                - donation_type: Payroll
                  total_amount: 3100
                  total_donors: 12
                  total_transactions: 120
                volunteer:
                  events:
                    total_hours: 220
                    total_events: 18
                    total_participants: 60
                  activities:
                    total_hours: 100.5
                    total_activities: 22
                    total_participants: 16
                  npo_events:
                    total_hours: 0
                    total_events: 0
                    total_participants: 0
        '403':
          description: Returned when the user does not have rights to view charity metrics.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Forbidden
                status: 403
                detail: You do not have permission to access this resource.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
      tags:
      - Metrics
