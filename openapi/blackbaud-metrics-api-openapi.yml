  /v1/metrics/give:
    get:
      operationId: GetGiveMetrics
      summary: Get a summary of giving totals (PREVIEW)
      description: 'Returns a summary of giving totals for the authenticated affiliate, broken down by donation type.


        The date_type param applies only to donation metrics. It controls whether donations are included by the date the record was created or the date of the actual donation. For example, an employee can record an offline donation on one date, but the donation itself occurred on an earlier date. For a company match or incentive request that requires approval, the create date is when the employee submits the request, and the donation date is when the request is approved and becomes a donation.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: country_code
        in: query
        required: true
        schema:
          type: string
        description: The ISO country code used to filter donations by country.
      - name: date_type
        in: query
        required: false
        schema:
          type: string
          enum:
          - Created
          - Donated
        description: Controls whether the date range filters by the date a donation record was created or the date the donation was made. Defaults to "created" when omitted and start or end is specified.
      - name: start
        in: query
        required: false
        schema:
          type: string
        description: The start of the date range to include.
      - name: end
        in: query
        required: false
        schema:
          type: string
        description: The end of the date range to include.
      responses:
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: Authentication credentials were missing or invalid.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '400':
          description: Returned when the specified request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: The request was invalid or missing required parameters.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '200':
          description: Returned when the operation succeeds. The response body contains a summary of giving totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiveMetricsResponse'
              example:
                data:
                - donation_type: OneTime
                  total_amount: 12500
                  total_donors: 80
                  total_transactions: 95
                - donation_type: Recurring
                  total_amount: 34000
                  total_donors: 48
                  total_transactions: 576
                total_unique_donors: 128
        '403':
          description: Returned when the user does not have rights to view giving metrics.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Forbidden
                status: 403
                detail: You do not have permission to access this resource.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '404':
          description: Returned when no giving metrics are found for the given criteria.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: The requested resource could not be found.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
      tags:
      - Metrics
