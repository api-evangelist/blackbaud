  /v1/metrics/volunteer:
    get:
      operationId: GetVolunteerMetrics
      summary: Get a summary of volunteering totals (PREVIEW)
      description: 'Returns a summary of volunteering totals for the authenticated affiliate, broken down into events, activities, and NPO-created events.


        `events` reflects employee-created volunteer events. `activities` reflects individually recorded volunteer activities. `npoEvents` reflects events created by a nonprofit organization.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: country_code
        in: query
        required: false
        schema:
          type: string
        description: The ISO country code used to filter volunteering activity by country.
      - name: start
        in: query
        required: false
        schema:
          type: string
        description: The start of the date range to include.
      - name: end
        in: query
        required: false
        schema:
          type: string
        description: The end of the date range to include.
      responses:
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: Authentication credentials were missing or invalid.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '400':
          description: Returned when the specified request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: The request was invalid or missing required parameters.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '200':
          description: Returned when the operation succeeds. The response body contains a summary of volunteering totals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolunteerMetricsResponse'
              example:
                events:
                  total_hours: 320.5
                  total_events: 42
                  total_participants: 96
                activities:
                  total_hours: 58
                  total_activities: 15
                  total_participants: 22
                npo_events:
                  total_hours: 12
                  total_events: 3
                  total_participants: 8
        '403':
          description: Returned when the user does not have rights to view volunteering metrics.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Forbidden
                status: 403
                detail: You do not have permission to access this resource.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '404':
          description: Returned when no volunteering metrics are found for the given criteria.
          content:
