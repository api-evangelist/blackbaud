components:
  schemas:
    MetricsEventsResponse:
      type: object
      properties:
        total_hours:
          type: number
          description: The total number of hours logged across these events.
          format: double
        total_events:
          type: integer
          description: The total number of events.
          format: int32
        total_participants:
          type: integer
          description: The count of unique participants across these events.
          format: int32
      additionalProperties: false
      description: Represents a summary of volunteer event participation.
    EngagementElementMetricsResponse:
      type: object
      properties:
        data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/EngagementElementInformation'
          description: The collection of engagement element summaries.
      additionalProperties: false
      description: Represents a collection of engagement element summaries for the authenticated affiliate.
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
          description: A URI reference (RFC 3986) that identifies the problem type. When dereferenced, it should provide human-readable documentation for the problem. Defaults to "about:blank" when not present.<br/><br/>Available values:<table><tr><th>type</th><th>detail</th></tr><tr><td>about:blank</td><td>Type is not defined</td></tr></table>
        title:
          type:
          - string
          - 'null'
          description: A short, human-readable summary of the problem type.
        status:
          type:
          - integer
          - 'null'
          description: The HTTP status code for this occurrence of the problem.
          format: int32
        detail:
          type:
          - string
          - 'null'
          description: A human-readable explanation specific to this occurrence of the problem.
        instance:
          type:
          - string
          - 'null'
          description: A URI reference that identifies the specific occurrence of the problem. It may or may not yield further information if dereferenced.
        trace_id:
          type: string
          description: A request ID that can be provided to Blackbaud Support that may help with further troubleshooting.
        span_id:
          type: string
          description: A request ID that can be provided to Blackbaud Support that may help with further troubleshooting.
      additionalProperties: {}
      description: A machine-readable format for specifying errors in HTTP API responses based on https://tools.ietf.org/html/rfc7807.
    ActivitiesResponse:
      type: object
      properties:
        total_hours:
          type: number
          description: The total number of hours logged across these activities.
          format: double
        total_activities:
          type: integer
          description: The total number of activities.
          format: int32
        total_participants:
          type: integer
          description: The count of unique participants across these activities.
          format: int32
      additionalProperties: false
      description: Represents a summary of individually recorded volunteer activities.
    EngagementElementInformation:
      type: object
      properties:
        engagement_element_id:
          type: string
          description: The unique identifier for the engagement element.
          format: uuid
        name:
          type:
          - string
          - 'null'
          description: The name of the engagement element.
        total_amount:
          type: number
          description: The total amount donated through this engagement element.
          format: double
        total_donors:
          type: integer
          description: The count of unique donors who contributed through this engagement element.
          format: int32
      additionalProperties: false
      description: Represents a summary of donations tied to a single engagement element.
    GiveCampaignMetricsByCampaignIdResponse:
      type: object
      properties:
        campaign_name:
          type:
          - string
          - 'null'
          description: The name of the giving campaign.
        campaign_start_date_utc:
          type: string
          description: The UTC date and time when the campaign starts.
          format: date-time
        campaign_end_date_utc:
          type: string
          description: The UTC date and time when the campaign ends.
          format: date-time
        data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DonationsGroupByDonationType'
          description: 'The collection of donation totals for the campaign, grouped by donation type. Only processed donations are

            included; the "Payroll" donation type reflects processed payroll donations only, not future pledges.'
      additionalProperties: false
      description: Represents donation totals for a single giving campaign, broken down by donation type.
    CharityVolunteerInformation:
      type: object
      properties:
        charity_id:
          type: integer
          description: The unique identifier for the charity in CSRconnect.
          format: int32
        charity_name:
          type:
          - string
          - 'null'
          description: The name of the charity.
        charity_registration_number:
          type:
          - string
          - 'null'
          description: The charity's registration number (e.g. EIN).
        total_opportunities:
          type: integer
          description: The count of volunteer opportunities associated with the charity.
          format: int32
        total_hours:
          type: number
          description: The total number of volunteer hours logged for the charity.
          format: double
        total_participants:
          type: integer
          description: The count of unique participants who volunteered with the charity.
          format: int32
      additionalProperties: false
      description: Represents a summary of volunteering activity for a single charity.
    GiveMetricsResponse:
      type: object
      properties:
        data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DonationsGroupByDonationType'
          description: The collection of donation totals, grouped by donation type.
        total_unique_donors:
          type: integer
          description: The count of unique donors across all donation types for the given criteria.
          format: int32
      additionalProperties: false
      description: Represents a summary of giving totals, broken down by donation type.
    GiveCampaignInformation:
      type: object
      properties:
        campaign_id:
          type: string
          description: The unique identifier for the giving campaign.
          format: uuid
        campaign_name:
          type:
          - string
          - 'null'
          description: The name of the giving campaign.
        campaign_start_date_utc:
          type: string
          description: The UTC date and time when the campaign starts.
          format: date-time
        campaign_end_date_utc:
          type: string
          description: The UTC date and time when the campaign ends.
          format: date-time
        total_amount:
          type: number
          description: The total amount donated to the campaign, including pledges. Payroll donations are not included in this total.
          format: double
        total_donors:
          type: integer
          description: The count of unique donors who have contributed to the campaign.
          format: int32
      additionalProperties: false
      description: Represents a summary of a single company giving campaign.
    CharityMetricsResponse:
      type: object
      properties:
        give:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CharityGiveInformation'
          description: The collection of giving summaries for the top charities.
        volunteer:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CharityVolunteerInformation'
          description: The collection of volunteering summaries for the top charities.
      additionalProperties: false
      description: Represents the top charities supported by the authenticated affiliate for giving and volunteering.
    GiveCampaignMetricsResponse:
      type: object
      properties:
        data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/GiveCampaignInformation'
          description: The collection of giving campaign summaries.
      additionalProperties: false
      description: Represents a collection of company giving campaign summaries for the authenticated affiliate.
    EngagementElementMetricsByIdResponse:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          description: The name of the engagement element.
        data:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DonationsGroupByDonationType'
          description: 'The collection of donation totals for the engagement element, grouped by donation type. Only processed donations are

            included; the "Payroll" donation type reflects processed payroll donations only, not future pledges.'
      additionalProperties: false
      description: Represents donation totals for a single engagement element, broken down by donation type.
    CharityMetricsByIdResponse:
      type: object
      properties:
        charity_id:
          type: integer
          description: The unique identifier for the charity in CSRconnect.
          format: int32
        charity_name:
          type:
          - string
          - 'null'
          description: The name of the charity.
        charity_registration_number:
          type:
          - string
          - 'null'
          description: The charity's registration number (e.g. EIN).
        image_url:
          type:
          - string
          - 'null'
          description: The URL of the charity's image.
        give:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DonationsGroupByDonationType'
          description: The collection of donation totals for the charity, grouped by donation type.
        volunteer:
          $ref: '#/components/schemas/VolunteerMetricsResponse'
      additionalProperties: false
      description: Represents giving and volunteering totals for a single charity.
    VolunteerMetricsResponse:
      type: object
      properties:
        events:
          $ref: '#/components/schemas/MetricsEventsResponse'
        activities:
          $ref: '#/components/schemas/ActivitiesResponse'
        npo_events:
          $ref: '#/components/schemas/MetricsEventsResponse'
      additionalProperties: false
      description: Represents a summary of volunteering totals, broken down into events, activities, and NPO-created events.
    CharityGiveInformation:
      type: object
      properties:
        charity_id:
          type: integer
          description: The unique identifier for the charity in CSRconnect.
          format: int32
        charity_name:
          type:
          - string
          - 'null'
          description: The name of the charity.
        charity_registration_number:
          type:
          - string
          - 'null'
          description: The charity's registration number (e.g. EIN).
        total_donors:
          type: integer
          description: The count of unique donors who contributed to the charity.
          format: int32
        total_transactions:
          type: integer
          description: The count of individual donation transactions made to the charity.
          format: int32
        total_amount:
          type: number
          description: The total amount donated to the charity.
          format: double
      additionalProperties: false
      description: Represents a summary of donations made to a single charity.
    DonationsGroupByDonationType:
      type: object
      properties:
        donation_type:
          type:
          - string
          - 'null'
          description: The type of donation, e.g. "OneTime", "Recurring", or "CompanyMatch".
        total_amount:
          type: number
          description: The total amount donated for this donation type.
          format: double
        total_donors:
          type: integer
          description: The count of unique donors who contributed to this donation type.
          format: int32
        total_transactions:
          type: integer
          description: The count of individual transactions for this donation type.
          format: int32
      additionalProperties: false
      description: Represents donation totals for a single donation type.
  securitySchemes:
    Bb-Api-Subscription-Key:
      type: apiKey
      name: Bb-Api-Subscription-Key
      in: header
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://app.blackbaud.com/oauth/authorize
          tokenUrl: https://oauth2.sky.blackbaud.com/token
          scopes: {}
