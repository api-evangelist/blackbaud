        description: Values for cookies related to the Infinity load balancer session.
      - name: more_rows_range_key
        in: query
        required: false
        schema:
          type: string
        description: Key for accessing cached results on subsequent calls to this data list.
      - name: start_row_index
        in: query
        required: false
        schema:
          type: integer
        description: Number of rows to skip,get result after these rows.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of result entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignationListCollection'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to view the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Designations
    servers:
    - url: https://api.sky.blackbaud.com/alt-fndmg
  /designations/search:
    get:
      operationId: SearchDesignations
      summary: Search for designations
      description: Designation Search.
      parameters:
      - name: description
        in: query
        required: false
        schema:
          type: string
        description: description
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
        description: include inactive
      - name: site_id
        in: query
        required: false
        schema:
          type: string
        description: site
      - name: designation_name
        in: query
        required: false
        schema:
          type: string
        description: Designation name search filter.
      - name: user_id
        in: query
        required: false
        schema:
          type: string
        description: Lookup ID search filter.
      - name: vanity_name
        in: query
        required: false
        schema:
          type: string
        description: Public name search filter.
      - name: combined_search
        in: query
        required: false
        schema:
          type: string
        description: Combined search across lookup ID, designation, and public name.
      - name: include_all_designations
        in: query
        required: false
        schema:
          type: boolean
        description: Include all designations, not just revenue designations.
      - name: vse_category
        in: query
        required: false
        schema:
          type: string
        description: VSE category filter.
      - name: vse_subcategory
        in: query
        required: false
        schema:
          type: string
        description: VSE subcategory filter.
      - name: designation_report_code_1
        in: query
        required: false
        schema:
          type: string
        description: First designation report code filter.
      - name: designation_report_code_2
        in: query
        required: false
        schema:
          type: string
        description: Second designation report code filter.
      - name: designation_use
        in: query
        required: false
        schema:
          type: string
        description: Designation use code filter.
      - name: designation_level_type
        in: query
        required: false
        schema:
          type: string
        description: Purpose type filter.
      - name: designation_level_category
        in: query
        required: false
        schema:
          type: string
        description: Purpose category filter.
      - name: purpose_report_code_1
        in: query
        required: false
        schema:
          type: string
        description: First purpose report code filter.
      - name: purpose_report_code_2
        in: query
        required: false
        schema:
          type: string
        description: Second purpose report code filter.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Limits the number of records to return.
      - name: infinity_session
        in: query
        required: false
        schema:
          type: string
        description: Values for cookies related to the Infinity load balancer session.
      - name: session_key
        in: query
        required: false
        schema:
          type: string
        description: A unique key provided by user for paging results. The same key will be returned in a successful response.
      - name: more_rows_range_key
        in: query
        required: false
        schema:
          type: string
        description: Key for accessing cached results on subsequent calls to this search list.
      - name: start_row_index
        in: query
        required: false
        schema:
          type: integer
        description: Number of rows to skip, get result after these rows.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of result entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignationSearchCollection'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to read the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Designations
    servers:
    - url: https://api.sky.blackbaud.com/alt-fndmg
