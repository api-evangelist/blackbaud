openapi: 3.2.0
info:
  title: Blackbaud Designations API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Designations across 2 of this provider''s published API definitions: blackbaud-altru-fundraising-api-openapi.yml, blackbaud-crm-fundraising-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/alt-fndmg
- url: https://api.sky.blackbaud.com/crm-fndmg
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Designations
paths:
  /designations/hierarchies/list:
    get:
      operationId: ListDesignationHierarchies
      summary: List designation hierarchies
      description: Returns all of the designation hierarchies.
      parameters:
      - name: combined_search
        in: query
        required: false
        schema:
          type: string
        description: search for
      - name: designation_level_type
        in: query
        required: false
        schema:
          type: string
        description: type SimpleDataListID=5135618a-3055-4e02-ab1e-a2c091ad05e5.
      - name: active_only
        in: query
        required: false
        schema:
          type: boolean
        description: only show active designations
      - name: sort_field
        in: query
        required: false
        schema:
          type: string
          enum:
          - Purpose
          - Designation lookup ID
          - Public designation name
          - Type
          - Revenue designation
          - Is active
        description: sort by
      - name: sort_dir
        in: query
        required: false
        schema:
          type: string
          enum:
          - Ascending
          - Descending
        description: sort direction
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Limits the number of records to return.
      - name: session_key
        in: query
        required: false
        schema:
          type: string
        description: A unique key provided by user for paging results. The same key will be returned in a successful response.
      - name: infinity_session
        in: query
        required: false
        schema:
          type: string
        description: Values for cookies related to the Infinity load balancer session.
      - name: more_rows_range_key
        in: query
        required: false
        schema:
          type: string
        description: Key for accessing cached results on subsequent calls to this data list.
      - name: start_row_index
        in: query
        required: false
        schema:
          type: integer
        description: Number of rows to skip,get result after these rows.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of result entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DesignationHierarchyListCollection'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to view the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Designations
    servers:
    - url: https://api.sky.blackbaud.com/alt-fndmg
  /designations/list:
    get:
      operationId: ListDesignations
      summary: List designations
      description: List of all designations.
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Limits the number of records to return.
      - name: session_key
        in: query
        required: false
        schema:
          type: string
        description: A unique key provided by user for paging results. The same key will be returned in a successful response.
      - name: infinity_session
        in: query
