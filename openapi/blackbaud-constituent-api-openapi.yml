    get:
      operationId: ListConstituentNotesAllConstituents
      summary: Note list (All constituents)
      description: "Returns a paginated list of notes, excluding RE NXT Summary notes.\r\n<p />\r\nThe default sorting behavior\
        \ is to list notes in ascending order based on when they were created.\r\n<p />\r\nHowever, the <code>last_modified</code>\
        \ parameter overrides the default sorting behavior to list notes in ascending order based on when they were last modified.\
        \ The <code>last_modified</code> parameter also adds the <code>sort_token</code> parameter to the <code>next_link</code>\
        \ URL to ensure that notes are stably sorted and that order persists when changes occur while working through a paginated\
        \ list.\r\n<p />\r\nIf the <code>last_modified</code> and <code>date_added</code> parameters are both specified, the\
        \ sorting behavior is to list notes based on when they were last modified.\r\n<p />"
      parameters:
      - name: date_added
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for results created on or after the specified date. Adds the sort_token parameter
          to the next_link URL to ensure that notes are stably sorted. The filter respects time offsets from UTC per the ISO-8601
          format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for results modified on or after the specified date. Adds the sort_token parameter
          to the next_link URL to ensure that notes are stably sorted. The filter respects time offsets from UTC per the ISO-8601
          format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: sort_token
        in: query
        required: false
        schema:
          type: string
        description: Represents a token filter to provide the next stable-sorted list of notes and to ensure that the order
          persists even if changes occur while working through a paginated list. The token is provided on the next_link collection
          response property when the request specifies the sort_token filter. The last_modified, date_added, and sort parameters
          also add the token to the next_link URL, although the sort parameter only adds the token when it sorts by just the
          date_added field or just the date_modified field.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to return. The default is 500. The maximum is 5000.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip. For use with pagination.
      responses:
        '200':
