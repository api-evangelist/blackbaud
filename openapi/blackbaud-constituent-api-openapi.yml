            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: '1281'
        '400':
          description: Returned when the request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to create the email address.
        '404':
          description: Returned when the specified constituent is not found.
    get:
      operationId: ListConstituentEmailAddressesAllConstituents
      summary: Email address list (All constituents)
      description: "Returns a paginated list of email addresses.\r\n<p />\r\nThe default sorting behavior is to list email\
        \ addresses in ascending order based on when they were created.\r\n<p />\r\nHowever, the <code>last_modified</code>\
        \ parameter overrides the default sorting behavior to list email addresses in ascending order based on when they were\
        \ last modified. The <code>last_modified</code> parameter also adds the <code>sort_token</code> parameter to the <code>next_link</code>\
        \ URL to ensure that email addresses are stably sorted and that order persists when changes occur while working through\
        \ a paginated list.\r\n<p />\r\nIf the <code>last_modified</code> and <code>date_added</code> parameters are both\
        \ specified, the sorting behavior is to list email addresses based on when they were last modified.\r\n<p /><b>Note:</b>\
        \ This endpoint returns data with an average latency of about 30 minutes. In addition, historic records have a default\
        \ <code>date_added</code> timestamp of 1600-01-01 00:00:00.000 +00:00. The timestamp for newer records reflects when\
        \ the records were added."
      parameters:
      - name: date_added
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for email addresses created on or after the specified date. The filter respects
          time offsets from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for email addresses modified on or after the specified date. The filter respects
          time offsets from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
        description: Set this parameter to "true" to include inactive email addresses in the response.
      - name: sort_token
        in: query
        required: false
        schema:
          type: string
        description: Represents a token filter to provide the next stable-sorted list of email addresses. This will be provided
          on the next_link collection response property when last_modified or sort_token filters are specified on the request.
      - name: constituent_id
        in: query
        required: false
        schema:
          type: array
        description: Represents a list of constituent identifiers. Returns email addresses if any of the specified constituent
          identifiers match any of the email addresses' associated constituents. For example, "constituent_id=280&amp;constituent_id=1232"
          returns email addresses with either "280" or "1232" constituent identifiers.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to return. The default is 500. The maximum is 5000.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip. For use with pagination.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a>
            of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#EmailAddress">email address</a>
            entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfEmailAddressRead'
              example:
                count: 52
                next_link: https://api.sky.blackbaud.com/constituent/v1/emailaddresses?offset=4&limit=4
                value:
                - id: '131'
                  address: JPdiresta@net.com
                  constituent_id: '185'
                  date_added: '1600-01-01T00:00:00Z'
                  date_modified: '2016-10-19T19:42:38.775Z'
                  do_not_email: false
                  inactive: false
                  primary: false
                  type: Email
                - id: '135'
                  address: adiresta@aol.net.com
                  constituent_id: '333'
                  date_added: '1600-01-01T00:00:00Z'
                  date_modified: '2016-10-19T19:42:38.775Z'
                  do_not_email: false
                  inactive: false
                  primary: false
                  type: Email
                - id: '283'
                  address: robertcarloshernandez@gmail.com
                  constituent_id: '280'
                  date_added: '1600-01-01T00:00:00Z'
                  date_modified: '2016-10-19T19:42:38.775Z'
                  do_not_email: false
                  inactive: false
                  primary: false
                  type: Email
                - id: '289'
                  address: AEA@anet.com
                  constituent_id: '188'
                  date_added: '1600-01-01T00:00:00Z'
                  date_modified: '2016-10-19T19:42:38.775Z'
                  do_not_email: false
                  inactive: false
                  primary: false
                  type: Email
        '400':
          description: Returned when the specified request parameters are not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to view the email addresses.
