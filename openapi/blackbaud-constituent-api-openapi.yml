      description: "Returns a paginated list of constituent codes.\r\n<p />\r\nThe default sorting behavior is to list constituent\
        \ codes in ascending order based on when they were created.\r\n<p />\r\nHowever, the <code>last_modified</code> parameter\
        \ overrides the default sorting behavior to list constituent codes in ascending order based on when they were last\
        \ modified. The <code>last_modified</code> and <code>date_added</code> parameters also add the <code>sort_token</code>\
        \ parameter to the <code>next_link</code> URL to ensure that constituent codes are stably sorted and that order persists\
        \ when changes occur while working through a paginated list.\r\n<p />\r\nIf the <code>last_modified</code> and <code>date_added</code>\
        \ parameters are both specified, the sorting behavior is to list constituent codes based on when they were last modified.\r\
        \n<p /><b>Note:</b> This endpoint returns data with an average latency of about 30 minutes. In addition, historic\
        \ records have a default <code>date_added</code> timestamp of 1600-01-01 00:00:00.000 +00:00. The timestamp for newer\
        \ records reflects when the records were added."
      parameters:
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
        description: Set this parameter to "true" to include inactive constituent codes in the response.
      - name: date_added
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for constituent codes created on or after the specified date. The filter respects
          time offsets from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for constituent codes modified on or after the specified date. The filter respects
          time offsets from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: sort_token
        in: query
        required: false
        schema:
          type: string
        description: Represents a token filter to provide the next stable-sorted list of constituent codes. This will be provided
          on the next_link collection response property when last_modified or sort_token filters are specified on the request.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to return. The default is 500. The maximum is 5000.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip. For use with pagination.
