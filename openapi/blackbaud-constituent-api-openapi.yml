  /constituents/{constituent_id}/communicationpreferences:
    get:
      operationId: ListConstituentCommunicationPreferencesSingleConstituent
      summary: Communication preference list (Single constituent)
      description: Returns a list of communication preferences for a constituent. This endpoint will be deprecated in a future
        version of the Constituent API. Please reference the equivalent endpoint, <a href="https://developer.sky.blackbaud.com/docs/services/communication-preference/operations/ListConstituentSolicitCodesSingleConstituent">Constituent
        solicit code list (Single constituent)</a>, in the Communication Preference API instead.
      parameters:
      - name: constituent_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the constituent to retrieve the communication preferences for.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to return. The default is 500. The maximum is 5000.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip. For use with pagination.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a>
            of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#CommunicationPreference">communication
            preference</a> entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfCommunicationPreferenceRead'
              example:
                count: 3
                value:
                - id: '72'
                  constituent_id: '280'
                  end: '2001-02-23T00:00:00Z'
                  solicit_code: Do not call me after 4pm on wednesdays.
                  start: '1996-01-22T00:00:00Z'
                - id: '73'
                  constituent_id: '280'
                  end: '2006-02-13T00:00:00Z'
                  solicit_code: Only call me on the 4th of the month, if it is Thursday.
                  start: '2005-04-22T00:00:00Z'
                - id: '74'
                  constituent_id: '280'
                  end: '2011-04-03T00:00:00Z'
                  solicit_code: Send me newsletter through email, post, and fax.
                  start: '1993-02-22T00:00:00Z'
        '400':
          description: Returned when the specified constituent ID in the request URL or the specified request parameters are
            not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to view the communication preferences.
        '404':
          description: Returned when the specified constituent is not found.
