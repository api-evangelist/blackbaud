  /constituents/search:
    get:
      operationId: SearchConstituent
      summary: Constituent (Search)
      description: "Performs a constituent search based on the provided search text. Supports first name, last name, preferred\
        \ name, former name, alias, email address, phone number, address, or lookup ID. Name combinations, such as first name\
        \ and last name or preferred name and last name, are valid, but otherwise search only supports one parameter at a\
        \ time.\r\n<p />\r\nBy default, searches include results that sound similar to your criteria. For example, searches\
        \ for \"Smith\" include matches for \"Smyth\" and other alternative spellings. \r\n<p />\r\nSearching by phone number\
        \ requires a minimum of 7 digits with no spaces or special characters. This search does not support wildcard characters\
        \ — such as * or ? — used to search in the database view. \r\n<p />\r\nIf searching on a lookup id, the <code>search_field</code>\
        \ property should be set to 'lookup_id'. This will allow the search results to be returned quicker.\r\n<p />\r\nIf\
        \ searching on an email address, the <code>search_field</code> property should be set to 'email_address'. This will\
        \ allow the search results to be returned quicker. By default, the results include non-constituents.\r\n<p />\r\n\
        Search results are limited to 500 records."
      parameters:
      - name: search_text
        in: query
        required: true
        schema:
          type: string
        description: The text to search for. If the search_text is a lookup_id, set the search_field to "lookup_id". If the
          search_text is an email address, set the search_field to "email_address".
      - name: fundraiser_status
        in: query
        required: false
        schema:
          type: array
        description: Represents a comma-separated list of fundraiser statuses. Returns constituents if any of the specified
          fundraiser statuses match the constituent's fundraiser status. For example, "fundraiser_status=Active,None" returns
          constituents whose fundraiser status that matches Active or None.  Valid values for this filter are Active, Inactive,
          and None.
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
        description: Set this parameter to "true" to include inactive constituents in the response.
      - name: search_field
        in: query
        required: false
        schema:
          type: string
          enum:
          - lookup_id
          - email_address
        description: "Represents a field to search on. Currently, it supports lookup_id and email_address. Set search_field\
          \ to lookup_id or email_address and then set search_text to the lookup_id or email_address to find.\r\nBy default,\
          \ setting the search_field to email_address will return both constituent and non-constituent records with email\
          \ addresses that match the search_text. Set include_non_constituents to \"false\" to exclude non-constituent records\
          \ from the results."
      - name: strict_search
        in: query
        required: false
        schema:
          type: boolean
        description: Set this parameter to "true" to exclude constituents whose names sound like the search text but are spelled
          differently.
      - name: include_non_constituents
        in: query
        required: false
        schema:
          type: boolean
        description: Set this parameter to "true" to include non-constituents in the search results.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to return. The default is 500. The maximum is 5000.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip. For use with pagination.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a>
            of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#SearchResult">search result</a>
            entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfSearchResultRead'
              example:
                count: 3
                next_link: https://api.sky.blackbaud.com/constituent/v1/constituents/search?limit=3&offset=3&search_text=rob
                value:
                - id: '495'
                  address: "111 Berry Road\r\nGreenville, SC  29608"
                  email: dryang@outlook.com
                  fundraiser_status: Active
                  lookup_id: '228'
                  name: Allison D. Goodson
                - id: '864'
                  address: ''
                  fundraiser_status: Inactive
                  lookup_id: '336'
                  name: Rob Kalghn
                - id: '280'
                  address: "410 17th Street\r\nDenver, CO  80202-4402"
                  email: robertcarloshernandez@gmail.com
                  fundraiser_status: None
                  lookup_id: '96'
                  name: Robert C. Hernandez
