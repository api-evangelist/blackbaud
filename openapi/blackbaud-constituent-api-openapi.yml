        '403':
          description: Returned when the user does not have permission to create the relationship.
        '404':
          description: Returned when the specified constituent is not found.
    get:
      operationId: ListConstituentRelationshipsAllConstituents
      summary: Relationship list (All constituents)
      description: "Returns a paginated list of relationships.\r\n<p />\r\nThe default sorting behavior is to list relationships\
        \ in ascending order based on when they were created.\r\n<p />\r\nHowever, the <code>last_modified</code> parameter\
        \ overrides the default sorting behavior to list relationships in ascending order based on when they were last modified.\
        \ The <code>last_modified</code> parameter also adds the <code>sort_token</code> parameter to the <code>next_link</code>\
        \ URL to ensure that relationships are stably sorted and that order persists when changes occur while working through\
        \ a paginated list.\r\n<p />\r\nIf the <code>last_modified</code> and <code>date_added</code> parameters are both\
        \ specified, the sorting behavior is to list relationships based on when they were last modified.\r\n<p />"
      parameters:
      - name: date_added
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for results created on or after the specified date. Adds the sort_token parameter
          to the next_link URL to ensure that relationships are stably sorted. The filter respects time offsets from UTC per
          the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for results modified on or after the specified date. Adds the sort_token parameter
          to the next_link URL to ensure that relationships are stably sorted. The filter respects time offsets from UTC per
          the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: sort_token
        in: query
        required: false
        schema:
          type: string
        description: Represents a token filter to provide the next stable-sorted list of relationships and to ensure that
          the order persists even if changes occur while working through a paginated list. The token is provided on the next_link
          collection response property when the request specifies the sort_token filter. The last_modified, date_added, and
          sort parameters also add the token to the next_link URL, although the sort parameter only adds the token when it
          sorts by just the date_added field or just the date_modified field.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to return. The default is 500. The maximum is 5000.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip. For use with pagination.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a>
            of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Relationship">relationship</a>
            entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfRelationshipRead'
              example:
                count: 243
                next_link: https://api.sky.blackbaud.com/constituent/v1/relationships?offset=3&limit=3
                value:
                - id: '127'
                  constituent_id: '280'
                  date_added: '1999-08-26T13:35:58.547Z'
                  date_modified: '2017-08-04T12:06:31.813Z'
                  is_organization_contact: false
                  is_primary_business: false
                  is_spouse: true
                  is_spouse_head_of_household: false
                  is_constituent_head_of_household: true
                  name: Wendy Hernandez
                  reciprocal_relationship_id: '43'
                  reciprocal_type: Husband
                  relation_id: '410'
                  start:
                    d: 9
                    m: 6
                    y: 1990
                  type: Wife
                  first_name: Wendy
                  last_name: Hernandez
                - id: '112'
                  constituent_id: '142'
                  date_added: '1999-08-23T13:12:30.613Z'
                  date_modified: '2004-10-08T21:22:00.613Z'
                  is_organization_contact: false
                  is_primary_business: true
                  is_spouse: false
                  is_spouse_head_of_household: false
                  is_constituent_head_of_household: false
                  name: Davis & Johnson Pharmaceuticals
                  position: CEO
                  reciprocal_relationship_id: '73'
                  reciprocal_type: Employee
                  relation_id: '362'
                  start:
                    m: 7
                    y: 1992
                  type: Employer
                - id: '168'
                  comment: Dr. Yang coaches basketball for the Y every year.
                  constituent_id: '188'
                  date_added: '2004-12-01T14:37:59.08Z'
                  date_modified: '2004-12-01T14:37:59.097Z'
                  end:
                    d: 19
                    m: 4
                    y: 2011
                  is_organization_contact: false
                  is_primary_business: false
                  is_spouse: false
                  is_spouse_head_of_household: false
                  is_constituent_head_of_household: false
                  name: YMCA
                  position: Basketball Coach
                  reciprocal_relationship_id: '94'
                  reciprocal_type: Member
                  relation_id: '461'
                  start:
                    d: 9
