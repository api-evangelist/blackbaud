        description: 'Represents a filter for phones modified on or after the specified date. The filter respects time offsets
          from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
        description: Set this parameter to "true" to include inactive phones in the response.
      - name: sort_token
        in: query
        required: false
        schema:
          type: string
        description: Represents a token filter to provide the next stable-sorted list of phones. This will be provided on
          the next_link collection response property when last_modified or sort_token filters are specified on the request.
      - name: constituent_id
        in: query
        required: false
        schema:
          type: array
        description: Represents a list of constituent identifiers. Returns phones if any of the specified constituent identifiers
          match any of the phones' associated constituents. For example, "constituent_id=280&amp;constituent_id=1232" returns
          phones with either "280" or "1232" constituent identifiers.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to return. The default is 500. The maximum is 5000.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip. For use with pagination.
      responses:
