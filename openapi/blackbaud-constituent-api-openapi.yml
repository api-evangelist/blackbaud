    get:
      operationId: ListConstituentEducationsAllConstituents
      summary: Education list (All constituents)
      description: "Returns a paginated list of education items.\r\n<p />\r\nThe default sorting behavior is to list education\
        \ items in ascending order based on when they were created.\r\n<p />\r\nHowever, the <code>last_modified</code> parameter\
        \ overrides the default sorting behavior to list education items in ascending order based on when they were last modified.\
        \ The <code>last_modified</code> parameter also adds the <code>sort_token</code> parameter to the <code>next_link</code>\
        \ URL to ensure that education items are stably sorted and that order persists when changes occur while working through\
        \ a paginated list.\r\n<p />\r\nIf the <code>last_modified</code> and <code>date_added</code> parameters are both\
        \ specified, the sorting behavior is to list education items based on when they were last modified.\r\n<p /><b>Note:</b>\
        \ This endpoint returns data with an average latency of about 30 minutes. In addition, historic records have a default\
        \ <code>date_added</code> timestamp of 1600-01-01 00:00:00.000 +00:00. The timestamp for newer records reflects when\
        \ the records were added."
      parameters:
      - name: date_added
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for education items created on or after the specified date. The filter respects
          time offsets from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for education items modified on or after the specified date. The filter respects
          time offsets from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: sort_token
        in: query
        required: false
        schema:
          type: string
        description: Represents a token filter to provide the next stable-sorted list of education items. This will be provided
          on the next_link collection response property when last_modified or sort_token filters are specified on the request.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to return. The default is 500. The maximum is 5000.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip. For use with pagination.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a>
            of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Education">education</a> entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfEducationRead'
              example:
                count: 193
                next_link: https://api.sky.blackbaud.com/constituent/v1/educations?offset=2&limit=2
                value:
                - id: '17'
                  campus: Indiana
                  class_of: '1970'
                  constituent_id: '205'
                  date_added: '1999-06-30T13:37:28Z'
                  date_entered:
                    d: 11
                    m: 5
                    y: 1965
                  date_graduated:
                    d: 11
                    m: 12
                    y: 1970
                  date_modified: '1999-07-01T15:03:24Z'
                  degree: MBA
                  primary: false
                  school: Indiana University
                  type: Graduate School
                - id: '18'
                  class_of: '1970'
                  constituent_id: '225'
                  date_added: '1999-06-30T13:37:28Z'
                  date_entered:
                    d: 20
                    m: 8
                    y: 1966
                  date_graduated:
                    d: 14
                    m: 6
                    y: 1970
                  date_modified: '2003-01-17T20:12:29.217Z'
                  degree: BS
                  majors:
                  - Biology
                  minors:
                  - Chemistry
                  primary: false
                  school: New Jersey Institute of Technology
                  type: Four Year College
        '400':
          description: Returned when the specified request parameters are not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to view the education items.
