openapi: 3.0.1
info:
  title: 'Blackbaud SKY API: Constituent'
  description: This API manages constituent information and related entities such as addresses, phones, emails, and notes.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/56b76470069a0509c8f1c5b3
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations,
      examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/constituent/v1
paths:
  /actionlocations:
    get:
      operationId: ListActionLocations
      summary: Action locations
      description: Returns a list of active action locations.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a>
            of string action locations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfString'
              example:
                count: 13
                value:
                - Prospect's Home
                - Prospect's Office
                - Starbucks
                - Arthur's Restaurant
                - Ashford Business Park
                - Board Room
                - Chamber of Commerce
                - Chicago Eye Clinic
                - Conference Room B
                - Hilton Hotel
                - Mimi's Restaurant
                - Rafferty's
                - The Country Place Restaurant
        '403':
          description: Returned when the user does not have permission to view the action locations.
  /actions:
    post:
      operationId: CreateAction
      summary: Action (Create)
      description: Creates a constituent action.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionAdd'
            example:
              author: John Doe
              category: Meeting
              completed: true
              completed_date: '2015-08-26T00:00:00Z'
              constituent_id: '280'
              date: '2015-08-26T00:00:00Z'
              description: Had dinner with Dr. Hernandez at Rafferty's
              direction: Outbound
              end_time: '21:30'
              fundraisers:
              - '252'
              location: Rafferty's
              opportunity_id: '23'
              outcome: Successful
              priority: Normal
              start_time: '18:30'
              status: Closed
              summary: Sushi dinner celebration
              type: Dinner Meeting
        description: An object that represents the action to create.
      responses:
        '200':
          description: Returned when the operation successfully creates an action. The response body contains the ID of the
            new action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: '1281'
        '400':
          description: Returned when the request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to create the action.
        '404':
          description: Returned when the specified constituent is not found.
    get:
      operationId: ListActionsAllConstituents
      summary: Action list (All constituents)
      description: "Returns a paginated list of actions.\r\n<p />\r\nThe default sorting behavior is to list actions in ascending\
        \ order based on when they were created.\r\n<p />\r\nHowever, the <code>last_modified</code> parameter overrides the\
        \ default sorting behavior to list actions in ascending order based on when they were last modified. The <code>last_modified</code>\
        \ parameter also adds the <code>sort_token</code> parameter to the <code>next_link</code> URL to ensure that actions\
        \ are stably sorted and that order persists when changes occur while working through a paginated list.\r\n<p />\r\n\
        If the <code>last_modified</code> and <code>date_added</code> parameters are both specified, the sorting behavior\
        \ is to list actions based on when they were last modified.\r\n<p />"
      parameters:
      - name: computed_status
        in: query
        required: false
        schema:
          type: array
        description: Represents a filter for results based on the computed action status. Available values are 'Open', 'Completed',
          or 'PastDue'.  Currently, only a single value can be supplied in the filter.
      - name: date_added
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for results created on or after the specified date. Adds the sort_token parameter
          to the next_link URL to ensure that actions are stably sorted. The filter respects time offsets from UTC per the
          ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for results modified on or after the specified date. Adds the sort_token parameter
          to the next_link URL to ensure that actions are stably sorted. The filter respects time offsets from UTC per the
          ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: sort_token
        in: query
        required: false
        schema:
          type: string
        description: Represents a token filter to provide the next stable-sorted list of actions and to ensure that the order
          persists even if changes occur while working through a paginated list. The token is provided on the next_link collection
          response property when the request specifies the sort_token filter. The last_modified, date_added, and sort parameters
          also add the token to the next_link URL, although the sort parameter only adds the token when it sorts by just the
          date_added field or just the date_modified field.
      - name: status_code
        in: query
        required: false
        schema:
          type: array
        description: Represents a filter for results based on the action status. Returns actions if any of the specified status
          codes match any of their status codes. For example, "status_code=Closed&amp;status_code=Pending" returns actions
          with a status of either "Closed" or "Pending".
      - name: list_id
        in: query
        required: false
        schema:
          type: string
        description: Defines a list identifier used to filter the set of actions to those included in the specified list.
          If this value is set, other specified filters will be ignored.
      - name: continuation_token
        in: query
        required: false
        schema:
          type: string
        description: Defines a continuation token for the current result set that should be used when fetching the next page
          of results from list platform.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip. For use with pagination. Deprecated for environments with access
          to new Action lists.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to return. The default is 500. The maximum is 5000.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a>
            of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Action">action</a> entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfActionRead'
              example:
                count: 878
                next_link: https://api.sky.blackbaud.com/constituent/v1/actions?offset=3&limit=3
                value:
                - id: '1'
                  category: Meeting
                  completed: false
                  computed_status: PastDue
                  constituent_id: '185'
                  date: '2008-10-10T00:00:00Z'
                  date_added: '1999-06-17T19:34:16Z'
                  date_modified: '2008-01-23T16:30:17.707Z'
                  description: Reservations at Rafferty's.  Will review agenda for Capital Campaign.
                  direction: Outbound
                  end_time: '21:30'
                  location: Rafferty's
                  outcome: Successful
                  priority: Normal
                  start_time: '18:30'
                  status: Past due
                  status_code: Pending
                  summary: Reservations at Rafferty's.  Will review agenda for Capital Campaign.
                  type: Lunch Meeting
                - id: '2'
                  category: Task/Other
                  completed: false
                  computed_status: PastDue
                  constituent_id: '191'
                  date: '2010-01-01T00:00:00Z'
                  date_added: '1999-06-25T19:40:22Z'
                  date_modified: '2008-02-07T13:50:06.067Z'
                  description: Send Birthday Card annually the first week in January.
                  direction: Outbound
                  end_time: '16:00'
                  location: Hilton Hotel
                  outcome: Successful
                  priority: Normal
                  start_time: '12:00'
                  status: Past due
                  status_code: Pending
                  summary: Send Birthday Card annually the first week in January.
                  type: Birthday
                - id: '3'
                  category: Meeting
                  completed: true
                  completed_date: '2003-07-10T00:00:00Z'
                  computed_status: Completed
                  constituent_id: '265'
                  date: '2003-07-10T00:00:00Z'
                  date_added: '1999-06-28T18:18:25Z'
                  date_modified: '2004-02-27T18:18:50.257Z'
                  description: Discuss possible appointment to the Board of Directors for the 2003 term.
                  direction: Outbound
                  end_time: '14:00'
                  location: Arthur's Restaurant
                  outcome: Successful
                  priority: Normal
                  start_time: '12:00'
                  status: Completed
                  status_code: Closed
                  summary: Discuss possible appointment to the Board of Directors for the 2003 term.
                  type: Lunch Meeting
        '400':
          description: Returned when the specified request parameters are not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to view the actions.
  /actions/attachments:
    post:
      operationId: CreateActionAttachment
      summary: Action attachment (Create)
      description: Creates an action attachment.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentAdd'
            example:
              date: '2017-07-21T04:00:00Z'
              name: Lunch Menu
              parent_id: '412'
              tags:
              - Lunch
              type: Link
              url: http://www.example.com/lunchmeeting/menu
        description: An object that represents the attachment to create.
      responses:
        '200':
          description: Returned when the operation successfully creates an attachment. The response body contains the ID of
            the new attachment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: '1281'
        '400':
          description: Returned when the request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to create the attachment.
        '404':
          description: Returned when the specified action is not found.
  /actions/attachments/{attachment_id}:
    delete:
      operationId: DeleteActionAttachment
      summary: Action attachment (Delete)
      description: Deletes an action attachment.
      parameters:
      - name: attachment_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the attachment to delete.
      responses:
        '200':
          description: Returned when the operation successfully deletes the attachment.
        '400':
          description: Returned when the specified attachment ID in the request URL is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to delete the attachment.
    patch:
      operationId: EditActionAttachment
      summary: Action attachment (Edit)
      description: Edits an action attachment.
      parameters:
      - name: attachment_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the attachment to edit.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentEdit'
            example:
              date: '2015-01-25T04:00:00Z'
              tags:
              - Gluten Free
              - Lunch
              url: www.example.com/updatedLunchMenu
        description: An object that represents the properties of the attachment to edit.
      responses:
        '200':
          description: Returned when the operation successfully edits the attachment.
        '400':
          description: Returned when the specified attachment ID in the request URL or the specified request parameters are
            not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to edit the attachment.
        '404':
          description: Returned when the specified attachment is not found.
  /actions/customfields:
    post:
      operationId: CreateActionCustomField
      summary: Action custom field (Create)
      description: Creates an action custom field.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomFieldAdd'
            example:
              category: Left Message?
              comment: We left a message not expecting a response
              date: '2016-07-21T00:00:00Z'
              parent_id: '1370'
              value: true
        description: An object that represents the custom field to create.
      responses:
        '200':
          description: Returned when the operation successfully creates a custom field. The response body contains the ID
            of the new custom field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: '1281'
        '400':
          description: Returned when the request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to create the custom field.
        '404':
          description: Returned when the specified action is not found.
  /actions/customfields/categories:
    get:
      operationId: ListActionCustomFieldCategories
      summary: Action custom field categories
      description: Returns a list of custom field categories. <bb-alert bb-alert-type="warning" bb-alert-closeable="false"><b>This
        endpoint is deprecated. For more detailed custom field category information, use the <a href="https://developer.sky.blackbaud.com/docs/services/56b76470069a0509c8f1c5b3/operations/ListActionCustomFieldCategoryDetails">Custom
        field category details</a> endpoint instead.</b></bb-alert>
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a>
            of string custom field categories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfString'
              example:
                count: 6
                value:
                - Attended?
                - Guest Name
                - Interest Generated?
                - Left Message?
                - Responded?
                - Talking Points
        '403':
          description: Returned when the user does not have permission to view the custom field categories.
  /actions/customfields/categories/details:
    get:
      operationId: ListActionCustomFieldCategoryDetails
      summary: Action custom field category details
      description: Returns a list of custom field category details.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a>
            of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#CustomFieldCategory">custom
            field categories</a>.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfCustomFieldCategoryRead'
              example:
                count: 8
                value:
                - name: '# of Family Members'
                  type: Number
                - name: Anniversary
                  type: Date
                - name: Interest Generated?
                  type: CodeTableEntry
                - name: Business Hours
                  type: Text
                - name: Staff Manager
                  type: ConstituentId
                - name: Attended?
                  type: Boolean
                - name: Member Since
                  type: FuzzyDate
                - name: Net Worth
                  type: Currency
        '403':
          description: Returned when the user does not have permission to view the custom field category details.
  /actions/customfields/categories/values:
    get:
      operationId: ListActionCustomFieldCategoryValues
      summary: Action custom field category values
      description: Returns a list of custom field values for code table categories.
      parameters:
      - name: category_name
        in: query
        required: false
        schema:
          type: string
        description: The name of the code table category to return values for.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a>
            of string custom field category values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfString'
              example:
                count: 3
                value:
                - 'Yes'
                - 'No'
                - At a later date
        '400':
          description: Returned when the specified request parameter is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to view the custom field category values.
  /actions/customfields/{custom_field_id}:
    delete:
      operationId: DeleteActionCustomField
      summary: Action custom field (Delete)
      description: Deletes an action custom field.
      parameters:
      - name: custom_field_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the custom field to delete.
      responses:
        '200':
          description: Returned when the operation successfully deletes the custom field.
        '400':
          description: Returned when the specified custom field ID in the request URL is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to delete the custom field.
    patch:
      operationId: EditActionCustomField
      summary: Action custom field (Edit)
      description: Edits an action custom field.
      parameters:
      - name: custom_field_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the custom field to edit.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomFieldEdit'
            example:
              comment: He requested to not be contacted
              date: '2016-07-21T00:00:00Z'
              value: false
        description: An object that represents the properties of the custom field to edit.
      responses:
        '200':
          description: Returned when the operation successfully edits the custom field.
        '400':
          description: Returned when the specified custom field ID in the request URL or the specified request parameters
            are not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to edit the custom field.
        '404':
          description: Returned when the specified custom field is not found.
  /actions/notes:
    post:
      operationId: CreateActionNote
      summary: Action note (Create)
      description: Creates an action note.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParentedNoteAdd'
            example:
              constituent_id: '280'
              date:
                d: 25
                m: 8
                y: 2015
              summary: Trivia
              text: Dr. Hernandez is an avid Trekkie who frequently quotes Captain Kirk in his lectures.
              type: Personal
        description: An object that represents the note to create.
      responses:
        '200':
          description: Returned when the operation successfully creates a note. The response body contains the ID of the new
            note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: '1281'
        '400':
          description: Returned when the request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to create the note.
        '404':
          description: Returned when the specified action is not found.
  /actions/notes/{note_id}:
    delete:
      operationId: DeleteActionNote
      summary: Action note (Delete)
      description: Deletes an action note.
      parameters:
      - name: note_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the note to delete.
      responses:
        '200':
          description: Returned when the operation successfully deletes the note.
        '400':
          description: Returned when the specified note ID in the request URL is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to delete the note.
    patch:
      operationId: EditActionNote
      summary: Action note (Edit)
      description: Edits an action note.
      parameters:
      - name: note_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the note to edit.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParentedNoteEdit'
            example:
              date:
                d: 25
                m: 8
                y: 2015
              summary: Trivia
              text: Dr. Hernandez is an avid Trekkie who frequently quotes Mister Spock in his lectures.
              type: Personal
        description: An object that represents the properties of the note to edit.
      responses:
        '200':
          description: Returned when the operation successfully edits the note.
        '400':
          description: Returned when the specified note ID in the request URL or the specified request parameters are not
            in the appropriate format.
        '403':
          description: Returned when the user does not have permission to edit the note.
        '404':
          description: Returned when the specified note is not found.
    get:
      operationId: GetActionNote
      summary: Action note (Get)
      description: Returns information about an action note.
      parameters:
      - name: note_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the note to retrieve information for.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#ParentedNote">note</a>
            entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParentedNoteRead'
              example:
                id: '14'
                parent_id: '280'
                date:
                  d: 5
                  m: 5
                  y: 2005
                summary: Chair selections for next year
                text: Possible that Dr. Hernandez may step down from the board next year to pursue additional medical research
                  activities.  Schedule lunch date to discuss options.
                type: Director's Notes
                type_id: '2'
        '400':
          description: Returned when the specified note ID in the request URL is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to view the note.
        '404':
          description: Returned when the specified note is not found.
  /actions/{action_id}:
    delete:
      operationId: DeleteAction
      summary: Action (Delete)
      description: Deletes a constituent action.
      parameters:
      - name: action_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the action to delete.
      responses:
        '200':
          description: Returned when the operation successfully deletes the action.
        '400':
          description: Returned when the specified action ID in the request URL is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to delete the action.
    patch:
      operationId: EditAction
      summary: Action (Edit)
      description: Edits a constituent action.
      parameters:
      - name: action_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the action to edit.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionEdit'
            example:
              category: Meeting
              completed: true
              completed_date: '2015-08-26T00:00:00Z'
              date: '2015-08-26T00:00:00Z'
              description: Had dinner with Dr. Hernandez at Rafferty's
              direction: Outbound
              end_time: '21:30'
              fundraisers:
              - '252'
              location: Rafferty's
              outcome: Successful
              priority: Normal
              start_time: '18:30'
              status: Closed
              summary: Sushi dinner celebration
              type: Dinner Meeting
        description: An object that represents the properties of the action to edit.
      responses:
        '200':
          description: Returned when the operation successfully edits the action.
        '400':
          description: Returned when the specified action ID in the request URL body or the specified request parameters are
            not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to edit the action.
        '404':
          description: Returned when the specified action is not found.
    get:
      operationId: GetAction
      summary: Action (Get)
      description: Returns information about an action.
      parameters:
      - name: action_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the action to retrieve information for.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Action">action</a>
            entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionRead'
              example:
                id: '410'
                category: Mailing
                completed: true
                completed_date: '2009-02-24T00:00:00Z'
                computed_status: Completed
                constituent_id: '280'
                date: '2009-02-19T00:00:00Z'
                date_added: '1999-10-26T15:45:27.463Z'
                date_modified: '2004-02-27T18:46:06.237Z'
                description: Send invitation for Dr. Hernandez to attend our board meetings.  Send schedule of meetings.
                direction: Outbound
                end_time: '13:30'
                fundraisers:
                - '252'
                location: Rafferty's
                outcome: Successful
                priority: Normal
                start_time: '12:00'
                status: Closed
                status_code: Closed
                summary: Sent invitation for Dr. Hernandez to attend our board meetings.  Sent schedule of meetings.
                type: Brochure/Invitation
        '400':
          description: Returned when the specified constituent ID in the request URL is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to view the action.
        '404':
          description: Returned when the specified action is not found.
  /actions/{action_id}/attachments:
    get:
      operationId: ListActionAttachmentsSingleAction
      summary: Action attachment list (Single action)
      description: Returns a list of attachments for an action.
      parameters:
      - name: action_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the action to retrieve attachments for.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a>
            of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Attachment">attachment</a>
            entities.
