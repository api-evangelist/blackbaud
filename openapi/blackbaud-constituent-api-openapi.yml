        description: A filter indicating whether to search for duplicate individual or organization records. This property
          defaults to <i>true</i> if no value is provided.
      - name: search_aliases
        in: query
        required: false
        schema:
          type: boolean
        description: A filter indicating whether to search by the alias specified in the last_org_name parameter. This property
          defaults to <i>false</i> if no value is provided.
      - name: search_contacts
