  /addresses:
    post:
      operationId: CreateConstituentAddress
      summary: Address (Create)
      description: Creates a constituent address.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressAdd'
            example:
              address_lines: 410 18th Street
              city: Denver
              constituent_id: '280'
              country: United States
              county: Denver
              do_not_mail: false
              end: '2025-03-26T00:00:00Z'
              postal_code: 80209-4402
              preferred: true
              seasonal_end:
                m: 8
                d: 26
              seasonal_start:
                m: 6
                d: 12
              start: '2003-03-26T00:00:00Z'
              state: CO
              type: Home
        description: An object that represents the address to create.
      responses:
        '200':
          description: Returned when the operation successfully creates an address. The response body contains the ID of the
            new address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: '1281'
        '400':
          description: Returned when the request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to create the address.
        '404':
          description: Returned when the specified constituent is not found.
    get:
      operationId: ListConstituentAddressesAllConstituents
      summary: Address list (All constituents)
      description: "Returns a paginated list of addresses.\r\n<p />\r\nThe default sorting behavior is to list addresses in\
        \ ascending order based on when they were created.\r\n<p />\r\nHowever, the <code>last_modified</code> parameter overrides\
        \ the default sorting behavior to list addresses in ascending order based on when they were last modified. The <code>last_modified</code>\
        \ and <code>date_added</code> parameters also add the <code>sort_token</code> parameter to the <code>next_link</code>\
        \ URL to ensure that addresses are stably sorted and that order persists when changes occur while working through\
        \ a paginated list.\r\n<p />\r\nIf the <code>last_modified</code> and <code>date_added</code> parameters are both\
        \ specified, the sorting behavior is to list addresses based on when they were last modified.\r\n<p /><b>Note:</b>\
        \ This endpoint returns data with an average latency of about 30 minutes."
      parameters:
      - name: date_added
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for addresses created on or after the specified date. The filter respects time offsets
          from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for addresses modified on or after the specified date. The filter respects time
          offsets from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: sort_token
        in: query
        required: false
        schema:
          type: string
        description: Represents a token filter to provide the next stable-sorted list of addresses. This will be provided
          on the next_link collection response property when last_modified or sort_token filters are specified on the request.
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
        description: Set this parameter to "true" to include inactive addresses in the response.
      - name: constituent_id
        in: query
        required: false
        schema:
          type: array
        description: Represents a list of constituent identifiers. Returns addresses if any of the specified constituent identifiers
          match any of the addresses' associated constituents. For example, "constituent_id=280&amp;constituent_id=1232" returns
          addresses with either "280" or "1232" constituent identifiers.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to return. The default is 500. The maximum is 5000.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip. For use with pagination.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a>
            of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Address">address</a> entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfAddressRead'
              example:
                count: 774
                next_link: https://api.sky.blackbaud.com/constituent/v1/addresses?offset=4&limit=4
                value:
                - id: '184'
                  address_lines: "248 Twin Lane\r\nBuilding #3299"
                  city: Birmingham
                  constituent_id: '185'
                  country: United States
                  county: Bailey
                  date_added: '1999-05-20T18:52:54Z'
                  date_modified: '2016-10-19T19:42:38.775Z'
                  do_not_mail: false
                  end: '2025-03-26T00:00:00Z'
                  inactive: false
                  postal_code: '35220'
                  preferred: true
                  seasonal_end:
                    d: 26
                    m: 8
                  seasonal_start:
                    d: 12
                    m: 6
                  start: '2003-03-26T00:00:00Z'
                  state: AL
                  type: Home
                - id: '185'
                  address_lines: 2457 Morrison Drive
                  city: Savannah
                  constituent_id: '186'
                  country: United States
                  date_added: '1999-05-20T18:52:55Z'
                  date_modified: '2016-10-19T19:42:38.775Z'
                  do_not_mail: false
