        event_id:
          type: string
          description: The event.
        volunteers_needed:
          type: integer
          description: The volunteers needed.
          format: int32
        comments:
          type: string
          description: The comment.
        site_id:
          type: string
          description: The site.
        site_required:
          type: boolean
          description: Indicates whether site required. Read-only in the SOAP API.
        base_currency_id:
          type: string
