openapi: 3.2.0
info:
  title: Blackbaud Occurrences API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Occurrences across 2 of this provider''s published API definitions: blackbaud-altru-volunteer-api-openapi.yml, blackbaud-crm-volunteer-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/alt-volmg
- url: https://api.sky.blackbaud.com/crm-volmg
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Occurrences
paths:
  /occurrences:
    post:
      operationId: CreateJobOccurrence
      summary: Create a job occurrence
      description: Adds an occurrence of a job.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewJobOccurrence'
            example:
              job_id: 8ced83ec-a61b-4df1-aa26-4ddf76b5defb
              description: Health Awareness
              department_code_id: 8ced83ec-a61b-4df1-aa26-4ddf76b5defb
              location_code_id: a4975cdb-3761-4a3c-b78f-968caa5a6321
              type_code: One Time
              start_date: '2016-02-18T12:00:00Z'
              end_date: '2017-06-12T12:00:00Z'
              start_month_day:
                month: 11
                day: 5
              end_month_day:
                month: 11
                day: 6
              one_start_time:
                hour: 8
                minute: 20
              one_end_time:
                hour: 9
                minute: 16
              rec_start_time:
                hour: 8
                minute: 10
              rec_end_time:
                hour: 10
                minute: 18
              day_of_week: Monday
              event_id: bbf8a260-eed7-4cda-ac02-ec1dae73ca79
              volunteers_needed: 5
              comments: ''
              site_id: a01bd875-b0a6-4455-8b69-a8ceae176e3d
              site_required: false
              base_currency_id: 03d475fd-2527-477f-bfa6-5099ad36345f
              estimated_value: 0
              recurrence_start_date: '2022-12-15T12:00:00Z'
              recurrence_end_date: '2026-12-25T12:00:00Z'
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully creates the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Occurrences
    servers:
    - url: https://api.sky.blackbaud.com/alt-volmg
  /occurrences/search:
    get:
      operationId: SearchJobOccurrences
      summary: Search for job occurrences
      description: This search is for finding job occurrences.
      parameters:
      - name: description
        in: query
        required: false
        schema:
          type: string
        description: occurrence name
      - name: job_name
        in: query
        required: false
        schema:
          type: string
        description: job name
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
        description: include inactive
      - name: location
        in: query
        required: false
        schema:
          type: string
        description: location This code table can be queried at https://api.sky.blackbaud.com/alt-adnmg/codetables/VOLUNTEERLOCATIONCODE/entries
      - name: department
        in: query
        required: false
        schema:
          type: string
        description: department This code table can be queried at https://api.sky.blackbaud.com/alt-adnmg/codetables/DEPARTMENTCODE/entries
      - name: event_id
        in: query
        required: false
        schema:
          type: string
        description: event
      - name: exclude_volunteer_id
        in: query
        required: false
        schema:
          type: string
        description: exclude volunteer id
      - name: exclude_job_assignment_date
        in: query
        required: false
        schema:
          type: string
        description: Format - date (as full-date in RFC3339). exclude job assignment date
      - name: site_id
        in: query
        required: false
        schema:
          type: string
        description: site
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Limits the number of records to return.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of result entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOccurrenceSearchCollection'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to view the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Occurrences
    servers:
    - url: https://api.sky.blackbaud.com/alt-volmg
  /occurrences/{job_occurrence_id}:
    delete:
      operationId: DeleteJobOccurrence
      summary: Delete a job occurrence
      description: Delete an occurrence of a job.
      parameters:
      - name: job_occurrence_id
        in: path
        required: true
        schema:
          type: string
        description: The job occurrence id
      responses:
        '200':
          description: Returned when the operation successfully deletes the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to delete the resource.
      tags:
      - Occurrences
    patch:
      operationId: EditJobOccurrence
      summary: Edit a job occurrence
      description: Edits an occurrence of a job.
      parameters:
      - name: job_occurrence_id
        in: path
        required: true
        schema:
          type: string
        description: The job occurrence id.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditJobOccurrence'
            example:
              description: Health Awareness
              type: One Time
              start_date: '2016-02-18T12:00:00Z'
              end_date: '2017-06-12T12:00:00Z'
              start_month_day:
                month: 11
                day: 5
              end_month_day:
                month: 11
                day: 6
              one_start_time:
                hour: 8
                minute: 20
              one_end_time:
                hour: 9
                minute: 16
              rec_start_time:
                hour: 8
                minute: 10
              rec_end_time:
                hour: 10
                minute: 18
              day_of_week: Monday
              event_id: bbf8a260-eed7-4cda-ac02-ec1dae73ca79
              volunteers_needed: 5
              comments: ''
              site_id: a01bd875-b0a6-4455-8b69-a8ceae176e3d
              site_required: false
              base_currency_id: 03d475fd-2527-477f-bfa6-5099ad36345f
              estimated_value: 0
              recurrence_start_date: '2022-12-15T12:00:00Z'
              recurrence_end_date: '2026-12-25T12:00:00Z'
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully edits the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to edit the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Occurrences
    get:
      operationId: GetJobOccurrence
      summary: Get a job occurrence
      description: Edits an occurrence of a job.
      parameters:
      - name: job_occurrence_id
        in: path
        required: true
        schema:
          type: string
        description: The job occurrence id.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOccurrence'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to get the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Occurrences
    servers:
    - url: https://api.sky.blackbaud.com/alt-volmg
  /occurrences/{job_occurrence_id}/view:
    get:
      operationId: ViewJobOccurrence
      summary: View a job occurrence
      description: Shows basic inoperationation about a job occurrence
      parameters:
      - name: job_occurrence_id
        in: path
        required: true
        schema:
          type: string
        description: The job occurrence id.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobOccurrenceView'
      tags:
      - Occurrences
    servers:
    - url: https://api.sky.blackbaud.com/alt-volmg
