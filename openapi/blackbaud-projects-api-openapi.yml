        '404':
          description: Returned when no attachment is found with the specified ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Projects
  /projects/{project_id}/contacts:
    post:
      operationId: CreateProjectContact
      summary: Project Contact (Create)
      description: Returns the identifier for the newly created contact.
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
        description: The project to which to add this contact.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContactAddress'
            example:
              description: New Address
              country: United States
              city: Charleston
              county: Charleston
              state: SC
              address_line: 123 Fake Street
              postal: '29492'
              title: Mr
              first_name: Mike
              middle_name: Robert
              last_name: G.
              suffix: Sr
              position: CEO
              organization: The Big Business
              address_contact_methods:
              - contact_type: Business
                contact_info: 843-867-5309
        description: The contact and address information to add.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the identifier for the new contact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedResult_Int32'
              example:
                record_id: 843
        '400':
          description: Returned when the request is not in the correct format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Invalid Request
                Details:
                - The value 'fake' is not valid for transaction_status.
                ErrorPath: null
        '403':
          description: Returned when the user does not have permission to create a project contact.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
        '404':
          description: Returned when the specified project could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Projects
  /projects/{project_id}/notes:
    post:
      operationId: CreateProjectNote
      summary: Project note (Create)
      description: Adds a note to a project. Returns the created identifier of the note.
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
        description: The identifier for the project to add the note to.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNoteAction'
            example:
              note_type: Note
              date: '2018-06-27T20:26:06.167Z'
              content: This is a note
              description: Note description
              type: Other
              is_complete: true
              assign_to: Benton
              completed_date: '2018-06-27T20:26:06.167Z'
        description: The note we are adding to this project.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains a collection of notes for a specified project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedResult_Int32'
              example:
                record_id: 843
        '403':
          description: Returned when the user does not have permission to add notes to projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
