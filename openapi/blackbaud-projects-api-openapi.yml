      description: Returns the list of project divisions.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the list of project divisions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableValueList_ProjectDivision'
              example:
                count: 3
                values:
                - id: 1565
                  description: Financial Aid
                  value: Financial Aid
                - id: 1941
                  description: Children & Family Services
                  value: Children & Family Services
                - id: 1943
                  description: Micro Credit
                  value: Micro Credit
      tags:
      - Projects
  /projects/locations:
    get:
      operationId: ListProjectLocations
      summary: Project location (List)
      description: Returns the list of project locations.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the list of project locations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableValueList_ProjectLocation'
              example:
                count: 2
                values:
                - id: 1840
                  description: Turkey
                  value: Turkey
                - id: 1841
                  description: Pakistan
                  value: Pakistan
      tags:
      - Projects
  /projects/statuses:
    get:
      operationId: ListProjectStatuses
      summary: Project status (List)
      description: Returns the list of project statuses.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the list of project statuses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableValueList_ProjectStatus'
              example:
                count: 2
                values:
