openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: General Ledger Projects API'
  description: This API is used to manage the general ledger, including accounts, projects, and journal entries. This API has a maximum request size limit of 8mb.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/56eb17a0a9db9516c46bff6f
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/generalledger/v1
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Projects
paths:
  /projects:
    post:
      operationId: CreateProject
      summary: Project (Create)
      description: Returns the identifier for the newly created project.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProject'
            example:
              ui_project_id: '2200'
              description: New Project
              status: Fundraising
              type: Administrative
              start_date: '2018-05-18T00:00:00Z'
              end_date: '2018-12-18T00:00:00Z'
              prevent_data_entry: true
              prevent_posting_after: true
              posting_date: '2018-05-18T00:00:00Z'
              location: Campus
              division: Division
              department: 01 - Administration
              account_restrictions:
                allow_or_restrict: Restrict
                criteria: Range
                account_range_from_account_number: 01-1000-00
                account_range_to_account_number: 01-5000-00
              contacts:
              - description: New Contact
                country: United States
                city: Charleston
                county: Charleston
                state: SC
                address_line: 123 Fake Street
                postal: '29492'
                title: Mr
                first_name: Mike
                middle_name: Robert
                last_name: G.
                suffix: Sr
                position: CEO
                organization: The Big Project
                address_contact_methods:
                - contact_type: Business
                  contact_info: 843-867-5309
              custom_fields:
              - field_name: Endowment Manager
                value: Jack Stephens
                comments: new comment
                date: '2018-05-18T00:00:00Z'
        description: The project to create.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the identifier for the newly created project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedResult_Int32'
              example:
                record_id: 843
        '400':
          description: Returned when the request is not in the correct format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Invalid Request
                Details:
                - The value 'fake' is not valid for transaction_status.
                ErrorPath: null
        '403':
          description: Returned when the user does not have permission to view projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Projects
    get:
      operationId: SearchProjects
      summary: Project (Search)
      description: Returns the projects matching the search.
      parameters:
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: 'Represents the number of records to skip.

          For use with pagination.'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: "Represents the number of records to return. \nThe default is 100. \nThe maximum allowed value is 5000."
      - name: search_text
        in: query
        required: false
        schema:
          type: string
        description: Text to match. Can match ui_project_id or description. A blank search will match all projects.
      - name: from_project
        in: query
        required: false
        schema:
          type: string
        description: Search by From ui project Id. A blank search will match all projects.
      - name: to_project
        in: query
        required: false
        schema:
          type: string
        description: Search by To ui project Id. A blank search will match all projects.
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: Returns modified records based on or after a specified date.
      - name: division
        in: query
        required: false
        schema:
          type: string
        description: Text to match. Can match project division. A blank search will match all divisions.
      - name: department
        in: query
        required: false
        schema:
          type: string
        description: Text to match. Can match project department. A blank search will match all departments.
      - name: location
        in: query
        required: false
        schema:
          type: string
        description: Text to match. Can match project location. A blank search will match all locations.
      - name: type
        in: query
        required: false
        schema:
          type: string
        description: Text to match. Can match project type. A blank search will match all types.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the projects matching the search.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection_ProjectSummary'
              example:
                count: 69
                value:
                - project_id: 1
                  description: Rogers Endowment
                  ui_project_id: '1008'
                  start_date: '1999-10-01T00:00:00Z'
                  end_date: '2000-12-31T00:00:00Z'
                  location: Administration Building
                  division: Services
                  department: 01 - Administration
                  type: Endowment
                  status: In Progress
                  prevent_data_entry: false
                  prevent_posting_after: false
                  posting_date: '2020-06-30T00:00:00Z'
                  account_restrictions:
                    allow_or_restrict: Allow
                    criteria: Range
                  contacts:
                  - contact_id: 1
                    description: ''
                    country: United States
                    city: Chicago
                    county: ''
                    state: IL
                    address_line: 154 Oakdale Drive
                    postal: '87635'
                    title: Mr
                    first_name: John
                    middle_name: M.
                    last_name: Rogers
                    suffix: Sr
                    position: Manager
                    address_contact_methods:
                    - contact_method_id: 1
                      contact_type: Business
                      contact_info: (876) 987-6354
                  custom_fields: []
                  date_added: '2002-01-08T00:00:00Z'
                  date_modified: '2002-02-18T04:59:11Z'
                  added_by: Supervisor
                  modified_by: Data Entry
                - project_id: 2
                  description: Smith Endowment
                  ui_project_id: '1009'
                  start_date: '1999-09-01T00:00:00Z'
                  end_date: '2012-09-01T00:00:00Z'
                  location: Finance Offices
                  division: Administrative
                  department: 01 - Administration
                  type: Endowment
                  status: In Progress
                  prevent_data_entry: false
                  prevent_posting_after: false
                  posting_date: '2020-06-30T00:00:00Z'
                  account_restrictions:
                    allow_or_restrict: Allow
                    criteria: Range
                  contacts:
                  - contact_id: 2
                    description: ''
                    country: '1'
                    city: Chicago
                    county: ''
                    state: IL
                    address_line: 157 Oakdale Drive
                    postal: '87635'
                    title: Mrs
                    first_name: Sally
                    middle_name: Hank
                    last_name: Smith
                    suffix: Sr
                    position: Sales
                    address_contact_methods:
                    - contact_method_id: 2
                      contact_type: Business
                      contact_info: (876) 987-6354
                  custom_fields:
                  - custom_field_id: 63
                    field_name: AcademicWorks Project
                    value: '-1'
                    comments: Custom Field Comment
                    type: Boolean
                    date: '1999-01-01T00:00:00Z'
                  date_added: '2002-01-08T00:00:00Z'
                  date_modified: '2018-03-13T11:55:55.16Z'
                  added_by: Supervisor
                  modified_by: Alania Carter
        '403':
          description: Returned when the user does not have permission to view projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Projects
  /projects/attachments:
    post:
      operationId: CreateProjectAttachment
      summary: Project attachment (Create)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAttachment'
            example:
              parent_id: 1
              name: Attachment Name
              url: https://www.google.com
              type: Link
              media_type: Manual
          multipart/form-data: {}
        description: The attachment to create.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the file id of the saved attachment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedResult_Int32'
              example:
                record_id: 843
        '400':
          description: Returned when the request is not in the correct format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Invalid Request
                Details:
                - The value 'fake' is not valid for transaction_status.
                ErrorPath: null
        '403':
          description: Returned when the user does not have permission to add attachments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
        '404':
          description: Returned when no project is found with the specified ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Projects
  /projects/customfields:
    get:
      operationId: ListProjectCustomFields
      summary: Project custom field (List)
      description: Returns a list of custom field options.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the list of custom fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponse_CustomFieldOptions'
              example:
                count: 3
                results:
                - custom_field_id: 2
                  name: Application Date
                  type: DateTime
                  is_required: false
                  table_values:
                  - Ashton Hall
                  - Billy Craig
                - custom_field_id: 3
                  name: Endowment Manager
                  type: Table
                  is_required: false
                  table_values:
                  - Thomas Johnson
                  - Sue White
                  - Craig Smith
                  - Bob Wilson
                  - Mary Ann Carpenter
                - custom_field_id: 7
                  name: Grant Manager
                  type: Table
                  is_required: false
                  table_values:
                  - Ron Carter
                  - Bill Jenkins
                  - Alison Eberhart
                  - David Kilmer
                  - Dr. Long
      tags:
      - Projects
  /projects/departments:
    get:
      operationId: ListProjectDepartments
      summary: Project department (List)
      description: Returns the list of project departments.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the list of project departments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableValueList_ProjectDepartment'
              example:
                count: 3
                values:
                - id: 1847
                  description: Missionary
                  value: Missionary
                - id: 1903
                  description: Supported Living
                  value: Supported Living
                - id: 1930
                  description: Athletics
                  value: Athletics
      tags:
      - Projects
  /projects/divisions:
    get:
      operationId: ListProjectDivisions
