      summary: Project attachment (Delete)
      description: Removes the project attachment.
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
        description: The identifier for the project the attachment is on.
      - name: attachment_id
        in: path
        required: true
        schema:
          type: integer
        description: The identifier of the project attachment to delete.
      responses:
        '200':
          description: Returned when the operation is successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Void'
              example: {}
        '400':
          description: Returned when the request is not in the correct format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
