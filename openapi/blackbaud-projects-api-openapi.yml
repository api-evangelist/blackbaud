                  description: In Progress
                  value: In Progress
                - id: 216
                  description: Other
                  value: Other
      tags:
      - Projects
  /projects/types:
    get:
      operationId: ListProjectTypes
      summary: Project type (List)
      description: Returns the list of project types.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the list of project types.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableValueList_ProjectType'
              example:
                count: 2
                values:
                - id: 1531
                  description: Program
                  value: Program
                - id: 221
                  description: Grant
                  value: Grant
      tags:
      - Projects
  /projects/{project_id}:
    patch:
      operationId: EditProject
      summary: Project (Edit)
      description: Edits an existing project.
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
        description: The identifier of the project to edit.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditProject'
            example:
              ui_project_id: '2200'
              description: New Project
              status: Fundraising
              type: Administrative
              start_date: '2018-05-18T00:00:00Z'
              end_date: '2018-12-18T00:00:00Z'
              prevent_data_entry: true
              prevent_posting_after: true
              posting_date: '2018-05-18T00:00:00Z'
              location: Campus
              division: Division
              department: 01 - Administration
              account_restrictions:
                allow_or_restrict: Restrict
                criteria: Selected
                selected_account_numbers:
                - 01-1000-00
              custom_fields:
              - field_name: Endowment Manager
                value: Jack Stephens
                comments: new comment
                date: '2018-05-18T00:00:00Z'
        description: The changes to apply to the project.
      responses:
        '200':
          description: Returned when the operation successfully edits the project. The response body contains the project id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedResult_Int32'
              example:
                record_id: 0
        '400':
          description: Returned when the request is not in the correct format or are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Failed to save {record}
                Details:
                - The total percent distributed must equal 100%.
                ErrorPath: null
        '403':
          description: Returned when the user does not have permission to edit projects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
        '404':
          description: Returned when no project is found with the specified ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Projects
    get:
      operationId: GetProject
      summary: Project (Get)
      description: Returns the specified project.
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
        description: The identifier for the project to retrieve.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the specificed project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
