        '404':
          description: Returned when the specified project could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Projects
  /projects/{project_id}/attachments:
    get:
      operationId: ListProjectAttachments
      summary: Project attachment (List)
      description: Returns the specified project's attachments.
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: integer
        description: The identifier for the project to retrieve the attachments for.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the specificed project's attachments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection_AttachmentSummary'
              example:
                count: 2
                value:
                - id: 25
                  name: Some PDF File
                  url: ''
                  type: Physical
                  media_type: Administration
                  date_attached: '2017-08-31T00:00:00Z'
                - id: 74
                  name: Link to google
                  url: www.google.com
                  type: Link
                  media_type: Administration
                  date_attached: '2017-08-31T00:00:00Z'
        '400':
          description: Returned when the request is not in the correct format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Invalid Request
                Details:
                - The value 'fake' is not valid for transaction_status.
                ErrorPath: null
        '403':
          description: Returned when the user does not have permission to view project attachments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
