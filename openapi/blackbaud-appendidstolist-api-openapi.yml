openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: List Appendidstolist API'
  description: This API manages lists.
  version: v1
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/list
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/list
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Appendidstolist
paths:
  /appendidstolist:
    post:
      operationId: AppendIdsToList
      summary: Append identifiers to a list
      description: Appends a set of identifiers to the filter of an existing list. The list_id parameter cannot reference a list that was created from a static query. The ids parameter is limited to 100,000 identifiers.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppendIdsToListRequest'
            example:
              list_id: c9335603-56f5-4253-a4f4-34bde8354d75
              ids:
              - '21'
              - '34'
              - '55'
              - '89'
              - '144'
              - '233'
        description: Represents a request to add ids to an existing list
      responses:
        '200':
          description: Returned when the operation succeeds.
        '400':
          description: Returned when the specified request parameters are not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to view lists.
      tags:
      - Appendidstolist
components:
  schemas:
    AppendIdsToListRequest:
      description: Represents request to create a list filtered to a set of unique record identifiers
      required:
      - list_id
      - ids
      type: object
      properties:
        list_id:
          description: The immutable system record ID for the list
          type: string
        ids:
          description: The unique identifiers for the records to be added to the list. Limited to a maximumum 100,000 identifiers.
          type: array
          items:
            type: string
      x-display-name: AppendIdsToList
      x-display-id: Appendidstolist
  securitySchemes:
    Bb-Api-Subscription-Key:
      type: apiKey
      name: Bb-Api-Subscription-Key
      in: header
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://app.blackbaud.com/oauth/authorize
          tokenUrl: https://oauth2.sky.blackbaud.com/token
          scopes: {}
