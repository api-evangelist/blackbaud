    post:
      operationId: CreateConstituentAppealResponse
      summary: Create a constituent appeal response
      description: Add a constituent appeal response to the system.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewConstituentAppealResponse'
            example:
              constituent_appeal_id: 7D2E2D1B-AEAD-4D92-9219-65E9C84E139C
              date: '2022-10-21T12:00:00Z'
              response_category: Test
              response: Do Not Email
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully creates the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Constituentappealresponses
    servers:
    - url: https://api.sky.blackbaud.com/alt-conmg
  /constituentappealresponses/{constituent_appeal_id}:
    patch:
      operationId: EditConstituentAppealResponse
      summary: Edit a constituent appeal response
      description: This operation is used to add and edit constituent appeal responses.
      parameters:
      - name: constituent_appeal_id
        in: path
        required: true
        schema:
          type: string
        description: The constituent appeal id.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditConstituentAppealResponse'
            example:
              responses:
              - date: '2018-10-21'
                response_category: Test
                response: Test
                code: Phone
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully edits the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to edit the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Constituentappealresponses
    get:
      operationId: GetConstituentAppealResponse
      summary: Get a constituent appeal response
      description: This operation is used to add and edit constituent appeal responses.
      parameters:
      - name: constituent_appeal_id
        in: path
        required: true
        schema:
          type: string
        description: The constituent appeal id.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstituentAppealResponse'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to get the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Constituentappealresponses
    servers:
    - url: https://api.sky.blackbaud.com/alt-conmg
