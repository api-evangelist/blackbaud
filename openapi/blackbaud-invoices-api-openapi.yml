components:
  schemas:
    Form1099:
      type: object
      properties:
        amount:
          type:
          - number
          - 'null'
          description: The amount distributed to 1099.
          format: decimal
        excluded_amount:
          type:
          - number
          - 'null'
          description: The amount excluded from 1099.
          format: decimal
      additionalProperties: false
      description: Response class for 1099 information.
    BoxNumberPagedResponse:
      type: object
      properties:
        count:
          type: integer
          format: int32
        results:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/BoxNumber'
      additionalProperties: false
      description: Paged Response
    DomainErrorMessage:
      type: object
      properties:
        Error:
          type:
          - string
          - 'null'
        Details:
          type:
          - array
          - 'null'
          items:
            type: string
        ErrorPath:
          type:
          - string
          - 'null'
      additionalProperties: false
    InvoiceBoxNumber:
      type: object
      properties:
        number:
          type:
          - string
          - 'null'
          description: The number for the box number.
        state:
          type:
          - string
          - 'null'
          description: The reporting state for the box number.
        amount:
          type:
          - number
          - 'null'
          description: The amount for the box number.
          format: decimal
      additionalProperties: false
      description: The contract for invoice box number.
    BulkImportDistribution:
      required:
      - account_id
      - distribution_splits
      type: object
      properties:
        distribution_id:
          type: integer
          description: The distribution identifier.
          format: int32
        amount:
          type: number
          description: The distribution amount.
          format: decimal
        description:
          type:
          - string
          - 'null'
          description: The description for this distribution.
        account_number:
          type:
          - string
          - 'null'
          description: The account number string (alternative to account_id).
        account_id:
          type: integer
          description: The account ID.
          format: int32
        type_code:
          type:
          - string
          - 'null'
          description: 'The distribution type: "Debit" or "Credit".'
        distribution_splits:
          minItems: 1
          type: array
          items:
            $ref: '#/components/schemas/BulkImportDistributionSplit'
          description: The distribution splits.
        custom_fields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/BulkImportCustomField'
          description: Custom fields for this distribution.
      additionalProperties: false
      description: A single GL distribution line for a bulk import invoice.
    BulkImportJobCreated:
      type: object
      properties:
        process_id:
          type: integer
          description: The process ID for the import job. Use this to upload batches and poll for status.
          format: int32
      additionalProperties: false
      description: Returned when a bulk invoice import job is created.
    RemitToAddressId:
      required:
      - address_id
      type: object
      properties:
        address_id:
          type: integer
          description: The address identifier.
          format: int32
      additionalProperties: false
      description: The remit to address
    CustomFieldDataType:
      title: CustomFieldDataType
      enum:
      - Text
      - Number
      - DateTime
      - Currency
      - Boolean
      - Table
      - FuzzyDate
      type: string
    RemitToAddress:
      required:
      - description
      type: object
      properties:
        address_id:
          type: integer
          description: The address identifier.
          format: int32
        description:
          minLength: 1
          type: string
          description: The description for this address.
        country:
          type:
          - string
          - 'null'
          description: The country for the address.
        city:
          type:
          - string
          - 'null'
          description: The city for the address.
        county:
          type:
          - string
          - 'null'
          description: The county for the address.
        state:
          type:
          - string
          - 'null'
          description: The state or province (or suburb in NZ) for the address.
        postal:
          type:
          - string
          - 'null'
          description: Refers to the Postal Code or ZIP of the address.
        address_line:
          type:
          - string
          - 'null'
          description: The street for this address.
        contact_name:
          type:
          - string
          - 'null'
          description: The full name of the contact for this address.
      additionalProperties: false
      description: The remit to address
    BasicErrorMessage:
      type: object
      properties:
        Error:
          type:
          - string
          - 'null'
      additionalProperties: false
