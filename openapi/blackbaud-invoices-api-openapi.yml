openapi: 3.2.0
info:
  title: Blackbaud Invoices API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Invoices across 2 of this provider''s published API definitions: blackbaud-accounts-payable-api-openapi.yml, blackbaud-receivables-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/accountspayable/v1
- url: https://api.sky.blackbaud.com/receivables
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Invoices
paths:
  /invoices:
    post:
      operationId: CreateInvoice
      summary: Invoice (Create) (Deprecated)
      description: This endpoint has been deprecated. While it remains available for existing integrations, it is no longer supported and will not receive updates or enhancements. To improve performance and reliability, this endpoint has been replaced by CreateInvoiceProcess.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvoice'
            example:
              vendor_id: 0
              purchase_order_number: '111'
              amount: 100
              description: Invoice description
              invoice_number: '8675309'
              approval_status: Pending
              due_date: '2025-12-31T12:00:00Z'
              payment_details:
                remit_to:
                  address_id: 0
                payment_method: Check
                paid_from: <<BankName>
                credit_card_account_id: 0
                credit_card_id: 0
                hold_payment: true
                create_separate_payment: true
              invoice_date: '2025-01-01T12:00:00Z'
              post_status: DoNotPost
              post_date: '2025-03-31T12:00:00Z'
              distribute_discounts: true
              distributions:
              - distribution_id: 0
                distribution_splits:
                - distribution_split_id: 0
                  ui_project_id: '9999'
                  transaction_code_values:
                  - name: TransactionCode1
                    value: None
                    id: 1
                    inactive: false
                  - name: TransactionCode2
                    value: None
                    id: 2
                    inactive: false
                  amount: 100
                  percent: 100
                  account_class: Unrestricted Net Assets
                amount: 100
                description: Distribution description
                account_number: 01-5000-00
                type_code: Debit
                custom_fields: []
              - distribution_id: 0
                distribution_splits:
                - distribution_split_id: 0
                  ui_project_id: '1100'
                  transaction_code_values:
                  - name: TransactionCode1
                    value: None
                    id: 1
                    inactive: false
                  - name: TransactionCode2
                    value: None
                    id: 2
                    inactive: false
                  amount: 100
                  percent: 100
                  account_class: Unrestricted Net Assets
                amount: 100
                description: Distribution description
                account_number: 01-2000-00
                type_code: Credit
                custom_fields: []
              custom_fields:
              - field_name: State
                value: SC - South Carolina
                comments: Custom Field Comment
                date: '2025-01-01T12:00:00Z'
              form_1099_box_numbers:
              - number: 7 -Nonemployee compensation
                state: SC
                amount: 50
              include_tax: true
              amount_before_tax: 110
              gst_tax_type_id: 2
              psb_activity_code_id: 12
              tax_amount: 10
              gst_rebate_amount: 2
              pst_rebate_amount: 4
              gst_rebate_distribution:
              - tax_entity_id: '300'
                distribution_id: 0
                distribution_splits:
                - distribution_split_id: 0
                  ui_project_id: '1100'
                  transaction_code_values:
                  - name: TransactionCode1
                    value: None
                    id: 1
                    inactive: false
                  - name: TransactionCode2
                    value: Spendable
                    id: 2
                    inactive: false
                  amount: 100
                  percent: 100
                  account_class: Unrestricted Net Assets
                amount: 100
                description: Distribution description
                account_number: 01-5000-00
                type_code: Debit
                custom_fields: []
              - tax_entity_id: '300'
                distribution_id: 0
                distribution_splits:
                - distribution_split_id: 0
                  ui_project_id: '1100'
                  transaction_code_values:
                  - name: TransactionCode1
                    value: None
                    id: 1
                    inactive: false
                  - name: TransactionCode2
                    value: Spendable
                    id: 2
                    inactive: false
                  amount: 100
                  percent: 100
                  account_class: Unrestricted Net Assets
                amount: 100
                description: Distribution description
                account_number: 01-2000-00
                type_code: Credit
                custom_fields: []
              pst_rebate_distribution:
              - tax_entity_id: '300'
                distribution_id: 0
                distribution_splits:
                - distribution_split_id: 0
                  ui_project_id: '1100'
                  transaction_code_values:
                  - name: TransactionCode1
                    value: None
                    id: 1
                    inactive: false
                  - name: TransactionCode2
                    value: Spendable
                    id: 2
                    inactive: false
                  amount: 100
                  percent: 100
                  account_class: Unrestricted Net Assets
                amount: 100
                description: Distribution description
                account_number: 01-5000-00
                type_code: Debit
                custom_fields: []
              - tax_entity_id: '300'
                distribution_id: 0
                distribution_splits:
                - distribution_split_id: 0
                  ui_project_id: '1100'
                  transaction_code_values:
                  - name: TransactionCode1
                    value: None
                    id: 1
                    inactive: false
                  - name: TransactionCode2
                    value: Spendable
                    id: 2
                    inactive: false
                  amount: 100
                  percent: 100
                  account_class: Unrestricted Net Assets
                amount: 100
                description: Distribution description
                account_number: 01-2000-00
                type_code: Credit
                custom_fields: []
              tax_distribution:
              - tax_entity_id: '300'
                distribution_id: 0
                distribution_splits:
                - distribution_split_id: 0
                  ui_project_id: '1100'
                  transaction_code_values:
                  - name: TransactionCode1
                    value: None
                    id: 1
                    inactive: false
                  - name: TransactionCode2
                    value: Spendable
                    id: 2
                    inactive: false
                  amount: 100
                  percent: 100
                  account_class: Unrestricted Net Assets
                amount: 100
                description: Distribution description
                account_number: 01-5000-00
                type_code: Debit
                custom_fields: []
              - tax_entity_id: FRE
                distribution_id: 0
                distribution_splits:
                - distribution_split_id: 0
                  ui_project_id: '1100'
                  transaction_code_values:
                  - name: TransactionCode1
                    value: None
                    id: 1
                    inactive: false
                  - name: TransactionCode2
                    value: Spendable
                    id: 2
                    inactive: false
                  amount: 100
                  percent: 100
                  account_class: Unrestricted Net Assets
                amount: 100
                description: Distribution description
                account_number: 01-2000-00
                type_code: Credit
                custom_fields: []
              gst_sales_tax_detail_list:
              - tax_entity: HST
                amount: 100
        description: The invoice to create. Note that invoices must have paired distributions where every debit distribution has a matching credit distribution of the same amount.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the ID of the created invoice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Int32CreatedResult'
              example:
                record_id: 843
        '400':
          description: Returned when the request is not in the correct format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Failed to save {record}
                Details:
                - The total percent distributed must equal 100%.
        '403':
          description: Returned when the user does not have permission to create an invoice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Invoices
    get:
      operationId: ListInvoices
      summary: Invoice (List)
      description: Returns a list of invoices fitting the given criteria.
      parameters:
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: "Represents the number of records to skip. \nFor use with pagination."
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: "Represents the number of records to return. \nThe default is 100. \nThe maximum allowed value is 500."
      - name: to_date
        in: query
        required: false
        schema:
          type: string
        description: Filter for invoices before a certain date.
      - name: from_date
        in: query
        required: false
        schema:
          type: string
        description: Filter for invoices after a certain date.
      - name: invoice_status
        in: query
        required: false
        schema:
          type: string
          enum:
          - Pending
          - Approved
          - Deleted
          - Paid
          - PartiallyPaid
        description: Filter by the status of the invoice.
      - name: vendor_name
        in: query
        required: false
        schema:
          type: string
        description: Filter by vendor name.
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: Represents a filter for results modified on or after the specified date.
      - name: date_added
        in: query
        required: false
        schema:
          type: string
        description: Represents a filter for results added on or after the specified date.
      - name: added_by
        in: query
        required: false
        schema:
          type: string
        description: Filter by added by.
      - name: last_modified_by
        in: query
        required: false
        schema:
          type: string
        description: Filter by modified by.
      - name: payment_method
        in: query
        required: false
        schema:
          type: string
          enum:
          - Check
          - EFT
          - BankDraft
          - CreditCard
        description: Filter by payment method.
      - name: post_status
        in: query
        required: false
        schema:
          type: string
          enum:
          - DoNotPost
          - NotYetPosted
          - Posted
        description: Filter by invoice post status.
      - name: search_text
        in: query
        required: false
        schema:
          type: string
        description: 'Text to match.

          Can match vendor_name, invoice_number, description, or purchase_order_number.'
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the list of invoices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceSummaryApiCollection'
              example:
                count: 114972
                value:
                - invoice_id: 115570
                  invoice_number: '1234'
                  invoice_date: '2018-06-19T12:00:00Z'
                  vendor_id: 136
                  vendor_name: Demo Vendor
                  vendor_status: Active
                  amount: 22
                  description: Demo Vendor 1
                  status: Pending
                  post_status: NotYetPosted
                  balance: 22
                  is_past_due: true
                  amount_due: 22
                  age: Current
                  date_added: '2018-06-19T09:57:05Z'
                  date_modified: '2018-06-19T09:58:07Z'
                  added_by: User5
                  modified_by: User5
                  payment_method: Check
                  purchase_order_number: '4325'
                  gst_tax_type: GST
                - invoice_id: 115571
                  invoice_number: '1234'
                  invoice_date: '2018-06-19T12:00:00Z'
                  vendor_id: 137
                  vendor_name: Rowe Cheese Company
                  vendor_status: Active
                  amount: 900
                  description: Bleu Cheese
                  status: Pending
                  post_status: NotYetPosted
                  balance: 900
                  is_past_due: true
                  amount_due: 900
                  age: Current
                  date_added: '2018-06-19T10:08:49Z'
                  date_modified: '2018-06-19T10:09:15Z'
                  added_by: User5
                  modified_by: User5
                  payment_method: Check
                  purchase_order_number: ''
                  gst_tax_type: GST
                - invoice_id: 115569
                  invoice_number: '5886'
                  invoice_date: '2018-05-11T12:00:00Z'
                  vendor_id: 132
                  vendor_name: A New Vendor For Post Test1
                  vendor_status: Active
                  amount: 1070
                  description: post not deleted
                  status: Approved
                  post_status: NotYetPosted
                  balance: 1070
                  is_past_due: true
                  amount_due: 1070
                  age: 31-60 days
                  date_added: '2018-05-11T01:00:28Z'
                  date_modified: '2018-06-01T11:20:52Z'
                  added_by: User2
                  modified_by: Doug Scott
                  payment_method: Check
                  purchase_order_number: ''
                  gst_tax_type: ''
        '400':
          description: Returned when the request is not in the correct format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Invalid Request
                Details:
                - The value 'fake' is not valid for transaction_status.
        '403':
          description: Returned when the user does not have permission to view invoices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Invoices
    servers:
    - url: https://api.sky.blackbaud.com/accountspayable/v1
  /invoices/attachments:
    post:
      operationId: CreateInvoiceAttachment
      summary: Invoice attachment (Create)
      description: 'Returns the id saved attachment.

        Physical attachments require the request to be a multipart/form-data request and are limited to 25 MB or smaller.

        Physical attachment request must provide "ParentId" and "MediaType" fields instead of "parent_id" and "media_type".'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAttachment'
            example:
              parent_id: 1
              name: Attachment Name
              url: https://www.google.com
              type: Link
              media_type: Other
          multipart/form-data:
            example:
              parent_id: 1
              name: Attachment Name
              url: https://www.google.com
              type: Link
              media_type: Other
        description: The attachment to create.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the file id of the saved attachment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Int32CreatedResult'
              example:
                record_id: 843
        '400':
          description: Returned when the request is not in the correct format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Failed to save {record}
                Details:
                - The total percent distributed must equal 100%.
        '403':
          description: Returned when the user does not have permission to add attachments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
        '404':
          description: Returned when the specified invoice could not be found, or the request size exceeds 25 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Invoices
    servers:
    - url: https://api.sky.blackbaud.com/accountspayable/v1
  /invoices/customfields:
    get:
      operationId: ListInvoiceCustomFields
      summary: Invoice custom field (List)
      description: Returns a list of custom field options.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the list of custom fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldOptionsPagedResponse'
              example:
                count: 24
                results:
                - custom_field_id: 8
                  name: Paid
                  type: Boolean
                  is_required: false
                - custom_field_id: 46
                  name: Demo Custom Field 2
                  type: Table
                  is_required: false
                  table_values:
                  - d1 - Demo 1
                  - d2 - Demo 2
                - custom_field_id: 47
                  name: Cheese Invoice Vendor Name
                  type: Table
                  is_required: false
                  table_values:
                  - MARY - Mary Rowe
                  - MARTY - Marty Rowe
                  - ANDREW - Andrew Rowe
                  - CONNOR - Connor Rowe
                - custom_field_id: 9
                  name: 'WI/Invoice #'
                  type: Number
                  is_required: false
      tags:
      - Invoices
    servers:
    - url: https://api.sky.blackbaud.com/accountspayable/v1
  /invoices/import:
    post:
      operationId: CreateInvoiceImportJob
      summary: Invoice import job (Create)
      description: 'Creates a bulk invoice import job and returns a process ID.

        Use the process ID to upload invoice batches via "Invoice import batch (Upload)" and to poll status via "Invoice import status (Get)".

        Requires the InvoiceSaveV2 entitlement. US tenants only.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBulkImportJob'
            example:
              total_invoice_count: 60000
              description: Monthly AP import — June 2026
        description: The import job parameters — total invoice count and optional description.
      responses:
        '200':
          description: Returned when the import job is created. The response body contains the process ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkImportJobCreated'
              example:
                process_id: 0
        '400':
          description: Returned when the request is not in the correct format or limits are exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Failed to save {record}
                Details:
                - The total percent distributed must equal 100%.
        '403':
          description: Returned when the user does not have permission to import invoices, or the InvoiceSaveV2 entitlement is not enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Invoices
    servers:
    - url: https://api.sky.blackbaud.com/accountspayable/v1
  /invoices/import/{process_id}:
    post:
      operationId: UploadInvoiceImportBatch
      summary: Invoice import batch (Upload)
      description: 'Uploads a batch of invoices to an existing import job and triggers async processing.

        Returns a batch process ID. Poll the job status endpoint to track overall progress.'
      parameters:
      - name: process_id
        in: path
        required: true
        schema:
          type: integer
        description: The import job process ID returned by "Invoice import job (Create)".
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadInvoiceBatch'
            example:
              invoices:
              - vendor_id: 0
                invoice_number: string
                approval_status: string
                purchase_order_number: string
                invoice_date: string
                due_date: string
                description: string
                post_status: string
                post_date: string
                amount: 0
                discount_percent: 0
                discount_amount: 0
                discount_expiration_date: string
                distribute_discounts: true
                interfund_set_id: 0
                payment_details:
                  payment_method: string
                  paid_from: string
                  hold_payment: true
                  create_separate_payment: true
                  remit_to_address_id: 0
                distributions:
                - distribution_id: 0
                  amount: 0
                  description: string
                  account_number: string
                  account_id: 0
                  type_code: string
                  distribution_splits:
                  - distribution_split_id: 0
                    project_id: string
                    transaction_code_values:
                    - name: string
                      value: string
                    amount: 0
                    percent: 0
                    account_class: string
                  custom_fields:
                  - field_name: string
                    value: string
                    date: string
                    comments: string
                custom_fields:
                - field_name: string
                  value: string
                  date: string
                  comments: string
                form_1099_box_numbers:
                - box_number: string
                  state: string
                  amount: 0
                notes:
                - type: string
                  date: string
                  description: string
                  content: string
        description: A batch of invoices to queue for async processing (up to 1,000 per batch).
      responses:
        '200':
          description: Returned when the batch is accepted. The response body contains the batch process ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkImportBatchAccepted'
              example:
                batch_process_id: 0
        '400':
          description: Returned when the batch exceeds the allowed size or the total invoice count is exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Failed to save {record}
                Details:
                - The total percent distributed must equal 100%.
        '403':
          description: Returned when the user does not have permission or the process does not belong to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
        '404':
          description: Returned when the specified import job process ID does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Invoices
    servers:
    - url: https://api.sky.blackbaud.com/accountspayable/v1
  /invoices/import/{process_id}/results:
    get:
      operationId: GetInvoiceImportResults
      summary: Invoice import results (Get)
      description: 'Returns per-invoice success/failure results for a completed bulk invoice import job.

        Each result indicates whether the invoice was created and, on failure, the error message.'
      parameters:
      - name: process_id
        in: path
        required: true
        schema:
          type: integer
        description: The import job process ID returned by "Invoice import job (Create)".
      responses:
        '200':
          description: Returned when the results are retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkImportJobResults'
              example:
                status: string
                results:
                - invoice_number: string
                  vendor_id: 0
                  success: true
                  invoice_id: 0
                  issues:
                  - severity: string
                    code: string
                    message: string
        '404':
          description: Returned when the specified import job process ID does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
        '403':
          description: Returned when the user does not have permission to view this import job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Invoices
    servers:
    - url: https://api.sky.blackbaud.com/accountspayable/v1
  /invoices/import/{process_id}/status:
    get:
      operationId: GetInvoiceImportStatus
      summary: Invoice import status (Get)
      description: 'Returns the current progress of a bulk invoice import job.

        Recommended polling interval: 5–10 seconds.

        Stop polling when status is Completed, Failed, or Cancelled, then fetch results.'
      parameters:
      - name: process_id
        in: path
        required: true
        schema:
          type: integer
        description: The import job process ID returned by "Invoice import job (Create)".
      responses:
        '200':
          description: Returned when the status is retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkImportJobStatus'
              example:
                status: string
                total_batches: 0
                completed_batches: 0
                total_invoices: 0
                success_count: 0
                failure_count: 0
                processed_count: 0
        '404':
          description: Returned when the specified import job process ID does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
        '403':
          description: Returned when the user does not have permission to view this import job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Invoices
    servers:
    - url: https://api.sky.blackbaud.com/accountspayable/v1
  /invoices/process:
    post:
      operationId: CreateInvoiceProcess
      summary: Invoice process (Create)
      description: Returns the process ID of the request to create a new invoice. Use this with the "Background process result (Get)" and "Background process status (Get)" endpoints to enhance invoice processing.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvoice'
            example:
              vendor_id: 0
              purchase_order_number: '111'
              amount: 100
              description: Invoice description
              invoice_number: '8675309'
