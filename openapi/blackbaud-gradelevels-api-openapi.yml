openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: School Gradelevels API'
  description: This API is used to provide access to school information such as users, academics, admissions, athletics, content, lists, and general school info.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/school
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/school
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Gradelevels
paths:
  /v1/gradelevels:
    get:
      operationId: v1gradelevelsget
      summary: Core grade levels
      description: 'Returns a collection of core school grade levels.


        Requires at least one of the following roles in the Education Management system:


        Academic Group Manager


        Schedule Manager


        Platform Manager


        Any Manager Role'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeLevelCollection'
              example:
                count: 2
                value:
                - id: 1
                  active: true
                  description: Ninth Grade
                  abbreviation: 09
                  name: Grade 9
                  promote_to_code: 1
                  promotion:
                    type: Next grade level
                    school_level:
                      id: 123
                      description: Upper School
                    grade_level:
                      id: 123
                      name: 10th Grade
                      abbreviation: '10'
                      active: true
                - id: 2
                  active: true
                  description: Tenth Grade
                  abbreviation: '10'
                  name: Grade 10
                  promote_to_code: 1
                  promotion:
                    type: Next grade level
                    school_level:
                      id: 123
                      description: Upper School
                    grade_level:
                      id: 123
                      name: 11th Grade
                      abbreviation: '11'
                      active: true
      tags:
      - Gradelevels
components:
  schemas:
    GradeLevelPromotion:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
          description: The type of promotion for this grade level
        school_level:
          $ref: '#/components/schemas/IdDescriptorField'
        grade_level:
          $ref: '#/components/schemas/TableValue'
      additionalProperties: false
      description: An object with information about promotion from this grade level, including promotion type and next grade level.
    GradeLevelCollection:
      type: object
      properties:
        count:
          type: integer
          description: The number of items in the collection
          format: int32
          readOnly: true
        next_link:
          type:
          - string
          - 'null'
          description: For paginated responses, the URI for the next page of results
        value:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/GradeLevel'
          description: The set of items included in the response. This may be a subset of the items in the collection
      additionalProperties: false
      description: A Collection
    IdDescriptorField:
      type: object
      properties:
        id:
          type: integer
          description: ID of the field
          format: int32
        description:
          type:
          - string
          - 'null'
          description: Description of the field
      additionalProperties: false
      description: ''
    TableValue:
      type: object
      properties:
        id:
          type: integer
          description: ''
          format: int32
        name:
          type:
          - string
          - 'null'
          description: ''
        abbreviation:
          type:
          - string
          - 'null'
          description: ''
        active:
          type: boolean
          description: ''
      additionalProperties: false
      description: ''
    GradeLevel:
      type: object
      properties:
        id:
          type:
          - integer
          - 'null'
          description: The ID of a grade level
          format: int32
        active:
          type:
          - boolean
          - 'null'
          description: Returns true if the grade level is active
        description:
          type:
          - string
          - 'null'
          description: The description of the grade level
        abbreviation:
          type:
          - string
          - 'null'
          description: The abbreviation of the grade level
        name:
          type:
          - string
          - 'null'
          description: The label used to identify a grade level
        promote_to_code:
          type:
          - integer
          - 'null'
          description: Returns integer value denoting what promotion a student receives when completing this grade, 1 = Promoted to next grade level, 2 = Graduate, 3 = No action
          format: int32
        promotion:
          $ref: '#/components/schemas/GradeLevelPromotion'
      additionalProperties: false
      description: GradeLevel Model
  securitySchemes:
    Bb-Api-Subscription-Key:
      type: apiKey
      name: Bb-Api-Subscription-Key
      in: header
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://app.blackbaud.com/oauth/authorize
          tokenUrl: https://oauth2.sky.blackbaud.com/token
          scopes: {}
