openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: Communication Preference…'
  description: This API manages constituent communication preference information and related entities such as constituent consent.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/communication-preference
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/commpref
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Constituentsolicitcodes
paths:
  /v1/constituentsolicitcodes:
    post:
      operationId: CreateConstituentSolicitCode
      summary: Constituent solicit code (Create)
      description: Creates a constituent solicit code.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConstituentSolicitCodeAdd'
            example:
              constituent_id: '280'
              end_date: '2019-04-03T04:00:00Z'
              solicit_code: Do not call on weekends
              start_date: '2011-04-03T04:00:00Z'
        description: An object that represents the constituent solicit code to create.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the ID of the new constituent solicit code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: '4343'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1ConstituentsolicitcodesPost400ApplicationJsonResponse'
              example:
              - message: The request body is not in the appropriate format.
                error_name: BadRequest
                error_code: 400
                raw_message: The request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to create a constituent solicit code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1ConstituentsolicitcodesPost403ApplicationJsonResponse'
              example:
              - message: The user does not have permission to create a record.
                error_name: Forbidden
                error_code: 403
                raw_message: The user does not have permission to create a record.
        '404':
          description: Returned when the specified constituent or solicit code cannot be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1ConstituentsolicitcodesPost404ApplicationJsonResponse'
              example:
              - message: The requested record was not found.
                error_name: NotFound
                error_code: 404
                raw_message: The requested record was not found.
      tags:
      - Constituentsolicitcodes
  /v1/constituentsolicitcodes/{constituent_solicit_code_id}:
    delete:
      operationId: DeleteConstituentSolicitCode
      summary: Constituent solicit code
      description: Deletes a constituent solicit code.
      parameters:
      - name: constituent_solicit_code_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the constituent solicit code to delete.
      responses:
        '200':
          description: Returned when the operation successfully deletes the constituent solicit code.
        '400':
          description: Returned when the specified constituent_solicit_code_id in the request URL is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Constituentsolicitcodes-constituent_solicit_code_id-Delete400ApplicationJsonResponse'
              example:
              - message: The request body is not in the appropriate format.
                error_name: BadRequest
                error_code: 400
                raw_message: The request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have rights to delete a constituent solicit code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Constituentsolicitcodes-constituent_solicit_code_id-Delete403ApplicationJsonResponse'
              example:
              - message: The user does not have permission to create a record.
                error_name: Forbidden
                error_code: 403
                raw_message: The user does not have permission to create a record.
      tags:
      - Constituentsolicitcodes
    patch:
      operationId: EditConstituentSolicitCode
      summary: Constituent solicit code (Edit)
      description: Edits a constituent solicit code.
      parameters:
      - name: constituent_solicit_code_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the constituent solicit code to edit.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V1Constituentsolicitcodes-constituent_solicit_code_id-PatchRequest'
            example:
              end_date: '2019-04-03T04:00:00Z'
              solicit_code: Do not call on weekends
              start_date: '2011-04-03T04:00:00Z'
        description: An object that represents the properties of the constituent solicit code to edit.
      responses:
        '200':
          description: Returned when the operation successfully edits the constituent solicit code.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Constituentsolicitcodes-constituent_solicit_code_id-Patch400ApplicationJsonResponse'
              example:
              - message: The request body is not in the appropriate format.
                error_name: BadRequest
                error_code: 400
                raw_message: The request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to edit a constituent solicit code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Constituentsolicitcodes-constituent_solicit_code_id-Patch403ApplicationJsonResponse'
              example:
              - message: The user does not have permission to create a record.
                error_name: Forbidden
                error_code: 403
                raw_message: The user does not have permission to create a record.
        '404':
          description: Returned when the specified constituent solicit code from the web view cannot be found or when the solicit code from the database view cannot be resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Constituentsolicitcodes-constituent_solicit_code_id-Patch404ApplicationJsonResponse'
              example:
              - message: The requested record was not found.
                error_name: NotFound
                error_code: 404
                raw_message: The requested record was not found.
      tags:
      - Constituentsolicitcodes
