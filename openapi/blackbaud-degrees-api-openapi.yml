openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: School Degrees API'
  description: This API is used to provide access to school information such as users, academics, admissions, athletics, content, lists, and general school info.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/school
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/school
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Degrees
paths:
  /v1/degrees/studentdegrees/{student_id}:
    get:
      operationId: V1DegreesStudentdegreesByStudent_idGet
      summary: Degrees student degrees by ID
      description: 'Returns a collection of degree/diplomas assigned to the student.


        Each degree/diploma has a collection of majors, minors and/or concentrations as appropriate for that degree or diploma.


        Requires the following role in the Education Management system:


        Degree Manager


        Diploma Manager


        Student


        Parent'
      parameters:
      - name: student_id
        in: path
        required: true
        schema:
          type: integer
        description: user Id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDegreeOutputModelCollection'
              example:
                count: 1
                value:
                - user_id: 12345
                  first_name: Harold
                  last_name: Ramis
                  preferred_name: Harry
                  student_degrees:
                  - id: 6789
                    declared_on: '2018-08-30T12:00:00Z'
                    completed_on: '2018-08-30T12:00:00Z'
                    conferred_on: '2018-08-30T12:00:00Z'
                    created_by: 6ca45ee4-58eb-43b3-ae30-b01db74c0e1c
                    modified_by: 6ca45ee4-58eb-43b3-ae30-b01db74c0e1c
                    created: '2018-08-30T12:00:00Z'
                    modified: '2018-08-30T12:00:00Z'
                    requirement_set:
                    - id: 98765
                      description: A liberally artistic degree
                      award_level: 5
                      type: Undergraduate
                      degree:
                        id: 0
                        name: Bachelor of Science
                        abbreviation: BS
                      cip_prefix: '11'
                      cip_suffix: '1111'
                      valid_from: '2018-08-30T12:00:00Z'
                      valid_to: '2022-08-30T12:00:00Z'
                      credit_needed: 120
                      credit_from_institution: 65
                    majors:
                    - id: 55555
                      declared_on: '2018-08-30T12:00:00Z'
                      requirement_set:
                        id: 6
                        major:
                          id: 1234
                          name: GhostBusting
                          abbreviation: GhostBusting
                        cip_prefix: '99'
                        cip_suffix: '9999'
                      concentrations:
                        id: 7
                        declared_on: '2018-08-30T12:00:00Z'
                        requirement_set:
                          concentration:
                            id: 8
                            name: Nuclear Proton Field Generation
                            abbreviation: NPFG
                    minors:
                    - id: 77777
                      declared_on: '2018-08-30T12:00:00Z'
                      requirement_set:
                        id: 45
                        minor:
                          id: 0
                          name: Quantum Field Theory
                          abbreviation: QFT
                    concentrations:
                    - id: 88888
                      declared_on: '2018-08-30T12:00:00Z'
                      requirement_set:
                        id: 60
                        concentration:
                          id: 0
                          name: Gardening
                          abbreviation: ''
      tags:
      - Degrees
