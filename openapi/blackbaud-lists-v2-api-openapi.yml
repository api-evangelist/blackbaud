openapi: 3.0.1
info:
  title: 'Blackbaud SKY API: Lists V2'
  description: This API manages lists of records
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/lst-lists
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations,
      examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/lst-lists
paths:
  /count:
    post:
      operationId: GetCount
      summary: Calculates the total count of records (PREVIEW)
      description: 'Calculates the total count of records which meet the criteria of the request


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Blackbaud.List.Service.Models.CountRequest'
            example:
              data_model_name: constituent
              filter:
                filter_items:
                - field:
                    value:
                      value:
                        start_value: 18
                        end_value: 45
                    field_id: age.age_in_years
                    operator: Between
                time_zone_offset_in_minutes: 300
        description: The request.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blackbaud.List.Service.Models.CountResult'
              example:
                count: 298223
  /datamodels:
    get:
      operationId: GetDataModels
      summary: Get data model list (PREVIEW)
      description: 'Returns the list of available data models


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: allowReportInsights
        in: query
        required: false
        schema:
          type: boolean
          default: 'true'
        description: whether or not to allow report insights
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blackbaud.List.Service.Models.DataModel.ExternalDataModelsResponse'
              example:
                data_models:
                - name: person-organization-search
                  allow_report_insights: false
                - name: contribution
                  allow_report_insights: false
  /datamodels/{modelName}:
    get:
      operationId: GetDataModel
      summary: Get a data model (PREVIEW)
      description: 'Returns information about a specific data model


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: modelName
        in: path
        required: true
        schema:
          type: string
        description: The name of the data model.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blackbaud.List.Service.Models.DataModel.ExternalDataModel'
              example:
                search_definitions:
                - name: people
                  output:
                  - field_id: lookup_id
                    display_name: Lookup Id
                  - field_id: person_surname
                    display_name: Last name
                  - field_id: person_given_name
                    display_name: First name
                  - field_id: primary_address
                    display_name: Address
                  search_fields:
                  - field_id: lookup_id
                  - field_id: person_surname
                  - field_id: person_given_name
                - name: organizations
                  output:
                  - field_id: lookup_id
                    display_name: Lookup Id
                  - field_id: organization_name
                    display_name: Name
                  search_fields:
                  - field_id: lookup_id
                  - field_id: organization_name
                  - field_id: primary_address
                fields:
                - type: String
                  is_output: false
                  is_hidden: false
                  is_sortable: false
                  fields:
                  - type: String
                    is_output: false
                    is_hidden: false
                    is_sortable: false
                    supports_group_by: false
                    supports_aggregation: false
                    filter_options:
                      custom_boolean_options:
                        option_true: 'true'
                        option_false: 'false'
                        option_all: all
                      static_values:
                      - id: lookup_id
                    is_filter: false
                    include_identifier: false
                  supports_group_by: false
                  supports_aggregation: false
                  filter_options:
                    custom_boolean_options:
                      option_true: 'true'
                      option_false: 'false'
                      option_all: all
                    static_values:
                    - id: lookup_id
                  is_filter: false
                  include_identifier: false
                default_sort:
                  sort_fields:
                  - field_id: lookup_id
                    sort_order: asc
                default_output:
                  items:
                  - field_id: lookup_id
                    aggregation_filter:
                      filter_items:
                      - field:
                          value: {}
                          field_id: lookup_id
                          operator: None
                        grouping:
                          items:
                          - field:
                              value: {}
                              field_id: lookup_id
                              operator: None
                            collection_field:
                              field_id: lookup_id
                              filter_fields:
                              - value: {}
                                field_id: lookup_id
                                operator: None
                          operator: None
                        collection_field:
                          filter_fields:
                          - value: {}
                            field_id: lookup_id
                            operator: None
                      - collection_field:
                          field_id: lookup_id
                default_filter:
                  filter_items:
                  - field:
                      value: {}
                      field_id: lookup_id
                      operator: None
                    grouping:
                      grouping_id: lookup_id
                      operator: None
                    collection_field:
                      field_id: lookup_id
                      filter_fields:
                      - value: {}
                        field_id: lookup_id
                        operator: None
                allow_report_insights: false
                enable_tabbed_list: false
  /executeadvancedaggregation:
    post:
      operationId: GetAdvancedAggregationResults
      summary: Executes an advanced aggregation request (PREVIEW)
      description: 'Executes an advanced aggregation request


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Blackbaud.List.Service.Models.AdvancedAggregationRequest'
            example:
              data_model_name: charge
              filter:
                filter_items:
                - field:
                    value:
                      value:
                        date_range_type: SpecificRange
                        start_date: '2020-05-06T04:15:00Z'
                        end_date: '2020-05-06T04:15:00Z'
                    field_id: due_date
                    operator: Equal
                time_zone_offset_in_minutes: 300
              aggregation_definition:
                aggregations:
                - aggregation_type: Sum
                  aggregation_field_id: balance
                group_by:
                - field_id: billing_item.name
                time_zone_offset_in_minutes: 300
              include_grouping_field_summary: true
        description: The aggregation by field request.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blackbaud.List.Service.Models.AdvancedAggregationResults'
              example:
                count: 2
                items:
                - aggregation_field_id: cost
                  aggregation_type: Sum
                  items:
                  - key: T-shirts
                    value: 5000
                    record_count: 0
                  - key: Key chains
                    value: 2750
                    record_count: 0
  /executeaggregation:
    post:
      operationId: GetAggregationResults
      summary: Executes an aggregation request (PREVIEW)
      description: 'Executes an aggregation operation against a data model


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Blackbaud.List.Service.Models.SimpleAggregationRequest'
            example:
              data_model_name: invoice
              aggregation_type: Sum
              field: balance
              filter:
                filter_items:
                - field:
                    value:
                      value:
                        date_range_type: SpecificRange
                        start_date: '2020-05-06T04:15:00Z'
                        end_date: '2021-05-06T04:15:00Z'
                    field_id: transaction_date
                    operator: Equal
                time_zone_offset_in_minutes: 300
        description: The aggregation request.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blackbaud.List.Service.Models.SimpleAggregationResult'
              example:
                value: 0
                count: 0
  /executequery:
    post:
      operationId: GetQueryResults
      summary: Executes a query request (PREVIEW)
      description: 'Executes a query to return a list of records


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Blackbaud.List.Service.Models.QueryExecutionRequest'
            example:
              data_model_name: list-management
              definition:
                filter:
                  filter_items:
                  - field:
                      value:
                        value:
                          start_value: 100
                          end_value: 5000
                      field_id: record_count
                      operator: Between
                  time_zone_offset_in_minutes: 300
                output:
                  items:
                  - field_id: name
                    display_name: Name
                  - field_id: description
                    display_name: Description
                  - field_id: list_type
                    display_name: List type
                sort:
                  sort_fields:
                  - field_id: date_added
                    sort_order: asc
              limit: 25
        description: The query request.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Blackbaud.List.Service.Models.QueryResults'
              example:
                status: Completed
                count_information:
                  count: 3
                items:
                - id: 97bb9a83-9788-441f-9e4f-3e4258e5da99
                  available_actions:
                  - list-management.edit_list
                  - list-management.delete_list
                  name: Q2 charges over $5K
                  description: ''
                  list_type: charge
                  search_score: null
                - id: FF29CB43-E893-444F-A3CD-38254CB91717
                  available_actions:
                  - list-management.edit_list
                  - list-management.delete_list
                  name: Deposits from January 2022
                  description: null
                  list_type: deposit
                  search_score: null
                - id: 51F86D70-A01D-4F89-849A-D03BFC51C87D
                  available_actions:
                  - list-management.edit_list
                  - list-management.delete_list
                  name: Charges not yet posted
                  description: Charges that have not been posted to GL
                  list_type: charge
                  search_score: null
components:
  schemas:
    Blackbaud.List.Service.Models.API.ApiSearchDefinition:
      type: object
      properties:
        name:
          type: string
          description: The name of the search definition
          nullable: true
        output:
          type: array
          items:
            $ref: '#/components/schemas/Blackbaud.List.Service.Models.API.ApiSearchDefinitionOutputItem'
          description: The output to return when this search request is executed
          nullable: true
        search_fields:
          type: array
          items:
            $ref: '#/components/schemas/Blackbaud.List.Service.Models.API.ApiSearchField'
          description: The list of fields to search when executing a search.
          nullable: true
      additionalProperties: false
      description: Search definitions of known searches available to use in a search request.
    Blackbaud.List.Service.Models.API.ApiSearchDefinitionOutputItem:
      type: object
      properties:
        field_id:
          type: string
          description: The identifier for the output field
          nullable: true
        display_name:
          type: string
          description: The user-friendly display name of the output field
          nullable: true
      additionalProperties: false
      description: The output to return when this search request is executed
    Blackbaud.List.Service.Models.API.ApiSearchField:
      type: object
      properties:
        field_id:
          type: string
          description: The identifier for the search field
          nullable: true
      additionalProperties: false
      description: The fields to be included in a search
    Blackbaud.List.Service.Models.AdvancedAggregationRequest:
      required:
      - aggregation_definition
      - data_model_name
      type: object
      properties:
        data_model_name:
          type: string
          description: Defines which data model to use when executing the aggregation
        filter:
          $ref: '#/components/schemas/Blackbaud.List.Service.Models.Filter'
        aggregation_definition:
          $ref: '#/components/schemas/Blackbaud.List.Service.Models.AggregationDefinition'
        top:
          type: integer
          description: The number of top N results to return for the aggregation. Defaults to 25.
          format: int32
          nullable: true
        include_grouping_field_summary:
          type: boolean
          description: When true, the set of distinct values defined by the grouping fields will be included with the response.
            Only applies when multiple grouping fields are specified and the resulting aggregation is not paged
          nullable: true
        context:
          $ref: '#/components/schemas/Blackbaud.List.Service.Models.ContextValue'
      additionalProperties: false
      description: Advanced aggregation request
    Blackbaud.List.Service.Models.AdvancedAggregationResultSet:
      type: object
      properties:
        aggregation_field_id:
          type: string
          description: The aggregation field used for this set of results.
          nullable: true
        aggregation_type:
          title: SimpleAggregationType
          enum:
          - NotSpecified
          - Avg
          - Sum
          - Max
          - Min
          - Count
          type: string
          description: The type of aggregation performed for this set of results.
        items:
          type: array
          items:
            $ref: '#/components/schemas/Blackbaud.List.Service.Models.ExecuteAggregationByFieldResultItem'
          description: The results of the above aggregation settings based on any specified group by fields.
          nullable: true
      additionalProperties: false
      description: Set of aggregation results
    Blackbaud.List.Service.Models.AdvancedAggregationResults:
      type: object
      properties:
        count:
          type: integer
          description: The total items evaluated by the execute aggregation by field request
          format: int64
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/Blackbaud.List.Service.Models.AdvancedAggregationResultSet'
          description: Aggregation results for each requested aggregation.
          nullable: true
        group_field_values:
          type: array
          items:
            $ref: '#/components/schemas/Blackbaud.List.Service.Models.AggregationGroupField'
          description: The set of unique values for each group. Optionally returned based on the request
          nullable: true
        date_aggregation_details:
          $ref: '#/components/schemas/Blackbaud.List.Service.Models.DateAggregationAutoIntervalDetails'
        iso_currency:
          type: string
          description: If the field being aggregated is of type money, the ISO currency code will be returned.
          nullable: true
      additionalProperties: false
      description: Results from an advanced aggregation result request
    Blackbaud.List.Service.Models.AggregationDefinition:
      type: object
      properties:
        aggregations:
          type: array
          items:
            $ref: '#/components/schemas/Blackbaud.List.Service.Models.AggregationItem'
          description: Collection of aggregation items used to calculate various aggregations.
          nullable: true
        group_by:
          type: array
          items:
            $ref: '#/components/schemas/Blackbaud.List.Service.Models.GroupByItem'
          description: Collection of fields to breakdown results when aggregating.
          nullable: true
        time_zone_offset_in_minutes:
          type: integer
          description: Gets or sets the time zone offset to use when calculating aggregation results by date intervals.
          format: int32
          nullable: true
      additionalProperties: false
      description: Represents an aggregation definition.
    Blackbaud.List.Service.Models.AggregationGroupField:
      type: object
      properties:
        group_field:
          type: string
          description: Gets or sets the group field.
          nullable: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/Blackbaud.List.Service.Models.AggregationGroupFieldItem'
          description: The set of unique values for this group field
          nullable: true
      additionalProperties: false
      description: Defines the set of unique values for a grouping field
    Blackbaud.List.Service.Models.AggregationGroupFieldItem:
      type: object
      properties:
        value:
          type: string
          description: The raw value for the field.
          nullable: true
        display_name:
          type: string
          description: The translated value for the field value if present.
          nullable: true
      additionalProperties: false
      description: A single value in a collection of items for a grouping field
    Blackbaud.List.Service.Models.AggregationItem:
      type: object
      properties:
        aggregation_type:
          title: SimpleAggregationType
          enum:
          - NotSpecified
          - Avg
          - Sum
          - Max
          - Min
          - Count
          type: string
          description: Type of aggregation to calculate.
        aggregation_field_id:
          type: string
          description: Numeric field on which the aggregation is performed. Required for all aggregation types except a count.
          nullable: true
        aggregation_value_filter:
          $ref: '#/components/schemas/Blackbaud.List.Service.Models.AggregationValueFilter'
      additionalProperties: false
      description: Details for an aggregation calculation
    Blackbaud.List.Service.Models.AggregationValueFilter:
      type: object
      properties:
        value:
          $ref: '#/components/schemas/Blackbaud.List.Service.Models.FilterValue'
        operator:
          title: FilterOperator
          enum:
          - None
          - Equal
          - NotEqual
          - GreaterThan
          - LessThan
          - GreaterThanOrEqual
          - LessThanOrEqual
          - OneOf
          - NotOneOf
          - Blank
          - NotBlank
          - Between
          - StartsWith
          - DoesNotStartWith
          - AllOf
          - NotBetween
          - NotNull
          type: string
          description: The operator for the filter
      additionalProperties: false
      description: Details for filtering the buckets returned by an aggregation by their aggregate value.
    Blackbaud.List.Service.Models.CollectionFilterField:
      type: object
      properties:
        field_id:
          type: string
          description: The identifier of the field the filter applies to
          nullable: true
        filter_fields:
          type: array
          items:
            $ref: '#/components/schemas/Blackbaud.List.Service.Models.FilterField'
          description: The set of filters to be applied to items in the collection.  An indidivudal item must meet the entire
            set of filter criteria.
          nullable: true
      additionalProperties: false
      description: Represents filter information for a collection.  This is used for filtering to records that have a single
        item in a collection that match a set of filters.
    Blackbaud.List.Service.Models.ContextValue:
      type: object
      properties:
        context_id:
          type: string
          description: Context value used to create an applied filter.
          nullable: true
      additionalProperties: false
      description: Specific context for a given request used for filtering to a subset of records.
    Blackbaud.List.Service.Models.CountRequest:
      required:
      - data_model_name
      type: object
      properties:
        data_model_name:
          type: string
          description: Defines which data model to use when executing the query
        filter:
          $ref: '#/components/schemas/Blackbaud.List.Service.Models.Filter'
      additionalProperties: false
      description: Defines a count request for the given model with optional filters
    Blackbaud.List.Service.Models.CountResult:
      type: object
      properties:
        count:
          type: integer
          description: Gets or sets the total count
          format: int64
        status:
          title: CountStatusType
          enum:
          - None
          - Incomplete
          - Complete
          type: string
          description: Status of the count result
          nullable: true
      additionalProperties: false
      description: Defines the result of the count request
    Blackbaud.List.Service.Models.DataModel.CustomBooleanOptions:
      type: object
      properties:
        option_true:
          type: string
          description: Gets or sets the "true" resource string
          nullable: true
        option_false:
          type: string
          description: Gets or sets the "false" resource string
          nullable: true
        option_all:
          type: string
          description: Gets or sets the "all" resource string
          nullable: true
      additionalProperties: false
      description: Defines a set of resource strings for a boolean field filter
    Blackbaud.List.Service.Models.DataModel.ExternalDataModel:
      type: object
      properties:
        name:
          type: string
          description: Name of the data model.
          nullable: true
        caption:
          type: string
          description: User friendly caption for the data model
          nullable: true
        search_definitions:
          type: array
          items:
            $ref: '#/components/schemas/Blackbaud.List.Service.Models.API.ApiSearchDefinition'
          description: Search definitions of known searches available to use in a simple search request.
          nullable: true
        fields:
          type: array
          items:
            $ref: '#/components/schemas/Blackbaud.List.Service.Models.DataModel.ExternalField'
          description: List of fields available in the data model.
          nullable: true
        default_sort:
          $ref: '#/components/schemas/Blackbaud.List.Service.Models.Sort'
        default_output:
          $ref: '#/components/schemas/Blackbaud.List.Service.Models.Output'
        default_filter:
          $ref: '#/components/schemas/Blackbaud.List.Service.Models.Filter'
        column_categories:
          type: array
          items:
            type: string
          description: List of column categories in the data model
          nullable: true
        filter_categories:
          type: array
          items:
            type: string
          description: List of filter categories in the data model
          nullable: true
        description:
          type: string
          description: Description of the data model
          nullable: true
        allow_report_insights:
          type: boolean
          description: Whether or not report insights are allowed for this data model.
        enable_tabbed_list:
          type: boolean
          description: Enables tabbed list experience on a specific data model
      additionalProperties: false
      description: Represents the properties of a data model that are exposed to external teams
    Blackbaud.List.Service.Models.DataModel.ExternalDataModelInfo:
      type: object
      properties:
        name:
          type: string
          description: The name for a data model.
          nullable: true
        caption:
          type: string
          description: User friendly caption for data model.
          nullable: true
        description:
          type: string
          description: User friendly description for the data model
          nullable: true
        allow_report_insights:
          type: boolean
          description: Whether or not report insights are allowed for this data model.
      additionalProperties: false
      description: Information about a data model
    Blackbaud.List.Service.Models.DataModel.ExternalDataModelsResponse:
      type: object
      properties:
        data_models:
          type: array
          items:
            $ref: '#/components/schemas/Blackbaud.List.Service.Models.DataModel.ExternalDataModelInfo'
          description: This list of data models.
          nullable: true
      additionalProperties: false
      description: Response when requesting the list of data models to which a user has access.
    Blackbaud.List.Service.Models.DataModel.ExternalField:
      type: object
      properties:
        name:
          type: string
          description: The name of the field
          nullable: true
        caption:
          type: string
          description: Localized caption for the field.
          nullable: true
        type:
          title: FieldType
          enum:
          - String
          - Boolean
          - Integer
          - Currency
          - Double
          - DateTimeOffset
          - FuzzyDate
          - ComplexType
          - ComplexTypeCollection
          - StringCollection
          - Composite
          - Keyword
          - EmailUrl
          - PhoneNumber
          - MonthDay
          - Byte
          - Short
          - Money
          - ScaledFloat
          - LocalDate
          - Long
          - RelatedOutputField
          - EffectiveDateRange
          - DynamicFieldCollection
          - Year
          - Aggregation
          - TopResultAggregation
          - BBID
          - ExportLink
          type: string
          description: The type of the field
        filter_type:
          type: string
          description: Gets or sets the type of the filter.
          nullable: true
        is_output:
          type: boolean
          description: Whether this field can be requested as output.
          x-bb-suppressions:
          - parameter_property_name
        is_hidden:
          type: boolean
          description: Whether this field is marked as hidden.
          x-bb-suppressions:
          - parameter_property_name
        is_sortable:
          type: boolean
          description: Whether this field can be used for sorting.
          x-bb-suppressions:
          - parameter_property_name
        fields:
          type: array
          items:
            $ref: '#/components/schemas/Blackbaud.List.Service.Models.DataModel.ExternalField'
          description: Child fields for a ComplexType or ComplexTypeCollection field.
          nullable: true
        category:
          type: string
          description: The category used for this field.
          nullable: true
        supports_group_by:
          type: boolean
          description: Whether this field can be used as a group by field for an aggregation.
        supports_aggregation:
          type: boolean
          description: Whether an aggregation can be performed on this field.
        filter_options:
          $ref: '#/components/schemas/Blackbaud.List.Service.Models.DataModel.FilterFieldOptions'
        filter_category:
          type: string
          description: The filter category for this field
          nullable: true
        column_category:
          type: string
          description: The column category for this field
          nullable: true
        is_filter:
          type: boolean
          description: Whether this field is a filter
          x-bb-suppressions:
          - parameter_property_name
        description:
          type: string
          description: Description of the field
          nullable: true
        include_identifier:
          type: boolean
          description: Whether the field includes an identifier value in the response when the field is translated to a user-friendly
            value.
          x-bb-suppressions:
          - parameter_property_name
      additionalProperties: false
      description: Represents a field in the datamodel
    Blackbaud.List.Service.Models.DataModel.FilterFieldOptions:
      type: object
      properties:
        display_false_option_first:
          type: boolean
          description: For boolean filters, this setting indicates whether the first choice that will be used when presenting
            filter options is the 'false' option
        use_custom_boolean_options:
          type: boolean
          description: Gets or sets a value indicating whether custom values are used for filter options for boolean filters.
            When true, options are expected to be defined as resource items
        custom_boolean_options:
          $ref: '#/components/schemas/Blackbaud.List.Service.Models.DataModel.CustomBooleanOptions'
        date_range_types:
          type: array
          items:
            type: string
          description: For date filters, provides a list of allowable operators
