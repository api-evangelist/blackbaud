paths:
  /correspondencecodes:
    post:
      operationId: CreateCorrespondenceCode
      summary: Create a correspondence code
      description: This operation is used to add a correspondence code.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCorrespondenceCode'
            example:
              name: 20205KRUN
              description: 2020 5K Run Email
              category: ''
              site_id: ''
              site_required: false
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully creates the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Correspondencecodes
    servers:
    - url: https://api.sky.blackbaud.com/alt-mktmg
  /correspondencecodes/list:
    get:
      operationId: ListCorrespondenceCodes
      summary: List correspondence codes
      description: This operation returns the correspondence code operation.
      parameters:
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
        description: include inactive
      - name: site_filter_mode
        in: query
        required: false
        schema:
          type: string
          enum:
          - All sites
          - My site
          - My site's branch
          - Selected sites
        description: sites
      - name: sites_selected
        in: query
        required: false
        schema:
          type: string
        description: Format - XML. sites selected
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Limits the number of records to return.
      - name: session_key
        in: query
        required: false
        schema:
          type: string
        description: A unique key provided by user for paging results. The same key will be returned in a successful response.
      - name: infinity_session
        in: query
        required: false
        schema:
          type: string
        description: Values for cookies related to the Infinity load balancer session.
      - name: more_rows_range_key
        in: query
        required: false
        schema:
          type: string
        description: Key for accessing cached results on subsequent calls to this data list.
      - name: start_row_index
        in: query
        required: false
        schema:
          type: integer
        description: Number of rows to skip,get result after these rows.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of result entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrespondenceCodeListCollection'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to view the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Correspondencecodes
    servers:
    - url: https://api.sky.blackbaud.com/alt-mktmg
  /correspondencecodes/{correspondence_code_id}:
    delete:
      operationId: DeleteCorrespondenceCode
      summary: Delete a correspondence code
      description: This deletion handles only the basic deletion rules for a correspondence code (currently none).
      parameters:
      - name: correspondence_code_id
        in: path
        required: true
        schema:
          type: string
        description: The correspondence code id
      responses:
        '200':
          description: Returned when the operation successfully deletes the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to delete the resource.
      tags:
      - Correspondencecodes
    patch:
      operationId: EditCorrespondenceCode
      summary: Edit a correspondence code
      description: This operation is for editing a correspondence code.
      parameters:
      - name: correspondence_code_id
        in: path
        required: true
        schema:
          type: string
        description: The correspondence code id.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditCorrespondenceCode'
            example:
              name: 20205KRUN
              description: 2020 5K Run Email
              category: ''
              site_id: ''
              site_required: false
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully edits the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to edit the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Correspondencecodes
    get:
      operationId: GetCorrespondenceCode
      summary: Get a correspondence code
      description: This operation is for editing a correspondence code.
      parameters:
      - name: correspondence_code_id
        in: path
        required: true
        schema:
          type: string
        description: The correspondence code id.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrespondenceCode'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to get the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Correspondencecodes
    servers:
    - url: https://api.sky.blackbaud.com/alt-mktmg
