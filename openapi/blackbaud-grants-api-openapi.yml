                  state: SC
                  address_line: 345 Fairchild Street
                  postal: '29492'
                  title: Mrs
                  first_name: Sharon
                  middle_name: ''
                  last_name: Toff
                  suffix: Sr
                  position: ''
                  address_contact_methods: []
        '403':
          description: Returned when the user does not have permission to view grants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
        '404':
          description: Returned when the specified grant could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
