              example:
                count: 3
                value:
                - contact_id: 4
                  description: ''
                  country: United States
                  city: Charleston
                  county: ''
                  state: SC
                  address_line: 123 Fairchild Street
                  postal: '29492'
                  title: Mr
                  first_name: Douglas
                  middle_name: Robert
