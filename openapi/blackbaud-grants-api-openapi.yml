openapi: 3.2.0
info:
  title: Blackbaud Grants API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Grants across 2 of this provider''s published API definitions: blackbaud-general-ledger-api-openapi.yml, blackbaud-payments-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/generalledger/v1
- url: https://api.sky.blackbaud.com/payments
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Grants
paths:
  /grants:
    get:
      operationId: ListGrants
      summary: Grants (List)
      description: Returns the list of grant summaries.
      parameters:
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: 'Represents the number of records to skip.

          For use with pagination.'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: "Represents the number of records to return. \nThe default is 100. \nThe maximum allowed value is 500."
      - name: type
        in: query
        required: false
        schema:
          type: string
        description: The type of grant.
      - name: status
        in: query
        required: false
        schema:
          type: string
        description: The status of grant.
      - name: transaction_code_value
        in: query
        required: false
        schema:
          type: string
        description: Filters on the associated transaction code value. Allows partial matching.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the list of grants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection_GrantSummary'
              example:
                count: 3
                value:
                - grant_id: 5
                  ui_grant_id: '100'
                  description: South Carolina Local Disaster Relief
                  amount: 15000
                  type: State Gov't
                  status: Open
                  start_date: '2010-01-01T00:00:00Z'
                  end_date: '2017-01-01T00:00:00Z'
                  transaction_code_value: SC Arts - 2013-2015
                  date_added: '2007-01-22T15:07:50.223Z'
                  added_by: Supervisor
                  date_modified: '2019-09-06T14:16:22.94Z'
                  modified_by: Supervisor
                - grant_id: 4
                  ui_grant_id: '101'
                  description: Helping Hands for the Homeless
                  amount: 1000000
                  type: Federal Gov't
                  status: Closed
                  start_date: '2007-01-01T00:00:00Z'
                  end_date: '2010-12-31T00:00:00Z'
                  transaction_code_value: Helping hands
                  date_added: '2007-01-22T14:10:52.87Z'
                  added_by: Supervisor
                  date_modified: '2014-08-20T14:12:05.94Z'
                  modified_by: Supervisor
                - grant_id: 6
                  ui_grant_id: '102'
                  description: Jones Foundation Workforce Grant
                  amount: 150000
                  type: Foundation
                  status: Open
                  start_date: '2013-01-01T00:00:00Z'
                  end_date: '2015-12-31T00:00:00Z'
                  transaction_code_value: Jones force
                  date_added: '2007-01-22T15:12:57.073Z'
                  added_by: Supervisor
                  date_modified: '2013-01-16T08:43:46.773Z'
                  modified_by: Supervisor
        '400':
          description: Returned when the request is not in the correct format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Invalid Request
                Details:
                - The value 'fake' is not valid for transaction_status.
                ErrorPath: null
        '403':
          description: Returned when the user does not have permission to view grants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Grants
    servers:
    - url: https://api.sky.blackbaud.com/generalledger/v1
  /grants/customfields:
    get:
      operationId: ListGrantCustomFields
      summary: Grant custom field (List)
      description: Returns the list of grant custom field options.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the list of custom fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponse_CustomFieldOptions'
              example:
                count: 2
                results:
                - custom_field_id: 26
                  name: Grant Number
                  type: Text
                  is_required: false
                  table_values:
                  - Ron Carter
                  - Alison Eberhart
                  - David Kilmer
                - custom_field_id: 27
                  name: Grant Manager
                  type: Table
                  is_required: false
                  table_values:
                  - Ron Carter
                  - Bill Jenkins
                  - Alison Eberhart
                  - David Kilmer
                  - Dr. Long
      tags:
      - Grants
    servers:
    - url: https://api.sky.blackbaud.com/generalledger/v1
  /grants/statuses:
    get:
      operationId: ListGrantStatuses
      summary: Grant status (List)
      description: Returns the list of grant statuses.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the list of statuses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection_GrantStatus'
              example:
                count: 4
                value:
                - id: 1480
                  description: Active
                  value: Active
                - id: 1481
                  description: Applied for
                  value: Applied for
                - id: 1482
                  description: Inactive
                  value: Inactive
                - id: 1483
                  description: Declined
                  value: Declined
      tags:
      - Grants
    servers:
    - url: https://api.sky.blackbaud.com/generalledger/v1
  /grants/types:
    get:
      operationId: ListGrantTypes
      summary: Grant type (List)
      description: Returns the list of grant types.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the list of types.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection_GrantType'
              example:
                count: 2
                value:
                - id: 1453
                  description: Federal Gov't
                  value: Federal Gov't
                - id: 1488
                  description: Education
                  value: Education
      tags:
      - Grants
    servers:
    - url: https://api.sky.blackbaud.com/generalledger/v1
  /grants/{grant_id}:
    get:
      operationId: GetGrant
      summary: Grant
      description: Returns a specified grant.
      parameters:
      - name: grant_id
        in: path
        required: true
        schema:
          type: integer
        description: The identifier for the grant to retrieve.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the specified grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grant'
              example:
                custom_fields:
                - custom_field_id: 1
                  field_name: Reimbursable
                  value: 'Yes'
                  comments: ''
                  type: Boolean
                  date: '2015-06-03T00:00:00Z'
                grant_id: 5
                ui_grant_id: '100'
                description: South Carolina Local Disaster Relief
                amount: 15000
                type: State Gov't
                status: Open
                start_date: '2001-07-20T00:00:00Z'
                end_date: '2012-10-20T00:00:00Z'
                transaction_code_value: None
                date_added: '2007-01-22T15:07:50Z'
                added_by: Supervisor
                date_modified: '2019-09-06T14:01:48Z'
                modified_by: Benton Austin
        '403':
          description: Returned when the user does not have permission to view grants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
        '404':
          description: Returned when the specified grant could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Grants
    servers:
    - url: https://api.sky.blackbaud.com/generalledger/v1
  /grants/{grant_id}/contacts:
    get:
      operationId: ListContactsSingleGrant
      summary: Grant contacts (List)
      description: Returns a list of contacts for a specified grant.
      parameters:
      - name: grant_id
        in: path
        required: true
        schema:
          type: integer
        description: The identifier for the grant to retrieve contact info.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the list of grants contacts.
          content:
            application/json:
              schema:
