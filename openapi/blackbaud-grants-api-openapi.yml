  /grants/{grant_id}/projects:
    get:
      operationId: ListProjectsSingleGrant
      summary: Grant projects (List)
      description: Returns a list of projects funded by a specified grant.
      parameters:
      - name: grant_id
        in: path
        required: true
        schema:
          type: integer
        description: The identifier for the grant to retrieve project info.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the list of grants contacts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection_GrantProjectSummary'
              example:
                count: 2
                value:
                - project_id: 27
                  description: Domestic Relief Programs
                  ui_project_id: '2500'
                - project_id: 20
                  description: General Project
                  ui_project_id: '1100'
        '403':
          description: Returned when the user does not have permission to view grants.
