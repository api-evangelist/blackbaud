components:
  schemas:
    UserBaseRead:
      type: object
      properties:
        id:
          type:
          - integer
          - 'null'
          description: The user ID of the user
          format: int32
        prefix:
          type:
          - string
          - 'null'
          description: The prefix of the user
        first_name:
          type:
          - string
          - 'null'
          description: The first name of the user
        middle_name:
          type:
          - string
          - 'null'
          description: The middle name of the user
        last_name:
          type:
          - string
          - 'null'
          description: The last name of the user
        suffix:
          type:
          - string
          - 'null'
          description: The suffix of the user
        preferred_name:
          type:
          - string
          - 'null'
          description: The preferred first name of the user
        preferred_last_name:
          type:
          - string
          - 'null'
          description: The preferred last name of the user
        maiden_name:
          type:
          - string
          - 'null'
          description: The former or maiden name of the user
        email:
          type:
          - string
          - 'null'
          description: The email of the user
      additionalProperties: false
      description: User base model
    TableValueBase:
      type: object
      properties:
        id:
          type:
          - integer
          - 'null'
          description: The ID of the table value
          format: int32
        description:
          type:
          - string
          - 'null'
          description: The description of the table value
      additionalProperties: false
      description: 'Table value base model. Used for table entry fields (i.e. dropdown controls) to provide both ID and Description information for the selected value. General system tables can be retrieved by School API endpoints: GET Types table types and GET Types table values.'
    ContractInsuranceEdit:
      type: object
      properties:
        insurance_token:
          type:
          - string
          - 'null'
          description: The token value authorizing edit access to insurance data. This token is delivered by the add-in context data
        provider:
          type:
          - string
          - 'null'
          description: 'The provider of the insurance policy. Allowed values: TRP Fee, Vertical Insure'
        has_purchased_insurance:
          type:
          - boolean
          - 'null'
          description: True if insurance has been purchased.
        enrollment_date:
          type:
          - string
          - 'null'
          description: The insurance enrollment date.
          format: date-time
        policy_number:
          type:
          - string
          - 'null'
          description: The insurance policy number.
        amount_paid:
          type:
          - number
          - 'null'
          description: The amount paid for insurance.
          format: double
        amount_covered:
          type:
          - number
          - 'null'
          description: The amount covered by insurance.
          format: double
      additionalProperties: false
      description: An object with insurance details, including purchased status, provider, amount paid, amount covered, policy number and an authorization token. Updating the fields in this object requires the confirmation token. This token is available from the context data of the contract's SKY Add-in.
    ErrorResponse:
      type: object
      properties:
        message:
          type:
          - string
          - 'null'
          description: ''
        error_code:
          type: integer
          description: ''
          format: int32
        error_name:
          type:
          - string
          - 'null'
          description: ''
        raw_message:
          type:
          - string
          - 'null'
          description: ''
      additionalProperties: false
      description: ''
    ContractNotReturning:
      type: object
      properties:
        not_returning:
          type:
          - boolean
          - 'null'
          description: True if not returning
        confirmed_date:
          type:
          - string
          - 'null'
          description: The date confirmed as not returning
          format: date-time
        confirmed_by:
          $ref: '#/components/schemas/UserBaseRead'
        reason:
          type:
          - string
          - 'null'
          description: The reason for not returning
      additionalProperties: false
      description: An object with information about not returning, including reason and confirmed when and by whom
    ContractFinancialAid:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/TableValueBase'
        amount:
          type: number
          description: The amount of the financial aid
          format: float
      additionalProperties: false
      description: An object with financial aid award information, including financial aid type and amount
    ContractSplit:
      type: object
      properties:
        is_split:
          type:
          - boolean
          - 'null'
          description: True if the contract has split families.
        method:
          type:
          - string
          - 'null'
          description: The split method.
        percentage:
          type:
          - number
          - 'null'
          description: The percentage of the contract amount this split is responsible for.
          format: float
      additionalProperties: false
      description: An object describing how a contract payment plan is split.
    UserContractReadCollection:
      type: object
      properties:
        count:
          type: integer
          description: The number of items in the collection
          format: int32
          readOnly: true
        value:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/UserContractRead'
          description: The set of items included in the response. This may be a subset of the items in the collection
      additionalProperties: false
      description: A Collection
    ContractFee:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/TableValueBase'
        amount:
          type:
          - number
          - 'null'
          description: The amount of the fee
          format: float
        category:
          type:
          - string
          - 'null'
          description: The category of the fee
      additionalProperties: false
      description: An object with fee information, including type and amount
    ContractInsuranceRead:
      type: object
      properties:
        provider:
          type:
          - string
          - 'null'
          description: The insurance provider. Returns `TRP Fee` if the school manages this, otherwise `Vertical Insure`.
        has_purchased_insurance:
          type:
          - boolean
          - 'null'
          description: True if insurance has been purchased.
        enrollment_date:
          type:
          - string
          - 'null'
          description: The insurance enrollment date.
          format: date-time
        policy_number:
          type:
          - string
          - 'null'
          description: The insurance policy number.
        amount_paid:
          type:
          - number
          - 'null'
          description: The amount paid for insurance.
          format: float
        amount_covered:
          type:
          - number
          - 'null'
          description: The amount covered by insurance.
          format: float
      additionalProperties: false
      description: An object with insurance details, including purchased status, provider, amount paid, amount covered and policy number.
    BaseBaseResponse:
      type: object
      properties:
        errors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ErrorResponse'
          description: ''
          readOnly: true
        data:
          $ref: '#/components/schemas/Base'
      additionalProperties: false
      description: ''
    ContractBase:
      type: object
      properties:
        id:
          type:
          - integer
          - 'null'
          description: The ID of the contract form
          format: int32
        name:
          type:
          - string
          - 'null'
          description: The name of the contract
        type:
          $ref: '#/components/schemas/TableValueBase'
        school_year:
          $ref: '#/components/schemas/TableValueBase'
        publish_date:
          type:
          - string
          - 'null'
          description: The start date of the contract’s published date range
          format: date-time
        expire_date:
          type:
          - string
          - 'null'
          description: The end date of the contract’s published date range
          format: date-time
        is_inactive:
          type:
          - boolean
          - 'null'
          description: True if the contract form is inactive
      additionalProperties: false
      description: An object with basic contract form information, including name, type, year and publish dates.
    ContractEditResponse:
      type: object
      properties:
        id:
          type:
          - integer
          - 'null'
          description: The updated contract ID.
          format: int32
      additionalProperties: false
      description: An object with the updated contract identifier.
    ContractPaymentPlan:
      type: object
      properties:
        payment_plan:
          $ref: '#/components/schemas/PaymentPlanBase'
        split:
          $ref: '#/components/schemas/ContractSplit'
        responsible_signers:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/UserBaseRead'
          description: An array of responsible signer objects.
        payers:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/UserBaseRead'
          description: An array of payer objects
        payments_remaining:
          type:
          - integer
          - 'null'
          description: The number of payments remaining when contract was submitted
          format: int32
        insurance_needed:
          type:
          - boolean
          - 'null'
          description: True if insurance is needed for the selected payment plan.
        insurance:
          $ref: '#/components/schemas/ContractInsuranceRead'
      additionalProperties: false
      description: An object with contract payment plan model information, including payment plan, split, responsible signers, payers, remaining payments, and insurance.
    ContractSigner:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserBaseRead'
        date_signed:
          type:
          - string
          - 'null'
          description: The date the user signed the contract
          format: date-time
        date_accepted:
          type:
          - string
          - 'null'
          description: The date the user accepted the contract
          format: date-time
      additionalProperties: false
      description: An object with contract signer information, including user, date signed and date accepted
    UserContractEdit:
      type: object
      properties:
        hold:
          $ref: '#/components/schemas/ContractHold'
        comment:
          type:
          - string
          - 'null'
          description: The contract comment.
      additionalProperties: false
      description: An object with editable contract information.
    UserContractRead:
      type: object
      properties:
        id:
          type:
          - integer
          - 'null'
          description: The ID of the user’s contract
          format: int32
        user:
          $ref: '#/components/schemas/UserBaseRead'
        contract:
          $ref: '#/components/schemas/ContractBase'
        date_generated:
          type:
          - string
          - 'null'
          description: The date the contract was generated
          format: date-time
        due_date:
          type:
          - string
          - 'null'
          description: The date the contract was generated
          format: date-time
        date_sent:
          type:
          - string
          - 'null'
          description: The date the contract was sent to signers
          format: date-time
        date_returned:
          type:
          - string
          - 'null'
          description: The date the contract was returned from signers
          format: date-time
        date_processed:
          type:
          - string
          - 'null'
          description: The date the contract was processed
          format: date-time
        tuition:
          type:
          - number
          - 'null'
          description: The tuition amount expected to be paid
          format: float
        tuition_insurance:
          type:
          - boolean
          - 'null'
          description: True if tuition insurance is desired
        deposits:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ContractDeposit'
          description: An array of contract deposits
        fees:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ContractFee'
          description: An array of contract fees
        signers:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ContractSigner'
          description: An array of contract signers
        hold:
          $ref: '#/components/schemas/ContractHold'
        not_returning:
          $ref: '#/components/schemas/ContractNotReturning'
        special_text:
