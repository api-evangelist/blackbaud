  /v1/contracts/{user_id}/{contract_id}:
    patch:
      operationId: V1ContractsByUser_idByContract_idPatch
      summary: Contract (Edit) (PREVIEW)
      description: 'Update contract tuition insurance information for a candidate or student contract.


        Requires the following role in the Education Management system:


        Admissions Manager


        Admissions Staff


        ReEnrollment Manager


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
        description: The user ID of the candidate or student
      - name: contract_id
        in: path
        required: true
        schema:
          type: integer
        description: The ID of the candidate or student’s contract instance
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserContractEdit'
            example:
              hold:
                on_hold: false
                type: Financial
                comment: Account is in arrears.
              comment: Comment for contract.
        description: The contract edit request.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractEditResponse'
              example:
                id: 0
        '400':
          description: Invalid parameters or authorization token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseBaseResponse'
              example:
                errors:
                - message: string
                  error_code: 0
                  error_name: string
                  raw_message: string
                data: {}
      tags:
      - Contracts
