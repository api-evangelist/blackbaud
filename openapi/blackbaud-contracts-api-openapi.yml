                    paid_by:
                      id: 1
                      prefix: Mr.
                      first_name: Kianna
                      middle_name: Mark
                      last_name: Reed
                      suffix: Jr.
                      preferred_name: ''
                      preferred_last_name: Reed
                      maiden_name: ''
                      email: kianna@example.com
                  fees:
                  - name:
                      id: 4
