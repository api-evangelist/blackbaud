  /v1/contracts/{user_id}/{contract_id}/paymentplans/{signer_id}/insurance:
    patch:
      operationId: V1ContractsByUser_idByContract_idPaymentplansBySigner_idInsurancePatch
      summary: Contract insurance (Edit) (PREVIEW)
      description: 'Update insurance information for a specific payment plan of a contract.


        Requires the following role in the Education Management system:


        Admissions Manager


        Admissions Staff


        ReEnrollment Manager


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
        description: The user ID of the candidate or student
      - name: contract_id
        in: path
        required: true
        schema:
          type: integer
        description: The ID of the candidate or student's contract instance
      - name: signer_id
        in: path
        required: true
        schema:
          type: integer
        description: The user ID of the responsible signer identifying which payment plan's insurance to update
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractInsuranceEdit'
            example:
              insurance_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
              provider: TRP Fee
              has_purchased_insurance: true
              enrollment_date: '2027-01-15T12:00:00Z'
