                    confirmed_date: '2027-05-01T12:00:00Z'
                    confirmed_by:
                      id: 1
                      prefix: Mr.
                      first_name: Kianna
                      middle_name: Mark
                      last_name: Reed
                      suffix: Jr.
                      preferred_name: ''
                      preferred_last_name: Reed
                      maiden_name: ''
                      email: kianna@example.com
                    reason: The reasonable reason
                  special_text: The special contract text
                  comment: Uncommon comments
                  attachment: …/files/contract.pdf
                  status: Submitted
                  financial_aid_awards:
                  - type:
                      id: 5
                      description: Financial Aid
                    amount: 100
                  selected_payment_plans:
                  - payment_plan:
                      id: 1
                      name: 4-Pay Plan
                      number_of_payments: 4
                      is_inactive: false
                      insurance_required: Required
                    split:
                      is_split: true
                      method: Percentage
                      percentage: 0.5
                    responsible_signers:
                    - id: 1
                      prefix: Mr.
                      first_name: John
                      middle_name: Quincy
                      last_name: Smith
                      suffix: Jr.
                      preferred_name: Jack
                      email: john@example.com
                    - id: 2
                      prefix: Mrs.
