                    amount: 100
                    category: Enrollment Fees
                  signers:
                  - user:
                      id: 1
                      prefix: Mr.
                      first_name: John
                      middle_name: Quincy
                      last_name: Smith
                      suffix: Jr.
                      preferred_name: Jack
                      email: john@example.com
                    date_signed: '2027-05-01T12:00:00Z'
                    date_accepted: '2027-05-01T12:00:00Z'
