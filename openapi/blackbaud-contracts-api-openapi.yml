      - name: user_id
        in: path
        required: true
        schema:
          type: integer
        description: The user ID of the candidate or student
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserContractReadCollection'
              example:
                count: 1
                value:
