          description: 'The the date this note was entered. Uses the format YYYY-MM-DDThh:mm:ss. An example date: <i>1955-11-05T22:04:00</i>.'
          format: date-time
        author_id:
          type: string
          description: The the author of this note.
        note_type:
          type: string
          description: The the user-defined type of this note. This code table can be queried at https://api.sky.blackbaud.com/alt-adnmg/codetables/constituentnotetypecode/entries
        text_note:
          type: string
          description: The the plain text that comprises this note.
        html_note:
          type: string
          description: The the html that comprises this note.
      additionalProperties: false
      description: EditConstituentNote
      example:
        context_type: 0
        title: Merge note
        date_entered: '2022-08-24T01:02:47Z'
        author_id: E6B5E48F-9AC5-40AB-B091-DFB168CB19BE
        note_type: Merge
