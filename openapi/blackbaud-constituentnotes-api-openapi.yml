paths:
  /constituentnotes:
    post:
      operationId: CreateConstituentNote
      summary: Create a constituent note
      description: This operation is used to add a constituent note.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewConstituentNote'
            example:
              constituent_id: E6B5E48F-9AC5-40AB-B091-DFB168CB19BE
              context_type: 0
              title: Merge note
              date_entered: '2022-08-24T01:02:47Z'
              author_id: E6B5E48F-9AC5-40AB-B091-DFB168CB19BE
              note_type: Merge
              text_note: Constituent merged 10/12/20
              html_note: <!DOCTYPE html><html><head></head><body><p>Constituent merged 10/12/20</p></body></html>
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully creates the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Constituentnotes
    servers:
    - url: https://api.sky.blackbaud.com/alt-conmg
  /constituentnotes/{constituent_note_id}:
    delete:
      operationId: DeleteConstituentNote
      summary: Delete a constituent note
      description: This deletion handles only the basic deletion rules for a constituent note (currently none).
      parameters:
      - name: constituent_note_id
        in: path
        required: true
        schema:
          type: string
        description: The constituent note id
      responses:
        '200':
          description: Returned when the operation successfully deletes the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to delete the resource.
      tags:
      - Constituentnotes
    patch:
      operationId: EditConstituentNote
      summary: Edit a constituent note
      description: This operation is for editing a given constituent's note.
      parameters:
      - name: constituent_note_id
        in: path
        required: true
        schema:
          type: string
        description: The constituent note id.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditConstituentNote'
            example:
              context_type: 0
              title: Merge note
              date_entered: '2022-08-24T01:02:47Z'
              author_id: E6B5E48F-9AC5-40AB-B091-DFB168CB19BE
              note_type: Merge
              text_note: Constituent merged 10/12/20
              html_note: <!DOCTYPE html><html><head></head><body><p>Constituent merged 10/12/20</p></body></html>
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully edits the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to edit the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Constituentnotes
    servers:
    - url: https://api.sky.blackbaud.com/alt-conmg
  /constituentnotes/{constituent_note_id}/view:
    get:
      operationId: ViewConstituentNote
      summary: View a constituent note
      description: This operation displays a constituent note.
      parameters:
      - name: constituent_note_id
        in: path
        required: true
        schema:
          type: string
        description: The constituent note id.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstituentNoteView'
      tags:
      - Constituentnotes
    servers:
    - url: https://api.sky.blackbaud.com/alt-conmg
components:
  schemas:
    ConstituentNoteView:
      type: object
      properties:
        date_entered:
          type: string
          description: 'The date. Uses the format YYYY-MM-DDThh:mm:ss. An example date: <i>1955-11-05T22:04:00</i>.'
          format: date-time
        title:
          maxLength: 50
          minLength: 0
          type: string
          description: The title.
        text_note:
          type: string
          description: The note.
        author:
          maxLength: 700
          minLength: 0
          type: string
          description: The author.
        notetype:
          maxLength: 100
          minLength: 0
          type: string
          description: The type.
      additionalProperties: false
      description: ViewConstituentNote
      x-display-name: Constituent Note View Form
      x-display-id: Constituent Note View Form
