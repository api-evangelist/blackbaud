openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: School Medical API'
  description: This API is used to provide access to school information such as users, academics, admissions, athletics, content, lists, and general school info.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/school
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/school
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Medical
paths:
  /v1/medical/allergies:
    post:
      operationId: V1MedicalAllergiesPost
      summary: Medical allergies create
      description: 'Creates an allergy for a student.


        Returns the newly created ID.


        Requires one of the following roles in the Education Management system:


        Nurse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentMedicalAllergy'
            example:
              user_id: 1
              allergy: Peanut butter
              date_as_of: '2023-08-31T12:00:00Z'
              date_until: '2024-02-01T12:00:00Z'
              notes: Life threatening
              allergy_signs: Rash and wheezing
              minor_reaction_response: Give Benadryl
              major_reaction_response: Use epi pen
              access_roles:
              - id: 1
                has_access: true
              - id: 2
                has_access: false
              student_medications:
              - 1
              - 2
              - 3
        description: The medical allergy to be created for student
      responses:
        '200':
          description: ID of the student medical allergy just created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1MedicalAllergiesPost200ApplicationJsonResponse'
              example:
                user_id: 1
                allergy: Peanut butter
                date_as_of: '2023-08-31T12:00:00Z'
                date_until: '2024-02-01T12:00:00Z'
                notes: Life threatening
                allergy_signs: Rash and wheezing
                minor_reaction_response: Give Benadryl
                major_reaction_response: Use epi pen
                access_roles:
                - id: 1
                  has_access: true
                - id: 2
                  has_access: false
                student_medications:
                - 1
                - 2
                - 3
      tags:
      - Medical
  /v1/medical/allergies/{allergy_id}:
    delete:
      operationId: V1MedicalAllergiesByAllergy_idDelete
      summary: Medical allergies delete
      description: 'Delete a medical allergy for a student.


        Requires one of the following roles in the Education Management system:


        Nurse'
      parameters:
      - name: allergy_id
        in: path
        required: true
        schema:
          type: integer
        description: The ID of the student's allergy.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1MedicalAllergies-allergy_id-Delete200ApplicationJsonResponse'
              example: 0
        '400':
          description: Record not found.
      tags:
      - Medical
    patch:
      operationId: V1MedicalAllergiesByAllergy_idPatch
      summary: Medical allergies update
      description: 'Update a medical allergy for a student.


        Requires one of the following roles in the Education Management system:


        Nurse'
      parameters:
      - name: allergy_id
        in: path
        required: true
        schema:
          type: integer
        description: The ID of the student's allergy.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentAllergyUpdate'
            example:
              date_as_of: '2023-01-01T12:00:00Z'
              date_until: '2023-02-01T12:00:00Z'
              notes: notes
              allergy_signs: allergy signs
              minor_reaction_response: minor reaction response
              major_reaction_response: major reaction response
              role_access:
              - role_id: 1
                has_access: true
              - role_id: 2
                has_access: false
              medications:
              - 1
              - 2
              - 3
        description: The allergy changes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1MedicalAllergies-allergy_id-Patch200ApplicationJsonResponse'
              example:
                date_as_of: '2023-01-01T12:00:00Z'
                date_until: '2023-02-01T12:00:00Z'
                notes: notes
                allergy_signs: allergy signs
                minor_reaction_response: minor reaction response
                major_reaction_response: major reaction response
                role_access:
                - role_id: 1
                  has_access: true
                - role_id: 2
                  has_access: false
                medications:
                - 1
                - 2
                - 3
      tags:
      - Medical
  /v1/medical/allergiesconditions:
    post:
      operationId: V1MedicalAllergiesconditionsPost
      summary: Medical allergies/conditions create (DEPRECATED)
      description: 'Creates medical allergy/condition record for a student.


        Returns the newly created ID.


        Requires one of the following roles in the Education Management system:


        Nurse


        ***This endpoint is DEPRECATED and will no longer function as of 2024-09-01***'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentMedicalAllergyCondition'
            example:
              user_id: 1
              type: allergy or condition
              allergy_condition_type: '12'
              date_as_of: '2023-01-01T12:00:00Z'
              date_until: '2023-02-01T12:00:00Z'
              allergy_signs: allergy signs
              minor_reaction_response: minor reaction response
              major_reaction_response: major reaction response
              role_access:
              - role_id: 1
                has_access: true
              - role_id: 2
                has_access: false
              medications:
              - 1
              - 2
              - 3
        description: The medical allergy/condition to be created for student
      responses:
        '200':
          description: ID of the student medical allergy/condition just created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1MedicalAllergiesconditionsPost200ApplicationJsonResponse'
              example:
                user_id: 1
                type: allergy or condition
                allergy_condition_type: '12'
                date_as_of: '2023-01-01T12:00:00Z'
                date_until: '2023-02-01T12:00:00Z'
                allergy_signs: allergy signs
                minor_reaction_response: minor reaction response
                major_reaction_response: major reaction response
                role_access:
                - role_id: 1
                  has_access: true
                - role_id: 2
                  has_access: false
                medications:
                - 1
                - 2
                - 3
      tags:
      - Medical
  /v1/medical/athleticclearance:
    post:
      operationId: V1MedicalAthleticclearancePost
      summary: Medical athletic requirements update
      description: 'Updates a medical athletic requirements for a student.


        Requires one of the following roles in the Education Management system:


        Nurse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentAthleticRequirementUpdate'
            example:
              user_id: 123
              school_year: 2023 - 2024
              season: '156057'
              athletics_requirement:
              - athletic_type: Swim Test
                athletic_date: '2022-01-01T01:00:00Z'
              - athletic_type: Can Actively Play
        description: The athletics requirements to update
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1MedicalAthleticclearancePost200ApplicationJsonResponse'
              example:
                user_id: 123
                school_year: 2023 - 2024
                season: '156057'
                athletics_requirement:
                - athletic_type: Swim Test
                  athletic_date: '2022-01-01T01:00:00Z'
                - athletic_type: Can Actively Play
      tags:
      - Medical
  /v1/medical/conditions:
    post:
      operationId: V1MedicalConditionsPost
      summary: Medical conditions create
      description: 'Creates a condition for a student.


        Returns the newly created ID.


        Requires one of the following roles in the Education Management system:


        Nurse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentMedicalCondition'
            example:
              user_id: 1
              condition: Asthma
              date_as_of: '2023-08-31T12:00:00Z'
              date_until: '2024-02-01T12:00:00Z'
              notes: Can cause panic attack
              access_roles:
              - id: 1
                has_access: true
              - id: 2
                has_access: false
              student_medications:
              - 1
              - 2
              - 3
        description: The medical condition to be created for student
      responses:
        '200':
          description: ID of the student medical condition just created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1MedicalConditionsPost200ApplicationJsonResponse'
              example:
                user_id: 1
                condition: Asthma
                date_as_of: '2023-08-31T12:00:00Z'
                date_until: '2024-02-01T12:00:00Z'
                notes: Can cause panic attack
                access_roles:
                - id: 1
                  has_access: true
                - id: 2
                  has_access: false
                student_medications:
                - 1
                - 2
                - 3
      tags:
      - Medical
  /v1/medical/conditions/{condition_id}:
    delete:
      operationId: V1MedicalConditionsByCondition_idDelete
      summary: Medical conditions delete
      description: 'Delete a medical condition for a student.


        Requires one of the following roles in the Education Management system:


        Nurse'
      parameters:
      - name: condition_id
        in: path
        required: true
        schema:
          type: integer
        description: The ID of the student's condition.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1MedicalConditions-condition_id-Delete200ApplicationJsonResponse'
              example: 0
        '400':
          description: Record not found.
      tags:
      - Medical
    patch:
      operationId: V1MedicalConditionsByCondition_idPatch
      summary: Medical conditions update
      description: 'Update a medical condition for a student.


        Requires one of the following roles in the Education Management system:


        Nurse'
      parameters:
      - name: condition_id
        in: path
        required: true
        schema:
          type: integer
        description: The ID of the student's condition.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentConditionUpdate'
            example:
              date_as_of: '2023-01-01T12:00:00Z'
              date_until: '2023-02-01T12:00:00Z'
              notes: notes
              role_access:
              - role_id: 1
                has_access: true
              - role_id: 2
                has_access: false
              medications:
              - 1
              - 2
              - 3
        description: The condition changes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1MedicalConditions-condition_id-Patch200ApplicationJsonResponse'
              example:
                date_as_of: '2023-01-01T12:00:00Z'
                date_until: '2023-02-01T12:00:00Z'
                notes: notes
                role_access:
                - role_id: 1
                  has_access: true
                - role_id: 2
                  has_access: false
                medications:
                - 1
                - 2
                - 3
      tags:
      - Medical
  /v1/medical/immunizations:
    post:
      operationId: V1MedicalImmunizationsPost
      summary: Medical immunizations update
      description: 'Updates a medical immunization for a student.


        Requires one of the following roles in the Education Management system:


        Nurse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentImmunizationUpdate'
            example:
              user_id: 123
              immunizations:
              - immunization_type: dtap
              - immunization_type: '12'
                immunization_date: '2022-01-01T01:00:00Z'
        description: The immunizations to update
      responses:
        '200':
          description: OK
      tags:
      - Medical
  /v1/medical/medications:
    post:
      operationId: V1MedicalMedicationsPost
      summary: Medical medications create
      description: 'Create a medication for a student.


        Returns the newly created ID.


        Requires one of the following roles in the Education Management system:


        Nurse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentMedicationCreate'
            example:
              user_id: 123
              medication_type: Insulin
              date_as_of: '2023-01-01T12:00:00Z'
              date_until: '2023-02-01T12:00:00Z'
              location: At home
              dosage: '1'
              dispense:
                times_a_day: 2
                frequency: specific days
                days:
                  sunday: false
                  monday: false
                  tuesday: false
                  wednesday: true
                  thursday: false
                  friday: false
                  saturday: false
              conditions:
              - 1
              - 2
              allergies:
              - 1
              - 2
              notes: Comments
              role_access:
              - role_id: 1
                has_access: true
              - role_id: 2
                has_access: false
        description: The medication to be created for student
      responses:
        '200':
          description: ID of the student medication just created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1MedicalMedicationsPost200ApplicationJsonResponse'
              example:
                user_id: 123
                medication_type: Insulin
                date_as_of: '2023-01-01T12:00:00Z'
                date_until: '2023-02-01T12:00:00Z'
                location: At home
                dosage: '1'
                dispense:
                  times_a_day: 2
                  frequency: specific days
                  days:
                    sunday: false
                    monday: false
                    tuesday: false
                    wednesday: true
                    thursday: false
                    friday: false
                    saturday: false
                conditions:
                - 1
                - 2
                allergies:
                - 1
                - 2
                notes: Comments
                role_access:
                - role_id: 1
                  has_access: true
                - role_id: 2
                  has_access: false
      tags:
      - Medical
  /v1/medical/medications/{medication_id}:
    patch:
      operationId: V1MedicalMedicationsByMedication_idPatch
      summary: Medical medication update
      description: 'Updates a medical medication for a student.


        Requires one of the following roles in the Education Management system:


        Nurse'
      parameters:
      - name: medication_id
        in: path
        required: true
        schema:
          type: integer
        description: '>The student medication ID'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentMedicationUpdate'
            example:
              date_as_of: '2023-01-01T12:00:00Z'
              date_until: '2023-02-01T12:00:00Z'
              location: Admin Office
              dosage: '1'
              despense_times_a_day: 2
              dispense_frequency: specificdays
              dispense_days:
                sunday: false
                monday: false
                tuesday: false
                wednesday: true
                thursday: false
                friday: false
                saturday: false
              conditions:
              - 1
              - 2
              allergies:
              - 1
              - 2
              - 3
        description: The medication changes to update
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1MedicalMedications-medication_id-Patch200ApplicationJsonResponse'
              example:
                date_as_of: '2023-01-01T12:00:00Z'
                date_until: '2023-02-01T12:00:00Z'
                location: Admin Office
                dosage: '1'
                despense_times_a_day: 2
                dispense_frequency: specificdays
                dispense_days:
                  sunday: false
                  monday: false
                  tuesday: false
                  wednesday: true
                  thursday: false
                  friday: false
                  saturday: false
                conditions:
                - 1
                - 2
                allergies:
                - 1
                - 2
                - 3
      tags:
      - Medical
    delete:
      operationId: V1MedicalMedicationsByMedication_idDelete
      summary: Medical medications delete
      description: 'Delete a medication for a student.


        Requires one of the following roles in the Education Management system:


        Nurse'
      parameters:
      - name: medication_id
        in: path
        required: true
        schema:
          type: integer
        description: The ID of the student's medication.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1MedicalMedications-medication_id-Delete200ApplicationJsonResponse'
              example: 0
        '400':
          description: Record not found.
      tags:
      - Medical
  /v1/medical/securityroles:
    get:
      operationId: V1MedicalSecurityrolesGet
      summary: Medical Security Roles
      description: 'Returns the user roles available for additional access control when posting medical data like student allergies or student medication.


        The ```role_access``` object in those post endpoints takes in the role IDs returned here.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityRoleCollection'
              example:
                count: 2
                value:
                - id: 1
                  name: Teacher
                - id: 2
                  name: Coach
      tags:
      - Medical
  /v1/medical/users/{user_id}/allergies:
    get:
      operationId: V1MedicalUsersByUser_idAllergiesGet
      summary: Medical allergies for a student
      description: 'Returns the medical allergies for a student.


        Requires at least one of the following roles in the Education Management system:


        Nurse'
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
        description: ID of the student
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1MedicalUsers-user_id-AllergiesGet200ApplicationJsonResponse'
              example:
                count: 1
                value:
                - id: 1
                  allergy:
                    id: 1
                    description: Peanut butter
                  date_as_of: '2023-08-31T12:00:00Z'
                  date_until: '2024-08-31T12:00:00Z'
                  notes: Life threatening
                  allergy_signs: Rash and wheezing
                  minor_reaction_response: Give Benadryl
                  major_reaction_response: Use epi pen
                  student_medications:
                  - id: 1
                    medication:
                      id: 1
                      description: Epi pen
                    date_as_of: '2023-08-31T12:00:00Z'
                    date_until: '2024-08-31T12:00:00Z'
      tags:
      - Medical
  /v1/medical/users/{user_id}/allergiesconditions:
    get:
      operationId: V1MedicalUsersByUser_idAllergiesconditionsGet
      summary: Medical allergies/conditions for a student (DEPRECATED)
      description: 'Returns a list of allergies/conditions for the specified ```user_id```.


        Requires at least one of the following roles in the Education Management system:


        Nurse


        ***This endpoint is DEPRECATED and will no longer function as of 2024-09-01***'
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
        description: ID of the student
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1MedicalUsers-user_id-AllergiesconditionsGet200ApplicationJsonResponse'
              example:
                count: 1
                value:
                - id: 1
                  type: allergy or condition
                  allergy_condition_type:
                    id: 1
                    description: Anxiety
                  date_as_of: '2022-01-01T01:00:00Z'
                  date_until: '2024-01-01T02:00:00Z'
                  allergy_signs: allergy signs
                  minor_reaction_response: minor reaction response
                  major_reaction_response: major reaction response
                  medications:
                  - id: 1
                    medication_type:
                      id: 1
                      description: Medicine 1
                    location:
                      id: 1
                      description: Admin office
                    dosage: '1'
                    dispense:
                      times_a_day: 2
                      frequency: M,W
                      days:
                        sunday: false
                        monday: true
                        tuesday: false
                        wednesday: true
                        thursday: false
                        friday: false
                        saturday: false
                  - id: 2
                    medication_type:
                      id: 2
                      description: Medicine 2
                    location:
                      id: 1
                      description: Admin office
                    dosage: '2'
                    dispense:
                      times_a_day: 1
                      frequency: Daily
      tags:
      - Medical
  /v1/medical/users/{user_id}/athleticrequirements:
    get:
      operationId: V1MedicalUsersByUser_idAthleticrequirementsGet
      summary: Medical athletic requirements for a student
      description: 'Returns a collection of medical athletic requirements for a student.


        Requires at least one of the following roles in the Education Management system:


        Nurse


        Coach'
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
        description: The ID of the student
      - name: schoolYear
        in: query
        required: false
        schema:
          type: string
        description: The description of the school year
      - name: season
        in: query
        required: false
        schema:
          type: string
        description: The description of the season
      - name: include
        in: query
        required: false
        schema:
          type: string
        description: 'Show all athletic requirements or only those completed or missing. School year and season are required if not set to completed. Allowed values: all, completed, missing'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1MedicalUsers-user_id-AthleticrequirementsGet200ApplicationJsonResponse'
              example:
                count: 2
                value:
                - id: 1
                  athletic_requirement_type:
                    id: 1
                    description: Physical
                    frequency: season
                  school_year:
                    id: 1
                    description: 2023 - 2024
                  season:
                    id: 1
                    description: Fall Season
                  is_complete: true
                  athletic_requirement_date: '2022-01-01T01:00:00Z'
                - id: 2
                  athletic_requirement_type:
                    id: 2
                    description: All activity
                    frequency: season
                  school_year:
                    id: 1
                    description: 2023 - 2024
                  season:
                    id: 2
                    description: Winter Season
                  is_complete: false
      tags:
      - Medical
  /v1/medical/users/{user_id}/conditions:
    get:
      operationId: V1MedicalUsersByUser_idConditionsGet
      summary: Medical conditions for a student
      description: 'Returns the medical conditions for a student.


        Requires at least one of the following roles in the Education Management system:


        Nurse'
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
        description: ID of the student
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1MedicalUsers-user_id-ConditionsGet200ApplicationJsonResponse'
              example:
                count: 1
                value:
                - id: 1
                  condition:
                    id: 1
                    description: Asthma
                  date_as_of: '2023-08-31T12:00:00Z'
                  date_until: '2024-08-31T12:00:00Z'
                  notes: Can cause panic attack
                  student_medications:
                  - id: 1
                    medication:
                      id: 1
                      description: Inhaler
                    date_as_of: '2023-08-31T12:00:00Z'
                    date_until: '2024-08-31T12:00:00Z'
      tags:
      - Medical
  /v1/medical/users/{user_id}/immunizations:
    get:
      operationId: V1MedicalUsersByUser_idImmunizationsGet
      summary: Medical immunizations for a student
      description: 'Returns a collection of medical immunizations for the specified ```user_id```.


        Requires at least one of the following roles in the Education Management system:


        Nurse'
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
        description: The ID of the student
      - name: include
        in: query
        required: false
        schema:
          type: string
        description: 'Show all required immunizations or just those completed or missing. Allowed values: all, completed, missing.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1MedicalUsers-user_id-ImmunizationsGet200ApplicationJsonResponse'
              example:
                count: 2
                value:
                - id: 1
                  immunization_type:
                    id: 11
                    description: Type description
                  is_complete: true
                  immunization_date: '2022-01-01T01:00:00Z'
                - id: 2
                  immunization_type:
                    id: 21
                    description: Type description
                  is_complete: false
      tags:
      - Medical
  /v1/medical/users/{user_id}/medications:
    get:
      operationId: V1MedicalUsersByUser_idMedicationsGet
      summary: Medical medications for a student
      description: 'Returns a list of medications for the specified ```user_id```.


        Requires at least one of the following roles in the Education Management system:


        Nurse'
      parameters:
      - name: user_id
