openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: Treasury Deposits API'
  description: This API is used to manage bank accounts and transactions.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/58e3b2880528ab71c796492e
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/treasury/v1
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Deposits
paths:
  /deposits/{deposit_id}:
    get:
      operationId: GetDeposit
      summary: Deposit (Get)
      description: Retrieves information about a given deposit.
      parameters:
      - name: deposit_id
        in: path
        required: true
        schema:
          type: integer
        description: The identifier for the deposit to retrieve.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the specified deposit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositDetail'
              example:
                deposit_id: 118
                bank_account_id: 2
                number: '91'
                projected_count: 1
                actual_count: 1
                projected_amount: 1000
                actual_amount: 10
                date: '2017-03-08T00:00:00Z'
                transaction_status: Outstanding
                status: Closed
                post_status: NotYetPosted
                post_date: '2017-03-08T00:00:00Z'
                distributions:
                - distribution_id: 1
                  amount: 10
                  description: Additional Operating Cash Account
                  account_number: 01-1000-00
                  type_code: Debit
                  custom_fields: []
                  distribution_splits:
                  - distribution_split_id: 0
                    ui_project_id: ''
                    transaction_code_values:
                    - name: Jurisdiction
                      value: None
                    - name: Spendable?
                      value: Spendable
                    - name: RE Appeals
                      value: ''
                    - name: Grant
                      value: ''
                    - name: Activities
                      value: ''
                    amount: 10
                    percent: 0
                    account_class: Unrestricted Net Assets
        '403':
          description: Returned when the user does not have permission to view deposits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
        '404':
          description: Returned when the specified deposit could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Deposits
  /deposits/{deposit_id}/cashreceipts:
    post:
      operationId: CreateCashReceipt
      summary: Cash receipt (Create)
      description: Adds a new cash receipt.
      parameters:
      - name: deposit_id
        in: path
        required: true
        schema:
          type: integer
        description: The deposit identifier for this cash receipt.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCashReceipt'
            example:
              date: '2017-02-08T00:00:00Z'
              amount: 10
              category: Grants
              description: cash receipt description
              payment_from: Benton
              payment_info:
                payment_method: CreditCard
                card_type: visa
                card_number: '8757'
                expiration_month: 11
                expiration_year: 2019
                authorization_number: '455'
              receipt_status: Do not print
              receipt_address: 123 fake street
              distributions:
              - amount: 10
                account_number: 01-1000-00
                type_code: Debit
                custom_fields: []
                distribution_splits:
                - ui_project_id: '1001'
                  transaction_code_values:
                  - name: Jurisdiction
                    value: None
                  - name: Spendable?
                    value: Spendable
                  - name: RE Appeals
                    value: ''
                  - name: Grant
                    value: ''
                  - name: Activities
                    value: ''
                  amount: 10
                  percent: 100
                  account_class: Unrestricted Net Assets
              custom_fields:
              - field_name: Restitution Recipient
                value: Doug
                comments: Custom field comments
                date: '2017-02-08T00:00:00Z'
        description: The cash receipt to create.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the ID of the cash receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedResult_Int32'
              example:
                record_id: 843
        '400':
          description: Returned when the request is not in the correct format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Invalid Request
                Details:
                - The value 'fake' is not valid for transaction_status.
                ErrorPath: null
        '403':
          description: Returned when the user does not have permission to create cash receipts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
        '404':
          description: Returned when the specified deposit could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Deposits
    get:
      operationId: ListCashReceiptsSingleDeposit
      summary: Cash receipts (List)
      description: Returns a list of cash receipts from a given deposit.
      parameters:
      - name: deposit_id
        in: path
        required: true
        schema:
          type: integer
        description: The identifier for the deposit to retrieve cash receipts.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: 'Represents the number of records to skip.

          For use with pagination.'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: "Represents the number of records to return. \nThe default is 100. \nThe maximum allowed value is 500."
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the collection of cash receipts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection_CashReceipt'
              example:
                count: 2
                value:
                - cash_receipt_id: 273
                  date: '2015-02-02T00:00:00Z'
                  number: '61'
                  payer: ''
                  description: Def
                  payment_method: Cash
                  amount: 100
                - cash_receipt_id: 274
                  date: '2015-02-02T00:00:00Z'
                  number: '62'
                  payer: ''
                  description: Def
                  payment_method: Cash
                  amount: 100
        '403':
          description: Returned when the user does not have permission to view deposits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
        '404':
          description: Returned when the specified deposit could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Deposits
