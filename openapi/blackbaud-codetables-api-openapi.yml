openapi: 3.2.0
info:
  title: Blackbaud Codetables API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Codetables across 3 of this provider''s published API definitions: blackbaud-altru-administration-api-openapi.yml, blackbaud-code-table-api-openapi.yml, blackbaud-crm-administration-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/alt-adnmg
- url: https://api.sky.blackbaud.com/codetable
- url: https://api.sky.blackbaud.com/crm-adnmg
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Codetables
paths:
  /codetables/entry/{code_table_name}:
    post:
      operationId: CreateCodeTableEntry
      summary: Create a code table entry
      description: Creates a code table entry.
      parameters:
      - name: code_table_name
        in: path
        required: true
        schema:
          type: string
        description: The name of the code table.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewCodeTableEntry'
            example:
              table_entry_description: Annual
              table_entry_id: e6c79f33-841b-4a96-80b2-3d185944ecc9
              inactive: false
              sequence: 1
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation succeeds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: 630f47e6-f165-4420-a6f0-37e353b342e1
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Codetables
    patch:
      operationId: EditCodeTableEntry
      summary: Edit a code table entry
      description: Edit a code table entry.
      parameters:
      - name: code_table_name
        in: path
        required: true
        schema:
          type: string
        description: The name of the code table.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditCodeTable'
            example:
              table_entry_description: Annual
              table_entry_id: e6c79f33-841b-4a96-80b2-3d185944ecc9
              inactive: false
              sequence: 1
        description: ConfigurationMessage object representing operation intended to be updated
      responses:
        '200':
          description: Returned when the operation successfully edits the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Codetables
    servers:
    - url: https://api.sky.blackbaud.com/alt-adnmg
  /codetables/{code_table_id}/list:
    get:
      operationId: ListCodeTables
      summary: List code tables
      description: List of entries defined for a given code table
      parameters:
      - name: code_table_id
        in: path
        required: true
        schema:
          type: string
        description: The code table ID.
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
        description: Indicates whether to include inactive records.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Limits the number of records to return.
      - name: session_key
        in: query
        required: false
        schema:
          type: string
        description: A unique key provided by user for paging results. The same key will be returned in a successful response.
      - name: infinity_session
        in: query
        required: false
        schema:
          type: string
        description: Values for cookies related to the Infinity load balancer session.
      - name: more_rows_range_key
        in: query
        required: false
        schema:
          type: string
        description: Key for accessing cached results on subsequent calls to this data list.
      - name: start_row_index
        in: query
        required: false
        schema:
          type: integer
        description: Number of rows to skip,get result after these rows.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of result entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeTableListCollection'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to view the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Codetables
    servers:
    - url: https://api.sky.blackbaud.com/alt-adnmg
  /codetables/{code_table_name}/codetableentryid/{entry_id}:
    delete:
      operationId: DeleteCodeTableEntry
      summary: Delete code table entry
      description: Deletes a code table entry.
      parameters:
      - name: code_table_name
        in: path
        required: true
        schema:
          type: string
        description: The name of the code table.
      - name: entry_id
        in: path
        required: true
        schema:
          type: string
        description: The code table entry ID.
      responses:
        '200':
          description: Returned when the operation succeeds.
        '400':
          description: Returned when the request or parameters are not in the appropriate format or when CRM returns an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Codetables
    servers:
    - url: https://api.sky.blackbaud.com/alt-adnmg
  /codetables/{code_table_name}/entries:
    get:
      operationId: ListCodeTableEntries
      summary: List code table entries
      description: Returns table entries for the specified code table.
      parameters:
      - name: code_table_name
        in: path
        required: true
        schema:
          type: string
        description: The name of the code table.
      responses:
        '200':
          description: Returned when the operation succeeds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeTableEntryCollection'
              example:
                count: 1
                value:
                - id: 7ef78ae5-a2b1-4819-b208-a0d3a68277b5
                  description: Phone call
                  sequence: 1
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Codetables
    servers:
    - url: https://api.sky.blackbaud.com/alt-adnmg
  /codetables/{code_table_name}/entrydescription/{entry_description}:
    get:
      operationId: GetCodeTableEntryId
      summary: Get code table entry Id by description
      description: Gets a code table entry ID by description.
      parameters:
      - name: code_table_name
        in: path
        required: true
        schema:
          type: string
        description: The name of the code table.
      - name: entry_description
        in: path
        required: true
        schema:
          type: string
        description: The code table entry description.
      responses:
        '200':
          description: Returned when the operation succeeds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeTableEntryId'
              example:
                id: 0ea241dc-3b7d-41b1-a67b-9d8c46f4729c
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Codetables
    servers:
    - url: https://api.sky.blackbaud.com/alt-adnmg
  /codetables/{code_table_name}/entryid/{entry_id}:
    get:
      operationId: GetCodeTableEntryDescription
      summary: Get a code table entry description by Id
      description: Gets a code table entry description by ID.
      parameters:
      - name: code_table_name
        in: path
        required: true
        schema:
          type: string
        description: The name of the code table.
      - name: entry_id
        in: path
        required: true
        schema:
          type: string
        description: The code table entry description.
      responses:
        '200':
          description: Returned when the operation succeeds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeTableEntryDescription'
              example:
                Description: Identified
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Codetables
    servers:
    - url: https://api.sky.blackbaud.com/alt-adnmg
  /v1/codetables:
    post:
      operationId: CreateCodeTable
      summary: Create a code table (PREVIEW)
      description: 'Creates a new code table.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeTableCreate'
            example:
              name: Committees
              category: All
        description: The code table to add.
      responses:
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '200':
          description: Returned when the operation succeeds. The response body contains the new code table ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse_2'
              example:
                id: '987'
      tags:
      - Codetables
    get:
      operationId: GetCodeTableList
      summary: Get code table list (PREVIEW)
      description: 'Returns a list of code tables.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: name
        in: query
        required: false
        schema:
          type: string
        description: The name of the code table. Looks for an exact match.
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Fuzzy search for code table names. This will search for code tables that contain the search term in their name.
      - name: category
        in: query
        required: false
        schema:
          type: string
          enum:
          - All
          - Biographical
          - Gift
          - Action
          - CFA
          - Solicitor
          - Education
          - Membership
          - Volunteer
          - Prospect
          - Events
          - WorkplaceGiving
        description: Limit to only a certain category of code tables.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      - name: offset
        in: query
        required: false
        schema:
          type: integer
      responses:
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '200':
          description: Returned when the operation succeeds. The response body contains the code table list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeTableCollection'
              example:
                count: 1
                value:
                - code_tables_id: '43'
                  name: Constituent code
                  user_defined: false
                  has_short_description: true
                  short_description_length: 6
                  can_manage: false
                  category: All
                  product_flags: 0
                  country_mask: 0
                  has_entries: true
                  is_field_lookup: false
                  supports_cleanup: false
      tags:
      - Codetables
    servers:
    - url: https://api.sky.blackbaud.com/codetable
  /v1/codetables/{code_table_id}/tableentries:
    post:
      operationId: CreateTableEntry
      summary: Create a table entry (PREVIEW)
      description: 'Creates a new table entry.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: code_table_id
        in: path
        required: true
        schema:
          type: string
        description: The code table ID.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableEntryCreate'
            example:
              is_active: true
              long_description: Employee
              short_description: EMP
              numeric_value: 0
              phone_format: None
              phone_type: TelephoneNumber
        description: The table entry to add.
      responses:
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '200':
          description: Returned when the operation succeeds. The response body contains the new table entry ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse_2'
              example:
                id: '987'
      tags:
      - Codetables
    get:
      operationId: GetTableEntriesList
      summary: Get table entries list (PREVIEW)
      description: 'Returns a list of table entries.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: code_table_id
        in: path
        required: true
        schema:
          type: string
        description: The code table ID.
      - name: long_description
        in: query
        required: false
        schema:
          type: string
        description: Exact match on the long description of the table entry.
      - name: short_description
        in: query
        required: false
        schema:
          type: string
        description: Exact match on the short description of the table entry.
      - name: numeric_value
        in: query
        required: false
        schema:
          type: number
        description: Exact match on the numeric value of the table entry.
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
        description: Indicates whether to include inactive table entries.
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: 'Fuzzy search for table entry names. Checks both long description and short description for the search term.

          entries.'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      - name: offset
        in: query
        required: false
        schema:
          type: integer
      responses:
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '200':
          description: Returned when the operation succeeds. The response body contains the table entry list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableEntryCollection'
              example:
                count: 1
                value:
                - table_entries_id: '6'
                  is_active: true
                  long_description: Employee
                  short_description: EMP
                  numeric_value: 0
                  sequence: 3
                  is_system_entry: false
                  code_tables_id: '43'
                  date_added: '0001-01-01T12:00:00Z'
                  date_changed: '0001-01-01T12:00:00Z'
                  added_by_id: '12345'
                  last_changed_by_id: '12345'
                  code_tables_name: Constituent Codes
                  phone_format: None
                  phone_type: TelephoneNumber
      tags:
      - Codetables
    servers:
    - url: https://api.sky.blackbaud.com/codetable
