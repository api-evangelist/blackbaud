      type: object
      properties:
        id:
          type: string
          description: The ID.
        description:
          type: string
          description: The description.
        active:
          type: boolean
          description: Indicates whether active.
        sites:
          type: string
          description: The sites.
      additionalProperties: false
      description: ListCodeTables
      x-display-name: Code Table Entry List
      x-display-id: Code Table Entry List
    CodeTableEntryId:
      type: object
      properties:
        id:
          type: string
