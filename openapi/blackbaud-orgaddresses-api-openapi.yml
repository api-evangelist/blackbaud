openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: Accounts Payable Orgaddresses API'
  description: This API is used to manage accounts payable, including vendors and invoices.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/57a342f1d7dcde1c28a749fe
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/accountspayable/v1
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Orgaddresses
paths:
  /orgaddresses:
    get:
      operationId: ListOrgAddresses
      summary: Organization address (List)
      description: Returns a list of organization addresses.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains a list of organization addresses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgAddressApiCollection'
              example:
                count: 3
                value:
                - id: 1
                  description: <Primary address>
                - id: 2
                  description: Administration Building
                - id: 3
                  description: Test Address
      tags:
      - Orgaddresses
components:
  schemas:
    OrgAddressApiCollection:
      type: object
      properties:
        count:
          type: integer
          format: int32
        value:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/OrgAddress'
      additionalProperties: false
      description: Collection Response
    OrgAddress:
      type: object
      properties:
        id:
          type: integer
          description: The identifier for this organization address.
          format: int32
        description:
          type:
          - string
          - 'null'
          description: The description of the organization address.
      additionalProperties: false
      description: Contract for organization address.
  securitySchemes:
    Bb-Api-Subscription-Key:
      type: apiKey
      name: Bb-Api-Subscription-Key
      in: header
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://app.blackbaud.com/oauth/authorize
          tokenUrl: https://oauth2.sky.blackbaud.com/token
          scopes: {}
