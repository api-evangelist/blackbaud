  /vendors/{vendor_id}/addresses/{address_id}:
    delete:
      operationId: DeleteVendorAddress
      summary: Address (Delete)
      description: Removes the address from the vendor.
      parameters:
      - name: vendor_id
        in: path
        required: true
        schema:
          type: integer
        description: The vendor to which we delete the address.
      - name: address_id
        in: path
        required: true
        schema:
          type: integer
        description: The address to which we delete.
      responses:
        '200':
          description: Returned when the operation is successful.
        '400':
          description: Returned when the specified vendor or address ID in the request URL body or the specified request parameters are not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Failed to save {record}
                Details:
                - The total percent distributed must equal 100%.
        '403':
          description: Returned when the user does not have permission to remove vendor addresses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
        '404':
          description: Returned when no vendor or address is found with the specified IDs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Vendors
    patch:
      operationId: EditVendorAddress
      summary: Address (Edit)
      description: Returns the identifier of the edited invoice.
      parameters:
      - name: vendor_id
        in: path
        required: true
        schema:
          type: integer
        description: The identifier for the vendor on which the address to edit is.
      - name: address_id
        in: path
        required: true
        schema:
          type: integer
        description: The identifier for the address to edit.
      requestBody:
        content:
          application/json:
