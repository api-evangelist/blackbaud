          description: Returned when the operation is successful. The response body contains the specified vendor entity's form 1099 information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vendor1099Information'
              example:
                default_box_numbers:
                - number: 7-Nonemployee compensation
                  state: SC
                  percent: 50
                - number: 16-State tax withheld
