components:
  schemas:
    DefaultDistributionApiCollection:
      type: object
      properties:
        count:
          type: integer
          format: int32
        value:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DefaultDistribution'
      additionalProperties: false
      description: Collection Response
    DomainErrorMessage:
      type: object
      properties:
        Error:
          type:
          - string
          - 'null'
        Details:
          type:
          - array
          - 'null'
          items:
            type: string
        ErrorPath:
          type:
          - string
          - 'null'
      additionalProperties: false
    AddressContactMethod:
      required:
      - contact_info
      - contact_type
      type: object
      properties:
        contact_method_id:
          type: integer
          description: The address contact method identifier.
          format: int32
        contact_type:
          minLength: 1
          type: string
          description: The type of contact (email, phone, etc).
        contact_info:
          minLength: 1
          type: string
          description: The contact information (email address, phone number, etc) for this method.
      additionalProperties: false
      description: Address information
    CustomFieldDataType:
      title: CustomFieldDataType
      enum:
      - Text
      - Number
      - DateTime
      - Currency
      - Boolean
      - Table
      - FuzzyDate
      type: string
    BasicErrorMessage:
      type: object
      properties:
        Error:
          type:
          - string
          - 'null'
      additionalProperties: false
    AddressContactMethodPagedResponse:
      type: object
      properties:
        count:
          type: integer
          format: int32
        results:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AddressContactMethod'
      additionalProperties: false
      description: Paged Response
    CreditMemoInvoiceApplicationSummary:
      type: object
      properties:
        invoice_number:
          type:
          - string
          - 'null'
          description: The number of this invoice.
        invoice_date:
          type: string
          description: The date of this invoice.
          format: date-time
        credit_memo_amount_applied:
          type: number
          description: The credit memo amount applied to this invoice.
          format: decimal
        invoice_id:
          type:
          - integer
          - 'null'
          description: The invoice identifier for this application.
          format: int32
      additionalProperties: false
    DefaultDistributionSplit:
      required:
      - transaction_code_values
      type: object
      properties:
        distribution_split_id:
          type: integer
          description: The distribution split identifier.
          format: int32
        ui_project_id:
          type:
          - string
          - 'null'
          description: The user-visible identifier of the project.
        transaction_code_values:
          type: array
          items:
            $ref: '#/components/schemas/TransactionCodeValue'
          description: The distribution transaction code values.
        percent:
          type:
          - number
          - 'null'
          description: The distribution journal entry amount percentage.
          format: decimal
        account_class:
          type:
          - string
          - 'null'
          description: The account class for this distribution split.
      additionalProperties: false
      description: Journal Entry Distribution.
    PostStatus:
      title: PostStatus
      enum:
      - DoNotPost
      - NotYetPosted
      - Posted
      type: string
    Vendor1099Information:
      type: object
      properties:
        default_box_numbers:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/VendorDefaultBoxNumber'
          description: The default box numbers for this vendor.
      additionalProperties: false
      description: Contract for vendor 1099 information
    DefaultDistribution:
      required:
      - default_distribution_splits
      type: object
      properties:
        distribution_id:
          type: integer
          description: The distribution identifier.
          format: int32
        default_distribution_splits:
          type: array
          items:
            $ref: '#/components/schemas/DefaultDistributionSplit'
          description: The distribution split.
        account_number:
          type:
          - string
          - 'null'
          description: The account number for this distribution.
        percent:
          type:
          - number
          - 'null'
          description: The distribution journal entry amount percentage.
          format: decimal
        type_code:
          $ref: '#/components/schemas/DistributionTypeCode'
        custom_fields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CustomField'
          description: The custom fields of the distribution.
