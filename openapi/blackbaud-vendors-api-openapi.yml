openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: Accounts Payable Vendors API'
  description: This API is used to manage accounts payable, including vendors and invoices.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/57a342f1d7dcde1c28a749fe
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/accountspayable/v1
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Vendors
paths:
  /vendors:
    post:
      operationId: CreateVendor
      summary: Vendor (Create)
      description: Returns the identifier of the created vendor.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVendor'
            example:
              vendor_name: Aviato
              vendor_type: Organization
              customer_number: '8675309'
              tax_id_number: '123456'
              vendor_status: Active
              issue_1099s: true
              address:
              - address_id: 7
                description: Address description
                country: United States
                city: Charleston
                county: Charleston
                state: SC
                postal: '29492'
                address_line: 123 Fake street
                is_primary: true
                is_invoices: true
                is_pos: true
                is_1099: true
                title: Mr
                first_name: Mike
                middle_name: R
                last_name: Giannoni
                suffix: Sr
                position: CEO
                address_contact_methods:
                - contact_method_id: 0
                  contact_type: Business
                  contact_info: MikeyG@gmail.com
              vendor_payment_default:
                has_credit_limit: true
                credit_limit: 200
                payment_terms: Net 15
                account_name: Operating
                payment_method: Check
                payment_option: OnePerInvoice
              custom_fields:
              - field_name: Solicit for Donations
                value: 'Yes'
                comments: donations comment
                date: '2018-06-27T12:00:00Z'
              ui_defined_id: '1100'
              gst_tax_type_id: 1
              psb_activity_code_id: 1
              gst_branch: '123'
        description: The vendor to add.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the ID of the created vendor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Int32CreatedResult'
              example:
                record_id: 843
        '400':
          description: Returned when the request is not in the correct format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Failed to save {record}
                Details:
                - The total percent distributed must equal 100%.
        '403':
          description: Returned when the user does not have permission to create a vendor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Vendors
    get:
      operationId: ListVendors
      summary: Vendor (List)
      description: Returns the list of vendors.
      parameters:
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: The number of records to skip, for use with pagination.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: "The number of records to return. \nIf not specified, the default is 100.  \nThe maximum allowed value is 500."
      - name: vendor_name
        in: query
        required: false
        schema:
          type: string
        description: The name of the vendor.
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - Active
          - Inactive
          - OnHold
        description: "Status of vendor. \nActive, pending, or on hold."
      - name: ui_vendor_id
        in: query
        required: false
        schema:
          type: string
        description: The user-visible identifier for the vendor.
      - name: customer_number
        in: query
        required: false
        schema:
          type: string
        description: The customer number for the vendor.
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: Represents a filter for results modified on or after the specified date.
      - name: date_added
        in: query
        required: false
        schema:
          type: string
        description: Represents a filter for results added on or after the specified date.
      - name: added_by
        in: query
        required: false
        schema:
          type: string
        description: Filter by added by.
      - name: last_modified_by
        in: query
        required: false
        schema:
          type: string
        description: Filter by modified by.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the list of vendors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VendorSummaryApiCollection'
              example:
                count: 133
                value:
                - vendor_id: 1
                  vendor_name: ADS Security Systems
                  balance_due: 5143
                  ui_defined_id: '0002'
                  customer_number: 1321654ADT
                  vendor_status: Active
                  issue_1099s: false
                  primary_address:
                    address_id: 7
                    description: Local Address
                    country: United States
                    city: Charleston
                    state: SC
                    postal: '29416'
                    address_line: 4328 Elliot Circle
                    is_primary: true
                    is_invoices: false
                    is_pos: false
                    is_1099: false
                    title: Mr
                    first_name: Bill
                    last_name: Jones
                    position: District Manager
                    address_contact_methods:
                    - contact_method_id: 1
                      contact_type: Business
                      contact_info: 800-468-8996
                    - contact_method_id: 44
                      contact_type: Business
                      contact_info: BJones@ADS-SS.com
                    payee_name: ADS Security Systems
                  payment_method: Check
                  payment_defaults:
                    has_credit_limit: false
                    credit_limit: 1000
                    payment_terms: Net 15
                    account_name: Operating
                    payment_method: Check
                    payment_option: OneForAll
                  date_added: '2002-01-10T10:43:21Z'
                  date_modified: '2018-05-09T12:33:51Z'
                  added_by: Supervisor
                  modified_by: Spencer Chambers
                - vendor_id: 2
                  vendor_name: AlphaGraphics
                  balance_due: 120000
                  ui_defined_id: '0003'
                  customer_number: ag8754
                  vendor_status: Active
                  issue_1099s: false
                  primary_address:
                    address_id: 8
                    description: Corporate Address
                    country: United States
                    city: Charleston
                    state: SC
                    postal: '29401'
                    address_line: 1376 Calhoun Street
                    is_primary: true
                    is_invoices: false
                    is_pos: false
                    is_1099: false
                    title: Ms
                    first_name: Sue
                    last_name: White
                    position: Graphic Artist
                    address_contact_methods:
                    - contact_method_id: 2
                      contact_type: Business
                      contact_info: 800-468-8996
                    payee_name: AlphaGraphics
                  payment_method: Check
                  payment_defaults:
                    has_credit_limit: false
                    payment_terms: Net 15
                    account_name: Operating
                    payment_method: Check
                    payment_option: OneForAll
                  date_added: '2002-01-10T10:10:47Z'
                  date_modified: '2018-01-02T08:00:57Z'
                  added_by: Supervisor
                  modified_by: KathrynWilks
        '400':
          description: Returned when the request is not in the correct format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Invalid Request
                Details:
                - The value 'fake' is not valid for transaction_status.
        '403':
          description: Returned when the user does not have permission to view vendors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Vendors
  /vendors/attachments:
    post:
      operationId: CreateVendorAttachment
      summary: Vendor attachment (Create)
      description: 'Returns the id saved attachment.

        Physical attachments require the request to be a multipart/form-data request and are limited to 25 MB or smaller.

        Physical attachment request must provide "ParentId" and "MediaType" fields instead of "parent_id" and "media_type".'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAttachment'
            example:
              parent_id: 1
              name: Attachment Name
              url: https://www.google.com
              type: Link
              media_type: Other
          multipart/form-data:
            example:
              parent_id: 1
              name: Attachment Name
              url: https://www.google.com
              type: Link
              media_type: Other
        description: The attachment to create.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the file id of the saved attachment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Int32CreatedResult'
              example:
                record_id: 843
        '400':
          description: Returned when the request is not in the correct format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Failed to save {record}
                Details:
                - The total percent distributed must equal 100%.
        '403':
          description: Returned when the user does not have permission to add attachments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
        '404':
          description: Returned when the specified vendor could not be found, or the request size exceeds 25 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Vendors
  /vendors/customfields:
    get:
      operationId: ListVendorCustomFields
      summary: Vendor custom field (List)
      description: Returns a list of custom field options.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the list of custom fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldOptionsPagedResponse'
              example:
                count: 3
                results:
                - custom_field_id: 1
                  name: Solicit for Donations
                  type: Boolean
                  is_required: false
                - custom_field_id: 45
                  name: Demo Custom Field
                  type: Table
                  is_required: false
                  table_values:
                  - d1 - Demo 1
                  - d2 - Demo 2
                - custom_field_id: 2
                  name: Member\Volunteer
                  type: Boolean
                  is_required: false
      tags:
      - Vendors
  /vendors/{vendor_id}:
    patch:
      operationId: EditVendor
      summary: Vendor (Edit)
      description: Edits a specified vendor.
      parameters:
      - name: vendor_id
        in: path
        required: true
        schema:
          type: integer
        description: The identifier of the vendor to edit.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditVendor'
            example:
              vendor_name: Aviato
              vendor_type: Organization
              customer_number: '8675309'
              vendor_status: Active
              issue_1099s: true
              vendor_payment_default:
                has_credit_limit: true
                credit_limit: 200
                payment_terms: Net 15
                account_name: Operating
                payment_method: Check
                payment_option: OnePerInvoice
              custom_fields:
              - field_name: Solicit for Donations
                value: 'Yes'
                comments: donations comment
                type: 0
                is_required: false
                date: '2018-06-27T12:00:00Z'
        description: The changes for the vendor.
      responses:
        '200':
          description: Returned when the operation successfully edits the vendor. The response body contains the vendor identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Int32CreatedResult'
              example:
                record_id: 843
        '400':
          description: Returned when the specified vendor identifier in the request URL body or the specified request parameters are not in the appropriate format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Failed to save {record}
                Details:
                - The total percent distributed must equal 100%.
        '403':
          description: Returned when the user does not have permission to edit the vendor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
        '404':
          description: Returned when the specified vendor is not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Vendors
    get:
