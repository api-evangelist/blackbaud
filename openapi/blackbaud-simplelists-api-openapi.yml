info:
  title: Blackbaud Simplelists API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Simplelists across 2 of this provider''s published API definitions: blackbaud-altru-administration-api-openapi.yml, blackbaud-crm-administration-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/alt-adnmg
- url: https://api.sky.blackbaud.com/crm-adnmg
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Simplelists
paths:
  /simplelists/translation/{simple_list_id}:
    get:
      operationId: SimpleListTranslation
      summary: Simple list translation
      description: /appfxwebservice.asmx?op=SimpleDataListGetTranslation, SOAPAction=Blackbaud.AppFx.WebService.API.1/SimpleDataListGetTranslation.
      parameters:
      - name: simple_list_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of simple list.
      - name: entry_id
        in: query
        required: false
        schema:
          type: string
        description: Simple list entry value.
      - name: simple_list_name
        in: query
        required: false
        schema:
          type: string
        description: Simple list name.
      responses:
        '200':
          description: Returned when the operation succeeds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleListTranslation'
              example:
                value: Primary
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Simplelists
    servers:
    - url: https://api.sky.blackbaud.com/alt-adnmg
  /simplelists/{simple_list_id}:
    get:
      operationId: SimpleListLoad
      summary: Simple list load
      description: Gets the data for a simple datalist using ID or Name and any parameters. /appfxwebservice.asmx?op=SimpleDataListLoad, SOAPAction=Blackbaud.AppFx.WebService.API.1/SimpleDataListLoad.
      parameters:
      - name: simple_list_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of simple list.
      - name: parameters
        in: query
        required: false
        schema:
          type: string
        description: 'String of comma separated parameter and its value.Example: interaction_category_id,d4e18cdc-1baa-4d0c-ae41-2e40fcda9d64'
      responses:
        '200':
          description: Returned when the operation succeeds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionSimpleListLoad'
              example:
                count: 5
                rows:
                - value: fcc68195-a29e-4191-916d-421fb9188bd9
                  label: Autumn mailing only
                - value: 7749b617-ec7f-447e-995a-d586db9fa312
                  label: Change for testing
                - value: b18fedac-76f1-4beb-a4f7-e38a8dc387f6
                  label: Do not call after 9:00 PM
                - value: 6381b85c-625c-4739-b068-09d68fb95c62
                  label: Do not mail
                - value: 03d4cb5d-2f02-46e7-90cd-2da933d238d6
                  label: Do not phone
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Simplelists
    servers:
    - url: https://api.sky.blackbaud.com/alt-adnmg
