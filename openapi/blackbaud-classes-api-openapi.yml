openapi: 3.2.0
info:
  title: Blackbaud Classes API
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Classes across 2 of this provider''s published API definitions: blackbaud-general-ledger-api-openapi.yml, blackbaud-oneroster-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/generalledger/v1
- url: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Classes
paths:
  /classes:
    get:
      operationId: ListClasses
      summary: Class (List)
      description: The list of classes
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains a list of class values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassArray'
              example:
              - class_id: 188
                description: Unrestricted Net Assets
                value: Unrestricted Net Assets
                inactive: false
              - class_id: 189
                description: Temporarily Restricted Net Assets
                value: Temporarily Restricted Net Assets
                inactive: false
              - class_id: 190
                description: Permanently Restricted Net Assets
                value: Permanently Restricted Net Assets
                inactive: true
      tags:
      - Classes
    servers:
    - url: https://api.sky.blackbaud.com/generalledger/v1
  /classes/{class_id}/categories:
    get:
      operationId: getCategoriesForClass
      summary: Categories for a class
      description: Returns a collection of categories for a specified ```class_id```.
      parameters:
      - name: class_id
        in: path
        required: true
        schema:
          type: string
        description: sourcedId for the category
      responses:
        '200':
          description: OK - It was possible to read the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesOutputModel'
              example:
                categories:
                - title: Homework
                  sourcedId: lic-222-543
                  status: active
                  dateLastModified: '2022-09-26T01:30:00Z'
                - title: Project
                  sourcedId: lic-222-544
                  status: active
                  dateLastModified: '2022-09-26T01:30:00Z'
      tags:
      - Classes
    servers:
    - url: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster
  /classes/{class_id}/lineItems:
