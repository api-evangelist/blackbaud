components:
  schemas:
    ClassArray:
      type: array
      items:
        $ref: '#/components/schemas/Class'
    Class:
      description: Account class.
      type: object
      properties:
        class_id:
          format: int32
          description: The class identifier.
          type: integer
          x-ms-summary: Class id
        description:
          description: The description for this class.
          type: string
          x-ms-summary: Description
        value:
          description: The value for this class.
          type: string
          x-ms-summary: Value
        inactive:
          description: Indicate if record is inactive or not.
          type: boolean
          x-ms-summary: Inactive
      x-display-name: Class
      x-ms-summary: Class
    ResultModelSvc:
      type: object
      properties:
        scoreStatus:
          type:
          - string
          - 'null'
          description: Score status
        scoreDate:
          type:
          - string
          - 'null'
          description: Score date
          format: date-time
        score:
          type:
          - number
          - 'null'
          description: Score
          format: double
        comment:
          type:
          - string
          - 'null'
          description: Comment
        lineItem:
          $ref: '#/components/schemas/GuidRefModel'
        student:
          $ref: '#/components/schemas/GuidRefModel'
        sourcedId:
          type:
          - string
          - 'null'
          description: Unique identifier for the instance
        status:
          type:
          - string
          - 'null'
          description: Status for the instance
        dateLastModified:
          type:
          - string
          - 'null'
          description: Date and time the instance was last modified
          format: date-time
        metadata:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          description: Extension properties for the instance
      additionalProperties: false
      description: Results model
