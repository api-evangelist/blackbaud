        in: path
        required: true
        schema:
          type: string
        description: sourcedId for the class
      responses:
        '200':
          description: OK - It was possible to read the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineItemsOutputModel'
              example:
                lineItems:
                - title: Assignment Title 1
