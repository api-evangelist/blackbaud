openapi: 3.2.0
info:
  title: Blackbaud Batchtemplates API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Batchtemplates across 2 of this provider''s published API definitions: blackbaud-altru-administration-api-openapi.yml, blackbaud-crm-administration-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/alt-adnmg
- url: https://api.sky.blackbaud.com/crm-adnmg
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Batchtemplates
paths:
  /batchtemplates/list:
    get:
      operationId: ListBatchTemplates
      summary: List batch templates
      description: Returns a list of all batch templates
      parameters:
      - name: category
        in: query
        required: false
        schema:
          type: string
        description: Category. SimpleDataListID=8853a1a4-9046-4bba-8385-ed4d6e7793de.
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
        description: Indicates whether to include inactive records.
      - name: site_filter_mode
        in: query
        required: false
        schema:
          type: string
          enum:
          - All sites
          - My site
          - My site's branch
          - Selected sites
        description: Sites filter mode.
      - name: sites_selected
        in: query
        required: false
        schema:
          type: string
        description: Sites selected. Format - XML.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Limits the number of records to return.
      - name: session_key
        in: query
        required: false
        schema:
          type: string
        description: A unique key provided by user for paging results. The same key will be returned in a successful response.
      - name: infinity_session
        in: query
        required: false
        schema:
          type: string
        description: Values for cookies related to the Infinity load balancer session.
      - name: more_rows_range_key
        in: query
        required: false
        schema:
          type: string
        description: Key for accessing cached results on subsequent calls to this data list.
      - name: start_row_index
        in: query
        required: false
        schema:
          type: integer
        description: Number of rows to skip,get result after these rows.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of result entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchTemplateListCollection'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to view the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Batchtemplates
    servers:
    - url: https://api.sky.blackbaud.com/alt-adnmg
  /batchtemplates/{batch_template_id}:
    patch:
      operationId: EditBatchTemplate
      summary: Edit a batch template
      description: Edit dataoperation design for adding batch instances
      parameters:
      - name: batch_template_id
        in: path
        required: true
        schema:
          type: string
        description: The batch template ID.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditBatchTemplate'
            example:
              name: ''
              description: ''
              batch_work_flow: ''
              numbering_scheme: ''
              auto_save_on_row_change: false
              create_exception_batch: false
              purge_batch: false
              check_for_duplicate_records: false
              batch_supports_checking_for_duplicate_records: false
              validate_batch: false
              create_control_report: false
              batch_type_catalog: ''
              import_only: false
              template_use: Batch entry and import
              batch_fields:
              - {}
              template_permissions:
              - id: ''
                system_role_id: ''
                name: ''
                grant_or_deny: ''
              customize_permissions:
              - id: ''
                system_role_id: ''
                name: ''
                grant_or_deny: ''
              site_id: ''
              add_row_data_form_instance_id: ''
              edit_row_data_form_instance_id: ''
              commit_row_add_data_form_instance_id: ''
              commit_row_edit_data_form_instance_id: ''
              default_template: false
              auto_match_threshold: 0
              overall_match_threshold: 0
              parameters_xml:
              - {}
              use_global_match_settings: false
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully edits the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to edit the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Batchtemplates
    get:
      operationId: GetBatchTemplate
      summary: Get a batch template
      description: Edit dataoperation design for adding batch instances
      parameters:
      - name: batch_template_id
        in: path
        required: true
        schema:
          type: string
        description: The batch template ID.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchTemplate'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to get the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Batchtemplates
    servers:
    - url: https://api.sky.blackbaud.com/alt-adnmg
