  /individuals/{constituent_id}:
    patch:
      operationId: EditIndividual
      summary: Edit an individual
      description: This operation is used to edit biographical inoperationation for an individual.
      parameters:
      - name: constituent_id
        in: path
        required: true
        schema:
          type: string
        description: The constituent id.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditIndividual'
            example:
              last_name: Adamson
              first_name: Eric
              middle_name: Arnold
              maiden_name: ''
              nickname: ''
              title: Mr.
              suffix: ''
              gender: Male
              birth_date:
                year: 1990
                month: 8
                day: 16
              age: 29
              gives_anonymously: false
              picture: ''
              picture_thumbnail: ''
              picture_changed: false
              web_address: ''
              marital_status: ''
              title_2: ''
              suffix_2: ''
              deceased: false
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully edits the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to edit the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Individuals
    get:
      operationId: GetIndividual
      summary: Get an individual
      description: This operation is used to edit biographical inoperationation for an individual.
      parameters:
      - name: constituent_id
        in: path
        required: true
        schema:
          type: string
        description: The constituent id.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Individual'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to get the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Individuals
    servers:
    - url: https://api.sky.blackbaud.com/alt-conmg
  /individuals/{constituent_id}/recentrevenueview:
    get:
      operationId: ViewIndividualRecentRevenue
      summary: View an individual's recent revenue'
      description: Displays recent revenue inoperationation for an individual.
      parameters:
      - name: constituent_id
        in: path
        required: true
        schema:
          type: string
        description: The constituent id.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndividualRecentRevenueView'
      tags:
      - Individuals
    servers:
    - url: https://api.sky.blackbaud.com/alt-conmg
  /individuals/{constituent_id}/revenuesummaryview:
    get:
      operationId: ViewIndividualRevenueSummary
      summary: View an individual's revenue summary
      description: Displays revenue summary inoperationation about an individual.
      parameters:
      - name: constituent_id
        in: path
        required: true
        schema:
          type: string
        description: The constituent id.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndividualRevenueSummaryView'
      tags:
      - Individuals
    servers:
    - url: https://api.sky.blackbaud.com/alt-conmg
