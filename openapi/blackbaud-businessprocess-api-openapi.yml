          description: The ID.
        status_code:
          type: integer
          description: The status code.
          format: int32
        running:
          type: boolean
          description: Indicates whether running.
        did_not_finish:
          type: boolean
          description: Indicates whether did not finish.
        parameter_set_id:
          type: string
          description: The parameter set ID.
        business_process_catalog_id:
          type: string
          description: The business process catalog ID.
        enable_letter_mail_merge:
          type: boolean
          description: Indicates whether enable letter mail merge. Read-only in the SOAP API.
        enable_label_mail_merge:
          type: boolean
          description: Indicates whether enable label mail merge. Read-only in the SOAP API.
        output_table_exists:
