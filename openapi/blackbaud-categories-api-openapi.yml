                status: 403
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
      tags:
      - Categories
    servers:
    - url: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster
