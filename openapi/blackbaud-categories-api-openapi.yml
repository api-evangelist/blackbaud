openapi: 3.2.0
info:
  title: Blackbaud Categories API
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Categories across 2 of this provider''s published API definitions: blackbaud-oneroster-api-openapi.yml, blackbaud-query-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster
- url: https://api.sky.blackbaud.com/query
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Categories
paths:
  /categories:
    get:
      operationId: getAllCategories
      summary: Categories all
      description: Returns a collection of categories.
      responses:
        '200':
          description: OK - It was possible to read the collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesOutputModel'
              example:
                categories:
                - title: Homework
                  sourcedId: lic-222-543
                  status: active
                  dateLastModified: '2022-09-26T01:30:00Z'
                - title: Project
                  sourcedId: lic-222-544
                  status: active
                  dateLastModified: '2022-09-26T01:30:00Z'
      tags:
      - Categories
    post:
      operationId: AddQueryCategory
      summary: Adds a query category
      description: Adds a query category.
      parameters:
      - name: product
        in: query
        required: true
        schema:
          type: string
          enum:
          - RE
          - FE
        description: The Blackbaud product for the request<p>Members:</p><ul><li><i>RE</i> - The Raiser's Edge</li><li><i>FE</i> - The Financial Edge</li></ul>
      - name: module
        in: query
        required: true
        schema:
          type: string
          enum:
          - None
          - GeneralLedger
          - AccountsPayable
          - AccountsReceivable
          - FixedAssets
          - CashReceipts
        description: The module for the request (RE requests must use 'None', FE requests require one of the other values)<p>Members:</p><ul><li><i>None</i></li><li><i>GeneralLedger</i></li><li><i>AccountsPayable</i></li><li><i>AccountsReceivable</i></li><li><i>FixedAssets</i></li><li><i>CashReceipts</i></li></ul>
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryCategoryWrite'
            example:
              name: category
        description: Query category write
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the ID of query category added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: 53CEEC04-3FAA-47D2-B112-D4A997A7F99D
        '400':
          description: Returned when the request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/QueryCategoryAddErrorCodes'
              example:
                type: urn:blackbaud:missing-product
                title: One or more validation errors occurred.
                status: 400
                detail: Product was not supplied.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have permission to access the resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:forbidden
                title: The requested action is forbidden.
                status: 403
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
      tags:
      - Categories
    servers:
    - url: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster
  /categories/{id}:
    get:
      operationId: getCategory
      summary: Category by id
      description: Returns a specific category.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: sourcedId for the category
      responses:
        '200':
          description: OK - It was possible to read the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryOutputModel'
              example:
                category:
                  title: Homework
                  sourcedId: lic-222-543
                  status: active
                  dateLastModified: '2022-09-26T01:30:00Z'
      tags:
      - Categories
    put:
      operationId: putCategory
      summary: Category create/update
      description: Returns the category object that was created or updated.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: sourcedId for the category
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInputModel'
            example:
              category:
                title: Homework
                sourcedId: lic-222-sourcedId
                status: active
                dateLastModified: '2022-09-26T01:30:00Z'
        description: input model for a category
      responses:
        '201':
          description: OK - It was possible to read the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryOutputModel'
              example:
                category:
                  title: Homework
                  sourcedId: lic-222-543
                  status: active
                  dateLastModified: '2022-09-26T01:30:00Z'
      tags:
      - Categories
    delete:
      operationId: DeleteQueryCategory
      summary: Deletes a query category
      description: Deletes a query category.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: ID of the query category to be deleted
      - name: product
        in: query
        required: true
        schema:
          type: string
          enum:
          - RE
          - FE
        description: The Blackbaud product for the request<p>Members:</p><ul><li><i>RE</i> - The Raiser's Edge</li><li><i>FE</i> - The Financial Edge</li></ul>
      - name: module
        in: query
        required: true
        schema:
          type: string
          enum:
          - None
          - GeneralLedger
          - AccountsPayable
          - AccountsReceivable
          - FixedAssets
