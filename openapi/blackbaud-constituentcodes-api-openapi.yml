openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: Constituent Constituentcodes API'
  description: This API manages constituent information and related entities such as addresses, phones, emails, and notes.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/56b76470069a0509c8f1c5b3
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/constituent/v1
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Constituentcodes
paths:
  /constituentcodes:
    post:
      operationId: CreateConstituentCode
      summary: Constituent code (Create)
      description: Creates a constituent code for a constituent.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConstituentCodeAdd'
            example:
              constituent_id: '280'
              description: Volunteer
              end:
                d: 13
                m: 11
                y: 2005
              start:
                d: 12
                m: 12
                y: 2004
        description: An object that represents the constituent code to create.
      responses:
        '200':
          description: Returned when the operation successfully creates a constituent code. The response body contains the ID of the new constituent code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: '1281'
        '400':
          description: Returned when the request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to create the constituent code.
        '404':
          description: Returned when the specified constituent is not found.
      tags:
      - Constituentcodes
  /constituentcodes/{constituent_code_id}:
    delete:
      operationId: DeleteConstituentCode
      summary: Constituent code (Delete)
      description: Deletes a constituent code.
      parameters:
      - name: constituent_code_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the constituent code to delete.
      responses:
        '200':
          description: Returned when the operation successfully deletes the constituent code.
        '400':
          description: Returned when the specified constituent code ID in the request URL is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to delete the constituent code.
      tags:
      - Constituentcodes
    patch:
      operationId: EditConstituentCode
      summary: Constituent code (Edit)
      description: Edits a constituent code.
      parameters:
      - name: constituent_code_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the constituent code to edit.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConstituentCodeEdit'
            example:
              end:
                d: 13
                m: 4
                y: 1990
              start:
                d: 13
                m: 4
                y: 1987
        description: An object that represents the properties of the constituent code to edit.
      responses:
        '200':
          description: Returned when the operation successfully edits the constituent code.
        '400':
          description: Returned when the specified constituent code ID in the request URL or the specified request parameters are not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to edit the constituent code.
        '404':
          description: Returned when the specified constituent code is not found.
      tags:
      - Constituentcodes
components:
  schemas:
    ConstituentCodeEdit:
      description: Constituent codes define the high-level affiliations between constituents and your organization — such as Board member, Vendor, and Volunteer — to provide context for why constituents are in the database.
      type: object
      properties:
        end:
          $ref: '#/components/schemas/FuzzyDate'
          description: The end date of the constituent code.
        start:
          $ref: '#/components/schemas/FuzzyDate'
          description: The start date of the constituent code.
        sequence:
          format: int32
          description: The sequence of the constituent code.
          type: integer
      x-hidden: true
      x-display-name: Edit constituent code
      x-display-id: EditConstituentCode
    PostResponse:
      description: Defines the shape of a post response object.
      type: object
      properties:
        id:
          description: The newly created ID
          type: string
      x-hidden: true
    FuzzyDate:
      description: Fuzzy dates provide a versatile date type to create partial dates such as February 9 (with no year indicated).
      type: object
      properties:
        d:
          format: int32
          description: The day in the fuzzy date.
          type: integer
        m:
          format: int32
          description: The month in the fuzzy date.
          type: integer
        y:
          format: int32
          description: The year in the fuzzy date.
          type: integer
      x-display-name: Fuzzy date
      x-display-id: FuzzyDate
    ConstituentCodeAdd:
      description: Constituent codes define the high-level affiliations between constituents and your organization — such as Board member, Vendor, and Volunteer — to provide context for why constituents are in the database.
      required:
      - constituent_id
      - description
      type: object
      properties:
        constituent_id:
          description: The immutable system record ID of the constituent associated with the constituent code.
          type: string
        description:
          description: The description of the constituent code. Available values are the entries in the <a href="https://developer.sky.blackbaud.com/docs/services/56b76470069a0509c8f1c5b3/operations/ListConstituentCodeTypes"><b>Constituent Codes</b></a> table.
          type: string
        end:
          $ref: '#/components/schemas/FuzzyDate'
          description: The end date of the constituent code.
        start:
          $ref: '#/components/schemas/FuzzyDate'
          description: The start date of the constituent code.
        sequence:
          format: int32
          description: The sequence of the constituent code.
          type: integer
      x-hidden: true
      x-display-name: Create constituent code
      x-display-id: CreateConstituentCode
  securitySchemes:
    Bb-Api-Subscription-Key:
      type: apiKey
      name: Bb-Api-Subscription-Key
      in: header
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://app.blackbaud.com/oauth/authorize
          tokenUrl: https://oauth2.sky.blackbaud.com/token
          scopes: {}
