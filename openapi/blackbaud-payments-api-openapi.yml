openapi: 3.0.1
info:
  title: 'Blackbaud SKY API: Payments'
  description: This API enables users to accept and manage payments via Blackbaud Merchant Services.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/payments
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations,
      examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/payments
paths:
  /v1/batches/cardtransactionbatch:
    post:
      operationId: PostCardTransactionBatch
      summary: Card transaction batch (PREVIEW)
      description: 'Creates, uploads, and processes a batch of back office credit card and debit card transactions. <a href="https://kb.blackbaud.com/articles/Article/194170">Contact
        Support</a> for permission to use this endpoint.


        ***This endpoint is in PREVIEW and may be subject to change.***'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardTransactionBatchAdd'
            example:
              id: 553c159f-dcca-4495-aa33-1025546c7af2
              payment_configuration_id: 992c159f-dcca-4495-aa33-1025546c7af2
              process: false
              row_data:
              - amount: 1000
                billing_contact:
                  address: 2000 Daniel Island Drive
                  city: Charleston
                  country: US
                  first_name: Blackbaud
                  post_code: '29442'
                  state: SC
                card_token: ff64d39b-ccb2-4dbd-b5b3-c1a19b0c48e9
                transaction_category: donation
                is_donor_cover: false
        description: An object that represents the batch of card transactions.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the batch ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardTransactionBatchRead'
              example:
                batch_id: 92844827-5b74-40db-907f-480b13242eb5
        '400':
          description: Returned when the request body is not in the appropriate format. The response body contains error details.
  /v1/batches/directdebittransactionbatch:
    post:
      operationId: PostDirectDebitTransactionBatch
      summary: Direct debit transaction batch (PREVIEW)
      description: 'Creates, uploads, and processes a batch of back office direct debit transactions. <a href="https://kb.blackbaud.com/articles/Article/194170">Contact
        Support</a> for permission to use this endpoint.


        ***This endpoint is in PREVIEW and may be subject to change.***'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectDebitTransactionBatchAdd'
            example:
              id: 1CE9C0C7-C0B3-435E-90BE-BD32E1B522F5
              payment_configuration_id: 85CDBC80-90E8-41D6-9E7B-8C23D8320447
              process: false
              row_data:
              - amount: 1000
                billing_contact:
                  address: 2000 Daniel Island Drive
                  city: Charleston
                  country: US
                  first_name: Blackbaud
                  post_code: '29442'
                  state: SC
                account_token: C43CFF0D-98C7-4971-91E8-58A053029183
                transaction_id: 4415FC6A-045C-43F3-A488-CFDF7E35F382
                transaction_category: donation
                is_donor_cover: false
        description: An object that represents the batch of direct debit transactions.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the batch ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectDebitTransactionBatchRead'
              example:
                batch_id: F14BA526-23AD-425E-8842-94ACDA4C76BA
        '400':
          description: Returned when the request body is not in the appropriate format. The response body contains error details.
  /v1/batches/{batch_id}:
    get:
      operationId: GetTransactionBatch
      summary: Transaction batch (PREVIEW)
      description: 'Returns the status of a batch of card transactions or direct debit transactions, and when the status is
        complete, returns a list of results. <a href="https://kb.blackbaud.com/articles/Article/194170">Contact Support</a>
        for permission to use this endpoint.


        ***This endpoint is in PREVIEW and may be subject to change.***'
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier of the batch.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the batch status and result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionBatchStatusRead'
              example:
                status: Completed
                records_processed: 1
                exception_count: 0
                transactions:
                - id: 19761b45-9295-4a5c-aa26-c754200cd90f
                  state: Processed
                  authorization_code: '123456'
                  retry_code: NotApplicable
        '400':
          description: Returned when the request body is not in the appropriate format. The response body contains error details.
  /v1/cards/{card_token}:
    get:
      operationId: GetCard
      summary: Card
      description: Returns information about a stored credit card.
      parameters:
      - name: card_token
        in: path
        required: true
        schema:
          type: string
        description: The <a href="https://en.wikipedia.org/wiki/Universally_unique_identifier">unique identifier</a> of the
          stored credit card for which you would like to retrieve detailed information.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains stored credit card details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardRead'
              example:
                bank_identification_number: '411111'
                brand: VISA
                cardholder_name: Blackbaud
                expiry_month: 10
                expiry_year: 2020
                last_four: '1111'
        '400':
          description: Returned when the request is not in the appropriate format. The response body contains error details.
        '404':
          description: Returned when the specified card token is not found. The response body contains error details.
  /v1/cardtokens:
    post:
      operationId: CreateCardToken
      summary: Card token
      description: Securely stores credit or debit card information and returns a token to use in future transactions. For
        credit cards, tokens will be registered in Credit Card Updater for enrolled customers.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardTokenAdd'
            example:
              exp_month: 2
              exp_year: 1985
              issue_number: '443'
              name: Blackbaud
              number: '4111111111111111'
              valid_from_month: 1
              valid_from_year: 1980
        description: An object that represents the credit card information to store.
      responses:
        '200':
          description: Returned when the operation successfully stores credit card information. The response body contains
            a token to use in future transactions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardTokenRead'
              example:
                card_token: 2405227f-848d-4f17-979e-88e17298a543
        '400':
          description: Returned when the request body is not in the appropriate format. The response body contains error details.
  /v1/checkout/publickey:
    get:
      operationId: GetPublicKey
      summary: Public key
      description: Gets the client's public key. See the <a href="https://developer.blackbaud.com/skyapi/apis/payments/checkout">Blackbaud
        Checkout integration guide</a> to learn more.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the client's public key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicKeyRead'
              example:
                public_key: 48b58ad0-b763-49b5-95f1-78fb91627f6a
        '404':
          description: Returned when the public key is not found. The response body contains error details.
  /v1/checkout/securitytoken/{payment_configuration_id}:
    get:
      operationId: GetSecurityToken
      summary: Security token
      description: Gets the security token and the amount of time (in seconds) before the token is set to expire
      parameters:
      - name: payment_configuration_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the payment configuration to be used to process this request.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the security token and the amount
            of time (in seconds) before the token is set to expire.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityTokenRead'
              example:
                expires_in: 1000
                security_token: 48b58ad0-b763-49b5-95f1-78fb91627f6a
        '404':
          description: Returned when the security token is not found. The response body contains error details.
  /v1/checkout/transaction:
    post:
      operationId: CreateCheckoutTransaction
      summary: Checkout transaction
      description: Creates a transaction that has been previously authorized by Blackbaud Checkout. See the <a href="https://developer.blackbaud.com/skyapi/apis/payments/checkout">Blackbaud
        Checkout integration guide</a> to learn more.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutTransactionAdd'
            example:
              amount: 1000
              authorization_token: 992c159f-dcca-4495-aa33-1025546c7af2
              application_fee: 100
        description: The transaction information to charge.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains transaction details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionRead'
              example:
                additional_fee: 25
                amount: 1000
                net_amount: 925
                application: Payments API
                billing_info:
                  city: Charleston
                  country: US
                  post_code: '29492'
                  state: SC
                  street: 2000 Daniel Island Drive
                comment: Recurring donation
                credit_card:
                  card_type: Visa
                  exp_month: 2
                  exp_year: 1985
                  last_four: '1111'
                  name: Blackbaud
                  pay_pal_funding_source: Unknown
                currency: USD
                disbursement_status: NotDisbursable
                donor_ip_address: 192.168.0.1
                fraud_result:
                  anonymous_proxy_result: NotProcessed
                  bin_and_ip_country_result: NotProcessed
                  high_risk_country_result: NotProcessed
                  result_code: NotProcessed
                  risk_score: 0
                  risk_threshold: 0
                  velocity_result: NotProcessed
                id: 92844827-5b74-40db-907f-480b13242eb5
                related_transactions:
                - id: 6fef1d90-60f2-43ea-aa96-b7562286c57d
                  transaction_type: Refund
                is_live: false
                state: Processed
                token: 00000000-0000-0000-0000-000000000000
                transaction_date: '2018-01-31T11:07:12Z'
                transaction_type: CardNotPresent
                total_fees: 75
                authorization_code: '123456'
                transaction_category: donation
                gateway_result:
                  message: Gateway declined
        '400':
          description: Returned when the request body is not in the appropriate format. The response body contains error details.
        '404':
          description: Returned when the specified transaction is not found. The response body contains error details.
        '409':
          description: Returned when the request is received while the transaction is currently being processed. The response
            body contains error details.
        '201':
          description: Returned when the transaction is successfully charged but full details can’t be retrieved. The response
            body is null.
  /v1/checkout/transactions/{authorization_token}:
    get:
      operationId: GetCheckoutTransaction
      summary: Checkout transaction
      description: Returns information about a transaction that has been previously authorized by Blackbaud Checkout.
      parameters:
      - name: authorization_token
        in: path
        required: true
        schema:
          type: string
        description: The authorization token of the transaction for which you would like to retrieve additional information.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains transaction details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionRead'
              example:
                additional_fee: 25
                amount: 1000
                net_amount: 925
                application: Payments API
                billing_info:
                  city: Charleston
                  country: US
                  post_code: '29492'
                  state: SC
                  street: 2000 Daniel Island Drive
                comment: Recurring donation
                credit_card:
                  card_type: Visa
                  exp_month: 2
                  exp_year: 1985
                  last_four: '1111'
                  name: Blackbaud
                  pay_pal_funding_source: Unknown
                currency: USD
                disbursement_status: NotDisbursable
                donor_ip_address: 192.168.0.1
                fraud_result:
                  anonymous_proxy_result: NotProcessed
                  bin_and_ip_country_result: NotProcessed
                  high_risk_country_result: NotProcessed
                  result_code: NotProcessed
                  risk_score: 0
                  risk_threshold: 0
                  velocity_result: NotProcessed
                id: 92844827-5b74-40db-907f-480b13242eb5
                related_transactions:
                - id: 6fef1d90-60f2-43ea-aa96-b7562286c57d
                  transaction_type: Refund
                is_live: false
                state: Processed
                token: 00000000-0000-0000-0000-000000000000
                transaction_date: '2018-01-31T11:07:12Z'
                transaction_type: CardNotPresent
                total_fees: 75
                authorization_code: '123456'
                transaction_category: donation
                gateway_result:
                  message: Gateway declined
        '400':
          description: Returned when the request body is not in the appropriate format. The response body contains error details.
        '404':
          description: Returned when the specified transaction is not found. The response body contains error details.
  /v1/directdebitaccounts/{account_token}:
    get:
      operationId: GetDirectDebitAccount
      summary: Direct debit account
      description: Returns information about a stored direct debit account.
      parameters:
      - name: account_token
        in: path
        required: true
        schema:
          type: string
        description: The <a href="https://en.wikipedia.org/wiki/Universally_unique_identifier">unique identifier</a> of the
          stored direct debit account for which you would like to retrieve detailed information.
      responses:
        '200':
          description: Returned when the operation successfully gets direct debit account information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectDebitAccountRead'
              example:
                account_holder: Blackbaud
                account_email: Test@test.com
                direct_debit_type: us_bank_account
                billing_address:
                  city: Charleston
                  country: US
                  post_code: '29492'
                  state: SC
                  address_block: 2000 Daniel Island Drive
                us_bank_account:
                  account_number_last_four: '8888'
                  account_type: CorporateChecking
                  routing_number: 091000019
                mandate_info:
                  recurrence_description: Daily
                  mandate_amount: 1000
                  mandate_is_variable_amount: false
                  mandate_id: 992c159f-dcca-4495-aa33-1025546c7af2
                  mandate_url: https://www.mandate-example.com
        '400':
          description: Returned when the request is not in the appropriate format. The response body contains error details.
        '404':
          description: Returned when the specified account token is not found. The response body contains error details.
  /v1/directdebitaccounttokens:
    post:
      operationId: CreateDirectDebitAccountToken
      summary: Direct debit account token
      description: Create a direct debit account token.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectDebitAccountTokenAdd'
            example:
              direct_debit_account_info:
                direct_debit_type: us_bank_account
                account_holder: Blackbaud
                account_email: Test@test.com
                us_bank_account:
                  account_number: '88888888'
                  account_type: CorporateChecking
                  routing_number: 091000019
                mandate_is_variable_amount: false
                mandate_amount: 0
        description: Information about the direct debit account token.
      responses:
        '200':
          description: Returned when the operation successfully stores direct debit account information. The response body
            contains a token to use in future transactions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectDebitAccountTokenRead'
              example:
                direct_debit_account_token: 2405227f-848d-4f17-979e-88e17298a543
                mandate_id: 992c159f-dcca-4495-aa33-1025546c7af2
                mandate_url: https://www.mandate-example.com
        '400':
          description: Returned when the request body is not in the appropriate format. The response body contains error details.
  /v1/disbursements:
    get:
      operationId: ListDisbursement
      summary: Disbursement list
      description: Gets the list of disbursements.
      parameters:
      - name: payment_configuration_id
        in: query
        required: true
        schema:
          type: string
        description: The ID of the payment configuration to be used to process this request.
      - name: start_date
        in: query
        required: false
        schema:
          type: string
        description: Start date in yyyy-MM-dd format.
      - name: end_date
        in: query
        required: false
        schema:
          type: string
        description: End date in yyyy-MM-dd format.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains a list of disbursements.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisbursementListRead'
              example:
                count: 2
                value:
                - id: b186a22e-0d97-49a5-9f37-ff1b5b255c51
                  name: '2021-08-01'
                - id: 2098d6e6-8f8d-4d4c-886c-fb66837f7024
                  name: '2021-08-08'
        '400':
          description: Returned when the request body is not in the appropriate format. The response body contains error details.
  /v1/disbursements/{disbursementId}/transactions:
    get:
      operationId: ListDisbursementTransactions
      summary: Disbursement transactions
      description: Gets the list of transactions associated with the given disbursement.
      parameters:
      - name: disbursementId
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier of the disbursement
      - name: payment_configuration_id
        in: query
        required: true
        schema:
          type: string
        description: The ID of the payment configuration to be used to process this request.
      - name: page
        in: query
        required: true
        schema:
          type: integer
        description: The page number for results. Page size is 1,000.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains a list of transactions for the
            given disbursement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisbursementTransactionListRead'
              example:
                count: 1
                value:
                - additional_fee: 25
                  amount: 1000
                  net_amount: 0
                  application: Payments API
                  billing_info:
                    city: Charleston
                    country: US
                    post_code: '29492'
                    state: SC
                    street: 2000 Daniel Island Drive
                  comment: Recurring donation
                  credit_card:
                    card_type: Visa
                    exp_month: 2
                    exp_year: 1985
                    last_four: '1111'
                    name: Blackbaud
                    pay_pal_funding_source: Unknown
                  currency: USD
                  disbursement_status: NotDisbursable
                  donor_ip_address: 192.168.0.1
                  fraud_result:
                    anonymous_proxy_result: NotProcessed
                    bin_and_ip_country_result: NotProcessed
                    high_risk_country_result: NotProcessed
                    result_code: NotProcessed
                    risk_score: 0
                    risk_threshold: 0
                    velocity_result: NotProcessed
                  id: 92844827-5b74-40db-907f-480b13242eb5
                  is_live: false
                  state: Processed
                  token: 00000000-0000-0000-0000-000000000000
                  transaction_date: '2018-01-31T11:07:12Z'
                  transaction_type: CardNotPresent
                  total_fees: 0
                  authorization_code: '123456'
                  transaction_category: donation
        '400':
          description: Returned when the request body is not in the appropriate format. The response body contains error details.
  /v1/grants:
    post:
      operationId: CreateGrant
      summary: Grant (PREVIEW)
      description: 'Creates a grant.


        ***This endpoint is in PREVIEW and may be subject to change.***'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantAdd'
            example:
              amount: 15000
              currency: USD
              recipient_id: 37d0ae03-c6f8-4e3c-b361-fb1f38454dbe
              funding_source_id: 47cd0d6f-d3d6-47d1-99af-eb0fc0b38a17
              grant_date: '2026-08-18T10:08:33Z'
