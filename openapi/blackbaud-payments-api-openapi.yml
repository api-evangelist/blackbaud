  /v1/paymentconfigurations:
    get:
      operationId: ListPaymentConfiguration
      summary: Payment configuration list
      description: Returns a set of payment configurations.
      parameters:
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
          default: 'false'
        description: True to include payment configurations whose status is inactive.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains a set of payment configurations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentConfigurationListRead'
              example:
                count: 1
                value:
                - active: true
                  avs_level: Medium
                  csc_level: Full
                  currency: USD
                  id: 19761b45-9295-4a5c-aa26-c754200cd90f
                  name: Blackbaud Payment Configuration
                  process_mode: Test
                  supported_cards:
                  - Discover
                  - MasterCard
                  - Visa
                  use3ds: false
        '400':
          description: Returned when the request body is not in the appropriate format. The response body contains error details.
  /v1/paymentconfigurations/{payment_configuration_id}:
    get:
      operationId: GetPaymentConfiguration
      summary: Payment configuration
      description: Returns information about a payment configuration.
      parameters:
      - name: payment_configuration_id
        in: path
        required: true
        schema:
          type: string
        description: The identifier for the payment configuration.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains payment configuration details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentConfigurationRead'
              example:
                active: true
                avs_level: Medium
                csc_level: Full
                currency: USD
                id: 19761b45-9295-4a5c-aa26-c754200cd90f
                name: Blackbaud Payment Configuration
                process_mode: Test
                supported_cards:
                - Discover
                - MasterCard
                - Visa
                use3ds: false
        '400':
          description: Returned when the request body is not in the appropriate format. The response body contains error details.
        '404':
          description: Returned when the specified payment configuration is not found. The response body contains error details.
  /v1/readers:
    get:
      operationId: GetReaderList
      summary: Reader list
      description: Returns the list of readers.
      parameters:
      - name: payment_configuration_id
        in: query
        required: true
        schema:
          type: string
        description: The identifier for the payment configuration.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the list of readers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderListRead'
              example:
                count: 1
