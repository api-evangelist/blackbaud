      - payment_configuration_id
      type: object
      properties:
        payment_configuration_id:
          minLength: 1
          type: string
          description: The unique identifier of the payment configuration.
        amount:
          maximum: 2147483647
          minimum: 50
          type: integer
          description: 'The monetary amount of the terminal transaction. Measured in cents: 1000 = $10.00.'
          format: int32
        reference_id:
          type: string
          description: The id of the existing payment intent.
          nullable: true
        contact_info:
          $ref: '#/components/schemas/TerminalContactInfoAdd'
      additionalProperties: false
      description: Defines the data model for the terminal transaction request.
    TerminalTransactionRead:
      type: object
      properties:
        transaction:
          $ref: '#/components/schemas/TransactionRead'
        terminal:
          $ref: '#/components/schemas/TerminalRead'
      additionalProperties: false
      description: Defines the data model for the terminal transaction endpoint response.
    TransactionAdd:
      required:
      - amount
      - payment_configuration_id
      type: object
      properties:
        amount:
          type: integer
          description: 'The monetary amount of the transaction. Measured in cents: 1000 = $10.00.'
          format: int32
        authorize_only:
          type: boolean
          description: Only authorize the transaction. This parameter does not apply to direct debit transactions.
          nullable: true
        billing_contact:
          $ref: '#/components/schemas/BillingInfoAdd'
        card_token:
          type: string
          description: The <a href="https://en.wikipedia.org/wiki/Universally_unique_identifier">unique identifier</a> for
            the stored credit card whose PAN you wish to use for this transaction.
          format: uuid
        comment:
          type: string
          description: A free form comment for this transaction.
          nullable: true
        credit_card:
          $ref: '#/components/schemas/CreditCardAdd'
        csc:
          type: string
          description: 'The Card Security Code (CVV2) for the card whose PAN was specified in the ```credit_card``` parameter.

            This parameter should be omitted when using a payment configuration that does not perform CSC check.'
          nullable: true
        direct_debit_account_info:
          $ref: '#/components/schemas/DirectDebitAccountInfo'
        direct_debit_account_token:
          type: string
          description: The <a href="https://en.wikipedia.org/wiki/Universally_unique_identifier">unique identifier</a> for
            the stored debit account info that can be used for the transaction.
          format: uuid
        donor_ip:
          type: string
          description: 'The routable IPv4 address of the person with the credit card to process.

            <b>*Important:*</b> Treat this parameter as required for all web applications because it is necessary for fraud
            screening.

            Without it, you may expose customers to fraudulent transactions, and we may revoke your application''s access
            to the Payments API.'
          nullable: true
        email:
          type: string
          description: The email address of the donor.
          nullable: true
        extend_capture_period:
          type: boolean
          description: Allow up to seven days for an authorized transaction created with a card token or credit card to be
            captured before it is automatically voided. Uncaptured transactions are automatically voided at midnight ET by
            default.
          nullable: true
        is_backoffice:
          type: boolean
          description: Optional parameter that requests exemption from <a href="https://developer.blackbaud.com/skyapi/apis/payments/key-considerations#strong-customer-authentication">Strong
            Customer Authentication</a>.
          nullable: true
          x-bb-suppressions:
          - parameter_property_name
        payment_configuration_id:
          type: string
          description: "The unique identifier for the payment configuration to be used when processing this request.\n   \
            \         \nPayment configurations can be retrieved using the <a href=\"https://developer.sky.blackbaud.com/docs/services/payments/operations/ListPaymentConfiguration\"\
            >GET Payment Configuration list endpoint</a>."
          format: uuid
        phone:
          type: string
          description: The phone number of the donor.
          nullable: true
        tokenize:
          type: boolean
          description: 'Optionally tokenize payment information if ```credit_card``` or ```direct_debit_account_info``` parameters
            are available.

            For recurring transactions, must be set to <strong>true</strong>.

            For credit cards, tokens are registered in Credit Card Updater.'
        transaction_id:
          type: string
          description: Optional unique identifier for this transaction. If null or empty, a GUID is auto-generated.
          format: uuid
          nullable: true
        transaction_category:
          type: string
          description: 'The category for this transaction (ex: "donation").'
          nullable: true
      additionalProperties: false
      description: 'Note: Either the credit_card, card_token, direct_debit_account_info or direct_debit_account_token parameter
        must be specified. <b>direct_debit_account_info</b> parameter is only supported for USD accounts.'
    TransactionBatchRowRead:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the transaction record.
          nullable: true
        state:
          $ref: '#/components/schemas/BatchTransactionState'
        gateway_result_message:
          type: string
          description: The gateway result message. Contains data only if transaction record is not processed successfully.
          nullable: true
        authorization_code:
          type: string
          description: The authorization code for the transaction. Contains data only if transaction record is processed successfully.
          nullable: true
        retry_code:
          $ref: '#/components/schemas/RetryCode'
      additionalProperties: false
      description: The result for each transaction record in the batch. Contains data only if the batch's status is Completed
        or CompletedWithErrors.
    TransactionBatchStatusRead:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/BatchStatus'
        records_processed:
          type: integer
          description: The number of transaction records processed in the batch. Contains data only if the batch's status
            is complete.
          format: int32
          nullable: true
        exception_count:
          type: integer
          description: The count of exceptions in the batch. Contains data only if the batch's status is complete.
          format: int32
          nullable: true
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/TransactionBatchRowRead'
          description: The result for each transaction record in the batch. Contains data only if the batch's status is Completed
            or CompletedWithErrors.
          nullable: true
      additionalProperties: false
      description: Defines the status and result of the batch.
    TransactionCapture:
      required:
      - amount
      type: object
      properties:
        amount:
          type: integer
          description: 'The monetary amount to capture. Measured in cents: 1000 = $10.00.'
          format: int32
      additionalProperties: false
      description: Represents the data needed to capture a transaction.
    TransactionRead:
      type: object
      properties:
        account_type:
          type: string
          description: 'The type of account of this transaction. Used for Direct Debit transactions.

            Possible values are Checking, Savings, Corporate checkings, or Corporate savings.'
          nullable: true
        additional_fee:
          type: integer
          description: 'The additional fee amount for this transaction.

            Measured in cents: 1000 = $10.00.'
          format: int32
        amount:
          type: integer
          description: 'The gross amount of this transaction. Measured in cents: 1000 = $10.00.'
          format: int32
        net_amount:
          type: integer
          description: 'The net amount of this transaction after fees. Measured in cents: 1000 = $10.00.'
          format: int32
        application:
          type: string
          description: The calling Application of this transaction.
          nullable: true
        billing_info:
          $ref: '#/components/schemas/BillingInfoRead'
        check_number:
          type: string
          description: The Check Number for the transaction to be processed.
          nullable: true
        comment:
          type: string
          description: The comment on this transaction.
          nullable: true
        credit_card:
          $ref: '#/components/schemas/CreditCardRead'
        currency:
          type: string
          description: The 3 char ISO4217 currency code used for this transaction.
          nullable: true
        disbursement_status:
          type: string
          description: 'The disbursement status of this transaction.

            Possible values are Disbursable, DoNotDisburse, and Disbursed.'
          nullable: true
        donor_ip_address:
          type: string
          description: The routable IPv4 address where this transaction originated.
          nullable: true
        email_address:
          type: string
          description: The account holder’s email address.
          nullable: true
        fraud_result:
          $ref: '#/components/schemas/FraudResultRead'
        id:
          type: string
          description: The unique identifier of this transaction.
          format: uuid
        reference_transaction_id:
          type: string
          description: 'The unique identifier of the original transaction associated with a refund or dispute.

            Present when the specified transaction_id is a refund, dispute, or direct debit return.'
          format: uuid
          nullable: true
        related_transactions:
          type: array
          items:
            $ref: '#/components/schemas/RelatedTransactionRead'
          description: An array of related transactions for this transaction.
          nullable: true
        is_live:
          type: boolean
          description: True if this is not a test or demo transaction.
          x-bb-suppressions:
          - parameter_property_name
        pending_date:
          type: string
          description: The date by which decision could be made for the transaction. It will be approved or declined.
          nullable: true
        phone_number:
          type: string
          description: The account holder’s phone number.
          nullable: true
        routing_number:
          type: string
          description: The Routing Number for the transaction.
          nullable: true
        state:
          $ref: '#/components/schemas/TransactionState'
        terminal_type:
          type: string
          description: 'Used for card present transactions to indicate the type of terminal used.

            Possible values are Unknown, AutomatedDispensingMachine, SelfServiceTerminal, LimitedAmountTerminal, MobilePayDevice,
            ChipAndPIN, or VerifoneP400'
          nullable: true
        token:
          type: string
          description: The stored token. Available only on creation of Transaction record.
          format: uuid
        transaction_date:
          type: string
          description: The date and time of this transaction.
          nullable: true
        transaction_type:
          type: string
          description: "The transaction type of this transaction. \nPossible values are CardNotPresent, CardPresent, DirectDebit,\
            \ TransactionBatch, DirectDebitBatch, OfflineBatch, Refund, DirectDebitRefund, ChargeBack, or DirectDebitReturn."
          nullable: true
        application_fee:
          type: integer
          description: 'The application fee amount for this transaction.

            Measured in cents: 1000 = $10.00.'
          format: int32
          nullable: true
        total_fees:
          type: integer
          description: 'The total fees for this transaction.

            Measured in cents: 1000 = $10.00.'
          format: int32
        authorization_code:
          type: string
          description: The authorization code for the transaction.
          nullable: true
        transaction_category:
          type: string
          description: 'The category for this transaction (ex: "donation").'
          nullable: true
        pay_pal_reference_id:
          type: string
          description: A reference number from PayPal for the transaction.
          nullable: true
        gateway_result:
          $ref: '#/components/schemas/GatewayResultRead'
        grant_read:
          $ref: '#/components/schemas/GrantRead'
      additionalProperties: false
      description: Represents a created transaction.
    TransactionState:
      enum:
      - Unknown
      - Processed
      - Failed
      - Refunded
      - Pending
      - Authorized
      - Voided
      - Created
      type: string
      description: The current processing state of the transaction.<p>Available values:</p><ul><li><i>Unknown</i></li><li><i>Processed</i></li><li><i>Failed</i></li><li><i>Refunded</i></li><li><i>Pending</i></li><li><i>Authorized</i></li><li><i>Voided</i></li><li><i>Created</i></li></ul>
    UncapturedTerminalTransactionListRead:
      type: object
      properties:
        count:
          type: integer
          description: The number of uncaptured terminal transactions in the list.
          format: int32
        value:
          type: array
          items:
            $ref: '#/components/schemas/UncapturedTerminalTransactionRead'
          description: The list of uncaptured terminal transactions.
          nullable: true
      additionalProperties: false
      description: Defines the data model for a list of uncaptured terminal transactions.
    UncapturedTerminalTransactionRead:
      type: object
      properties:
        reference_id:
          type: string
          description: The id of the payment intent.
          nullable: true
        amount:
          type: integer
          description: 'The monetary amount of the terminal transaction. Measured in cents: 1000 = $10.00.'
          format: int32
        currency:
          type: string
          description: The 3 char ISO4217 currency code used for the terminal transaction.
          nullable: true
        id:
          type: string
          description: The unique identifier of the terminal transaction. If this value is blank, call the <a href="https://developer.sky.blackbaud.com/docs/services/payments/operations/CreateTerminalTransaction">CreateTerminalTransaction</a>
            endpoint with the reference_id to create a new terminal transaction.
          nullable: true
      additionalProperties: false
      description: Defines the data model for an uncaptured terminal transaction.
    UsBankAccountDetails:
      required:
      - account_number
      - account_type
      - routing_number
      type: object
      properties:
        account_number:
          minLength: 1
          type: string
          description: The account number of the bank account.
        account_type:
