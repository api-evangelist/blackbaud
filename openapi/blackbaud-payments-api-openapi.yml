  /payments/search:
    get:
      operationId: SearchRevenuePayments
      summary: Search for revenue payments
      description: Search for a payment.
      parameters:
      - name: payment_source
        in: query
        required: false
        schema:
          type: string
        description: reference
      - name: payment_date
        in: query
        required: false
        schema:
          type: string
        description: Format - date (as full-date in RFC3339). payment date from
      - name: amount
        in: query
        required: false
        schema:
          type: number
        description: amount
      - name: payment_method
        in: query
        required: false
        schema:
          type: string
          enum:
          - Cash
          - Check
          - Credit card
          - Other
        description: payment method
      - name: deposit_number
        in: query
        required: false
        schema:
          type: string
        description: deposit number
      - name: post_status
        in: query
        required: false
        schema:
          type: string
          enum:
          - Not posted
          - Do not post
        description: post status
      - name: post_date
        in: query
        required: false
        schema:
          type: string
        description: Format - date (as full-date in RFC3339). post date
      - name: exclude_linked_payments
        in: query
        required: false
        schema:
          type: boolean
        description: exclude linked payments
      - name: application
        in: query
        required: false
        schema:
          type: string
          enum:
          - Donation
          - Event registration
          - Pledge
          - Recurring gift
          - Other
          - Matching gift claim
          - Grant award
          - Order
          - Miscellaneous
        description: application
      - name: pd_account_system
        in: query
        required: false
        schema:
          type: string
        description: account system SimpleDataListID=9eca5ee4-3b6b-4069-a4f3-9d7a832b3aff.
      - name: num_systems
        in: query
        required: false
        schema:
          type: integer
        description: number of account systems
      - name: payment_end_date
        in: query
        required: false
        schema:
          type: string
        description: Format - date (as full-date in RFC3339). to
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Limits the number of records to return.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of result entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenuePaymentSearchCollection'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to view the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Payments
    servers:
    - url: https://api.sky.blackbaud.com/alt-revmg
