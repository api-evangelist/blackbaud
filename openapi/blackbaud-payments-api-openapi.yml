components:
  schemas:
    AccountType:
      enum:
      - Checking
      - Savings
      - CorporateChecking
      - CorporateSavings
      type: string
      description: The account type. Possible values are Checking, Savings, Corporate checking, or Corporate savings.<p>Available
        values:</p><ul><li><i>Checking</i></li><li><i>Savings</i></li><li><i>CorporateChecking</i></li><li><i>CorporateSavings</i></li></ul>
    AcssDebitDetails:
      required:
      - account_number
      - institution_number
      - transit_number
      type: object
      properties:
        account_number:
          minLength: 1
          type: string
          description: The account number of the bank account.
        institution_number:
          minLength: 1
          type: string
          description: Instituition number of the bank account.
        transit_number:
          minLength: 1
          type: string
          description: Transit number of the bank account.
      additionalProperties: false
      description: Acss bank account details
    AcssDebitRead:
      type: object
      properties:
        account_number_last_four:
          type: string
          description: The last four digits of the bank account number.
          nullable: true
        transit_number:
          type: string
          description: The transit number of the bank account.
          nullable: true
        institution_number:
          type: string
          description: The institution number of the bank account.
          nullable: true
      additionalProperties: false
      description: ACSS debit bank account details
    AuBecsDebitDetails:
      required:
      - account_number
      - bsb_number
      type: object
      properties:
        account_number:
          minLength: 1
          type: string
          description: The account number of the bank account.
        bsb_number:
          minLength: 1
          type: string
          description: Bank-State-Branch number of the bank account.
      additionalProperties: false
      description: AU becs bank account details
    AuBecsDebitRead:
      type: object
      properties:
        account_number_last_four:
          type: string
          description: The last four digits of the bank account number.
          nullable: true
        bsb_number:
          type: string
          description: Bank-State-Branch number of the bank account.
          nullable: true
      additionalProperties: false
      description: AU becs bank account details
    BacsDebitDetails:
      required:
      - account_number
      - sort_code
      type: object
      properties:
        account_number:
          minLength: 1
          type: string
          description: The account number of the bank account.
        sort_code:
          minLength: 1
          type: string
          description: Sort code of the bank account.
      additionalProperties: false
      description: UK bacs bank account details
    BacsDebitRead:
      type: object
      properties:
        account_number_last_four:
          type: string
          description: The last four digits of the bank account number.
          nullable: true
        sort_code:
          type: string
          description: The sort code of the bank account.
          nullable: true
      additionalProperties: false
      description: UK bacs bank account details
    BatchStatus:
      enum:
      - UploadingData
      - SendingDataToGateway
      - GatewayProcessing
      - GatewayProcessingComplete
      - RetrievingDataFromGateway
      - Completed
      - CompletedWithErrors
      - NewBatch
      - Unknown
      type: string
      description: 'The status of the batch.

        Possible values are Uploading data, Sending data to gateway, Gateway processing, Gateway processing complete, Retrieving
        data from gateway, Completed, Completed with errors, New batch, or Unknown.<p>Available values:</p><ul><li><i>UploadingData</i>
        - The client is currently sending data to the Blackbaud Payment Service.</li><li><i>SendingDataToGateway</i> - The
        Blackbaud Payment Service is uploading data to the selected gateway for processing.</li><li><i>GatewayProcessing</i>
        - The selected gateway is currently processing the uploaded transaction data.</li><li><i>GatewayProcessingComplete</i>
        - The gateway has completed processing the uploaded transaction data and it is available to be downloaded.</li><li><i>RetrievingDataFromGateway</i>
        - The Blackbaud Payment Service is downloading the processed transaction data from the selected gateway.</li><li><i>Completed</i>
        - All processing for this batch of transactions is complete and no errors have been encountered.</li><li><i>CompletedWithErrors</i>
        - All processing for this batch of transactions is complete and one or more errors have been encountered.</li><li><i>NewBatch</i>
        - A transaction batch has been created with the Blackbaud Payment Service, but no data has been received.</li><li><i>Unknown</i>
        - The batch is in an unknown status.</li></ul>'
    BatchTransactionState:
      enum:
      - Failed
      - Pending
      - Processed
      - Refunded
      - Unknown
      - Voided
      type: string
      description: The current processing state of the batch transaction.<p>Available values:</p><ul><li><i>Failed</i> - The
        transaction failed. See gateway_result_message for the error message.</li><li><i>Pending</i> - The transaction has
        been submitted for processing and is in a gateway pending state. Applies to CAD, GBP and AUD direct debit payments
        only.</li><li><i>Processed</i> - The transaction processed successfully. Applies to card or US ACH payment (not used
        for non-US direct debit).</li><li><i>Refunded</i> - The transaction is refunded.</li><li><i>Unknown</i> - Handles
        unknown transaction status.</li><li><i>Voided</i> - The transaction was voided before being submitted for processing.
        Applies to direct debit payments only.</li></ul>
    BillingAddressAdd:
      type: object
      properties:
        address_block:
          type: string
          description: The account holder’s billing address. <b>Note:</b> This property is required for <b>GBP</b> accounts.
          nullable: true
        city:
          type: string
          description: The account holder’s billing city. <b>Note:</b> This property is required for <b>GBP</b> accounts.
          nullable: true
        state:
          type: string
          description: The account holder’s billing state - ISO standard.
          nullable: true
        country:
