              is_anonymous: false
              donor:
                email: james.grantor@example.com
                phone: 111-555-3333
                address: 2000 Daniel Island Drive
                city: Charleston
                country: US
                first_name: James
                last_name: Grantor
                post_code: '29442'
                state: SC
        description: The request body for adding a Grant.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the created Grant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionRead'
