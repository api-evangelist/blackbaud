  /v1/transactions/terminal:
    post:
      operationId: CreateTerminalTransaction
      summary: Terminal transaction (PREVIEW)
      description: 'Create a terminal transaction.


        ***This endpoint is in PREVIEW and may be subject to change.***'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminalTransactionAdd'
            example:
              payment_configuration_id: 646acda6-e199-4ae2-b5a3-f6e06ec940a3
              amount: 2500
              contact_info:
                first_name: John
                last_name: Doe
                email: john.doe@example.com
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the terminal transaction along with the terminal information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalTransactionRead'
              example:
                transaction:
                  additional_fee: 25
                  amount: 1000
                  net_amount: 0
                  application: Payments API
                  billing_info:
                    city: Charleston
                    country: US
                    post_code: '29492'
                    state: SC
                    street: 2000 Daniel Island Drive
                  comment: Recurring donation
                  credit_card:
                    card_type: Visa
                    exp_month: 2
                    exp_year: 1985
                    last_four: '1111'
                    name: Blackbaud
                    pay_pal_funding_source: Unknown
                  currency: USD
                  disbursement_status: NotDisbursable
                  donor_ip_address: 192.168.0.1
                  fraud_result:
                    anonymous_proxy_result: NotProcessed
                    bin_and_ip_country_result: NotProcessed
                    high_risk_country_result: NotProcessed
                    result_code: NotProcessed
                    risk_score: 0
                    risk_threshold: 0
                    velocity_result: NotProcessed
                  id: 92844827-5b74-40db-907f-480b13242eb5
                  is_live: false
                  state: Created
                  token: 00000000-0000-0000-0000-000000000000
                  transaction_date: '2018-01-31T11:07:12Z'
                  transaction_type: CardPresent
                  total_fees: 0
                  authorization_code: '123456'
                  transaction_category: donation
                terminal:
                  session_key: pi_***_secret_***
        '400':
          description: Returned when the request body is not in the appropriate format. The response body contains error details.
      tags:
      - Transactions
    servers:
    - url: https://api.sky.blackbaud.com/payments
  /v1/transactions/terminal/uncaptured:
    get:
      operationId: GetUncapturedTerminalTransactionList
      summary: Uncaptured terminal transaction list (PREVIEW)
      description: 'Returns information about a list of terminal transactions that require capture.


        ***This endpoint is in PREVIEW and may be subject to change.***'
      parameters:
      - name: payment_configuration_id
        in: query
        required: true
        schema:
          type: string
        description: The identifier of the payment configuration.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the list of uncaptured terminal transactions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UncapturedTerminalTransactionListRead'
              example:
                count: 1
                value:
                - reference_id: pi_12345
                  amount: 2500
                  currency: usd
                  id: 0edd41ee-db5f-438e-97eb-7aea1ac16724
        '400':
          description: Returned when the payment configuration id is invalid or not in the appropriate format. The response body contains error details.
        '403':
          description: Returned when the requested action is forbidden. The response body contains error details.
      tags:
      - Transactions
    servers:
    - url: https://api.sky.blackbaud.com/payments
  /v1/transactions/{transaction_id}/capture:
    post:
      operationId: CaptureTransaction
      summary: Transaction capture
      description: Captures an authorized transaction.
      parameters:
      - name: transaction_id
        in: path
        required: true
        schema:
          type: string
        description: The identifier of the authorized transaction you would like to capture.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionCapture'
            example:
              amount: 1000
        description: Information about the transaction capture.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains transaction details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionRead'
              example:
                additional_fee: 25
                amount: 1000
                net_amount: 925
                application: Payments API
                billing_info:
                  city: Charleston
                  country: US
                  post_code: '29492'
                  state: SC
                  street: 2000 Daniel Island Drive
                comment: Recurring donation
                credit_card:
                  card_type: Visa
                  exp_month: 2
                  exp_year: 1985
                  last_four: '1111'
                  name: Blackbaud
                  pay_pal_funding_source: Unknown
                currency: USD
                disbursement_status: NotDisbursable
                donor_ip_address: 192.168.0.1
                fraud_result:
                  anonymous_proxy_result: NotProcessed
                  bin_and_ip_country_result: NotProcessed
                  high_risk_country_result: NotProcessed
                  result_code: NotProcessed
                  risk_score: 0
                  risk_threshold: 0
                  velocity_result: NotProcessed
                id: 92844827-5b74-40db-907f-480b13242eb5
                related_transactions:
                - id: 6fef1d90-60f2-43ea-aa96-b7562286c57d
                  transaction_type: Refund
                is_live: false
                state: Processed
                token: 00000000-0000-0000-0000-000000000000
                transaction_date: '2018-01-31T11:07:12Z'
                transaction_type: CardNotPresent
                total_fees: 75
                authorization_code: '123456'
                transaction_category: donation
                gateway_result:
                  message: Gateway declined
        '400':
          description: Returned when the request body is not in the appropriate format or the transaction is not able to be captured. The response body contains error details.
        '404':
          description: Returned when the specified transaction is not found. The response body contains error details.
        '409':
          description: Returned when the request is received while the transaction is currently being processed. The response body contains error details.
        '201':
          description: Returned when the transaction is successfully captured but an unexpected problem occurs retrieving the full details of the transaction. The response body will be null.
      tags:
      - Transactions
    servers:
    - url: https://api.sky.blackbaud.com/payments
components:
  schemas:
    TransactionSummary:
      type: object
      properties:
        transaction_date:
          type:
          - string
          - 'null'
          description: The transaction date.
          format: date
        amount:
          type:
          - number
          - 'null'
          description: The transaction amount.
          format: decimal
        transaction_type:
          type:
          - string
          - 'null'
          description: The transaction type method.
        post_date:
          type:
          - string
          - 'null'
          description: The transaction post date.
          format: date
        post_status:
          $ref: '#/components/schemas/FaPostStatus'
        description:
          type:
          - string
          - 'null'
          description: The transaction description.
        added_by:
          type:
          - string
          - 'null'
          description: The person who created the transaction.
        date_added:
          type:
          - string
          - 'null'
          description: The transaction creation date.
          format: date-time
        modified_by:
          type:
          - string
          - 'null'
          description: The person who modified the transaction.
        date_modified:
          type:
          - string
          - 'null'
          description: The transaction modified date.
          format: date-time
        disposal_method:
          type:
          - string
          - 'null'
          description: The transaction disposal method.
        disposal_date:
          type:
          - string
          - 'null'
          description: The transaction disposal date.
          format: date-time
      additionalProperties: false
      description: Response contract for transaction summary.
    DomainErrorMessage:
      type: object
      properties:
        Error:
          type:
          - string
          - 'null'
          description: The error message.
        Details:
          type:
          - array
          - 'null'
          items:
            type: string
          description: The error details.
        ErrorPath:
          type:
          - string
          - 'null'
          description: The error path.
      additionalProperties: false
      description: Contract for domain error message.
    TransactionSummaryApiCollection:
      type: object
      properties:
        count:
          type: integer
          description: The count.
          format: int32
        value:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TransactionSummary'
          description: The value.
      additionalProperties: false
      description: Contract for collection Response
    TransactionAdjustmentSummary:
      type: object
      properties:
        adjustment_id:
          type: integer
          description: The identifier for the invoice adjustment.
          format: int32
        post_status:
          $ref: '#/components/schemas/FaPostStatus'
        post_date:
          type:
          - string
          - 'null'
          description: The post date for the invoice adjustment.
          format: date-time
        adjustment_date:
          type:
          - string
          - 'null'
          description: The adjustment date for the invoice adjustment.
          format: date-time
        reason:
          type:
          - string
          - 'null'
          description: The reason for the invoice adjustment.
        notes:
          type:
          - string
          - 'null'
          description: The notes for the invoice adjustment.
      additionalProperties: false
      description: Contract for transaction adjustment summary.
    CustomFieldDataType:
      title: CustomFieldDataType
      enum:
      - Text
      - Number
      - DateTime
      - Currency
      - Boolean
      - Table
      - FuzzyDate
      type: string
      description: Contract for custom field data types.
    DistributionTypeCode:
      title: DistributionTypeCode
      enum:
      - Debit
      - Credit
      type: string
      description: The distribution type codes, debit or credit.
    BasicErrorMessage:
      type: object
      properties:
        Error:
          type:
          - string
          - 'null'
          description: The error message.
      additionalProperties: false
      description: Contract for basic error message details.
    CustomFieldResponse:
      type: object
      properties:
        field_name:
          type:
          - string
          - 'null'
          description: The name of the custom field.
        value:
          type:
          - string
          - 'null'
          description: The value of the custom field.
        comments:
          type:
          - string
          - 'null'
          description: The description of the custom field.
        type:
          $ref: '#/components/schemas/CustomFieldDataType'
        is_required:
          type: boolean
          description: Required status of the custom field.
        date:
          type:
          - string
          - 'null'
          description: The date on this custom field.
          format: date-time
      additionalProperties: false
      description: Custom field definition.
    Distribution:
      required:
      - distribution_splits
      type: object
      properties:
        distribution_id:
          type: integer
          description: The distribution identifier.
          format: int32
        distribution_splits:
          type: array
          items:
            $ref: '#/components/schemas/DistributionSplit'
          description: The distribution split.
        amount:
          type: number
          description: The distribution amount.
          format: decimal
        description:
          type:
          - string
          - 'null'
          description: The description for this distribution.
        account_number:
          type:
          - string
          - 'null'
          description: The account number for this distribution.
        type_code:
          $ref: '#/components/schemas/DistributionTypeCode'
        custom_fields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CustomFieldResponse'
          description: The custom fields of the distribution.
      additionalProperties: false
      description: Distribution.
    FaPostStatus:
      title: FaPostStatus
      enum:
      - DoNotPost
      - NotYetPosted
      - Posted
      type: string
      description: The enum for fixed assets post status.
    DistributionSplit:
      required:
      - transaction_code_values
      type: object
      properties:
        distribution_split_id:
          type: integer
          description: The distribution split identifier.
          format: int32
        ui_project_id:
          type:
          - string
          - 'null'
          description: The user-visible identifier of the project.
        transaction_code_values:
          type: array
          items:
            $ref: '#/components/schemas/TransactionCodeValue'
          description: The distribution transaction code values. The values should be in the same order as the codes defined in the database.
        amount:
          type:
          - number
          - 'null'
          description: The distribution journal entry amount. Only one of Amount or Percent can be specified.
          format: decimal
        percent:
          type:
          - number
          - 'null'
          description: The distribution journal entry amount percentage. Only one of Amount or Percent can be specified.
          format: decimal
        account_class:
          type:
          - string
          - 'null'
          description: The account class for this distribution split.
      additionalProperties: false
      description: Contract for Journal Entry Distribution Split.
    TransactionCodeValue:
      required:
      - id
      - value
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          description: The transaction code name.
        value:
          type: string
          description: The transaction code value.
        id:
          type: integer
          description: The transaction code value ID.
          format: int32
        inactive:
          type: boolean
          description: Indicate if record is inactive or not.
      additionalProperties: false
      description: The distribution transaction code values. The values should be in the same order as the codes defined in the database.
    TransactionDetail:
      type: object
      properties:
        transaction_id:
          type: integer
          description: The transaction identifier.
          format: int32
        transaction_date:
          type:
          - string
          - 'null'
          description: The date of the transaction.
          format: date-time
        amount:
          type:
          - number
          - 'null'
          description: The amount of the transaction.
          format: decimal
        transaction_type:
          type:
          - string
          - 'null'
          description: The transaction type method for transaction.
        transaction_number:
          type: integer
          description: The number for the transaction.
          format: int32
        status:
          $ref: '#/components/schemas/FaPostStatus'
        number:
          type: integer
          description: The number of transactions.
          format: int32
        asset_description:
          type:
          - string
          - 'null'
          description: The description for the asset.
        post_date:
          type:
          - string
          - 'null'
          description: The post date of the transaction.
          format: date-time
        period_start_date:
          type:
          - string
          - 'null'
          description: The period start date of the transaction.
          format: date-time
        period_end_date:
          type:
          - string
          - 'null'
          description: The period end date of the transaction.
          format: date-time
        disposal_method:
          type:
          - string
          - 'null'
          description: The disposal method for the transaction.
