openapi: 3.2.0
info:
  title: Blackbaud Transactions API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Transactions across 2 of this provider''s published API definitions: blackbaud-fixed-assets-api-openapi.yml, blackbaud-payments-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/fixedassets
- url: https://api.sky.blackbaud.com/payments
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Transactions
paths:
  /v1/transactions:
    get:
      operationId: ListTransactions
      summary: Get transaction list
      description: Returns a paginated list of transactions.
      parameters:
      - name: search_text
        in: query
        required: false
        schema:
          type: string
        description: 'Text to match.

          Can match transaction number.'
      - name: asset_description
        in: query
        required: false
        schema:
          type: string
        description: Filter the results by asset description.
      - name: post_status
        in: query
        required: false
        schema:
          type: string
          enum:
          - DoNotPost
          - NotYetPosted
          - Posted
        description: Filter the results using the transaction post status.
      - name: transaction_type
        in: query
        required: false
        schema:
          type: string
          enum:
          - AccumulatedDepreciation
          - AnnualDepreciation
          - AssetAcquisition
          - AssetDisposal
          - AssetImprovement
          - PeriodDepreciation
          - YTDDepreciation
        description: Filter the results using the transaction type.
      - name: to_date
        in: query
        required: false
        schema:
          type: string
        description: Filter the transactions before a certain date.
      - name: from_date
        in: query
        required: false
        schema:
          type: string
        description: Filter the transactions after a certain date.
      - name: date_added
        in: query
        required: false
        schema:
          type: string
        description: Filter the results added on or after the specified date.
      - name: added_by
        in: query
        required: false
        schema:
          type: string
        description: Filter the results by who added the transaction.
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: Filter the results modified on or after the specified date.
      - name: last_modified_by
        in: query
        required: false
        schema:
          type: string
        description: Filter the results by who last modified the transaction.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: 'The number of records to skip.

          For use with pagination.'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: "The number of records to return.\nThe default is 100. \nThe maximum allowed value is 500."
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the list of transactions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionSummaryApiCollection'
              example:
                count: 150
                value:
                - transaction_date: '2024-01-10T10:43:21Z'
                  amount: 150
                  transaction_type: Period depreciation
                  post_date: '2024-01-10T10:43:21Z'
                  post_status: NotYetPosted
                  description: Campus
                  added_by: Supervisor
                  date_added: '2024-01-10T10:43:21Z'
                  modified_by: Supervisor
                  date_modified: '2024-01-10T10:43:21Z'
                  disposal_method: Test
                  disposal_date: '2024-01-10T10:43:21Z'
                - transaction_date: '2024-01-10T10:43:21Z'
                  amount: 151
                  transaction_type: Period depreciation
                  post_date: '2024-01-10T10:43:21Z'
                  post_status: NotYetPosted
                  description: Campus
                  added_by: Supervisor
                  date_added: '2024-01-10T10:43:21Z'
                  modified_by: Supervisor
                  date_modified: '2024-01-10T10:43:21Z'
                  disposal_method: Test
                  disposal_date: '2024-01-10T10:43:21Z'
        '400':
          description: Returned when the request is not in the correct format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Invalid Request
                Details:
                - The value 'fake' is not valid for transaction_status.
        '403':
          description: Returned when the user does not have permission to view transactions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Transactions
    post:
      operationId: CreateTransaction
      summary: Transaction
      description: Create a transaction.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionAdd'
        description: An object that represents the transaction to process.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains transaction details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionRead'
              example:
                additional_fee: 25
                amount: 1000
                net_amount: 925
                application: Payments API
                billing_info:
                  city: Charleston
                  country: US
                  post_code: '29492'
                  state: SC
                  street: 2000 Daniel Island Drive
                comment: Recurring donation
                credit_card:
                  card_type: Visa
                  exp_month: 2
                  exp_year: 1985
                  last_four: '1111'
                  name: Blackbaud
                  pay_pal_funding_source: Unknown
                currency: USD
                disbursement_status: NotDisbursable
                donor_ip_address: 192.168.0.1
                fraud_result:
                  anonymous_proxy_result: NotProcessed
                  bin_and_ip_country_result: NotProcessed
                  high_risk_country_result: NotProcessed
                  result_code: NotProcessed
                  risk_score: 0
                  risk_threshold: 0
                  velocity_result: NotProcessed
                id: 92844827-5b74-40db-907f-480b13242eb5
                related_transactions:
                - id: 6fef1d90-60f2-43ea-aa96-b7562286c57d
                  transaction_type: Refund
                is_live: false
                state: Processed
                token: 00000000-0000-0000-0000-000000000000
                transaction_date: '2018-01-31T11:07:12Z'
                transaction_type: CardNotPresent
                total_fees: 75
                authorization_code: '123456'
                transaction_category: donation
                gateway_result:
                  message: Gateway declined
        '400':
          description: Returned when the request body is not in the appropriate format. The response body contains error details.
        '201':
          description: Returned when the transaction is successfully created but an unexpected problem occurs retrieving the full details of the transaction. The response body will be null.
      tags:
      - Transactions
    servers:
    - url: https://api.sky.blackbaud.com/fixedassets
  /v1/transactions/{transaction_id}:
    get:
