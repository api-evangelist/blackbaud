openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: Treasury Bankaccounts API'
  description: This API is used to manage bank accounts and transactions.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/58e3b2880528ab71c796492e
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/treasury/v1
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Bankaccounts
paths:
  /bankaccounts:
    get:
      operationId: ListBankAccounts
      summary: Bank account (List)
      description: Returns a list of bank accounts.
      parameters:
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: 'Represents the number of records to skip.

          For use with pagination.'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: "Represents the number of records to return. \nThe default is 100. \nThe maximum allowed value is 500."
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the list of bank accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection_BankAccount'
              example:
                count: 6
                value:
                - bank_account_id: 7
                  account_name: American Express
                  bank_name: American Express
                  ui_account_id: Amex
                  type: Checking
                  current_balance: 11000
                  status: Open
                  account_number: '8675309'
                - bank_account_id: 5
                  account_name: Money Market
                  bank_name: Bank of America
                  ui_account_id: Money Market
                  type: Other
                  current_balance: 972690
                  status: Open
                  account_number: '8675309'
                - bank_account_id: 1
                  account_name: Operating Account
                  bank_name: Bank of America
                  ui_account_id: Operating
                  type: Checking
                  current_balance: 3488518.45
                  status: Open
                  account_number: '8675309'
                - bank_account_id: 2
                  account_name: Payroll Account
                  bank_name: First Bank
                  ui_account_id: Payroll
                  type: Checking
                  current_balance: 4774241.4
                  status: Open
                  account_number: '8675309'
        '400':
          description: Returned when the request is not in the correct format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Invalid Request
                Details:
                - The value 'fake' is not valid for transaction_status.
                ErrorPath: null
        '403':
          description: Returned when the user does not have permission to view bank accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Bankaccounts
  /bankaccounts/{bank_account_id}:
    get:
      operationId: GetBankAccounts
      summary: Bank account (Get)
      description: Retrieves information about a given bank account.
      parameters:
      - name: bank_account_id
        in: path
        required: true
        schema:
          type: integer
        description: The identifier for the bank account to retrieve.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the list of bank accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection_BankAccountDetail'
              example:
                bank_account_id: 1
                account_name: Operating Account
                bank_name: Bank & Trust
                ui_account_id: Operating
                type: Checking
                current_balance: 123.5
                status: Open
                account_number: '123456789'
                lastReconciledBalance: 100.25
                lastReconciledDate: '2025-01-01T00:00:00Z'
        '400':
          description: Returned when the request is not in the correct format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Invalid Request
                Details:
                - The value 'fake' is not valid for transaction_status.
                ErrorPath: null
        '403':
          description: Returned when the user does not have permission to view bank accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Bankaccounts
  /bankaccounts/{bank_account_id}/adjustmentcategories:
    get:
      operationId: ListAdjusmentCategoriesSingleBankAccount
      summary: Adjustment categories (List)
      description: Returns a list of adjustment categories for a given bank account.
      parameters:
      - name: bank_account_id
        in: path
        required: true
        schema:
          type: integer
        description: The bank account identifier.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains a list of adjustment categories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection_AdjustmentCategory'
              example:
                count: 6
                value:
                - adjustment_category_id: 1
                  category: Beg Balance
                  type: Deposit
                  transfer_to_account_id: 1
                  amount: 25000
                - adjustment_category_id: 2
                  category: PY Transfer
                  type: Transfer Out
                  transfer_to_account_id: 2
                  amount: 2000
                - adjustment_category_id: 3
                  category: Service Fee
                  type: Payment
                  transfer_to_account_id: 3
                  amount: 25
                - adjustment_category_id: 5
                  category: Bank Balancing Corre
                  type: Payment
                  transfer_to_account_id: 5
                  amount: 2437370.66
                - adjustment_category_id: 6
                  category: Bank Reconciliation
                  type: Deposit
                  transfer_to_account_id: 6
                  amount: 1504252.51
                - adjustment_category_id: 9
                  category: deposit test 50
                  type: Deposit
                  transfer_to_account_id: 9
                  amount: 0
        '404':
          description: Returned when the specified bank account could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Bankaccounts
  /bankaccounts/{bank_account_id}/adjustments:
    post:
      operationId: CreateBankAccountAdjustment
      summary: Adjustment (Create)
      description: Creates a new adjustment.
      parameters:
      - name: bank_account_id
        in: path
        required: true
        schema:
          type: integer
        description: The bank account identifier for this adjustment.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdjustment'
            example:
              category: Payment from GL
              number: 1700
              date: '2018-03-20T00:00:00Z'
              amount: 1
              type: Payment
              transfer_to_account: 2
              reference: Adjustment payment
              is_cleared: true
              cleared_date: '2018-02-20T00:00:00Z'
              post_status: NotYetPosted
              post_date: '2018-03-20T00:00:00Z'
              distributions:
              - distribution_id: 0
                amount: 1
                account_number: 01-1000-00
                type_code: Debit
                custom_fields: []
                distribution_splits:
                - distribution_split_id: 0
                  ui_project_id: '1001'
                  transaction_code_values:
                  - name: Jurisdiction
                    value: None
                  - name: Spendable?
                    value: Spendable
                  - name: RE Appeals
                    value: ''
                  - name: Grant
                    value: ''
                  - name: Activities
                    value: ''
                  amount: 1
                  percent: 100
                  account_class: Unrestricted Net Assets
              - distribution_id: 0
                amount: 1
                account_number: 01-1000-00
                type_code: Credit
                custom_fields: []
                distribution_splits:
                - distribution_split_id: 0
                  ui_project_id: '1001'
                  transaction_code_values:
                  - name: Jurisdiction
                    value: None
                  - name: Spendable?
                    value: Spendable
                  - name: RE Appeals
                    value: ''
                  - name: Grant
                    value: ''
                  - name: Activities
                    value: ''
                  amount: 1
                  percent: 100
                  account_class: Unrestricted Net Assets
              interfund_entry_set: '00'
        description: The adjustment to create.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the specified adjustment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedResult_Int32'
              example:
                record_id: 843
        '400':
          description: Returned when the request is not in the correct format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Failed to save {record}
                Details:
                - The total percent distributed must equal 100%.
                ErrorPath: null
        '403':
          description: Returned when the user does not have permission to create an adjustment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
        '404':
          description: Returned when specified bank account could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Bankaccounts
    get:
      operationId: ListAdjustmentsSingleBankAccount
      summary: Adjustments (List)
      description: Returns a list of adjustments.
      parameters:
      - name: bank_account_id
        in: path
        required: true
        schema:
          type: integer
        description: The bank account identifier for this bank account.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: 'Represents the number of records to skip.

          For use with pagination.'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: "Represents the number of records to return. \nThe default is 100. \nThe maximum allowed value is 500."
      - name: transaction_status
