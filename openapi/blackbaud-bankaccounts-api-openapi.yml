          type: string
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the list of bank account deposits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection_AdjustmentSummary'
              example:
                count: 1657
