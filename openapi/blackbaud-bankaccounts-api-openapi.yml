  /bankaccounts/{bank_account_id}/deposits:
    post:
      operationId: CreateDeposit
      summary: Deposit (Create)
      description: Adds a new deposit.
      parameters:
      - name: bank_account_id
        in: path
        required: true
        schema:
          type: integer
        description: The bank account identifier for this deposit.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeposit'
            example:
              number: '843849'
              type: MiscellaneousCashReceipts
              description: Deposit description
              ui_deposit_id: '200'
              projected_count: 2
              projected_amount: 100
              date: '2017-02-08T00:00:00Z'
              post_status: NotYetPosted
              post_date: '2018-02-08T00:00:00Z'
              created_date: '2017-02-08T00:00:00Z'
              payment_methods_allowed:
              - Cash
              transaction_defaults:
                receipt_date: '2017-02-08T00:00:00Z'
                amount: 100
                description: transaction default description
                payment_method: Cash
                category: Grants
        description: The deposit to create.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the ID of the deposit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedResult_Int32'
              example:
                record_id: 843
        '400':
          description: Returned when the request is not in the correct format.
          content:
