tags:
- name: Participantoptions
paths:
  /v1/participantoptions/{option_id}:
    delete:
      operationId: DeleteParticipantOption
      summary: Delete a participant option
      description: Deletes a participant option for a participant.
      parameters:
      - name: option_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the participant option.
      responses:
        '200':
          description: Returned when the operation succeeds.
        '403':
          description: Returned when the user does not have rights to delete the participant option record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Participantoptions-option_id-Delete403ApplicationJsonResponse'
              example:
              - message: The user does not have the necessary permissions for this task.
                error_name: Forbidden
                error_code: 403
                raw_message: The user does not have the necessary permissions for this task.
      tags:
      - Participantoptions
    patch:
      operationId: EditParticipantOption
      summary: Edit a participant option
      description: Edits the details about a participant option.
      parameters:
      - name: option_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the participant option.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditParticipantOption'
            example:
              option_value: Steak dinner
        description: An object that represents the event participant option to edit.
      responses:
        '200':
          description: Returned when the operation succeeds.
        '400':
          description: Returned when the specified request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Participantoptions-option_id-Patch400ApplicationJsonResponse'
              example:
              - message: The request body is not in the appropriate format.
                error_name: BadRequest
                error_code: 400
                raw_message: The request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have rights to modify the participant option record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Participantoptions-option_id-Patch403ApplicationJsonResponse'
              example:
              - message: The user does not have the necessary permissions for this task.
                error_name: Forbidden
                error_code: 403
                raw_message: The user does not have the necessary permissions for this task.
        '404':
          description: Returned when the specified participant option is not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Participantoptions-option_id-Patch404ApplicationJsonResponse'
              example:
              - message: The requested resource could not be found.
                error_name: ResourceNotFound
                error_code: 404
                raw_message: The requested resource could not be found.
      tags:
      - Participantoptions
