paths:
  /mergetwoconstituents:
    post:
      operationId: CreateMergeTwoConstituents
      summary: Create merge two constituents
      description: This operation lets the user merge two selected constituent records.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewConstituentMerge'
            example:
              source_id: ''
              target_id: ''
              config: ''
              delete_source: false
              constituent_inactivity_reason_code: ''
              constituent_inactivity_details: ''
              delete_source_constituent: Delete source constituent
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully creates the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Mergetwoconstituents
    servers:
    - url: https://api.sky.blackbaud.com/alt-conmg
components:
  schemas:
    NewConstituentMerge:
      required:
      - source_id
      - target_id
      - config
      - delete_source
      - delete_source_constituent
      type: object
      properties:
        source_id:
          type: string
          description: The the constituent whose data will be merged into the target constituent..
        target_id:
          type: string
          description: The the constituent record that will represent the consolidated view of the constituent's data after the merge has completed..
        config:
          type: string
          description: The the merge configuration that will be used to merge the two constituents.. This simple list can be queried at https://api.sky.blackbaud.com/alt-adnmg/simplelists/c18b465c-c012-4839-952b-4bb8aae7cb3f.
        delete_source:
          type: boolean
          description: Indicates whether if true then the source constituent will be deleted after the merge operation is complete..
        constituent_inactivity_reason_code:
          type: string
          description: The inactive reason. This simple list can be queried at https://api.sky.blackbaud.com/alt-adnmg/simplelists/71b29b04-d70f-4d38-bab1-e44a2528d0e8.
        constituent_inactivity_details:
          maxLength: 300
          minLength: 0
          type: string
          description: The inactive details.
        delete_source_constituent:
          type: string
          description: The delete source constituent. Available values are <i>delete source constituent</i>, <i>mark source constituent inactive</i>
      additionalProperties: false
      description: CreateMergeTwoConstituents
      example:
        source_id: ''
        target_id: ''
        config: ''
        delete_source: false
        constituent_inactivity_reason_code: ''
        constituent_inactivity_details: ''
        delete_source_constituent: Delete source constituent
      x-display-name: Merge Two Constituents Add Form
