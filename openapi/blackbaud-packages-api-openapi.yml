openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: Fundraising Packages API'
  description: This API manages information contained within the fundraising hierarchy and related entities such as campaigns, funds, and appeals.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/58bdd6c8d7dcde06046081d7
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/fundraising/v1
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Packages
paths:
  /packages:
    get:
      operationId: ListPackages
      summary: Package list
      description: 'Returns a paginated list of packages.


        The default sorting behavior is to list packages in ascending order based on when they were created.


        However, the last_modified parameter overrides the default sorting behavior to list packages in ascending order based on when they were last modified. The last_modified parameter also adds the sort_token parameter to the next_link URL to ensure that packages are stably sorted and that order persists when changes occur while working through a paginated list.


        If the last_modified and date_added parameters are both specified, the sorting behavior is to list packages based on when they were last modified.'
      parameters:
      - name: appeal_id
        in: query
        required: false
        schema:
          type: array
        description: Represents a list of appeal identifiers. Returns packages if any of the specified appeal identifiers match any of the package's associated constituents. For example, "appeal_id=280&amp;appeal_id=1232" returns packages with either "280" or "1232" appeal identifiers.
      - name: date_added
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for packages created on or after the specified date. The filter respects time offsets from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
        description: Set this parameter to "true" to include inactive appeals in the response.
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for packages modified on or after the specified date. The filter respects time offsets from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: sort_token
        in: query
        required: false
        schema:
          type: string
        description: Represents a token filter to provide the next stable-sorted list of packages. This will be provided on the next_link collection response property when last_modified or sort_token filters are specified on the request.
      - name: package_id
        in: query
        required: false
        schema:
          type: array
        description: Represents a list of package identifiers. Returns packages if any of the specified package identifiers match any of their packages.  For example, "package_id=280&amp;package_id=1232" returns packages with either "280" or "1232" package identifiers.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to return. The default is 500. The maximum is 5000.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip. For use with pagination.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a> of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/fundraising#Package">package</a> entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection_PackageRead'
              example:
                count: 17
                next_link: https://api.sky.blackbaud.com/fundraising/v1/packages?offset=3&limit=3
                value:
                - id: '1'
                  appeal_id: '17'
                  date_added: '2000-02-22T13:23:08.413Z'
                  date_modified: '2003-01-15T20:12:12.733Z'
                  default_gift_amount:
                    value: 0
                  description: Newsletter Envelope
                  goal:
                    value: 0
                  inactive: false
                  lookup_id: Newsletter
                  notes: Include special membership forms in the newsletter mailing.  Responses will be marked with NWSLT.
                  recipient_count: 3
                - id: '2'
                  appeal_id: '8'
                  date_added: '2001-12-22T06:21:18.422Z'
                  date_modified: '2004-01-15T20:12:11.133Z'
                  default_gift_amount:
                    value: 0
                  description: Millennium Letter
                  end: '2000-12-31T00:00:00Z'
                  goal:
                    value: 0
                  inactive: false
                  lookup_id: 2000 Letter
                  notes: Millennium Letter from the Director of Development.
                  recipient_count: 0
                  start: '2000-01-01T00:00:00Z'
                - id: '4'
                  appeal_id: '7'
                  date_added: '2004-02-22T13:23:08.413Z'
                  date_modified: '2009-01-15T20:12:12.733Z'
                  default_gift_amount:
                    value: 0
                  description: Electronic Invitation to the Open House
                  goal:
                    value: 0
                  inactive: false
                  lookup_id: eInvite Open House
                  recipient_count: 1
        '400':
          description: Returned when the specified request parameters are not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to view the packages.
      tags:
      - Packages
  /packages/{package_id}:
    get:
      operationId: GetPackage
      summary: Package (Get)
      description: Returns information about the package with the specified ID.
      parameters:
      - name: package_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the package for which information is to be retrieved.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified <a href='https://developer.blackbaud.com/skyapi/api/entity-reference/fundraising#Package'>package</a> entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageRead'
              example:
                id: '2'
                appeal_id: '8'
                default_gift_amount:
                  value: 0
                description: Millennium Letter
                end: '2000-12-31T00:00:00Z'
                goal:
                  value: 0
                inactive: false
                lookup_id: 2000 Letter
                notes: Millennium Letter from the Director of Development.
                recipient_count: 0
                start: '2000-01-01T00:00:00Z'
        '400':
          description: Returned when the specified package ID in the request URL is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to view the package.
        '404':
          description: Returned when the specified package is not found.
      tags:
      - Packages
components:
  schemas:
    ApiCollection_PackageRead:
      description: Fetching data all at once quickly becomes unmanageable. The collection entity helps by returning paginated chunks of large data sets. This entity includes helpful metadata and properties to paginate and iterate through the data.
      type: object
      properties:
        count:
          format: int32
          description: The number of items available for retrieval into the collection after applying any request parameters. The <b>limit</b> and <b>offset</b> parameters do not affect the <b>count</b>, but to facilitate paging, they may affect the number of items in the <b>value</b> result set.
          type: integer
        next_link:
          description: For paginated responses, the URI for the next page of results.
          type: string
        value:
          description: The set of items included in the response. This may be a subset of the items in the collection.
          type: array
          items:
            $ref: '#/components/schemas/PackageRead'
      x-hidden: true
      x-base-type: '#/definitions/ApiCollection'
    PackageRead:
      description: Packages contain content and other items for the appeals that organizations use to solicit gifts.
      type: object
      properties:
        id:
          description: The immutable system record ID of the package.
          type: string
        appeal_id:
          description: The immutable system record ID of the appeal associated with this package.
          type: string
        category:
          description: The category of the package.
          type: string
        date_added:
          format: date-time
          description: 'The date when the package was created. Includes an offset from UTC in <a href="https://tools.ietf.org/html/rfc3339">ISO-8601 format: </a><i>1969-11-21T10:29:43-04:00</i>.'
          type: string
          x-supports-datetime-offset: true
        date_modified:
          format: date-time
          description: 'The date when the package was last modified. Includes an offset from UTC in <a href="https://tools.ietf.org/html/rfc3339">ISO-8601 format: </a><i>1969-11-21T10:29:43-04:00</i>.'
          type: string
          x-supports-datetime-offset: true
        default_gift_amount:
          $ref: '#/components/schemas/Currency'
          description: The default amount for gifts associated with this package.
        description:
          description: The display name of the package.
          type: string
        end:
          format: date-time
          description: 'The end date of the package. Uses <a href="https://tools.ietf.org/html/rfc3339">ISO-8601 format: </a><i>1969-12-25T10:29:43</i>.'
          type: string
          x-supports-datetime-offset: false
        goal:
          $ref: '#/components/schemas/Currency'
          description: The goal of this package.
        inactive:
          description: This computed field indicates that the package is active if the current date is after any <code>start</code> and before any <code>end</code>.
          type: boolean
        lookup_id:
          description: The user-defined identifier for the package.
          type: string
        notes:
          description: The notes on the package.
          type: string
        recipient_count:
          format: int32
          description: The number of recipients of the package.
          type: integer
        start:
          format: date-time
          description: 'The start date of the package. Uses <a href="https://tools.ietf.org/html/rfc3339">ISO-8601 format: </a><i>1969-11-21T10:29:43</i>.'
          type: string
          x-supports-datetime-offset: false
      x-display-name: Package
      x-display-id: Package
    Currency:
      description: For consistency, currency is configured at the organization level. This ensures that all monetary amounts are consistent, regardless of where they are entered or viewed.
      type: object
      properties:
        value:
          format: double
          description: The monetary value.
          type: number
  securitySchemes:
    Bb-Api-Subscription-Key:
      type: apiKey
      name: Bb-Api-Subscription-Key
      in: header
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://app.blackbaud.com/oauth/authorize
          tokenUrl: https://oauth2.sky.blackbaud.com/token
          scopes: {}
