openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: School Schedules API'
  description: This API is used to provide access to school information such as users, academics, admissions, athletics, content, lists, and general school info.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/school
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/school
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Schedules
paths:
  /v1/schedules/meetings:
    get:
      operationId: V1SchedulesMeetingsGet
      summary: Schedules meetings
      description: 'Returns a list of section meetings for a given date. When ```end_date``` is supplied a range of meetings between the given dates is returned.

        ```offering_types``` can take a single or multiple values as a comma delimited ```string``` of integers, defaults to 1

        ```end_date``` cannot be more than 30 days past the ```start_date```. Default date range is 30 days.


        Academics: 1


        Activities: 2


        Advisory: 3


        Athletics: 9


        Requires at least one of the following roles in the Education Management system:


        Academics Group Manager


        Advisory Group Manager


        Platform Manager


        Activity Group Manager


        Athletic Group Manager


        Scheduling Manager'
      parameters:
      - name: start_date
        in: query
        required: true
        schema:
          type: string
        description: 'Use <a href="https://en.wikipedia.org/wiki/ISO_8601" target="_blank">ISO-8601</a> date format: 2022-04-01.'
      - name: end_date
        in: query
        required: false
        schema:
          type: string
        description: 'Use <a href="https://en.wikipedia.org/wiki/ISO_8601" target="_blank">ISO-8601</a> date format: 2022-04-08.'
      - name: offering_types
        in: query
        required: false
        schema:
          type: string
          default: '1'
        description: Comma delimited list of integer values above. Defaults to 1.
      - name: section_ids
        in: query
        required: false
        schema:
          type: string
        description: Comma delimited list of integer values for the section identifiers to return. By default the route returns all sections.
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: "Filters meetings to sections that were modified on or after the date provided. \n Use <a href=\"https://en.wikipedia.org/wiki/ISO_8601\" target=\"_blank\">ISO-8601</a> date format: 2022-04-01."
      - name: show_time_for_current_date
        in: query
        required: false
        schema:
          type: boolean
          default: 'false'
        description: Set to true to calculate the ```start_time``` and ```end_time``` or meetings based on the current day instead of the meeting day. Defaults to false.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeetingCollection'
              example:
                count: 1
                value:
                - section_id: 1
                  section_identifier: Identifier
                  course_title: Course Title
                  group_name: Group Name
                  block_id: 3
                  block_name: Block Name
                  room_id: 1
                  room_name: Room Name
                  room_number: 1
                  room_capacity: 20
                  room_code: Code
                  faculty_user_id: 1
                  faculty_name: Stark, Tony
                  faculty_firstname: Tony
                  faculty_lastname: Stark
                  start_time: '1970-01-01T01:00:00Z'
                  end_time: '1970-01-01T02:00:00Z'
                  meeting_date: '2022-02-02T12:00:00Z'
                  attendance_required: true
                  attendance_taken: false
                  num_absent: 0
                  attendance_id: 12
                  level_number: 1
                  offering_type:
                    id: 1
                    description: Academics
                  created_date: '1970-01-01T02:00:00Z'
                  modified_date: '1970-01-01T02:00:00Z'
                  last_modified_user_id: 123456
                  teachers:
                  - id: 1010101
                    head: true
                    name: Tony Stark
                    firstname: Anthony
                    lastname: Stark
                    preferred_name: Tony
                    formatted_name: Stark, Tony
                    email: ironman@avengers.com
                    cell_phone: 555-555-5555
                  - id: 1010102
                    head: false
                    name: James Rodes
                    firstname: James
                    lastname: Rodes
                    preferred_name: ''
                    formatted_name: Rodes, James
                    email: warmachine@avengers.com
                    cell_phone: 555-555-5551
      tags:
      - Schedules
  /v1/schedules/{student_id}/meetings:
    get:
      operationId: V1SchedulesByStudent_idMeetingsGet
      summary: Schedules - Meetings for a student
      description: 'Returns a list of meetings for a given student for a date range. When ```end_date``` is supplied, a range of meetings between the given dates is returned.

        Default for ```end_date``` is 30 days past the ```start_date```.

        Requires at least one of the following roles in the Education Management system and group page access should be set for one of the roles:


        Student


        Parent


        Attendance Manager


        Schedule Manager'
      parameters:
      - name: student_id
        in: path
        required: true
        schema:
          type: integer
        description: The ID of the student
      - name: start_date
        in: query
        required: true
        schema:
          type: string
        description: The beginning of the date range of results to return.
      - name: end_date
        in: query
        required: false
        schema:
          type: string
        description: The end of the date range of results to return. Defaults to 30 days after start_date
      - name: size
        in: query
        required: false
        schema:
          type: integer
          default: '3000'
        description: The page size in number of records returned. Default is 3000. Maximum allowed is 5000.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: '1'
        description: The page of results to return. Defaults to 1 if not included.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentScheduleCollection'
              example:
                count: 1
                value:
                - section_id: 1
                  section_identifier: Identifier
                  course_title: Course Title
                  course_code: '101'
                  section_name: Section Name
                  block_id: 3
                  block_name: Block Name
                  room_id: 1
                  room_name: Room Name
                  room_number: '1'
                  room_capacity: 20
                  room_code: Code
                  faculty_name: Stark, Tony
                  faculty_firstname: Tony
                  faculty_lastname: Stark
                  start_time: '1970-01-01T01:00:00Z'
                  end_time: '1970-01-01T02:00:00Z'
                  meeting_date: '2022-02-02T12:00:00Z'
                  faculty_user_id: 1
                  attendance_required: true
                  offering_type:
                    id: 1
                    description: Academics
                  attendance_taken: true
                  attendance:
                  - id: 1001
                    attendance_of_record: true
                    excused_type:
                      category_description: Medical
                      category_id: 1
                      excuse_type_id: 101
                      excuse_description: Doctor's note provided
                      use_in_calculations: true
                      excused: Present
                      duration: FullDay
                      attendance_type: Present
                      school_levels:
                      - id: 1
                        abbreviation: US
                        name: Upper School
                    comment: Student was excused due to illness.
                    reported_by:
                      id: 501
                      email: admin@school.edu
                      first_name: Bruce
                      last_name: Banner
                      middle_name: David
      tags:
      - Schedules
