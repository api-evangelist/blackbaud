openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: GrantsConnect Userworkflowlevels API'
  description: This API provides access to read and update data within GrantsConnect.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/grants-connect
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/grants-connect
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Userworkflowlevels
paths:
  /v1/userworkflowlevels/search:
    post:
      operationId: SearchUserWorkflowLevels
      summary: Search workflows (PREVIEW)
      description: 'Search user workflow levels


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowLevelUsersRequestModel'
            example:
              id: 1
              name: Workflow Level 1
              user_id: 123
              first_name: John
              last_name: Doe
              email: JohnDoe@mail.com
              limit: 10
              page: 1
              date_modified: '2025-01-01T12:00:00Z'
              include_inactive: true
        description: Specifies the conditions of the workflows to search.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnPaginatedWorkflowLevelUsers'
              example:
                records:
                - id: 1
                  name: Workflow Level 1
                  description: Description of Workflow Level 1
                  user_id: 123
                  workflow_level_users:
                  - user_id: 123
                    first_name: John
                    last_name: Doe
                    email: JohnDoe@mail.com
                record_count: 1
      tags:
      - Userworkflowlevels
components:
  schemas:
    ReturnPaginatedWorkflowLevelUsers:
      type: object
      properties:
        records:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/WorkflowLevelsWithUserList'
          description: The details returned for the current page.
        record_count:
          type:
          - integer
          - 'null'
          description: The total number of records in the search result.
          format: int32
      additionalProperties: false
      description: Returns a paginated view of workflow level users.
    ReturnBasicUserDetails:
      type: object
      properties:
        user_id:
          type: integer
          description: The identifier of the user.
          format: int32
        first_name:
          type:
          - string
          - 'null'
          description: The first name of the user.
        last_name:
          type:
          - string
          - 'null'
          description: The last name of the user.
        email:
          type:
          - string
          - 'null'
          description: The email of the user.
      additionalProperties: false
      description: Basic information about a user. This may be an applicant or a Grant Manager user.
    WorkflowLevelsWithUserList:
      type: object
      properties:
        id:
          type: integer
          description: The identifier of the workflow level.
          format: int32
        name:
          type:
          - string
          - 'null'
          description: The name of the workflow level.
        description:
          type:
          - string
          - 'null'
          description: The description of the workflow level.
        user_id:
          type: integer
          description: The identifier of the User.
          format: int32
        workflow_level_users:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ReturnBasicUserDetails'
          description: The workflow levels that the user is a part of.
      additionalProperties: false
      description: Basic information about the workflow level users.
    WorkflowLevelUsersRequestModel:
      type: object
      properties:
        id:
          type:
          - integer
          - 'null'
          description: The identifier of the workflow leve.
          format: int32
        name:
          type:
          - string
          - 'null'
          description: The name of the workflow level.
        user_id:
          type:
          - integer
          - 'null'
          description: The identifier of the workflow level user.
          format: int32
        first_name:
          type:
          - string
          - 'null'
          description: The first name of the workflow level user.
        last_name:
          type:
          - string
          - 'null'
          description: The last name of the workflow level user.
        email:
          type:
          - string
          - 'null'
          description: The email of the workflow level user.
        limit:
          maximum: 500
          minimum: 50
          type: integer
          description: Specifies the maximum number of records to return per page.
          format: int32
          default: 50
        page:
          maximum: 2147483647
          minimum: 1
          type: integer
          description: Specifies the page number for pagination.
          format: int32
          default: 1
        date_modified:
          type:
          - string
          - 'null'
          description: If provided, only records modified since the date and time specified will be returned. Time zone is UTC.
          format: date-time
        include_inactive:
          type: boolean
          description: Specifies if inactive records should be returned. Value is true or false.
          default: false
      additionalProperties: false
      description: Filters to apply to the workflow level users search. Specify conditions of the workflow level users to return detailed information.
  securitySchemes:
    Bb-Api-Subscription-Key:
      type: apiKey
      name: Bb-Api-Subscription-Key
      in: header
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://app.blackbaud.com/oauth/authorize
          tokenUrl: https://oauth2.sky.blackbaud.com/token
          scopes: {}
