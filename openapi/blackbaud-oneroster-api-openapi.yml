openapi: 3.0.1
info:
  title: 'Blackbaud SKY API: OneRoster'
  description: OneRoster v1.1 API. For details on the OneRoster Version 1.1 Specification, <a href="https://www.imsglobal.org/oneroster-v11-final-specification">click
    here</a>. The <a href="https://developer.blackbaud.com/skyapi/bbem/oneroster/authorization">Authorization</a> page provides
    steps to setup and test these endpoints.
  version: v1p1
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/afe-rostr
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations,
      examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster
paths:
  /academicSessions:
    get:
      operationId: getAllAcademicSessions
      summary: AcademicSessions all
      description: Returns a collection of academic sessions.
      responses:
        '200':
          description: OK - It was possible to read the collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicSessionsOutputModel'
              example:
                academicSessions:
                - title: 1st Semester
                  startDate: '2022-09-01'
                  endDate: '2022-12-24'
                  type: term
                  parent:
                    sourcedId: as-syr-222-2023
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/link_to_parent
                    type: academicSession
                  children:
                  - sourcedId: as-grp-222-1234
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/link_to_child
                    type: academicSession
                  schoolYear: '2023'
                  sourcedId: as-trm-222-1234
                  status: active
                  dateLastModified: '2022-09-26T09:45:00Z'
                - title: 2st Quarter
                  startDate: '2022-10-01'
                  endDate: '2022-12-24'
                  type: gradingPeriod
                  parent:
                    sourcedId: as-trm-222-1234
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/link_to_parent
                    type: academicSession
                  schoolYear: '2023'
                  sourcedId: as-grp-222-2345
                  status: active
                  dateLastModified: '2022-09-26T09:45:00Z'
  /academicSessions/{id}:
    get:
      operationId: getAcademicSession
      summary: AcademicSession by id
      description: Returns a specific academic session.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: sourcedId for the academic session
      responses:
        '200':
          description: OK - It was possible to read the collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicSessionOutputModel'
              example:
                academicSession:
                  title: 1st Semester
                  startDate: '2022-09-01'
                  endDate: '2022-12-24'
                  type: term
                  parent:
                    sourcedId: as-syr-222-2023
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/link_to_parent
                    type: academicSession
                  children:
                  - sourcedId: as-grp-222-1234
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/link_to_child
                    type: academicSession
                  schoolYear: '2023'
                  sourcedId: as-trm-222-1234
                  status: active
                  dateLastModified: '2022-09-26T09:45:00Z'
  /categories:
    get:
      operationId: getAllCategories
      summary: Categories all
      description: Returns a collection of categories.
      responses:
        '200':
          description: OK - It was possible to read the collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesOutputModel'
              example:
                categories:
                - title: Homework
                  sourcedId: lic-222-543
                  status: active
                  dateLastModified: '2022-09-26T01:30:00Z'
                - title: Project
                  sourcedId: lic-222-544
                  status: active
                  dateLastModified: '2022-09-26T01:30:00Z'
  /categories/{id}:
    get:
      operationId: getCategory
      summary: Category by id
      description: Returns a specific category.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: sourcedId for the category
      responses:
        '200':
          description: OK - It was possible to read the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryOutputModel'
              example:
                category:
                  title: Homework
                  sourcedId: lic-222-543
                  status: active
                  dateLastModified: '2022-09-26T01:30:00Z'
    put:
      operationId: putCategory
      summary: Category create/update
      description: Returns the category object that was created or updated.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: sourcedId for the category
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryInputModel'
            example:
              category:
                title: Homework
                sourcedId: lic-222-sourcedId
                status: active
                dateLastModified: '2022-09-26T01:30:00Z'
        description: input model for a category
      responses:
        '201':
          description: OK - It was possible to read the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryOutputModel'
              example:
                category:
                  title: Homework
                  sourcedId: lic-222-543
                  status: active
                  dateLastModified: '2022-09-26T01:30:00Z'
