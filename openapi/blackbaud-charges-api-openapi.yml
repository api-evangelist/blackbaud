    ChargeListView:
      required:
      - balance
      - billing_item_id
      - billing_item_name
      - charge_amount
      - charge_date
      - client
      - due_date
      - id
      - lookup_id
      - post_date
      - post_status
      type: object
      properties:
        id:
          minLength: 1
          type: string
          description: The ID of the charge.
        lookup_id:
          minLength: 1
          type: string
          description: The ID of the lookup.
        notes:
          type:
          - string
          - 'null'
          description: The optional notes.
        client:
          $ref: '#/components/schemas/Contact'
        charge_date:
          type: string
          description: The original charge transaction time.
          format: date-time
        due_date:
          type: string
          description: The charge due date.
          format: date-time
        post_date:
          type: string
          description: The charge post date.
          format: date-time
        post_status:
          $ref: '#/components/schemas/PostStatus'
        print_status:
          $ref: '#/components/schemas/PrintStatus'
        billing_item_id:
          minLength: 1
          type: string
          description: The billing item.
        billing_item_name:
          minLength: 1
          type: string
          description: The billing item name.
        description:
          type:
          - string
          - 'null'
          description: 'The description of the billing item.

            Defaults from billing item, but user can override.'
        service_provider:
          type:
          - string
          - 'null'
          description: The service provider for the charge.
        flat_rate:
          $ref: '#/components/schemas/FlatRate'
        variable_rate:
          $ref: '#/components/schemas/VariableRate'
        sales_tax_billing_item:
          $ref: '#/components/schemas/SalesTaxItem'
        charge_amount:
          type: number
          description: The amount calculated from billing item values.
          format: decimal
        balance:
          type: number
          description: Total amount outstanding = committed amount - paid amount
          format: decimal
        added_by:
          type:
          - string
          - 'null'
          description: The user name who created the record.
        date_added:
          type: string
          description: The record create date.
          format: date-time
        last_changed_by:
          type:
          - string
          - 'null'
          description: The user name who last changed the record.
        date_changed:
          type:
          - string
          - 'null'
          description: The record last changed date.
          format: date-time
      additionalProperties: false
      description: Used to represent core charge information
    ContactType:
      title: ContactType
      enum:
      - Unknown
      - Person
      - Organization
      type: string
      description: Contact type
    FlatRate:
      type: object
      properties:
        amount:
          type:
          - number
          - 'null'
          description: The default flat rate.
          format: decimal
        allow_changes_to_amount:
          type: boolean
          description: Whether the user can edit the billing item amount after it's applied. For example, on a charge.
      additionalProperties: false
      description: The flat rate item details.
    SalesTaxItem:
      required:
      - id
      - value
      type: object
      properties:
        id:
          minLength: 1
          type: string
          description: ID
        value:
          minLength: 1
          type: string
          description: Value
        amount:
          type: number
          description: Amount
          format: decimal
      additionalProperties: false
      description: 'The sales tax item.

        Subset of BillingItemCore'
    VariableRate:
      required:
      - quantity
      - quantity_decimals
      - unit_price_decimals
      type: object
      properties:
        unit_of_measure_entry:
          $ref: '#/components/schemas/ReceivablesCodeTableEntry'
        quantity:
          type: number
          description: The quantity sold for a specified unit.
          format: decimal
        quantity_decimals:
          type: integer
          description: The number of decimals to input and round the quantity.
          format: int32
        unit_price:
          type:
          - number
          - 'null'
          description: The price per unit.
          format: decimal
        unit_price_decimals:
          type: integer
          description: The number of decimals to input and round the unit price.
          format: int32
        allow_changes_quantity_and_unit_price:
          type: boolean
          description: The user is allowed to edit the Billing Item's unit price after it is applied, such as on a Charge.
        trade_discount_percent:
          type: number
          description: Trade Discount Percentage for Charge and Line Item calculations.
          format: decimal
        trade_discount_amount:
          type: number
          description: Calculated Trade Discount Amount for Charge and Line Item calculations.
          format: decimal
          readOnly: true
        amount:
          type: number
          description: Amount calculated from other property values
          format: decimal
          readOnly: true
      additionalProperties: false
      description: The details for an item with variable quantity.
    PostStatus:
      title: PostStatus
      enum:
      - DoNotPost
      - NotYetPosted
      - Posted
      type: string
      description: Post status
    ReceivablesCodeTableEntry:
      required:
      - id
      - value
      type: object
      properties:
        id:
          type: string
          description: The ID of the code table entry.
        value:
          minLength: 1
          type: string
          description: The value of the code table entry.
      additionalProperties: false
      description: The request containing info for a code table entry.
    PrintStatus:
      title: PrintStatus
      enum:
      - NotYetPrinted
      - Printed
      - DoNotPrint
      - RePrint
      type: string
      description: Print status
  securitySchemes:
    Bb-Api-Subscription-Key:
      type: apiKey
      name: Bb-Api-Subscription-Key
      in: header
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://app.blackbaud.com/oauth/authorize
          tokenUrl: https://oauth2.sky.blackbaud.com/token
          scopes: {}
