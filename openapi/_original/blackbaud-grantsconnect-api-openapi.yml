components:
  schemas:
    AddInKindItems:
      required:
      - count
      - item_identification
      - value
      type: object
      properties:
        item_identification:
          maxLength: 50
          minLength: 0
          type: string
          description: The identification for the in-kind item. This may be a combination of text and numbers.
        count:
          maximum: 2147483647
          minimum: 0
          type: integer
          description: The number of in-kind items included in the payment.
          format: int32
        value:
          minimum: 0
          type: number
          description: The monetary value of a single in-kind item.
          format: double
      additionalProperties: false
      description: Specifies the details of in-kind items to create. These items are used when creating in-kind payments.
    AddPicklistOption:
      type: object
      properties:
        key:
          type: string
          description: Key for the new picklist option.
          nullable: true
        value:
          type: string
          description: Value for the new picklist option.
          nullable: true
        sort_order:
          type: integer
          description: Sort order for the new picklist option.
          format: int32
        parent_keys:
          type: array
          items:
            type: string
          description: Parent keys for the new picklist option if this is a dependent picklist.
          nullable: true
      additionalProperties: false
      description: Model for adding a new picklist option.
    ApplicantResponseTranslationPaginationRequest:
      type: object
      properties:
        limit:
          maximum: 500
          minimum: 50
          type: integer
          description: Specifies the maximum number of records to return per page.
          format: int32
          default: 50
        page:
          maximum: 2147483647
          minimum: 1
          type: integer
          description: Specifies the page number for pagination.
          format: int32
          default: 1
        date_modified:
          type: string
          description: If provided, only records modified since the date and time specified will be returned. Time zone is
            UTC.
          format: date-time
          nullable: true
        include_inactive:
          type: boolean
          description: Specifies if inactive records should be returned. Value is true or false.
          default: false
      additionalProperties: false
      description: Basic information about the applicant responses with translations.
    ApplicantResponseTranslationPaginationReturn:
      type: object
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/SkyApiApplicantResponseTranslationModel'
          description: The details returned for the current page.
          nullable: true
        record_count:
          type: integer
          description: The total number of records in the search result.
          format: int32
          nullable: true
      additionalProperties: false
      description: Represents a paginated result set of picklist records.
    ApplicationApplicantType:
      enum:
      - Main
      - Collaborator
      type: string
      description: The types of applicants/collaborators on an application.<p>Available values:</p><ul><li><i>Main</i></li><li><i>Collaborator</i></li></ul>
    ApplicationFileType:
      enum:
      - Email
      - Form
      - External
      - MergeDocument
      - Communication
      - SignedDocument
      type: string
      description: The types of files that may be associated to an application.<p>Available values:</p><ul><li><i>Email</i></li><li><i>Form</i></li><li><i>External</i></li><li><i>MergeDocument</i></li><li><i>Communication</i></li><li><i>SignedDocument</i></li></ul>
    ApplicationFormStatus:
      enum:
      - NotSent
      - Sent
      - Draft
      - Submitted
      - RevisionRequested
      type: string
      description: The statuses for an application form.<p>Available values:</p><ul><li><i>NotSent</i></li><li><i>Sent</i></li><li><i>Draft</i></li><li><i>Submitted</i></li><li><i>RevisionRequested</i></li></ul>
    ApplicationInformationQueryResults:
      type: object
      properties:
        draft:
          type: boolean
          description: Indicates if the application is in a draft status. Value is true or false.
        archived:
          type: boolean
          description: Indicates if the application has been archived. Value is true or false.
        amount_requested:
          type: number
          description: The monetary value requested by the applicant. Cash payments only.
          format: double
        currency_requested:
          type: string
          description: The currency requested by the applicant.
          nullable: true
        reserved_funds:
          type: boolean
          description: Indicates if funds have been reserved from the budget. Value is true or false.
        grant_program:
          $ref: '#/components/schemas/ReturnBasicGrantProgramDetails'
        organization_details:
          $ref: '#/components/schemas/ReturnBasicOrganizationDetails'
        budget:
          $ref: '#/components/schemas/ReturnBasicBudgetDetails'
        inactive:
          type: boolean
          description: Indicates if the application is inactive. Value is true or false.
        created_by_user:
          $ref: '#/components/schemas/ReturnBasicUserDetails'
        status_modified_by_name:
          type: string
          description: The name of the user who last modified the application status. This attribute is not available for
            applications created after May 2023.
          nullable: true
          x-bb-suppressions:
          - parameter_property_name
        status_modified_by_email:
          type: string
          description: The email address of the user who last modified the application status. This attribute is not available
            for applications created after May 2023.
          nullable: true
          x-bb-suppressions:
          - parameter_property_name
        status_modified_date:
          type: string
          description: The date and time the application status was last modified. Time zone is UTC.
          format: date-time
          nullable: true
          x-bb-suppressions:
          - parameter_property_name
        status_modified_by_user_id:
          type: integer
          description: The identifier of the user who last modified the application status. This attribute is not available
            for applications created after May 2023.
          format: int32
          nullable: true
        status_comment:
          type: string
          description: The comment provided by the Grant Manager when the application status was changed.
          nullable: true
        application_guid:
          type: string
          description: The unique identifier for the application.
          format: uuid
          x-bb-suppressions:
          - parameter_property_name
        main_applicant_details:
          $ref: '#/components/schemas/ReturnBasicApplicantDetails'
        workflow_level_details:
          $ref: '#/components/schemas/ReturnBasicWorkflowLevelDetails'
        days_in_workflow_level:
          type: integer
