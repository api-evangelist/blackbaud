info:
  title: 'Blackbaud SKY API: Gift Aid'
  description: This API manages gift aid information.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/gar-gfacr
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations,
      examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/gar-gfacr
paths:
  /v1/gifts/{gift_id}/giftaid:
    get:
      operationId: GetGiftTaxByGiftId
      summary: Get gift record with gift splits by gift ID
      description: Get single gift by gift ID
      parameters:
      - name: gift_id
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the gift table
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the gift and gift splits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftTax'
              example:
                id: 3
                constituent_id: 186
                gift_aid_qualification_method: ApplyRulesWhenSaving
                gift_aid_qualification_status: Qualified
                gift_date: '2023-10-23'
                claim_number: 2024-25
                tax_claim_amount: 11
                gift_splits:
                - gift_split_id: 3
                  campaign_id: 1
                  fund_id: 35
                  appeal_id: 49
                  package_id: 4
                  amount: 100
                  gift_aid_qualification_method: ApplyRulesWhenSaving
                  campaign: Annual Campaign
                  fund: 2010 Annual Fund
                  appeal: 2010 Annual Mailing
                  package: Colour Brochure
        '401':
          description: Returned when the user does not have permission to execute this operation.
        '403':
          description: Returned when the constituent view gift capability is not enabled.
        '404':
          description: Returned when the specified gift is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:resource-not-found
                title: The requested resource could not be found.
                status: 404
    patch:
      operationId: EditGiftTaxAsync
      summary: Update constituent gift tax
      description: Update gift tax
      parameters:
      - name: gift_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system gift ID of gift aid to edit.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditGiftTax'
            example:
              gift_aid_q_method: ApplyRulesWhenSaving
              claim_number: 2020-2022
        description: An object that represents the properties of the gift aid to edit
      responses:
        '200':
          description: Returned when the operation succeeds.
        '401':
          description: Returned when the user does not have permission to execute this operation.
        '403':
          description: Returned when the constituent edit gift tax capability is not enabled.
        '404':
          description: Returned when the specified  gift is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:resource-not-found
                title: The requested resource could not be found.
                status: 404
  /v1/gifts/{gift_id}/giftaid/splits:
    patch:
      operationId: EditGiftSplitsTaxAsync
      summary: Update constituent gift split tax
      description: Update gift split tax
      parameters:
      - name: gift_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system gift ID of gift aid to edit.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditGiftSplitsTax'
            example:
              claim_number: 2019-2023
              split_details:
              - gift_split_id: 1
                gift_aid_qualification_method: ApplyRulesWhenSaving
              - gift_split_id: 2
                gift_aid_qualification_method: SetAsQualified
        description: An object that represents the properties of the gift split list to edit
      responses:
        '200':
          description: Returned when the operation succeeds.
        '401':
          description: Returned when the user does not have permission to execute this operation.
        '403':
          description: Returned when the constituent edit gift capability is not enabled.
        '404':
          description: Returned when the specified  gift is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:resource-not-found
                title: The requested resource could not be found.
                status: 404
  /v1/taxdeclarations/constituents/{constituent_id}:
    post:
      operationId: CreateTaxDeclaration
      summary: Add constituent tax declaration
      description: Add tax declaration
      parameters:
      - name: constituent_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxDeclarationAdd'
            example:
              constituent_pays_tax: 'Yes'
              declaration_made_date: '2000-04-06'
              confirmation_sent_date: '2000-04-07'
              confirmation_returned_date: '2000-04-07'
              tax_notes: sample tax notes
              declaration_end_date: '2000-04-07'
              declaration_start_date: '2000-04-06'
              declaration_indicator:
                table_entries_id: 1077
                long_description: Oral
              scanned_docs_exist: false
              tax_payer_status:
                table_entries_id: 1069
                long_description: Employee
              declaration_source:
                table_entries_id: 1088
                long_description: back office
        description: Tax declaration
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the new tax declaration ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: '120'
        '401':
          description: Returned when the user does not have permission to execute this operation.
        '403':
          description: Returned when the constituent add tax declaration capability is not enabled.
        '404':
          description: Returned when the specified constituent is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:resource-not-found
                title: The requested resource could not be found.
                status: 404
    get:
      operationId: GetTaxDeclarationListByConstituentId
      summary: Get tax declarations for constituent
      description: Returned tax declarations by constituent ID
      parameters:
      - name: constituent_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID.
      - name: sort_direction
        in: query
        required: false
        schema:
          type: string
          enum:
          - Ascending
          - Descending
        description: Use 'asc' or 'dsc' to arrange a grid, list, or repeater in ascending or descending order based on the
          passed value for sorting.
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
          enum:
          - StartDate
          - MadeDate
        description: Order By clause for sorting operations.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: '500'
        description: Represents the number of records to return. The default is 500.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: '0'
        description: Represents the number of records to skip. For use with pagination.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains tax declarations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxDeclarationCollection'
              example:
                tax_declarations:
                - declaration_id: '1'
                  sequence: 1
                  constituent_id: '2'
                  constituent_pays_tax: 'Yes'
                  declaration_made_date: '2000-04-06'
                  confirmation_sent_date: '2000-04-07'
                  confirmation_returned_date: '2000-04-07'
                  tax_notes: Tax notes
                  declaration_end_date: '2000-04-07'
                  declaration_start_date: '2000-04-06'
                  tax_payer_status: 1069
                  declaration_indicator: 1077
                  scanned_docs_exist: true
                  declaration_source: 1088
                  declaration_source_text: back office
                  declaration_indicator_text: Oral
                  tax_payer_status_text: employee
                count: 1
                offset: 0
                limit: 0
        '401':
          description: Returned when the user does not have permission to execute this operation or does not have permission
            to view the requested constituents tax declarations list.
        '403':
          description: Returned when the user does not have permission to view constituent.
        '400':
          description: Returned when the specified constituent ID in the request URL is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequest400ResponseTypes'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: Field is required
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '404':
          description: Returned when the specified constituent is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:resource-not-found
                title: The requested resource could not be found.
                status: 404
  /v1/taxdeclarations/{declaration_id}:
    delete:
      operationId: DeleteTaxDeclaration
      summary: Deletes a constituent tax declaration
      description: Deletes a constituent tax declaration
      parameters:
      - name: declaration_id
        in: path
        required: true
        schema:
          type: integer
        description: The immutable system tax declaration ID.
      responses:
        '200':
          description: Returned when the operation successfully deletes the tax declaration.
        '401':
          description: Returned when the user does not have permission to execute this operation or does not have permission
            to delete the requested constituents tax declaration.
        '403':
          description: Returned when the user does not have permission to delete constituent.
        '404':
          description: Returned when the specified tax declaration is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:resource-not-found
                title: The requested resource could not be found.
                status: 404
    patch:
      operationId: EditTaxDeclarationAsync
      summary: Update constituent tax declaration
      description: Update tax declaration
      parameters:
      - name: declaration_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system ID of the tax declaration to edit.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxDeclarationUpdate'
            example:
              constituent_pays_tax: 'Yes'
              declaration_made_date: '2000-04-06'
              confirmation_sent_date: '2000-04-07'
              confirmation_returned_date: '2000-04-07'
              tax_notes: sample tax notes
              declaration_end_date: '2000-04-07'
              declaration_start_date: '2000-04-06'
              declaration_indicator:
                table_entries_id: 1077
                long_description: Oral
              scanned_docs_exist: false
              tax_payer_status:
                table_entries_id: 1069
                long_description: Employee
              declaration_source:
                table_entries_id: 1088
                long_description: back office
        description: An object that represents the properties of the tax declaration to edit
      responses:
        '200':
          description: Returned when the operation succeeds.
        '401':
          description: Returned when the user does not have permission to execute this operation.
        '403':
          description: Returned when the constituent add tax declaration capability is not enabled.
        '404':
          description: Returned when the specified tax declaration is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:resource-not-found
                title: The requested resource could not be found.
                status: 404
