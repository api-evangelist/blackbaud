        '200':
          description: Returned when the operation successfully creates a custom field. The response body contains the ID
            of the new custom field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: '1281'
        '400':
          description: Returned when the request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to create the custom field.
        '404':
          description: Returned when the specified gift is not found.
    get:
      operationId: ListGiftCustomFieldsAllGifts
      summary: Gift custom field list (All gifts)
      description: "Returns a paginated list of gift custom fields.\r\n<p />\r\nThe default sorting behavior is to list gift\
        \ custom fields in ascending order based on when they were created.\r\n<p />\r\nHowever, the <code>last_modified</code>\
        \ parameter overrides the default sorting behavior to list gift custom fields in ascending order based on when they\
        \ were last modified. The <code>last_modified</code> parameter also adds the <code>sort_token</code> parameter to\
        \ the <code>next_link</code> URL to ensure that gift custom fields are stably sorted and that order persists when\
        \ changes occur while working through a paginated list.\r\n<p />\r\nIf the <code>last_modified</code> and <code>date_added</code>\
        \ parameters are both specified, the sorting behavior is to list gift custom fields based on when they were last modified.\r\
        \n<p /><b>Note:</b> This endpoint returns data with an average latency of about 30 minutes. In addition, historic\
        \ records have a default <code>date_added</code> timestamp of 1600-01-01 00:00:00.000 +00:00. The timestamp for newer\
        \ records reflects when the records were added."
      parameters:
      - name: date_added
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for gift custom fields created on or after the specified date. The filter respects
          time offsets from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for gift custom fields modified on or after the specified date. The filter respects
          time offsets from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: sort_token
        in: query
        required: false
        schema:
          type: string
        description: Represents a token filter to provide the next stable-sorted list of gift custom fields. This will be
          provided on the next_link collection response property when last_modified or sort_token filters are specified on
          the request.
      - name: category
        in: query
        required: false
        schema:
          type: array
        description: Represents a filter for custom field categories. Returns any custom fields that match the specified category.
          For example, <i>category=Interests</i> returns custom fields with the <i>Interests</i> category.
      - name: value
        in: query
        required: false
        schema:
          type: array
        description: 'Represents a filter for custom field values. Must be used in conjunction with the <code>category</code>
          filter. Returns any custom fields in the specified category that match any of the specified values. For example,
          <i>category=Interests&amp;value=Baseball&amp;value=Tennis</i> returns <i>Interests</i> custom fields with the <i>Baseball</i>
          or <i>Tennis</i> values. Filtering by fuzzy date values must be in one of the following formats: <i>YYYYMMDD</i>,
          <i>YYYY</i>, <i>YYYYMM</i>, or <i>MMDD</i>.  Any four digit value that starts with 13 or higher will be considered
          a year.  Any four digit value that starts with 01-12 will be considered to be in <i>MMDD</i> format.'
      - name: gift_id
        in: query
        required: false
        schema:
          type: array
        description: Represents a list of gift identifiers. Returns custom fields if any of the specified gift identifiers
          match any of the custom fields' associated gifts. For example, "gift_id=280&amp;gift_id=1232" returns custom fields
          with either "280" or "1232" gift identifiers.
      - name: include_count
        in: query
        required: false
        schema:
          type: boolean
        description: False to exclude the count of all records. Default is true.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to return. The default is 500. The maximum is 5000.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip. For use with pagination.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/gift#Collection">collection</a>
            of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/gift#CustomField">custom field</a> entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection[CustomFieldRead]'
              example:
                count: 21
                next_link: https://api.sky.blackbaud.com/gift/v1/gifts/customfields?offset=6&limit=3
                value:
                - id: '13'
                  category: Auction ID
                  date: '2007-07-30T00:00:00Z'
                  date_added: '1600-01-01T00:00:00Z'
                  date_modified: '1600-01-01T00:00:00Z'
                  parent_id: '1111'
                  type: Text
                  value: AUCTION2007
                - id: '14'
                  category: Item Number
                  date: '2007-07-30T00:00:00Z'
                  date_added: '1600-01-01T00:00:00Z'
                  date_modified: '1600-01-01T00:00:00Z'
                  parent_id: '1111'
                  type: Number
                  value: 1
                - id: '15'
                  category: Declared Value
                  date: '2007-07-30T00:00:00Z'
                  date_added: '1600-01-01T00:00:00Z'
                  date_modified: '1600-01-01T00:00:00Z'
                  parent_id: '1111'
                  type: Currency
                  value: 500
        '400':
          description: Returned when the specified request parameters are not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to view the custom fields.
