# x-archived-from: blackbaud-gift-api-openapi.yml
# x-archived-on: 2026-10-16
openapi: 3.0.1
info:
  title: 'Blackbaud SKY API: Gift'
  description: This API manages gift information and related entities such as gift splits, gift fundraisers, and soft credits.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/58bdd5edd7dcde06046081d6
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations,
      examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/gift/v1
paths:
  /attachmenttags:
    get:
      operationId: ListAttachmentTags
      summary: Attachment tags
      description: Returns a list of available attachment tags.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a>
            of string attachment tags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection[String]'
              example:
                count: 7
                value:
                - Certificate
                - Document
                - Logo
                - PDF
                - Photo
                - Slideshow
                - Spreadsheet
        '403':
          description: Returned when the user does not have permission to view the attachment tags.
  /documents:
    post:
      operationId: CreateDocument
      summary: Document (Create)
      description: Creates a document upload location and unique document identifier for physical attachments.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewDocumentInfo'
            example:
              file_name: businesscard.jpg
              upload_thumbnail: true
        description: An object that represents the <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/gift#NewDocumentInfo">document</a>
          to upload.
      responses:
        '200':
          description: Returned when the operation successfully posts a document. The response body contains the <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/gift#FileDefinition">properties</a>
            of the posted document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDefinition'
              example:
                file_id: e8ce3494-d961-4eef-9938-acf0a2d9a831
                file_upload_request:
                  headers:
                  - name: x-ms-blob-type
                    value: BlockBlob
                  - name: x-ms-version
                    value: '2015-12-11'
                  method: PUT
                  url: http://prodsarnxdocmn002blkbrdo.blob.core.windows.net/blackbauddocumentsvc/tenants/a486g1de-73f5-4a81-a4b1-ff353509fbde/documents/e8ce3494-d961-4eef-9938-acf0a2d9a831/businesscard.jpg?sv=2015-05-17&sr=b&sig=HI0UTKNjiCVB6AtGHBVuCdhgnETbRPYegwb7%2FQyjI%2FU%3D&se=2015-10-15T18%3A25%3A30Z&sp=rw
                thumbnail_id: 5b181d20-9b5f-44ab-8e63-46d14424dfe5
                thumbnail_upload_request:
                  headers:
                  - name: x-ms-blob-type
                    value: BlockBlob
                  - name: x-ms-version
                    value: '2015-12-11'
                  method: PUT
                  url: http://prodsarnxdocmn002blkbrdo.blob.core.windows.net/blackbauddocumentsvc/tenants/a486g1de-73f5-4a81-a4b1-ff353509fbde/documents/5b181d20-9b5f-44ab-8e63-46d14424dfe5/thumbnail_businesscard.jpg?sv=2015-05-17&sr=b&sig=HI0UTKNjiCVB6AtGHBVuCdhgnETbRPYegwb7%2FQyjI%2FU%3D&se=2015-10-15T18%3A25%3A30Z&sp=rw
        '400':
          description: Returned when the request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to upload the document.
  /giftacknowledgements/{acknowledgement_id}:
    patch:
      operationId: EditGiftAcknowledgement
      summary: Gift acknowledgement (Edit)
      description: Edits a gift acknowledgement.
      parameters:
      - name: acknowledgement_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the gift acknowledgement to edit. It uses the parent gift's ID as its
          value.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcknowledgementEdit'
            example:
              date: '2018-12-31T00:00:00Z'
              letter: New Letter
              status: Acknowledged
        description: An object that represents the properties of the gift acknowledgement to edit.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftacknowledgementsAcknowledgement_idPatch200ApplicationJsonResponse'
              example: {}
        '400':
          description: Returned when the specified acknowledgement ID in the URL or the specified request body is not in the
            appropriate format.
        '403':
          description: Returned when the user does not have permission to edit the gift acknowledgement.
        '404':
          description: Returned when the specified gift acknowledgement is not found.
  /giftbatches/{batch_id}/gifts:
    post:
      operationId: AddGiftsToBatch
      summary: Gift (Batch)
      description: Adds one or more gifts to a specified gift batch in the web view.
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the batch to which the gifts will be added.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GiftsAdd'
            example:
              gifts:
              - amount:
                  value: 100
                constituent_id: '280'
                date: '2017-10-03T00:00:00Z'
                fundraisers:
                - amount:
                    value: 100
                  constituent_id: '252'
                gift_splits:
                - amount:
                    value: 100
                  appeal_id: '15'
                  campaign_id: '1'
                  fund_id: '41'
                gift_status: Active
                is_anonymous: false
                lookup_id: '2225'
                payments:
                - payment_method: Cash
                post_date: '2017-10-03T00:00:00Z'
                post_status: NotPosted
                reference: newly added gift
                soft_credits:
                - amount:
                    value: 100
                  constituent_id: '187'
                subtype: Annuity
                type: Donation
              - amount:
                  value: 100
                constituent_id: '290'
                date: '2017-10-03T00:00:00Z'
                fundraisers:
                - amount:
                    value: 100
                  constituent_id: '252'
                gift_splits:
                - amount:
                    value: 100
                  appeal_id: '15'
                  campaign_id: '1'
                  fund_id: '41'
                gift_status: Active
                is_anonymous: false
                lookup_id: '2225'
                origin: '{"name": "Gift origin name"}'
                payments:
                - payment_method: Cash
                post_date: '2017-10-03T00:00:00Z'
                post_status: NotPosted
                reference: newly added gift
                soft_credits:
                - amount:
                    value: 100
                  constituent_id: '187'
                subtype: Annuity
                type: Donation
                tributes:
                - id: '12'
                - id: '15'
                  tribute_acknowledgees:
                  - id: '33'
                  - id: '21'
        description: A collection of objects representing the gifts to add to the given batch.
      responses:
        '200':
          description: Returned when the operation successfully adds the gifts to the batch. The response body contains a
            list of IDs and any exceptions that occurred when adding the gifts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchGiftAddResults'
              example:
                gifts:
                - id: '1140'
                  acknowledgements:
                  - status: Acknowledged
                  amount:
                    value: 250
                  balance:
                    value: 0
                  batch_number: '23'
                  batch_id: '12'
                  constituent_id: '190'
                  date: '2009-03-12T00:00:00Z'
                  date_added: '2002-03-12T14:01:44.227Z'
                  date_modified: '2017-03-15T14:00:12.554Z'
                  fundraisers:
                  - amount:
                      value: 250
                    constituent_id: '236'
                  gift_splits:
                  - id: '1123'
                    amount:
                      value: 250
                    appeal_id: '26'
                    campaign_id: '4'
                    fund_id: '25'
                  gift_status: Active
                  is_anonymous: false
                  constituency: Board Member
                  lookup_id: '800'
                  payments:
                  - payment_method: CreditCard
                  post_date: '2009-03-12T00:00:00Z'
                  post_status: NotPosted
                  receipts:
                  - amount:
                      value: 30
                    date: '2009-07-13T00:00:00Z'
                    status: Receipted
                  subtype: Membership
                  type: PledgePayment
                  tributes:
                  - id: '12'
                  - id: '15'
                    tribute_acknowledgees:
                    - id: '33'
                    - id: '21'
                  linked_gifts:
                  - '882'
                  errors:
                  - batch_id: '55'
                    lookup_id: '1000093'
                    exception_error_message: An error
                  - batch_id: '55'
                    lookup_id: '1000094'
                    exception_error_message: Another error
                errors:
                - batch_id: '55'
                  lookup_id: '1000093'
                  exception_error_message: An error
                - batch_id: '55'
                  lookup_id: '1000094'
                  exception_error_message: Another error
                - batch_id: '55'
                  lookup_id: '1000095'
                  exception_error_message: Oops another error
        '400':
          description: Returned when the specified request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to add gifts to the batch.
  /giftreceipts/{receipt_id}:
    patch:
      operationId: EditGiftReceipt
      summary: Gift receipt (Edit)
      description: Edits a gift receipt.
      parameters:
      - name: receipt_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the gift receipt to edit. It uses the parent gift's ID as its value.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptEdit'
            example:
              amount:
                value: 120
              date: '2018-12-31T00:00:00Z'
              number: 12345
              status: Receipted
        description: An object that represents the properties of the gift receipt to edit.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftreceiptsReceipt_idPatch200ApplicationJsonResponse'
              example: {}
        '400':
          description: Returned when the specified receipt ID in the URL or the specified request body is not in the appropriate
            format.
        '403':
          description: Returned when the user does not have permission to edit the gift receipt.
        '404':
          description: Returned when the specified gift receipt is not found.
  /gifts:
    post:
      operationId: CreateGift
      summary: Gift (Create)
      description: Creates a gift.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GiftAdd'
            example:
              amount:
                value: 100
              constituent_id: '280'
              date: '2017-10-03T00:00:00Z'
              fundraisers:
              - amount:
                  value: 100
                constituent_id: '252'
              gift_splits:
              - amount:
                  value: 100
                appeal_id: '15'
                campaign_id: '1'
                fund_id: '41'
              gift_status: Active
              is_anonymous: false
              lookup_id: '2225'
              origin: '{"name": "Gift origin name"}'
              payments:
              - payment_method: Cash
              post_date: '2017-10-03T00:00:00Z'
              post_status: NotPosted
              reference: newly added gift
              soft_credits:
              - amount:
                  value: 100
                constituent_id: '187'
              subtype: Annuity
              type: Donation
        description: An object that represents the gift to create.
      responses:
        '200':
          description: Returned when the operation successfully creates a gift. The response body contains the ID of the new
            gift.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: '1281'
        '400':
          description: Returned when the specified request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to create the gift.
    get:
      operationId: ListGifts
      summary: Gift list
      description: "Returns a paginated list of gifts.\r\n<p />\r\nThe default sorting behavior is to list gifts in ascending\
        \ order based on the <code>id</code>.\r\n<p />\r\nHowever, the <code>last_modified</code> parameter overrides the\
        \ default sorting behavior to list gifts in ascending order based on when they were last modified, and the <code>date_added</code>\
        \ parameter overrides the default sorting behavior to list gifts in ascending order based on when they were created.\
        \ The <code>last_modified</code> and <code>date_added</code> parameters also add the <code>sort_token</code> parameter\
        \ to the <code>next_link</code> URL to ensure that gifts are stably sorted and that order persists when changes occur\
        \ while working through a paginated list.\r\n<p />\r\nIf the <code>last_modified</code> and <code>date_added</code>\
        \ parameters are both specified, the sorting behavior is to list gifts based on when they were last modified.\r\n\
        <p /><b>Note:</b> This endpoint returns data with an average latency of about 30 minutes."
      parameters:
      - name: date_added
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for gifts created on or after the specified date. The filter respects time offsets
          from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for gifts modified on or after the specified date. The filter respects time offsets
          from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: sort_token
        in: query
        required: false
        schema:
          type: string
        description: Represents a token filter to provide the next stable-sorted list of gifts. This will be provided on the
          next_link collection response property when last_modified or sort_token filters are specified on the request.
      - name: constituent_id
        in: query
        required: false
        schema:
          type: array
        description: Represents a list of constituent identifiers. Returns gifts if any of the specified constituent identifiers
          match any of their constituents. For example, "constituent_id=280&amp;constituent_id=1232" returns gifts with either
          "280" or "1232" constituent identifiers.
      - name: post_status
        in: query
        required: false
        schema:
          type: array
        description: Represents a list of gift post statuses. Returns gifts if their post status matches any specified. For
          example, "post_status=DoNotPost&amp;post_status=Posted" returns gifts that are marked either DoNotPost or Posted.
      - name: gift_type
        in: query
        required: false
        schema:
          type: array
        description: "Represents a list of gift types. Returns gifts if their type matches any specified. For example, \"\
          gift_type=MatchingGiftPledge&amp;gift_type=RecurringGift\" returns gifts of type MatchingGiftPledge or RecurringGift.\r\
          \nAvailable values are <i>Donation</i>, <i>GiftInKind</i>, <i>MatchingGiftPledge</i>, <i>MatchingGiftPayment</i>,\
          \ <i>PlannedGift</i>, <i>Pledge</i>, <i>PledgePayment</i>, <i>RecurringGift</i>, <i>RecurringGiftPayment</i>, <i>Stock</i>,\
          \ <i>SoldStock</i>, and <i>Other</i>."
      - name: receipt_status
        in: query
        required: false
        schema:
          type: array
        description: Represents a list of gift receipt statuses. Returns gifts if their receipt status matches any specified.
          For example, "receipt_status=DoNotReceipt&amp;receipt_status=Receipted" returns gifts that are marked either DoNotReceipt
          or Receipted.
      - name: acknowledgement_status
        in: query
        required: false
        schema:
          type: array
        description: Represents a list of gift acknowledgement statuses. Returns gifts if their acknowledgement status matches
          any specified. For example, "acknowledgement_status=DoNotAcknowledge&amp;acknowledgement_status=Acknowledged" returns
          gifts that are marked either DoNotAcknowledge or Acknowledged.
      - name: campaign_id
        in: query
        required: false
        schema:
          type: array
        description: Represents a list of campaign identifiers. Returns gifts if any of the specified campaign identifiers
          match any of their campaigns. For example, "campaign_id=280&amp;campaign_id=1232" returns gifts with either "280"
          or "1232" campaign identifiers.
      - name: fund_id
        in: query
        required: false
        schema:
          type: array
        description: Represents a list of fund identifiers. Returns gifts if any of the specified fund identifiers match any
          of their funds. For example, "fund_id=280&amp;fund_id=1232" returns gifts with either "280" or "1232" fund identifiers.
      - name: appeal_id
        in: query
        required: false
        schema:
          type: array
        description: Represents a list of appeal identifiers. Returns gifts if any of the specified appeal identifiers match
          any of their appeals. For example, "appeal_id=280&amp;appeal_id=1232" returns gifts with either "280" or "1232"
          appeal identifiers.
      - name: start_gift_date
        in: query
        required: false
        schema:
          type: string
        description: Represents a filter for gifts with a gift date on or after the specified date. If used with end_gift_date,
          returns gifts with gift dates between both values.
      - name: end_gift_date
        in: query
        required: false
        schema:
          type: string
        description: Represents a filter for gifts with a gift date on or before the specified date. If used with start_gift_date,
          returns gifts with gift dates between both values.
      - name: start_gift_amount
        in: query
        required: false
        schema:
          type: number
        description: Represents a filter for gifts with an amount greater than or equal to the specified amount. If used with
          end_gift_amount, returns gifts with amounts between both values.
      - name: end_gift_amount
        in: query
        required: false
        schema:
          type: number
        description: Represents a filter for gifts with an amount less than or equal to the specified amount. If used with
          start_gift_amount, returns gifts with amounts between both values.
      - name: list_id
        in: query
        required: false
        schema:
          type: string
        description: Defines a list identifier used to filter the set of gifts to those included in the specified list. If
          this value is set, other specified filters will be ignored.
      - name: sort
        in: query
        required: false
        schema:
          type: array
        description: "Represents a list of fields to sort the results by. Returns a list that sorts gifts based on the supplied\
          \ fields. Results are in ascending order by default, and a '-' sign denotes descending order. For example, \"sort=date_added,-date\"\
          \ sorts gifts by the \"date_added\" field in ascending order and then by the \"gift date\" field in descending order.\r\
          \nIf only the date_modified field or only the date_added field is provided, then this adds the sort_token parameter\
          \ to the next_link URL to ensure that gifts are stably sorted."
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to return. The default is 500. The maximum is 5000.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip. For use with pagination.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/gift#Collection">collection</a>
            of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/gift#Gift">gift</a> entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection[GiftRead]'
              example:
                count: 1304
                next_link: https://api.sky.blackbaud.com/gift/v1/gifts?limit=3&offset=3
                value:
                - id: '492'
                  acknowledgements:
                  - status: Acknowledged
                  amount:
                    value: 40
                  balance:
                    value: 0
                  batch_number: '23'
                  constituent_id: '565'
                  date: '2005-05-30T00:00:00Z'
                  date_added: '2000-05-23T16:16:23.97Z'
                  date_modified: '2017-03-15T14:00:12.554Z'
                  gift_splits:
                  - id: '1814'
                    amount:
                      value: 40
                    campaign_id: '6'
                    fund_id: '12'
                  gift_status: Active
                  is_anonymous: false
                  constituency: Board Member
                  lookup_id: '161'
                  payments:
                  - payment_method: Cash
                  post_status: DoNotPost
                  receipts:
                  - amount:
                      value: 30
                    date: '2009-07-13T00:00:00Z'
                    status: Receipted
                  reference: Other for Remainder
                  subtype: Membership
                  type: Other
                - id: '1496'
                  amount:
                    value: 30
                  constituent_id: '565'
                  date: '2009-07-13T00:00:00Z'
                  date_added: '2006-01-10T17:54:53.437Z'
                  date_modified: '2017-03-15T14:00:12.554Z'
                  gift_splits:
                  - id: '1230'
                    amount:
                      value: 30
                    campaign_id: '2'
                    fund_id: '7'
                  gift_status: Active
                  is_anonymous: false
                  constituency: Volunteer
                  lookup_id: '1130'
                  post_status: DoNotPost
                  reference: Registration fees for Kyle Bell and Martin Schultz
                  subtype: Membership
                  type: Donation
                - id: '1679'
                  amount:
                    value: 200
                  batch_number: '12'
                  constituent_id: '565'
                  date: '2007-04-05T00:00:00Z'
                  date_added: '2007-04-05T18:33:08.437Z'
                  date_modified: '2017-03-15T14:00:12.554Z'
                  gift_splits:
                  - id: '1423'
                    amount:
                      value: 200
                    fund_id: '36'
                  gift_status: Active
                  is_anonymous: false
                  lookup_id: '1304'
                  post_status: NotPosted
                  post_date: '2007-04-05T00:00:00Z'
                  reference: Bell, Kyle N.
                  type: MatchingGiftPledge
        '400':
          description: Returned when the specified request parameters are not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to view the gifts.
  /gifts/attachments:
    post:
      operationId: CreateGiftAttachment
      summary: Gift attachment (Create)
      description: Creates a gift attachment.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentAdd'
            example:
              date: '2015-10-05T04:00:00Z'
              name: Pledge Thank You Letter
              parent_id: '2396'
              tags:
              - Letter
              type: Link
              url: http://file.com/
        description: An object that represents the gift attachment to add.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the ID of the new gift attachment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: '1281'
        '400':
          description: Returned when the request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to create the attachment.
        '404':
          description: Returned when the specified gift is not found.
  /gifts/attachments/{attachment_id}:
    delete:
      operationId: DeleteGiftAttachment
      summary: Gift attachment (Delete)
      description: Deletes a gift attachment.
      parameters:
      - name: attachment_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the gift attachment to delete.
      responses:
        '200':
          description: Returned when the operation successfully deletes the attachment.
        '400':
          description: Returned when the specified attachment ID in the request URL is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to delete the attachment.
    patch:
      operationId: EditGiftAttachment
      summary: Gift attachment (Edit)
      description: Edits a gift attachment.
      parameters:
      - name: attachment_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the gift attachment to edit.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentEdit'
            example:
              date: '2015-10-05T04:00:00Z'
              name: Pledge Thank You Letter
              tags:
              - Letter
              url: http://example.com/
        description: An object that represents the gift attachment to edit.
      responses:
        '200':
          description: Returned when the operation successfully edits the attachment.
        '400':
          description: Returned when the specified attachment ID in the request URL is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to edit the attachment.
        '404':
          description: Returned when the specified attachment is not found.
  /gifts/customfields:
    post:
      operationId: CreateGiftCustomField
      summary: Gift custom field (Create)
      description: Creates a gift custom field.
