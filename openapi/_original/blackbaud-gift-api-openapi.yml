    RecurringGiftConversionCheck:
      description: The result of a recurring gift conversion check.  This indicates if a recurring gift can be converted to
        an automated recurring gift.
      type: object
      properties:
        can_be_converted:
          description: Indicates if the gift can be converted to an automated recurring gift.
          type: boolean
        token_will_be_required:
          description: Indicates if a token will be required to an automated recurring gift.
          type: boolean
        gift_id:
          description: The immutable system record ID of the gift.
          type: string
        errors:
          description: The collection of errors explaining why the gift cannot be converted to automated, if it cannot be.
          type: array
          items:
            $ref: '#/components/schemas/RecurringGiftConversionError'
      x-display-name: Recurring gift conversion check
      x-display-id: RecurringGiftConversionCheck
