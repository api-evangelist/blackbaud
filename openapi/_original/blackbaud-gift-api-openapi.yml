  /gifts/{gift_id}:
    delete:
      operationId: DeleteGift
      summary: Gift (Delete)
      description: "Deletes a gift.\r\nIf a gift was added in database view or added through the API with the <code>is_manual</code>\
        \ flag set to true, you can only delete it if it is a recurring gift, recurring gift payment, or pledge.\r\nYou can\
        \ delete gifts added via web view except for any recurring gift payment.\r\nRecurring gifts added via web view cannot\
        \ be deleted if their current status is Active or Held.\r\nPledge gifts added via web view or added through the API\
        \ with the <code>is_manual</code> flag set to false cannot be deleted if their payment method is Credit card or Direct\
        \ debit.\r\nRegardless of type, you can’t delete a gift if it has:\r\n<ul><li>claimed Gift Aid</li><li>a payment with\
        \ a live transaction ID</li><li>a GL distribution record</li><li>an adjustment</li><li>a matching gift</li><li>a pledge\
        \ payment record or an uncommitted pledge payment in a batch</li><li>a recurring gift payment record or an uncommitted\
        \ recurring gift payment in a batch</li><li>a write-off</li><li>receipt history</li><li>a receipt status of Receipted</li></ul>"
      parameters:
      - name: gift_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the gift to delete.
      responses:
        '200':
          description: Returned when the operation succeeds and the gift has been deleted.
        '400':
          description: Returned when the specified gift ID in the request URL is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to delete the gift.
        '409':
          description: Returned when the gift isn't eligible to be deleted.
