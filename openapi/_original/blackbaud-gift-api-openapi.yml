      description: An error when attempting to convert a recurring gift.  This indicates the specific reason that a recurring
        gift cannot be converted to automated.
      type: object
      properties:
        gift_id:
          description: The immutable system record ID of the gift.
          type: string
        lookup_id:
          description: The lookup ID of the gift.
          type: string
        exception_error_code:
          format: int32
          description: The exception error code.
          type: integer
        exception_error_message:
          description: The exception error message.
          type: string
        exception_error_name:
          description: The exception error name.
          type: string
        affected_field:
          description: The field affected by the error.
          type: string
      x-display-name: Recurring gift conversion error
      x-display-id: RecurringGiftConversionError
