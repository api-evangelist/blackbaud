        \            <td>A stock.</td>\r\n            </tr>\r\n            <tr>\r\n                <td>SoldStock</td>\r\n\
        \                <td>A sold stock.</td>\r\n            </tr>\r\n            <tr>\r\n                <td>Other</td>\r\
