        \        </tr>\r\n            <tr>\r\n                <td>RecurringGift</td>\r\n                <td>A recurring gift.</td>\r\
        \n            </tr>\r\n            <tr>\r\n                <td>RecurringGiftPayment</td>\r\n                <td>A\
