info:
  title: 'Blackbaud SKY API: Code Table'
  description: This API supports managing code tables.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/codetable
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations,
      examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/codetable
paths:
  /v1/codetables:
    post:
      operationId: CreateCodeTable
      summary: Create a code table (PREVIEW)
      description: 'Creates a new code table.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeTableCreate'
            example:
              name: Committees
              category: All
        description: The code table to add.
      responses:
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '200':
          description: Returned when the operation succeeds. The response body contains the new code table ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: '987'
    get:
      operationId: GetCodeTableList
      summary: Get code table list (PREVIEW)
      description: 'Returns a list of code tables.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: name
        in: query
        required: false
        schema:
          type: string
        description: The name of the code table. Looks for an exact match.
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Fuzzy search for code table names. This will search for code tables that contain the search term in their
          name.
      - name: category
        in: query
        required: false
        schema:
          type: string
          enum:
          - All
          - Biographical
          - Gift
          - Action
          - CFA
          - Solicitor
          - Education
          - Membership
          - Volunteer
          - Prospect
          - Events
          - WorkplaceGiving
        description: Limit to only a certain category of code tables.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      - name: offset
        in: query
        required: false
        schema:
          type: integer
      responses:
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '200':
          description: Returned when the operation succeeds. The response body contains the code table list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeTableCollection'
              example:
                count: 1
                value:
                - code_tables_id: '43'
                  name: Constituent code
                  user_defined: false
                  has_short_description: true
                  short_description_length: 6
                  can_manage: false
                  category: All
                  product_flags: 0
                  country_mask: 0
                  has_entries: true
                  is_field_lookup: false
                  supports_cleanup: false
  /v1/codetables/{code_table_id}/tableentries:
    post:
      operationId: CreateTableEntry
      summary: Create a table entry (PREVIEW)
      description: 'Creates a new table entry.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: code_table_id
        in: path
        required: true
        schema:
          type: string
        description: The code table ID.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableEntryCreate'
            example:
              is_active: true
              long_description: Employee
              short_description: EMP
              numeric_value: 0
              phone_format: None
              phone_type: TelephoneNumber
        description: The table entry to add.
      responses:
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '200':
          description: Returned when the operation succeeds. The response body contains the new table entry ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: '987'
    get:
      operationId: GetTableEntriesList
      summary: Get table entries list (PREVIEW)
      description: 'Returns a list of table entries.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: code_table_id
        in: path
        required: true
        schema:
          type: string
        description: The code table ID.
      - name: long_description
        in: query
        required: false
        schema:
          type: string
        description: Exact match on the long description of the table entry.
      - name: short_description
        in: query
        required: false
        schema:
          type: string
        description: Exact match on the short description of the table entry.
      - name: numeric_value
        in: query
        required: false
        schema:
          type: number
        description: Exact match on the numeric value of the table entry.
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
        description: Indicates whether to include inactive table entries.
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: 'Fuzzy search for table entry names. Checks both long description and short description for the search
          term.

          entries.'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      - name: offset
        in: query
        required: false
        schema:
          type: integer
      responses:
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '200':
          description: Returned when the operation succeeds. The response body contains the table entry list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableEntryCollection'
              example:
                count: 1
                value:
                - table_entries_id: '6'
                  is_active: true
                  long_description: Employee
                  short_description: EMP
                  numeric_value: 0
                  sequence: 3
                  is_system_entry: false
                  code_tables_id: '43'
                  date_added: '0001-01-01T12:00:00Z'
                  date_changed: '0001-01-01T12:00:00Z'
                  added_by_id: '12345'
                  last_changed_by_id: '12345'
                  code_tables_name: Constituent Codes
                  phone_format: None
                  phone_type: TelephoneNumber
