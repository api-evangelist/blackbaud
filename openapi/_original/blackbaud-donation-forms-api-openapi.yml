openapi: 3.0.1
info:
  title: 'Blackbaud SKY API: Donation Forms'
  description: The Donation Forms API manages donation forms and reporting data.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/fms-rport
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations,
      examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/fms-rport
paths:
  /forms/v1:
    get:
      operationId: GetDonationForms
      summary: Get donation forms
      description: Returns a list of forms.
      parameters:
      - name: Blackbaud-ApplicationId
        in: header
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a list of forms.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DonationFormInfoResponse'
              example:
                donationFormInfo:
                - id: ff3b3b3b-3b3b-3b3b-3b3b-3b3b3b3b3b3b
                  name: Donation Form
                  layoutType: Standard
                  mode: Live
                  hostedUrl: https://host.nxt.blackbaud.com/donation-form
components:
  schemas:
    DonationFormInfo:
      type: object
      properties:
        id:
          type: string
          description: The unique ID of the form.
        name:
          type: string
          description: The name of the form.
        layout_type:
          type: string
          description: The layout type of the form.
        mode:
          type: string
          description: The mode of the form.
        environment_id:
          type: string
          description: The environment id of the form.
        hosted_url:
          type: string
          description: The hosted url of the form.
      description: The donation form information.
      example:
        id: ff3b3b3b-3b3b-3b3b-3b3b-3b3b3b3b3b3b
        name: Donation Form
        layoutType: Standard
        mode: Live
        environmentId: p-1234567
        hostedUrl: https://host.nxt.blackbaud.com/donation-form
    DonationFormInfoResponse:
      type: object
      properties:
        donation_form_info:
          type: array
          items:
            $ref: '#/components/schemas/DonationFormInfo'
          description: A list of donation form information.
      description: A list of donation form information.
      example:
        donationFormInfo:
        - id: ff3b3b3b-3b3b-3b3b-3b3b-3b3b3b3b3b3b
          name: Donation Form
          layoutType: Standard
          mode: Live
          hostedUrl: https://host.nxt.blackbaud.com/donation-form
    FormsV1GetRequest:
      type: string
      x-apim-inline: true
  securitySchemes:
    Bb-Api-Subscription-Key:
      type: apiKey
      name: Bb-Api-Subscription-Key
      in: header
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://app.blackbaud.com/oauth/authorize
          tokenUrl: https://oauth2.sky.blackbaud.com/token
          scopes: {}
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
