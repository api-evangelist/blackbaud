          nullable: true
        contact_id:
          type: string
          description: A string value representing the associated Contact ID.
          nullable: true
        organization_id:
          type: string
          description: A string value representing the associated Organization ID.
          nullable: true
        create_date:
          $ref: '#/components/schemas/DateSearchCriteria'
        change_date:
          $ref: '#/components/schemas/DateSearchCriteria'
        custom_fields:
          type: array
