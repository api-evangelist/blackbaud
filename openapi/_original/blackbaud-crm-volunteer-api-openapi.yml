              description: Walkers will need help with directions and we need to ensure we keep them on the walk course.
              volunteer_type: 05e7c5e1-c45f-4fa8-a6d1-5232b5933d61
              site_id: 7a67eb19-fedc-47d9-8ff9-b47d0ee3f5fd
              site_required: false
              base_currency_id: 6abe6c7e-fedc-473d-abe8-505807c94e0e
              estimated_value: 0
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully creates the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
