      description: '

        Searches for a group page within a specific group program. Use the group programs endpoint to obtain the group_program_id.


        In the body of the request, provide the term, page, and limit. term is the string the API uses to search the group
        page name. page is the page of paginated results to pull. limit is the number of results per page, capped at 25.


        include_virtual is optional. When true, groups with no defined location are included. The default value is false.


        To search by location, use the optional distance_in_miles, latitude, and longitude params. Passing a latitude and
        longitude returns groups within a 50 mile radius by default; use distance_in_miles to change the radius.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: group_program_id
        in: path
        required: true
        schema:
