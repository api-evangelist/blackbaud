              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: The requested resource could not be found.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
  /v1/charities/buckets/{bucket_id}/search/charities:
    post:
      operationId: SearchCharities
      summary: Search for charities in a charity bucket (PREVIEW)
      description: '

        Returns charities within a charity bucket that meet the provided criteria. Charity buckets are sets of charities eligible
        for specific CSRconnect features. Pass the bucket ID for the employee and feature you are working with.


        Once you have the bucket ID, you can construct a request to search the bucket. In the body of the request, provide
        the search term, page number, and limit. The term is the string which the API will use to search charity name. The
        page is the page number of the paginated results you want to pull. The limit is the number of results per page. There
        is a limit of 25 results per page.


        For each valid request, the api will return a payload of charity results and details for each organization.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: bucket_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the charity bucket
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CharitiesBucketRequest'
            example:
              terms: habitat
              page: 1
              limit: 10
        description: Search request
      responses:
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: Authentication credentials were missing or invalid.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '400':
          description: Returned when the specified request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: The request was invalid or missing required parameters.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of charities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharityBucketSearchResponse'
              example:
                page_count: 3
                total_count: 25
                page: 1
                limit: 10
                charities:
                - name: Habitat for Humanity
                  id: 1001
                  image_url: https://example.com/images/habitat.png
                  mission_statement: Building homes, communities, and hope.
                  registration_number: REG-001
                  location:
                    address: 285 Peachtree Center Ave NE
                    city: Atlanta
                    state: GA
                    zip: '30303'
                    country_code: US
        '403':
          description: Returned when the user does not have rights to view the charity bucket.
          content:
