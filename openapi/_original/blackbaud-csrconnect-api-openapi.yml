      description: "\nReturns a list of skills used by the organization.\n\nEach organization can turn skills on and off.\
        \ \n            This will only return the skills that are currently active for the associated organization for the\
        \ external api call.\n\n***This endpoint is in PREVIEW and may be changed or removed at any time.***"
