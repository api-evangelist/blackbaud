  /v1/groups/programs:
    get:
      operationId: ListGroupPrograms
      summary: Get group programs (PREVIEW)
      description: '

        Returns all of the group programs configured by the client. In addition to the general details about the group program,
        the payload contains the following:


        group_creators indicates which employees are allowed to create a group within the specific program. A value of "1"
        indicates that only super admins can create group pages and a value of "2" indicates that any employee can create
        a page for the program.


        group_membership_type defines the method of "join" for all pages in the program. A value of "1" indicates that all
        group pages in the program are closed and require a request to join that must be approved by the group administrator.
        A value of "2" indicates that all group pages are open and can be freely joined without approval. A value of "3" indicates
        that the creator of each group determines at the time of page creation whether the group is open or closed.


        group_members_privacy_type defines the user privacy setting for each group in the program. A value of "1" indicates
        that all groups are private and the group page will not show a list of members. A value of "2" indicates that all
        group pages are public and display a list of members. When a group page is public, each user may opt out of being
        shown in the member list.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      responses:
        '400':
          description: Returned when the specified request body is not in the appropriate format.
          content:
