  /v1/employees:
    post:
      operationId: GetEmployeeDetailsByEmployeeId
      summary: Get employee details for special character IDs (PREVIEW)
      description: '

        Returns details for an employee by employee ID. Use this endpoint if the employee ID contains special characters.


        This endpoint returns a high level profile for the employee in CSRconnect. Passing the employee ID as listed on the
        HR file will return a basic user profile. The affiliateEmployee ID returned will be used in other endpoints when fetching
        participation related data.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeDetailsRequest'
            example:
              employee_id: john+doe@example.com
        description: The request containing the employee ID
      responses:
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: Authentication credentials were missing or invalid.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '400':
