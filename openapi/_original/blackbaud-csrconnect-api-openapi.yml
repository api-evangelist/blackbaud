  /v1/metrics/give:
    get:
      operationId: GetGiveMetrics
      summary: Get a summary of giving totals (PREVIEW)
      description: '

        Returns a summary of giving totals for the authenticated affiliate, broken down by donation type.


        The date_type param applies only to donation metrics. It controls whether donations are included by the date the record
        was created or the date of the actual donation. For example, an employee can record an offline donation on one date,
        but the donation itself occurred on an earlier date. For a company match or incentive request that requires approval,
        the create date is when the employee submits the request, and the donation date is when the request is approved and
        becomes a donation.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: country_code
        in: query
        required: true
        schema:
          type: string
        description: The ISO country code used to filter donations by country.
      - name: date_type
        in: query
        required: false
        schema:
          type: string
          enum:
          - Created
          - Donated
        description: Controls whether the date range filters by the date a donation record was created or the date the donation
          was made. Defaults to "created" when omitted and start or end is specified.
      - name: start
        in: query
        required: false
        schema:
          type: string
        description: The start of the date range to include.
      - name: end
        in: query
        required: false
        schema:
          type: string
        description: The end of the date range to include.
      responses:
        '401':
          description: Unauthorized
          content:
