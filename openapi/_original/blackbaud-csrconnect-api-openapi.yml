  /v1/volunteer/events/search:
    post:
      operationId: SearchEvents
      summary: Search volunteer events (PREVIEW)
      description: "\nThis endpoint allows you to search all the volunteer events in the client community. It returns a paginated\
        \ set of results with all the event details. In the body of the post, you will pass the following:\n\nThe term is\
        \ the string that the API will use to search for matching event names.\n\nThe page is the page of results you wish\
        \ to fetch.\n\nThe limit is number of results per page. This can not exceed 25 and will default to 25 if the value\
        \ you pass is greater.\n\nstart_date defines the start date of the date range you are searching within.\n\nend_date\
        \ defines the end date of the date range you are searching within.\n\nmodified_from defines the start date of the\
        \ updated date range you are searching within.\n\nmodified_to defines the end date of the updated date range you are\
        \ searching within.\n\nIf include_virtual is true, all Virtual Events (events with no location) will be included.\
        \ The default value is false.\n\nTo search by location, you can use the optional distance_in_miles, latitude and longitude\
        \ params. \n            By passing a lat and long, your result set will contain events within a 50 mile radius of\
        \ the location. \n            If you wish to change the search radius, use the distance_in_miles param to define a\
        \ different search radius.\n\nIf hide_full is true, all events with a set capacity and no open shifts will be excluded.\n\
        \nNote: In the return, event_type identifies the type of event. \n            If the value is 1, the event was created\
        \ by someone at the company. \n            If the value is 2 the event was created externally by a non-profit. \n\
        \            Also, this is not related to EventTypes (plural) which includes a set of meta data tag \"Types\" that\
        \ are used for reporting and search filtering. \n            These are defined by the event creator while creating\
        \ the event.\n\n***This endpoint is in PREVIEW and may be changed or removed at any time.***"
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventsSearchRequest'
            example:
              term: food bank
              page: 1
              limit: 10
              start_date: '2025-01-01'
              end_date: '2025-12-31'
              include_virtual: true
              hide_full: false
              tags:
              - volunteer
              - community
              types:
