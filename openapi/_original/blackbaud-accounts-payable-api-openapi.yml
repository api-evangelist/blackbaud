  /invoices/attachments:
    post:
      operationId: CreateInvoiceAttachment
      summary: Invoice attachment (Create)
      description: 'Returns the id saved attachment.

        Physical attachments require the request to be a multipart/form-data request and are limited to 25 MB or smaller.

        Physical attachment request must provide "ParentId" and "MediaType" fields instead of "parent_id" and "media_type".'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAttachment'
            example:
              parent_id: 1
              name: Attachment Name
              url: https://www.google.com
              type: Link
              media_type: Other
          multipart/form-data:
            example:
              parent_id: 1
              name: Attachment Name
              url: https://www.google.com
              type: Link
              media_type: Other
        description: The attachment to create.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the file id of the saved attachment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Int32CreatedResult'
              example:
                record_id: 843
        '400':
          description: Returned when the request is not in the correct format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Failed to save {record}
                Details:
                - The total percent distributed must equal 100%.
        '403':
          description: Returned when the user does not have permission to add attachments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights
                  to view it.
        '404':
          description: Returned when the specified invoice could not be found, or the request size exceeds 25 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights
                  to view it.
  /invoices/customfields:
    get:
      operationId: ListInvoiceCustomFields
      summary: Invoice custom field (List)
      description: Returns a list of custom field options.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the list of custom fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldOptionsPagedResponse'
              example:
                count: 24
                results:
                - custom_field_id: 8
                  name: Paid
                  type: Boolean
                  is_required: false
                - custom_field_id: 46
                  name: Demo Custom Field 2
                  type: Table
                  is_required: false
                  table_values:
                  - d1 - Demo 1
                  - d2 - Demo 2
                - custom_field_id: 47
                  name: Cheese Invoice Vendor Name
                  type: Table
                  is_required: false
                  table_values:
                  - MARY - Mary Rowe
                  - MARTY - Marty Rowe
                  - ANDREW - Andrew Rowe
                  - CONNOR - Connor Rowe
                - custom_field_id: 9
                  name: 'WI/Invoice #'
                  type: Number
                  is_required: false
  /invoices/import:
    post:
      operationId: CreateInvoiceImportJob
      summary: Invoice import job (Create)
      description: 'Creates a bulk invoice import job and returns a process ID.

        Use the process ID to upload invoice batches via "Invoice import batch (Upload)" and to poll status via "Invoice import
        status (Get)".

        Requires the InvoiceSaveV2 entitlement. US tenants only.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBulkImportJob'
            example:
              total_invoice_count: 60000
              description: Monthly AP import — June 2026
        description: The import job parameters — total invoice count and optional description.
      responses:
        '200':
          description: Returned when the import job is created. The response body contains the process ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkImportJobCreated'
              example:
                process_id: 0
        '400':
          description: Returned when the request is not in the correct format or limits are exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Failed to save {record}
                Details:
                - The total percent distributed must equal 100%.
        '403':
          description: Returned when the user does not have permission to import invoices, or the InvoiceSaveV2 entitlement
            is not enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights
                  to view it.
  /invoices/import/{process_id}:
    post:
      operationId: UploadInvoiceImportBatch
      summary: Invoice import batch (Upload)
      description: 'Uploads a batch of invoices to an existing import job and triggers async processing.

        Returns a batch process ID. Poll the job status endpoint to track overall progress.'
      parameters:
      - name: process_id
        in: path
        required: true
        schema:
          type: integer
        description: The import job process ID returned by "Invoice import job (Create)".
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadInvoiceBatch'
            example:
              invoices:
              - vendor_id: 0
                invoice_number: string
                approval_status: string
                purchase_order_number: string
                invoice_date: string
                due_date: string
                description: string
                post_status: string
                post_date: string
                amount: 0
                discount_percent: 0
                discount_amount: 0
                discount_expiration_date: string
                distribute_discounts: true
                interfund_set_id: 0
                payment_details:
                  payment_method: string
                  paid_from: string
                  hold_payment: true
                  create_separate_payment: true
                  remit_to_address_id: 0
                distributions:
                - distribution_id: 0
                  amount: 0
                  description: string
                  account_number: string
                  account_id: 0
                  type_code: string
                  distribution_splits:
                  - distribution_split_id: 0
                    project_id: string
                    transaction_code_values:
                    - name: string
                      value: string
                    amount: 0
                    percent: 0
                    account_class: string
                  custom_fields:
                  - field_name: string
                    value: string
                    date: string
                    comments: string
                custom_fields:
                - field_name: string
                  value: string
                  date: string
                  comments: string
                form_1099_box_numbers:
                - box_number: string
                  state: string
                  amount: 0
                notes:
                - type: string
                  date: string
                  description: string
                  content: string
        description: A batch of invoices to queue for async processing (up to 1,000 per batch).
      responses:
        '200':
          description: Returned when the batch is accepted. The response body contains the batch process ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkImportBatchAccepted'
              example:
                batch_process_id: 0
        '400':
          description: Returned when the batch exceeds the allowed size or the total invoice count is exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Failed to save {record}
                Details:
                - The total percent distributed must equal 100%.
        '403':
          description: Returned when the user does not have permission or the process does not belong to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights
                  to view it.
        '404':
          description: Returned when the specified import job process ID does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights
                  to view it.
  /invoices/import/{process_id}/results:
    get:
      operationId: GetInvoiceImportResults
      summary: Invoice import results (Get)
      description: 'Returns per-invoice success/failure results for a completed bulk invoice import job.

        Each result indicates whether the invoice was created and, on failure, the error message.'
      parameters:
      - name: process_id
        in: path
        required: true
        schema:
          type: integer
        description: The import job process ID returned by "Invoice import job (Create)".
      responses:
        '200':
          description: Returned when the results are retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkImportJobResults'
              example:
                status: string
                results:
                - invoice_number: string
                  vendor_id: 0
                  success: true
                  invoice_id: 0
                  issues:
                  - severity: string
                    code: string
                    message: string
        '404':
          description: Returned when the specified import job process ID does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights
                  to view it.
        '403':
          description: Returned when the user does not have permission to view this import job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights
                  to view it.
  /invoices/import/{process_id}/status:
    get:
      operationId: GetInvoiceImportStatus
      summary: Invoice import status (Get)
      description: 'Returns the current progress of a bulk invoice import job.

        Recommended polling interval: 5–10 seconds.

        Stop polling when status is Completed, Failed, or Cancelled, then fetch results.'
      parameters:
      - name: process_id
        in: path
        required: true
        schema:
          type: integer
        description: The import job process ID returned by "Invoice import job (Create)".
      responses:
        '200':
          description: Returned when the status is retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkImportJobStatus'
              example:
                status: string
                total_batches: 0
                completed_batches: 0
                total_invoices: 0
                success_count: 0
                failure_count: 0
                processed_count: 0
        '404':
          description: Returned when the specified import job process ID does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights
                  to view it.
        '403':
          description: Returned when the user does not have permission to view this import job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights
                  to view it.
