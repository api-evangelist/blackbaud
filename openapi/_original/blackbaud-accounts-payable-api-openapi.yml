  /invoices:
    post:
      operationId: CreateInvoice
      summary: Invoice (Create) (Deprecated)
      description: This endpoint has been deprecated. While it remains available for existing integrations, it is no longer
        supported and will not receive updates or enhancements. To improve performance and reliability, this endpoint has
        been replaced by <a href="https://developer.sky.blackbaud.com/api#api=57a342f1d7dcde1c28a749fe&operation=CreateInvoiceProcess">CreateInvoiceProcess</a>.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvoice'
            example:
              vendor_id: 0
              purchase_order_number: '111'
              amount: 100
              description: Invoice description
              invoice_number: '8675309'
              approval_status: Pending
              due_date: '2025-12-31T12:00:00Z'
              payment_details:
                remit_to:
                  address_id: 0
                payment_method: Check
                paid_from: <<BankName>
                credit_card_account_id: 0
