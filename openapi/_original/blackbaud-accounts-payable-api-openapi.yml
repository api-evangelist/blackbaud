                  percent: 100
                  account_class: string
                amount: 500
                account_number: 01-5000-00
                type_code: Credit
                custom_fields: []
              - distribution_id: 0
                distribution_splits:
                - distribution_split_id: 0
                  ui_project_id: '1100'
                  transaction_code_values:
                  - name: Grants
                    value: None
                    id: 0
                    inactive: false
                  amount: 500
                  percent: 100
                  account_class: string
                amount: 500
                account_number: 01-2000-00
                type_code: Debit
                custom_fields: []
              custom_fields: []
              applied_invoices:
              - invoice_id: 32
                invoice_amount: 0
                invoice_balance: 0
                credit_memo_amount_applied: 250
                post_date: '2019-04-22T12:00:00Z'
              form_1099_box_numbers:
              - number: 01 - Rents
                state: SC
                amount: 60
        description: The changes for the credit memo.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the identifier of the specified
            credit memo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Int32CreatedResult'
              example:
                record_id: 843
        '403':
          description: Returned when the user does not have permission to edit the credit memo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights
