      operationId: CreateGiftPlannedGiftLink
      summary: Links a gift to a planned gift. (PREVIEW)
      description: 'Associates the specified gift with a planned gift. The gift must not be a planned gift itself,

        and the planned gift must belong to the same constituent as the gift.

        When ignore_warnings is false (default), the operation returns warnings about

        side effects (e.g., Gift Aid qualification changes in UK environments).

        When ignore_warnings is true, the operation proceeds and executes those side effects.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
