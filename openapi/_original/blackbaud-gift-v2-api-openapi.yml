openapi: 3.0.1
info:
  title: 'Blackbaud SKY API: Gift v2'
  description: This API manages gift information and related entities.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/gft-gifts
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations,
      examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/gft-gifts
paths:
  /v1/gifts/benefits:
    post:
      operationId: AddGiftBenefit
      summary: Create a benefit for a gift. (PREVIEW)
      description: 'Adds a new gift benefit.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BenefitsDetailsRequest'
            example:
              parent_id: 500
              benefit_id: 10
              benefits_id: 0
              count: 2
              unit_cost: 75
              total_benefit_value: 150
              sent:
                y: 2026
                m: 1
                d: 15
              comments: VIP seating included
              is_receipt_amount_update: false
              receipt_amount_update: false
        description: The benefit details to add.
      responses:
        '400':
          description: Returned when the specified request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ModelValidationProblemDetails'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The BenefitID field must be greater than 0.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have the necessary permissions to add gift benefit.
        '200':
          description: Returned when the gift benefit is added. The response body contains the ID of the new benefit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: '1001'
    patch:
      operationId: EditGiftBenefit
      summary: Edit a gift benefit. (PREVIEW)
      description: 'Edit existing gift benefit entry.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BenefitsDetailsRequest'
            example:
              parent_id: 500
              benefit_id: 10
              benefits_id: 1001
              count: 3
              unit_cost: 100
              total_benefit_value: 300
              sent:
                y: 2026
                m: 2
                d: 20
              comments: Updated benefit details
              is_receipt_amount_update: false
              receipt_amount_update: false
        description: The benefit details to update.
      responses:
        '200':
          description: Returned when the operation succeeds.
        '400':
          description: Returned when the specified request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ModelValidationProblemDetails'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The BenefitID field must be greater than 0.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '404':
          description: Returned when the specified gift benefit not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:not-found
                title: Resource not found.
                status: 404
                detail: The specified benefit was not found.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have permission to edit gift benefits.
  /v1/gifts/benefits/notes:
    patch:
      operationId: EditGiftBenefitNotes
      summary: Edit gift benefit notes. (PREVIEW)
      description: 'Updates the benefit notes for a specified gift.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BenefitNotesRequest'
            example:
              benefits_include_notes: true
              parent_id: 12345
              benefits_notes: Updated notes for all benefits in this entity. These notes will be applied to all benefits.
        description: The request containing the parent ID and benefits notes to update.
      responses:
        '200':
          description: Returned when benefit notes are updated successfully.
        '400':
          description: Returned when the request parameters are invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ModelValidationProblemDetails'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The BenefitID field must be greater than 0.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '404':
          description: Returned when the specified gift is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:not-found
                title: Resource not found.
                status: 404
                detail: The specified gift was not found.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have permission to update gift benefit notes.
  /v1/gifts/benefits/{benefit_id}:
    delete:
      operationId: DeleteGiftBenefit
      summary: Delete a gift benefit. (PREVIEW)
      description: 'Deletes an existing gift benefit entry.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: benefit_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the benefit to delete.
      - name: isReceiptAmountUpdate
        in: query
        required: false
        schema:
          type: boolean
        description: When true, recalculates the parent gift's receipt amount after the delete. Deprecated - use receipt_amount_update.
      - name: receipt_amount_update
        in: query
        required: false
        schema:
          type: boolean
        description: When true, recalculates the parent gift's receipt amount after the delete.
      responses:
        '200':
          description: Returned when the operation succeeds.
        '400':
          description: Returned when the data in the request URL is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ModelValidationProblemDetails'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The BenefitID field must be greater than 0.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '404':
          description: Returned when the specified gift benefit not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:not-found
                title: Resource not found.
                status: 404
                detail: The specified benefit was not found.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have permission to delete gift benefits.
    get:
      operationId: GetGiftBenefit
      summary: Get a gift benefit by ID. (PREVIEW)
      description: 'Returns a gift benefit.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: benefit_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the benefit for which to retrieve details.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a gift benefit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenefitsResponse'
              example:
                benefits_id: 1001
                parent_id: 500
                benefit_id: 10
                description: Event Ticket - Annual Gala
                count: 2
                unit_cost: 75
                total_benefit_value: 150
                sent:
                  y: 2026
                  m: 1
                  d: 15
                comments: VIP seating included
                sum_of_total_benefits: 150
                benefits_include_notes: false
        '400':
          description: Returned when the data in the request URL is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ModelValidationProblemDetails'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The BenefitID field must be greater than 0.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '404':
          description: Returned when the specified gift benefit not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:not-found
                title: Resource not found.
                status: 404
                detail: The specified benefit was not found.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have permission to request gift benefit.
  /v1/gifts/{gift_id}/benefits/list:
    get:
      operationId: GetGiftBenefitCollection
      summary: Get benefits for a gift. (PREVIEW)
      description: 'Returns a collection of benefits by gift ID.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: gift_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the gift for which to retrieve benefits.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of gift benefits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenefitCollection'
              example:
                count: 1
                benefits:
                - benefits_id: 1001
                  parent_id: 500
                  benefit_id: 10
                  description: Event Ticket - Annual Gala
                  count: 2
                  unit_cost: 75
                  total_benefit_value: 150
                  sent:
                    y: 2026
                    m: 1
                    d: 15
                  comments: VIP seating included
                  sum_of_total_benefits: 150
                  benefits_include_notes: true
                  benefits_notes: Please include these notes in the acknowledgment letter
        '400':
          description: Returned when the specified request parameters are not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ModelValidationProblemDetails'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The BenefitID field must be greater than 0.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have permission to view gifts.
  /v2/batchgifts/{batchGiftId}:
    patch:
      operationId: EditBatchGift
      summary: Edit Batch Gift (PREVIEW)
      description: 'Updates a batch gift


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: batchGiftId
        in: path
        required: true
        schema:
          type: string
        description: The ID of the batch gift.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchGiftEdit'
        description: The changes to the batch gift.
      responses:
        '200':
          description: Returned when when the gift was updated successfully. Any resolvable exceptions will be returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftValidationErrors'
              example:
                errors:
                - legacy_gift_id: '12345'
                  lookup_id: Lookup-12345
                  error_code: GiftDateOutOfValidRange
                  error_message: The provided date '{0}' does not fall within the valid range for a date.
                  affected_field: GiftDate
                  hard_exception: false
                  batch_id: '12345'
        '403':
          description: Forbidden
        '400':
          description: Returned when the specified batch gift ID or the request body is not in the correct format OR the batch
            is already approved OR exceptions prevented the change from being applied
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AddEditBatchGift400ResponseTypesProblemDetails'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The date field is required.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '404':
          description: Returned when a batch gift with the provided ID does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The date field is required.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
    get:
      operationId: GetBatchGift
      summary: Get Batch Gift (PREVIEW)
      description: 'Returns a single batch gift by ID


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: batchGiftId
        in: path
        required: true
        schema:
          type: string
        description: ID of the batch gift to return
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchGiftRead'
        '403':
          description: Forbidden
        '400':
          description: Returned when no batch gift ID was provided or the ID was not in the correct format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/GetBatchGift400ResponseTypesProblemDetails'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The date field is required.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '404':
          description: Returned when a batch gift with the provided ID does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The date field is required.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
