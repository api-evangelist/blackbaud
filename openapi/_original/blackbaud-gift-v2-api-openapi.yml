        parent_gift_id:
          type: string
          description: The linked parent gift ID for a recurring gift payment.
          nullable: true
        parent_is_manual:
          type: boolean
          description: 'Indicates whether the linked parent recurring gift currently processes payments

            manually (true) or automatically (false). Computed fresh from the parent''s current

            state on every read (not persisted) so it never goes stale if the parent''s automation

            status changes after this payment row was saved. Null when the gift type is not

            RecurringGiftPayment, the parent link could not be resolved, or the parent gift record

            could not be found. False not just when the parent is explicitly automated, but also

            when the found parent gift record''s automation state is unknown — this field fails

            closed to "not manual" rather than assuming manual on unknown state. True whenever the

            parent''s payment method isn''t one the installment engine actually automates (i.e. not

            credit card or direct debit), regardless of NXTGift — a Cash/Check recurring gift is

            always manual, even if NXTGift alone would suggest otherwise (mirrors

            PaymentMethodExtensions.ResolveIsManual, already used the same way elsewhere in this

            service, e.g. PledgeGiftService).'
