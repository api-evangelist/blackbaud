paths:
  /orders:
    post:
      operationId: CreateSalesOrderNote
      summary: Create a sales order note
      description: This operation is used to add a sales order note.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewSalesOrderNote'
            example:
              sales_order_id: ''
              context_type: 0
              title: ''
              date_entered: ''
              author_id: ''
              notetype: ''
              text_note: ''
              html_note: ''
              order_id: ''
              sales_order_item: ''
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully creates the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /orders/{sales_order_id}:
    patch:
      operationId: EditOrderDeliveryInformation
      summary: Edit an order delivery information
      description: Edit the delivery/shipping inoperationation on an order
      parameters:
      - name: sales_order_id
        in: path
        required: true
        schema:
          type: string
        description: The sales order id.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditOrderDeliveryInformation'
            example:
              recipient_id: ''
              address: ''
              phone: ''
              email_address: ''
              address_required: false
              phone_required: false
              email_required: false
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully edits the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to edit the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    get:
      operationId: GetOrderDeliveryInformation
      summary: Get an order delivery information
      description: Edit the delivery/shipping inoperationation on an order
      parameters:
      - name: sales_order_id
        in: path
        required: true
        schema:
          type: string
        description: The sales order id.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDeliveryInformation'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to get the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /orders/{sales_order_id}/view:
    get:
      operationId: ViewOrderPatron
      summary: View an order patron
      description: Provides inoperationation about a patron that is linked to an order.
      parameters:
      - name: sales_order_id
        in: path
        required: true
        schema:
          type: string
        description: The sales order id.
