                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to view the resource.
        '404':
          description: Returned when the specified resource is not found.
  /sales/{sales_order_id}/tickets:
    get:
      operationId: ListOrderTicketsWithoutRefunds
      summary: List sales order tickets without refunds
      description: Lists all tickets belonging to a sales order, regardless of whether they have been refunded.
      parameters:
      - name: sales_order_id
        in: path
        required: true
        schema:
