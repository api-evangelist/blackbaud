info:
  title: 'Blackbaud SKY API: Treasury'
  description: This API is used to manage bank accounts and transactions.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/58e3b2880528ab71c796492e
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations,
      examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/treasury/v1
paths:
  /adjustments/{adjustment_id}:
    get:
      operationId: GetBankAccountAdjustment
      summary: Adjustment (Get)
      description: Retrieves information about a given adjustment.
      parameters:
      - name: adjustment_id
        in: path
        required: true
        schema:
          type: integer
        description: The identifier for the adjustment to retrieve.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the specified adjustment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdjustmentDetail'
              example:
                adjustment_id: 2208
                type: Deposit
                category: Deposit from GL
                number: '1659'
                reference: SmartTuition - Late Fee Withheld Inschool
                amount: 1
                transaction_status: Outstanding
                post_status: Posted
                post_date: '2018-05-18T00:00:00Z'
                date: '2018-05-18T00:00:00Z'
                notes: Adjustment created from Batch 1617
                distributions:
                - distribution_id: 291173
                  amount: 1
                  description: ''
                  account_number: 01-1000-00
                  type_code: Debit
                  custom_fields: []
                  distribution_splits:
                  - distribution_split_id: 502316
                    ui_project_id: '1009'
                    transaction_code_values:
                    - name: Jurisdiction
                      value: ''
                    - name: Spendable?
                      value: ''
                    - name: RE Appeals
                      value: ''
                    - name: Grant
                      value: ''
                    - name: Activities
                      value: ''
                    amount: 1
                    percent: 100
                    account_class: Unrestricted Net Assets
        '403':
          description: Returned when the user does not have permission to view an adjustment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights
                  to view it.
        '404':
          description: Returned when the specified record could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights
                  to view it.
  /bankaccounts:
    get:
      operationId: ListBankAccounts
      summary: Bank account (List)
      description: Returns a list of bank accounts.
      parameters:
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: "Represents the number of records to skip.\r\nFor use with pagination."
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: "Represents the number of records to return. \r\nThe default is 100. \r\nThe maximum allowed value is\
          \ 500."
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the list of bank accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection[BankAccount]'
              example:
                count: 6
                value:
                - bank_account_id: 7
                  account_name: American Express
                  bank_name: American Express
                  ui_account_id: Amex
                  type: Checking
                  current_balance: 11000
                  status: Open
                  account_number: '8675309'
                - bank_account_id: 5
                  account_name: Money Market
                  bank_name: Bank of America
                  ui_account_id: Money Market
                  type: Other
                  current_balance: 972690
                  status: Open
                  account_number: '8675309'
                - bank_account_id: 1
                  account_name: Operating Account
                  bank_name: Bank of America
                  ui_account_id: Operating
                  type: Checking
                  current_balance: 3488518.45
                  status: Open
                  account_number: '8675309'
                - bank_account_id: 2
                  account_name: Payroll Account
                  bank_name: First Bank
                  ui_account_id: Payroll
                  type: Checking
                  current_balance: 4774241.4
                  status: Open
                  account_number: '8675309'
        '400':
          description: Returned when the request is not in the correct format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Invalid Request
                Details:
                - The value 'fake' is not valid for transaction_status.
                ErrorPath: null
        '403':
          description: Returned when the user does not have permission to view bank accounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights
                  to view it.
