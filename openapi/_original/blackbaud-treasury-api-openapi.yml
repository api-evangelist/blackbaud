  /bankaccounts/{bank_account_id}/adjustments:
    post:
      operationId: CreateBankAccountAdjustment
      summary: Adjustment (Create)
      description: Creates a new adjustment.
      parameters:
      - name: bank_account_id
        in: path
        required: true
        schema:
          type: integer
        description: The bank account identifier for this adjustment.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdjustment'
            example:
              category: Payment from GL
              number: 1700
              date: '2018-03-20T00:00:00Z'
              amount: 1
              type: Payment
              transfer_to_account: 2
              reference: Adjustment payment
              is_cleared: true
              cleared_date: '2018-02-20T00:00:00Z'
              post_status: NotYetPosted
              post_date: '2018-03-20T00:00:00Z'
              distributions:
              - distribution_id: 0
                amount: 1
                account_number: 01-1000-00
                type_code: Debit
                custom_fields: []
                distribution_splits:
                - distribution_split_id: 0
                  ui_project_id: '1001'
                  transaction_code_values:
                  - name: Jurisdiction
                    value: None
                  - name: Spendable?
                    value: Spendable
                  - name: RE Appeals
                    value: ''
                  - name: Grant
                    value: ''
                  - name: Activities
                    value: ''
                  amount: 1
                  percent: 100
                  account_class: Unrestricted Net Assets
              - distribution_id: 0
                amount: 1
                account_number: 01-1000-00
                type_code: Credit
                custom_fields: []
                distribution_splits:
                - distribution_split_id: 0
                  ui_project_id: '1001'
                  transaction_code_values:
                  - name: Jurisdiction
                    value: None
                  - name: Spendable?
                    value: Spendable
                  - name: RE Appeals
                    value: ''
                  - name: Grant
                    value: ''
                  - name: Activities
                    value: ''
                  amount: 1
                  percent: 100
                  account_class: Unrestricted Net Assets
              interfund_entry_set: '00'
        description: The adjustment to create.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the specified adjustment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedResult[Int32]'
              example:
                record_id: 843
        '400':
          description: Returned when the request is not in the correct format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Failed to save {record}
                Details:
                - The total percent distributed must equal 100%.
                ErrorPath: null
        '403':
          description: Returned when the user does not have permission to create an adjustment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights
                  to view it.
        '404':
          description: Returned when specified bank account could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights
                  to view it.
    get:
