            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to delete the resource.
      tags:
      - Emailaddresses
    patch:
      operationId: EditConstituentEmailAddress
      summary: Edit a constituent email address
      description: This operation is used to edit email addresses.
      parameters:
      - name: email_address_id
        in: path
        required: true
        schema:
          type: string
        description: The email address id.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditConstituentEmailAddress'
            example:
              email_address_type: Email
              email_address: jules@att.com
              primary: false
              do_not_email: false
              spouse_name: ''
              spouse_has_matching_email_address: false
              update_matching_spouse_email_address: false
              household: false
              household_member: false
              update_matching_household_email_address: false
              matching_household_members:
              - constituent_id: ''
                name: ''
                relationship_to_primary: ''
              info_source: ''
              info_source_comments: ''
              constituent_data_review_rollback_reason: ''
              forced_primary: false
              can_edit_primary: false
              invalid_fields: ''
              origin: User
              start_date: '2016-02-18T12:00:00Z'
              end_date: '2017-06-12T12:00:00Z'
              invalid_email: false
              email_bounced_date: '2018-01-03T12:00:00Z'
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully edits the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to edit the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Emailaddresses
    get:
      operationId: GetConstituentEmailAddress
      summary: Get a constituent email address
      description: This operation is used to edit email addresses.
      parameters:
      - name: email_address_id
        in: path
        required: true
        schema:
          type: string
        description: The email address id.
      responses:
