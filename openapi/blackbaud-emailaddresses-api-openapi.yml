openapi: 3.2.0
info:
  title: Blackbaud Emailaddresses API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Emailaddresses across 3 of this provider''s published API definitions: blackbaud-altru-constituent-api-openapi.yml, blackbaud-constituent-api-openapi.yml, blackbaud-crm-constituent-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/alt-conmg
- url: https://api.sky.blackbaud.com/constituent/v1
- url: https://api.sky.blackbaud.com/crm-conmg
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Emailaddresses
paths:
  /emailaddresses:
    post:
      operationId: CreateConstituentEmailAddress
      summary: Create a constituent email address
      description: This operation is used to add email addresses.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewConstituentEmailAddress'
            example:
              constituent_id: 11163BAF-07CF-40A1-AA54-E5F2C2F3AECC
              email_address_type: Email
              email_address: tmv@groupmail.net
              primary: true
              spouse_name: ''
              update_matching_spouse_email_address: false
              household: false
              household_member: false
              update_matching_household_email_address: false
              do_not_email: false
              info_source: ''
              info_source_comments: ''
              constituent_data_review_rollback_reason: ''
              forced_primary: false
              can_edit_primary: false
              invalid_fields: ''
              origin: User
              start_date: '2015-09-18T12:00:00Z'
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully creates the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Emailaddresses
    get:
      operationId: ListConstituentEmailAddressesAllConstituents
      summary: Email address list (All constituents)
      description: 'Returns a paginated list of email addresses.


        The default sorting behavior is to list email addresses in ascending order based on when they were created.


        However, the last_modified parameter overrides the default sorting behavior to list email addresses in ascending order based on when they were last modified. The last_modified parameter also adds the sort_token parameter to the next_link URL to ensure that email addresses are stably sorted and that order persists when changes occur while working through a paginated list.


        If the last_modified and date_added parameters are both specified, the sorting behavior is to list email addresses based on when they were last modified.


        Note: This endpoint returns data with an average latency of about 30 minutes. In addition, historic records have a default date_added timestamp of 1600-01-01 00:00:00.000 +00:00. The timestamp for newer records reflects when the records were added.'
      parameters:
      - name: date_added
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for email addresses created on or after the specified date. The filter respects time offsets from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for email addresses modified on or after the specified date. The filter respects time offsets from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
        description: Set this parameter to "true" to include inactive email addresses in the response.
      - name: sort_token
        in: query
        required: false
        schema:
          type: string
        description: Represents a token filter to provide the next stable-sorted list of email addresses. This will be provided on the next_link collection response property when last_modified or sort_token filters are specified on the request.
      - name: constituent_id
        in: query
        required: false
        schema:
          type: array
        description: Represents a list of constituent identifiers. Returns email addresses if any of the specified constituent identifiers match any of the email addresses' associated constituents. For example, "constituent_id=280&amp;constituent_id=1232" returns email addresses with either "280" or "1232" constituent identifiers.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to return. The default is 500. The maximum is 5000.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip. For use with pagination.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a> of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#EmailAddress">email address</a> entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfEmailAddressRead'
              example:
                count: 52
                next_link: https://api.sky.blackbaud.com/constituent/v1/emailaddresses?offset=4&limit=4
                value:
                - id: '131'
                  address: JPdiresta@net.com
                  constituent_id: '185'
                  date_added: '1600-01-01T00:00:00Z'
                  date_modified: '2016-10-19T19:42:38.775Z'
                  do_not_email: false
                  inactive: false
                  primary: false
                  type: Email
                - id: '135'
                  address: adiresta@aol.net.com
                  constituent_id: '333'
                  date_added: '1600-01-01T00:00:00Z'
                  date_modified: '2016-10-19T19:42:38.775Z'
                  do_not_email: false
                  inactive: false
                  primary: false
                  type: Email
                - id: '283'
                  address: robertcarloshernandez@gmail.com
                  constituent_id: '280'
                  date_added: '1600-01-01T00:00:00Z'
                  date_modified: '2016-10-19T19:42:38.775Z'
                  do_not_email: false
                  inactive: false
                  primary: false
                  type: Email
                - id: '289'
                  address: AEA@anet.com
                  constituent_id: '188'
                  date_added: '1600-01-01T00:00:00Z'
                  date_modified: '2016-10-19T19:42:38.775Z'
                  do_not_email: false
                  inactive: false
                  primary: false
                  type: Email
        '400':
          description: Returned when the specified request parameters are not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to view the email addresses.
      tags:
      - Emailaddresses
    servers:
    - url: https://api.sky.blackbaud.com/alt-conmg
  /emailaddresses/{email_address_id}:
