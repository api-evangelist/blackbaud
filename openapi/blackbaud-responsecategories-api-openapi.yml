paths:
  /responsecategories:
    post:
      operationId: CreateResponseCategory
      summary: Create a response category
      description: This operation is used to add response categories.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewResponseCategory'
            example:
              id: ''
              name: ''
              sort_method: Alpha
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully creates the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Responsecategories
    servers:
    - url: https://api.sky.blackbaud.com/alt-mktmg
  /responsecategories/{response_category_id}:
    delete:
      operationId: DeleteResponseCategory
      summary: Delete a response category
      description: This handles the deletion of a response category.
      parameters:
      - name: response_category_id
        in: path
        required: true
        schema:
          type: string
        description: The response category id
      responses:
        '200':
          description: Returned when the operation successfully deletes the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to delete the resource.
      tags:
      - Responsecategories
    patch:
      operationId: EditResponseCategory
      summary: Edit a response category
      description: This operation is used to edit response categories.
      parameters:
      - name: response_category_id
        in: path
        required: true
        schema:
          type: string
        description: The response category id.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditResponseCategory'
            example:
              name: letter sent
              sort_method_code: 0
              inactive: true
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully edits the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
