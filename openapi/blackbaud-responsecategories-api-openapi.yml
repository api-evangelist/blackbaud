      - Responsecategories
    get:
      operationId: GetResponseCategory
      summary: Get a response category
      description: This operation is used to edit response categories.
      parameters:
      - name: response_category_id
        in: path
        required: true
        schema:
          type: string
        description: The response category id.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseCategory'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to get the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
