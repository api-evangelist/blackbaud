components:
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          description: A URI reference [RFC3986] that identifies the problem type. This specification encourages that, when dereferenced, it provide human-readable documentation for the problem type (e.g., using HTML [W3C.REC-html5-20141028]). When this member is not present, its value is assumed to be "about:blank".
        title:
          type: string
          description: A short, human-readable summary of the problem type. It SHOULD NOT change from occurrence to occurrence of the problem, except for purposes of localization (e.g., using proactive content negotiation; see [RFC7231], Section 3.4).
        status:
          type: integer
          description: The HTTP status code ([RFC7231], Section 6) generated by the origin server for this occurrence of the problem.
          format: int32
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        instance:
          type: string
          description: A URI reference that identifies the specific occurrence of the problem. It may or may not yield further information if dereferenced.
        trace_id:
          type: string
          description: A request ID that can be provided to Blackbaud Support that may help with further troubleshooting.
        span_id:
          type: string
          description: A request ID that can be provided to Blackbaud Support that may help with further troubleshooting.
      additionalProperties: false
      description: A machine-readable format for specifying errors in HTTP API responses based on https://tools.ietf.org/html/rfc7807.
      x-display-name: Problem details
      x-display-id: ProblemDetails
    ResponseCategory:
      required:
      - name
      - sort_method
      type: object
      properties:
        name:
          maxLength: 100
          minLength: 0
          type: string
          description: The name.
        sort_method:
          type: string
          description: The sort method. Available values are <i>alpha</i>, <i>user-defined</i>
        inactive:
          type: boolean
          description: Indicates whether inactive.
      additionalProperties: false
      description: GetResponseCategory
      x-display-name: Response Category Edit Form
      x-display-id: Response Category Edit Form
    NewResponseCategory:
      required:
      - name
      - sort_method
      type: object
      properties:
        id:
          type: string
          description: The ID.
        name:
          maxLength: 100
          minLength: 0
          type: string
          description: The name.
        sort_method:
          type: string
          description: The sort method. Available values are <i>alpha</i>, <i>user-defined</i>
      additionalProperties: false
      description: CreateResponseCategory
      example:
        id: ''
        name: ''
        sort_method: Alpha
      x-display-name: Response Category Add Form
      x-display-id: Response Category Add Form
    EditResponseCategory:
      type: object
      properties:
        name:
          maxLength: 100
          minLength: 0
          type: string
          description: The name.
        sort_method:
          type: string
          description: The sort method. Available values are <i>alpha</i>, <i>user-defined</i>
        inactive:
          type: boolean
          description: Indicates whether inactive.
      additionalProperties: false
      description: EditResponseCategory
      example:
        name: letter sent
        sort_method_code: 0
        inactive: true
      x-display-name: Response Category Edit Form
      x-display-id: Response Category Edit Form
    PostResponse:
      type: object
      properties:
        id:
          type: string
          description: The newly created ID.
      additionalProperties: false
      description: Defines the shape of a post response object.
