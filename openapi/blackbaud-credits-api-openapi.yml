      x-bb-error-types:
      - urn:blackbaud:model-validation-error
      - urn:blackbaud:validation-error
    ContactType:
      title: ContactType
      enum:
      - Unknown
      - Person
      - Organization
      type: string
      description: Contact type
    FlatRate:
      type: object
      properties:
        amount:
          type:
          - number
          - 'null'
          description: The default flat rate.
          format: decimal
        allow_changes_to_amount:
          type: boolean
          description: Whether the user can edit the billing item amount after it's applied. For example, on a charge.
      additionalProperties: false
      description: The flat rate item details.
    VariableRate:
      required:
      - quantity
      - quantity_decimals
      - unit_price_decimals
      type: object
      properties:
        unit_of_measure_entry:
          $ref: '#/components/schemas/ReceivablesCodeTableEntry'
        quantity:
          type: number
          description: The quantity sold for a specified unit.
          format: decimal
        quantity_decimals:
          type: integer
          description: The number of decimals to input and round the quantity.
          format: int32
        unit_price:
          type:
          - number
          - 'null'
          description: The price per unit.
          format: decimal
        unit_price_decimals:
          type: integer
          description: The number of decimals to input and round the unit price.
          format: int32
        allow_changes_quantity_and_unit_price:
          type: boolean
          description: The user is allowed to edit the Billing Item's unit price after it is applied, such as on a Charge.
        trade_discount_percent:
          type: number
          description: Trade Discount Percentage for Charge and Line Item calculations.
          format: decimal
        trade_discount_amount:
          type: number
          description: Calculated Trade Discount Amount for Charge and Line Item calculations.
          format: decimal
          readOnly: true
        amount:
          type: number
          description: Amount calculated from other property values
          format: decimal
          readOnly: true
      additionalProperties: false
      description: The details for an item with variable quantity.
    CreditListView:
      required:
      - added_by
      - applied_amount
      - balance
      - billing_item_id
      - billing_item_name
      - client
      - credit_amount
      - credit_date
      - date_added
      - id
      - last_changed_by
      - last_changed_date
      - lookup_id
      - post_date
      - post_status
      type: object
      properties:
        id:
          minLength: 1
          type: string
          description: The ID.
        lookup_id:
          minLength: 1
          type: string
          description: The ID of the lookup.
        credit_amount:
          type: number
          description: The credit amount.
          format: decimal
        balance:
          type: number
          description: The credit balance amount.
          format: decimal
        applied_amount:
          type: number
          description: The applied portion of the credit amount.
          format: decimal
        client:
          $ref: '#/components/schemas/Contact'
        credit_date:
          type: string
          description: The record create date.
          format: date-time
        post_date:
          type: string
          description: The post date.
          format: date-time
        post_status:
          $ref: '#/components/schemas/PostStatus'
        print_status:
          $ref: '#/components/schemas/PrintStatus'
        description:
          type:
          - string
          - 'null'
          description: The credit description.
        billing_item_id:
          minLength: 1
          type: string
          description: The ID of the billing item.
        billing_item_name:
          minLength: 1
          type: string
          description: The billing item name.
        flat_rate:
          $ref: '#/components/schemas/FlatRate'
        variable_rate:
          $ref: '#/components/schemas/VariableRate'
        notes:
          type:
          - string
          - 'null'
          description: The credit notes.
        comment:
          type:
          - string
          - 'null'
          description: The comment.
        added_by:
          minLength: 1
          type: string
          description: The user name who created the record.
        date_added:
          type: string
          description: The record create date.
          format: date-time
        last_changed_by:
          minLength: 1
          type: string
          description: The user name who last changed the record.
        last_changed_date:
          type: string
          description: The record last changed date.
          format: date-time
      additionalProperties: false
      description: The response containing info about each credit to display in a list.
    PostStatus:
      title: PostStatus
      enum:
      - DoNotPost
      - NotYetPosted
      - Posted
      type: string
      description: Post status
    ReceivablesCodeTableEntry:
      required:
      - id
      - value
      type: object
      properties:
        id:
          type: string
          description: The ID of the code table entry.
        value:
          minLength: 1
          type: string
          description: The value of the code table entry.
      additionalProperties: false
      description: The request containing info for a code table entry.
    CreditList:
      required:
      - credits
      - limit
      - offset
      type: object
      properties:
        credits:
          type: array
          items:
            $ref: '#/components/schemas/CreditListView'
          description: The page of credits using list view
        limit:
          type: integer
          description: The maximum number of items to return.
          format: int32
        offset:
          type: integer
          description: The number of items skipped before this list was created.
          format: int32
      additionalProperties: false
      description: Paged list of credits
      x-bb-suppressions:
      - list_operation_pagination_style
    PrintStatus:
      title: PrintStatus
      enum:
      - NotYetPrinted
      - Printed
      - DoNotPrint
      - RePrint
      type: string
      description: Print status
  securitySchemes:
    Bb-Api-Subscription-Key:
      type: apiKey
      name: Bb-Api-Subscription-Key
      in: header
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://app.blackbaud.com/oauth/authorize
          tokenUrl: https://oauth2.sky.blackbaud.com/token
          scopes: {}
