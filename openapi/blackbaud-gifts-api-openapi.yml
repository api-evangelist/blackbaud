    GiftListOptions:
      description: Defines options and filter criteria when getting a list of gifts.
      type: object
      properties:
        date_added:
          format: date-time
          description: 'Represents a filter for gifts created on or after the specified date. The filter respects time offsets from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
          type: string
          x-supports-datetime-offset: true
        last_modified:
          format: date-time
          description: 'Represents a filter for gifts modified on or after the specified date. The filter respects time offsets from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
          type: string
          x-supports-datetime-offset: true
        sort_token:
          description: Represents a token filter to provide the next stable-sorted list of gifts. This will be provided on the next_link collection response property when last_modified or sort_token filters are specified on the request.
          type: string
        constituent_id:
          description: Represents a list of constituent identifiers. Returns gifts if any of the specified constituent identifiers match any of their constituents. For example, "constituent_id=280&amp;constituent_id=1232" returns gifts with either "280" or "1232" constituent identifiers.
          type: array
          items:
            type: string
        post_status:
          description: Represents a list of gift post statuses. Returns gifts if their post status matches any specified. For example, "post_status=DoNotPost&amp;post_status=Posted" returns gifts that are marked either DoNotPost or Posted.
          type: array
          items:
            type: string
        gift_type:
          description: 'Represents a list of gift types. Returns gifts if their type matches any specified. For example, "gift_type=MatchingGiftPledge&amp;gift_type=RecurringGift" returns gifts of type MatchingGiftPledge or RecurringGift.

            Available values are <i>Donation</i>, <i>GiftInKind</i>, <i>MatchingGiftPledge</i>, <i>MatchingGiftPayment</i>, <i>PlannedGift</i>, <i>Pledge</i>, <i>PledgePayment</i>, <i>RecurringGift</i>, <i>RecurringGiftPayment</i>, <i>Stock</i>, <i>SoldStock</i>, and <i>Other</i>.'
          type: array
          items:
            type: string
        receipt_status:
          description: Represents a list of gift receipt statuses. Returns gifts if their receipt status matches any specified. For example, "receipt_status=DoNotReceipt&amp;receipt_status=Receipted" returns gifts that are marked either DoNotReceipt or Receipted.
          type: array
          items:
            type: string
        acknowledgement_status:
          description: Represents a list of gift acknowledgement statuses. Returns gifts if their acknowledgement status matches any specified. For example, "acknowledgement_status=DoNotAcknowledge&amp;acknowledgement_status=Acknowledged" returns gifts that are marked either DoNotAcknowledge or Acknowledged.
          type: array
          items:
            type: string
        campaign_id:
          description: Represents a list of campaign identifiers. Returns gifts if any of the specified campaign identifiers match any of their campaigns. For example, "campaign_id=280&amp;campaign_id=1232" returns gifts with either "280" or "1232" campaign identifiers.
          type: array
          items:
            type: string
        fund_id:
          description: Represents a list of fund identifiers. Returns gifts if any of the specified fund identifiers match any of their funds. For example, "fund_id=280&amp;fund_id=1232" returns gifts with either "280" or "1232" fund identifiers.
          type: array
          items:
            type: string
        appeal_id:
          description: Represents a list of appeal identifiers. Returns gifts if any of the specified appeal identifiers match any of their appeals. For example, "appeal_id=280&amp;appeal_id=1232" returns gifts with either "280" or "1232" appeal identifiers.
          type: array
          items:
            type: string
        start_gift_date:
          format: date-time
          description: Represents a filter for gifts with a gift date on or after the specified date. If used with end_gift_date, returns gifts with gift dates between both values.
          type: string
          x-supports-datetime-offset: false
        end_gift_date:
          format: date-time
          description: Represents a filter for gifts with a gift date on or before the specified date. If used with start_gift_date, returns gifts with gift dates between both values.
          type: string
          x-supports-datetime-offset: false
        start_gift_amount:
          format: double
          description: Represents a filter for gifts with an amount greater than or equal to the specified amount. If used with end_gift_amount, returns gifts with amounts between both values.
          type: number
        end_gift_amount:
          format: double
          description: Represents a filter for gifts with an amount less than or equal to the specified amount. If used with start_gift_amount, returns gifts with amounts between both values.
          type: number
        list_id:
          description: Defines a list identifier used to filter the set of gifts to those included in the specified list. If this value is set, other specified filters will be ignored.
          type: string
        sort:
          description: 'Represents a list of fields to sort the results by. Returns a list that sorts gifts based on the supplied fields. Results are in ascending order by default, and a ''-'' sign denotes descending order. For example, "sort=date_added,-date" sorts gifts by the "date_added" field in ascending order and then by the "gift date" field in descending order.

            If only the date_modified field or only the date_added field is provided, then this adds the sort_token parameter to the next_link URL to ensure that gifts are stably sorted.'
          type: array
          items:
            type: string
        limit:
          format: int32
          description: Represents the number of records to return. The default is 500. The maximum is 5000.
          maximum: 5000
          minimum: 0
          type: integer
        offset:
          format: int32
          description: Represents the number of records to skip. For use with pagination.
          maximum: 2147483647
          minimum: 0
          type: integer
