  /gifts/{gift_id}:
    delete:
      operationId: DeleteGift
      summary: Gift (Delete)
      description: 'Deletes a gift.

        If a gift was added in database view or added through the API with the is_manual flag set to true, you can only delete it if it is a recurring gift, recurring gift payment, or pledge.

        You can delete gifts added via web view except for any recurring gift payment.

        Recurring gifts added via web view cannot be deleted if their current status is Active or Held.

        Pledge gifts added via web view or added through the API with the is_manual flag set to false cannot be deleted if their payment method is Credit card or Direct debit.

        Regardless of type, you can’t delete a gift if it has:


        claimed Gift Aid


        a payment with a live transaction ID


        a GL distribution record


        an adjustment


        a matching gift


        a pledge payment record or an uncommitted pledge payment in a batch


        a recurring gift payment record or an uncommitted recurring gift payment in a batch


        a write-off


        receipt history


        a receipt status of Receipted'
      parameters:
      - name: gift_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the gift to delete.
      responses:
        '200':
          description: Returned when the operation succeeds and the gift has been deleted.
        '400':
          description: Returned when the specified gift ID in the request URL is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to delete the gift.
        '409':
          description: Returned when the gift isn't eligible to be deleted.
      tags:
      - Gifts
    patch:
      operationId: EditGift
      summary: Gift (Edit)
      description: 'Edits a gift.

        Posted gifts cannot be modified.'
      parameters:
      - name: gift_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the gift to edit.
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
        description: ETag of the Entity. The value should match the current ETag header value from the gift GET request or it should be * for an unconditional update.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GiftEdit'
            example:
              constituency: Parent
              date: '2019-08-10T11:14:03Z'
              gift_code: TestGiftCode
              gift_status: Held
              is_anonymous: false
              lookup_id: testlookupid2
              marketing_details:
                finder_number: 136
                mailing_id: 1548
                marketing_source_code: Radio
              recurring_gift_status_date:
                y: '2019'
                m: '4'
                d: '17'
              reference: reference2
              subtype: Computers
        description: An object that represents the properties of the gift to edit.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftsGift_idPatch200ApplicationJsonResponse'
              example: {}
        '400':
          description: Returned when the specified gift ID in the URL or the specified request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to edit the gift.
        '404':
          description: Returned when the specified gift is not found.
      tags:
      - Gifts
    get:
      operationId: GetGift
      summary: Gift (Get)
      description: Returns information about a gift.
      parameters:
