openapi: 3.2.0
info:
  title: Blackbaud Gifts API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Gifts across 5 of this provider''s published API definitions: blackbaud-altru-revenue-api-openapi.yml, blackbaud-crm-revenue-api-openapi.yml, blackbaud-gift-aid-api-openapi.yml, blackbaud-gift-api-openapi.yml, blackbaud-gift-v2-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/alt-revmg
- url: https://api.sky.blackbaud.com/crm-revmg
- url: https://api.sky.blackbaud.com/gar-gfacr
- url: https://api.sky.blackbaud.com/gift/v1
- url: https://api.sky.blackbaud.com/gft-gifts
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Gifts
paths:
  /gifts:
    get:
      operationId: ListGifts
      summary: List gifts
      description: Returns a list of gifts.
      parameters:
      - name: constituent_id
        in: query
        required: false
        schema:
          type: string
        description: represents array of constituent identifiers. returns gifts if any of the specified constituent identifier match any of their constituent. for example, "constituentid=afd5d120-2784-4e99-88c0-cc487423d005" returns gifts with "afd5d120-2784-4e99-88c0-cc487423d005" constituent identifier.the maximum limit is 1000
      - name: gift_type
        in: query
        required: false
        schema:
          type: string
        description: represents a list of gift types. returns gifts if their type matches any specified. for example, "gifttype=recurring gift, payment, pledge" returns gifts of type "recurring gift" or "payment" or "pledge". available values are invoice, credit memo, system transaction, journal entry batch, reversal, charge, ap payment, credit, payment, pledge, recurring gift, matching gift claim, planned gift, order, grant award, auction donation, donor challenge claim, computer check, pending gift, deposit, adjustment deposit, adjustment payment, adjustment transfer out, adjustment transfer in, membership installment plan, write off, sold stock, sold property, refund, deposit correction short, deposit correction over, payout, sold gift in kind, deleted revenue.
      - name: appeal_id
        in: query
        required: false
        schema:
          type: string
        description: represents a list of appeal identifiers. returns gifts if any of the specified appeal identifiers match any of their appeals. for example, "appealid=e10a4542-9c7b-453f-99f6-4167438637b7,df36ad28-3597-455a-bae7-a1230d8f0f67" returns gifts with either "e10a4542-9c7b-453f-99f6-4167438637b7" or "df36ad28-3597-455a-bae7-a1230d8f0f67" appeal identifiers.
      - name: designation_id
        in: query
        required: false
        schema:
          type: string
        description: represents a list of designation identifiers. returns gifts if any of the specified designation identifiers match any of their designation. for example, "fund id=e10a4542-9c7b-453f-99f6-4167438637b7,df36ad28-3597-455a-bae7-a1230d8f0f67" returns gifts with either "e10a4542-9c7b-453f-99f6-4167438637b7" or "df36ad28-3597-455a-bae7-a1230d8f0f67" fund identifiers.
      - name: date_added
        in: query
        required: false
        schema:
          type: string
        description: 'Format - date (as full-date in RFC3339). represents a filter for gifts created on or after the specified date. the filter respects time offsets from utc per the iso-8601 format: 2016-05-05t17:59:31.1600745-04:00.'
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: 'Format - date (as full-date in RFC3339). represents a filter for gifts modified on or after the specified date. the filter respects time offsets from utc per the iso-8601 format: 2016-05-05t17:59:31.1600745-04:00.'
      - name: date_filter
        in: query
        required: false
        schema:
          type: string
          enum:
          - Today
          - This week
          - Last week
          - This month
          - Last month
          - This quarter
          - Last quarter
          - This calendar year
          - Last calendar year
          - This fiscal year
          - Last fiscal year
          - All dates
          - Specific date range
        description: represents a filter for gifts with selected gift date range.
      - name: start_date
        in: query
        required: false
        schema:
          type: string
        description: Format - date (as full-date in RFC3339). represents a filter for gifts with a gift date on or after the specified date. if used with end date, returns gifts with gift dates between both values.
      - name: end_date
        in: query
        required: false
        schema:
          type: string
        description: Format - date (as full-date in RFC3339). represents a filter for gifts with a gift date on or before the specified date. if used with start date, returns gifts with gift dates between both values.
      - name: sort_parameter
        in: query
        required: false
        schema:
          type: string
        description: represents a parameter to pass column name for sorting.
      - name: sort_order
        in: query
        required: false
        schema:
          type: string
        description: represents a parameter to sort records by ascending or descending order. the default is asc.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Limits the number of records to return.
      - name: session_key
        in: query
        required: false
        schema:
          type: string
        description: A unique key provided by user for paging results. The same key will be returned in a successful response.
      - name: infinity_session
        in: query
        required: false
        schema:
          type: string
        description: Values for cookies related to the Infinity load balancer session.
      - name: more_rows_range_key
        in: query
        required: false
        schema:
          type: string
        description: Key for accessing cached results on subsequent calls to this data list.
      - name: start_row_index
        in: query
        required: false
        schema:
          type: integer
        description: Number of rows to skip,get result after these rows.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of result entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftListCollection'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to view the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Gifts
    post:
      operationId: CreateGift
      summary: Gift (Create)
      description: Creates a gift.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GiftAdd'
            example:
              amount:
                value: 100
              constituent_id: '280'
              date: '2017-10-03T00:00:00Z'
              fundraisers:
              - amount:
                  value: 100
                constituent_id: '252'
              gift_splits:
              - amount:
                  value: 100
                appeal_id: '15'
                campaign_id: '1'
                fund_id: '41'
              gift_status: Active
              is_anonymous: false
              lookup_id: '2225'
              origin: '{"name": "Gift origin name"}'
              payments:
              - payment_method: Cash
              post_date: '2017-10-03T00:00:00Z'
              post_status: NotPosted
              reference: newly added gift
              soft_credits:
              - amount:
                  value: 100
                constituent_id: '187'
              subtype: Annuity
              type: Donation
        description: An object that represents the gift to create.
      responses:
        '200':
          description: Returned when the operation successfully creates a gift. The response body contains the ID of the new gift.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: '1281'
        '400':
          description: Returned when the specified request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to create the gift.
      tags:
      - Gifts
    servers:
    - url: https://api.sky.blackbaud.com/alt-revmg
  /v1/gifts/{gift_id}/giftaid:
    get:
      operationId: GetGiftTaxByGiftId
      summary: Get gift record with gift splits by gift ID
      description: Get single gift by gift ID
      parameters:
      - name: gift_id
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier for the gift table
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the gift and gift splits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftTax'
              example:
                id: 3
                constituent_id: 186
                gift_aid_qualification_method: ApplyRulesWhenSaving
                gift_aid_qualification_status: Qualified
                gift_date: '2023-10-23'
                claim_number: 2024-25
                tax_claim_amount: 11
                gift_splits:
                - gift_split_id: 3
                  campaign_id: 1
                  fund_id: 35
                  appeal_id: 49
                  package_id: 4
                  amount: 100
                  gift_aid_qualification_method: ApplyRulesWhenSaving
                  campaign: Annual Campaign
                  fund: 2010 Annual Fund
                  appeal: 2010 Annual Mailing
                  package: Colour Brochure
        '401':
          description: Returned when the user does not have permission to execute this operation.
        '403':
          description: Returned when the constituent view gift capability is not enabled.
        '404':
          description: Returned when the specified gift is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails_2'
              example:
                type: urn:blackbaud:resource-not-found
                title: The requested resource could not be found.
                status: 404
      tags:
      - Gifts
    patch:
      operationId: EditGiftTaxAsync
      summary: Update constituent gift tax
      description: Update gift tax
      parameters:
      - name: gift_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system gift ID of gift aid to edit.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditGiftTax'
            example:
              gift_aid_q_method: ApplyRulesWhenSaving
              claim_number: 2020-2022
        description: An object that represents the properties of the gift aid to edit
      responses:
        '200':
          description: Returned when the operation succeeds.
        '401':
          description: Returned when the user does not have permission to execute this operation.
        '403':
          description: Returned when the constituent edit gift tax capability is not enabled.
        '404':
          description: Returned when the specified  gift is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails_2'
              example:
                type: urn:blackbaud:resource-not-found
                title: The requested resource could not be found.
                status: 404
      tags:
      - Gifts
    servers:
    - url: https://api.sky.blackbaud.com/gar-gfacr
  /v1/gifts/{gift_id}/giftaid/splits:
    patch:
      operationId: EditGiftSplitsTaxAsync
      summary: Update constituent gift split tax
      description: Update gift split tax
      parameters:
      - name: gift_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system gift ID of gift aid to edit.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditGiftSplitsTax'
            example:
              claim_number: 2019-2023
              split_details:
              - gift_split_id: 1
                gift_aid_qualification_method: ApplyRulesWhenSaving
              - gift_split_id: 2
                gift_aid_qualification_method: SetAsQualified
        description: An object that represents the properties of the gift split list to edit
      responses:
        '200':
          description: Returned when the operation succeeds.
        '401':
          description: Returned when the user does not have permission to execute this operation.
        '403':
          description: Returned when the constituent edit gift capability is not enabled.
        '404':
          description: Returned when the specified  gift is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails_2'
              example:
                type: urn:blackbaud:resource-not-found
                title: The requested resource could not be found.
                status: 404
      tags:
      - Gifts
    servers:
    - url: https://api.sky.blackbaud.com/gar-gfacr
  /gifts/attachments:
    post:
      operationId: CreateGiftAttachment
      summary: Gift attachment (Create)
      description: Creates a gift attachment.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentAdd'
            example:
              date: '2015-10-05T04:00:00Z'
              name: Pledge Thank You Letter
              parent_id: '2396'
              tags:
              - Letter
              type: Link
              url: http://file.com/
        description: An object that represents the gift attachment to add.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the ID of the new gift attachment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: '1281'
        '400':
          description: Returned when the request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to create the attachment.
        '404':
          description: Returned when the specified gift is not found.
      tags:
      - Gifts
    servers:
    - url: https://api.sky.blackbaud.com/gift/v1
  /gifts/attachments/{attachment_id}:
    delete:
      operationId: DeleteGiftAttachment
      summary: Gift attachment (Delete)
      description: Deletes a gift attachment.
      parameters:
      - name: attachment_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the gift attachment to delete.
      responses:
        '200':
          description: Returned when the operation successfully deletes the attachment.
        '400':
          description: Returned when the specified attachment ID in the request URL is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to delete the attachment.
      tags:
      - Gifts
    patch:
      operationId: EditGiftAttachment
      summary: Gift attachment (Edit)
      description: Edits a gift attachment.
      parameters:
      - name: attachment_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the gift attachment to edit.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentEdit'
            example:
              date: '2015-10-05T04:00:00Z'
              name: Pledge Thank You Letter
              tags:
              - Letter
              url: http://example.com/
        description: An object that represents the gift attachment to edit.
      responses:
        '200':
          description: Returned when the operation successfully edits the attachment.
        '400':
          description: Returned when the specified attachment ID in the request URL is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to edit the attachment.
        '404':
          description: Returned when the specified attachment is not found.
      tags:
      - Gifts
    servers:
    - url: https://api.sky.blackbaud.com/gift/v1
  /gifts/customfields:
    post:
      operationId: CreateGiftCustomField
      summary: Gift custom field (Create)
      description: Creates a gift custom field.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomFieldAdd'
            example:
              category: Reminder Sent
              comment: Sent to primary email
              date: '2016-01-22T00:00:00Z'
              parent_id: '492'
              value: 'true'
        description: An object that represents the custom field to create.
      responses:
        '200':
          description: Returned when the operation successfully creates a custom field. The response body contains the ID of the new custom field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: '1281'
        '400':
          description: Returned when the request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to create the custom field.
        '404':
          description: Returned when the specified gift is not found.
      tags:
      - Gifts
    get:
      operationId: ListGiftCustomFieldsAllGifts
      summary: Gift custom field list (All gifts)
      description: 'Returns a paginated list of gift custom fields.


        The default sorting behavior is to list gift custom fields in ascending order based on when they were created.


        However, the last_modified parameter overrides the default sorting behavior to list gift custom fields in ascending order based on when they were last modified. The last_modified parameter also adds the sort_token parameter to the next_link URL to ensure that gift custom fields are stably sorted and that order persists when changes occur while working through a paginated list.


        If the last_modified and date_added parameters are both specified, the sorting behavior is to list gift custom fields based on when they were last modified.


        Note: This endpoint returns data with an average latency of about 30 minutes. In addition, historic records have a default date_added timestamp of 1600-01-01 00:00:00.000 +00:00. The timestamp for newer records reflects when the records were added.'
      parameters:
      - name: date_added
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for gift custom fields created on or after the specified date. The filter respects time offsets from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for gift custom fields modified on or after the specified date. The filter respects time offsets from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: sort_token
        in: query
        required: false
        schema:
          type: string
        description: Represents a token filter to provide the next stable-sorted list of gift custom fields. This will be provided on the next_link collection response property when last_modified or sort_token filters are specified on the request.
      - name: category
        in: query
        required: false
        schema:
          type: array
        description: Represents a filter for custom field categories. Returns any custom fields that match the specified category. For example, <i>category=Interests</i> returns custom fields with the <i>Interests</i> category.
      - name: value
        in: query
        required: false
        schema:
          type: array
        description: 'Represents a filter for custom field values. Must be used in conjunction with the <code>category</code> filter. Returns any custom fields in the specified category that match any of the specified values. For example, <i>category=Interests&amp;value=Baseball&amp;value=Tennis</i> returns <i>Interests</i> custom fields with the <i>Baseball</i> or <i>Tennis</i> values. Filtering by fuzzy date values must be in one of the following formats: <i>YYYYMMDD</i>, <i>YYYY</i>, <i>YYYYMM</i>, or <i>MMDD</i>.  Any four digit value that starts with 13 or higher will be considered a year.  Any four digit value that starts with 01-12 will be considered to be in <i>MMDD</i> format.'
      - name: gift_id
        in: query
        required: false
        schema:
          type: array
        description: Represents a list of gift identifiers. Returns custom fields if any of the specified gift identifiers match any of the custom fields' associated gifts. For example, "gift_id=280&amp;gift_id=1232" returns custom fields with either "280" or "1232" gift identifiers.
      - name: include_count
        in: query
        required: false
        schema:
          type: boolean
        description: False to exclude the count of all records. Default is true.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to return. The default is 500. The maximum is 5000.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip. For use with pagination.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/gift#Collection">collection</a> of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/gift#CustomField">custom field</a> entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection_CustomFieldRead'
              example:
                count: 21
                next_link: https://api.sky.blackbaud.com/gift/v1/gifts/customfields?offset=6&limit=3
                value:
                - id: '13'
                  category: Auction ID
                  date: '2007-07-30T00:00:00Z'
                  date_added: '1600-01-01T00:00:00Z'
                  date_modified: '1600-01-01T00:00:00Z'
                  parent_id: '1111'
                  type: Text
                  value: AUCTION2007
                - id: '14'
                  category: Item Number
                  date: '2007-07-30T00:00:00Z'
                  date_added: '1600-01-01T00:00:00Z'
                  date_modified: '1600-01-01T00:00:00Z'
                  parent_id: '1111'
                  type: Number
                  value: 1
                - id: '15'
                  category: Declared Value
                  date: '2007-07-30T00:00:00Z'
                  date_added: '1600-01-01T00:00:00Z'
                  date_modified: '1600-01-01T00:00:00Z'
                  parent_id: '1111'
                  type: Currency
                  value: 500
        '400':
          description: Returned when the specified request parameters are not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to view the custom fields.
      tags:
      - Gifts
    servers:
    - url: https://api.sky.blackbaud.com/gift/v1
  /gifts/customfields/categories:
    post:
      operationId: GetOrCreateGiftCustomFieldCategory
      summary: Adds custom field Category (GetOrCreate)
      description: Creates a gift custom field category if it doesn't exist or retrieves the id of the existing category.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomFieldCategoryAdd'
            example:
              name: string
              type: Text
              must_be_unique: true
        description: An object that represents the custom field category to create.
      responses:
        '200':
          description: 'Returned when the operation successfully creates or finds a custom field category.

            The response body contains the ID of the new custom field category.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: '1281'
        '400':
          description: Returned when the request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to create the custom field category.
      tags:
      - Gifts
    get:
      operationId: ListGiftCustomFieldCategories
      summary: Gift custom field categories
      description: Returns a list of custom field categories.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/gift#Collection">collection</a> of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/gift#CustomFieldCategory">custom field categories</a>.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection_CustomFieldCategoryRead'
              example:
                count: 20
                value:
                - name: RENXTGiftTransactionID
                  type: Text
                - name: Source
                  type: CodeTableEntry
                - name: Sold On
                  type: Date
                - name: Reminder Sent
                  type: Boolean
                - name: Remainderman Fund
                  type: Text
                - name: Purchased By
                  type: ConstituentId
                - name: Named Giving Opp
                  type: CodeTableEntry
                - name: Item Number
                  type: Number
                - name: Gift-in-Kind Type
                  type: CodeTableEntry
                - name: Gift transfer date
                  type: Date
                - name: FuzzyFuzzy
                  type: FuzzyDate
                - name: Donor Designation
                  type: CodeTableEntry
                - name: Donated By
                  type: ConstituentId
                - name: Deposit Date
                  type: Date
                - name: Declared Value
                  type: Currency
                - name: Check routing
                  type: Text
                - name: Beneficiary
                  type: Text
                - name: Auction Item
                  type: Text
                - name: Auction ID
                  type: Text
                - name: Adopt An Animal
                  type: CodeTableEntry
        '403':
          description: Returned when the user does not have permission to view the custom field categories.
      tags:
      - Gifts
    servers:
    - url: https://api.sky.blackbaud.com/gift/v1
  /gifts/customfields/categories/values:
    get:
      operationId: ListGiftCustomFieldCategoryValues
      summary: Gift custom field category values
      description: Returns the list of custom field category values.
      parameters:
      - name: category_name
        in: query
        required: false
        schema:
          type: string
        description: The name of the category to return values for.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/gift#Collection">collection</a> of string custom field category values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection_String'
              example:
                count: 4
                value:
                - Mailing
                - Radio
                - TV
                - Word of Mouth
        '400':
          description: Returned when the specified request parameter is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to view the custom field category values.
      tags:
      - Gifts
    servers:
    - url: https://api.sky.blackbaud.com/gift/v1
  /gifts/customfields/{custom_field_id}:
    delete:
      operationId: DeleteGiftCustomField
