           <td>A recurring gift payment.</td>\n            </tr>\n            <tr>\n                <td>Stock</td>\n                <td>A stock.</td>\n            </tr>\n            <tr>\n                <td>SoldStock</td>\n                <td>A sold stock.</td>\n            </tr>\n            <tr>\n                <td>Other</td>\n                <td>Another type of gift.</td>\n            </tr>\n        </tbody>\n    </table>\n</div>"
