openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: OneRoster Line Items API'
  description: OneRoster v1.1 API. For details on the OneRoster Version 1.1 Specification, click here. The Authorization page provides steps to setup and test these endpoints.
  version: v1p1
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/afe-rostr
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Line Items
paths:
  /lineItems:
    get:
      operationId: getAllLineItems
      summary: LineItems all
      description: Returns a collection of lineItems.
      responses:
        '200':
          description: OK - It was possible to read the collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineItemsOutputModel'
              example:
                lineItems:
                - title: Assignment Title 1
                  description: Assignment Description for Assignment 1
                  assignDate: '2022-09-26T01:30:00Z'
                  dueDate: '2022-09-29T01:30:00Z'
                  class:
                    sourcedId: cls-222-12345
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/classes/cls-222-12345
                    type: class
                  category:
                    sourcedId: lic-222-345
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/categories/lic-222-345
                    type: category
                  gradingPeriod:
                    sourcedId: as-grp-222-6789
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/gradingperiods/as-grp-222-6789
                    type: academicSession
                  resultValueMin: 0
                  resultValueMax: 10
                  sourcedId: external-lineitem-sourcedId
                  status: active
                  dateLastModified: '2022-09-26T01:30:00Z'
                - title: Assignment Title 2
                  description: Assignment Description for Assignment 2
                  assignDate: '2022-09-26T01:30:00Z'
                  dueDate: '2022-09-29T01:30:00Z'
                  class:
                    sourcedId: cls-222-12345
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/classes/cls-222-12345
                    type: class
                  category:
                    sourcedId: lic-222-345
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/categories/lic-222-345
                    type: category
                  gradingPeriod:
                    sourcedId: as-grp-222-6789
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/gradingperiods/as-grp-222-6789
                    type: academicSession
                  resultValueMin: 0
                  resultValueMax: 10
                  sourcedId: external-lineitem-sourcedId
                  status: active
                  dateLastModified: '2022-09-26T01:30:00Z'
      tags:
      - Line Items
  /lineItems/{id}:
    get:
      operationId: getLineItem
      summary: LineItem by id
      description: Returns a specific lineItem.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: sourcedId for the lineItem
      responses:
        '200':
          description: OK - It was possible to read the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineItemOutputModel'
              example:
                lineItem:
                  title: Assignment Title 1
                  description: Assignment Description for Assignment 1
                  assignDate: '2022-09-26T01:30:00Z'
                  dueDate: '2022-09-29T01:30:00Z'
                  class:
                    sourcedId: cls-222-12345
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/classes/cls-222-12345
                    type: class
                  category:
                    sourcedId: lic-222-345
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/categories/lic-222-345
                    type: category
                  gradingPeriod:
                    sourcedId: as-grp-222-6789
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/gradingperiods/as-grp-222-6789
                    type: academicSession
                  resultValueMin: 0
                  resultValueMax: 10
                  sourcedId: external-lineitem-sourcedId
                  status: active
                  dateLastModified: '2022-09-26T01:30:00Z'
      tags:
      - Line Items
    put:
      operationId: putLineItem
      summary: LineItem create/update
      description: Returns the lineItem object that was created or updated.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: sourcedId for the lineItem
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LineItemInputModel'
            example:
              lineItem:
                title: Assignment Title 1
                description: Assignment Description for Assignment 1
                assignDate: '2022-09-26T01:30:00Z'
                dueDate: '2022-09-29T01:30:00Z'
                class:
                  sourcedId: cls-222-12345
                  href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/classes/cls-222-12345
                  type: class
                category:
                  sourcedId: lic-222-345
                  href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/categories/lic-222-345
                  type: category
                gradingPeriod:
                  sourcedId: as-grp-222-6789
                  href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/gradingperiods/as-grp-222-6789
                  type: academicSession
                resultValueMin: 0
                resultValueMax: 10
                sourcedId: external-lineitem-sourcedId
                status: active
                dateLastModified: '2022-09-26T01:30:00Z'
        description: input model for the lineItem
      responses:
        '201':
          description: OK - It was possible to read the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineItemOutputModel'
              example:
                lineItem:
                  title: Assignment Title 1
                  description: Assignment Description for Assignment 1
                  assignDate: '2022-09-26T01:30:00Z'
                  dueDate: '2022-09-29T01:30:00Z'
                  class:
                    sourcedId: cls-222-12345
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/classes/cls-222-12345
                    type: class
                  category:
                    sourcedId: lic-222-345
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/categories/lic-222-345
                    type: category
                  gradingPeriod:
                    sourcedId: as-grp-222-6789
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/gradingperiods/as-grp-222-6789
                    type: academicSession
                  resultValueMin: 0
                  resultValueMax: 10
                  sourcedId: external-lineitem-sourcedId
                  status: active
                  dateLastModified: '2022-09-26T01:30:00Z'
      tags:
      - Line Items
    delete:
      operationId: deleteLineItem
      summary: LineItem delete (PREVIEW)
      description: 'Deletes the specified line item sourcedId.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: sourcedId for the line item
      responses:
        '200':
          description: OK - Resource has been deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LineItemOutputModel'
              example:
                lineItem:
                  title: Assignment Title 1
                  description: Assignment Description for Assignment 1
                  assignDate: '2022-09-26T01:30:00Z'
                  dueDate: '2022-09-29T01:30:00Z'
                  class:
                    sourcedId: cls-222-12345
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/classes/cls-222-12345
                    type: class
                  category:
                    sourcedId: lic-222-345
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/categories/lic-222-345
                    type: category
                  gradingPeriod:
                    sourcedId: as-grp-222-6789
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/gradingperiods/as-grp-222-6789
                    type: academicSession
                  resultValueMin: 0
                  resultValueMax: 10
                  sourcedId: external-lineitem-sourcedId
                  status: active
                  dateLastModified: '2022-09-26T01:30:00Z'
      tags:
      - Line Items
components:
  schemas:
    StatusInfoModel:
      type: object
      properties:
        imsx_codeMajor:
          type:
          - string
          - 'null'
        imsx_severity:
          type:
          - string
          - 'null'
        imsx_messageRefIdentifier:
          type:
          - string
          - 'null'
        imsx_operationRefIdentifier:
          type:
          - string
          - 'null'
        imsx_description:
          type:
          - string
          - 'null'
        imsx_codeMinor:
          type:
          - string
          - 'null'
      additionalProperties: false
    LineItemModel:
      type: object
      properties:
        title:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        assignDate:
          type:
          - string
          - 'null'
          format: date-time
        dueDate:
          type:
          - string
          - 'null'
          format: date-time
        class:
          $ref: '#/components/schemas/GuidRefModel'
        category:
          $ref: '#/components/schemas/GuidRefModel'
        gradingPeriod:
          $ref: '#/components/schemas/GuidRefModel'
        resultValueMin:
          type:
          - number
          - 'null'
          format: double
        resultValueMax:
          type:
          - number
          - 'null'
          format: double
        sourcedId:
          type:
          - string
          - 'null'
        status:
          type:
          - string
          - 'null'
        dateLastModified:
          type:
          - string
          - 'null'
          format: date-time
        metadata:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
      additionalProperties: false
    LineItemInputModel:
      type: object
      properties:
        lineItem:
          $ref: '#/components/schemas/LineItemModel'
      additionalProperties: false
    LineItemOutputModel:
      type: object
      properties:
        lineItem:
          $ref: '#/components/schemas/LineItemModel'
        statusInfoSet:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/StatusInfoModel'
      additionalProperties: false
    LineItemsOutputModel:
      type: object
      properties:
        lineItems:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/LineItemModel'
        statusInfoSet:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/StatusInfoModel'
      additionalProperties: false
    GuidRefModel:
      type: object
      properties:
        sourcedId:
          type:
          - string
          - 'null'
        href:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
      additionalProperties: false
  securitySchemes:
    Bb-Api-Subscription-Key:
      type: apiKey
      name: Bb-Api-Subscription-Key
      in: header
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://app.blackbaud.com/oauth/authorize
          tokenUrl: https://oauth2.sky.blackbaud.com/token
          scopes: {}
