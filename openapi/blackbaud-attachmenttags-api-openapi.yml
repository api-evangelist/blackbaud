paths:
  /attachmenttags:
    get:
      operationId: ListAttachmentTags
      summary: Attachment tags
      description: Returns a list of available attachment tags.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a> of string attachment tags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfString'
              example:
                count: 7
                value:
                - Certificate
                - Document
                - Logo
                - PDF
                - Photo
                - Slideshow
                - Spreadsheet
        '403':
          description: Returned when the user does not have permission to view the attachment tags.
      tags:
      - Attachmenttags
    servers:
    - url: https://api.sky.blackbaud.com/constituent/v1
