openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: Event Participationlevels API'
  description: This API manages event information and related entities such as participant.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/event
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/event
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Participationlevels
paths:
  /v1/participationlevels:
    post:
      operationId: CreateParticipationLevel
      summary: Create a participation level
      description: Creates a new participation level.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateParticipationLevel'
            example:
              name: Sponsor
        description: An object that represents the participation level to create.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the ID of the new participation level.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
              example:
                id: '4343'
        '400':
          description: Returned when the specified request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1ParticipationlevelsPost400ApplicationJsonResponse'
              example:
              - message: The request body is not in the appropriate format.
                error_name: BadRequest
                error_code: 400
                raw_message: The request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to create the participation level.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1ParticipationlevelsPost403ApplicationJsonResponse'
              example:
              - message: The user does not have the necessary permissions for this task.
                error_name: Forbidden
                error_code: 403
                raw_message: The user does not have the necessary permissions for this task.
      tags:
      - Participationlevels
    get:
      operationId: GetParticipationLevels
      summary: Get participation levels
      description: Returns a list of participation levels for all events. Participation levels describe a participant's involvement in an event, such as child participant or local business supporter.
      parameters:
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
        description: Represents whether to include inactive entries.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of participation levels.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipationLevelCollection'
              example:
                count: 4
                value:
                - id: '1772'
                  name: Attendee
                  is_inactive: false
                - id: '301'
                  name: Captain
                  is_inactive: false
                - id: '1493'
                  name: Coordinator
                  is_inactive: false
                - id: '2010'
                  name: Corporate Sponsor
                  is_inactive: false
        '403':
          description: Returned when the user does not have rights to view participant participation levels.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1ParticipationlevelsGet403ApplicationJsonResponse'
              example:
              - message: The user does not have the necessary permissions for this task.
                error_name: Forbidden
                error_code: 403
                raw_message: The user does not have the necessary permissions for this task.
      tags:
      - Participationlevels
  /v1/participationlevels/{participation_level_id}:
    delete:
      operationId: DeleteParticipationLevel
      summary: Delete a participation level
      description: Deletes a participation level.
      parameters:
      - name: participation_level_id
        in: path
        required: true
        schema:
          type: string
        description: ID of the participation level to delete
      responses:
        '200':
          description: Returned when the operation successfully deletes a participation level.
        '400':
          description: Returned when the specified participation level ID is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Participationlevels-participation_level_id-Delete400ApplicationJsonResponse'
              example:
              - message: The request body is not in the appropriate format.
                error_name: BadRequest
                error_code: 400
                raw_message: The request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to delete the participation level.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Participationlevels-participation_level_id-Delete403ApplicationJsonResponse'
              example:
              - message: The user does not have the necessary permissions for this task.
                error_name: Forbidden
                error_code: 403
                raw_message: The user does not have the necessary permissions for this task.
      tags:
      - Participationlevels
    patch:
      operationId: EditParticipationLevel
      summary: Edit a participation level
      description: Edits the details about a participation level.
      parameters:
      - name: participation_level_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the participation level.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditParticipationLevel'
            example:
              name: Walk-A-Thon
              is_inactive: false
        description: An object that represents the changes to the participation level.
      responses:
        '200':
          description: Returned when the operation succeeds.
        '400':
          description: Returned when the specified request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Participationlevels-participation_level_id-Patch400ApplicationJsonResponse'
              example:
              - message: The request body is not in the appropriate format.
                error_name: BadRequest
                error_code: 400
                raw_message: The request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to edit the participation level.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Participationlevels-participation_level_id-Patch403ApplicationJsonResponse'
              example:
              - message: The user does not have the necessary permissions for this task.
                error_name: Forbidden
                error_code: 403
                raw_message: The user does not have the necessary permissions for this task.
        '404':
          description: Returned when the specified participation level is not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Participationlevels-participation_level_id-Patch404ApplicationJsonResponse'
              example:
              - message: The requested resource could not be found.
                error_name: ResourceNotFound
                error_code: 404
                raw_message: The requested resource could not be found.
      tags:
      - Participationlevels
