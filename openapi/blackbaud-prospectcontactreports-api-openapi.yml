    post:
      operationId: CreateProspectContactReport
      summary: Create a prospect contact report
      description: Creates and transoperations a step into a contact report.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProspectContactReport'
            example:
              prospect_plan_id: 43276489-c4d1-4cd1-8583-30a2c8b5099b
              status: Planned
              interaction_type: Phone Call
              objective: Raise fund
              owner_id: 829eb829-4edd-4b65-85df-2f8b5af36015
              actual_date: '2022-12-21T12:00:00Z'
              prospect_plan_status: Future Prospect
              comment: ''
              additional_fundraisers:
              - id: 2fec6a3d-23c5-4a8a-909f-7d62cb6ecf2f
                fundraiser_id: aec81e43-fd8d-41c9-8ba6-23961ddb37dd
              participants:
              - id: 6daed574-c217-4ded-8609-1004ad7d26a9
                constituent_id: e4f56c52-a56f-42a4-b8fc-4e978603a503
              interaction_category: Prospect Management
              interaction_subcategory: Recipient Scholarship/Donor Info Sent
              next_step_id: ee85afa2-e093-4306-81aa-4419621dcd49
              edit_next_step: false
              next_step_objective: Raise fund
              next_step_owner_id: 96c57f49-5e5e-485f-8045-026155f28b9b
              next_step_status: Planned
              next_step_expected_date: '2022-12-21T12:00:00Z'
              next_step_actual_date: '2022-12-21T12:00:00Z'
              actual_start_time:
                hour: 1
                minute: 26
              actual_endtime:
                hour: 3
                minute: 26
              prospect_id: f5e0ad39-b40d-4d9a-bc2d-4d43c20ce3be
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully creates the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
