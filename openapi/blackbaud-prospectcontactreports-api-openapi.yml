      operationId: EditProspectContactReport
      summary: Edit a prospect contact report
      description: Edit an existing contact report.
      parameters:
      - name: interaction_id
        in: path
        required: true
        schema:
          type: string
        description: The interaction id.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditProspectContactReport'
            example:
              prospect_plan_id: 43276489-c4d1-4cd1-8583-30a2c8b5099b
              interaction_type: Phone Call
              objective: Raise fund
              owner_id: 829eb829-4edd-4b65-85df-2f8b5af36015
              actual_date: '2022-12-21T12:00:00Z'
              prospect_plan_status: Future Prospect
