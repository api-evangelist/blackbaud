          description: benefitname
        benefit_total_value:
          type: number
          description: benefittotalvalue
        benefit_description:
          type: string
          description: benefitdescription
        event_price_benefit_details:
          type: string
          description: eventpricebenefitdetails
        event_price_id:
          type: string
