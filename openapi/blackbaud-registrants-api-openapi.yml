        teamfundraisingteamid:
          type: string
          description: team
        isteamcaptain:
          type: boolean
          description: team captain
      description: NewEventRegistrantRegistrantmappingsTeamfundraisingTeamfundraisingteams
      x-display-name: teamfundraisingteams
      x-display-id: teamfundraisingteams
    NewEventRegistrantRegistrantmappingsRegistrantWaiveBenefits:
      type: object
      properties:
        event_id:
