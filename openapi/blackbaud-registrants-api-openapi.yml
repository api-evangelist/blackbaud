        packageregistrationpackage:
          type: string
          description: The package. This simple list can be queried at https://api.sky.blackbaud.com/alt-adnmg/simplelists/05ea588e-c0ac-4089-92b2-7680f6a3e471?parameters=main_event_id,{main_event_id}.
        quantity:
          type: integer
          description: quantity
        amount:
          type: number
          description: registration fee
        receipt_amount:
          type: number
          description: receipt amount
        registrationcount:
          type: integer
          description: registration count
        package_registrant_registrations:
          type: array
          items:
            $ref: '#/components/schemas/NewEventRegistrantPackageregistrationsPackageRegistrantRegistrations'
          description: Package registrant registrations.
      description: NewEventRegistrantPackageRegistrations
      x-display-name: package_registrations
      x-display-id: package_registrations
    NewEventRegistrantMultiComponentEventPriceBenefits:
