        id:
          type: string
          description: id
        name:
          type: string
          description: name
        event_price_id:
          type: string
          description: eventpriceid
        event_price_event_id:
          type: string
          description: eventpriceeventid
        eventname:
          type: string
          description: eventname
        event_registration_type_id:
          type: string
          description: eventregistrationtypeid
        event_registration_type_description:
          type: string
          description: eventregistrationtypedescription
        amount:
          type: number
          description: amount
        receipt_amount:
          type: number
