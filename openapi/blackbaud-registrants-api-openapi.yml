      x-display-name: eventcurrency
      x-display-id: eventcurrency
    NewEventRegistrantMultiComponentEventSchedules:
      type: object
      properties:
        id:
          type: string
          description: id
        name:
          type: string
          description: name
        start_date:
          type: string
          description: startdate
          format: date
        start_time:
          $ref: '#/components/schemas/HourMinute'
        end_date:
          type: string
          description: enddate
          format: date
        end_time:
          $ref: '#/components/schemas/HourMinute'
      description: NewEventRegistrantMultiComponentEventSchedules
      x-display-name: multi_component_event_schedules
      x-display-id: multi_component_event_schedules
    NewEventRegistrantRegistrantMappings:
      type: object
      properties:
        registrant_package_id:
          type: string
          description: registrantpackageid
        registration_package_id:
          type: string
          description: registrationpackageid
        event_id:
          type: string
          description: eventid
        event_price_id:
          type: string
          description: eventpriceid
        registrations_collection_id:
          type: string
          description: registrationscollectionid
        registrant_registration_maps:
          type: array
          items:
            $ref: '#/components/schemas/NewEventRegistrantRegistrantmappingsRegistrantRegistrationMaps'
          description: Registrant registration maps.
        registrant_waive_benefits:
          type: array
          items:
            $ref: '#/components/schemas/NewEventRegistrantRegistrantmappingsRegistrantWaiveBenefits'
          description: Registrant waive benefits.
        name:
          type: string
          description: event/package
        guest_constituent_id:
          type: string
          description: guest
        waive_registration_fee:
          type: boolean
          description: waive registration fee
        has_notifications:
          type: boolean
          description: has notifications
        team_fundraising:
          type: array
          items:
            $ref: '#/components/schemas/NewEventRegistrantRegistrantmappingsTeamFundraising'
          description: Team fundraising.
        preferences:
          type: array
          items:
            $ref: '#/components/schemas/NewEventRegistrantRegistrantmappingsPreferences'
          description: Preferences.
      description: NewEventRegistrantRegistrantMappings
      x-display-name: registrant_mappings
      x-display-id: registrant_mappings
    EventRegistrantSearchCollection:
      type: object
      properties:
        count:
          type: integer
          description: The number of items available for retrieval into the collection after applying any request parameters.
          format: int32
        value:
          type: array
          items:
            $ref: '#/components/schemas/EventRegistrantSearchSummary'
          description: The set of items included in the response. This may be a subset of the items in the collection.
      additionalProperties: false
      description: A collection of items. Data lists can contain paginated results.
    EventRegistrantSearchSummary:
      type: object
      properties:
        id:
          type: string
          description: The ID.
        registrant:
          type: string
          description: The registrant.
        host:
          type: string
          description: The host.
        attended:
          type: boolean
          description: Indicates whether attended.
        number_of_guests:
          type: integer
          description: The number of guests.
          format: int32
        lookup_id:
          type: string
          description: The lookup ID.
      additionalProperties: false
      description: SearchEventRegistrants
      x-display-name: Registrant Search
      x-display-id: Registrant Search
    NewEventRegistrantMultiComponentEventPreferenceGroups:
      type: object
      properties:
        event_preference_group_id:
          type: string
          description: eventpreferencegroupid
        event_preference_group_event_id:
          type: string
          description: eventpreferencegroupeventid
        event_preference_group_event_name:
          type: string
          description: eventpreferencegroupeventname
        event_preference_group_name:
          type: string
          description: eventpreferencegroupname
      description: NewEventRegistrantMultiComponentEventPreferenceGroups
      x-display-name: multi_component_event_preference_groups
      x-display-id: multi_component_event_preference_groups
    NewEventRegistrant:
      required:
      - event_id
      - constituent_id
      type: object
      properties:
        event_id:
          type: string
          description: The event ID.
        eventname:
          maxLength: 100
          minLength: 0
          type: string
          description: The event. Read-only in the SOAP API.
        main_event_id:
          type: string
          description: The maineventid. Read-only in the SOAP API.
        main_event_name:
          maxLength: 100
          minLength: 0
          type: string
          description: The main event. Read-only in the SOAP API.
        constituent_id:
          type: string
          description: The registrant.
        date_purchased:
          type: string
          description: 'The date. Uses the format YYYY-MM-DDThh:mm:ss. An example date: <i>1955-11-05T22:04:00</i>.'
          format: date-time
        package_registrations:
          type: array
          items:
            $ref: '#/components/schemas/NewEventRegistrantPackageRegistrations'
          description: Package registrations.
        packages_prices:
          type: array
          items:
            $ref: '#/components/schemas/NewEventRegistrantPackagesPrices'
          description: Packages prices.
        single_event_registrations:
          type: array
          items:
            $ref: '#/components/schemas/NewEventRegistrantSingleEventRegistrations'
          description: Single event registrations.
        multi_component_events_with_prices:
          type: array
          items:
            $ref: '#/components/schemas/NewEventRegistrantMultiComponentEventsWithPrices'
          description: Multi component events with prices.
        multi_component_event_price_benefits:
          type: array
          items:
            $ref: '#/components/schemas/NewEventRegistrantMultiComponentEventPriceBenefits'
          description: Multi component event price benefits.
        multi_component_event_preference_groups:
          type: array
          items:
            $ref: '#/components/schemas/NewEventRegistrantMultiComponentEventPreferenceGroups'
          description: Multi component event preference groups.
        multi_component_event_appeals:
          type: array
          items:
            $ref: '#/components/schemas/NewEventRegistrantMultiComponentEventAppeals'
          description: Multi component event appeals.
        waive_benefits:
          type: boolean
          description: Indicates whether waive benefits.
        registrant_mappings:
          type: array
          items:
            $ref: '#/components/schemas/NewEventRegistrantRegistrantMappings'
          description: Registrant mappings.
        constituent_record_type_id:
          type: string
          description: The constituent record type ID. Read-only in the SOAP API.
        multi_component_event_schedules:
          type: array
          items:
            $ref: '#/components/schemas/NewEventRegistrantMultiComponentEventSchedules'
          description: Multi component event schedules.
        single_event_list:
          type: array
          items:
            $ref: '#/components/schemas/NewEventRegistrantSingleEventList'
          description: Single event list.
        eventcurrency:
          type: array
          items:
            $ref: '#/components/schemas/NewEventRegistrantEventcurrency'
          description: Eventcurrency.
        registration_type_code:
          type: string
          description: The registration type. Available values are <i>preregistration</i>, <i>walk-in registration</i>
        event_has_started:
          type: boolean
          description: Indicates whether event has started. Read-only in the SOAP API.
      additionalProperties: false
      description: CreateEventRegistrant
      example:
        event_id: 0caf136c-12ee-4125-9df0-0ba180967086
        constituent_id: 4b581e1b-4d22-4cc9-aef2-e52e9fd85de7
        date_purchased: '2025-08-25T12:00:00Z'
        waive_benefits: false
        single_event_registrations:
        - single_event_registration_id: 168bac7c-9e78-440d-ac55-61d221f4c571
          singleeventregistrationeventprice: cf1fe3f6-ec00-4ca7-9d32-11d6b1564c83
          quantity: '1'
          amount: '42'
          receipt_amount: '31'
          registrationcount: '1'
        registrant_mappings:
        - event_id: 0caf136c-12ee-4125-9df0-0ba180967086
          event_price_id: cf1fe3f6-ec00-4ca7-9d32-11d6b1564c83
          registrations_collection_id: 168bac7c-9e78-440d-ac55-61d221f4c571
          registrant_waive_benefits:
          - event_id: 0caf136c-12ee-4125-9df0-0ba180967086
            waive_benefits: false
          guest_constituent_id: 4b581e1b-4d22-4cc9-aef2-e52e9fd85de7
          waive_registration_fee: false
          has_notifications: false
      x-display-name: Registrant Unified Add Form
      x-display-id: Registrant Unified Add Form
    EditEventRegistrant:
      type: object
      properties:
        constituent_name:
          maxLength: 700
          minLength: 0
          type: string
          description: The registrant. Read-only in the SOAP API.
        attended:
          type: boolean
          description: Indicates whether attended.
        event_seating_note:
          maxLength: 250
          minLength: 0
          type: string
          description: The seating note.
        will_not_attend:
          type: boolean
          description: Indicates whether will not attend. Read-only in the SOAP API.
        cancelled:
          type: boolean
          description: Indicates whether cancelled. Read-only in the SOAP API.
        walk_in:
          type: boolean
          description: Indicates whether walk in. Read-only in the SOAP API.
      additionalProperties: false
      description: EditEventRegistrant
      example:
        constituent_name: Julie Bach
        attended: false
        event_seating_note: ''
        will_not_attend: false
        cancelled: false
        walk_in: false
      x-display-name: Registrant Edit Form
      x-display-id: Registrant Edit Form
    HourMinute:
      type: object
      properties:
        hour:
          type: integer
          description: The hour.
          format: int32
        minute:
          type: integer
          description: The minute.
          format: int32
      description: HourMinute
      x-display-name: Hour Minute
      x-display-id: Hour Minute
    NewEventRegistrantPackageregistrationsPackageRegistrantRegistrations:
      type: object
      properties:
        packageeventpriceid:
          type: string
          description: event price id
        amount:
          type: number
          description: amount
        receipt_amount:
          type: number
          description: receipt amount
      description: NewEventRegistrantPackageregistrationsPackageRegistrantRegistrations
      x-display-name: package_registrant_registrations
      x-display-id: package_registrant_registrations
    NewEventRegistrantPackageRegistrations:
