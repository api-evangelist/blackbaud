openapi: 3.2.0
info:
  title: Blackbaud Registrants API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Registrants across 2 of this provider''s published API definitions: blackbaud-altru-event-api-openapi.yml, blackbaud-crm-event-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/alt-evtmg
- url: https://api.sky.blackbaud.com/crm-evtmg
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Registrants
paths:
  /registrants:
    post:
      operationId: CreateEventRegistrant
      summary: Create an event registrant
      description: Operation used for adding a registrant record along with guests and registrations.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewEventRegistrant'
            example:
              event_id: 0caf136c-12ee-4125-9df0-0ba180967086
              constituent_id: 4b581e1b-4d22-4cc9-aef2-e52e9fd85de7
              date_purchased: '2025-08-25T12:00:00Z'
              waive_benefits: false
              single_event_registrations:
              - single_event_registration_id: 168bac7c-9e78-440d-ac55-61d221f4c571
                singleeventregistrationeventprice: cf1fe3f6-ec00-4ca7-9d32-11d6b1564c83
                quantity: '1'
                amount: '42'
                receipt_amount: '31'
                registrationcount: '1'
              registrant_mappings:
              - event_id: 0caf136c-12ee-4125-9df0-0ba180967086
                event_price_id: cf1fe3f6-ec00-4ca7-9d32-11d6b1564c83
                registrations_collection_id: 168bac7c-9e78-440d-ac55-61d221f4c571
                registrant_waive_benefits:
                - event_id: 0caf136c-12ee-4125-9df0-0ba180967086
                  waive_benefits: false
                guest_constituent_id: 4b581e1b-4d22-4cc9-aef2-e52e9fd85de7
                waive_registration_fee: false
                has_notifications: false
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully creates the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Registrants
    servers:
    - url: https://api.sky.blackbaud.com/alt-evtmg
  /registrants/search:
    get:
      operationId: SearchEventRegistrants
      summary: Search for event registrants
      description: Search screen for event registrant records.
      parameters:
      - name: event_id
        in: query
        required: false
        schema:
          type: string
        description: eventid
      - name: exclude_guests
        in: query
        required: false
        schema:
          type: boolean
        description: excludeguests
      - name: full_name
        in: query
        required: false
        schema:
          type: string
        description: full name
      - name: key_name
        in: query
        required: false
        schema:
          type: string
        description: last/org name
      - name: first_name
        in: query
        required: false
        schema:
          type: string
        description: first name
      - name: lookup_id
        in: query
        required: false
        schema:
          type: string
        description: lookup id
      - name: include_unknown_guest
        in: query
        required: false
        schema:
          type: boolean
        description: include unnamed guests
      - name: include_will_not_attend
        in: query
        required: false
        schema:
          type: boolean
        description: include registrants that will not attend
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Limits the number of records to return.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of result entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRegistrantSearchCollection'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to view the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Registrants
    servers:
    - url: https://api.sky.blackbaud.com/alt-evtmg
  /registrants/{registrant_id}:
    delete:
      operationId: DeleteEventRegistrant
      summary: Delete an event registrant
      description: Removes a registrant from the given event.
      parameters:
      - name: registrant_id
        in: path
        required: true
        schema:
          type: string
        description: The registrant id
      responses:
        '200':
          description: Returned when the operation successfully deletes the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to delete the resource.
      tags:
      - Registrants
    patch:
      operationId: EditEventRegistrant
      summary: Edit an event registrant
      description: Operation used for editing a registrant record.
      parameters:
      - name: registrant_id
        in: path
        required: true
        schema:
          type: string
        description: The registrant id.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditEventRegistrant'
            example:
              constituent_name: Julie Bach
              attended: false
              event_seating_note: ''
              will_not_attend: false
              cancelled: false
              walk_in: false
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully edits the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to edit the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Registrants
    get:
      operationId: GetEventRegistrant
      summary: Get an event registrant
      description: Operation used for editing a registrant record.
      parameters:
      - name: registrant_id
        in: path
        required: true
        schema:
          type: string
        description: The registrant id.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRegistrant'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to get the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Registrants
    servers:
    - url: https://api.sky.blackbaud.com/alt-evtmg
components:
  schemas:
    NewEventRegistrantSingleEventList:
      type: object
      properties:
        id:
          type: string
          description: id
      description: NewEventRegistrantSingleEventList
      x-display-name: single_event_list
      x-display-id: single_event_list
    NewEventRegistrantSingleEventRegistrations:
      required:
      - singleeventregistrationevent
      - singleeventregistrationeventprice
      - quantity
      type: object
      properties:
        single_event_registration_id:
          type: string
          description: single event registration id
        singleeventregistrationevent:
          type: string
          description: The event. This simple list can be queried at https://api.sky.blackbaud.com/alt-adnmg/simplelists/7c63d7a2-02a4-4472-ab69-14d46c5400f3?parameters=main_event_id,{main_event_id}.
        singleeventregistrationeventprice:
          type: string
          description: The registration option. This simple list can be queried at https://api.sky.blackbaud.com/alt-adnmg/simplelists/3be79f65-49fc-49da-9765-3a34dd269011?parameters=event_id,{single_event_registration_event_id}.
        quantity:
          type: integer
          description: quantity
        amount:
          type: number
          description: registration fee
        receipt_amount:
          type: number
          description: receipt amount
        registrationcount:
          type: integer
          description: registration count
      description: NewEventRegistrantSingleEventRegistrations
      x-display-name: single_event_registrations
      x-display-id: single_event_registrations
    NewEventRegistrantEventcurrency:
      type: object
      properties:
        event_currency_event_id:
          type: string
