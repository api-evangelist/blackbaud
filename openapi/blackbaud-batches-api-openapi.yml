  /v1/batches/{batch_id}:
    get:
      operationId: GetTransactionBatch
      summary: Transaction batch (PREVIEW)
      description: 'Returns the status of a batch of card transactions or direct debit transactions, and when the status is complete, returns a list of results. Contact Support for permission to use this endpoint.


        ***This endpoint is in PREVIEW and may be subject to change.***'
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier of the batch.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the batch status and result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionBatchStatusRead'
              example:
                status: Completed
                records_processed: 1
                exception_count: 0
                transactions:
                - id: 19761b45-9295-4a5c-aa26-c754200cd90f
                  state: Processed
                  authorization_code: '123456'
                  retry_code: NotApplicable
        '400':
          description: Returned when the request body is not in the appropriate format. The response body contains error details.
      tags:
      - Batches
    servers:
    - url: https://api.sky.blackbaud.com/payments
