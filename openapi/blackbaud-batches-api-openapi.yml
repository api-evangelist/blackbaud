      summary: Create a batch
      description: Add operation for adding a batch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewBatch'
            example:
              batch_number: ''
              description: ''
              owner_id: ''
              batch_template_id: ''
              originating_batch_id: ''
              projected_number_of_records: 0
              projected_total_amount: 0
              display_total_amount: false
              create_custom_batch: false
              can_change_batch_numbers: false
              auto_save_on_row_change: false
              override_batch_number: false
              can_edit_field_options: false
              skip_test_for_web_shell: false
              automatch_threshold: 0
              overall_match_threshold: 0
              specific_batch_type_id: ''
              check_for_duplicates: false
              disable_add_new_row: false
              skip_batch_assignment_alert: false
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully creates the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Batches
    servers:
    - url: https://api.sky.blackbaud.com/alt-adnmg
