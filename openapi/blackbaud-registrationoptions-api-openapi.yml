openapi: 3.2.0
info:
  title: Blackbaud Registrationoptions API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Registrationoptions across 2 of this provider''s published API definitions: blackbaud-altru-event-api-openapi.yml, blackbaud-crm-event-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/alt-evtmg
- url: https://api.sky.blackbaud.com/crm-evtmg
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Registrationoptions
paths:
  /registrationoptions:
    post:
      operationId: CreateEventRegistrationOption
      summary: Create an event registration option
      description: Operation for adding a registration option record.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewEventRegistrationOption'
            example:
              event_id: 36da7826-7f00-42d7-9727-89480dea1303
              event_registration_type: Family
              amount: 0
              cost: 0
              receipt_amount: 0
              benefit:
              - id: ef6996cf-b4f9-4277-bbcd-fed81f633fb8
                benefit_id: c5a9bdd9-b386-4ef3-88a9-be560b795fc2
                quantity: 0
                unit_value: 0
                total_value: 0
                details: benefit details
                base_currency_id: 7ad9254e-fe38-45ef-bc32-f61eb6caabd9
                event_base_currency_total_value: 0
              name: ''
              registration_count: 0
              event_registration_types:
              - id: e2ddc822-d5d4-499c-9bca-2f3e20fb3992
                description: event registration for sponsor
                registration_count: 0
                active: false
              base_currency_id: 7ad9254e-fe38-45ef-bc32-f61eb6caabd9
              event_base_currency_decimal_digits: 0
              event_base_currency_rounding_type_code: 0
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully creates the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Registrationoptions
    servers:
    - url: https://api.sky.blackbaud.com/alt-evtmg
  /registrationoptions/{event_price_id}:
    delete:
      operationId: DeleteEventRegistrationOption
      summary: Delete an event registration option
      description: Removes a registration option from the given event.
      parameters:
      - name: event_price_id
        in: path
        required: true
        schema:
          type: string
        description: The event price id
      responses:
        '200':
          description: Returned when the operation successfully deletes the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to delete the resource.
      tags:
      - Registrationoptions
    patch:
      operationId: EditEventRegistrationOption
      summary: Edit an event registration option
      description: Operation for editing a registration option.
      parameters:
      - name: event_price_id
        in: path
        required: true
        schema:
          type: string
        description: The event price id.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditEventRegistrationOption'
            example:
              event_registration_type: ''
              amount: 20
              cost: 20
              receipt_amount: 20
              benefit:
              - id: dd9ff3f2-cf84-4e69-9524-e0289643ea25
                benefit_id: c8b4dbb2-a55b-42de-a5c3-dac089e23f62
                quantity: 1
                unit_value: 20
                total_value: 20
                details: benefit details
                base_currency_id: 36da7826-7f00-42d7-9727-89480dea1303
                event_base_currency_total_value: 20
              name: ''
              registration_count: 100
              base_currency_id: 6abe6c7e-fedc-473d-abe8-505807c94e0e
              event_base_currency_decimal_digits: 2
              event_base_currency_rounding_type_code: 1
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully edits the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to edit the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Registrationoptions
    get:
      operationId: GetEventRegistrationOption
      summary: Get an event registration option
      description: Operation for editing a registration option.
      parameters:
      - name: event_price_id
        in: path
        required: true
        schema:
          type: string
        description: The event price id.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRegistrationOption'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to get the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Registrationoptions
    servers:
    - url: https://api.sky.blackbaud.com/alt-evtmg
