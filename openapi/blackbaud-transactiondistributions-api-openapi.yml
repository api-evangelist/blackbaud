openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: General Ledger Transactiondistributions…'
  description: This API is used to manage the general ledger, including accounts, projects, and journal entries. This API has a maximum request size limit of 8mb.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/56eb17a0a9db9516c46bff6f
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/generalledger/v1
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Transactiondistributions
paths:
  /transactiondistributions:
    get:
      operationId: ListTransactionDistributions
      summary: Transaction distribution (List)
      description: Returns a list of transactions matching the search criteria
      parameters:
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: 'Represents the number of records to skip.

          For use with pagination.'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: "Represents the number of records to return. \nThe default is 100. \nThe maximum allowed value is 5000."
      - name: account_number
        in: query
        required: false
        schema:
          type: string
        description: The account number.
      - name: ui_project_id
        in: query
        required: false
        schema:
          type: string
        description: The project user-visible identifier.
      - name: batch_id
        in: query
        required: false
        schema:
          type: integer
        description: The database batch identifier.
      - name: ui_batch_id
        in: query
        required: false
        schema:
          type: integer
        description: The user-visible batch identifier.
      - name: journal
        in: query
        required: false
        schema:
          type: string
        description: The full name of the journal.
      - name: from_date
        in: query
        required: false
        schema:
          type: string
        description: The minimum post date to include records.
      - name: to_date
        in: query
        required: false
        schema:
          type: string
        description: The maximum post date to include records.
      - name: type_code
        in: query
        required: false
        schema:
          type: string
          enum:
          - Debit
          - Credit
        description: The journal entry transaction type (debit or credit).
      - name: transaction_code_1_value
        in: query
        required: false
        schema:
          type: string
        description: The transaction code 1 value.
      - name: transaction_code_2_value
        in: query
        required: false
        schema:
          type: string
        description: The transaction code 2 value.
      - name: transaction_code_3_value
        in: query
        required: false
        schema:
          type: string
        description: The transaction code 3 value.
      - name: transaction_code_4_value
        in: query
        required: false
        schema:
          type: string
        description: The transaction code 4 value.
      - name: transaction_code_5_value
        in: query
        required: false
        schema:
          type: string
        description: The transaction code 5 value.
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: Returns modified records based on or after a specified date.
      - name: encumbrance
        in: query
        required: false
        schema:
          type: string
        description: The encumbrance of the transaction distribution.
      - name: post_status
        in: query
        required: false
        schema:
          type: string
          enum:
          - Posted
          - NotYetPosted
        description: The post status of the transaction distribution.
      - name: include_tax_entity
        in: query
        required: false
        schema:
          type: boolean
        description: Include tax entity information.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the list transaction distributions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection_TransactionDistribution'
              example:
                count: 379362
                value:
                - transaction_id: 5348
                  transaction_amount: 333.33
                  distribution_id: 13861
                  batch_id: 50
                  ui_batch_id: 240
                  distribution_amount: 30
                  account_number: 01-5450-02
                  account_class: Unrestricted Net Assets
                  ui_project_id: '1001'
                  post_date: '2005-01-10T00:00:00Z'
                  type_code: Debit
                  reference: AlphaGraphics-6363636-003
                  journal: Accounts Payable
                  encumbrance: Regular
                  transaction_code_values:
                  - name: Jurisdiction
                    value: Youth Services
                    id: 0
                  - name: Spendable?
                    value: Spendable
                    id: 0
                  date_added: '2004-11-10T16:44:50.53Z'
                  added_by: Supervisor
                  date_modified: '2004-11-11T09:16:10.123Z'
                  modified_by: Supervisor
                  post_status: Posted
                  tax_entity_name: GST
                - transaction_id: 5348
                  transaction_amount: 333.33
                  distribution_id: 13862
                  batch_id: 50
                  ui_batch_id: 240
                  distribution_amount: 30
                  account_number: 01-5450-02
                  account_class: Temporarily Restricted Net Assets
                  ui_project_id: '1002'
                  post_date: '2005-01-10T00:00:00Z'
                  type_code: Debit
                  reference: AlphaGraphics-6363636-003
                  journal: Accounts Payable
                  encumbrance: Regular
                  transaction_code_values:
                  - name: Jurisdiction
                    value: Emergency Relief
                    id: 0
                  - name: Spendable?
                    value: Non-Spendable
                    id: 0
                  date_added: '2004-11-10T16:44:50.53Z'
                  added_by: Supervisor
                  date_modified: '2004-11-11T09:16:10.123Z'
                  modified_by: Supervisor
                  post_status: Posted
        '400':
          description: Returned when the request is not in the correct format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: string
                Details:
                - string
                ErrorPath: string
        '403':
          description: Returned when the user does not have permission to view journal entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Transactiondistributions
