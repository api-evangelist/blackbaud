openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: OneRoster Academic Sessions API'
  description: OneRoster v1.1 API. For details on the OneRoster Version 1.1 Specification, click here. The Authorization page provides steps to setup and test these endpoints.
  version: v1p1
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/afe-rostr
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: AcademicSessions
paths:
  /academicSessions:
    get:
      operationId: getAllAcademicSessions
      summary: AcademicSessions all
      description: Returns a collection of academic sessions.
      responses:
        '200':
          description: OK - It was possible to read the collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicSessionsOutputModel'
              example:
                academicSessions:
                - title: 1st Semester
                  startDate: '2022-09-01'
                  endDate: '2022-12-24'
                  type: term
                  parent:
                    sourcedId: as-syr-222-2023
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/link_to_parent
                    type: academicSession
                  children:
                  - sourcedId: as-grp-222-1234
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/link_to_child
                    type: academicSession
                  schoolYear: '2023'
                  sourcedId: as-trm-222-1234
                  status: active
                  dateLastModified: '2022-09-26T09:45:00Z'
                - title: 2st Quarter
                  startDate: '2022-10-01'
                  endDate: '2022-12-24'
                  type: gradingPeriod
                  parent:
                    sourcedId: as-trm-222-1234
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/link_to_parent
                    type: academicSession
                  schoolYear: '2023'
                  sourcedId: as-grp-222-2345
                  status: active
                  dateLastModified: '2022-09-26T09:45:00Z'
      tags:
      - AcademicSessions
  /academicSessions/{id}:
    get:
      operationId: getAcademicSession
      summary: AcademicSession by id
      description: Returns a specific academic session.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: sourcedId for the academic session
      responses:
        '200':
          description: OK - It was possible to read the collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicSessionOutputModel'
              example:
                academicSession:
                  title: 1st Semester
                  startDate: '2022-09-01'
                  endDate: '2022-12-24'
                  type: term
                  parent:
                    sourcedId: as-syr-222-2023
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/link_to_parent
                    type: academicSession
                  children:
                  - sourcedId: as-grp-222-1234
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/link_to_child
                    type: academicSession
                  schoolYear: '2023'
                  sourcedId: as-trm-222-1234
                  status: active
                  dateLastModified: '2022-09-26T09:45:00Z'
      tags:
      - AcademicSessions
