      operationId: EditBatchInstance
      summary: Edit a batch instance
      description: Edit operation for editing a batch header. replaced by batch properties edit operation.
      parameters:
      - name: batch_instance_id
        in: path
        required: true
        schema:
          type: string
        description: The batch instance ID.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditBatchInstance'
            example:
              batch_number: ''
              description: ''
              owner: ''
              projected_number_of_records: 0
              projected_total_amount: 0
              batch_template_id: ''
              display_total_amount: false
              can_change_batch_numbers: false
              projected_total_amount_decimal: 0
              auto_save_on_row_change: false
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully edits the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to edit the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Batchinstances
    get:
      operationId: GetBatchInstance
      summary: Get a batch instance
      description: Edit operation for editing a batch header. replaced by batch properties edit operation.
      parameters:
      - name: batch_instance_id
        in: path
        required: true
        schema:
          type: string
        description: The batch instance ID.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchInstance'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to get the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Batchinstances
    servers:
    - url: https://api.sky.blackbaud.com/alt-adnmg
