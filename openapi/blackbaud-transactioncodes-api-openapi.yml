info:
  title: Blackbaud Transactioncodes API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Transactioncodes across 3 of this provider''s published API definitions: blackbaud-accounts-payable-api-openapi.yml, blackbaud-general-ledger-api-openapi.yml, blackbaud-treasury-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/accountspayable/v1
- url: https://api.sky.blackbaud.com/generalledger/v1
- url: https://api.sky.blackbaud.com/treasury/v1
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Transactioncodes
paths:
  /transactioncodes:
    get:
      operationId: ListTransactionCodes
      summary: Transaction code (List)
      description: Returns the list of all available transaction codes.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the list of all available transaction codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactioncodesGet200ApplicationJsonResponse'
              example:
              - transaction_code_id: 1
                name: Jurisdiction
                description: Jurisdiction
                used_for_grants: false
              - transaction_code_id: 2
                name: Spendable?
                description: Spendable?
                used_for_grants: false
              - transaction_code_id: 3
                name: RE Appeals
                description: RE Appeals
                used_for_grants: false
              - transaction_code_id: 4
                name: Grant
                description: Grant
                used_for_grants: true
              - transaction_code_id: 5
                name: Activities
                description: Activities
                used_for_grants: false
      tags:
      - Transactioncodes
    servers:
    - url: https://api.sky.blackbaud.com/accountspayable/v1
  /transactioncodes/{transaction_code_id}/values:
    get:
      operationId: ListTransactionCodeValuesSingleTransactionCode
      summary: Transaction code value (List)
      description: Returns the list of all values for the specified transaction code.
      parameters:
      - name: transaction_code_id
        in: path
        required: true
        schema:
          type: integer
        description: The transaction code identifier.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the list of all values for the specified transaction code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transactioncodes-transaction_code_id-ValuesGet200ApplicationJsonResponse'
              example:
              - name: Jurisdiction
                value: Fairfax County
                id: 1893
                inactive: true
              - name: Jurisdiction
                value: Prince William County
                id: 1894
                inactive: false
              - name: Jurisdiction
                value: Loudon County
                id: 1895
                inactive: false
              - name: Jurisdiction
                value: Waterbury
                id: 1888
                inactive: false
              - name: Jurisdiction
                value: Litchfield
                id: 1889
                inactive: false
              - name: Jurisdiction
                value: 1750 Deposit
                id: 1861
                inactive: false
      tags:
      - Transactioncodes
    servers:
    - url: https://api.sky.blackbaud.com/accountspayable/v1
