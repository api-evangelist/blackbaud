openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: School Levels API'
  description: This API is used to provide access to school information such as users, academics, admissions, athletics, content, lists, and general school info.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/school
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/school
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Levels
paths:
  /v1/levels:
    get:
      operationId: v1levelsget
      summary: Core school levels
      description: 'Returns a collection of core school levels.


        Requires at least one of the following roles in the Education Management system:


        SKY API Data Sync


        Any Manager Role'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LevelCollection'
              example:
                count: 2
                value:
                - id: 1
                  abbreviation: L
                  name: Lower School
                  address:
                    address1: Lower School Drive
                    address2: Lower School Drive
                    city: Charleston
                    state: SC
                    zip: '29401'
                    county_province: Charleston County
                    country: United States
                    phone: 843-555-4444
                    fax: 843-555-2222
                    website: www.brookfieldschool.edu
                  school_name: Brookfield School
                  school_address:
                    address1: 123 School Drive
                    address2: 123 School Drive
                    address3: 123 School Drive
                    city: Charleston
                    state: SC
                    zip: '29401'
                    county_province: Charleston County
                    country: United States
                    phone: 843-555-1111
                    fax: 843-555-2222
                    website: www.brookfieldschool.edu
                - id: 2
                  abbreviation: M
                  name: Middle School
                  school_name: Brookfield School
                  school_address:
                    address1: 123 School Drive
                    address2: 123 School Drive
                    address3: 123 School Drive
                    city: Charleston
                    state: SC
                    zip: '29401'
                    county_province: Charleston County
                    country: United States
                    phone: 843-555-1111
                    fax: 843-555-2222
                    website: www.brookfieldschool.edu
      tags:
      - Levels
components:
  schemas:
    Level:
      type: object
      properties:
        id:
          type:
          - integer
          - 'null'
          description: The ID of a school level
          format: int32
        abbreviation:
          type:
          - string
          - 'null'
          description: The abbreviation associated with a school level
        name:
          type:
          - string
          - 'null'
          description: The label used to identify a school level
        address:
          $ref: '#/components/schemas/SchoolAddress'
        school_name:
          type:
          - string
          - 'null'
          description: The name of the School
        school_address:
          $ref: '#/components/schemas/SchoolAddress'
      additionalProperties: false
      description: An object with school level information
    LevelCollection:
      type: object
      properties:
        count:
          type: integer
          description: The number of items in the collection
          format: int32
          readOnly: true
        next_link:
          type:
          - string
          - 'null'
          description: For paginated responses, the URI for the next page of results
        value:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Level'
          description: The set of items included in the response. This may be a subset of the items in the collection
      additionalProperties: false
      description: A Collection
    SchoolAddress:
      type: object
      properties:
        address1:
          type:
          - string
          - 'null'
          description: The address line
        address2:
          type:
          - string
          - 'null'
          description: The address line
        address3:
          type:
          - string
          - 'null'
          description: The address line
        city:
          type:
          - string
          - 'null'
          description: The city
        state:
          type:
          - string
          - 'null'
          description: TThe state for the address
        zip:
          type:
          - string
          - 'null'
          description: The postal/ZIP code for the address
        county_province:
          type:
          - string
          - 'null'
          description: The county or province for the address
        country:
          type:
          - string
          - 'null'
          description: The country for the address
        phone:
          type:
          - string
          - 'null'
          description: The phone number for the address
        fax:
          type:
          - string
          - 'null'
          description: The fax number for the address
        website:
          type:
          - string
          - 'null'
          description: The website for the address
      additionalProperties: false
      description: An object with information about the address of the school level, including address fields, phone fields and website.
  securitySchemes:
    Bb-Api-Subscription-Key:
      type: apiKey
      name: Bb-Api-Subscription-Key
      in: header
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://app.blackbaud.com/oauth/authorize
          tokenUrl: https://oauth2.sky.blackbaud.com/token
          scopes: {}
