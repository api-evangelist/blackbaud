      parameters:
      - name: opportunity_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the opportunity to retrieve information for.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/opportunity#Opportunity">opportunity</a> entity.
          content:
            application/json:
              schema:
