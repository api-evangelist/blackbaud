openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: Opportunity Opportunities API'
  description: This API manages opportunity information and related entities such as opportunity fundraisers, opportunity attachments, and opportunity custom fields.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/58e3b2597c1af25c58b9c4e3
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/opportunity/v1
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Opportunities
paths:
  /opportunities:
    post:
      operationId: CreateOpportunity
      summary: Opportunity (Create)
      description: Creates an opportunity.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpportunityAdd'
            example:
              ask_amount:
                value: 10000
              ask_date: '2002-07-30T00:00:00Z'
              campaign_id: '6'
              constituent_id: '306'
              deadline: '2005-05-15T00:00:00Z'
              expected_amount:
                value: 10000
              expected_date: '2004-05-15T00:00:00Z'
              fund_id: '12'
              funded_amount:
                value: 10000
              funded_date: '2004-05-15T00:00:00Z'
              inactive: false
              name: Scholarship Proposal
              summary: Initial major gift conversation
              purpose: Research Endowment
              reason: Leadership annual giving
              original_ask_amount:
                value: 15000
              original_ask_date: '2002-06-15T00:00:00Z'
              instrument: Personal visit
              org_contact_id: '412'
              date_rated: '2002-06-20T00:00:00Z'
        description: An object that represents the opportunity to create.
      responses:
        '200':
          description: Returned when the operation successfully creates an opportunity. The response body contains the ID of the new opportunity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: '1281'
        '400':
          description: Returned when the request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to create the opportunity.
        '404':
          description: Returned when the specified constituent is not found.
      tags:
      - Opportunities
    get:
      operationId: ListOpportunities
      summary: Opportunity list
      description: 'Returns a paginated list of opportunities.


        The default sorting behavior is to list opportunities in ascending order based on the id.


        However, the last_modified parameter overrides the default sorting behavior to list opportunities in ascending order based on when they were last modified, and the date_added parameter overrides the default sorting behavior to list opportunities in ascending order based on when they were created. The last_modified parameter also adds the sort_token parameter to the next_link URL to ensure that opportunities are stably sorted and that order persists when changes occur while working through a paginated list.


        If the last_modified and date_added parameters are both specified, the sorting behavior is to list opportunities based on when they were last modified.'
      parameters:
      - name: date_added
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for opportunities created on or after the specified date. The filter respects time offsets from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for opportunities modified on or after the specified date. The filter respects time offsets from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
        description: Set this parameter to "true" to include inactive opportunities in the response.
      - name: search_text
        in: query
        required: false
        schema:
          type: string
        description: Represents a filter for text value fields on each opportunity.
      - name: sort_token
        in: query
        required: false
        schema:
          type: string
        description: Represents a token filter to provide the next stable-sorted list of opportunities. This will be provided on the next_link collection response property when last_modified or sort_token filters are specified on the request.
      - name: constituent_id
        in: query
        required: false
        schema:
          type: array
        description: Represents a list of constituent identifiers. Returns opportunities if any of the specified constituent identifiers match any of their constituents. For example, "constituent_id=280&amp;constituent_id=1232" returns opportunities with either "280" or "1232" constituent identifiers.
      - name: list_id
        in: query
        required: false
        schema:
          type: string
        description: Defines a list identifier used to filter the set of opportunities to those included in the specified list. If this value is set, other specified filters will be ignored.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to return. The default is 500. The maximum is 5000.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip. For use with pagination.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/opportunity#Collection">collection</a> of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/opportunity#Opportunity">opportunity</a> entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection_OpportunityRead'
              example:
                count: 39
                next_link: https://api.sky.blackbaud.com/opportunity/v1/opportunities?offset=3&limit=3
                value:
                - id: '2'
                  ask_amount:
                    value: 10000
                  ask_date: '2002-07-30T00:00:00Z'
                  campaign_id: '6'
                  constituent_id: '306'
                  date_added: '2000-01-19T14:11:02.453Z'
                  date_modified: '2002-07-30T14:28:39.173Z'
                  deadline: '2005-05-15T00:00:00Z'
                  expected_amount:
                    value: 10000
                  expected_date: '2004-05-15T00:00:00Z'
                  funded_amount:
                    value: 10000
                  funded_date: '2004-05-15T00:00:00Z'
                  fundraisers:
                  - constituent_id: '194'
                    credit_amount:
                      value: 10000
                  fund_id: '12'
                  inactive: false
                  linked_gifts:
                  - '208'
                  name: Scholarship Proposal
                  purpose: Research Endowment
                  status: Strategy
                  opportunity_likelihood_name: Definitely going to happen
                  opportunity_likelihood_id: '177'
                  gift_type: Pledge
                  gift_type_id: '601'
                - id: '3'
                  ask_amount:
                    value: 200000
                  ask_date: '2003-11-24T00:00:00Z'
                  campaign_id: '6'
                  constituent_id: '219'
                  date_added: '2000-03-14T14:10:47.227Z'
                  date_modified: '2004-10-11T14:52:54.277Z'
                  deadline: '2006-07-30T00:00:00Z'
                  expected_amount:
                    value: 200000
                  expected_date: '2005-06-01T00:00:00Z'
                  funded_amount:
                    value: 500500
                  funded_date: '2005-06-01T00:00:00Z'
                  fundraisers:
                  - constituent_id: '188'
                    credit_amount:
                      value: 254050
                  fund_id: '12'
                  inactive: false
                  linked_gifts:
                  - '101'
                  - '280'
                  - '489'
                  name: Scholarship Proposal
                  purpose: Education - Endowment
                  status: Stewardship
                  opportunity_likelihood_name: Might happen
                  opportunity_likelihood_id: '174'
                  gift_type: Gift in kind
                  gift_type_id: '603'
                - id: '4'
                  ask_amount:
                    value: 100000
                  ask_date: '2002-11-20T00:00:00Z'
                  campaign_id: '7'
                  constituent_id: '255'
                  date_added: '2000-03-15T15:19:57.91Z'
                  date_modified: '2004-10-12T19:45:03.093Z'
                  deadline: '2003-12-31T00:00:00Z'
                  expected_amount:
                    value: 100000
                  expected_date: '2003-12-31T00:00:00Z'
                  funded_amount:
                    value: 150000
                  funded_date: '2003-01-22T00:00:00Z'
                  fundraisers:
                  - constituent_id: '230'
                    credit_amount:
                      value: 150000
                  fund_id: '5'
                  name: Planned Giving - Playground
                  inactive: false
                  purpose: Major Gift
                  status: Stewardship
                  opportunity_likelihood_name: Definitely going to happen
                  opportunity_likelihood_id: '177'
                  gift_type: Planned gift
                  gift_type_id: '602'
        '400':
          description: Returned when the specified request parameters are not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to view the opportunities.
      tags:
      - Opportunities
  /opportunities/attachments:
    post:
      operationId: CreateOpportunityAttachment
      summary: Opportunity attachment (Create)
      description: Creates an opportunity attachment.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentAdd'
            example:
              date: '2015-01-25T04:00:00Z'
              name: Menu
              parent_id: '412'
              tags:
              - Lunch
              type: Link
              url: http://www.example.com/lunchmeeting/menu
        description: An object that represents the attachment to create.
      responses:
        '200':
          description: Returned when the operation successfully creates an attachment. The response body contains the ID of the new attachment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: '1281'
        '400':
          description: Returned when the request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to create the attachment.
        '404':
          description: Returned when the specified opportunity is not found.
      tags:
      - Opportunities
  /opportunities/attachments/{attachment_id}:
    delete:
      operationId: DeleteOpportunityAttachment
      summary: Opportunity attachment (Delete)
      description: Deletes an opportunity attachment.
      parameters:
      - name: attachment_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the attachment to delete.
      responses:
        '200':
          description: Returned when the operation successfully deletes the attachment.
        '400':
          description: Returned when the specified attachment ID in the request URL is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to delete the attachment.
      tags:
      - Opportunities
    patch:
      operationId: EditOpportunityAttachment
      summary: Opportunity attachment (Edit)
      description: Edits an opportunity attachment.
      parameters:
      - name: attachment_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the attachment to edit.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentEdit'
            example:
              date: '2015-01-25T04:00:00Z'
              name: Menu
              tags:
              - Lunch
              url: http://www.example.com/lunchmeeting/menu
        description: An object that represents updated properties of the attachment to edit.
      responses:
        '200':
          description: Returned when the operation successfully edits the attachment.
        '400':
          description: Returned when the specified attachment ID in the request URL or the specified request parameters are not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to edit the attachment.
        '404':
          description: Returned when the specified attachment is not found.
      tags:
      - Opportunities
  /opportunities/customfields:
    post:
      operationId: CreateOpportunityCustomField
      summary: Opportunity custom field (Create)
      description: Creates an opportunity custom field.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomFieldAdd'
            example:
              category: Moves Management
              comment: Strong wealth analysis and interest level.
              date: '2012-03-09T00:00:00Z'
              parent_id: '2452'
              value: Qualification
        description: An object that represents the custom field to create.
      responses:
        '200':
          description: Returned when the operation successfully creates a custom field. The response body contains the ID of the new custom field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: '1281'
        '400':
          description: Returned when the request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to create the custom field.
        '404':
          description: Returned when the specified opportunity is not found.
      tags:
      - Opportunities
  /opportunities/customfields/categories:
    get:
      operationId: ListOpportunityCustomFieldCategories
      summary: Opportunity custom field categories
      description: Returns the list of custom field categories.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/opportunity#Collection">collection</a> of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/opportunity#CustomFieldCategory">custom field categories</a>.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection_CustomFieldCategoryRead'
              example:
                count: 4
                value:
                - name: Principal Investigator (PI)
                  type: Text
                - name: Current Year Portion
                  type: Currency
                - name: Current Year Portion
                  type: Currency
                - name: Moves Management
                  type: CodeTableEntry
        '403':
          description: Returned when the user does not have permission to view the custom field categories.
      tags:
      - Opportunities
  /opportunities/customfields/categories/values:
    get:
      operationId: ListOpportunityCustomFieldCategoryValues
      summary: Opportunity custom field category values
      description: Returns the list of custom field category values.
      parameters:
      - name: category_name
        in: query
        required: false
        schema:
          type: string
        description: The name of the category to return values for.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/opportunity#Collection">collection</a> of string custom field category values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection_String'
              example:
                count: 5
                value:
                - Identification
                - Qualification
                - Cultivation
                - Solicitation
                - Stewardship
        '400':
          description: Returned when the specified request parameter is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to view the custom field category values.
      tags:
      - Opportunities
  /opportunities/customfields/{custom_field_id}:
    delete:
      operationId: DeleteOpportunityCustomField
      summary: Opportunity custom field (Delete)
      description: Deletes a custom field.
      parameters:
      - name: custom_field_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the custom field to delete.
      responses:
        '200':
          description: Returned when the operation succeeds and the custom field has been deleted.
        '400':
          description: Returned when the specified custom field ID in the request URL is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to delete the custom field.
      tags:
      - Opportunities
    patch:
      operationId: EditOpportunityCustomField
      summary: Opportunity custom field (Edit)
      description: Edits an opportunity custom field.
      parameters:
      - name: custom_field_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the custom field to edit.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomFieldEdit'
            example:
              comment: Initial ask successful and cultivating interest.
              date: '2013-03-09T00:00:00Z'
              value: Stewardship
        description: An object that represents the custom field to edit.
      responses:
        '200':
          description: Returned when the operation successfully edits the custom field.
        '400':
          description: Returned when the specified custom field ID in the request URL or the specified request parameters are not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to edit the custom field.
        '404':
          description: Returned when the specified custom field is not found.
      tags:
      - Opportunities
  /opportunities/{opportunity_id}:
    delete:
      operationId: DeleteOpportunity
      summary: Opportunity (Delete)
      description: Deletes an opportunity.
      parameters:
      - name: opportunity_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the opportunity to delete.
      responses:
        '200':
          description: Returned when the operation successfully deletes the opportunity.
        '400':
          description: Returned when the specified opportunity ID in the request URL is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to delete the opportunity.
        '404':
          description: Returned when the specified opportunity is not found.
        '409':
          description: Returned when the opportunity has dependent records and cannot be deleted.
      tags:
      - Opportunities
    patch:
      operationId: EditOpportunity
      summary: Opportunity (Edit)
      description: Edits an opportunity.
      parameters:
      - name: opportunity_id
        in: path
