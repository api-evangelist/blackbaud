              original_ask_date: '2002-06-15T00:00:00Z'
              instrument: Personal visit
              org_contact_id: '412'
              date_rated: '2002-06-20T00:00:00Z'
        description: An object that represents the properties of the opportunity to edit.
      responses:
        '200':
          description: Returned when the operation successfully edits the opportunity.
        '400':
          description: Returned when the specified opportunity ID in the request URL body or the specified request parameters are not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to edit the opportunity.
        '404':
          description: Returned when the specified opportunity is not found.
      tags:
      - Opportunities
