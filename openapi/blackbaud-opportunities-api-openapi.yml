        description: The immutable system record ID of the opportunity to edit.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpportunityEdit'
            example:
              ask_amount:
                value: 10000
              ask_date: '2002-07-30T00:00:00Z'
              campaign_id: '6'
              deadline: '2005-05-15T00:00:00Z'
              expected_amount:
                value: 10000
              expected_date: '2004-05-15T00:00:00Z'
              fund_id: '12'
              funded_amount:
