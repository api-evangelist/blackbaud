openapi: 3.2.0
info:
  title: Blackbaud Prospectopportunities API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Prospectopportunities across 2 of this provider''s published API definitions: blackbaud-altru-prospect-api-openapi.yml, blackbaud-crm-prospect-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/alt-prsmg
- url: https://api.sky.blackbaud.com/crm-prsmg
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Prospectopportunities
paths:
  /prospectopportunities:
    post:
      operationId: CreateProspectOpportunity
      summary: Create a prospect opportunity
      description: Adds an opportunity to a prospect plan.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProspectOpportunity'
            example:
              prospect_plan_id: ''
              header: ''
              prospect_plan: ''
              expected_ask_amount: 0
              ask_amount: 0
              accepted_amount: 0
              status: Unqualified
              expected_ask_date: ''
              ask_date: ''
              response_date: ''
              comment: ''
              designation:
              - designation_id: ''
                amount: 0
                sequence: 0
                constituent: ''
                transaction_currency_id: ''
                funding_method: ''
                category: ''
                type: ''
                use: ''
              prospect_plan_name: ''
              prospect_id: ''
              group: false
              likelihood_type_code: ''
              opportunity_type: ''
              transaction_currency: ''
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully creates the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Prospectopportunities
    servers:
    - url: https://api.sky.blackbaud.com/alt-prsmg
  /prospectopportunities/search:
    get:
      operationId: SearchProspectOpportunities
      summary: Search for prospect opportunities
      description: Search for opportunity
      parameters:
      - name: keyname
        in: query
        required: false
        schema:
          type: string
        description: last/org/group name
      - name: firstname
        in: query
        required: false
        schema:
          type: string
        description: first name
      - name: lookup_id
        in: query
        required: false
        schema:
          type: string
        description: lookup id
      - name: designationuserid
        in: query
        required: false
        schema:
          type: string
        description: designation
      - name: ask_amount
        in: query
        required: false
        schema:
          type: number
        description: ask amount
      - name: ask_date
        in: query
        required: false
        schema:
          type: string
        description: Format - date (as full-date in RFC3339). ask date
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - Unqualified
          - Qualified
          - Response pending
          - Accepted
          - Rejected
          - Canceled
        description: status
      - name: includeinactive
        in: query
        required: false
        schema:
          type: boolean
        description: include inactive
      - name: includedeceased
        in: query
        required: false
        schema:
          type: boolean
        description: include deceased
      - name: checknickname
        in: query
        required: false
        schema:
          type: boolean
        description: check nickname
      - name: checkaliases
        in: query
        required: false
        schema:
          type: boolean
        description: check aliases
      - name: exactmatchonly
        in: query
        required: false
        schema:
          type: boolean
        description: match all criteria exactly
      - name: checkalternatelookupids
        in: query
        required: false
        schema:
          type: boolean
        description: check alternate lookup ids
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Limits the number of records to return.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of result entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProspectOpportunitySearchCollection'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to view the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Prospectopportunities
    servers:
    - url: https://api.sky.blackbaud.com/alt-prsmg
  /prospectopportunities/{opportunity_id}:
    patch:
      operationId: EditProspectOpportunity
      summary: Edit a prospect opportunity
      description: Edits an opportunity.
      parameters:
      - name: opportunity_id
        in: path
        required: true
        schema:
          type: string
        description: The opportunity id.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditProspectOpportunity'
            example:
              header: jean h. aertker
              prospect_plan: major giving
              expected_ask_amount: 0
              ask_amount: 0
              accepted_amount: 0
              status: Unqualified
              expected_ask_date: '2021-06-02T12:00:00Z'
              ask_date: '2021-06-02T12:00:00Z'
              response_date: '2021-06-09T12:00:00Z'
              comment: ''
              designation:
              - id: ''
                designation_id: ''
                amount: 0
                sequence: 0
                constituent: ''
                constituent_name: ''
                transaction_currency_id: ''
                funding_method: ''
                category: ''
                type: ''
                use: ''
              prospect_plan_name: jean's major giving plan
              prospect_id: 17035913-5d1a-4318-a1c2-fc0b6b5daf46
              group: false
              likelihood_type_code: ''
              opportunity_type: ''
              transaction_currency: ''
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully edits the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to edit the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Prospectopportunities
    get:
      operationId: GetProspectOpportunity
      summary: Get a prospect opportunity
      description: Edits an opportunity.
      parameters:
      - name: opportunity_id
        in: path
        required: true
        schema:
          type: string
        description: The opportunity id.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProspectOpportunity'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to get the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Prospectopportunities
    servers:
    - url: https://api.sky.blackbaud.com/alt-prsmg
  /prospectopportunities/{prospect_plan_id}/list:
    get:
      operationId: ListProspectOpportunities
      summary: List prospect opportunities
      description: List of opportunities for a prospect plan.
      parameters:
      - name: prospect_plan_id
        in: path
        required: true
        schema:
          type: string
        description: The prospect plan id.
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - Unqualified
          - Qualified
          - Response pending
          - Accepted
          - Rejected
          - Canceled
        description: 'status:'
      - name: amount
        in: query
        required: false
        schema:
          type: number
        description: 'minimum amount:'
      - name: ask_date
        in: query
        required: false
        schema:
          type: string
        description: 'Format - date (as full-date in RFC3339). ask date since:'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Limits the number of records to return.
      - name: session_key
        in: query
        required: false
        schema:
          type: string
        description: A unique key provided by user for paging results. The same key will be returned in a successful response.
      - name: infinity_session
        in: query
        required: false
        schema:
          type: string
        description: Values for cookies related to the Infinity load balancer session.
      - name: more_rows_range_key
        in: query
        required: false
        schema:
          type: string
        description: Key for accessing cached results on subsequent calls to this data list.
      - name: start_row_index
        in: query
        required: false
        schema:
          type: integer
        description: Number of rows to skip,get result after these rows.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of result entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProspectOpportunityListCollection'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to view the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Prospectopportunities
    servers:
    - url: https://api.sky.blackbaud.com/alt-prsmg
