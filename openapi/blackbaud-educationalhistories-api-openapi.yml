openapi: 3.2.0
info:
  title: Blackbaud Educationalhistories API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Educationalhistories across 2 of this provider''s published API definitions: blackbaud-altru-constituent-api-openapi.yml, blackbaud-crm-constituent-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/alt-conmg
- url: https://api.sky.blackbaud.com/crm-conmg
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Educationalhistories
paths:
  /educationalhistories:
    post:
      operationId: CreateEducation
      summary: Create an education
      description: Adds a new educational history record to an existing constituent.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewEducation'
            example:
              constituent_id: ''
              primary_record: false
              educational_institution_id: ''
              academic_catalog_program: ''
              educational_program: ''
              constituency_status: Unknown
              date_graduated: ''
              date_left: ''
              educational_history_level: ''
              educational_history_reason: ''
              academic_catalog_degree: ''
              educational_degree: ''
              educational_award: ''
              start_date: ''
              class_year: 0
              preferred_class_year: 0
              educational_source: ''
              educational_source_date: ''
              comment: ''
              affiliated_additional_information:
              - id: ''
                academiccatalogcollege: ''
                academiccatalogdivision: ''
                academiccatalogdepartment: ''
                academiccatalogsubdepartment: ''
                academiccatalogdegreetype: ''
              unaffiliated_additional_information:
              - id: ''
                educational_college: ''
                educational_division: ''
                educational_department: ''
                educational_sub_department: ''
                educational_degree_type: ''
              affiliated: false
              use_academic_catalog: false
              educational_history_status: ''
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully creates the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Educationalhistories
    servers:
    - url: https://api.sky.blackbaud.com/alt-conmg
  /educationalhistories/search:
    get:
      operationId: SearchEducations
      summary: Search for educations
      description: This search list provides the ability to search for educational history records.
      parameters:
      - name: full_name_educational_institution
        in: query
        required: false
        schema:
          type: string
        description: full name educational institution
      - name: key_name
        in: query
        required: false
        schema:
          type: string
        description: last/org name
      - name: first_name
        in: query
        required: false
        schema:
          type: string
        description: first name
      - name: lookup_id
        in: query
        required: false
        schema:
          type: string
        description: lookup id
      - name: exact_match_only
        in: query
        required: false
        schema:
          type: boolean
        description: match all criteria exactly
      - name: check_nick_name
        in: query
        required: false
        schema:
          type: boolean
        description: check nickname
      - name: check_aliases
        in: query
        required: false
        schema:
          type: boolean
        description: check aliases
      - name: check_alternate_lookup_ids
        in: query
        required: false
        schema:
          type: boolean
        description: check alternate lookup ids
      - name: educational_institution
        in: query
        required: false
        schema:
          type: string
        description: educational institution SimpleDataListID=0e239b5a-8c99-4e1e-9c10-06adce4b6500.
      - name: academic_catalog_program
        in: query
        required: false
        schema:
          type: string
        description: academic catalog program SimpleDataListID=d411c16b-8bcf-4fc8-a747-754e1e89e9bc.
      - name: educational_program
        in: query
        required: false
        schema:
          type: string
        description: educational program This code table can be queried at https://api.sky.blackbaud.com/alt-adnmg/codetables/EDUCATIONALPROGRAMCODE/entries
      - name: constituency_status
        in: query
        required: false
        schema:
          type: string
          enum:
          - All statuses
          - Unknown
          - Currently attending
          - Incomplete
          - Graduated
        description: status
      - name: educational_history_status
        in: query
        required: false
        schema:
          type: string
        description: status SimpleDataListID=086c5bfb-1a80-46cf-a2f5-05ef51120891.
      - name: academic_catalog_degree
        in: query
        required: false
        schema:
          type: string
        description: academic catalog degree SimpleDataListID=73c67942-07ad-412e-8596-a042e5e68002.
      - name: educational_degree
        in: query
        required: false
        schema:
          type: string
        description: educational degree This code table can be queried at https://api.sky.blackbaud.com/alt-adnmg/codetables/EDUCATIONALDEGREECODE/entries
      - name: class_of
        in: query
        required: false
        schema:
          type: integer
        description: class year
      - name: primary_only
        in: query
        required: false
        schema:
          type: boolean
        description: only search primary records
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Limits the number of records to return.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of result entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EducationSearchCollection'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to view the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Educationalhistories
    servers:
    - url: https://api.sky.blackbaud.com/alt-conmg
  /educationalhistories/{educational_history_id}:
    delete:
      operationId: DeleteEducation
      summary: Delete an education
      description: This deletion handles only the basic deletion rules for an educational history (currently none).
      parameters:
      - name: educational_history_id
        in: path
        required: true
        schema:
          type: string
        description: The educational history id
      responses:
        '200':
          description: Returned when the operation successfully deletes the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to delete the resource.
      tags:
      - Educationalhistories
    patch:
      operationId: EditEducation
      summary: Edit an education
      description: Edits educational history.
      parameters:
      - name: educational_history_id
        in: path
        required: true
        schema:
          type: string
        description: The educational history id.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditEducation'
            example:
              primary_record: false
              educational_institution_id: 6d31a4d0-57fb-454e-9ce9-f09049327153
              academic_catalog_program: ''
              educational_program: FullCourse
              constituency_status: Unknown
              date_graduated:
                year: 2015
                month: 6
                day: 17
              date_left:
                year: 2017
                month: 4
                day: 19
              academic_catalog_degree: ''
              educational_degree: MBA
              educational_award: ''
              start_date:
                year: 2014
                month: 4
                day: 13
              class_year: 0
              preferred_class_year: 0
              educational_source: ''
              educational_source_date:
                year: 0
                month: 0
                day: 0
              comment: ''
              affiliated: false
              educational_history_level: ''
              educational_history_reason: ''
              use_academic_catalog: false
              educational_history_status: 00000000-0000-0000-0000-000000000004
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully edits the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to edit the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Educationalhistories
    get:
      operationId: GetEducation
      summary: Get an education
      description: Edits educational history.
      parameters:
      - name: educational_history_id
        in: path
        required: true
        schema:
          type: string
        description: The educational history id.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Education'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to get the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Educationalhistories
    servers:
    - url: https://api.sky.blackbaud.com/alt-conmg
