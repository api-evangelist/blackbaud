openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: School Contentmanagement API'
  description: This API is used to provide access to school information such as users, academics, admissions, athletics, content, lists, and general school info.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/school
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/school
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Contentmanagement
paths:
  /v1/contentmanagement/announcements/categories:
    get:
      operationId: V1ContentmanagementAnnouncementsCategoriesGet
      summary: Content management announcement categories
      description: 'Returns a collection of announcement categories.


        Requires at least one of the following roles in the Education Management System:


        Content Manager


        Content Editor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentAnnouncementCategoryCollection'
              example:
                count: 1
                value:
                - category_id: 1
                  category_name: School Announcements
                  allow_user_management: false
                  rss_enabled: true
                  rss_feed: www.notarealurl.com
                  is_public: false
                  access_roles:
                  - id: 1
                    name: Academic Group Manager
                    base_role:
                      id: 1
                      name: Academic Group Manager
      tags:
      - Contentmanagement
  /v1/contentmanagement/announcements/list:
    post:
      operationId: V1ContentmanagementAnnouncementsListPost
      summary: Content management announcements
      description: 'Returns a collection of announcements.


        Requires at least one of the following roles in the Education Management System:


        Content Manager


        Content Editor


        Academic Group Manager


        Advisory Group Manager


        Activity Group Manager


        Athletic Group Manager


        Dorm Group Manager


        Community Group Manager'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentManagementRequest'
            example:
              categories:
              - id: 1
                type: Academics
              as_of_date: '2023-12-31T12:00:00Z'
              last_modified: '2023-12-31T12:00:00Z'
              show_secured: true
        description: "Announcement Request model provides the following params: \n<b>Categories</b>: An array of objects, each with an <b>id</b> (category or section ID) and a <b>type</b> (Allowed values: PageContent, Academics, Activity, Advisory, Athletics, Dorm or Community), used to filter results. At least one category is required.\n<b>As_of_date</b>: Enter a date in ISO-8601 format (e.g., 2022-04-01) to filter announcement items that are published and active on that date.\n<b>Last_modified</b>: Enter a date in ISO-8601 format (e.g., 2022-04-01) to filter announcement items that have been modified on or after this date.\n<b>Show_secured</b>: Set to true to include non-public content; the default value is false."
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1ContentmanagementAnnouncementsListPost200ApplicationJsonResponse'
              example:
              - id: 1
                headline: Amazing Marconi to Visit
                author: John Smith
                description: Come see the Amazing Marconi’s act.
                send_notification: true
                created_date: '2024-10-31T12:00:00Z'
                modified_date: '2024-10-31T12:00:00Z'
                created_by: 12345
                modified_by: 67891
                categories:
                - id: 1
                  name: History II – 1
                  type: Academics
                  primary: true
                  publish_date: '2024-10-31T12:00:00Z'
                  expire_date: '2024-10-31T12:00:00Z'
      tags:
      - Contentmanagement
  /v1/contentmanagement/news/categories:
    get:
      operationId: V1ContentmanagementNewsCategoriesGet
      summary: Content management news categories
      description: 'Returns a collection of news categories..


        Requires at least one of the following roles in the Education Management System:


        Content Manager


        Content Editor'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsCategoryCollection'
              example:
                count: 1
                value:
                - category_id: 1
                  category_name: School News
                  allow_user_management: false
                  show_brief_description: true
                  show_long_description: true
                  rss_ind: true
                  allow_comments: disable
                  comment_approval: none
                  rss_feed: www.notarealurl.com
                  is_public: true
                  access_roles:
                  - id: 1
                    name: Academic Group Manager
                    base_role:
                      id: 1
                      name: Academic Group Manager
                  image_settings:
                    max_allowed: 10
                    allow_captions: true
                    allow_descriptions: true
                    standard:
                      include: true
                      max_width: 240
                      max_height: 240
                    zoom:
                      include: true
                      max_width: 240
                      max_height: 240
                    thumbnail:
                      include: true
                      max_width: 240
                      max_height: 240
      tags:
      - Contentmanagement
  /v1/contentmanagement/news/list:
    post:
      operationId: V1ContentmanagementNewsListPost
      summary: Content management news
      description: 'Returns a collection of news.


        Requires at least one of the following roles in the Education Management System:


        Content Manager


        Content Editor


        Academic Group Manager


        Advisory Group Manager


        Activity Group Manager


        Athletic Group Manager


        Dorm Group Manager


        Community Group Manager'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentManagementRequest'
            example:
              categories:
              - id: 1
                type: Academics
              as_of_date: '2023-12-31T12:00:00Z'
              last_modified: '2023-12-31T12:00:00Z'
              show_secured: true
        description: "News Request model provides the following params: \n<b>Categories</b>: An array of objects, each with an <b>id</b> (category or section ID) and a <b>type</b> (Allowed values: PageContent, Academics, Activity, Advisory, Athletics, Dorm or Community), used to filter results. At least one category is required.\n<b>As_of_date</b>: Enter a date in ISO-8601 format (e.g., 2022-04-01) to filter news items that are published and active on that date.\n<b>Last_modified</b>: Enter a date in ISO-8601 format (e.g., 2022-04-01) to filter news items that have been modified on or after this date.\n<b>Show_secured</b>: Set to true to include non-public content; the default value is false."
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1ContentmanagementNewsListPost200ApplicationJsonResponse'
              example:
                count: 2
                value:
                - id: 1
                  headline: News Story
                  author: Gus I. Dunno
                  short_description: Brief
                  long_description: Loquacity
                  featured: true
                  media_item:
                  - id: 1
                    type: Photo
                    title: Mighty Ducks
                    caption: Photo
                    is_cover: false
                    url: www.notarealurl.com
                  - id: 2
                    type: Photo
                    title: Climbing K2
                    caption: Another
                    is_cover: false
                    url: www.notarealurl.com
                  categories:
                  - id: 2
                    name: Featured News
                    type: Push Page
                    primary: true
                    publish_date: '2023-12-12T12:00:00Z'
                  - id: 3
                    name: Important News
                    type: Academics
                    primary: false
                    publish_date: '2024-01-01T12:00:00Z'
                  send_notification: true
                  show_brief_description: true
                  show_long_description: true
                  created_by: 123
                  created_date: '2023-02-12T12:00:00Z'
                  modified_by: 234
                  modified_date: '2023-02-12T12:00:00Z'
                - id: 2
                  headline: Another Story
                  author: Wile E. Coyote
                  short_description: Brief
                  long_description: Oratory
                  featured: false
                  media_item:
                  - id: 3
                    type: Photo
                    title: Bruins at play
                    caption: PhotoSet2
                    is_cover: false
                    url: www.notarealurl.com
                  - id: 4
                    type: Photo
                    title: Everest at night
                    caption: AnotherPhoto
                    is_cover: false
                    url: www.notarealurl.com
                  categories:
                  - id: 4
                    name: Parents News
                    type: Dorms
                    primary: false
                    publish_date: '2024-01-25T12:00:00Z'
                  - id: 2
                    name: Featured News
                    type: Push Page
                    primary: false
                    publish_date: '2024-03-01T12:00:00Z'
                    expire_date: '2024-06-30T12:00:00Z'
                  send_notification: false
                  show_brief_description: true
                  show_long_description: true
                  created_by: 234
                  created_date: '2024-03-08T12:00:00Z'
                  modified_by: 345
                  modified_date: '2023-02-12T12:00:00Z'
      tags:
      - Contentmanagement
  /v1/contentmanagement/photoalbums/categories:
    get:
      operationId: V1ContentmanagementPhotoalbumsCategoriesGet
      summary: Content management photo album categories
      description: 'Returns a collection of photo categories.


        Requires at least one of the following roles in the Education Management System:


        Registration Manager


        Content Manager


        Content Editor


        Academic Group Manager


        Advisory Group Manager


        Activity Group Manager


        Athletic Group Manager


        Dorm Group Manager


        Community Group Manager'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhotoCategoryCollection'
              example:
                count: 1
                value:
                - id: 83218
                  description: Aaron's Photos
                  include_description_for_photos: true
                  is_public: true
                  access_roles:
                  - id: 1
                    name: Academic Group Manager
                    base_role:
                      id: 1
                      name: Academic Group Manager
                  image_settings:
                    allow_title: true
                    allow_captions: true
                    allow_descriptions: true
                    standard:
                      include: true
                      max_width: 240
                      max_height: 240
                    zoom:
                      include: true
                      max_width: 240
                      max_height: 240
                    thumbnail:
                      include: true
                      max_width: 240
                      max_height: 240
      tags:
      - Contentmanagement
  /v1/contentmanagement/photoalbums/list:
    post:
      operationId: V1ContentmanagementPhotoalbumsListPost
      summary: Content management photo albums
      description: 'Returns a list of photo albums.


        Requires at least one of the following roles in the Education Management System:


        Content Manager


        Academic Group Manager


        Advisory Group Manager


        Activity Group Manager


        Athletic Group Manager


        Dorm Group Manager


        Community Group Manager'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentManagementRequest'
            example:
              categories:
              - id: 1
                type: Academics
              as_of_date: '2023-12-31T12:00:00Z'
              last_modified: '2023-12-31T12:00:00Z'
              show_secured: true
        description: "Photo Album Request model provides the following params: \n<b>Categories</b>: An array of objects, each with an <b>id</b> (category or section ID) and a <b>type</b> (Allowed values: PageContent, Academics, Activity, Advisory, Athletics, Dorm or Community), used to filter results. At least one category is required.\n<b>As_of_date</b>: Enter a date in ISO-8601 format (e.g., 2022-04-01) to filter photo albums that are published and active on that date.\n<b>Last_modified</b>: Enter a date in ISO-8601 format (e.g., 2022-04-01) to filter photo albums that have been modified on or after this date.\n<b>Show_secured</b>: Set to true to include non-public content; the default value is false."
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1ContentmanagementPhotoalbumsListPost200ApplicationJsonResponse'
              example:
              - id: 1
                title: Amazing Marconi to Visit
                description: Amazing Marconi to Visit
                allow_downloads: true
                featured: true
                categories:
                - id: 1
                  name: Event Photos
                  type: Photography
                  primary: true
                  publish_date: '2024-12-19T12:00:00Z'
                  expire_date: '2025-12-31T12:00:00Z'
                url: https://sisacademy.myschoolapp.com/app/detail/album/photo/2119786
      tags:
      - Contentmanagement
  /v1/contentmanagement/photoalbums/{album_id}:
    get:
      operationId: V1ContentmanagementPhotoalbumsByAlbum_idGet
      summary: Content management photos by album
      description: 'Returns a list of photos for an album.


        Requires at least one of the following roles in the Education Management System:


        Content Manager


        Academic Group Manager


        Athletic Group Manager


        Activity Group Manager


        Advisory Group Manager


        Dorm Group Manager


        Community Group Manager'
      parameters:
      - name: album_id
        in: path
        required: true
        schema:
          type: integer
        description: ID of the photo album to return
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaItemCollection'
              example:
              - id: 1
                type: Photo
                title: Firefly-Avatar
                caption: Ava-fly Mashup
                tags: Aang
                description: Awesome mashup
                is_cover: true
                url: //bbk12e1-cdn.myschoolcdn.com/236/photo/orig_photo2119786_1.jpg
                thumbnail_url: //bbk12e1-cdn.myschoolcdn.com/236/photo/large_photo2119786_1.jpg
              - id: 2
                type: Photo
                title: Blue
                caption: Deep blue
                tags: Art
                description: It's art!?!
                is_cover: false
                url: //bbk12e1-cdn.myschoolcdn.com/236/photo/orig_photo2119786_2.jpg
                thumbnail_url: //bbk12e1-cdn.myschoolcdn.com/236/photo/large_photo2119786_2.jpg
      tags:
      - Contentmanagement
