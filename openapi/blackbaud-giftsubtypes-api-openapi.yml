openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: Gift Giftsubtypes API'
  description: This API manages gift information and related entities such as gift splits, gift fundraisers, and soft credits.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/58bdd5edd7dcde06046081d6
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/gift/v1
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Giftsubtypes
paths:
  /giftsubtypes:
    get:
      operationId: ListGiftSubtypes
      summary: Gift subtypes
      description: Returns a list of gift subtypes.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/gift#Collection">collection</a> of string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection_String'
              example:
                count: 12
                value:
                - NotInFund
                - Acreage
                - Annuity
                - Auction
                - Bequest
                - Charitable Lead Trust
                - Charitable Remainder Trust
                - Computers
                - Event
                - Life Insurance Policy
                - Membership
                - United Way
        '403':
          description: Returned when the user does not have permission to view the gift subtypes.
      tags:
      - Giftsubtypes
components:
  schemas:
    ApiCollection_String:
      description: Fetching data all at once quickly becomes unmanageable. The collection entity helps by returning paginated chunks of large data sets. This entity includes helpful metadata and properties to paginate and iterate through the data.
      type: object
      properties:
        count:
          format: int32
          description: The number of items available for retrieval into the collection after applying any request parameters. The <b>limit</b> and <b>offset</b> parameters do not affect the <b>count</b>, but to facilitate paging, they may affect the number of items in the <b>value</b> result set.
          type: integer
        next_link:
          description: For paginated responses, the URI for the next page of results.
          type: string
        value:
          description: The set of items included in the response. This may be a subset of the items in the collection.
          type: array
          items:
            type: string
      x-hidden: true
      x-base-type: '#/definitions/ApiCollection'
  securitySchemes:
