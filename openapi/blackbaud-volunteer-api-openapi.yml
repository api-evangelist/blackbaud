  /v1/volunteer/updateevents:
    patch:
      operationId: EditEvent
      summary: Edit an event (PREVIEW)
      description: 'Edits an event.


        The major difference between update and add an event are - update requires an Event ID. Furthermore, some fields are not updatable at this time.

        These include shifts and the event schedule due to complexities with moving participations.


        `eventId` is required for edits and is validated by the upstream API.


        To associate a benefitting organization with the event, provide one of the following (in order of precedence): `nonprofitId` (the unique GUID for the charity — highest precedence, resolves an exact match), `charityId` (the CSRconnect charity identifier), `registrationNumber` (for example, the charity''s EIN), or `benefittingOrganization` (a free-text organization name). At least one of these must be supplied. Charity identifier validation is enforced by the upstream API.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
            example:
              event_id: 7001
              name: City Food Bank Volunteering - Updated
              registration_number: CHR-00042
              description: Help sort and pack food donations at the city food bank.
              show_in_search: true
              allow_family_and_friends_to_attend: false
              meetup_instructions: Meet at the main entrance on Main St. Wear comfortable clothes.
              original_start_date: '2025-06-15'
              original_end_date: '2025-06-15'
              start_hours: 9
              end_hours: 12
              start_minutes: 0
              end_minutes: 0
              start_day: 0
              original_timezone: America/New_York
              original_registration_start_date: '2025-05-01'
              original_registration_end_date: '2025-06-14'
              registration_start_hours: 0
              registration_end_hours: 23
              registration_start_minutes: 0
              registration_end_minutes: 59
              allow_log_hours_after_end_event: true
              event_image_url: https://cdn.example.com/events/cover.jpg
              recurrence_instructions:
                recurrence_type_id: 2
                separation_count: 1
                number_of_ocurrence: 4
                recurrence_start_date: '2025-06-15'
                selected_days_of_week:
                - id: 0
                  selected: false
                - id: 6
                  selected: true
                month_selections:
                - instance_of_month: 1
                  day_of_week: 6
              location:
                address1: 123 Main St
                city: Atlanta
                state: GA
                postal_code: '30301'
                country_code: US
              contacts:
              - first_name: Jane
                last_name: Smith
                email: jane.smith@example.com
                phone_number: 404-555-0100
                reason_to_contact: Event Coordinator
              virtual: false
              schedule_change_type: 0
              default_shift_name: Morning Sort
              default_shift_capacity: 25
              default_shift_hours: 3
              default_shift_cra_eligible: false
              event_disclaimer: Participants must sign a waiver before volunteering.
              benefitting_organization: City Food Bank
        description: The request containing event details
      responses:
        '400':
          description: Returned when eventId is missing or the request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: The request was invalid or missing required parameters.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: Authentication credentials were missing or invalid.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have permission to edit events.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Forbidden
                status: 403
                detail: You do not have permission to access this resource.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '404':
          description: Returned when the specified event is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: The requested resource could not be found.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '200':
          description: Returned when the operation succeeds. The response body contains the event ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEventResponse'
              example:
                event_id: 7001
      tags:
      - Volunteer
components:
  schemas:
    CreateEventRequest:
      required:
      - name
      type: object
      properties:
        event_id:
          type:
          - integer
          - 'null'
          description: The event ID. null when creating a new event.
          format: int32
        segment_id:
          type:
          - string
          - 'null'
          description: The affiliate segment ID.
        name:
          type:
          - string
          - 'null'
          description: The name of the event.
        charity_id:
          type:
          - integer
          - 'null'
          description: The charity ID for the event's benefiting organization.
          format: int32
        nonprofit_id:
          type:
          - string
          - 'null'
          description: The nonprofit ID (GUID) of the charity to associate with this event. Takes precedence over `charityId`, `registrationNumber`, and `benefittingOrganization`.
          format: uuid
        registration_number:
          type:
          - string
          - 'null'
          description: The charity registration number for the event's benefiting organization.
        description:
          type:
          - string
          - 'null'
          description: A description of the event.
        show_in_search:
          type: boolean
          description: Indicates whether the event should appear in Search Opportunities results.
        allow_family_and_friends_to_attend:
          type: boolean
          description: Indicates whether guests can participate in the event.
        meetup_instructions:
          type:
          - string
          - 'null'
          description: Instructions for participants on where and how to meet at the event location.
        original_start_date:
          type:
          - string
          - 'null'
          description: The original start date of the event in the event's local time zone (ISO 8601 date string).
        original_end_date:
          type:
          - string
          - 'null'
          description: The original end date of the event in the event's local time zone (ISO 8601 date string).
        start_hours:
          type: integer
          description: The hour of the event start time (0–23).
          format: int32
        end_hours:
          type: integer
          description: The hour of the event end time (0–23).
          format: int32
        start_minutes:
          type: integer
          description: The minute of the event start time (0–59).
          format: int32
        end_minutes:
          type: integer
          description: The minute of the event end time (0–59).
          format: int32
        start_day:
          type: integer
          description: The day offset (relative to the recurrence start) on which the event begins.
          format: int32
        original_timezone:
          type:
          - string
          - 'null'
          description: The IANA or Windows timezone identifier for the event's local time zone.
        original_registration_start_date:
          type:
          - string
          - 'null'
          description: The original registration open date in the event's local time zone (ISO 8601 date string).
        original_registration_end_date:
          type:
          - string
          - 'null'
          description: The original registration close date in the event's local time zone (ISO 8601 date string).
        registration_start_hours:
          type: integer
          description: The hour of the registration start time (0–23).
          format: int32
        registration_end_hours:
          type: integer
          description: The hour of the registration end time (0–23).
          format: int32
        registration_start_minutes:
          type: integer
          description: The minute of the registration start time (0–59).
          format: int32
        registration_end_minutes:
          type: integer
          description: The minute of the registration end time (0–59).
          format: int32
        allow_log_hours_after_end_event:
          type: boolean
          description: Indicates whether participants can log volunteer hours after the event has ended.
        event_image_url:
          type:
          - string
          - 'null'
          description: The URL of the event's cover image.
        recurrence_instructions:
          $ref: '#/components/schemas/RecurrenceInstructions'
        location:
          $ref: '#/components/schemas/EventLocation'
        contacts:
          type:
          - array
