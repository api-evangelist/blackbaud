  /v1/volunteer/events/{event_type}/{event_id}/signup:
    post:
      operationId: CreateEmployeeEventSignup
      summary: Create event participations (PREVIEW)
      description: 'Adds participations to an event. See above for information of how to obtain event_id.


        In the body of this post, you will pass the following:


        affiliateEmployeeId is the unique identifier of the employee you are signing up.


        An array of shifts as objects. These are the individual participations. See the /{eventId} reference above for details on the parameters of the shift. Note: The hours of participation defined for each shift can not exceed the length of the shift plus 10 hours.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: event_type
        in: path
        required: true
        schema:
          type: integer
        description: 'The event type. Available values: 1 – an employee-created event; 2 – an NPO-created event'
      - name: event_id
        in: path
        required: true
        schema:
          type: integer
        description: The event ID
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeEventSignUpRequest'
            example:
              affiliate_employee_id: 9001
              shifts:
              - occurrence_number: 1
                shift_id: 801
                hours: 3
        description: The sign-up request containing employee and shift information
      responses:
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: The request was invalid or missing required parameters.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: Authentication credentials were missing or invalid.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have permission to edit event participation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Forbidden
                status: 403
                detail: You do not have permission to access this resource.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '404':
          description: Returned when the specified event is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: The requested resource could not be found.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '200':
          description: Returned when the operation succeeds. The response body indicates whether participations were added to shifts, added to waitlist, or not added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignupResult'
              example:
                participation_count: 1
                guest_count: 0
                total_hour_count: 3
                missed_shifts:
                - key: Evening Packing
