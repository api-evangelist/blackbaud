components:
  schemas:
    AssignmentStatus:
      title: AssignmentStatus
      enum:
      - Assigned
      - Requested
      type: string
      description: The status of a volunteer assignment.
    CodeTableEntry:
      type: object
      properties:
        legacy_id:
          type: string
          description: The legacy ID of the code table entry.
          nullable: true
        value:
          type: string
          description: The value of the code table entry.
          nullable: true
      additionalProperties: false
      description: A predefined entry in a code table.
    CustomFieldDataType:
      title: CustomFieldDataType
      enum:
      - Text
      - Numeric
      - DateTime
      - Currency
      - Boolean
      - TableEntry
      - Constituent
      - FuzzyDate
      type: string
      description: Represents the data type of a custom field
    CustomFieldRead:
      type: object
      properties:
        id:
          type: string
          description: The immutable system record ID of the custom field.
          nullable: true
        category:
          type: string
          description: The custom field category. Available values are the entries in the <b>Custom Field Categories</b> table
            of the parent object.
          nullable: true
        comment:
          type: string
          description: The comment on the custom field.
          nullable: true
        date:
          type: string
          description: The date on the custom field. Uses <a href="https://tools.ietf.org/html/rfc3339">ISO-8601 format:</a><i>1969-11-21T10:29:43</i>.
          format: date-time
          nullable: true
        date_added:
          type: string
          description: The date when the custom field was created. The date includes an offset from UTC in <a href="https://tools.ietf.org/html/rfc3339">ISO-8601
            format:</a><i>1969-11-21T10:29:43-04:00</i>.
          format: date-time
          nullable: true
        date_modified:
          type: string
          description: The date when the custom field was last modified. The date includes an offset from UTC in <a href="https://tools.ietf.org/html/rfc3339">ISO-8601
            format:</a><i>1969-11-21T10:29:43-04:00</i>.
          format: date-time
          nullable: true
        short_description:
          type: string
          description: The table entry's short description, for table entry custom fields.
          nullable: true
        constituent_name:
          type: string
          description: The constituent's name, for constituent custom fields.
          nullable: true
        parent_id:
          type: string
          description: The parent object's immutable system record ID.
          nullable: true
        type:
          $ref: '#/components/schemas/CustomFieldDataType'
        value:
          description: The value of the custom field. The ```type``` property determines the format.
          nullable: true
      additionalProperties: false
      description: While records provide many fields to track information, organizations often require additional details.
        To track this specialized information, use custom fields.
    DaysOfWeek:
      title: DaysOfWeek
      enum:
      - Sunday
      - Monday
      - Tuesday
      - Wednesday
      - Thursday
      - Friday
      - Saturday
      - AllDays
      - Weekdays
      - Weekends
      type: string
      description: Represents the day or days of the week of an assignment or availability.
    EmergencyContactEdit:
      type: object
      properties:
        name:
          maxLength: 50
          minLength: 0
          type: string
          description: 'The emergency contact name. Character limit: 50.'
          nullable: true
        phone:
          maxLength: 50
          minLength: 0
          type: string
          description: 'The emergency contact phone number. Character limit: 50.'
          nullable: true
        relationship:
          $ref: '#/components/schemas/CodeTableEntry'
      additionalProperties: false
      description: Emergency contact changes for a constituent.
    EmergencyContactRead:
      required:
      - constituent_id
      type: object
      properties:
        constituent_id:
          minLength: 1
          type: string
          description: The constituent record ID.
        name:
          maxLength: 50
          minLength: 0
          type: string
          description: 'The emergency contact name. Character limit: 50.'
          nullable: true
        phone:
          maxLength: 50
          minLength: 0
          type: string
          description: 'The emergency contact phone number. Character limit: 50.'
          nullable: true
        relationship:
          $ref: '#/components/schemas/CodeTableEntry'
      additionalProperties: false
      description: Emergency contact information for a constituent.
    FuzzyDate:
      type: object
      properties:
        y:
          type: integer
          description: The year.
          format: int32
          nullable: true
        m:
          type: integer
          description: The month.
          format: int32
          nullable: true
        d:
          type: integer
          description: The day.
          format: int32
          nullable: true
      additionalProperties: false
      description: Represents a fuzzy date that may contain only a year, year and month, or a complete date.
    JobCustomFieldCollection:
      type: object
      properties:
        count:
          type: integer
          description: The total number of items in the collection before limit/offset.
          format: int32
        value:
          type: array
          items:
            $ref: '#/components/schemas/CustomFieldRead'
          description: The set of items included in the response. This may be a subset of the items in the collection.
          nullable: true
      additionalProperties: false
      description: A collection of JobCustomField records.
    JobCustomFieldSortColumn:
      title: JobCustomFieldSortColumn
      enum:
      - Sequence
      - Category
      type: string
      description: Columns available for sorting a job's custom field list.
    JobRead:
      type: object
      properties:
        id:
          type: string
          description: Gets or sets the unique identifier for the job
          nullable: true
        name:
          type: string
          description: Gets or sets the job name
          nullable: true
        category:
          $ref: '#/components/schemas/CodeTableEntry'
        position:
          type: string
          description: Gets or sets the position.
          nullable: true
        volunteer_type:
          $ref: '#/components/schemas/CodeTableEntry'
        minimum_age:
          type: integer
          description: Gets or sets the minimum age.
          format: int32
          nullable: true
        start_date:
          type: string
          description: Gets or sets the start date. Date only, no time or timezone information.
          format: date-time
          nullable: true
        end_date:
          type: string
          description: Gets or sets the end date. Date only, no time or timezone information.
          format: date-time
          nullable: true
