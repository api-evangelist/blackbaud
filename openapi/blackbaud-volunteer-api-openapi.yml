openapi: 3.0.1
info:
  title: 'Blackbaud SKY API: Volunteer'
  description: This API manages volunteer information.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/volunteer
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations,
      examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/volunteer
paths:
  /v1/constituents/{constituent_id}/assignments:
    get:
      operationId: GetConstituentAssignments
      summary: List constituent volunteer assignments (PREVIEW)
      description: 'Returns a page of assignments for the specified constituent ID.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: constituent_id
        in: path
        required: true
        schema:
          type: string
        description: The constituent record ID.
      - name: start_date
        in: query
        required: false
        schema:
          type: string
        description: The inclusive lower date bound.
      - name: end_date
        in: query
        required: false
        schema:
          type: string
        description: The inclusive upper date bound.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: '50'
        description: The number of records to return. Defaults to 50 and cannot exceed 500.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: '0'
        description: The number of records to skip before returning results. Defaults to 0.
      responses:
        '200':
          description: Returned when the operation succeeds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolunteerAssignmentCollection'
              example:
                count: 1
                value:
                - id: '42'
                  job_id: '123'
                  job_name: Community Cleanup
                  start_date: '2025-06-01T12:00:00Z'
                  end_date: '2025-08-31T12:00:00Z'
                  department:
                    legacy_id: '15'
                    value: Community Services
                  location:
                    legacy_id: '8'
                    value: City Park
                  position: Team Lead
                  category:
                    legacy_id: '2'
                    value: Outdoor
                  volunteer_type:
                    legacy_id: '4'
                    value: Regular
                  status: Assigned
                  supervisor: Jane Smith
                  days_of_week: Weekends
                  job_start_date: '2025-01-01T12:00:00Z'
                  job_end_date: '2025-12-31T12:00:00Z'
                  start_time: '2026-10-14'
                  end_time: '2026-10-14'
                  requested_on: '2025-05-01T12:00:00Z'
                  letter_sent: true
                  letter_sent_on: '2025-05-15T12:00:00Z'
                  task:
                    legacy_id: '1'
                    value: Event support
                  notes: Bring supplies
                  import_id: IMP-ASSIGNMENT-001
                  sequence: 1
        '400':
          description: Returned when the date range or constituent ID is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/VolunteerDateRangeListErrorCodes'
              example:
                type: urn:blackbaud:start-date-after-end-date
                title: The request is invalid.
                status: 400
                detail: start_date must be on or before end_date.
        '401':
          description: Returned when the caller is not authenticated.
        '403':
          description: Returned when the caller does not have permission to perform this operation.
        '404':
          description: Returned when the specified constituent is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:resource-not-found
                title: The requested resource could not be found.
                status: 404
                detail: Constituent not found.
  /v1/constituents/{constituent_id}/emergencycontact:
    patch:
      operationId: EditEmergencyContact
      summary: Edit emergency contact (PREVIEW)
      description: 'Edits emergency contact information for the specified constituent.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: constituent_id
        in: path
        required: true
        schema:
          type: string
        description: The constituent record ID.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmergencyContactEdit'
            example:
              name: Jane Doe
              phone: 555-123-4567
              relationship:
                legacy_id: '1'
                value: Spouse
        description: The emergency contact changes.
      responses:
        '200':
          description: Returned when the operation succeeds.
        '400':
          description: Returned when the request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/VolunteerRecordEditErrorCodes'
              example:
                type: urn:blackbaud:table-entry-not-found
                title: The request is invalid.
                status: 400
                detail: Invalid relationship table entry.
        '401':
          description: Returned when the caller is not authenticated.
        '403':
          description: Returned when the caller does not have permission to perform this operation.
        '404':
          description: Returned when the specified constituent is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:resource-not-found
                title: The requested resource could not be found.
                status: 404
                detail: Constituent not found.
    get:
      operationId: GetEmergencyContact
      summary: Get emergency contact (PREVIEW)
      description: 'Returns emergency contact information for the specified constituent.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: constituent_id
        in: path
        required: true
        schema:
          type: string
        description: The constituent record ID.
      responses:
        '200':
          description: Returned when the operation succeeds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencyContactRead'
              example:
                constituent_id: '280'
                name: Jane Doe
                phone: 555-123-4567
                relationship:
                  legacy_id: '1'
                  value: Spouse
        '401':
          description: Returned when the caller is not authenticated.
        '403':
          description: Returned when the caller does not have permission to perform this operation.
        '404':
          description: Returned when the specified constituent is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:resource-not-found
                title: The requested resource could not be found.
                status: 404
                detail: Constituent not found.
