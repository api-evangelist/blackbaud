openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: CSRconnect Volunteer API'
  description: This API is for YourCause CSRconnect from Blackbaud.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/csr-connect
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/csr-connect
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Volunteer
paths:
  /v1/volunteer/events:
    post:
      operationId: CreateEvent
      summary: Create an event (PREVIEW)
      description: 'Creates a volunteer event.


        To associate a benefitting organization with the event, provide one of the following (in order of precedence): `nonprofitId` (the unique GUID for the charity — highest precedence, resolves an exact match), `charityId` (the CSRconnect charity identifier), `registrationNumber` (for example, the charity''s EIN), or `benefittingOrganization` (a free-text organization name). At least one of these must be supplied. Charity identifier validation is enforced by the upstream API.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
            example:
              name: City Food Bank Volunteering
              registration_number: CHR-00042
              description: Help sort and pack food donations at the city food bank.
              show_in_search: true
              allow_family_and_friends_to_attend: false
              meetup_instructions: Meet at the main entrance on Main St. Wear comfortable clothes.
              original_start_date: '2025-06-15'
              original_end_date: '2025-06-15'
              start_hours: 9
              end_hours: 12
              start_minutes: 0
              end_minutes: 0
              start_day: 0
              original_timezone: America/New_York
              original_registration_start_date: '2025-05-01'
              original_registration_end_date: '2025-06-14'
              registration_start_hours: 0
              registration_end_hours: 23
              registration_start_minutes: 0
              registration_end_minutes: 59
              allow_log_hours_after_end_event: true
              event_image_url: https://cdn.example.com/events/cover.jpg
              recurrence_instructions:
                recurrence_type_id: 2
                separation_count: 1
                number_of_ocurrence: 4
                recurrence_start_date: '2025-06-15'
                selected_days_of_week:
                - id: 0
                  selected: false
                - id: 6
                  selected: true
                month_selections:
                - instance_of_month: 1
                  day_of_week: 6
              location:
                address1: 123 Main St
                city: Atlanta
                state: GA
                postal_code: '30301'
                country_code: US
              contacts:
              - first_name: Jane
                last_name: Smith
                email: jane.smith@example.com
                phone_number: 404-555-0100
                reason_to_contact: Event Coordinator
              virtual: false
              schedule_change_type: 0
              default_shift_name: Morning Sort
              default_shift_capacity: 25
              default_shift_hours: 3
              default_shift_cra_eligible: false
              event_disclaimer: Participants must sign a waiver before volunteering.
              benefitting_organization: City Food Bank
        description: The request containing event details
      responses:
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: The request was invalid or missing required parameters.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: Authentication credentials were missing or invalid.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have permission to create an event.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Forbidden
                status: 403
                detail: You do not have permission to access this resource.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: The requested resource could not be found.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '200':
          description: Returned when the operation succeeds. The response body contains the event ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateEventResponse'
              example:
                event_id: 7001
      tags:
      - Volunteer
  /v1/volunteer/events/search:
    post:
      operationId: SearchEvents
      summary: Search volunteer events (PREVIEW)
      description: 'This endpoint allows you to search all the volunteer events in the client community. It returns a paginated set of results with all the event details. In the body of the post, you will pass the following:


        The term is the string that the API will use to search for matching event names.


        The page is the page of results you wish to fetch.


        The limit is number of results per page. This can not exceed 25 and will default to 25 if the value you pass is greater.


        start_date defines the start date of the date range you are searching within.


        end_date defines the end date of the date range you are searching within.


        modified_from defines the start date of the updated date range you are searching within.


        modified_to defines the end date of the updated date range you are searching within.


        If include_virtual is true, all Virtual Events (events with no location) will be included. The default value is false.


        To search by location, you can use the optional distance_in_miles, latitude and longitude params.

        By passing a lat and long, your result set will contain events within a 50 mile radius of the location.

        If you wish to change the search radius, use the distance_in_miles param to define a different search radius.


        If hide_full is true, all events with a set capacity and no open shifts will be excluded.


        Note: In the return, event_type identifies the type of event.

        If the value is 1, the event was created by someone at the company.

        If the value is 2 the event was created externally by a non-profit.

        Also, this is not related to EventTypes (plural) which includes a set of meta data tag "Types" that are used for reporting and search filtering.

        These are defined by the event creator while creating the event.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventsSearchRequest'
            example:
              term: food bank
              page: 1
              limit: 10
              start_date: '2025-01-01'
              end_date: '2025-12-31'
              include_virtual: true
              hide_full: false
              tags:
              - volunteer
              - community
              types:
              - npo
              categories:
              - hunger
        description: The request body containing the search criteria for volunteer events.
      responses:
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: The request was invalid or missing required parameters.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: Authentication credentials were missing or invalid.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have permission to view events.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Forbidden
                status: 403
                detail: You do not have permission to access this resource.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '404':
          description: Returned when the specified event is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: The requested resource could not be found.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '200':
          description: Returned when the operation succeeds. The response body contains a colection of events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSearchResponse'
              example:
                page: 1
                limit: 10
                total_count: 1
                page_count: 1
                events:
                - name: City Food Bank Volunteering
                  description: Help sort and pack food donations at the city food bank.
                  event_id: 7001
                  type: 2
                  virtual_event: false
                  location:
                    combined_address: ''
                    address1: 123 Main St
                    address2: ''
                    address3: ''
                    city: Atlanta
                    state: GA
                    zip: '30301'
                    country: ''
                    country_code: US
                    county: ''
                    census_msa_code: ''
                    census_tract_code: ''
                    census_county_code: ''
                    census_state_code: ''
                  spots_left: 12
                  total_unique_participants: 38
                  waitlist_enabled: false
                  full: false
                  unlimited: false
                  has_recurrences: false
                  event_begin: '2025-06-15T09:00:00Z'
                  event_end: '2025-06-15T12:00:00Z'
                  date_modified: '2025-05-01T12:00:00Z'
                  benefitting_organization: City Food Bank
                  types:
                  - npo
                  tags:
                  - hunger
                  - community
                  categories:
                  - hunger
      tags:
      - Volunteer
  /v1/volunteer/events/{event_type}/{event_id}:
    get:
      operationId: GetVolunteerEventDetailsById
      summary: Get event details (PREVIEW)
      description: 'Returns information about a specific event. See above for information of how to obtain eventId.


        If private is True, the creator chose to not expose the event in search and only employees with a link to the event would be able to sign up.


        The charity_external_key is the official registration ID for the charity. For example, EIN#.


        The affiliate_organization_id will only contain a value if the event is tied to a custom organization created by a client admin.

        The majority of events will contain charity_id which is the unique identifier of an official charity in CSRconnect.


        The event_occurence_summary contains all the occurrences of this event. For a recurring event, each occurrence will be detailed here.

        This is also where you will find the shift and time information.


        Setting include_participations to true (attach ''?include_participations=true'' to the end of the url), will add the event''s participation data to the return object.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: event_type
        in: path
        required: true
        schema:
          type: string
          enum:
          - Employee
          - Npo
          - Project
          - EmployeeIndividualActivity
          - VolunteerMatch
        description: 'The type of the event. Available values: 1: Employee, 2: NPO, 3: Project, 4: Employee Individual Activity, 5: Volunteer Match'
      - name: event_id
        in: path
        required: true
        schema:
          type: integer
        description: The event ID
      - name: include_participations
        in: query
        required: false
        schema:
          type: boolean
          default: 'false'
        description: Indicates whether to include participation data in the response.
      responses:
        '400':
          description: Bad Request
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: The request was invalid or missing required parameters.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '401':
