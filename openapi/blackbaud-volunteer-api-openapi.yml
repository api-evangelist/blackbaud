  /v1/jobs/{job_id}/customfields:
    get:
      operationId: GetJobCustomFieldsByJobId
      summary: List job custom fields (PREVIEW)
      description: 'Returns the custom fields for the specified job.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier of the job
      - name: category
        in: query
        required: false
        schema:
          type: string
        description: The custom field category ID or name to filter by.
      - name: sort_column
        in: query
        required: false
        schema:
          type: string
          enum:
          - Sequence
          - Category
        description: Column to sort by. Defaults to Sequence.
      - name: sort_descending
        in: query
        required: false
        schema:
          type: boolean
        description: Whether to sort descending. Defaults to false.
      - name: start_date
        in: query
        required: false
        schema:
          type: string
        description: The inclusive lower date bound.
      - name: end_date
        in: query
        required: false
        schema:
          type: string
        description: The inclusive upper date bound.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: '50'
        description: The number of records to return. Defaults to 50 and cannot exceed 500.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: '0'
        description: The number of records to skip before returning results. Defaults to 0.
      responses:
        '200':
          description: Returned when the operation succeeds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobCustomFieldCollection'
              example:
                count: 3
                value:
                - id: '1'
                  category: Skills Required
                  comment: Verified through interview process
                  date: '2024-01-15T12:00:00Z'
                  short_description: COMM
                  parent_id: '123'
                  type: TableEntry
                  value: Communication
                - id: '2'
                  category: Equipment Needed
                  comment: Ensure proper fit on first day
                  parent_id: '123'
                  type: Boolean
                  value: true
                - id: '3'
                  category: Site Contact
                  comment: Meet at the main entrance
                  date: '2024-02-01T12:00:00Z'
                  constituent_name: Robert Hernandez
                  parent_id: '123'
                  type: Constituent
                  value: '280'
        '401':
          description: Returned when the caller is not authenticated.
        '403':
          description: Returned when the caller does not have permission to perform this operation.
