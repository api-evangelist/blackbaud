          description: Returned when the specified resource is not found.
  /appeals/search:
    get:
      operationId: SearchMarketingAppeals
      summary: Search for marketing appeals
      description: Search screen for finding appeal records.
      parameters:
      - name: name
        in: query
        required: false
        schema:
          type: string
        description: name
      - name: business_unit
        in: query
        required: false
        schema:
          type: string
        description: business unit This code table can be queried at https://api.sky.blackbaud.com/crm-adnmg/codetables/BUSINESSUNITCODE/entries
      - name: appeal_category
        in: query
        required: false
        schema:
          type: string
        description: category This code table can be queried at https://api.sky.blackbaud.com/crm-adnmg/codetables/APPEALCATEGORYCODE/entries
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
        description: indicates whether or not to include inactive appeals in the search
      - name: report_code
        in: query
        required: false
        schema:
          type: string
        description: report code This code table can be queried at https://api.sky.blackbaud.com/crm-adnmg/codetables/APPEALREPORT1CODE/entries
      - name: site_id
        in: query
        required: false
        schema:
          type: string
        description: site
      - name: exact_match_only
        in: query
        required: false
        schema:
          type: boolean
        description: exact match only
      - name: event_id
        in: query
        required: false
        schema:
          type: string
        description: event
      - name: description
        in: query
        required: false
        schema:
          type: string
        description: description
      - name: category_name
        in: query
        required: false
        schema:
          type: string
        description: category name
      - name: base_currency_id
        in: query
        required: false
        schema:
          type: string
        description: base currency id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Limits the number of records to return.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of result entities.
          content:
            application/json:
