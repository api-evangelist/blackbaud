components:
  schemas:
    ReturnListView:
      required:
      - bill_to_address
      - lookup_id
      - return_sub_total
      - reversed_invoice_id
      - reversed_invoice_lookup_id
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          description: The ID.
        client_id:
          type:
          - string
          - 'null'
          description: The ID of the client.
        client_name:
          type:
          - string
          - 'null'
          description: The client name.
        lookup_id:
          minLength: 1
          type: string
          description: The ID of the return lookup.
        reversed_invoice_id:
          minLength: 1
          type: string
          description: The ID of the reversed invoice.
        reversed_invoice_lookup_id:
          minLength: 1
          type: string
          description: The ID of the reversed invoice lookup.
        return_date:
          type: string
          description: The return date.
          format: date-time
        return_amount:
          type: number
          description: The return amount.
          format: decimal
        return_balance:
          type: number
          description: The return balance.
          format: decimal
        return_sub_total:
          type: number
          description: The return subtotal.
          format: decimal
        purchase_order_number:
          type:
          - string
          - 'null'
          description: The client purchase order number or purchase order number.
        returned_by:
          type:
          - string
          - 'null'
          description: The returned by name.
        returned_date:
          type: string
          description: The return date.
          format: date-time
        notes:
          type:
          - string
          - 'null'
          description: The item note.
        print_status:
          $ref: '#/components/schemas/PrintStatus'
        return_status:
          $ref: '#/components/schemas/ReturnStatus'
        statement_comment:
          type:
          - string
          - 'null'
          description: The print on statement.
        return_comment:
          type:
          - string
          - 'null'
          description: The print on return.
        bill_to_address:
          $ref: '#/components/schemas/AddressView'
        added_by:
          type:
          - string
          - 'null'
          description: The user name who created the record.
        date_added:
          type: string
          description: The record create date.
          format: date-time
        last_changed_by:
          type:
          - string
          - 'null'
          description: The user name who last changed the record.
        last_changed_date:
          type: string
          description: The record last changed date.
          format: date-time
      additionalProperties: false
      description: Used to represent core return information
    ReceivablesCodeTableEntry:
      required:
      - id
      - value
      type: object
      properties:
        id:
          type: string
          description: The ID of the code table entry.
        value:
          minLength: 1
          type: string
          description: The value of the code table entry.
      additionalProperties: false
      description: The request containing info for a code table entry.
    ReturnLineItemListViewList:
      required:
      - return_line_items
      type: object
      properties:
        return_line_items:
          type: array
          items:
            $ref: '#/components/schemas/ReturnLineItemListView'
          description: The list of return line items.
      additionalProperties: false
      description: Return line item list
    Contact:
      required:
      - contact_id
      - contact_type
      type: object
      properties:
        contact_id:
          minLength: 1
          type: string
          description: The ID of the contact.
        name:
          type:
          - string
          - 'null'
          description: The contact name.
        contact_type:
          $ref: '#/components/schemas/ContactType'
        third_party_billing:
          type: boolean
          description: Whether the client is used for third-party billing.
        client_status:
          type:
          - string
          - 'null'
          description: The client status.
      additionalProperties: false
      description: The contact.
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
          description: A URI reference [RFC3986] that identifies the problem type. This specification encourages that, when dereferenced, it provide human-readable documentation for the problem type (e.g., using HTML [W3C.REC-html5-20141028]). When this member is not present, its value is assumed to be "about:blank".
        title:
          type:
          - string
          - 'null'
          description: A short, human-readable summary of the problem type. It SHOULD NOT change from occurrence to occurrence of the problem, except for purposes of localization (e.g., using proactive content negotiation; see [RFC7231], Section 3.4).
        status:
          type:
          - integer
          - 'null'
          description: The HTTP status code ([RFC7231], Section 6) generated by the origin server for this occurrence of the problem.
          format: int32
        detail:
          type:
          - string
          - 'null'
          description: A human-readable explanation specific to this occurrence of the problem.
        instance:
          type:
          - string
          - 'null'
          description: A URI reference that identifies the specific occurrence of the problem. It may or may not yield further information if dereferenced.
        trace_id:
          type: string
          description: A request ID that can be provided to Blackbaud Support that may help with further troubleshooting.
        span_id:
          type: string
          description: A request ID that can be provided to Blackbaud Support that may help with further troubleshooting.
      additionalProperties: {}
      description: A machine-readable format for specifying errors in HTTP API responses based on https://tools.ietf.org/html/rfc7807.
    AddressView:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          description: Address ID
          readOnly: true
        description:
          type:
          - string
          - 'null'
          description: Description
          readOnly: true
        street_address:
          type:
          - string
          - 'null'
          description: Street Address
          readOnly: true
        country:
          type:
          - string
          - 'null'
          description: Country
          readOnly: true
        post_code:
          type:
          - string
          - 'null'
          description: PostCode
          readOnly: true
        state:
          type:
          - string
          - 'null'
          description: State
          readOnly: true
        city:
          type:
          - string
          - 'null'
          description: City
          readOnly: true
      additionalProperties: false
      description: Address View
    ReturnLineItemListView:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          description: The ID.
        lookup_id:
          type:
          - string
          - 'null'
          description: The lookup ID or transaction ID.
        client:
          $ref: '#/components/schemas/Contact'
        return_id:
          type:
          - string
          - 'null'
          description: The optional link to a parent return.
        return_lookup_id:
          type:
          - string
          - 'null'
          description: The parent return lookup ID.
        balance:
          type: number
          description: The balance.
          format: decimal
        line_item_amount:
          type: number
          description: The line item amount.
          format: decimal
        line_item_date:
          type: string
          description: The original transaction date for the line item.
          format: date-time
        post_date:
          type:
          - string
          - 'null'
          description: The line item post date.
          format: date-time
        post_status:
          $ref: '#/components/schemas/PostStatus'
        print_status:
          $ref: '#/components/schemas/PrintStatus'
        billing_item_id:
          type:
          - string
          - 'null'
          description: The ID of the associated billing item.
        billing_item_name:
          type:
          - string
          - 'null'
          description: The name of the associated billing item.
        description:
          type:
          - string
          - 'null'
          description: 'The description of the associated billing item.

            This defaults from the billing item, but the user can override.'
        flat_rate:
          $ref: '#/components/schemas/FlatRate'
        variable_rate:
          $ref: '#/components/schemas/VariableRate'
        notes:
          type:
          - string
          - 'null'
          description: The optional notes.
        comment:
          type:
          - string
          - 'null'
          description: The line item comment.
        added_by:
          type:
          - string
          - 'null'
          description: The user name who created the record.
        date_added:
          type: string
          description: The record create date.
          format: date-time
        last_changed_by:
          type:
          - string
          - 'null'
          description: The user name who last changed the record.
        last_changed_date:
          type: string
          description: The record last changed date.
          format: date-time
      additionalProperties: false
      description: Used to represent core return line item information
