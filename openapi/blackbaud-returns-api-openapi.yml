openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: Receivables Returns API'
  description: This API manages receivables, including clients, billing items, credits, charges, and invoices.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/receivables
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/receivables
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Returns
paths:
  /v1/returns:
    get:
      operationId: ListReturns
      summary: Get a list of returns by page
      description: This returns a list of returns.
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: '25'
        description: The maximum number of items to return.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: How many items to skip before returning the results.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a list of returns.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnListViewList'
              example:
                returns:
                - id: '1'
                  client_id: '1'
                  client_name: Example Client
                  lookup_id: '1'
                  reversed_invoice_id: '5'
                  reversed_invoice_lookup_id: '6'
                  return_date: '2024-10-29T12:00:00Z'
                  return_amount: 10
                  return_balance: 0
                  return_sub_total: 10
                  purchase_order_number: ''
                  returned_by: ''
                  returned_date: '2024-10-29T12:00:00Z'
                  notes: ''
                  print_status: NotYetPrinted
                  return_status: NotYetReceived
                  statement_comment: ''
                  return_comment: ''
                  bill_to_address:
                    id: '1'
                    description: Example Address
                    street_address: 123 Main St
                    country: USA
                    post_code: '12345'
                    state: SC
                    city: Charleston
                  added_by: '1'
                  date_added: '2024-10-29T12:00:00Z'
                  last_changed_by: '1'
                  last_changed_date: '2024-10-29T12:00:00Z'
                limit: 1
                offset: 0
        '400':
          description: Returned when the request is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponseTypes'
              example:
                type: urn:blackbaud:validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: 'Transaction is missing required custom fields

                  '
                values:
                  errors:
                    property_name: custom_fields
                    error_message: Transaction is missing required custom fields
                    error_code: TransactionHasRequiredCustomFields
                trace_id: e566235f7b89ec65570213e86c42b059
                span_id: fda5afb92a47816e
        '403':
          description: Returned when the user does not have permission to view returns.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ForbiddenProblemDetails'
              example:
                type: urn:blackbaud:forbidden
                title: The requested action is forbidden.
                status: 403
                extensions: {}
      tags:
      - Returns
  /v1/returns/{id}:
    get:
      operationId: GetReturn
      summary: Get a return
      description: This gets a return by ID.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the return.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a return.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnListView'
              example:
                id: '1'
                client_id: '1'
                client_name: Example Client
                lookup_id: '1'
                reversed_invoice_id: '5'
                reversed_invoice_lookup_id: '6'
                return_date: '2024-10-29T12:00:00Z'
                return_amount: 10
                return_balance: 0
                return_sub_total: 10
                purchase_order_number: ''
                returned_by: ''
                returned_date: '2024-10-29T12:00:00Z'
                notes: ''
                print_status: NotYetPrinted
                return_status: NotYetReceived
                statement_comment: ''
                return_comment: ''
                bill_to_address:
                  id: '1'
                  description: Example Address
                  street_address: 123 Main St
                  country: USA
                  post_code: '12345'
                  state: SC
                  city: Charleston
                added_by: '1'
                date_added: '2024-10-29T12:00:00Z'
                last_changed_by: '1'
                last_changed_date: '2024-10-29T12:00:00Z'
        '404':
          description: Returned when the specified return is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: Workflow Correlation Id was required but not supplied.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '400':
          description: Returned when the request is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponseTypes'
              example:
                type: urn:blackbaud:validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: 'Transaction is missing required custom fields

                  '
                values:
                  errors:
                    property_name: custom_fields
                    error_message: Transaction is missing required custom fields
                    error_code: TransactionHasRequiredCustomFields
                trace_id: e566235f7b89ec65570213e86c42b059
                span_id: fda5afb92a47816e
        '403':
          description: Returned when the user does not have permission to view the return.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ForbiddenProblemDetails'
              example:
                type: urn:blackbaud:forbidden
                title: The requested action is forbidden.
                status: 403
                extensions: {}
      tags:
      - Returns
  /v1/returns/{return_id}/lineitems:
    get:
      operationId: GetReturnLineItems
      summary: Get line items from a return
      description: This gets the line items from a return.
      parameters:
      - name: return_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the return.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the return line items associated to a return.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnLineItemListViewList'
              example:
                return_line_items:
                - id: 84873654-2697-4b56-afc8-57dd45674758
                  lookup_id: '120'
                  client:
                    contact_id: '123'
                    contact_type: Person
                    third_party_billing: false
                  return_id: '5'
                  return_lookup_id: '6'
                  balance: 100
                  line_item_amount: 50
                  line_item_date: '2021-01-01T12:00:00Z'
                  post_date: '2024-10-29T12:00:00Z'
                  post_status: Posted
                  print_status: Printed
                  billing_item_id: c98dd541-4866-4806-ad56-66bca2bcc748
                  billing_item_name: Example Billing Item
                  description: Description of the billing item
                  flat_rate:
                    amount: 100
                    allow_changes_to_amount: false
                  variable_rate:
                    unit_of_measure_entry:
                      id: 1c079590-7790-4456-9d0f-5fa50d7aacff
                      value: Each
                    quantity: 1
                    quantity_decimals: 2
                    unit_price: 1.5
                    unit_price_decimals: 2
                    allow_changes_quantity_and_unit_price: false
                    trade_discount_percent: 0
                    trade_discount_amount: 0
                    amount: 1.5
                  notes: Some notes here
                  comment: Line item comment
                  added_by: Supervisor
                  date_added: '2021-01-01T12:00:00Z'
                  last_changed_by: Supervisor
                  last_changed_date: '2021-01-01T12:00:00Z'
        '404':
          description: Returned when the return is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: Workflow Correlation Id was required but not supplied.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '400':
          description: Returned when the request is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponseTypes'
              example:
                type: urn:blackbaud:validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: 'Transaction is missing required custom fields

                  '
                values:
                  errors:
                    property_name: custom_fields
                    error_message: Transaction is missing required custom fields
                    error_code: TransactionHasRequiredCustomFields
                trace_id: e566235f7b89ec65570213e86c42b059
                span_id: fda5afb92a47816e
        '403':
          description: Returned when the user does not have permission to view return line items.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ForbiddenProblemDetails'
              example:
                type: urn:blackbaud:forbidden
                title: The requested action is forbidden.
                status: 403
                extensions: {}
      tags:
      - Returns
  /v1/returns/{return_id}/lineitems/{line_item_id}:
    get:
      operationId: GetReturnLineItem
      summary: Get a return line item
      description: This gets a return line item by ID.
      parameters:
      - name: return_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the return line item.
      - name: line_item_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the return line item.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a return line item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReturnLineItemListView'
              example:
                id: 84873654-2697-4b56-afc8-57dd45674758
                lookup_id: '120'
                client:
                  contact_id: '123'
                  contact_type: Person
                  third_party_billing: false
