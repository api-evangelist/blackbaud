openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: General Ledger Distributionsets API'
  description: This API is used to manage the general ledger, including accounts, projects, and journal entries. This API has a maximum request size limit of 8mb.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/56eb17a0a9db9516c46bff6f
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/generalledger/v1
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Distributionsets
paths:
  /distributionsets/cashmanagement:
    post:
      operationId: CreateCashManagementDistributionSet
      summary: Cash management distribution set (Create)
      description: Returns the identifier of the new created cash management distribution set.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCashManagementDistributionSet'
            example:
              name: Distribution E1
              line_items:
              - percent: 100
                row_number: 1
                account_id: 372
                custom_fields: []
                project_line_items:
                - percent: 70
                  line_number: 1
                  project_id: 7
                  transaction_code_values:
                  - name: Grants
                    value: None
                    id: 0
                  - name: Spendable/Non-Spendable
                    value: Spendable
                    id: 233
                  account_class: Unrestricted Net Assets
                - percent: 30
                  line_number: 2
                  project_id: 3
                  transaction_code_values:
                  - name: Grants
                    value: None
                    id: 0
                  account_class: Unrestricted Net Assets
        description: The cash management distribution set to add.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the identifier for the newly created cash management distribution set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedResult_Int32'
              example:
                record_id: 843
        '400':
          description: Returned when the request is not in the correct format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Invalid Request
                Details:
                - The value 'fake' is not valid for transaction_status.
                ErrorPath: null
        '403':
          description: Returned when the user does not have permission to create cash management distribution sets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Distributionsets
    get:
      operationId: ListCashManagementDistributionSets
      summary: Cash management distribution set (List)
      description: Returns the list of cash management distribution sets.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the list of all available cash management distribution sets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashManagementDistributionSetArray'
              example:
                count: 3
                value:
                - set_id: 6
                  name: Distribution E1
                  line_items:
                  - percent: 100
                    row_number: 1
                    account_id: 372
                    custom_fields: []
                    project_line_items:
                    - percent: 70
                      line_number: 1
                      project_id: 7
                      transaction_code_values:
                      - name: Grants
                        value: None
