openapi: 3.0.1
info:
  title: 'Blackbaud SKY API: Consent'
  description: This API manages consent information.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/cns-cnsnt
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations,
      examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/consent
paths:
  /configuration/channels:
    post:
      operationId: AddChannelCategory
      summary: Add channel category.
      description: Add consent configuration for a channel and category.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentChannelCategoryWrite'
            example:
              channel: Mail
              category: Targeted Ads
              solicit_code_assignments:
              - response: OptIn
                add_remove: Remove
                solicit_code: Do not mail targeted ads
              - response: OptOut
                add_remove: Add
                solicit_code: Do not mail targeted ads
        description: The request representing the channel category mapping to be added.
      responses:
        '200':
          description: Returned when the operation succeeds.
        '400':
          description: Returned when the channel category already exists or the request includes an invalid property.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AddChannelCategory400ResponseTypes'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The date field is required.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '404':
          description: Returned when the specified category or one of the provided solicit codes are not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The date field is required.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
    get:
      operationId: GetConsentChannelConfiguration
      summary: Get consent channel configuration.
      description: Gets the collection of consent channel configuration.
      parameters:
      - name: channels
        in: query
        required: false
        schema:
          type: array
        description: Optional collection of channels with which to filter the results.<br/><br/>Available values:<ul><li>Email</li><li>Mail</li><li>SMS</li><li>Phone</li><li>AutoPhone</li><li>Social</li><li>DataProcessing</li><li>Other</li></ul>
      responses:
        '200':
          description: Returned when the operation succeeds. The response body includes the collection of consent channel
            category configurations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentChannelConfigurationReadCollection'
              example:
                channel_configurations:
                - channel: Email
                  categories:
                  - category: Newsletters
                    inactive: false
                    solicit_code_assignments:
                    - solicit_code: Send newsletters
                      response: OptIn
                      add_remove: Add
                    - solicit_code: Do not send newsletters
                      response: OptIn
                      add_remove: Remove
                    - solicit_code: Send newsletters
                      response: OptOut
                      add_remove: Remove
                    - solicit_code: Do not send newsletters
                      response: OptOut
                      add_remove: Add
                - channel: DataProcessing
                  categories:
                  - category: Profiling
                    inactive: false
                    solicit_code_assignments:
                    - solicit_code: Profiling allowed
                      response: OptIn
                      add_remove: Add
                    - solicit_code: Do not profile
                      response: OptIn
                      add_remove: Remove
                    - solicit_code: Do not profile
                      response: OptOut
                      add_remove: Add
                    - solicit_code: Profiling allowed
                      response: OptOut
                      add_remove: Remove
                count: 2
                offset: 0
                limit: 500
  /configuration/channels/{channel}:
    patch:
      operationId: EditConsentChannel
      summary: Edit consent channel.
      description: Edit a consent channel.
      parameters:
      - name: channel
        in: path
        required: true
        schema:
          type: string
        description: The channel.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentChannelWrite'
            example:
              active: false
        description: The changes to be applied to the consent defaults.
      responses:
        '200':
          description: Returned when the operation succeeds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentDefaults'
              example:
                consent_statement: I agree to receive email.
                privacy_policy: Privacy Policy v1.2.3
        '400':
          description: Returned when attempting to update an invalid or mandatory channel (Email, Mail, Phone).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/EditConsentChannel400ResponseTypes'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The date field is required.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
  /configuration/channels/{channel}/categories/{category}:
    delete:
      operationId: DeleteChannelCategoryConfiguration
      summary: Delete channel category configuration.
      description: Delete a channel category configuration.
      parameters:
      - name: channel
        in: path
        required: true
        schema:
          type: string
        description: The channel.
      - name: category
        in: path
        required: true
        schema:
          type: string
        description: The category.
      responses:
        '200':
          description: Returned when the operation succeeds.
        '404':
          description: Returned when the specified category or channel category configuration is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The date field is required.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have permission to delete the channel category configuration.
  /configuration/channels/{channel}/solicitcodeassignments:
    patch:
      operationId: EditChannelSolicitCodeAssignments
      summary: Edit channel solicit code assignments.
      description: Edit channel solicit code assignments for the given channel and optional category.
      parameters:
      - name: channel
        in: path
        required: true
        schema:
          type: string
          enum:
          - Email
          - Mail
          - SMS
          - Phone
          - AutoPhone
          - Social
          - DataProcessing
          - Other
        description: The channel.<p>Members:</p><ul><li><i>Email</i> - Email</li><li><i>Mail</i> - Mail</li><li><i>SMS</i>
          - SMS</li><li><i>Phone</i> - Phone</li><li><i>AutoPhone</i> - AutoPhone</li><li><i>Social</i> - Social media</li><li><i>DataProcessing</i>
          - Data processing</li><li><i>Other</i> - Other</li></ul>
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditSolicitCodeAssignmentsRequest'
            example:
              category: Targeted Ads
              solicit_code_assignments:
              - response: OptIn
                add_remove: Remove
                solicit_code: Do not mail targeted ads
              - response: OptOut
                add_remove: Add
                solicit_code: Do not mail targeted ads
        description: The update solicit code assignments request.
      responses:
        '200':
          description: Returned when the operation succeeds.
        '400':
          description: Returned when the channel category already exists or the request includes an invalid property.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/UpdateSolicitCodeAssignments400ResponseTypes'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The date field is required.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '404':
          description: Returned when the specified channel category configuration is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The date field is required.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have permission to update the solicit code assignments.
  /configuration/defaults:
    patch:
      operationId: EditConsentDefaults
      summary: Edit consent defaults.
      description: Edit the default consent statement and/or privacy policy.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentDefaults'
            example:
              consent_statement: I agree to receive email.
              privacy_policy: Privacy Policy v1.2.3
        description: The changes to be applied to the consent defaults.
      responses:
        '200':
          description: Returned when the operation succeeds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentDefaults'
              example:
                consent_statement: I agree to receive email.
                privacy_policy: Privacy Policy v1.2.3
    get:
      operationId: GetConsentDefaults
      summary: Get consent defaults.
      description: Gets the default consent statement and privacy policy.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body includes the default consent statement and
            privacy policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentDefaults'
              example:
                consent_statement: I agree to receive email.
                privacy_policy: Privacy Policy v1.2.3
  /constituents/consentlist:
    post:
      operationId: GetConstituentConsentListV2
      summary: Get constituent consent list (V2).
      description: Get a list of constituent consents using POST to work around query string length limitations.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentListOptions'
            example:
              channels:
              - Email
              - SMS
              - Phone
              constituent_ids:
              - '42'
              - '280'
              - '777'
              category_filter_type: NoFilter
              from_date: '2023-01-01T12:00:00Z'
              to_date: '2023-12-31T11:59:59Z'
              limit: 500
              offset: 0
        description: The list options.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the collection of constituent consents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstituentConsentReadCollection'
              example:
                constituent_consents:
                - constituent_id: '42'
                  id: '7'
                  channel: Email
                  date: '2024-06-03T12:00:00Z'
                  response: OptIn
                  source: Website
                  privacy_notice: Privacy Policy v1.2.3
                  consent_statement: I agree to receive email.
                  date_added: '2024-06-03T02:15:00Z'
                - constituent_id: '57'
                  id: '42'
                  channel: Email
                  date: '2024-06-03T12:00:00Z'
                  response: OptOut
                  category: Targeted Ads
                  category_id: '7'
                  source: Website
                  privacy_notice: Privacy Policy v1.2.3
                  consent_statement: I agree to receive targeted ad emails.
                  date_added: '2024-06-03T02:15:00Z'
                - constituent_id: '57'
                  id: '53'
                  channel: Phone
                  date: '2023-09-15T12:00:00Z'
                  response: OptOut
                  source: Website
                  privacy_notice: Privacy Policy v1.2.3
                  consent_statement: I agree to phone calls.
                  date_added: '2023-09-16T10:45:00Z'
                count: 12
                offset: 0
                limit: 500
                continuation_token: eyAibGltaXQiOiAzLCBvZmZzZXQ6IDYgfQ==
        '400':
          description: Returned when the request is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/GetConsentList400ResponseTypes'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: Field is required
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have permission to view the constituents.
  /constituents/consents:
    post:
      operationId: CreateConsentsMultipleConstituents
      summary: Create consents for one or more constituents.
      description: Create one or more consents for one or more constituents.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConstituentConsentsRequest'
            example:
              channel: Email
              category: Targeted Ads
              source: Registration Forms
              privacy_policy: Privacy Policy v1.2.3
              consent_statement: I agree to my data being used for targeted ads.
              constituent_requests:
              - constituent_id: '280'
                consent_date: '2024-06-03T12:00:00Z'
                consent_response: OptIn
              - constituent_id: '185'
                consent_date: '2024-06-12T12:00:00Z'
                consent_response: OptOut
              - constituent_id: '185'
                consent_date: '2024-06-12T12:00:00Z'
                consent_response: OptOut
        description: The create constituent consents request.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body is a collection of the resulting consent identifiers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentifierCollection'
              example:
                identifiers:
                - '42'
                - '44'
                - '45'
                count: 3
                offset: 0
                limit: 500
        '400':
          description: Returned when the request is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CreateConsentsMultipleConstituents400ResponseTypes'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: Field is required
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '404':
          description: Returned when one or more of the specified constituents are not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The date field is required.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have permission to create consents for one or more of the targeted
            constituents.
    get:
      operationId: GetConstituentConsentList
      summary: Get constituent consent list.
      description: Get a list of constituent consents.
      parameters:
      - name: channels
        in: query
        required: false
        schema:
          type: array
        description: Limit results to the given list of channels. All channels are included by default.<br/><br/>Available
          values:<ul><li>Email</li><li>Mail</li><li>SMS</li><li>Phone</li><li>AutoPhone</li><li>Social</li><li>DataProcessing</li><li>Other</li></ul>
      - name: constituent_ids
        in: query
        required: false
        schema:
          type: array
        description: Limit results to the given list of constituent identifiers.
      - name: category_filter_type
        in: query
        required: false
        schema:
          type: string
          enum:
          - NoFilter
          - AnyCategory
          - NoCategory
          - SpecificCategory
        description: Category filter type<p>Members:</p><ul><li><i>NoFilter</i> - Include all consents regardless of assigned
          category.</li><li><i>AnyCategory</i> - Include all consents assigned to any category.</li><li><i>NoCategory</i>
          - Include only consents without an assigned category.</li><li><i>SpecificCategory</i> - Include only consents assigned
          a specific category.</li></ul>
      - name: category
        in: query
        required: false
        schema:
          type: string
        description: The category name or identifier with which to filter by when CategoryFilterType is SpecificCategory.
      - name: response
        in: query
        required: false
        schema:
          type: string
          enum:
          - OptIn
          - OptOut
          - NoResponse
        description: Consent response<p>Members:</p><ul><li><i>OptIn</i> - Opt-in</li><li><i>OptOut</i> - Opt-out</li><li><i>NoResponse</i>
          - No response</li></ul>
      - name: source
        in: query
        required: false
        schema:
          type: string
        description: Source description or identifier
      - name: from_date
        in: query
        required: false
        schema:
          type: string
        description: From date filter
      - name: to_date
        in: query
        required: false
        schema:
          type: string
        description: To date filters
      - name: continuation_token
        in: query
        required: false
        schema:
          type: string
        description: Continuation token for paging
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: '500'
        description: Represents the number of records to return. (The default is 500)
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip.(For use with pagination)
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the collection of constituent consents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstituentConsentReadCollection'
              example:
                constituent_consents:
                - constituent_id: '42'
                  id: '7'
                  channel: Email
                  date: '2024-06-03T12:00:00Z'
                  response: OptIn
                  source: Website
                  privacy_notice: Privacy Policy v1.2.3
                  consent_statement: I agree to receive email.
                  date_added: '2024-06-03T02:15:00Z'
                - constituent_id: '57'
                  id: '42'
                  channel: Email
                  date: '2024-06-03T12:00:00Z'
                  response: OptOut
                  category: Targeted Ads
                  category_id: '7'
                  source: Website
                  privacy_notice: Privacy Policy v1.2.3
                  consent_statement: I agree to receive targeted ad emails.
                  date_added: '2024-06-03T02:15:00Z'
                - constituent_id: '57'
                  id: '53'
                  channel: Phone
                  date: '2023-09-15T12:00:00Z'
                  response: OptOut
                  source: Website
                  privacy_notice: Privacy Policy v1.2.3
                  consent_statement: I agree to phone calls.
                  date_added: '2023-09-16T10:45:00Z'
                count: 12
                offset: 0
                limit: 500
                continuation_token: eyAibGltaXQiOiAzLCBvZmZzZXQ6IDYgfQ==
        '400':
          description: Returned when the request is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/GetConsentList400ResponseTypes'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: Field is required
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have permission to view the constituents.
  /constituents/consents/{consent_id}:
    delete:
      operationId: DeleteConstituentConsent
      summary: Delete constituent consent.
      description: Delete a constituent consent.
      parameters:
      - name: consent_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record identifier for the consent.
      responses:
        '200':
          description: Returned when the operation succeeds.
        '404':
          description: Returned when the specified consent is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The date field is required.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have permission to delete consent.
    patch:
      operationId: EditConstituentConsent
      summary: Edit constituent consent.
      description: Edit a constituent consent.
      parameters:
      - name: consent_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record identifier for the consent.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConsentRequest'
            example:
              consent_statement: I agree to receive emails.
              privacy_notice: Privacy Policy v1.2.3
              source: Website
        description: The changes to be applied to the consent record.
      responses:
        '200':
          description: Returned when the operation succeeds.
        '404':
          description: Returned when the specified consent is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The date field is required.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have permission to update constituent's consent.
  /constituents/{constituent_id}/consents:
    post:
      operationId: CreateConsentsSingleConstituent
      summary: Create consents for a single constituent.
      description: Create one or more consents for a single constituent.
      parameters:
      - name: constituent_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record identifier for the constituent.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Constituents-constituent_id-ConsentsPostRequest-1'
            example:
            - channel: Email
              consent_date: '2024-03-09T12:00:00Z'
              consent_response: OptIn
              source: Website
              privacy_policy: Privacy Policy v1.2.3
              consent_statement: I agree to receive email.
            - channel: Email
              consent_date: '2024-03-09T12:00:00Z'
              consent_response: OptIn
              category: Newsletters
              source: Website
              privacy_policy: Privacy Policy v1.2.3
              consent_statement: I agree to receive email.
            - channel: Phone
              consent_date: '2023-09-15T12:00:00Z'
              consent_response: OptOut
              source: Website
              privacy_policy: Privacy Policy v1.2.3
              consent_statement: I agree to receive phone calls.
        description: The add constituent consents requests.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body is a collection of the resulting consent identifiers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentifierCollection'
              example:
                identifiers:
                - '42'
                - '44'
                - '45'
                count: 3
                offset: 0
                limit: 500
        '400':
          description: Returned when the request is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CreateConsentsSingleConstituent400ResponseTypes'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: Field is required
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '404':
          description: Returned when the specified constituent is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The date field is required.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have permission to create consents for the specified constituent.
    get:
      operationId: GetConstituentConsents
      summary: Get constituent consents.
      description: Get the collection of consents for the specified constituent.
      parameters:
      - name: constituent_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record identifier for the constituent.
      - name: include_history
        in: query
        required: false
        schema:
          type: boolean
        description: Optional flag indicating that consent history should be included
      - name: channels
        in: query
        required: false
        schema:
          type: array
        description: Limit results to the given list of channels. All channels are included by default.<br/><br/>Available
          values:<ul><li>Email</li><li>Mail</li><li>SMS</li><li>Phone</li><li>AutoPhone</li><li>Social</li><li>DataProcessing</li><li>Other</li></ul>
