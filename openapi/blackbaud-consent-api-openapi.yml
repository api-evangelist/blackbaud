        in: query
        required: false
        schema:
          type: string
        description: From date filter
      - name: to_date
        in: query
        required: false
        schema:
          type: string
        description: To date filters
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: '500'
        description: Represents the number of records to return. (The default is 500)
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip.(For use with pagination)
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the collection of constituent consents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentReadsCollection'
              example:
                consents:
                - id: '7'
                  channel: Email
                  date: '2024-06-03T12:00:00Z'
                  response: OptIn
                  source: Website
                  privacy_notice: Privacy Policy v1.2.3
                  consent_statement: I agree to receive email.
                  date_added: '2024-06-03T02:15:00Z'
                - id: '42'
                  channel: Email
                  date: '2024-06-03T12:00:00Z'
                  response: OptOut
                  category: Targeted Ads
                  category_id: '7'
                  source: Website
                  privacy_notice: Privacy Policy v1.2.3
                  consent_statement: I agree to receive targeted ad emails.
                  date_added: '2024-06-03T02:15:00Z'
                - id: '53'
                  channel: Phone
                  date: '2023-09-15T12:00:00Z'
                  response: OptOut
                  source: Website
                  privacy_notice: Privacy Policy v1.2.3
                  consent_statement: I agree to phone calls.
                  date_added: '2023-09-16T10:45:00Z'
                count: 3
                offset: 0
                limit: 500
        '400':
          description: Returned when the request is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/GetConstituentConsents400ResponseTypes'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: Field is required
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '404':
          description: Returned when the specified constituent is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The date field is required.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have permission to view the constituent's consents.
