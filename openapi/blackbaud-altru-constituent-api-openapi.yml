  /constituents/search:
    get:
      operationId: SearchConstituents
      summary: Search for constituents
      description: This provides the ability to search for constituents.
      parameters:
      - name: constituent_quick_find
        in: query
        required: false
        schema:
          type: string
        description: 'represents a filter for searching for the constituent either by name or lookup id. character limit:
          100.'
      - name: full_name
        in: query
        required: false
        schema:
          type: string
        description: represents a filter on the full constituent name.
      - name: key_name
        in: query
        required: false
        schema:
          type: string
        description: 'represents a filter on the last name or organization name. character limit: 50.'
      - name: first_name
        in: query
        required: false
        schema:
          type: string
        description: 'represents a filter on the first name of constituent. character limit: 50.'
      - name: lookup_id
        in: query
        required: false
        schema:
          type: string
        description: 'represents a filter on the lookup id of constituent. character limit: 36.'
      - name: address_block
        in: query
        required: false
        schema:
          type: string
        description: 'represents a filter on the address of constituent. character limit: 100.'
      - name: city
        in: query
        required: false
        schema:
          type: string
        description: 'represents a filter on the city of constituent. character limit: 100.'
      - name: state
        in: query
        required: false
        schema:
          type: string
        description: represents a filter on the state of the constituents' addresses. SimpleDataListID=7fa91401-596c-4f7c-936d-6e41683121d7.
      - name: post_code
        in: query
        required: false
        schema:
          type: string
        description: 'represents a filter on the zip/postal code. character limit: 20.'
      - name: country
        in: query
        required: false
        schema:
          type: string
        description: represents a filter on the country of the constituent. SimpleDataListID=c9649672-353d-42e8-8c25-4d34bbabfbba.
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
        description: set this parameter to true to include constituents.
      - name: include_deceased
        in: query
        required: false
        schema:
          type: boolean
        description: set this parameter to true to include deceased constituents in response.
      - name: only_primary_address
        in: query
        required: false
        schema:
          type: boolean
        description: set this parameter to true to search address fields using only the constituent's primary address.
      - name: exact_match_only
        in: query
        required: false
        schema:
          type: boolean
        description: set this parameter to true to match all criteria exactly.
      - name: check_nickname
        in: query
        required: false
        schema:
          type: boolean
        description: set this parameter to true to check nickname of constituent when searching on first names.
      - name: check_aliases
        in: query
        required: false
        schema:
          type: boolean
        description: set this parameter to true to check aliases.
      - name: classof
        in: query
        required: false
        schema:
          type: integer
        description: represents a filter on the primary class year of the constituent.
      - name: minimum_date
        in: query
        required: false
        schema:
          type: string
        description: represents a filter on the minimum date of merged constituent records to be searched.
      - name: exclude_households
        in: query
        required: false
        schema:
          type: boolean
        description: set this parameter to true to exclude households.
      - name: email_address
        in: query
        required: false
        schema:
          type: string
        description: 'represents a filter on the email address of the constituent. character limit: 100.'
      - name: include_individuals
        in: query
        required: false
        schema:
          type: boolean
        description: set this parameter to true to include individuals.
      - name: include_organizations
        in: query
        required: false
        schema:
          type: boolean
        description: set this parameter to true to include organizations.
      - name: include_groups
        in: query
        required: false
        schema:
          type: boolean
        description: set this parameter to true to include groups or households.
      - name: check_alternate_lookup_ids
        in: query
        required: false
        schema:
          type: boolean
        description: set this parameter to true to check alternate lookup ids of the constituent.
      - name: fuzzy_search_on_name
        in: query
        required: false
        schema:
          type: boolean
        description: set this parameter to true to include fuzzy search on name.
      - name: phone_number
        in: query
