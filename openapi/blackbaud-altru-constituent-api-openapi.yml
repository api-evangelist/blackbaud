          type: string
        description: address
      - name: city
        in: query
        required: false
        schema:
          type: string
        description: city
      - name: state
        in: query
        required: false
        schema:
          type: string
        description: state SimpleDataListID=7fa91401-596c-4f7c-936d-6e41683121d7.
