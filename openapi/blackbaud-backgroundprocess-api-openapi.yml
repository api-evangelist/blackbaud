          type: integer
          description: The background process status.<p>Members:</p><ul><li><i>0</i> - Job created.</li><li><i>1</i> - Job waiting to be scheduled.</li><li><i>2</i> - Job scheduled.</li><li><i>3</i> - Job running.</li><li><i>4</i> - Job finished processing and is completing.</li><li><i>5</i> - Job completed successfully.</li><li><i>6</i> - Job canceled.</li><li><i>7</i> - Job failed.</li></ul>
          format: int32
        status_message:
          type:
          - string
          - 'null'
          description: The background process status message.
        process_id:
          type: integer
          description: The background process identifier.
          format: int32
      additionalProperties: false
      description: The registered background process status.
    BasicErrorMessage:
      type: object
      properties:
        Error:
          type:
          - string
          - 'null'
      additionalProperties: false
    BackgroundProcessResult:
      type: object
      properties:
        record_id:
          type: integer
          description: The record identifier created by the background process.
          format: int32
      additionalProperties: false
      description: Background process result by process id
    BackgroundProcessStatus_2:
      description: The registered background process status.
      type: object
      properties:
        status:
          format: int32
          description: The background process status.<p>Members:</p><ul><li><i>0</i> - Job created.</li><li><i>1</i> - Job waiting to be scheduled.</li><li><i>2</i> - Job scheduled.</li><li><i>3</i> - Job running.</li><li><i>4</i> - Job finished processing and is completing.</li><li><i>5</i> - Job completed successfully.</li><li><i>6</i> - Job canceled.</li><li><i>7</i> - Job failed.</li></ul>
          type: integer
          x-ms-summary: Status
        status_message:
          description: The background process status message.
          type: string
          x-ms-summary: Status message
        process_id:
          format: int32
          description: The background process identifier.
          type: integer
          x-ms-summary: Process id
      x-display-name: Background process status
      x-ms-summary: Background process status
    BasicErrorMessage_2:
