info:
  title: Blackbaud Background Process API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged BackgroundProcess across 2 of this provider''s published API definitions: blackbaud-accounts-payable-api-openapi.yml, blackbaud-general-ledger-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/accountspayable/v1
- url: https://api.sky.blackbaud.com/generalledger/v1
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: BackgroundProcess
paths:
  /backgroundProcess/{process_id}/result:
    get:
      operationId: GetBackgroundProcessResult
      summary: Background process result (Get)
      description: Returns the record ID as result of the registered process. Use this with the "Invoice process (Create)" and "Background process status (Get)" endpoints to enhance invoice processing.
      parameters:
      - name: process_id
        in: path
        required: true
        schema:
          type: integer
        description: Process identifier
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the id of the created record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackgroundProcessResult'
              example:
                record_id: 4975
        '404':
          description: Returned when the specified record could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
        '403':
          description: Returned when the user does not have permission to view the record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - BackgroundProcess
    servers:
    - url: https://api.sky.blackbaud.com/accountspayable/v1
  /backgroundProcess/{process_id}/status:
    get:
      operationId: GetBackgroundProcessStatus
      summary: Background process status (Get)
      description: Returns the background process status of the process identifier. Use this with the "Invoice process (Create)" and "Background process result (Get)" endpoints to enhance invoice processing.
      parameters:
      - name: process_id
        in: path
        required: true
        schema:
          type: integer
        description: Process identifier
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the specified background process status message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackgroundProcessStatus'
              example:
                status: 0
                status_message: Waiting for server to pick up request...
                process_id: 1234
        '404':
          description: Returned when the specified background could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
        '403':
          description: Returned when the user does not have permission to view status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - BackgroundProcess
    servers:
    - url: https://api.sky.blackbaud.com/accountspayable/v1
