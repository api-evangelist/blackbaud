    get:
      operationId: GetJobVolunteersByJobId
      summary: List job assignments (PREVIEW)
      description: 'Returns a filtered, sorted, paged list of volunteers assigned to the specified job. Search text is a case-insensitive contains match on the volunteer''s display name. A start_date filter matches assignments whose start date is on or after it, and an end_date filter matches assignments whose end date is on or before it; assignments missing a filtered date are excluded.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
