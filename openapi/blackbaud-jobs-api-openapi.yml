    ValidationMode:
      title: ValidationMode
      enum:
      - WriteAllValidRecords
      - PreValidateFileRows
      - ValidateOnly
      type: string
      description: "Controls how the import engine validates and writes the records in an import job.<p>Members:</p><ul><li><i>WriteAllValidRecords</i> - Writes every valid record without first checking the validity of the other records on\n            the same file row.</li><li><i>PreValidateFileRows</i> - Runs a validation pass over all the records on a file row before then writing records\n            for file rows where all the records are valid, greatly increasing the likelihood (but\n            not guaranteeing) that all the records on that row will be written.</li><li><i>ValidateOnly</i> - Validates the file without writing any records, producing an exception file with all of the\n            original file's data along with any found exceptions.</li></ul>"
