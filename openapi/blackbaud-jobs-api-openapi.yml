        description: Case-insensitive text contained in the volunteer's display name.
      - name: status
        in: query
        required: false
        schema:
          type: array
        description: Assignment statuses to filter by. Assignments in any supplied status are included. Repeat the parameter to supply multiple values.<br/><br/>Available values:<ul><li>Assigned</li><li>Requested</li></ul>
      - name: department_id
