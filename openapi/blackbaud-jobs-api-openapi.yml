openapi: 3.2.0
info:
  title: Blackbaud Jobs API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Jobs across 5 of this provider''s published API definitions: blackbaud-altru-volunteer-api-openapi.yml, blackbaud-crm-volunteer-api-openapi.yml, blackbaud-import-api-openapi.yml, blackbaud-query-api-openapi.yml, blackbaud-volunteer-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/alt-volmg
- url: https://api.sky.blackbaud.com/crm-volmg
- url: https://api.sky.blackbaud.com/import
- url: https://api.sky.blackbaud.com/query
- url: https://api.sky.blackbaud.com/volunteer
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Jobs
paths:
  /jobs:
    post:
      operationId: CreateJob
      summary: Create a job
      description: Adds a new job.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewJob'
            example:
              id: 97a63f7a-d29a-45b8-a75f-9adebf00f849
              name: Crowd Control
              description: Walkers will need help with directions and we need to ensure we keep them on the walk course.
              volunteer_type: 05e7c5e1-c45f-4fa8-a6d1-5232b5933d61
              site_id: 7a67eb19-fedc-47d9-8ff9-b47d0ee3f5fd
              site_required: false
              base_currency_id: 6abe6c7e-fedc-473d-abe8-505807c94e0e
              estimated_value: 0
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully creates the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Jobs
    get:
      operationId: GetJobs
      summary: Get jobs (PREVIEW)
      description: 'Gets import jobs for the current environment.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - Pending
          - Enqueued
          - Starting
          - Running
          - Completed
          - CompletedWithExceptions
          - Failed
        description: 'Filters jobs by status. When omitted, jobs in the `Pending` status are excluded

          from results; to retrieve `Pending` jobs, set this filter to `Pending` explicitly.'
      - name: continuation_token
        in: query
        required: false
        schema:
          type: string
        description: The continuation token to get the next page of results.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: '100'
        description: The maximum number of records to return.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the collection of jobs for the environment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetJobsResult'
        '400':
          description: Returned when the request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/GetJobs400ResponseTypes'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The date field is required.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have permission to list jobs.
      tags:
      - Jobs
    servers:
    - url: https://api.sky.blackbaud.com/alt-volmg
  /jobs/search:
    get:
      operationId: SearchJobs
      summary: Search for jobs
      description: This search is for finding jobs.
      parameters:
      - name: name
        in: query
        required: false
        schema:
          type: string
        description: job name
      - name: description
        in: query
        required: false
        schema:
          type: string
        description: description
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
        description: include inactive
      - name: location
        in: query
        required: false
        schema:
          type: string
        description: location This code table can be queried at https://api.sky.blackbaud.com/alt-adnmg/codetables/VOLUNTEERLOCATIONCODE/entries
      - name: department
        in: query
        required: false
        schema:
          type: string
        description: department This code table can be queried at https://api.sky.blackbaud.com/alt-adnmg/codetables/DEPARTMENTCODE/entries
      - name: event_id
        in: query
        required: false
        schema:
          type: string
        description: event
      - name: base_currency_id
        in: query
        required: false
        schema:
          type: string
        description: base currency
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Limits the number of records to return.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of result entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobSearchCollection'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to view the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Jobs
    servers:
    - url: https://api.sky.blackbaud.com/alt-volmg
  /jobs/{job_id}:
    delete:
      operationId: DeleteJob
      summary: Delete a job
      description: Delete a job.
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
        description: The job id
      responses:
        '200':
          description: Returned when the operation successfully deletes the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to delete the resource.
      tags:
      - Jobs
    patch:
      operationId: EditJob
      summary: Edit a job
      description: Edits an existing job.
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
        description: The job id.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditJob'
            example:
              name: Test Job
              description: descrption
              volunteer_type: df2595c9-892a-4343-a65d-d6bc7ee0e1b5
              site_id: ''
              site_required: false
              base_currency_id: 6abe6c7e-fedc-473d-abe8-505807c94e0e
              estimated_value: 0
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully edits the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to edit the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Jobs
    get:
      operationId: GetJob
      summary: Get a job
      description: Edits an existing job.
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
        description: The job id.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to get the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Jobs
    servers:
    - url: https://api.sky.blackbaud.com/alt-volmg
  /jobs/{job_id}/list:
    get:
      operationId: ListJobs
      summary: List jobs
      description: This operation returns all occurrences for a job.
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
        description: The job id.
      - name: active_only
        in: query
        required: false
        schema:
          type: boolean
        description: include inactive
      - name: job_occurrence_type
        in: query
        required: false
        schema:
          type: string
          enum:
          - One-time
          - Recurring
          - Ongoing
        description: type
      - name: location
        in: query
        required: false
        schema:
          type: string
        description: location This code table can be queried at https://api.sky.blackbaud.com/alt-adnmg/codetables/VOLUNTEERLOCATIONCODE/entries
      - name: department
        in: query
        required: false
        schema:
          type: string
        description: department This code table can be queried at https://api.sky.blackbaud.com/alt-adnmg/codetables/DEPARTMENTCODE/entries
      - name: currency
        in: query
        required: false
        schema:
          type: string
          enum:
          - Base
          - Organization
        description: currency
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Limits the number of records to return.
      - name: session_key
        in: query
        required: false
        schema:
          type: string
        description: A unique key provided by user for paging results. The same key will be returned in a successful response.
      - name: infinity_session
        in: query
        required: false
        schema:
          type: string
        description: Values for cookies related to the Infinity load balancer session.
      - name: more_rows_range_key
        in: query
        required: false
        schema:
          type: string
        description: Key for accessing cached results on subsequent calls to this data list.
      - name: start_row_index
        in: query
        required: false
        schema:
          type: integer
        description: Number of rows to skip,get result after these rows.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of result entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListCollection'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to view the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Jobs
    servers:
    - url: https://api.sky.blackbaud.com/alt-volmg
  /jobs/start:
    post:
      operationId: StartJob
      summary: Start a job (PREVIEW)
      description: 'Starts a pending import job. Call this after the import file has been uploaded. The uploaded file must not exceed the maximum import file size (50 MB by default). A larger file is rejected with an `import-file-too-large` error whose `values` member carries `max_file_size_bytes` (and `file_size_bytes` when known); the job stays pending, so you can request a new upload request (`GET jobs/{job_id}/uploadrequest`), upload a smaller file, and start the job again.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartJobRequest'
            example:
              job_id: aa52b48c-4784-4a0f-907b-987454826fd6
        description: The job to start.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains status of the job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartJobResponse'
              example:
                status: Enqueued
        '400':
          description: Returned when the request is invalid, including when the uploaded import file is larger than the maximum import file size.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/StartJob400ProblemDetails'
        '403':
          description: Returned when the user does not have permission to start the requested job.
        '404':
          description: Returned when the requested job was not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails_2'
              example:
                type: urn:blackbaud:resource-not-found
                title: The requested resource could not be found.
                status: 404
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
      tags:
      - Jobs
    servers:
    - url: https://api.sky.blackbaud.com/import
  /jobs/{job_id}/exceptionfiledownloadinfo:
    get:
      operationId: GetExceptionFileDownloadInfo
      summary: Get exception file download URI (PREVIEW)
      description: 'Gets the download URI for an import job''s exception file.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the import job.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the exception file download URI.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportFileDownloadInformation'
              example:
                file_download_uri: https://example.com/download/aa52b48c-4784-4a0f-907b-987454826fd6
        '400':
          description: Returned when the request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/GetExceptionFileDownloadInfo400ResponseTypes'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The date field is required.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have permission to access the requested job.
        '404':
          description: Returned when the requested job was not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails_2'
              example:
                type: urn:blackbaud:resource-not-found
                title: The requested resource could not be found.
                status: 404
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
      tags:
      - Jobs
    servers:
    - url: https://api.sky.blackbaud.com/import
  /jobs/{job_id}/uploadrequest:
    get:
      operationId: GetJobUploadRequest
      summary: Get import file upload request (PREVIEW)
      description: 'Gets new upload information — the URL, HTTP method, and headers to send — for a pending import job''s import file. Requesting new upload information invalidates any previously uploaded import file; the import file must be uploaded as described in this response, not with upload information obtained from an earlier request.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the job to get new upload information for.
      responses:
        '200':
          description: 'Returned when the operation succeeds. The response body describes how to upload the import file: the upload URL, HTTP method, and required headers.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportFileUploadRequestInformation'
              example:
                file_upload_request:
                  url: https://example.com/upload/aa52b48c-4784-4a0f-907b-987454826fd6
                  method: PUT
                  headers:
                  - name: x-ms-blob-type
                    value: BlockBlob
        '400':
          description: Returned when the request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/GetJobUploadUri400ResponseTypes'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The date field is required.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have permission to access the requested job.
        '404':
          description: Returned when the requested job was not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails_2'
              example:
                type: urn:blackbaud:resource-not-found
                title: The requested resource could not be found.
                status: 404
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
      tags:
      - Jobs
    servers:
    - url: https://api.sky.blackbaud.com/import
  /jobs/{job_id}/uploaduri:
    get:
      operationId: GetJobUploadUri
      summary: Get import file upload URI (PREVIEW)
      description: 'Deprecated: use GetJobUploadRequest, which also returns the HTTP method and headers required for the upload. Gets a new file upload URI for a pending import job. Requesting a new upload URI invalidates any previously uploaded import file; the import file must be uploaded using the URI from this response, not an upload URI obtained from an earlier request.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the job to get the refreshed upload URI for.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains new import file upload URI.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportFileUploadInformation'
              example:
                file_upload_uri: https://example.com/upload/aa52b48c-4784-4a0f-907b-987454826fd6
        '400':
          description: Returned when the request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/GetJobUploadUri400ResponseTypes'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The date field is required.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have permission to access the requested job.
        '404':
          description: Returned when the requested job was not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails_2'
              example:
                type: urn:blackbaud:resource-not-found
                title: The requested resource could not be found.
                status: 404
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
      tags:
      - Jobs
    servers:
    - url: https://api.sky.blackbaud.com/import
  /jobs/{id}:
    get:
      operationId: getJobsById
      summary: Query execution job status
      description: Gets information about a background query execution job. Jobs and query results will be available for approximately 30 days after creation. For RE requests, the Analysis - Query - Export permission is required to use this endpoint.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The job ID returned with the response from the POST Query execution job request
      - name: product
        in: query
        required: true
        schema:
          type: string
          enum:
          - RE
          - FE
        description: The Blackbaud product for the request<p>Members:</p><ul><li><i>RE</i> - The Raiser's Edge</li><li><i>FE</i> - The Financial Edge</li></ul>
      - name: module
        in: query
        required: true
        schema:
          type: string
          enum:
          - None
          - GeneralLedger
          - AccountsPayable
          - AccountsReceivable
          - FixedAssets
          - CashReceipts
        description: The module for the request (RE requests must use 'None', FE requests require one of the other values)<p>Members:</p><ul><li><i>None</i></li><li><i>GeneralLedger</i></li><li><i>AccountsPayable</i></li><li><i>AccountsReceivable</i></li><li><i>FixedAssets</i></li><li><i>CashReceipts</i></li></ul>
      - name: include_read_url
        in: query
        required: false
        schema:
          type: string
          enum:
          - Never
          - OnceRunning
          - OnceCompleted
        description: Blackbaud.Query.DefinitionService.Models.AsyncSqlProxy.IncludeReadUrl indicates when the SAS URL should be included with the response<p>Members:</p><ul><li><i>Never</i> - Never</li><li><i>OnceRunning</i> - When the job has status Running or Completed</li><li><i>OnceCompleted</i> - When the job has status Completed</li></ul>
      - name: content_disposition
        in: query
        required: false
        schema:
          type: string
          enum:
          - Inline
          - Attachment
        description: Indicates the content_disposition value to use for the returned SAS URL
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryExecutionJob'
              example:
                id: 53CEEC04-3FAA-47D2-B112-D4A997A7F99D
                status: Completed
                sas_uri: https://example.net/jobs/p-envid/063f85e8-1877-4880-a1ea-af576c3f1181/results_1.csv?rscd=Attachment&rsct=text%2Fcsv
                file_name: results_1.csv
        '400':
          description: Returned when the request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/QueryDefinitionServiceErrorCodes'
              example:
                type: urn:blackbaud:missing-product
                title: One or more validation errors occurred.
                status: 400
                detail: Product was not supplied.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have permission to access the job.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails_3'
              example:
                type: urn:blackbaud:forbidden
                title: The requested action is forbidden.
                status: 403
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '404':
          description: Returned when a job with the given identifier does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails_3'
              example:
                type: urn:blackbaud:resource-not-found
                title: The requested resource could not be found.
                status: 404
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
      tags:
      - Jobs
      x-operation-id-source: normalized
      x-operation-id-original: GetJob
    servers:
    - url: https://api.sky.blackbaud.com/query
  /jobs/{id}/cancel:
    post:
      operationId: CancelJob
      summary: Cancel query execution job (PREVIEW)
      description: 'Updates the job status to cancelling.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The job ID returned with the response from the POST Query execution job request
      - name: product
        in: query
        required: true
        schema:
          type: string
          enum:
          - RE
          - FE
        description: The Blackbaud product for the request<p>Members:</p><ul><li><i>RE</i> - The Raiser's Edge</li><li><i>FE</i> - The Financial Edge</li></ul>
      - name: module
        in: query
        required: true
        schema:
          type: string
          enum:
          - None
          - GeneralLedger
          - AccountsPayable
          - AccountsReceivable
          - FixedAssets
          - CashReceipts
