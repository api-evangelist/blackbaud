      - name: location_id
        in: query
        required: false
        schema:
          type: array
        description: Location code table entry IDs to filter by. Assignments in any supplied location are included. Repeat the parameter to supply multiple values.
      - name: task_id
        in: query
        required: false
        schema:
          type: array
        description: Task code table entry IDs to filter by. Assignments in any supplied task are included. Repeat the parameter to supply multiple values.
      - name: category_id
        in: query
        required: false
        schema:
          type: array
        description: Category code table entry IDs to filter by. Assignments in any supplied category are included. Repeat the parameter to supply multiple values.
      - name: volunteer_type_id
        in: query
        required: false
        schema:
          type: array
        description: Volunteer type code table entry IDs to filter by. Assignments in any supplied volunteer type are included. Repeat the parameter to supply multiple values.
      - name: days_of_week
        in: query
        required: false
        schema:
          type: array
        description: Assignment days to filter by. Assignments on any supplied day are included. Repeat the parameter to supply multiple values.<br/><br/>Available values:<ul><li>Sunday</li><li>Monday</li><li>Tuesday</li><li>Wednesday</li><li>Thursday</li><li>Friday</li><li>Saturday</li><li>AllDays</li><li>Weekdays</li><li>Weekends</li></ul>
      - name: sort_column
        in: query
        required: false
        schema:
          type: string
          enum:
          - VolunteerName
          - StartDate
          - EndDate
          - Task
          - Supervisor
          - Status
          - RequestDate
          - Department
          - Location
          - Position
          - Category
          - VolunteerType
          - StartTime
          - EndTime
          - DayOfWeek
          - LetterSent
          - SentDate
        description: Column to sort by. Defaults to StartDate.
      - name: sort_descending
        in: query
        required: false
        schema:
          type: boolean
        description: Whether to sort descending. Defaults to true.
      - name: start_date
        in: query
        required: false
        schema:
          type: string
        description: The inclusive lower date bound.
      - name: end_date
        in: query
        required: false
        schema:
          type: string
        description: The inclusive upper date bound.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: '50'
        description: The number of records to return. Defaults to 50 and cannot exceed 500.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: '0'
        description: The number of records to skip before returning results. Defaults to 0.
