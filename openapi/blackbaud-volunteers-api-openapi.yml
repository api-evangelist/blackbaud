openapi: 3.2.0
info:
  title: Blackbaud Volunteers API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Volunteers across 3 of this provider''s published API definitions: blackbaud-altru-volunteer-api-openapi.yml, blackbaud-crm-volunteer-api-openapi.yml, blackbaud-volunteer-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/alt-volmg
- url: https://api.sky.blackbaud.com/crm-volmg
- url: https://api.sky.blackbaud.com/volunteer
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Volunteers
paths:
  /volunteers:
    post:
      operationId: CreateVolunteer
      summary: Create a volunteer
      description: Add a volunteer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewVolunteer'
            example:
              constituent_id: F39270BA-90EB-4A0E-B7BD-31998E56E569
              emergency_contact_name: Robert Adamson
              emergency_contact_phone: 205-568-4200
              sponsor_id: ''
              default_country_id: ''
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully creates the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Volunteers
    servers:
    - url: https://api.sky.blackbaud.com/alt-volmg
  /volunteers/search:
    get:
      operationId: SearchVolunteers
      summary: Search for volunteers
      description: This search is for finding constituents who are members of the volunteer.
      parameters:
      - name: constituent_type
        in: query
        required: false
        schema:
          type: integer
        description: constituent type
      - name: key_name
        in: query
        required: false
        schema:
          type: string
        description: last/org name
      - name: first_name
        in: query
        required: false
        schema:
          type: string
        description: first name
      - name: lookup_id
        in: query
        required: false
        schema:
          type: string
        description: lookup id
      - name: address_block
        in: query
        required: false
        schema:
          type: string
        description: address
      - name: city
        in: query
        required: false
        schema:
          type: string
        description: city
      - name: state
        in: query
        required: false
        schema:
          type: string
        description: state SimpleDataListID=7fa91401-596c-4f7c-936d-6e41683121d7.
      - name: post_code
        in: query
        required: false
        schema:
          type: string
        description: zip/postal code
      - name: country
        in: query
        required: false
        schema:
          type: string
        description: country SimpleDataListID=c9649672-353d-42e8-8c25-4d34bbabfbba.
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
        description: include inactive
      - name: include_deceased
        in: query
        required: false
        schema:
          type: boolean
        description: include deceased
      - name: only_primary_address
        in: query
        required: false
        schema:
          type: boolean
        description: only search primary addresses
      - name: exact_match_only
        in: query
        required: false
        schema:
          type: boolean
        description: match all criteria exactly
      - name: only_prospects
        in: query
        required: false
        schema:
          type: boolean
        description: only prospects
      - name: only_fundraisers
        in: query
        required: false
        schema:
          type: boolean
        description: only fundraisers
      - name: only_staff
        in: query
        required: false
        schema:
          type: boolean
        description: only staff
      - name: only_volunteers
        in: query
        required: false
        schema:
          type: boolean
        description: only volunteers
      - name: ssn
        in: query
        required: false
        schema:
          type: string
        description: ssn
      - name: check_nickname
        in: query
        required: false
        schema:
          type: boolean
        description: check nickname
      - name: check_aliases
        in: query
        required: false
        schema:
          type: boolean
        description: check aliases
      - name: full_name
        in: query
        required: false
        schema:
          type: string
        description: full name
      - name: check_merged_constituents
        in: query
        required: false
        schema:
          type: boolean
        description: check merged constituents
      - name: minimum_date
        in: query
        required: false
        schema:
          type: string
        description: Format - date (as full-date in RFC3339). minimum date
      - name: include_individuals
        in: query
        required: false
        schema:
          type: boolean
        description: individuals
      - name: include_organizations
        in: query
        required: false
        schema:
          type: boolean
        description: organizations
      - name: include_groups
        in: query
        required: false
        schema:
          type: boolean
        description: groups/households
      - name: check_alternate_lookup_ids
        in: query
        required: false
        schema:
          type: boolean
        description: check alternate lookup ids
      - name: fuzzy_search_on_name
        in: query
        required: false
        schema:
          type: boolean
        description: include fuzzy search on name
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Limits the number of records to return.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of result entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolunteerSearchCollection'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to view the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Volunteers
    servers:
    - url: https://api.sky.blackbaud.com/alt-volmg
  /volunteers/{volunteer_date_range_id}:
    delete:
      operationId: DeleteVolunteer
      summary: Delete a volunteer
      description: This record operation is used to handle the rules of deleting a volunteer constituency.
      parameters:
      - name: volunteer_date_range_id
        in: path
        required: true
        schema:
          type: string
        description: The volunteer date range id
      responses:
        '200':
          description: Returned when the operation successfully deletes the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to delete the resource.
      tags:
      - Volunteers
    servers:
    - url: https://api.sky.blackbaud.com/alt-volmg
  /volunteers/{volunteer_id}:
    patch:
      operationId: EditVolunteer
      summary: Edit a volunteer
      parameters:
      - name: volunteer_id
        in: path
        required: true
        schema:
          type: string
        description: The volunteer id.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditVolunteer'
            example:
              emergency_contact_name: Robert Adamson
              emergency_contact_phone: 205-568-4100
              sponsor_id: ''
              default_country_id: ''
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully edits the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to edit the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Volunteers
    get:
      operationId: GetVolunteer
      summary: Get a volunteer
      description: Edit a volunteer
      parameters:
      - name: volunteer_id
        in: path
        required: true
        schema:
          type: string
        description: The volunteer id.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Volunteer'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to get the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Volunteers
    servers:
    - url: https://api.sky.blackbaud.com/alt-volmg
  /volunteers/{volunteer_id}/view:
    get:
      operationId: ViewVolunteer
      summary: View a volunteer
      description: Shows general inoperationation about a volunteer.
      parameters:
      - name: volunteer_id
        in: path
        required: true
        schema:
          type: string
        description: The volunteer id.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolunteerView'
      tags:
      - Volunteers
    servers:
    - url: https://api.sky.blackbaud.com/alt-volmg
  /v1/volunteers/interests/{volunteer_interest_id}:
    delete:
      operationId: DeleteVolunteerInterest
      summary: Delete a volunteer interest (PREVIEW)
      description: 'Deletes an existing volunteer interest entry.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: volunteer_interest_id
        in: path
        required: true
        schema:
          type: string
        description: The unique record ID of the volunteer interest. This is the ID returned from GET /constituents/{constituent_id}/interests.
      responses:
        '200':
          description: Returned when the operation succeeds.
        '400':
          description: Returned when the request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/VolunteerInterestDeleteErrorCodes'
              example:
                type: urn:blackbaud:invalid-value
                title: The request is invalid.
                status: 400
                detail: '''abc'' is not a valid record ID.'
        '401':
          description: Returned when the caller is not authenticated.
        '403':
          description: Returned when the caller does not have permission to perform this operation.
      tags:
      - Volunteers
    patch:
      operationId: EditVolunteerInterest
      summary: Update a volunteer interest (PREVIEW)
      description: 'Updates an existing volunteer interest entry.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: volunteer_interest_id
        in: path
        required: true
        schema:
          type: string
        description: The unique record ID of the volunteer interest. This is the ID returned from GET /constituents/{constituent_id}/interests.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VolunteerInterestEdit'
            example:
              interest:
                value: Community Outreach
        description: The volunteer interest information to update
      responses:
        '200':
          description: Returned when the operation succeeds.
        '400':
          description: Returned when the request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/VolunteerInterestEditErrorCodes'
              example:
                type: urn:blackbaud:invalid-value
                title: The request is invalid.
                status: 400
                detail: '''abc'' is not a valid record ID.'
        '401':
          description: Returned when the caller is not authenticated.
        '403':
          description: Returned when the caller does not have permission to perform this operation.
        '404':
          description: Returned when the specified volunteer interest is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails_2'
              example:
                type: urn:blackbaud:resource-not-found
                title: The requested resource could not be found.
                status: 404
                detail: Volunteer interest not found.
      tags:
      - Volunteers
    servers:
    - url: https://api.sky.blackbaud.com/volunteer
  /v1/volunteers/skills/{volunteer_skill_id}:
    delete:
      operationId: DeleteVolunteerSkill
      summary: Delete a volunteer skill (PREVIEW)
      description: 'Deletes an existing volunteer skill/experience entry.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: volunteer_skill_id
        in: path
        required: true
