    - url: https://api.sky.blackbaud.com/volunteer
components:
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          description: A URI reference [RFC3986] that identifies the problem type. This specification encourages that, when dereferenced, it provide human-readable documentation for the problem type (e.g., using HTML [W3C.REC-html5-20141028]). When this member is not present, its value is assumed to be "about:blank".
        title:
          type: string
          description: A short, human-readable summary of the problem type. It SHOULD NOT change from occurrence to occurrence of the problem, except for purposes of localization (e.g., using proactive content negotiation; see [RFC7231], Section 3.4).
        status:
          type: integer
          description: The HTTP status code ([RFC7231], Section 6) generated by the origin server for this occurrence of the problem.
          format: int32
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        instance:
          type: string
          description: A URI reference that identifies the specific occurrence of the problem. It may or may not yield further information if dereferenced.
        trace_id:
          type: string
          description: A request ID that can be provided to Blackbaud Support that may help with further troubleshooting.
        span_id:
          type: string
          description: A request ID that can be provided to Blackbaud Support that may help with further troubleshooting.
      additionalProperties: false
      description: A machine-readable format for specifying errors in HTTP API responses based on https://tools.ietf.org/html/rfc7807.
      x-display-name: Problem details
      x-display-id: ProblemDetails
    NewVolunteer:
      required:
      - constituent_id
      type: object
      properties:
        constituent_id:
          type: string
          description: The record.
        emergency_contact_name:
          maxLength: 100
          minLength: 0
          type: string
          description: The name.
        emergency_contact_phone:
          maxLength: 100
          minLength: 0
          type: string
          description: The phone.
        sponsor_id:
          type: string
          description: The sponsor.
        default_country_id:
          type: string
          description: The default country ID. Read-only in the SOAP API.
      additionalProperties: false
      description: CreateVolunteer
      example:
        constituent_id: F39270BA-90EB-4A0E-B7BD-31998E56E569
        emergency_contact_name: Robert Adamson
        emergency_contact_phone: 205-568-4200
        sponsor_id: ''
        default_country_id: ''
      x-display-name: Volunteer Add Form
      x-display-id: Volunteer Add Form
    VolunteerSearchSummary:
      type: object
      properties:
        id:
          type: string
          description: The ID.
        name:
          type: string
          description: The name.
        address:
          type: string
          description: The address.
        city:
          type: string
          description: The city.
        state:
          type: string
          description: The state.
        post_code:
          type: string
          description: The zip/postal code.
        lookup_id:
          type: string
          description: The lookup ID.
        constituent_type:
          type: string
          description: The constituent type.
        sort_constituent_name:
          type: string
          description: The name.
      additionalProperties: false
      description: SearchVolunteers
      x-display-name: Volunteer Search
      x-display-id: Volunteer Search
    EditVolunteer:
      type: object
      properties:
        emergency_contact_name:
          maxLength: 100
          minLength: 0
          type: string
          description: The name.
        emergency_contact_phone:
          maxLength: 100
          minLength: 0
          type: string
          description: The phone.
        sponsor_id:
          type: string
          description: The sponsor.
        countryid:
          type: string
          description: The country ID. Read-only in the SOAP API.
      additionalProperties: false
      description: EditVolunteer
      example:
        emergency_contact_name: Robert Adamson
        emergency_contact_phone: 205-568-4100
        sponsor_id: ''
        default_country_id: ''
      x-display-name: Volunteer Edit Form
      x-display-id: Volunteer Edit Form
    VolunteerView:
      type: object
      properties:
        sponsor_name:
          maxLength: 400
          minLength: 0
          type: string
          description: The sponsor.
        emergency_contact_name:
          maxLength: 100
          minLength: 0
          type: string
          description: The emergency contact name.
        emergency_contact_phone:
          maxLength: 100
          minLength: 0
          type: string
          description: The emergency contact phone.
      additionalProperties: false
      description: ViewVolunteer
      x-display-name: Volunteer General View Form
      x-display-id: Volunteer General View Form
    VolunteerSearchCollection:
      type: object
      properties:
        count:
          type: integer
          description: The number of items available for retrieval into the collection after applying any request parameters.
          format: int32
        value:
          type: array
          items:
            $ref: '#/components/schemas/VolunteerSearchSummary'
          description: The set of items included in the response. This may be a subset of the items in the collection.
      additionalProperties: false
      description: A collection of items. Data lists can contain paginated results.
    Volunteer:
      type: object
      properties:
        emergency_contact_name:
          maxLength: 100
          minLength: 0
          type: string
          description: The name.
        emergency_contact_phone:
          maxLength: 100
          minLength: 0
          type: string
          description: The phone.
        sponsor_id:
          type: string
          description: The sponsor.
        country_id:
          type: string
          description: The country ID. Read-only in the SOAP API.
      additionalProperties: false
      description: GetVolunteer
      x-display-name: Volunteer Edit Form
      x-display-id: Volunteer Edit Form
    PostResponse:
      type: object
      properties:
        id:
          type: string
          description: The newly created ID.
      additionalProperties: false
      description: Defines the shape of a post response object.
    VolunteerTypeDeleteErrorCodes:
      type: object
      properties:
        type:
          type:
