          type: string
        description: The unique record ID of the volunteer skill. This is the ID returned from GET /constituents/{constituent_id}/skills.
      responses:
        '200':
          description: Returned when the operation succeeds.
        '400':
          description: Returned when the request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/VolunteerSkillDeleteErrorCodes'
              example:
                type: urn:blackbaud:invalid-value
                title: The request is invalid.
