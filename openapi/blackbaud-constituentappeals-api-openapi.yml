info:
  title: Blackbaud Constituentappeals API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Constituentappeals across 2 of this provider''s published API definitions: blackbaud-altru-constituent-api-openapi.yml, blackbaud-crm-constituent-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/alt-conmg
- url: https://api.sky.blackbaud.com/crm-conmg
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Constituentappeals
paths:
  /constituentappeals:
    post:
      operationId: CreateConstituentAppeal
      summary: Create a constituent appeal
      description: Operation for adding a constituent appeal record.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewConstituentAppeal'
            example:
              constituent_id: ''
              appeal_id: ''
              mkt_segmentation: ''
              date_sent: ''
              mkt_package_id: ''
              source_code: ''
              comments: ''
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully creates the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Constituentappeals
    servers:
    - url: https://api.sky.blackbaud.com/alt-conmg
  /constituentappeals/{constituent_appeal_id}:
    delete:
      operationId: DeleteConstituentAppeal
      summary: Delete a constituent appeal
      description: This delete method handles the basic deletion rules for a constituent appeal.
      parameters:
      - name: constituent_appeal_id
        in: path
        required: true
        schema:
          type: string
        description: The constituent appeal id
      responses:
        '200':
          description: Returned when the operation successfully deletes the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to delete the resource.
      tags:
      - Constituentappeals
    patch:
      operationId: EditConstituentAppeal
      summary: Edit a constituent appeal
      description: Operation for editing a constituent appeal record.
      parameters:
      - name: constituent_appeal_id
        in: path
        required: true
        schema:
          type: string
        description: The constituent appeal id.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditConstituentAppeal'
            example:
              appeal_id: b72f21ef-f298-4bed-b389-2b5ed2e57aa5
              mkt_segmentation_id: ''
              date_sent: '2022-12-20T12:00:00Z'
              mkt_package_id: 9ed8235c-084c-4da0-990a-d12b682764f8
              source_code: ''
              comments: added appeal details.
              read_only: false
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully edits the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to edit the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Constituentappeals
    get:
      operationId: GetConstituentAppeal
      summary: Get a constituent appeal
      description: Operation for editing a constituent appeal record.
      parameters:
      - name: constituent_appeal_id
        in: path
        required: true
        schema:
          type: string
        description: The constituent appeal id.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstituentAppeal'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to get the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Constituentappeals
    servers:
    - url: https://api.sky.blackbaud.com/alt-conmg
  /constituentappeals/{constituent_id}/appeals:
    get:
      operationId: ListConstituentAppeals
      summary: List constituent appeals
      description: Returns a list of appeals sent to this constituent.
      parameters:
      - name: constituent_id
        in: path
        required: true
        schema:
          type: string
        description: The constituent id.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Limits the number of records to return.
      - name: session_key
        in: query
        required: false
        schema:
          type: string
        description: A unique key provided by user for paging results. The same key will be returned in a successful response.
      - name: infinity_session
        in: query
        required: false
        schema:
          type: string
        description: Values for cookies related to the Infinity load balancer session.
      - name: more_rows_range_key
        in: query
        required: false
        schema:
          type: string
        description: Key for accessing cached results on subsequent calls to this data list.
      - name: start_row_index
        in: query
        required: false
        schema:
          type: integer
        description: Number of rows to skip,get result after these rows.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of result entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstituentAppealListCollection'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to view the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Constituentappeals
    servers:
    - url: https://api.sky.blackbaud.com/alt-conmg
