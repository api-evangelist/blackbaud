    ClientView:
      required:
      - client_status
      - contact_type
      - display_name
      - id
      - lookup_id
      type: object
      properties:
        id:
          minLength: 1
          type: string
          description: The contact record ID for the client.
        contact_type:
          $ref: '#/components/schemas/ClientType'
        lookup_id:
          minLength: 1
          type: string
          description: The lookup ID of the client.
        client_status:
          $ref: '#/components/schemas/ClientStatus'
        display_name:
          minLength: 1
          type: string
          description: The display name of the client.
        client_type:
          $ref: '#/components/schemas/ReceivablesCodeTableEntry'
        service_provider:
          $ref: '#/components/schemas/ReceivablesCodeTableEntry'
        default_billing_item_header_id:
          type:
          - string
          - 'null'
          description: 'The header ID of the optional billing item for the client.

            If this is set, charges created with this client default to this billing item.'
        default_billing_item_name:
          type:
          - string
          - 'null'
          description: 'The name of the optional billing item for the client.

            If this is set, charges created with this client default to this billing item.'
        default_ar_account:
          type:
          - string
          - 'null'
          description: The default receivable account for the client.
        auto_apply_new_credits:
          type: boolean
          description: Whether to apply new credits automatically.
        auto_apply_new_payments:
          type: boolean
          description: Whether to apply new payments automatically.
        added_by:
          type:
          - string
          - 'null'
          description: The user name who created the record.
        date_added:
          type: string
          description: The record create date.
          format: date-time
        last_changed_by:
          type:
          - string
          - 'null'
          description: The user name who last changed the record.
        last_changed_date:
          type: string
          description: The record last changed date.
          format: date-time
        subject_to_sales_tax:
          type: boolean
          description: Whether the client subject to sales tax.
      additionalProperties: false
      description: The view model for a client.
    ClientStatus:
      title: ClientStatus
      enum:
      - Unknown
      - Active
      - Inactive
      - OnHold
      type: string
      description: The Client status
    ClientType:
      title: ClientType
      enum:
      - Unknown
      - Person
      - Organization
      type: string
      description: The contact type of a client
    ReceivablesCodeTableEntry:
      required:
      - id
      - value
      type: object
      properties:
        id:
          type: string
          description: The ID of the code table entry.
        value:
          minLength: 1
          type: string
          description: The value of the code table entry.
      additionalProperties: false
      description: The request containing info for a code table entry.
    ClientList:
      required:
      - clients
      - limit
      - offset
      type: object
      properties:
        clients:
          type: array
          items:
            $ref: '#/components/schemas/ClientView'
          description: The list of clients.
        limit:
          type: integer
          description: The maximum number of items to return.
          format: int32
        offset:
          type: integer
          description: The number of items skipped before this list was created.
          format: int32
      additionalProperties: false
      description: List of clients
      x-bb-suppressions:
      - list_operation_pagination_style
  securitySchemes:
    Bb-Api-Subscription-Key:
      type: apiKey
      name: Bb-Api-Subscription-Key
      in: header
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://app.blackbaud.com/oauth/authorize
          tokenUrl: https://oauth2.sky.blackbaud.com/token
          scopes: {}
