openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: Receivables Clients API'
  description: This API manages receivables, including clients, billing items, credits, charges, and invoices.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/receivables
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/receivables
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Clients
paths:
  /v1/clients:
    get:
      operationId: ListClients
      summary: Get a list of clients by page
      description: This returns a list of clients.
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: '25'
        description: The maximum number of items to return.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: How many items to skip before returning the results.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a list of clients.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientList'
              example:
                clients:
                - id: 1037d8a2-30c4-47a7-bbcd-ff498a4a3605
                  contact_type: Person
                  lookup_id: '34567'
                  client_status: Active
                  display_name: Amazing Nonprofit
                  client_type:
                    id: 9bb78f27-bdee-40d9-a08c-c262c00de04b
                    value: Grantor
                  service_provider:
                    id: ac6bd08a-84c7-4abd-b540-acaa3ea62305
                    value: Dr. John Smith
                  default_billing_item_header_id: '20'
                  default_billing_item_name: test billing item
                  auto_apply_new_credits: true
                  auto_apply_new_payments: false
                  date_added: '0001-01-01T12:00:00Z'
                  last_changed_date: '0001-01-01T12:00:00Z'
                  subject_to_sales_tax: false
                limit: 30
                offset: 0
        '400':
          description: Returned when the request is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponseTypes'
              example:
                type: urn:blackbaud:validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: 'Transaction is missing required custom fields

                  '
                values:
                  errors:
                    property_name: custom_fields
                    error_message: Transaction is missing required custom fields
                    error_code: TransactionHasRequiredCustomFields
                trace_id: e566235f7b89ec65570213e86c42b059
                span_id: fda5afb92a47816e
        '403':
          description: Returned when the user does not have permission to view clients.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ForbiddenProblemDetails'
              example:
                type: urn:blackbaud:forbidden
                title: The requested action is forbidden.
                status: 403
                extensions: {}
      tags:
      - Clients
  /v1/clients/{id}:
    get:
      operationId: GetClient
      summary: Get a client
      description: This gets a client by ID.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the client.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a client.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientView'
              example:
                id: 1037d8a2-30c4-47a7-bbcd-ff498a4a3605
                contact_type: Person
                lookup_id: '34567'
                client_status: Active
                display_name: Amazing Nonprofit
                client_type:
                  id: 9bb78f27-bdee-40d9-a08c-c262c00de04b
                  value: Grantor
                service_provider:
                  id: ac6bd08a-84c7-4abd-b540-acaa3ea62305
                  value: Dr. John Smith
                default_billing_item_header_id: '20'
                default_billing_item_name: test billing item
                auto_apply_new_credits: true
                auto_apply_new_payments: false
                date_added: '0001-01-01T12:00:00Z'
                last_changed_date: '0001-01-01T12:00:00Z'
                subject_to_sales_tax: false
        '404':
          description: Returned when the specified client is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: Workflow Correlation Id was required but not supplied.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '400':
          description: Returned when the request is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponseTypes'
              example:
                type: urn:blackbaud:validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: 'Transaction is missing required custom fields

                  '
                values:
                  errors:
                    property_name: custom_fields
                    error_message: Transaction is missing required custom fields
                    error_code: TransactionHasRequiredCustomFields
                trace_id: e566235f7b89ec65570213e86c42b059
                span_id: fda5afb92a47816e
        '403':
          description: Returned when the user does not have permission to view the client.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ForbiddenProblemDetails'
              example:
                type: urn:blackbaud:forbidden
                title: The requested action is forbidden.
                status: 403
                extensions: {}
      tags:
      - Clients
