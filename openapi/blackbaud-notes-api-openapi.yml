openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: Constituent Notes API'
  description: This API manages constituent information and related entities such as addresses, phones, emails, and notes.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/56b76470069a0509c8f1c5b3
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/constituent/v1
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Notes
paths:
  /notes:
    post:
      operationId: CreateConstituentNote
      summary: Note (Create)
      description: Creates a constituent note.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteAdd'
            example:
              constituent_id: '280'
              date:
                d: 25
                m: 8
                y: 2015
              summary: Trivia
              text: Dr. Hernandez is an avid Trekkie who frequently quotes Captain Kirk in his lectures.
              type: Personal
        description: An object that represents the note to create.
      responses:
        '200':
          description: Returned when the operation successfully creates a note. The response body contains the ID of the new note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: '1281'
        '400':
          description: Returned when the request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to create the note.
        '404':
          description: Returned when the specified constituent is not found.
      tags:
      - Notes
    get:
      operationId: ListConstituentNotesAllConstituents
      summary: Note list (All constituents)
      description: 'Returns a paginated list of notes, excluding RE NXT Summary notes.


        The default sorting behavior is to list notes in ascending order based on when they were created.


        However, the last_modified parameter overrides the default sorting behavior to list notes in ascending order based on when they were last modified. The last_modified parameter also adds the sort_token parameter to the next_link URL to ensure that notes are stably sorted and that order persists when changes occur while working through a paginated list.


        If the last_modified and date_added parameters are both specified, the sorting behavior is to list notes based on when they were last modified.'
      parameters:
      - name: date_added
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for results created on or after the specified date. Adds the sort_token parameter to the next_link URL to ensure that notes are stably sorted. The filter respects time offsets from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for results modified on or after the specified date. Adds the sort_token parameter to the next_link URL to ensure that notes are stably sorted. The filter respects time offsets from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: sort_token
        in: query
        required: false
        schema:
          type: string
        description: Represents a token filter to provide the next stable-sorted list of notes and to ensure that the order persists even if changes occur while working through a paginated list. The token is provided on the next_link collection response property when the request specifies the sort_token filter. The last_modified, date_added, and sort parameters also add the token to the next_link URL, although the sort parameter only adds the token when it sorts by just the date_added field or just the date_modified field.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to return. The default is 500. The maximum is 5000.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip. For use with pagination.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a> of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Note">note</a> entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfNoteRead'
              example:
                count: 26
                next_link: https://api.sky.blackbaud.com/constituent/v1/notes?limit=20&offset=20
                value:
                - id: '1'
                  constituent_id: '185'
                  date:
                    d: 4
                    m: 1
                    y: 2004
                  date_added: '1999-06-17T19:14:07Z'
                  date_modified: '2004-09-29T19:10:24.42Z'
                  summary: Newspaper Article
                  type: Prospect
