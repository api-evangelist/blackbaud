  /notes/{note_id}:
    delete:
      operationId: DeleteConstituentNote
      summary: Note (Delete)
      description: Deletes a constituent note.
      parameters:
      - name: note_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the constituent note to delete.
      responses:
        '200':
          description: Returned when the operation successfully deletes the note.
        '400':
          description: Returned when the specified note ID in the request URL is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to delete the note.
      tags:
      - Notes
    patch:
      operationId: EditConstituentNote
      summary: Note (Edit)
      description: Edits a constituent note.
      parameters:
      - name: note_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the note to edit.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteEdit'
            example:
              date:
                d: 25
                m: 8
                y: 2015
              summary: Trivia
              text: Dr. Hernandez is an avid Trekkie who frequently quotes Mister Spock in his lectures.
              type: Personal
        description: An object that represent properties of the note to edit.
      responses:
        '200':
          description: Returned when the operation successfully edits the note.
        '400':
          description: Returned when the specified note ID in the request URL or the specified request parameters are not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to edit the note.
        '404':
          description: Returned when the specified note is not found.
      tags:
      - Notes
    get:
      operationId: GetConstituentNote
      summary: Note (Get)
      description: Returns information about a note.
      parameters:
      - name: note_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the note to retrieve information for.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Note">note</a> entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteRead'
              example:
                id: '14'
                constituent_id: '280'
                date:
                  d: 5
                  m: 5
                  y: 2005
                summary: Chair selections for next year
                text: Possible that Dr. Hernandez may step down from the board next year to pursue additional medical research activities.  Schedule lunch date to discuss options.
                type: Director's Notes
        '400':
          description: Returned when the specified note ID in the request URL is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to view the note.
        '404':
          description: Returned when the specified note is not found.
      tags:
      - Notes
components:
  schemas:
    NoteRead:
      description: Notes track helpful or important details about constituents, gifts, or actions, such as specific interests and special instructions for donations. Notes connect you with donors at a more personal level as you cultivate relationships and track lessons learned for more effective fundraising.
      type: object
      properties:
        id:
          description: The immutable system record ID of the note.
          type: string
        constituent_id:
          description: The immutable system record ID of the constituent associated with the note.
          type: string
        date:
          $ref: '#/components/schemas/FuzzyDate'
          description: The note date.
        date_added:
          format: date-time
          description: 'The date when the note was created. Includes an offset from UTC in <a href="https://tools.ietf.org/html/rfc3339">ISO-8601 format: </a><i>1969-11-21T10:29:43-04:00</i>.'
          type: string
          x-supports-datetime-offset: true
        date_modified:
          format: date-time
          description: 'The date when the note was last modified. Includes an offset from UTC in <a href="https://tools.ietf.org/html/rfc3339">ISO-8601 format: </a><i>1969-11-21T10:29:43-04:00</i>.'
          type: string
          x-supports-datetime-offset: true
        summary:
          description: The note summary. Maximum length is 255 characters.
          type: string
        text:
          description: The note's contents.
          type: string
        type:
          description: The note type. Available values are the entries in the <a href="https://developer.sky.blackbaud.com/docs/services/56b76470069a0509c8f1c5b3/operations/ListNoteTypes"><b>Notepad Types</b></a> table.
          type: string
      x-display-name: Note
      x-display-id: Note
    ApiCollectionOfNoteRead:
      description: Fetching data all at once quickly becomes unmanageable. The collection entity helps by returning paginated chunks of large data sets. This entity includes helpful metadata and properties to paginate and iterate through the data.
      type: object
      properties:
        count:
          format: int32
          description: The number of items available for retrieval into the collection after applying any request parameters. The <b>limit</b> and <b>offset</b> parameters do not affect the <b>count</b>, but to facilitate paging, they may affect the number of items in the <b>value</b> result set.
          type: integer
        next_link:
          description: For paginated responses, the URI for the next page of results.
          type: string
        value:
          description: The set of items included in the response. This may be a subset of the items in the collection.
          type: array
          items:
            $ref: '#/components/schemas/NoteRead'
      x-hidden: true
      x-base-type: '#/definitions/ApiCollection'
    NoteEdit:
      description: Notes track helpful or important details about constituents, gifts, or actions, such as specific interests and special instructions for donations. Notes connect you with donors at a more personal level as you cultivate relationships and track lessons learned for more effective fundraising.
      type: object
      properties:
        date:
          $ref: '#/components/schemas/FuzzyDate'
          description: The note date. This property cannot be set to null.
        summary:
          description: 'The note summary. Character limit: 255.'
          maxLength: 255
          minLength: 0
          type: string
        text:
          description: The note's contents.
          type: string
        type:
          description: The note type. Available values are the entries in the <a href="https://developer.sky.blackbaud.com/docs/services/56b76470069a0509c8f1c5b3/operations/ListNoteTypes"><b>Notepad Types</b></a> table. This property cannot be set to null.
          type: string
      x-hidden: true
      x-display-name: Edit note
      x-display-id: EditNote
    PostResponse:
      description: Defines the shape of a post response object.
      type: object
      properties:
        id:
          description: The newly created ID
          type: string
      x-hidden: true
    FuzzyDate:
      description: Fuzzy dates provide a versatile date type to create partial dates such as February 9 (with no year indicated).
      type: object
      properties:
        d:
          format: int32
          description: The day in the fuzzy date.
          type: integer
        m:
          format: int32
          description: The month in the fuzzy date.
          type: integer
        y:
          format: int32
          description: The year in the fuzzy date.
          type: integer
      x-display-name: Fuzzy date
      x-display-id: FuzzyDate
    NoteAdd:
      description: Notes track helpful or important details about constituents, gifts, or actions, such as specific interests and special instructions for donations. Notes connect you with donors at a more personal level as you cultivate relationships and track lessons learned for more effective fundraising.
      required:
      - constituent_id
      - date
      - type
      type: object
      properties:
        constituent_id:
          description: The immutable system record ID of the constituent associated with the note.
          type: string
        date:
          $ref: '#/components/schemas/FuzzyDate'
          description: The note date.
        summary:
          description: 'The note summary. Character limit: 255.'
          maxLength: 255
          minLength: 0
          type: string
        text:
          description: The note's contents.
          type: string
        type:
          description: The note type. Available values are the entries in the <a href="https://developer.sky.blackbaud.com/docs/services/56b76470069a0509c8f1c5b3/operations/ListNoteTypes"><b>Notepad Types</b></a> table.
          type: string
        author:
          description: 'The note author. If not supplied, will have a default set based on the user''s account. Character limit: 50.'
          maxLength: 50
          minLength: 0
          type: string
      x-hidden: true
      x-display-name: Create note
      x-display-id: CreateNote
  securitySchemes:
    Bb-Api-Subscription-Key:
      type: apiKey
      name: Bb-Api-Subscription-Key
      in: header
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://app.blackbaud.com/oauth/authorize
          tokenUrl: https://oauth2.sky.blackbaud.com/token
          scopes: {}
