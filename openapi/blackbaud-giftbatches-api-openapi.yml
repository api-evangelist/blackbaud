openapi: 3.2.0
info:
  title: Blackbaud Giftbatches API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Giftbatches across 2 of this provider''s published API definitions: blackbaud-gift-api-openapi.yml, blackbaud-gift-batch-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/gift/v1
- url: https://api.sky.blackbaud.com/gift-batch
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Giftbatches
paths:
  /giftbatches/{batch_id}/gifts:
    post:
      operationId: AddGiftsToBatch
      summary: Gift (Batch)
      description: Adds one or more gifts to a specified gift batch in the web view.
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the batch to which the gifts will be added.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GiftsAdd'
            example:
              gifts:
              - amount:
                  value: 100
                constituent_id: '280'
                date: '2017-10-03T00:00:00Z'
                fundraisers:
                - amount:
                    value: 100
                  constituent_id: '252'
                gift_splits:
                - amount:
                    value: 100
                  appeal_id: '15'
                  campaign_id: '1'
                  fund_id: '41'
                gift_status: Active
                is_anonymous: false
                lookup_id: '2225'
                payments:
                - payment_method: Cash
                post_date: '2017-10-03T00:00:00Z'
                post_status: NotPosted
                reference: newly added gift
                soft_credits:
                - amount:
                    value: 100
                  constituent_id: '187'
                subtype: Annuity
                type: Donation
              - amount:
                  value: 100
                constituent_id: '290'
                date: '2017-10-03T00:00:00Z'
                fundraisers:
                - amount:
                    value: 100
                  constituent_id: '252'
                gift_splits:
                - amount:
                    value: 100
                  appeal_id: '15'
                  campaign_id: '1'
                  fund_id: '41'
                gift_status: Active
                is_anonymous: false
                lookup_id: '2225'
                origin: '{"name": "Gift origin name"}'
                payments:
                - payment_method: Cash
                post_date: '2017-10-03T00:00:00Z'
                post_status: NotPosted
                reference: newly added gift
                soft_credits:
                - amount:
                    value: 100
                  constituent_id: '187'
                subtype: Annuity
                type: Donation
                tributes:
                - id: '12'
                - id: '15'
                  tribute_acknowledgees:
                  - id: '33'
                  - id: '21'
        description: A collection of objects representing the gifts to add to the given batch.
      responses:
        '200':
          description: Returned when the operation successfully adds the gifts to the batch. The response body contains a list of IDs and any exceptions that occurred when adding the gifts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchGiftAddResults'
              example:
                gifts:
                - id: '1140'
                  acknowledgements:
                  - status: Acknowledged
                  amount:
                    value: 250
                  balance:
                    value: 0
                  batch_number: '23'
                  batch_id: '12'
                  constituent_id: '190'
                  date: '2009-03-12T00:00:00Z'
                  date_added: '2002-03-12T14:01:44.227Z'
                  date_modified: '2017-03-15T14:00:12.554Z'
                  fundraisers:
                  - amount:
                      value: 250
                    constituent_id: '236'
                  gift_splits:
                  - id: '1123'
                    amount:
                      value: 250
                    appeal_id: '26'
                    campaign_id: '4'
                    fund_id: '25'
                  gift_status: Active
                  is_anonymous: false
                  constituency: Board Member
                  lookup_id: '800'
                  payments:
                  - payment_method: CreditCard
                  post_date: '2009-03-12T00:00:00Z'
                  post_status: NotPosted
                  receipts:
                  - amount:
                      value: 30
                    date: '2009-07-13T00:00:00Z'
                    status: Receipted
                  subtype: Membership
                  type: PledgePayment
                  tributes:
                  - id: '12'
                  - id: '15'
                    tribute_acknowledgees:
                    - id: '33'
                    - id: '21'
                  linked_gifts:
                  - '882'
                  errors:
                  - batch_id: '55'
                    lookup_id: '1000093'
                    exception_error_message: An error
                  - batch_id: '55'
                    lookup_id: '1000094'
                    exception_error_message: Another error
                errors:
                - batch_id: '55'
                  lookup_id: '1000093'
                  exception_error_message: An error
                - batch_id: '55'
                  lookup_id: '1000094'
                  exception_error_message: Another error
                - batch_id: '55'
                  lookup_id: '1000095'
                  exception_error_message: Oops another error
        '400':
          description: Returned when the specified request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to add gifts to the batch.
      tags:
      - Giftbatches
    servers:
    - url: https://api.sky.blackbaud.com/gift/v1
  /v1/giftbatches:
    post:
      operationId: CreateGiftBatch
      summary: Create gift batch
      description: Creates a gift batch.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBatch'
            example:
              batch_description: description
              batch_number: '1'
              expected_batch_total: 22.5
              expected_number: 3
        description: An object that represents the gift batch to create.
      responses:
        '200':
          description: Returned when the operation successfully creates a gift batch. The response body contains the ID of the new batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedBatch'
              example:
                batch_id: '120'
        '403':
          description: Returned when the user does not have permission to create the gift batch.
        '400':
          description: Returned when the specified request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequestResponseProblemDetails'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The date field is required.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
      tags:
      - Giftbatches
    get:
      operationId: ListGiftBatches
      summary: List gift batches
      description: Returns a list of gift batches.
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: '500'
        description: Represents the number of records to return.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip. For use with pagination.
      - name: added_by
        in: query
        required: false
        schema:
          type: string
        description: Represents a filter for gift batches created by the specified user.
      - name: search_text
        in: query
        required: false
        schema:
          type: string
        description: Represents a filter for text included in the batch_description or batch_number fields
      - name: approved
        in: query
        required: false
        schema:
          type: boolean
        description: Represents a filter for the status of the gift batch.
      - name: has_exceptions
        in: query
        required: false
        schema:
          type: boolean
        description: Represents a filter for whether the gift batch contains exceptions.
      - name: batch_number
        in: query
        required: false
        schema:
          type: string
        description: Represents a filter for results that match the specified number.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of gift batches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftBatchCollection'
              example:
                count: 2
                giftbatches:
                - id: '101'
                  actual_amount: 100
                  batch_description: Approved batch text
                  batch_number: GFT-100
                  added_by: Utena Tenjou
                  date_added: '2021-09-01T12:25:00Z'
                  has_exceptions: false
                  approved: true
                  number_of_gifts: 10
                - id: '102'
                  actual_amount: 200
                  batch_description: Approved batch text
                  batch_number: GFT-101
                  added_by: Utena Tenjou
                  date_added: '2021-09-02T12:25:00Z'
                  has_exceptions: false
                  approved: true
                  number_of_gifts: 20
                limit: 0
                offset: 0
        '403':
          description: Returned when the user does not have rights to view the set of gift batches.
      tags:
      - Giftbatches
    servers:
    - url: https://api.sky.blackbaud.com/gift-batch
  /v1/giftbatches/{batch_id}:
    delete:
      operationId: DeleteBatch
      summary: Delete gift batch
      description: Deletes a gift batch.
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the gift batch to delete.
      responses:
        '200':
          description: Returned when the operation successfully deletes the gift batch.
        '400':
          description: Returned when the batch is approved or if the batch contains gifts with processed credit card or direct debit payments.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequestResponseProblemDetails'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The date field is required.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have the right to delete a gift batch.
      tags:
      - Giftbatches
    servers:
    - url: https://api.sky.blackbaud.com/gift-batch
components:
  schemas:
    RecurringGiftScheduleRead:
      description: Defines a recurring gift schedule to view.
      required:
      - frequency
      - start_date
      type: object
      properties:
        end_date:
          format: date-time
          description: 'Date the recurring gift should end. Uses <a href="https://tools.ietf.org/html/rfc3339">ISO-8601 format: </a><i>1969-11-21T10:29:43</i>.'
          type: string
          x-supports-datetime-offset: false
        frequency:
          description: Installment frequency of the recurring gift to view. Available values are WEEKLY, EVERY_TWO_WEEKS, EVERY_FOUR_WEEKS, MONTHLY, QUARTERLY, ANNUALLY.
          type: string
        start_date:
          format: date-time
          description: 'Date the recurring gift should start. Uses <a href="https://tools.ietf.org/html/rfc3339">ISO-8601 format: </a><i>1969-11-21T10:29:43</i>.'
          type: string
          x-supports-datetime-offset: false
        next_transaction_date:
          format: date-time
          description: The date of the next scheduled transaction. Only applies to Recurring Gifts and Pledges.
          type: string
          x-supports-datetime-offset: false
      x-hidden: true
      x-display-name: Recurring gift schedule
      x-display-id: RecurringGiftSchedule
    GiftBatchGiftAdd:
      description: Gifts are the primary goal of fundraising efforts. They come in many forms and have a lot of information associated with them to ensure that they are properly allocated and acknowledged.
      required:
      - amount
      - constituent_id
      - gift_splits
      - type
      - payments
      type: object
      properties:
        tributes:
          description: A collection representing existing tribute records to add with the gift.
          type: array
          items:
            $ref: '#/components/schemas/TributeAdd'
        acknowledgements:
          description: 'The acknowledgement associated with the gift. Array length must be less than or equal to 1.

            If none are provided, an empty acknowledgement with a status of <i>NEEDSACKNOWLEDGEMENT</i> will be created alongside the gift.'
          type: array
          items:
            $ref: '#/components/schemas/AcknowledgementAdd'
        amount:
          $ref: '#/components/schemas/Currency'
          description: The monetary amount of the gift.
        batch_number:
          description: 'Gets or sets the batch number. Character limit: 50 (including the batch prefix).'
          maxLength: 50
          minLength: 0
          type: string
        batch_prefix:
          description: Gets or sets the batch prefix. This must include at least one letter. It is required when BatchNumber has a value and defaults to "API" if no value is provided.
          type: string
        constituency:
          description: The constituency value of the gift. If no value is provided, the default constituency of the donor will be used.
          type: string
        constituent_id:
          description: The immutable system record ID of the constituent associated with the gift.
          type: string
        date:
          format: date-time
          description: 'The gift date. Includes an offset from UTC in <a href="https://tools.ietf.org/html/rfc3339">ISO-8601 format: </a><i>1969-11-21T10:29:43</i>.'
          type: string
          x-supports-datetime-offset: false
        default_fundraiser_credits:
          description: 'Indicates whether to use default fundraiser credits.

            If no value is provided, defaults will not be used.'
          type: boolean
        default_soft_credits:
          description: 'Indicates whether to use default soft credits.

            If no value is provided, defaults will not be used.'
          type: boolean
        fundraisers:
          description: The set of fundraisers who receive credit for the gift.
          type: array
          items:
            $ref: '#/components/schemas/GiftFundraiserAdd'
        gift_code:
          description: The gift code. Available values are the entries in the Gift Code table.
          type: string
        gift_splits:
          description: The set of gift splits associated with the gift.
          type: array
          items:
            $ref: '#/components/schemas/GiftSplitAdd'
        gift_status:
          description: The status of the gift. Available values are <i>Active</i>, <i>Held</i>, <i>Terminated</i>, <i>Completed</i>, and <i>Cancelled.</i>
          type: string
        type:
          description: The gift type. Available values are <i>Donation</i>, <i>Other</i>, <i>GiftInKind</i>, <i>RecurringGift</i>, and <i>RecurringGiftPayment</i>.
          type: string
        is_anonymous:
          description: 'Indicates whether the gift is anonymous.

            If no value is provided, the default anonymity of the donor will be used.'
          type: boolean
        linked_gifts:
          description: "The recurring gift associated with the payment being added. \nWhen adding a recurring gift payment, a <code>linked_gifts</code> field must be included as an array of strings with the ID of the recurring gift to which the payment is linked. Array length must be less than or equal to 1."
          type: array
          items:
            type: string
        lookup_id:
          description: 'The user-defined identifier for the gift. Character limit: 50. Lookup IDs for gifts created from an approved batch are automatically generated based on configuration settings in the database view.'
          maxLength: 50
          minLength: 0
          type: string
        origin:
          description: 'The origin of the gift.

            When provided, it must parse to a valid JSON object with one string field called "name". Additional fields may be added as desired.'
          type: string
        payments:
          description: The payment on the gift. Array length must be less than or equal to 1.
          type: array
          items:
            $ref: '#/components/schemas/PaymentAdd'
        post_date:
          format: date-time
          description: 'The date that the gift was posted to general ledger. Includes an offset from UTC in <a href="https://tools.ietf.org/html/rfc3339">ISO-8601 format: </a><i>1969-11-21T10:29:43</i>.'
          type: string
          x-supports-datetime-offset: false
        post_status:
          description: 'The general ledger post status of the gift. Available values are <i>Posted</i>, <i>NotPosted</i>, and <i>DoNotPost.</i>

            When <code>post_status</code> is set to <i>DoNotPost</i>, <code>post_date</code> should be null.

            When it is set to <i>NotPosted</i>, <code>post_date</code> is required but remains editable.

            When it is set to <i>Posted</i>, <code>post_date</code> is required and is no longer editable.

            If no value is provided, a default value of <i>NotPosted</i> will be used.'
          type: string
        receipts:
          description: 'The receipt associated with the gift. Array length must be less than or equal to 1.

            If none are provided, an empty receipt with a status of <i>NEEDSRECEIPT</i> will be added alongside the gift.'
          type: array
          items:
            $ref: '#/components/schemas/ReceiptAdd'
        recurring_gift_schedule:
          $ref: '#/components/schemas/RecurringGiftScheduleAdd'
          description: The recurring gift schedule. When adding a recurring gift, a schedule is required.
        reference:
          description: 'Notes to track special details about a gift such as the motivation behind it or a detailed description of a gift-in-kind. Character limit: 255.'
          maxLength: 255
          minLength: 0
          type: string
        soft_credits:
          description: The set of soft credits associated with the gift.
          type: array
          items:
            $ref: '#/components/schemas/SoftCreditAdd'
        subtype:
          description: The subtype of the gift. Available values are the entries in the <a href="https://developer.sky.blackbaud.com/docs/services/58bdd5edd7dcde06046081d6/operations/ListGiftSubtypes"><b>Gift Subtypes</b></a> table.
          type: string
        custom_fields:
          description: The set of custom fields associated with the gift.
          type: array
          items:
            $ref: '#/components/schemas/CustomFieldAdd'
      x-hidden: true
      x-display-name: Create gift batch gift
      x-display-id: CreateGiftBatchGift
      x-additional-info: "<a name=\"GiftTypes\"></a>\n<p>&nbsp;</p>\n<p>\n    Available values for the <b>type</b> of a <b>gift</b>:\n</p>\n\n<div class=\"table-responsive\">\n    <table class=\"table table-striped table-hover\">\n        <thead>\n            <tr>\n                <th class=\"col-xs-3\"><strong>Type</strong></th>\n                <th class=\"col-xs-9\"><strong>Description</strong></th>\n            </tr>\n        </thead>\n        <tbody>\n            <tr>\n                <td>Amendment</td>\n                <td>An amendment.</td>\n            </tr>\n            <tr>\n                <td>Donation</td>\n                <td>A donation.</td>\n            </tr>\n            <tr>\n                <td>GiftInKind</td>\n                <td>A gift-in-kind.</td>\n            </tr>\n            <tr>\n                <td>GeneralLedgerReversal</td>\n                <td>A general ledger reversal.</td>\n            </tr>\n            <tr>\n                <td>MatchingGiftPledge</td>\n                <td>A matching gift pledge.</td>\n            </tr>\n            <tr>\n                <td>MatchingGiftPayment</td>\n                <td>A matching gift payment.</td>\n            </tr>\n            <tr>\n                <td>MatchingGiftWriteOff</td>\n                <td>A matching gift write-off.</td>\n            </tr>\n            <tr>\n                <td>PlannedGift</td>\n                <td>A planned gift.</td>\n            </tr>\n            <tr>\n                <td>Pledge</td>\n                <td>A pledge.</td>\n            </tr>\n            <tr>\n                <td>PledgePayment</td>\n                <td>A pledge payment.</td>\n            </tr>\n            <tr>\n                <td>PledgeWriteOff</td>\n                <td>A pledge write off.</td>\n            </tr>\n            <tr>\n                <td>RecurringGift</td>\n                <td>A recurring gift.</td>\n            </tr>\n            <tr>\n                <td>RecurringGiftPayment</td>\n                <td>A recurring gift payment.</td>\n            </tr>\n            <tr>\n                <td>Stock</td>\n                <td>A stock.</td>\n            </tr>\n            <tr>\n                <td>SoldStock</td>\n                <td>A sold stock.</td>\n            </tr>\n            <tr>\n                <td>Other</td>\n                <td>Another type of gift.</td>\n            </tr>\n        </tbody>\n    </table>\n</div>"
    CustomFieldAdd:
      description: While records provide many fields to track information, organizations often require additional details. To track this specialized information, use custom fields.
      required:
      - category
      type: object
      properties:
        category:
          description: The custom field category. Available values are the entries in the <b>Custom Field Categories</b> table of the parent object.
          type: string
        comment:
          description: 'The comment on the custom field. Character limit: 50.'
          maxLength: 50
          minLength: 0
          type: string
        date:
          format: date-time
          description: The date on the custom field. Uses <a href="https://tools.ietf.org/html/rfc3339">ISO-8601 format:</a><i>1969-11-21T10:29:43</i>.
          type: string
          x-supports-datetime-offset: false
        parent_id:
          description: The parent object's immutable system record ID.
          type: string
        value:
          description: The value of the custom field. The <code>type</code> property determines the format. Character limit depends on data type. Number types only support values greater than 0.
          type: object
      x-hidden: true
      x-display-name: Create custom field
      x-display-id: CreateCustomField
      x-additional-info: "<a name=\"CustomFieldTypes\"></a>\n<p>&nbsp;</p>\n<p>\n    Available values for the <b>type</b> of a <b>custom field</b>:\n</p>\n\n<div class=\"table-responsive\">\n    <table class=\"table table-striped table-hover\">\n        <thead>\n            <tr>\n                <th class=\"col-xs-3\"><strong>Type</strong></th>\n                <th class=\"col-xs-9\"><strong>Description</strong></th>\n            </tr>\n        </thead>\n        <tbody>\n            <tr>\n                <td>Boolean</td>\n                <td>Defines the custom field as a boolean value.</td>\n            </tr>\n            <tr>\n                <td>CodeTableEntry</td>\n                <td>Defines the custom field as a string value that represents a code table entry description.</td>\n            </tr>\n            <tr>\n                <td>ConstituentId</td>\n                <td>Defines the custom field as a constituent identifier value.</td>\n            </tr>\n            <tr>\n                <td>Currency</td>\n                <td>Defines the custom field as a decimal value.</td>\n            </tr>\n            <tr>\n                <td>Date</td>\n                <td>\n                    Defines the custom field as a date value in <a href=\"https://tools.ietf.org/html/rfc3339\">ISO-8601 format:</a> <i>1969-11-21T10:29:43</i>.\n                </td>\n            </tr>\n            <tr>\n                <td>FuzzyDate</td>\n                <td>\n                    Defines the custom field as a fuzzy date value.\n                </td>\n            </tr>\n            <tr>\n                <td>Number</td>\n                <td>Defines the custom field as an integer value.</td>\n            </tr>\n            <tr>\n                <td>Text</td>\n                <td>Defines the custom field as a string value. Character limit: 255.</td>\n            </tr>\n        </tbody>\n    </table>\n</div>"
    ReceiptRead:
      description: To help donors track their giving for tax purposes, your organization should provide gift receipts.
      type: object
      properties:
        amount:
          $ref: '#/components/schemas/Currency'
          description: The amount of the receipt.
        date:
          format: date-time
          description: 'The date on the receipt. Uses <a href="https://tools.ietf.org/html/rfc3339">ISO-8601 format: </a><i>1969-11-21T10:29:43</i>.'
          type: string
          x-supports-datetime-offset: false
        number:
          format: int32
          description: The number of the receipt.
          type: integer
        status:
          description: 'The status of the receipt. Available values are: RECEIPTED, NEEDSRECEIPT, and DONOTRECEIPT.'
          type: string
      x-display-name: Receipt
      x-display-id: Receipt
    SoftCreditRead:
      description: Soft credits allow you to recognize and track the indirect contributions of constituents such as spouses who influence the gifts of other constituents.
      type: object
      properties:
        id:
          description: The immutable system record ID of the soft credit.
          type: string
        amount:
          $ref: '#/components/schemas/Currency'
          description: The amount of the soft credit.
        constituent_id:
          description: The immutable system record ID of the constituent associated with the soft credit.
          type: string
        gift_id:
          description: The immutable system record ID of the gift associated with the soft credit.
          type: string
      x-display-name: Soft credit
      x-display-id: SoftCredit
    GiftSplitAdd:
      description: Not all gifts serve a single purpose. Gift splits track donor wishes and allow you to divide gifts among multiple campaigns, funds, and appeals.
      required:
      - amount
      - fund_id
      type: object
      properties:
        amount:
          $ref: '#/components/schemas/Currency'
          description: The amount of the gift split.
        appeal_id:
          description: The immutable system record ID of the appeal associated with the gift split.
          type: string
        campaign_id:
          description: The immutable system record ID of the campaign associated with the gift split.
          type: string
        fund_id:
          description: The immutable system record ID of the fund associated with the gift split.
          type: string
        package_id:
          description: The immutable system record ID of the package associated with the gift split.
          type: string
      x-hidden: true
      x-display-name: Create gift split
      x-display-id: CreateGiftSplit
    PaymentRead:
      description: Donors can use a variety of methods — such as Cash, Personal check, Credit card, and Direct debit — to pay for gifts.
      type: object
      properties:
        account_token:
          description: The tokenized account information (e.g. credit card) from the external payment provider. Only applies to payment methods of <i>CreditCard</i> and <i>DirectDebit</i>.
          type: string
        bbps_configuration_id:
