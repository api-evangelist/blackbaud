  /v1/events/{event_id}/participants:
    post:
      operationId: CreateParticipant
      summary: Create a participant
      description: 'Creates a new participant for an event.


        Note: Host participants and standalone participants have the Host registrant type. To create a participant with the Guest registrant type, include a host_id.


        To create a Host participant, pass a constituent_id (must be a constituent record) and do not pass a host_id.


        To create a Guest participant that will be linked to an existing record, pass a constituent_id (constituent or non-constituent record) and pass the participant ID of the Host as the host_id.


        To create a Guest participant that will create a new non-constituent record, do not pass a constituent_id (a new unnamed guest will be created as a non-constituent) and pass the participant ID of the Host as the host_id.'
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the event.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateParticipant'
            example:
              constituent_id: '34'
              host_id: '181'
              rsvp_status: Attending
              attended: false
              invitation_status: Invited
              rsvp_date:
                d: 1
                m: 1
                y: 2020
              invitation_date:
                d: 1
                m: 1
                y: 2020
              participation_level:
                id: '1493'
                name: Coordinator
                is_inactive: false
              summary_note: Major donor who invites a lot of people.
        description: An object that represents the participant to create.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the ID of the new participant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
              example:
                id: '4343'
        '400':
          description: Returned when the specified request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Events-event_id-ParticipantsPost400ApplicationJsonResponse'
