  /v1/events/customfields/{custom_field_id}:
    delete:
      operationId: DeleteEventCustomField
      summary: Delete event custom field (PREVIEW)
      description: 'Delete event custom field.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: custom_field_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the event custom field.
      responses:
        '200':
          description: Returned when the operation succeeds.
        '400':
