openapi: 3.2.0
info:
  title: Blackbaud Events API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Events across 4 of this provider''s published API definitions: blackbaud-altru-event-api-openapi.yml, blackbaud-crm-event-api-openapi.yml, blackbaud-event-api-openapi.yml, blackbaud-school-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/alt-evtmg
- url: https://api.sky.blackbaud.com/crm-evtmg
- url: https://api.sky.blackbaud.com/event
- url: https://api.sky.blackbaud.com/school
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Events
paths:
  /events:
    post:
      operationId: CreateEvent
      summary: Create an event
      description: Operation for adding an event record.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewEvent'
            example:
              name: Alumni Dinner
              description: Fall alumni dinner
              start_date: '2019-04-18T12:00:00Z'
              start_time:
                hour: 3
                minute: 30
              end_date: ''
              end_time:
                hour: 5
                minute: 30
              capacity: 100
              main_event_id: ''
              event_location_id: ''
              event_location_contact_id: ''
              copy_from_event_id: ''
              copy_tasks: false
              copy_invitations: false
              copy_invitees: false
              copy_designations: false
              copy_expenses: false
              copy_prices: false
              copy_attributes: false
              attribute_defined: false
              sites:
              - id: a62483d4-cb71-46ae-9f06-da0644d0629f
                site_id: bc624727-32bd-47d7-ab30-81ed12dc3d6c
              site_required: false
              copy_preferences: false
              event_category: ''
              appeal_id: ''
              add_quick_compare: false
              event_location_room: ''
              copy_job_occurrences: false
              auction: false
              hide_from_calendar: false
              designations_on_fees: false
              copy_public_description: false
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully creates the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Events
    servers:
    - url: https://api.sky.blackbaud.com/alt-evtmg
  /events/search:
    get:
      operationId: SearchEvents
      summary: Search for events
      description: Search screen for event records.
      parameters:
      - name: name
        in: query
        required: false
        schema:
          type: string
        description: filter on the fundraising purpose name field.
      - name: location
        in: query
        required: false
        schema:
          type: string
        description: filter on the event location name.
      - name: main_event_id
        in: query
        required: false
        schema:
          type: string
        description: main event id
      - name: apply_appuser_filter
        in: query
        required: false
        schema:
          type: boolean
        description: hidden applyappuserfilter
      - name: must_have_seat_layout
        in: query
        required: false
        schema:
          type: boolean
        description: hidden musthaveseatlayout
      - name: exclude_event_id
        in: query
        required: false
        schema:
          type: string
        description: exclude event id
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
        description: include inactive
      - name: main_event
        in: query
        required: false
        schema:
          type: boolean
        description: only include main events
      - name: siteid
        in: query
        required: false
        schema:
          type: string
        description: site
      - name: exact_match_only
        in: query
        required: false
        schema:
          type: boolean
        description: exact match only
      - name: room
        in: query
        required: false
        schema:
          type: string
        description: filter on the event location room/unit.
      - name: lookup_id
        in: query
        required: false
        schema:
          type: string
        description: lookup id
      - name: single_events_only
        in: query
        required: false
        schema:
          type: boolean
        description: only include single events
      - name: base_currency_id
        in: query
        required: false
        schema:
          type: string
        description: base currency
      - name: cms_id
        in: query
        required: false
        schema:
          type: string
        description: cms id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Limits the number of records to return.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of result entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventSearchCollection'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to view the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Events
    servers:
    - url: https://api.sky.blackbaud.com/alt-evtmg
  /events/{event_id}:
    delete:
      operationId: DeleteEvent
      summary: Delete an event
      description: Removes an event from the system.
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
        description: The event id
      responses:
        '200':
          description: Returned when the operation successfully deletes the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to delete the resource.
      tags:
      - Events
    patch:
      operationId: EditEvent
      summary: Edit an event
      description: Operation for editing an event record.
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
        description: The event id.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditEvent'
            example:
              name: ''
              description: ''
              start_date: ''
              start_time: ''
              end_date: ''
              end_time: ''
              capacity: 0
              main_event_id: ''
              event_location_id: ''
              event_location_contact_id: ''
              sites:
              - id: ''
                site_id: ''
              site_required: false
              event_category: ''
              quick_compare_event_id: ''
              event_location_room: ''
              auction: false
              event_auction_has_items: false
              designations_on_fees: false
              event_has_registrants: false
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully edits the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to edit the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Events
    get:
      operationId: GetEvent
      summary: Get an event
      description: Operation for editing an event record.
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
        description: The event id.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to get the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Events
    servers:
    - url: https://api.sky.blackbaud.com/alt-evtmg
  /events/{event_id}/appeals:
    get:
      operationId: ListEventAppeals
      summary: List event appeals
      description: Displays the appeals for the given event.
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
        description: The event id.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Limits the number of records to return.
      - name: session_key
        in: query
        required: false
        schema:
          type: string
        description: A unique key provided by user for paging results. The same key will be returned in a successful response.
      - name: infinity_session
        in: query
        required: false
        schema:
          type: string
        description: Values for cookies related to the Infinity load balancer session.
      - name: more_rows_range_key
        in: query
        required: false
        schema:
          type: string
        description: Key for accessing cached results on subsequent calls to this data list.
      - name: start_row_index
        in: query
        required: false
        schema:
          type: integer
        description: Number of rows to skip,get result after these rows.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of result entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAppealListCollection'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to view the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Events
    servers:
    - url: https://api.sky.blackbaud.com/alt-evtmg
  /events/{event_id}/registrants:
    get:
      operationId: ListEventRegistrants
      summary: List event registrants
      description: Displays the registrants for the given event.
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
        description: The event id.
      - name: registration_type
        in: query
        required: false
        schema:
          type: string
          enum:
          - Preregistration
          - Invitation
          - Walk-in
        description: type
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - Will not attend
          - Registered
          - Canceled
          - No reply
          - Declined
        description: status
      - name: attended
        in: query
        required: false
        schema:
          type: string
          enum:
          - (Unspecified)
          - 'Yes'
          - No-show
          - 'No'
        description: attended
      - name: constituent_name
        in: query
        required: false
        schema:
          type: string
        description: registrant
      - name: include_subevents
        in: query
        required: false
        schema:
          type: boolean
        description: include sub-events
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Limits the number of records to return.
      - name: session_key
        in: query
        required: false
        schema:
          type: string
        description: A unique key provided by user for paging results. The same key will be returned in a successful response.
      - name: infinity_session
        in: query
        required: false
        schema:
          type: string
        description: Values for cookies related to the Infinity load balancer session.
      - name: more_rows_range_key
        in: query
        required: false
        schema:
          type: string
        description: Key for accessing cached results on subsequent calls to this data list.
      - name: start_row_index
        in: query
        required: false
        schema:
          type: integer
        description: Number of rows to skip,get result after these rows.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of result entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRegistrantListCollection'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to view the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Events
    servers:
    - url: https://api.sky.blackbaud.com/alt-evtmg
  /events/{event_id}/view:
    get:
      operationId: ViewEvent
      summary: View an event
      description: Displays summary inoperationation for an event.
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
        description: The event id.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventView'
      tags:
      - Events
    servers:
    - url: https://api.sky.blackbaud.com/alt-evtmg
  /v1/events:
    post:
      operationId: postV1Events
      summary: Create an event
      description: Creates a new event.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEvent'
            example:
              name: Walk-A-Thon
              start_date: '2008-06-26'
              category:
                id: '1893'
                name: Annual Fundraiser
              group:
                id: '1505'
                name: Walk-A-Thon for Relief
              lookup_id: WALK
              description: This is a 5 kilometer walk that begins and ends at the International Conference Center.  There will be a closing ceremony concert performed by The Jazz Sons.  Proceeds from this year's walk-a-thon are designated for Disaster Relief.
              start_time: '2026-09-15'
              end_date: '2008-06-26'
              end_time: '2026-09-15'
              inactive: false
              capacity: 500
              goal: 25000
              campaign_id: '3'
              fund_id: '6'
              appeal_id: '7'
              package_id: '8'
        description: An object that represents the event to create.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the ID of the new event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
              example:
                id: '4343'
        '400':
          description: Returned when the specified request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1EventsPost400ApplicationJsonResponse'
              example:
              - message: The request body is not in the appropriate format.
                error_name: BadRequest
                error_code: 400
                raw_message: The request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to create the event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1EventsPost403ApplicationJsonResponse'
              example:
              - message: The user does not have the necessary permissions for this task.
                error_name: Forbidden
                error_code: 403
                raw_message: The user does not have the necessary permissions for this task.
      tags:
      - Events
      x-operation-id-source: normalized
      x-operation-id-original: CreateEvent
    servers:
    - url: https://api.sky.blackbaud.com/event
  /v1/events/copyparticipantoptions:
    post:
      operationId: CopyEventParticipantOptions
      summary: Copy event participant options (PREVIEW)
      description: 'Copy event participant options from a source event onto a target event.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CopyEventParticipantOptionsRequest'
            example:
              source_event_id: '12'
              target_event_id: '34'
        description: An object that represents the event participant options to copy.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the IDs of the new event participant options.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopyEventParticipantOptionsResponse'
              example:
                event_participant_option_ids:
                - 61e62767-49ff-4a00-a60b-d001fd50b1f6
                - 94d034b4-adfd-4d90-b086-80779e2fce3c
                - 22d8a8ac-2bfa-4a4c-9768-528aa95cf8e1
                - eed33e26-8cc2-46e8-b892-a068eb92a769
        '400':
          description: Returned when the event participant option request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1EventsCopyparticipantoptionsPost400ApplicationJsonResponse'
              example:
              - message: The request body is not in the appropriate format.
                error_name: BadRequest
                error_code: 400
                raw_message: The request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have rights to modify the event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1EventsCopyparticipantoptionsPost403ApplicationJsonResponse'
              example:
              - message: The user does not have the necessary permissions for this task.
                error_name: Forbidden
                error_code: 403
                raw_message: The user does not have the necessary permissions for this task.
        '404':
          description: Returned when one of the events does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1EventsCopyparticipantoptionsPost404ApplicationJsonResponse'
              example:
              - message: The requested resource could not be found.
                error_name: ResourceNotFound
                error_code: 404
                raw_message: The requested resource could not be found.
      tags:
      - Events
    servers:
    - url: https://api.sky.blackbaud.com/event
