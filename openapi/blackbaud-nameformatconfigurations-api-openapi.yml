components:
  schemas:
    NameFormatFormulaFieldRead:
      description: 'A single field within a name format configuration''s formula. The order of the fields within the

        formula is significant.'
      type: object
      properties:
        field_id:
          description: The identifier of the name field that this formula field substitutes.
          type: string
        field_name:
          description: 'The name of the field, such as "[Spouse First Name]". For a field whose type is "Custom", this

            is the literal text that the organization typed into the formula, such as a connector like "and".'
          type: string
        field_type:
          description: The type of the field.
          enum:
          - Custom
          - Bio
          - Spouse
          - ConstitAddrsSal
          - ConstituencyAbbrev
          - Constituency
          - MembershipCat
          - ClassOf
          - SpouseClassOf
          - OrganizationName
          - ConstituentId
          - Contact
          - Deceased
          - ProspectClassification
          - ProspectStatus
          type: string
        sequence:
          format: int32
          description: The sequence of the field within the name format configuration.
          type: integer
        is_initial:
          description: Whether to render the field as an initial rather than in full.
          type: boolean
        is_after_comma:
          description: Whether to precede the field with a comma and a space.
          type: boolean
        is_before_line_break_when_space_is_limited:
          description: Whether to insert a line break after the field when the available space is limited.
          type: boolean
        is_before_line_break:
          description: Whether to always insert a line break after the field.
          type: boolean
        is_concatenated_with_next_name_field:
          description: Whether to omit the separating space between the field and the field that follows it.
          type: boolean
        is_required_for_preceding_custom_field:
          description: 'Whether the field is required for the custom field that precedes it. When the field is empty, it

            is omitted along with that preceding custom field, so that a conditional portion of the name and

            the connector that introduces it are dropped together.'
          type: boolean
      x-display-name: Name format formula field
      x-display-id: NameFormatFormulaField
    ApiCollectionOfNameFormatConfigurationRead:
      description: Fetching data all at once quickly becomes unmanageable. The collection entity helps by returning paginated chunks of large data sets. This entity includes helpful metadata and properties to paginate and iterate through the data.
      type: object
      properties:
        count:
          format: int32
          description: The number of items available for retrieval into the collection after applying any request parameters. The <b>limit</b> and <b>offset</b> parameters do not affect the <b>count</b>, but to facilitate paging, they may affect the number of items in the <b>value</b> result set.
          type: integer
        next_link:
          description: For paginated responses, the URI for the next page of results.
          type: string
        value:
          description: The set of items included in the response. This may be a subset of the items in the collection.
          type: array
          items:
            $ref: '#/components/schemas/NameFormatConfigurationRead'
      x-hidden: true
      x-base-type: '#/definitions/ApiCollection'
    NameFormatConfigurationRead:
      description: Name format configurations provide a preset layout to display a constituent's name.
      type: object
      properties:
        id:
          description: The name format configuration identifier.
          type: string
        format:
          description: The name format.
          type: string
        formatted_name:
          description: The preview of the format applied to the given constituent's name.
          type: string
        formula:
          description: 'The ordered list of fields that make up the name format. Unlike format, which is the

            formula rendered as an example, this describes how each field is rendered. Only included when

            the include_formula parameter is set to true.'
          type: array
          items:
            $ref: '#/components/schemas/NameFormatFormulaFieldRead'
      x-display-name: Name format configuration
      x-display-id: NameFormatConfiguration
  securitySchemes:
