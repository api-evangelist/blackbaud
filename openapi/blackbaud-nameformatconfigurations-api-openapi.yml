  OAuth2: []
tags:
- name: Nameformatconfigurations
paths:
  /nameformatconfigurations:
    get:
      operationId: ListNameFormatConfigurations
      summary: Name format configuration list
      description: Returns a list of all available name format configurations.
      parameters:
      - name: constituent_id
        in: query
        required: false
        schema:
          type: array
        description: The ID of the constituent to display the name format configurations in.
      - name: include_formula
        in: query
        required: false
        schema:
          type: boolean
        description: 'Whether to include the formula for each name format configuration. The formula is substantially

          larger than the rest of the entity, so it is omitted unless it is requested.'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to return. The default is 500. The maximum is 5000.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip. For use with pagination.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a> of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#NameFormatConfiguration">name format configuration</a> entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfNameFormatConfigurationRead'
              example:
                count: 45
                value:
                - id: '47'
                  format: '[Title 1] and [Spouse Title 1] [First Name] [Middle Name Initial] [Last Name] [Suffix 1]'
                  formatted_name: Dr. and Mrs. Robert C. Hernandez
                - id: '46'
                  format: '[Title 1] and [Spouse Title 1] [First Name] [Middle Name Initial] [Last Name]'
                  formatted_name: Dr. and Mrs. Robert C. Hernandez
                - id: '1'
