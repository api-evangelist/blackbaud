paths:
  /v1/eventfees/{fee_id}:
    delete:
      operationId: DeleteEventFee
      summary: Delete an event fee
      description: Deletes a fee for an event.
      parameters:
      - name: fee_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the event fee.
      responses:
        '200':
          description: Returned when the operation succeeds.
        '400':
          description: Returned when the specified request parameters are not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Eventfees-fee_id-Delete400ApplicationJsonResponse'
              example:
              - message: The request body is not in the appropriate format.
                error_name: BadRequest
                error_code: 400
                raw_message: The request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have rights to delete the event fee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Eventfees-fee_id-Delete403ApplicationJsonResponse'
              example:
              - message: The user does not have the necessary permissions for this task.
                error_name: Forbidden
                error_code: 403
                raw_message: The user does not have the necessary permissions for this task.
        '404':
          description: Returned when the specified event fee is not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Eventfees-fee_id-Delete404ApplicationJsonResponse'
              example:
              - message: The requested resource could not be found.
                error_name: ResourceNotFound
                error_code: 404
                raw_message: The requested resource could not be found.
      tags:
      - Eventfees
    patch:
      operationId: EditEventFee
      summary: Edit an event fee
      description: Edits an event fee.
      parameters:
      - name: fee_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the event fee.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditEventFee'
            example:
              name: Golf Foursome
              cost: 15.5
              contribution_amount: 10.2
              registrants_included: 4
              limit: 10
        description: An object that represents the changes to the event fee.
      responses:
        '200':
          description: Returned when the operation succeeds.
        '400':
          description: Returned when the specified request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Eventfees-fee_id-Patch400ApplicationJsonResponse'
              example:
              - message: The request body is not in the appropriate format.
                error_name: BadRequest
                error_code: 400
                raw_message: The request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have rights to edit the event fee.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Eventfees-fee_id-Patch403ApplicationJsonResponse'
              example:
              - message: The user does not have the necessary permissions for this task.
                error_name: Forbidden
                error_code: 403
                raw_message: The user does not have the necessary permissions for this task.
        '404':
          description: Returned when the specified event fee is not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Eventfees-fee_id-Patch404ApplicationJsonResponse'
              example:
              - message: The requested resource could not be found.
                error_name: ResourceNotFound
                error_code: 404
                raw_message: The requested resource could not be found.
      tags:
      - Eventfees
