          description: The name of the event fee.
        cost:
          type: number
          description: The amount of money associated with the event fee.
          format: double
        contribution_amount:
          type: number
          description: The amount of the fee that's a donation above the costs of the event.
          format: double
        registrants_included:
          type:
          - integer
          - 'null'
          description: If the fee is for registrations, the number of registrants it includes.
          format: int32
        limit:
          type:
          - integer
          - 'null'
          description: The limit of an event fee. Value must be greater than zero.
          format: int32
      additionalProperties: false
      description: Event fees are how much an organization charges for individuals or organizations to participate in or attend the event. An organization might also charge for other add-on items such as t-shirts or valet parking.
    V1Eventfees-fee_id-Delete400ApplicationJsonResponse:
