  /gifts:
    get:
      operationId: ListGifts
      summary: List gifts
      description: Returns a list of gifts.
      parameters:
      - name: constituent_id
        in: query
        required: false
        schema:
          type: string
        description: represents array of constituent identifiers. returns gifts if any of the specified constituent identifier
          match any of their constituent. for example, "constituentid=afd5d120-2784-4e99-88c0-cc487423d005" returns gifts
          with "afd5d120-2784-4e99-88c0-cc487423d005" constituent identifier.the maximum limit is 1000
      - name: gift_type
        in: query
        required: false
        schema:
          type: string
        description: represents a list of gift types. returns gifts if their type matches any specified. for example, "gifttype=recurring
          gift, payment, pledge" returns gifts of type "recurring gift" or "payment" or "pledge". available values are invoice,
          credit memo, system transaction, journal entry batch, reversal, charge, ap payment, credit, payment, pledge, recurring
          gift, matching gift claim, planned gift, order, grant award, auction donation, donor challenge claim, computer check,
          pending gift, deposit, adjustment deposit, adjustment payment, adjustment transfer out, adjustment transfer in,
          membership installment plan, write off, sold stock, sold property, refund, deposit correction short, deposit correction
          over, payout, sold gift in kind, deleted revenue.
      - name: appeal_id
        in: query
        required: false
        schema:
          type: string
        description: represents a list of appeal identifiers. returns gifts if any of the specified appeal identifiers match
          any of their appeals. for example, "appealid=e10a4542-9c7b-453f-99f6-4167438637b7,df36ad28-3597-455a-bae7-a1230d8f0f67"
          returns gifts with either "e10a4542-9c7b-453f-99f6-4167438637b7" or "df36ad28-3597-455a-bae7-a1230d8f0f67" appeal
          identifiers.
      - name: designation_id
        in: query
        required: false
        schema:
          type: string
        description: represents a list of designation identifiers. returns gifts if any of the specified designation identifiers
          match any of their designation. for example, "fund id=e10a4542-9c7b-453f-99f6-4167438637b7,df36ad28-3597-455a-bae7-a1230d8f0f67"
          returns gifts with either "e10a4542-9c7b-453f-99f6-4167438637b7" or "df36ad28-3597-455a-bae7-a1230d8f0f67" fund
          identifiers.
      - name: date_added
        in: query
        required: false
        schema:
          type: string
        description: 'Format - date (as full-date in RFC3339). represents a filter for gifts created on or after the specified
          date. the filter respects time offsets from utc per the iso-8601 format: 2016-05-05t17:59:31.1600745-04:00.'
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: 'Format - date (as full-date in RFC3339). represents a filter for gifts modified on or after the specified
          date. the filter respects time offsets from utc per the iso-8601 format: 2016-05-05t17:59:31.1600745-04:00.'
      - name: date_filter
        in: query
        required: false
        schema:
          type: string
          enum:
          - Today
          - This week
          - Last week
          - This month
          - Last month
          - This quarter
          - Last quarter
          - This calendar year
          - Last calendar year
          - This fiscal year
          - Last fiscal year
          - All dates
          - Specific date range
        description: represents a filter for gifts with selected gift date range.
      - name: start_date
        in: query
        required: false
        schema:
          type: string
        description: Format - date (as full-date in RFC3339). represents a filter for gifts with a gift date on or after the
          specified date. if used with end date, returns gifts with gift dates between both values.
      - name: end_date
        in: query
        required: false
        schema:
          type: string
        description: Format - date (as full-date in RFC3339). represents a filter for gifts with a gift date on or before
          the specified date. if used with start date, returns gifts with gift dates between both values.
      - name: sort_parameter
        in: query
        required: false
        schema:
          type: string
        description: represents a parameter to pass column name for sorting.
      - name: sort_order
        in: query
        required: false
        schema:
          type: string
        description: represents a parameter to sort records by ascending or descending order. the default is asc.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Limits the number of records to return.
      - name: session_key
        in: query
        required: false
        schema:
          type: string
        description: A unique key provided by user for paging results. The same key will be returned in a successful response.
      - name: infinity_session
        in: query
        required: false
        schema:
          type: string
        description: Values for cookies related to the Infinity load balancer session.
      - name: more_rows_range_key
        in: query
        required: false
        schema:
          type: string
        description: Key for accessing cached results on subsequent calls to this data list.
      - name: start_row_index
        in: query
        required: false
        schema:
          type: integer
        description: Number of rows to skip,get result after these rows.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of result entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftListCollection'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to view the resource.
        '404':
          description: Returned when the specified resource is not found.
