components:
  schemas:
    MembershipMemberRead:
      description: Members are constituents who join your organization through memberships that encourage more active involvement. Members are usually more involved with your organization than other donors, even if their only contribution is routine giving.
      type: object
      properties:
        id:
          description: The immutable system record ID of the member.
          type: string
        constituent_id:
          description: The immutable system record ID of the constituent associated with the member.
          type: string
        primary:
          description: Indicates whether this is the primary member on the membership.
          type: boolean
      x-display-name: Member
      x-display-id: Member
    MembershipRead:
      description: Membership programs encourage donor loyalty and reward constituents for their support with exclusive, personalized benefits. Memberships also encourage occasional donors to become regular givers through annual renewals.
      type: object
      properties:
        id:
          description: The immutable system record ID of the membership.
          type: string
        category:
          description: The membership category.
          type: string
        constituent_id:
          description: The immutable system record ID of the constituent associated with the membership.
          type: string
        date_added:
          format: date-time
          description: 'The date when the membership was created. Includes an offset from UTC in <a href="https://tools.ietf.org/html/rfc3339">ISO-8601 format: </a><i>1969-11-21T10:29:43-04:00</i>.'
          type: string
          x-supports-datetime-offset: true
        date_modified:
          format: date-time
          description: 'The date when the membership was last modified. Includes an offset from UTC in <a href="https://tools.ietf.org/html/rfc3339">ISO-8601 format: </a><i>1969-11-21T10:29:43-04:00</i>.'
          type: string
          x-supports-datetime-offset: true
        dues:
          $ref: '#/components/schemas/Currency'
          description: The membership dues.
        expires:
          format: date-time
          description: 'The date when the membership expires. Uses <a href="https://tools.ietf.org/html/rfc3339">ISO-8601 format: </a><i>1969-11-21T10:29:43</i>.'
          type: string
          x-supports-datetime-offset: false
        joined:
          format: date-time
          description: 'The date when the membership becomes active. Uses <a href="https://tools.ietf.org/html/rfc3339">ISO-8601 format: </a><i>1969-11-21T10:29:43</i>.'
          type: string
          x-supports-datetime-offset: false
        members:
          description: The set of members who belong to the membership.
          type: array
          items:
            $ref: '#/components/schemas/MembershipMemberRead'
        program:
          description: The membership program.
          type: string
        standing:
          description: The membership status. Available values are <i>New</i>, <i>Active</i>, <i>Lapsed</i>, and <i>Dropped</i>.
          enum:
          - New
          - Active
          - Lapsed
          - Dropped
          type: string
        subcategory:
          description: The membership subcategory.
          type: string
        custom_membership_id:
          description: The user defined membership id.
          type: string
      x-display-name: Membership
      x-display-id: Membership
    ApiCollectionOfMembershipRead:
      description: Fetching data all at once quickly becomes unmanageable. The collection entity helps by returning paginated chunks of large data sets. This entity includes helpful metadata and properties to paginate and iterate through the data.
      type: object
      properties:
        count:
          format: int32
          description: The number of items available for retrieval into the collection after applying any request parameters. The <b>limit</b> and <b>offset</b> parameters do not affect the <b>count</b>, but to facilitate paging, they may affect the number of items in the <b>value</b> result set.
          type: integer
        next_link:
          description: For paginated responses, the URI for the next page of results.
          type: string
        value:
          description: The set of items included in the response. This may be a subset of the items in the collection.
          type: array
          items:
            $ref: '#/components/schemas/MembershipRead'
      x-hidden: true
      x-base-type: '#/definitions/ApiCollection'
    Currency:
