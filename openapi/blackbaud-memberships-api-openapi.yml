            example:
              gift_id: '1001'
              applied_amount: 10
        description: Details about the gift to link
      responses:
        '200':
          description: Returned when the operation succeeds.The response body contains the new link gift ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: '120'
        '401':
          description: Returned when the user is not authorized.
        '403':
          description: Returned when the constituent does not have the permission to link a gift to a membership.
      tags:
      - Memberships
    servers:
    - url: https://api.sky.blackbaud.com/membership
