openapi: 3.2.0
info:
  title: Blackbaud Memberships API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Memberships across 2 of this provider''s published API definitions: blackbaud-constituent-api-openapi.yml, blackbaud-membership-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/constituent/v1
- url: https://api.sky.blackbaud.com/membership
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Memberships
paths:
  /memberships:
    get:
      operationId: ListMemberships
      summary: Membership list (All constituents)
      description: 'Returns a paginated list of memberships.


        The default sorting behavior is to list memberships in ascending order based on when they were created.


        However, the last_modified parameter overrides the default sorting behavior to list memberships in ascending order based on when they were last modified. The last_modified parameter also adds the sort_token parameter to the next_link URL to ensure that memberships are stably sorted and that order persists when changes occur while working through a paginated list.


        If the last_modified and date_added parameters are both specified, the sorting behavior is to list memberships based on when they were last modified.'
      parameters:
      - name: date_added
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for memberships created on or after the specified date. The filter respects time offsets from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for memberships modified on or after the specified date. The filter respects time offsets from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: sort_token
        in: query
        required: false
        schema:
          type: string
        description: Represents a token filter to provide the next stable-sorted list of memberships. This will be provided on the next_link collection response property when last_modified or sort_token filters are specified on the request.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to return. The default is 500. The maximum is 5000.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip. For use with pagination.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a> of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Membership">membership</a> entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfMembershipRead'
              example:
                count: 2
                value:
                - id: '53'
                  category: Young Maestros
                  dues:
                    value: 750
                  expires: '2002-03-17T00:00:00Z'
                  joined: '2000-05-01T00:00:00Z'
                  members:
                  - id: '72'
                    constituent_id: '261'
                    primary: true
                  - id: '73'
                    constituent_id: '526'
                    primary: false
                  - id: '74'
                    constituent_id: '483'
                    primary: false
                  program: Young Explorers
                  standing: Active
                  subcategory: Elementary
                - id: '82'
                  category: Young Maestros
                  dues:
                    value: 750
                  expires: '2009-04-14T00:00:00Z'
                  joined: '2003-01-22T00:00:00Z'
                  members:
                  - id: '110'
                    constituent_id: '483'
                    primary: true
                  program: Young Explorers
                  standing: Lapsed
        '400':
          description: Returned when the specified request parameters are not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to view the memberships.
      tags:
      - Memberships
    servers:
    - url: https://api.sky.blackbaud.com/constituent/v1
  /v1/memberships/categories:
    get:
      operationId: GetMembershipCategoriesAsync
      summary: Get membership category list
      description: Returns a membership category list.
      parameters:
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
        description: Indicates whether to include inactive membership category and subcategory.
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Text to find at least partially in membership.
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
          enum:
          - CategoryName
          - ProgramName
        description: Sort column
      - name: sort_direction
        in: query
        required: false
        schema:
          type: string
          enum:
          - Ascending
          - Descending
        description: Use 'asc' or 'dsc' to arrange a grid, list, or repeater in ascending or descending order based on the passed value for sorting.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: '500'
        description: Represents the number of records to return. The default is 500.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: '0'
        description: Represents the number of records to skip. For use with pagination.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the membership category list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipCategoryCollection'
              example:
                categories:
                - membership_category_id: 1
                  category_name: Category name one
                  default_expires_date: '2023-12-20'
                  program_name: Program name one
                  sequence: 1
                  inactive: false
                  lifetime_membership: true
                  print_renewals: true
                  default_expires_days: 5
                  new_mem_expires_value: 2
                  new_mem_expires_interval: Years
                  maximum_members: 5
                  benefit_notes: Benefit notes one
                  send_benefits_to: PrimaryMember
                  minimum_dues: 50
                  maximum_dues: 100
                  dues_level: '40'
                - membership_category_id: 2
                  category_name: Category name two
                  program_name: Program name two
                  sequence: 2
                  inactive: true
                  lifetime_membership: false
                  print_renewals: true
                  default_expires_days: 5
                  new_mem_expires_value: 2
                  new_mem_expires_interval: Years
                  maximum_members: 2
                  benefit_notes: Benefit notes two
                  send_benefits_to: Donor
                  minimum_dues: 33.33
                  maximum_dues: 99.99
                  dues_level: '40'
                count: 2
                offset: 1
                limit: 10
        '401':
          description: Returned when the user does not have permission to execute this operation or does not have permission to view the requested constituents membership category list.
        '403':
          description: Returned when the constituent membership category capability is not enabled.
      tags:
      - Memberships
    servers:
    - url: https://api.sky.blackbaud.com/membership
  /v1/memberships/categories/{membership_category_id}/benefits:
    get:
      operationId: GetMembershipDefaultBenefitsByMembershipCategoryIdAsync
      summary: Get membership default benefits list
      description: Returns the membership default benefits list.
      parameters:
      - name: membership_category_id
        in: path
        required: true
        schema:
          type: string
        description: Membership category ID
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
          enum:
          - Sequence
        description: Order By clause for sorting operations.
      - name: sort_direction
        in: query
        required: false
        schema:
          type: string
          enum:
          - Ascending
          - Descending
        description: Use 'asc' or 'dsc' to arrange a grid, list, or repeater in ascending or descending order based on the passed value for sorting.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: '500'
        description: Represents the number of records to return. The default is 500.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: '0'
        description: Represents the number of records to skip. For use with pagination.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the membership default benefit list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MembershipBenefitCollection'
              example:
                benefits:
                - benefits_id: 1
                  benefit: Free Admission
                  count: 2
                  unit_cost: 10
                  total_benefit_value: 11
                  currency_symbol: $
                  sent: Sent
                  comments: Latest Benefit
                - benefits_id: 2
                  benefit: 20% Free Admission
                  count: 2
                  unit_cost: 5
                  total_benefit_value: 10
                  currency_symbol: $
                  sent: Sent
                  comments: Last Benefit
                total_value: 21
                send_benefits_to: PrimaryMember
                waive_benefits: false
                count: 2
                offset: 0
                limit: 10
        '401':
          description: Returned when the user does not have permission to execute this operation or does not have permission to view the requested membership default benefit list.
        '403':
          description: Returned when the user does not have permission to view default benefits.
        '400':
          description: Returned when the specified membership category ID in the request URL is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BadRequest400ResponseTypes'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: Field is required
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '404':
          description: Returned when the specified membership category is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:resource-not-found
                title: The requested resource could not be found.
                status: 404
      tags:
      - Memberships
    servers:
    - url: https://api.sky.blackbaud.com/membership
  /v1/memberships/categories/{membership_category_id}/renewalnotices:
    get:
      operationId: GetRenewalNoticeInformationByMembershipCategoryIdAsync
