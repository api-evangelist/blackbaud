  OAuth2: []
tags:
- name: Enrollments
paths:
  /enrollments:
    get:
      operationId: getAllEnrollments
      summary: Enrollments all
      description: Returns a collection of enrollments.
      responses:
        '200':
          description: OK - It was possible to read the collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentsOutputModel'
              example:
                enrollments:
                - user:
                    sourcedId: usr-222-987654
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/users/usr-222-987654
                    type: user
                  class:
                    sourcedId: cls-222-12345
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/classes/cls-22-12345
                    type: class
                  school:
                    sourcedId: org-sch-222-456
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/orgs/org-sch-222-456
                    type: org
                  role: student
                  primary: 'false'
                  beginDate: '2022-03-15T01:30:00Z'
                  endDate: '2022-06-15T01:30:00Z'
                  sourcedId: enr-s-222-12345-987654
                  status: active
                  dateLastModified: '2022-03-15T01:30:00Z'
                - user:
                    sourcedId: usr-222-123456
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/users/usr-222-123456
                    type: user
                  class:
                    sourcedId: cls-222-12345
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/classes/cls-22-12345
                    type: class
                  school:
                    sourcedId: org-sch-222-456
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/orgs/org-sch-222-456
                    type: org
                  role: teacher
                  primary: 'true'
                  beginDate: '2022-03-15T01:30:00Z'
                  endDate: '2022-06-15T01:30:00Z'
                  sourcedId: enr-t-222-12345-123456
                  status: active
                  dateLastModified: '2022-03-15T01:30:00Z'
      tags:
      - Enrollments
  /enrollments/{id}:
    get:
      operationId: getEnrollment
      summary: Enrollment by id
      description: Returns a specific enrollment.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: sourcedId for the enrollment
      responses:
        '200':
          description: OK - It was possible to read the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentOutputModel'
              example:
                enrollment:
                  user:
                    sourcedId: usr-222-987654
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/users/usr-222-987654
                    type: user
                  class:
                    sourcedId: cls-222-12345
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/classes/cls-22-12345
                    type: class
                  school:
                    sourcedId: org-sch-222-456
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/orgs/org-sch-222-456
                    type: org
                  role: student
                  primary: 'false'
                  beginDate: '2022-09-26T01:30:00Z'
                  endDate: '2022-12-26T01:30:00Z'
                  sourcedId: enr-s-222-12345-987654
                  status: active
                  dateLastModified: '2022-09-26T01:30:00Z'
      tags:
      - Enrollments
