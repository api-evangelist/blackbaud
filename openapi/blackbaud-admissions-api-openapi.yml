openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: School Admissions API'
  description: This API is used to provide access to school information such as users, academics, admissions, athletics, content, lists, and general school info.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/school
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/school
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Admissions
paths:
  /v1/admissions/candidates:
    post:
      operationId: V1AdmissionsCandidatesPost
      summary: Admissions candidate create (Legacy)
      description: 'Creates a new admissions candidate record.


        Returns the ID of the newly created candidate.


        Requires one of the following roles in the Education Management system:


        Admissions Manager


        Admissions Staff'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateCreate'
            example:
              user_id: 0
              entering_year: string
              entering_grade_id: 0
              checklist_id: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1AdmissionsCandidatesPost200ApplicationJsonResponse'
              example: 450924
      tags:
      - Admissions
    get:
      operationId: V1AdmissionsCandidatesGet
      summary: Admissions candidates (Legacy)
      description: 'Returns a collection of admissions candidates.


        Requires one of the following roles in the Education Management system:


        Admissions Manager


        Platform Manager


        SKY API Data Sync


        NOTE: The following fields have been deprecated and are no longer returned as of 01/01/2023.


        school_decision


        school_decision_type


        candidate_decision


        candidate_decision_type


        Use the school decision and candidate decision objects instead.


        NOTE: The filter for school_year_id has been replaced by school_year.


        The school_year_id filter has been deprecated and no longer functions as of 01/01/2023.'
      parameters:
      - name: school_year
        in: query
        required: false
        schema:
          type: string
        description: The school year for which to return results.  Corresponds to ```school_year_label``` in the <a href="https://developer.sky.blackbaud.com/docs/services/school/operations/v1yearsget">Year list</a>.  Default is current year.
      - name: status_ids
        in: query
        required: false
        schema:
          type: string
        description: One or more comma delimited status Id(s) to filter results on.  Corresponds to ```id``` in the <a href="https://developer.sky.blackbaud.com/docs/services/school/operations/V1AdmissionsStatusGet">Status list</a>.  Default is no status Id filter.
      - name: modified_date
        in: query
        required: false
        schema:
          type: string
        description: 'The date last modified to filter results to on or after. Use <a href="https://en.wikipedia.org/wiki/ISO_8601" target="_blank">ISO-8601</a> date format: 2003-04-21. Default is no modified date filter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateReadCollection'
              example:
                count: 1
                value:
                - user_id: 12345
                  first_name: James
                  last_name: Dean
                  middle_name: Byron
                  prefix: ''
                  suffix: ''
                  nickname: Jimmy
                  role: Candidate
                  role_id: 4543
                  current_status: Applied
                  status_id: 646
                  entering_year: 2020 - 2021
                  entering_year_id: 4520144
                  entering_grade: '9'
                  entering_grade_id: 544
                  email: JimmyJim@DeansCourt.com
                  comment: Enjoys Chess and Acting
                  parent1_email: Mom@DeansCourt.com
                  parent2_email: Dad@DeansCourt.com
                  international: false
                  school_program: High School Program
                  gender: M
                  ethnicity: Caucasian
                  boarding_or_day: B
                  financial_aid: true
                  admissions_staff_id: 54321
                  admissions_staff: John Smith
                  inquiry_source: Open House
                  inquiry_source_id: 3
                  referral_type: Alum
                  referral_type_id: 1
                  has_iep: false
                  has_504: true
                  created_by: '789789'
                  created: '2023-01-06T11:13:33Z'
                  modified_by: '789789'
                  modified: '2023-01-06T11:13:33Z'
                  preferred_name: Jimmy
                  decision:
                    id: 3213
                    name: Conditionally Accepted
                    decision_type: Accepted
                    decision_type_id: 6
                    date: '2023-01-06T11:13:33Z'
                    expire_date: '2023-01-06T11:13:33Z'
                    comment: Waiting for test results.
                    candidate_response:
                      id: 5430
                      name: Excited to Attend
                      decision_type: Enrolling
                      decision_type_id: 14
                      date: '2023-01-06T11:13:33Z'
                  family_id: 2
                  current_status_date: '2024-03-31T12:00:00Z'
                  application:
                    id: 1
                    date_submitted: '2024-03-31T12:00:00Z'
                    date_processed: '2024-03-31T12:00:00Z'
                    source:
                      id: 1
                      description: Email
                  events:
                  - id: 1
                    name: Open House
                    start_time: '2024-03-31T12:00:00Z'
                    is_registered: true
                    attended: false
                    comment: An eventful comment
                  interviews:
                  - id: 1
                    start_time: '2024-03-31T12:00:00Z'
                    end_time: '2024-03-31T12:00:00Z'
                    interviewer_other: John Bridges
                    rating: 10
                    is_rescheduled: false
                    comment: A candid comment
                  visits:
                  - id: 1
                    start_time: '2024-03-31T12:00:00Z'
                    end_time: '2024-03-31T12:00:00Z'
                    guide_other: John Bridges
                    is_rescheduled: false
                    comment: A candid comment
      tags:
      - Admissions
  /v1/admissions/checklists:
    get:
      operationId: V1AdmissionsChecklistsGet
      summary: Admissions checklists (Legacy)
      description: 'Returns a collection of admissions checklists.


        Use the optional ```search_text``` to apply a case-insensitive search against check lists "name".


        Use the optional ```inactive``` to return only inactive checklists (default is both).


        Requires the following role in the Education Management system:


        Admissions Manager'
      parameters:
      - name: search_text
        in: query
        required: false
        schema:
          type: string
        description: Applies a case-insensitive search against check lists "name".
      - name: inactive
        in: query
        required: false
        schema:
          type: boolean
        description: flag to return only inactive checklists (default is both).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdmissionsCheckListCollection'
              example:
                count: 1
                value:
                - checklist_id: 45245
                  name: My Checklist
                  is_inactive: false
                  is_locked: false
                  is_sample: false
      tags:
      - Admissions
  /v1/admissions/checkliststatus:
    get:
      operationId: V1AdmissionsCheckliststatusGet
      summary: Admissions checklist status (Legacy)
      description: 'Returns a collection of admissions checklist statuses.


        Requires the following role in the Education Management system:


        Admissions Manager'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdmissionsChecklistStatusCollection'
              example:
                count: 3
                value:
                - status_id: 6
                  status_name: Inquiry
                  ordinal: 10
                - status_id: 143
                  status_name: Applicant
                  ordinal: 20
                - status_id: 1201
                  status_name: Accepted
                  ordinal: 30
      tags:
      - Admissions
  /v1/admissions/status:
    get:
      operationId: V1AdmissionsStatusGet
      summary: Admissions statuses (Legacy)
      description: 'Returns a collection of admissions statuses.


        Requires one of the following roles in the Education Management system:


        Admissions Manager


        Platform Manager


        SKY API Data Sync'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdmissionsStatusesCollection'
              example:
                count: 1
                value:
                - id: 45245
                  description: In Process
                  next_status_id: 45246
      tags:
      - Admissions
