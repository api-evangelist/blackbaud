openapi: 3.2.0
info:
  title: Blackbaud Recurringgifts API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Recurringgifts across 4 of this provider''s published API definitions: blackbaud-altru-revenue-api-openapi.yml, blackbaud-crm-revenue-api-openapi.yml, blackbaud-gift-api-openapi.yml, blackbaud-gift-v2-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/alt-revmg
- url: https://api.sky.blackbaud.com/crm-revmg
- url: https://api.sky.blackbaud.com/gift/v1
- url: https://api.sky.blackbaud.com/gft-gifts
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Recurringgifts
paths:
  /recurringgifts:
    post:
      operationId: CreateRecurringGift
      summary: Create a recurring gift
      description: Add operation for recurring gifts.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewRecurringGift'
            example:
              constituent_id: ''
              date: ''
              amount: 0
              auto_pay: false
              payment_method: Cash
              constituent_account: ''
              reference_number: ''
              reference_date: ''
              credit_type: ''
              credit_card_number: ''
              card_holder_name: ''
              expires_on: ''
              credit_card_token: ''
              frequency: Annually
              start_date: ''
              end_date: ''
              splits:
              - id: ''
                designation_id: ''
                amount: 0
                application_code: 0
                type_code: 0
                declines_gift_aid: false
                transaction_currency_id: ''
              finder_number: 0
              source_code: ''
              appeal_id: ''
              given_anonymously: false
              mailing_id: ''
              channel: ''
              do_not_acknowledge: false
              single_designation_id: ''
              households_can_be_donors: false
              reference: ''
              category_code: ''
              standing_order_setup: false
              standing_order_set_update: ''
              ddi_source: ''
              ddi_source_date: ''
              send_reminder: false
              transaction_currency_id: ''
              base_exchange_rate_id: ''
              exchange_rate: 0
              base_currency_id: ''
              base_currency_decimal_digits: 0
              base_currency_rounding_type_code: 0
              business_units_applied: false
              generate_reference_number: false
              standing_order_reference_number: ''
              event_id: ''
              local_corp_id: ''
              membership_recurring_gift: false
              batch_number: ''
              sepa_mandate: ''
              other_payment_method: ''
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully creates the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Recurringgifts
    servers:
    - url: https://api.sky.blackbaud.com/alt-revmg
  /recurringgifts/{revenue_id}:
    patch:
      operationId: EditRecurringGift
      summary: Edit a recurring gift
      description: Edit operation for recurring gift records.
      parameters:
      - name: revenue_id
        in: path
        required: true
        schema:
          type: string
        description: The revenue id.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditRecurringGift'
            example:
              revenue_id: ''
              constituent_id: ''
              constituent_name: ''
              date: ''
              amount: 0
              frequency: Annually
              start_date: ''
              end_date: ''
              splits:
              - id: ''
                designation_id: ''
                amount: 0
                application_code: 0
                type_code: 0
                declines_gift_aid: false
                transaction_currency_id: ''
              finder_number: 0
              source_code: ''
              appeal_id: ''
              given_anonymously: false
              mailing_id: ''
              channel: ''
              do_not_acknowledge: false
              max_solicitor_amount: 0
              single_designation_id: ''
              finder_number_valid: false
              reference: ''
              category_code: ''
              send_reminder: false
              next_installment_id: ''
              last_activity_date: ''
              edit_start_date: false
              sponsorship: false
              revenue_development_function: ''
              base_currency_id: ''
              transaction_currency_id: ''
              base_exchange_rate_id: ''
              exchange_rate: 0
              had_spot_rate: false
              rate_changed: false
              base_decimal_digits: 0
              base_rounding_type_code: 0
              transaction_currency_description: ''
              sponsorship_opportunity_id: ''
              has_recognition_credit: false
              update_recognition_option: 0
              schedule_seed_date: ''
              membership_recurring: false
              previous_schedule_seed_date: ''
              status_code: 0
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully edits the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to edit the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Recurringgifts
    get:
      operationId: GetRecurringGift
      summary: Get a recurring gift
      description: Edit operation for recurring gift records.
      parameters:
      - name: revenue_id
        in: path
        required: true
        schema:
          type: string
        description: The revenue id.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringGift'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to get the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Recurringgifts
    servers:
    - url: https://api.sky.blackbaud.com/alt-revmg
  /recurringgifts/{gift_id}/canbeconverted:
    get:
      operationId: CanBeConverted
      summary: Recurring gift eligibility for automated processing
      description: Returns whether the recurring gift can be converted to an automated gift in the web view.
      parameters:
      - name: gift_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the recurring gift.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body indicates if the specified recurring gift can be automated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringGiftConversionCheck'
              example:
                can_be_converted: false
                token_will_be_required: false
                gift_id: '12345'
                errors:
                - gift_id: '12345'
                  lookup_id: my-gift
                  exception_error_code: 25144
                  exception_error_message: This gift can't be automated because its credit card information has not been stored.
                  exception_error_name: '25144'
                  affected_field: AccountToken
        '400':
          description: Returned when the specified request parameters are not in the appropriate format.
        '403':
          description: Returned when the user doesn't have permission to view gift.
        '404':
          description: Returned when the specified gift is not found or is not a recurring gift.
      tags:
      - Recurringgifts
    servers:
    - url: https://api.sky.blackbaud.com/gift/v1
  /recurringgifts/{gift_id}/converttoautomatic:
    post:
      operationId: ConvertToAutomatic
      summary: Automate recurring gift
      description: Converts a manual recurring gift to an automated recurring gift in the web view.
      parameters:
      - name: gift_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the recurring gift to convert.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecurringGiftConversionOptions'
            example:
              bbps_configuration_id: string
              account_token: string
        description: The BBPS configuration ID to use to process the gift's payments.
      responses:
        '200':
          description: Returned when the operation successfully converts the gift to an automated recurring gift.
        '400':
          description: Returned when the specified request parameters are not in the appropriate format, or when the recurring gift can't be automated.
        '403':
          description: Returned when the user doesn't have permissions to edit the gift.
        '404':
          description: Returned when the specified gift is not found or is not a recurring gift.
      tags:
      - Recurringgifts
    servers:
    - url: https://api.sky.blackbaud.com/gift/v1
  /recurringgifts/{gift_id}/status:
    put:
      operationId: EditRecurringGiftStatus
      summary: Gift status (Edit)
      description: Edit the status of a recurring gift.
      parameters:
      - name: gift_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the recurring gift to update.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecurringGiftStatusEdit'
            example:
              gift_status: Held
        description: The new status to apply to the recurring gift.
      responses:
        '200':
          description: Returned when the operation succeeds.
        '400':
          description: Returned when the specified request parameters are not in the appropriate format.
        '403':
          description: Returned when the user doesn't have permission to edit gift.
        '404':
          description: Returned when the specified gift ID doesn't exist.
      tags:
      - Recurringgifts
    servers:
    - url: https://api.sky.blackbaud.com/gift/v1
  /v2/recurringgifts/{gift_id}/amendments/paymentinformation:
    patch:
      operationId: EditRecurringGiftPaymentInformation
      summary: Edit payment information for a recurring gift (PREVIEW)
      description: 'Edits payment information for a recurring gift paid by credit card.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: gift_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the gift.
      - name: If-Match
        in: header
        required: false
        schema:
          type: string
        description: ETag of the Entity. The value should match the current ETag header value from the gift GET request or it should be * for an unconditional update.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditPaymentInformation'
            example:
              account_token: 91b1917b-ead1-4f67-8274-3371563e370c
              update_all_gifts_with_matching_account_token: true
              origin: External
        description: Details for editing payment information.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmendGiftResult'
              example:
                status: Complete
                correlation_id: 1248c5af-5f39-46c0-9bdb-e87352f2bdc9
                related_gifts:
                - correlation_id: 40a02448-fe6f-43e6-87c9-6e5742cd43ab
                  status: Pending
      tags:
      - Recurringgifts
    servers:
    - url: https://api.sky.blackbaud.com/gft-gifts
components:
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          description: A URI reference [RFC3986] that identifies the problem type. This specification encourages that, when dereferenced, it provide human-readable documentation for the problem type (e.g., using HTML [W3C.REC-html5-20141028]). When this member is not present, its value is assumed to be "about:blank".
        title:
          type: string
          description: A short, human-readable summary of the problem type. It SHOULD NOT change from occurrence to occurrence of the problem, except for purposes of localization (e.g., using proactive content negotiation; see [RFC7231], Section 3.4).
        status:
          type: integer
          description: The HTTP status code ([RFC7231], Section 6) generated by the origin server for this occurrence of the problem.
          format: int32
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        instance:
          type: string
          description: A URI reference that identifies the specific occurrence of the problem. It may or may not yield further information if dereferenced.
        trace_id:
          type: string
          description: A request ID that can be provided to Blackbaud Support that may help with further troubleshooting.
        span_id:
          type: string
          description: A request ID that can be provided to Blackbaud Support that may help with further troubleshooting.
      additionalProperties: false
      description: A machine-readable format for specifying errors in HTTP API responses based on https://tools.ietf.org/html/rfc7807.
      x-display-name: Problem details
      x-display-id: ProblemDetails
