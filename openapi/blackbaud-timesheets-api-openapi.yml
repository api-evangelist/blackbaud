openapi: 3.2.0
info:
  title: Blackbaud Timesheets API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Timesheets across 2 of this provider''s published API definitions: blackbaud-altru-volunteer-api-openapi.yml, blackbaud-crm-volunteer-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/alt-volmg
- url: https://api.sky.blackbaud.com/crm-volmg
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Timesheets
paths:
  /timesheets:
    post:
      operationId: CreateTimesheet
      summary: Create a timesheet
      description: Add a timesheet.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewTimesheet'
            example:
              volunteer_id: d7653267-54ce-461f-ae97-bbb305c9af57
              job_occurrence_id: 97a63f7a-d29a-45b8-a75f-9adebf00f849
              hours_worked: 8
              start_date: '2006-07-29T10:00:00Z'
              end_date: '2006-07-29T06:00:00Z'
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully creates the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Timesheets
    servers:
    - url: https://api.sky.blackbaud.com/alt-volmg
  /timesheets/{time_sheet_id}:
    delete:
      operationId: DeleteTimesheet
      summary: Delete a timesheet
      description: Deletes a timesheet from the system.
      parameters:
      - name: time_sheet_id
        in: path
        required: true
        schema:
          type: string
        description: The time sheet id
      responses:
        '200':
          description: Returned when the operation successfully deletes the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to delete the resource.
      tags:
      - Timesheets
    patch:
      operationId: EditTimesheet
      summary: Edit a timesheet
      description: Edit a timesheet.
      parameters:
      - name: time_sheet_id
        in: path
        required: true
        schema:
          type: string
        description: The time sheet id.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditTimesheet'
            example:
              job_occurrence_id: 97a63f7a-d29a-45b8-a75f-9adebf00f849
              hours_worked: 8
              start_date: '2006-07-29T10:00:00Z'
              end_date: '2006-07-29T06:00:00Z'
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully edits the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to edit the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Timesheets
    get:
      operationId: GetTimesheet
      summary: Get a timesheet
      description: Edit a timesheet.
      parameters:
      - name: time_sheet_id
        in: path
        required: true
        schema:
          type: string
        description: The time sheet id.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timesheet'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to get the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Timesheets
    servers:
    - url: https://api.sky.blackbaud.com/alt-volmg
  /timesheets/{volunteer_id}/list:
    get:
      operationId: ListTimesheets
      summary: List timesheets
      description: Lists the timesheets for a volunteer.
      parameters:
      - name: volunteer_id
        in: path
        required: true
        schema:
          type: string
        description: The volunteer id.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Limits the number of records to return.
      - name: session_key
        in: query
        required: false
        schema:
          type: string
        description: A unique key provided by user for paging results. The same key will be returned in a successful response.
      - name: infinity_session
        in: query
        required: false
        schema:
          type: string
        description: Values for cookies related to the Infinity load balancer session.
      - name: more_rows_range_key
        in: query
        required: false
        schema:
          type: string
        description: Key for accessing cached results on subsequent calls to this data list.
      - name: start_row_index
        in: query
        required: false
        schema:
          type: integer
        description: Number of rows to skip,get result after these rows.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of result entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimesheetListCollection'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to view the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Timesheets
    servers:
    - url: https://api.sky.blackbaud.com/alt-volmg
components:
  schemas:
    Timesheet:
      required:
      - job_occurrence_id
      - hours_worked
      - start_date
      type: object
      properties:
        job_occurrence_id:
          type: string
          description: The job occurrence.
        hours_worked:
          type: number
          description: The hours worked.
          format: double
        start_date:
          type: string
          description: 'The start date. Uses the format YYYY-MM-DDThh:mm:ss. An example date: <i>1955-11-05T22:04:00</i>.'
          format: date-time
        end_date:
          type: string
          description: 'The end date. Uses the format YYYY-MM-DDThh:mm:ss. An example date: <i>1955-11-05T22:04:00</i>.'
          format: date-time
      additionalProperties: false
      description: GetTimesheet
      x-display-name: Timesheet Edit Form
      x-display-id: Timesheet Edit Form
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          description: A URI reference [RFC3986] that identifies the problem type. This specification encourages that, when dereferenced, it provide human-readable documentation for the problem type (e.g., using HTML [W3C.REC-html5-20141028]). When this member is not present, its value is assumed to be "about:blank".
        title:
          type: string
          description: A short, human-readable summary of the problem type. It SHOULD NOT change from occurrence to occurrence of the problem, except for purposes of localization (e.g., using proactive content negotiation; see [RFC7231], Section 3.4).
        status:
          type: integer
          description: The HTTP status code ([RFC7231], Section 6) generated by the origin server for this occurrence of the problem.
          format: int32
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        instance:
          type: string
          description: A URI reference that identifies the specific occurrence of the problem. It may or may not yield further information if dereferenced.
        trace_id:
          type: string
          description: A request ID that can be provided to Blackbaud Support that may help with further troubleshooting.
        span_id:
          type: string
          description: A request ID that can be provided to Blackbaud Support that may help with further troubleshooting.
      additionalProperties: false
      description: A machine-readable format for specifying errors in HTTP API responses based on https://tools.ietf.org/html/rfc7807.
      x-display-name: Problem details
      x-display-id: ProblemDetails
    NewTimesheet:
      required:
      - volunteer_id
      - job_occurrence_id
      - hours_worked
      - start_date
      type: object
      properties:
        volunteer_id:
          type: string
          description: The volunteer ID.
        job_occurrence_id:
          type: string
          description: The job occurrence.
        hours_worked:
          type: number
          description: The hours worked.
          format: double
        start_date:
          type: string
          description: 'The start date. Uses the format YYYY-MM-DDThh:mm:ss. An example date: <i>1955-11-05T22:04:00</i>.'
          format: date-time
        end_date:
          type: string
          description: 'The end date. Uses the format YYYY-MM-DDThh:mm:ss. An example date: <i>1955-11-05T22:04:00</i>.'
          format: date-time
      additionalProperties: false
      description: CreateTimesheet
      example:
        volunteer_id: d7653267-54ce-461f-ae97-bbb305c9af57
        job_occurrence_id: 97a63f7a-d29a-45b8-a75f-9adebf00f849
        hours_worked: 8
        start_date: '2006-07-29T10:00:00Z'
        end_date: '2006-07-29T06:00:00Z'
      x-display-name: Timesheet Add Form
      x-display-id: Timesheet Add Form
    TimesheetListSummary:
      type: object
      properties:
        id:
          type: string
          description: The ID.
        job_name:
          type: string
          description: The job.
        job_occurrence:
          type: string
          description: The job occurrence.
        hours_worked:
          type: number
          description: The hours worked.
          format: double
        start_date:
          type: string
          description: 'The start date. Uses the format YYYY-MM-DDThh:mm:ss. An example date: <i>1955-11-05T22:04:00</i>.'
          format: date-time
        end_date:
          type: string
          description: 'The end date. Uses the format YYYY-MM-DDThh:mm:ss. An example date: <i>1955-11-05T22:04:00</i>.'
          format: date-time
      additionalProperties: false
      description: ListTimesheets
      x-display-name: Timesheet List
      x-display-id: Timesheet List
    TimesheetListCollection:
      type: object
      properties:
        count:
          type: integer
          description: The number of items available for retrieval into the collection after applying any request parameters.
          format: int32
        value:
          type: array
          items:
            $ref: '#/components/schemas/TimesheetListSummary'
          description: The set of items included in the response. This may be a subset of the items in the collection.
        infinity_session:
          type: string
          description: Values for cookies related to the Infinity load balancer session.
          format: string
        session_key:
          type: string
          description: Session key for paging provided by user in request query parameter.
          format: string
        total_available_rows:
          type: integer
          description: The number of total rows available.
          format: int32
        more_rows_range_key:
          type: string
          description: Key for accessing cached results on subsequent calls to this data list.
          format: string
        data_no_longer_available:
          type: boolean
          description: Indicates data is no longer available in the context of this session.
          format: boolean
      additionalProperties: false
      description: A collection of items. Data lists can contain paginated results.
    EditTimesheet:
      type: object
      properties:
        job_occurrence_id:
          type: string
          description: The job occurrence.
        hours_worked:
          type: number
          description: The hours worked.
          format: double
        start_date:
          type: string
          description: 'The start date. Uses the format YYYY-MM-DDThh:mm:ss. An example date: <i>1955-11-05T22:04:00</i>.'
          format: date-time
        end_date:
          type: string
          description: 'The end date. Uses the format YYYY-MM-DDThh:mm:ss. An example date: <i>1955-11-05T22:04:00</i>.'
          format: date-time
      additionalProperties: false
      description: EditTimesheet
      example:
        job_occurrence_id: 97a63f7a-d29a-45b8-a75f-9adebf00f849
        hours_worked: 8
        start_date: '2006-07-29T10:00:00Z'
        end_date: '2006-07-29T06:00:00Z'
      x-display-name: Timesheet Edit Form
      x-display-id: Timesheet Edit Form
    PostResponse:
      type: object
      properties:
        id:
          type: string
          description: The newly created ID.
      additionalProperties: false
      description: Defines the shape of a post response object.
  securitySchemes:
    Bb-Api-Subscription-Key:
      type: apiKey
      name: Bb-Api-Subscription-Key
      in: header
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://app.blackbaud.com/oauth/authorize
          tokenUrl: https://oauth2.sky.blackbaud.com/token
          scopes: {}
