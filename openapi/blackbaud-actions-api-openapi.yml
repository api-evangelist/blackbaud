  /actions/{action_id}/attachments:
    get:
      operationId: ListActionAttachmentsSingleAction
      summary: Action attachment list (Single action)
      description: Returns a list of attachments for an action.
      parameters:
      - name: action_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the action to retrieve attachments for.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a> of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Attachment">attachment</a> entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfAttachmentRead'
              example:
                count: 2
                value:
                - id: F7AEAD3D-7F86-4B8D-909B-B76706C0DB04
                  date: '2017-07-21T04:00:00Z'
                  name: Meeting minutes
                  parent_id: '1'
                  tags:
                  - Document
                  type: Link
                  url: http://www.example.com/Meetings/20170721/Notes.docx
                - id: 5B094C8B-5961-4E7F-B1FE-F13ECFC6F82E
                  content_type: image/jpeg
                  date: '2015-01-22T04:00:00Z'
                  file_id: 5B094C8B-5961-4E7F-B1FE-F13ECFC6F82E
                  file_name: ActionEvent_Snapshot.jpg
                  file_size: 125436
                  name: Action Event Picture
