          application/json:
            schema:
              $ref: '#/components/schemas/ParentedNoteAdd'
            example:
              constituent_id: '280'
              date:
                d: 25
                m: 8
                y: 2015
              summary: Trivia
              text: Dr. Hernandez is an avid Trekkie who frequently quotes Captain Kirk in his lectures.
              type: Personal
        description: An object that represents the note to create.
      responses:
        '200':
          description: Returned when the operation successfully creates a note. The response body contains the ID of the new note.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: '1281'
        '400':
          description: Returned when the request body is not in the appropriate format.
        '403':
