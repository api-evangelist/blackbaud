            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfParentedNoteRead'
              example:
                count: 6
                value:
                - id: '12'
                  parent_id: '280'
                  date:
                    m: 6
                    y: 2007
                  summary: Vacation
                  text: Dr. Hernandez has purchased a vacation home in Arizona.  He plans to spend some of the winter months at the home and in addition will open a part-time pediatric clinic in Arizona.
                  type_id: '5'
                  type: Address Changes
                - id: '10'
                  parent_id: '280'
                  date:
                    d: 11
                    m: 6
                    y: 2006
                  summary: Opening of Pediatric Clinic with Partner
                  text: Dr. Hernandez plans to leave the pharmaceutical company to open a practice with his former colleague and friend.  There will be an opening day that he will offer free pediatric exams to certain areas of town.
                  type_id: '3'
                  type: Career
                - id: '14'
                  parent_id: '280'
                  date:
                    d: 5
                    m: 6
                    y: 2005
                  summary: Chair selections for next year
                  text: Possible that Dr. Hernandez may step down from the board next year to pursue additional medical research activities.  Schedule lunch date to discuss options.
                  type_id: '1'
                  type: Director's Notes
                - id: '13'
                  parent_id: '280'
                  date:
                    d: 30
                    m: 8
                    y: 2003
                  summary: Lunch with Wendy (Dr. Hernandez's wife)
                  text: Saw Wendy downtown at a conference this afternoon.  Asked her to lunch.  We ate at The Macaroni Grill.
                  type_id: '6'
                  type: Personal
                - id: '11'
                  parent_id: '280'
                  date:
                    m: 6
                    y: 2002
                  summary: Volunteer solicitors vs. Staff
                  text: Lane is a golfing parter with Dr. Hernandez and they have established a friendly relationship.  He will take over as the main solicitor for this account next year.  Audrey will still be the staff solicitor.
                  type_id: '9'
