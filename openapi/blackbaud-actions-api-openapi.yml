        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the note to retrieve information for.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#ParentedNote">note</a> entity.
