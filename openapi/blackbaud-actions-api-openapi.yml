        '400':
          description: Returned when the request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to create the custom field.
        '404':
          description: Returned when the specified action is not found.
      tags:
      - Actions
  /actions/customfields/categories:
    get:
      operationId: ListActionCustomFieldCategories
      summary: Action custom field categories
      description: Returns a list of custom field categories. This endpoint is deprecated. For more detailed custom field category information, use the Custom field category details endpoint instead.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a> of string custom field categories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfString'
              example:
                count: 6
                value:
                - Attended?
                - Guest Name
                - Interest Generated?
                - Left Message?
                - Responded?
                - Talking Points
        '403':
          description: Returned when the user does not have permission to view the custom field categories.
      tags:
      - Actions
  /actions/customfields/categories/details:
    get:
      operationId: ListActionCustomFieldCategoryDetails
      summary: Action custom field category details
      description: Returns a list of custom field category details.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a> of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#CustomFieldCategory">custom field categories</a>.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfCustomFieldCategoryRead'
              example:
                count: 8
                value:
                - name: '# of Family Members'
                  type: Number
                - name: Anniversary
                  type: Date
                - name: Interest Generated?
                  type: CodeTableEntry
                - name: Business Hours
                  type: Text
                - name: Staff Manager
                  type: ConstituentId
                - name: Attended?
                  type: Boolean
                - name: Member Since
                  type: FuzzyDate
                - name: Net Worth
                  type: Currency
        '403':
          description: Returned when the user does not have permission to view the custom field category details.
      tags:
      - Actions
  /actions/customfields/categories/values:
    get:
      operationId: ListActionCustomFieldCategoryValues
      summary: Action custom field category values
