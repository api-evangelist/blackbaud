  /actions/{action_id}/customfields:
    get:
      operationId: ListActionCustomFieldsSingleAction
      summary: Action custom field list (Single action)
      description: Returns a list of custom fields for an action.
      parameters:
      - name: action_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the action to retrieve the custom fields for.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a> of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#CustomField">custom field</a> entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfCustomFieldRead'
              example:
                count: 4
                value:
                - id: '281'
                  category: Interest Generated?
                  comment: Clearly stated
                  date: '2016-07-21T00:00:00Z'
                  parent_id: '1370'
                  type: CodeTableEntry
                  value: 'Yes'
                - id: '282'
                  category: Attended?
                  comment: Attends every year
                  date: '2016-07-21T00:00:00Z'
                  parent_id: '1370'
                  type: Boolean
                  value: true
                - id: '283'
                  category: Responded?
                  comment: Stated previously that he may not reply
                  date: '2016-07-21T00:00:00Z'
                  parent_id: '1370'
                  type: Boolean
                  value: false
                - id: '284'
                  category: Left Message?
                  comment: We left a message not expecting a response
                  date: '2016-07-21T00:00:00Z'
                  parent_id: '1370'
                  type: Boolean
                  value: true
        '400':
          description: Returned when the specified action ID in the request URL is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to view the custom fields.
        '404':
          description: Returned when the specified action is not found.
      tags:
      - Actions
  /actions/{action_id}/notes:
