components:
  schemas:
    CustomFieldAdd:
      description: While records provide many fields to track information, organizations often require additional details. To track this specialized information, use custom fields.
      required:
      - category
      type: object
      properties:
        category:
          description: The custom field category. Available values are the entries in the <b>Custom Field Categories</b> table of the parent object.
          type: string
        comment:
          description: 'The comment on the custom field. Character limit: 50.'
          maxLength: 50
          minLength: 0
          type: string
        date:
          format: date-time
          description: The date on the custom field. Uses <a href="https://tools.ietf.org/html/rfc3339">ISO-8601 format:</a><i>1969-11-21T10:29:43</i>.
          type: string
          x-supports-datetime-offset: false
        parent_id:
          description: The parent object's immutable system record ID.
          type: string
        value:
          description: The value of the custom field. The <code>type</code> property determines the format. Character limit depends on data type. Number types only support values greater than 0.
          type: object
      x-hidden: true
      x-display-name: Create custom field
      x-display-id: CreateCustomField
      x-additional-info: "<a name=\"CustomFieldTypes\"></a>\n<p>&nbsp;</p>\n<p>\n    Available values for the <b>type</b> of a <b>custom field</b>:\n</p>\n\n<div class=\"table-responsive\">\n    <table class=\"table table-striped table-hover\">\n        <thead>\n            <tr>\n                <th class=\"col-xs-3\"><strong>Type</strong></th>\n                <th class=\"col-xs-9\"><strong>Description</strong></th>\n            </tr>\n        </thead>\n        <tbody>\n            <tr>\n                <td>Boolean</td>\n                <td>Defines the custom field as a boolean value.</td>\n            </tr>\n            <tr>\n                <td>CodeTableEntry</td>\n                <td>Defines the custom field as a string value that represents a code table entry description.</td>\n            </tr>\n            <tr>\n                <td>ConstituentId</td>\n                <td>Defines the custom field as a constituent identifier value.</td>\n            </tr>\n            <tr>\n                <td>Currency</td>\n                <td>Defines the custom field as a decimal value.</td>\n            </tr>\n            <tr>\n                <td>Date</td>\n                <td>\n                    Defines the custom field as a date value in <a href=\"https://tools.ietf.org/html/rfc3339\">ISO-8601 format:</a> <i>1969-11-21T10:29:43</i>.\n                </td>\n            </tr>\n            <tr>\n                <td>FuzzyDate</td>\n                <td>\n                    Defines the custom field as a fuzzy date value.\n                </td>\n            </tr>\n            <tr>\n                <td>Number</td>\n                <td>Defines the custom field as an integer value.</td>\n            </tr>\n            <tr>\n                <td>Text</td>\n                <td>Defines the custom field as a string value. Character limit: 255.</td>\n            </tr>\n        </tbody>\n    </table>\n</div>"
    ApiCollectionOfCustomFieldCategoryRead:
      description: Fetching data all at once quickly becomes unmanageable. The collection entity helps by returning paginated chunks of large data sets. This entity includes helpful metadata and properties to paginate and iterate through the data.
      type: object
      properties:
        count:
          format: int32
          description: The number of items available for retrieval into the collection after applying any request parameters. The <b>limit</b> and <b>offset</b> parameters do not affect the <b>count</b>, but to facilitate paging, they may affect the number of items in the <b>value</b> result set.
          type: integer
        next_link:
          description: For paginated responses, the URI for the next page of results.
          type: string
        value:
          description: The set of items included in the response. This may be a subset of the items in the collection.
          type: array
          items:
            $ref: '#/components/schemas/CustomFieldCategoryRead'
      x-hidden: true
      x-base-type: '#/definitions/ApiCollection'
    ActionEdit:
      description: Actions track the interactions and tasks that are required to secure gifts and cultivate relationships with constituents.
      type: object
      properties:
        category:
          description: The channel or intent of the constituent interaction. Available values are <i>Phone Call</i>, <i>Meeting</i>, <i>Mailing</i>, <i>Email</i>, and <i>Task/Other</i>. This property cannot be set to null.
          type: string
        completed:
          description: Indicates whether the action is complete. If the system is configured to use custom action statuses, this value is based on the action status value. This property defaults to <i>false</i> if no value is provided.
          type: boolean
        completed_date:
          format: date-time
          description: 'The date when the action was completed. Uses <a href="https://tools.ietf.org/html/rfc3339">ISO-8601 format: </a><i>1969-11-21T10:29:43</i>.'
          type: string
          x-supports-datetime-offset: false
        date:
          format: date-time
          description: 'The action date. Uses <a href="https://tools.ietf.org/html/rfc3339">ISO-8601 format: </a><i>1969-11-21T10:29:43</i>. This property cannot be set to null.'
          type: string
          x-supports-datetime-offset: false
        description:
          description: The detailed explanation that elaborates on the action summary.
          type: string
        direction:
          description: The direction of the action. Available values are <i>Inbound</i> and <i>Outbound</i>.
          enum:
          - Inbound
          - Outbound
          type: string
        end_time:
          description: The end time of the action. Uses 24-hour time in the <i>HH:mm</i> format. For example, 17:30 represents 5:30 p.m.
          type: string
        fundraisers:
          description: The set of immutable constituent system record IDs for the fundraisers associated with the action.
          type: array
          items:
            type: string
        location:
          description: The location of the action. Available values are the entries in the <a href="https://developer.sky.blackbaud.com/docs/services/56b76470069a0509c8f1c5b3/operations/ListActionLocations"><b>Action Locations</b></a> table.
          type: string
        opportunity_id:
          description: The immutable system record ID of the opportunity associated with the action.
          type: string
        outcome:
          description: The outcome of the action. Available values are <i>Successful</i> and <i>Unsuccessful</i>.
          enum:
          - Successful
          - Unsuccessful
          type: string
        priority:
          description: The priority of the action. Available values are <i>Normal</i>, <i>High</i>, and <i>Low</i>. The default is <i>Normal</i>.
          enum:
          - Normal
          - High
          - Low
          type: string
        start_time:
          description: The start time of the action. Uses 24-hour time in the <i>HH:mm</i> format. For example, 17:30 represents 5:30 p.m.
          type: string
        status:
          description: 'The action status. If the system is configured to use custom action statuses, available values are the entries in the <a href="https://developer.sky.blackbaud.com/docs/services/56b76470069a0509c8f1c5b3/operations/ListActionStatusTypes"><b>Action Status</b></a> table. If not, this field computes the status based on the <code>completed</code> and <code>date</code> properties: If an action is not completed and has a current or future date, the status is Open; if an action is not completed and has a past date, the status is Past due; and if an action is completed, the status is Completed.'
          type: string
        summary:
          description: 'The short description of the action that appears at the top of the record. Character limit: 255.'
          maxLength: 255
          minLength: 0
          type: string
        type:
          description: Additional description of the action to complement the category. Available values are the entries in the <a href="https://developer.sky.blackbaud.com/docs/services/56b76470069a0509c8f1c5b3/operations/ListActionTypes"><b>Actions</b></a> table.
          type: string
        campaign_id:
          description: The immutable system record ID of the campaign associated with the action. For a list of valid campaigns, see the <a href="https://developer.sky.blackbaud.com/docs/services/58bdd6b2d7dcde06046081d7/operations/ListCampaigns"><b>Fundraising (Campaign)</b></a> API.
          type: string
        fund_id:
          description: The immutable system record ID of the fund associated with the action. For a list of valid funds, see the <a href="https://developer.sky.blackbaud.com/docs/services/58bdd6b2d7dcde06046081d7/operations/ListFunds"><b>Fundraising (Fund)</b></a> API.
          type: string
        appeal_id:
          description: The immutable system record ID of the appeal associated with the action. For a list of valid appeals, see the <a href="https://developer.sky.blackbaud.com/docs/services/58bdd6b2d7dcde06046081d7/operations/ListAppeals"><b>Fundraising (Appeal)</b></a> API.
          type: string
        issue:
          description: The issue associated with the action. Available values are the entries in the <a href="https://developer.sky.blackbaud.com/docs/services/56b76470069a0509c8f1c5b3/operations/ListCodeTableEntries"><b>Action Issues</b></a> code table.
          type: string
        letter_code:
          description: The letter code associated with the action. Available values are the entries in the <a href="https://developer.sky.blackbaud.com/docs/services/56b76470069a0509c8f1c5b3/operations/ListCodeTableEntries"><b>Action Letter Codes</b></a> code table.
          type: string
