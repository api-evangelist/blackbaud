openapi: 3.2.0
info:
  title: Blackbaud Organizations API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Organizations across 4 of this provider''s published API definitions: blackbaud-altru-constituent-api-openapi.yml, blackbaud-crm-constituent-api-openapi.yml, blackbaud-education-core-api-openapi.yml, blackbaud-grantmaking-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/alt-conmg
- url: https://api.sky.blackbaud.com/crm-conmg
- url: https://api.sky.blackbaud.com/afe-edcor
- url: https://api.sky.blackbaud.com/grantmaking
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Organizations
paths:
  /organizations:
    post:
      operationId: CreateOrganization
      summary: Create an organization
      description: This operation is used to add organizations, including biographical, constituency and contact inoperationation.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrganization'
            example:
              name: ''
              web_address: ''
              picture: ''
              picture_thumbnail: ''
              industry: ''
              num_employees: 0
              num_subsidiaries: 0
              parent_corp_id: ''
              address_type: ''
              address_block: ''
              address_city: ''
              address_state: ''
              address_postcode: ''
              address_country: ''
              address_do_not_mail: false
              address_do_not_mail_reason: ''
              phone_type: ''
              phone_number: ''
              email_address_type: ''
              email_address: ''
              skip_adding_security_groups: false
              zip_lookup_countries:
              - country_id: ''
                country_name: ''
              omit_from_validation: false
              dpc: ''
              cart: ''
              lot: ''
              county: ''
              congressional_district: ''
              last_validation_attempt_date: ''
              validation_message: ''
              certification_data: 0
              validation_countries:
              - country_id: ''
                browsable: false
              is_primary: false
              skip_adding_sites: false
              info_source: ''
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully creates the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Organizations
    servers:
    - url: https://api.sky.blackbaud.com/alt-conmg
  /organizations/{constituent_id}:
    patch:
      operationId: EditOrganization
      summary: Edit an organization
      description: Organization constituent edit operation for gift data entry
      parameters:
      - name: constituent_id
        in: path
        required: true
        schema:
          type: string
        description: The constituent id.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditOrganization'
            example:
              organization_name: ABC Learning Center
              industry: Education
              num_employees: 20
              num_subsidiaries: 2
              parent_corp_id: ''
              picture: ''
              picture_thumbnail: ''
              picture_changed: false
              web_address: ''
              is_primary: false
              primary_address_id: 4811c284-31b1-4ba1-a94b-424687975bda
              address_type: Business
              address_country: United States
              address_block: 29 Hitch Avenue
              address_city: Morgan
              address_state: UT
              address_postcode: '84050'
              address_do_not_mail: false
              address_do_not_mail_reason: ''
              primary_phone_id: 88f5c331-b465-413c-b955-976ec018beb5
              phone_type: Business
              phone_number: 801-557-2819
              primary_email_address_id: ''
              email_address_type: ''
              email_address: ''
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully edits the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to edit the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Organizations
    get:
      operationId: GetOrganization
      summary: Get an organization
      description: Organization constituent edit operation for gift data entry
      parameters:
      - name: constituent_id
        in: path
        required: true
        schema:
          type: string
        description: The constituent id.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to get the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Organizations
    servers:
    - url: https://api.sky.blackbaud.com/alt-conmg
  /v1/organizations:
    get:
      operationId: V1OrganizationsGet
      summary: Organization list (Get) (PREVIEW)
      description: 'Returns a collection of organizations and schools.


        Requires "All School" permission.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: type
        in: query
        required: false
        schema:
          type: string
        description: 'Limits results to organization of the specified type (Allowed values: School, Referring, Third party payer). Optional.'
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
        description: Set to true to include inactive organizations. Defaults to false.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: '1000'
        description: Represents the number of records to return. The default is 1000. The maximum is 5000.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip. The default is 0. For use with pagination.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationReadCollection'
              example:
                count: 2
                next_link: /v1/organizations?limit=2&offset=2
                values:
                - id: 1
                  name: Nottower School
                  active: true
                  address:
                    line1: 123 Red Brick Rd.
                    line2: Building 200
                    city: Pleasantville
                    country: United States
                    state: MA
                    province_county: Duncan
                    post_code: '11111'
                  is_referring_org: false
                  is_third_party_payer: false
                  is_transfer_school: true
                  transfer_school:
                    include_on_inquiry_forms: true
                    is_decline_choice: true
                    type:
                      id: 1
                      description: 4-Year College
                  primary_contact:
                    name: Sally Struthers
                    title: Registrar
                    phone: 555-555-5555
                    email: sally@example.com
                    fax: 555-555-5555
                  secondary_contact:
                    name: John Smith
                    title: Assistant Registrar
                    phone: 555-555-5556
                    email: john@example.com
                    fax: 555-555-5556
                - id: 2
                  name: State University
                  active: true
                  address:
                    line1: 456 Campus Drive
                    city: College Town
                    country: United States
                    state: NY
                    post_code: '22222'
                  is_referring_org: false
                  is_third_party_payer: false
                  is_transfer_school: false
                  primary_contact:
                    name: Jane Doe
                    title: Director of Admissions
                    phone: 555-555-5557
                    email: jane@university.edu
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationProblemDetails'
              example:
                errors: {}
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The date field is required.
                values:
                  date: null
      tags:
      - Organizations
    servers:
    - url: https://api.sky.blackbaud.com/afe-edcor
  /api/v1/organizations/classifications:
    get:
      operationId: GetOrganizationClassifications
      summary: Gets the classifications for Organizations
      description: Fetches the coding tables associated with the Organizations. Includes coding sheet properties when applicable.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationResponse'
              example:
                classifications:
                - code_table_id: 0
                  code_table:
                  - id: 0
                    code: string
                    description: string
                    description_with_code: string
                    full_path_description_code: string
                    full_path_description: string
                    depth: 0
                    parent_id: 0
                    is_active: true
                    full_path: string
                    full_path_with_code: string
      tags:
      - Organizations
    servers:
    - url: https://api.sky.blackbaud.com/grantmaking
