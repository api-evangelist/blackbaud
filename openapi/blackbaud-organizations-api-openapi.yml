components:
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          description: A URI reference [RFC3986] that identifies the problem type. This specification encourages that, when dereferenced, it provide human-readable documentation for the problem type (e.g., using HTML [W3C.REC-html5-20141028]). When this member is not present, its value is assumed to be "about:blank".
        title:
          type: string
          description: A short, human-readable summary of the problem type. It SHOULD NOT change from occurrence to occurrence of the problem, except for purposes of localization (e.g., using proactive content negotiation; see [RFC7231], Section 3.4).
        status:
          type: integer
          description: The HTTP status code ([RFC7231], Section 6) generated by the origin server for this occurrence of the problem.
          format: int32
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        instance:
          type: string
          description: A URI reference that identifies the specific occurrence of the problem. It may or may not yield further information if dereferenced.
        trace_id:
          type: string
          description: A request ID that can be provided to Blackbaud Support that may help with further troubleshooting.
        span_id:
          type: string
          description: A request ID that can be provided to Blackbaud Support that may help with further troubleshooting.
      additionalProperties: false
      description: A machine-readable format for specifying errors in HTTP API responses based on https://tools.ietf.org/html/rfc7807.
      x-display-name: Problem details
      x-display-id: ProblemDetails
    NewOrganization:
      required:
      - name
      type: object
      properties:
        name:
          maxLength: 100
          minLength: 0
          type: string
          description: The name.
        web_address:
          type: string
          description: The website.
        picture:
          type: string
          description: The image.
        picture_thumbnail:
          type: string
          description: The picture thumbnail.
        industry:
          type: string
          description: The industry. This code table can be queried at https://api.sky.blackbaud.com/alt-adnmg/codetables/industrycode/entries
        num_employees:
          type: integer
          description: The no. of employees.
          format: int32
        num_subsidiaries:
          type: integer
          description: The no. of subsidiary orgs.
          format: int32
        parent_corp_id:
          type: string
          description: The parent org.
        address_type:
          type: string
          description: The address type. This code table can be queried at https://api.sky.blackbaud.com/alt-adnmg/codetables/addresstypecode/entries
        address_block:
          maxLength: 150
          minLength: 0
          type: string
          description: The address.
        address_city:
          maxLength: 50
          minLength: 0
          type: string
          description: The city.
        address_state:
          type: string
          description: The state. This simple list can be queried at https://api.sky.blackbaud.com/alt-adnmg/simplelists/7fa91401-596c-4f7c-936d-6e41683121d7?parameters=country_id,{address_countryid}.
        address_postcode:
          maxLength: 12
          minLength: 0
          type: string
          description: The zip.
        address_country:
          type: string
          description: The country. This simple list can be queried at https://api.sky.blackbaud.com/alt-adnmg/simplelists/c9649672-353d-42e8-8c25-4d34bbabfbba.
        address_do_not_mail:
          type: boolean
          description: Indicates whether do not send mail to this address.
        address_do_not_mail_reason:
          type: string
          description: The reason. This code table can be queried at https://api.sky.blackbaud.com/alt-adnmg/codetables/donotmailreasoncode/entries
        phone_type:
          type: string
          description: The phone type. This code table can be queried at https://api.sky.blackbaud.com/alt-adnmg/codetables/phonetypecode/entries
        phone_number:
          maxLength: 100
          minLength: 0
          type: string
          description: The phone number.
        email_address_type:
          type: string
          description: The email type. This code table can be queried at https://api.sky.blackbaud.com/alt-adnmg/codetables/emailaddresstypecode/entries
        email_address:
          maxLength: 100
          minLength: 0
          type: string
          description: The email address.
        skip_adding_security_groups:
          type: boolean
          description: Indicates whether skip adding security groups.
        zip_lookup_countries:
          type: array
          items:
            $ref: '#/components/schemas/NewOrganizationZipLookupCountries'
          description: Zip lookup countries.
        omit_from_validation:
          type: boolean
          description: Indicates whether omit from validation.
        dpc:
          maxLength: 8
          minLength: 0
          type: string
          description: The dpc.
        cart:
          maxLength: 10
          minLength: 0
          type: string
          description: The cart.
        lot:
          maxLength: 5
          minLength: 0
          type: string
          description: The lot.
        county:
          type: string
          description: The county. This code table can be queried at https://api.sky.blackbaud.com/alt-adnmg/codetables/countycode/entries
        congressional_district:
          type: string
          description: The congressional district. This code table can be queried at https://api.sky.blackbaud.com/alt-adnmg/codetables/congressionaldistrictcode/entries
        last_validation_attempt_date:
