        certification_data:
          type: integer
          description: The certification data.
          format: int32
        validation_countries:
          type: array
          items:
            $ref: '#/components/schemas/NewOrganizationValidationCountries'
          description: Validation countries.
        is_primary:
          type: boolean
          description: Indicates whether this is a primary organization.
        skip_adding_sites:
          type: boolean
          description: Indicates whether skip adding sites.
        info_source:
          type: string
          description: The information source. This code table can be queried at https://api.sky.blackbaud.com/alt-adnmg/codetables/infosourcecode/entries
      additionalProperties: false
      description: CreateOrganization
      example:
        name: ''
        web_address: ''
        picture: ''
        picture_thumbnail: ''
        industry: ''
        num_employees: 0
        num_subsidiaries: 0
        parent_corp_id: ''
        address_type: ''
        address_block: ''
        address_city: ''
        address_state: ''
        address_postcode: ''
        address_country: ''
        address_do_not_mail: false
        address_do_not_mail_reason: ''
        phone_type: ''
        phone_number: ''
        email_address_type: ''
        email_address: ''
        skip_adding_security_groups: false
        zip_lookup_countries:
        - country_id: ''
          country_name: ''
        omit_from_validation: false
        dpc: ''
        cart: ''
        lot: ''
        county: ''
        congressional_district: ''
        last_validation_attempt_date: ''
        validation_message: ''
        certification_data: 0
        validation_countries:
        - country_id: ''
