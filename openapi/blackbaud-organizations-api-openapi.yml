      x-display-name: validation_countries
      x-display-id: validation_countries
    EditOrganization:
      type: object
      properties:
        organization_name:
          maxLength: 100
          minLength: 0
          type: string
          description: The name.
        industry:
          type: string
          description: The industry. This code table can be queried at https://api.sky.blackbaud.com/alt-adnmg/codetables/industrycode/entries
        num_employees:
          type: integer
          description: The no. of employees.
          format: int32
        num_subsidiaries:
          type: integer
          description: The no. of subsidiary orgs.
          format: int32
        parent_corp_id:
          type: string
          description: The parent org.
        picture:
          type: string
          description: The image.
        picture_thumbnail:
          type: string
          description: The image thumbnail.
        picture_changed:
