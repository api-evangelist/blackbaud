          type: string
        description: fullname
      - name: lookupid
        in: query
        required: false
        schema:
          type: string
        description: lookup id
      - name: addressblock
        in: query
        required: false
        schema:
          type: string
        description: address
      - name: city
        in: query
        required: false
        schema:
          type: string
        description: city
      - name: state
        in: query
        required: false
