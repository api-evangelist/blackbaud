              form_1099_box_numbers:
              - number: 01 - Rents
                state: SC
                amount: 60
        description: The changes for the credit memo.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the identifier of the specified credit memo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Int32CreatedResult'
              example:
                record_id: 843
        '403':
          description: Returned when the user does not have permission to edit the credit memo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
        '404':
          description: Returned when the specified credit memo is not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Creditmemos
components:
  schemas:
    DomainErrorMessage:
      type: object
      properties:
        Error:
          type:
          - string
          - 'null'
        Details:
          type:
          - array
          - 'null'
          items:
            type: string
        ErrorPath:
          type:
          - string
          - 'null'
      additionalProperties: false
    InvoiceBoxNumber:
      type: object
      properties:
        number:
          type:
          - string
          - 'null'
          description: The number for the box number.
        state:
          type:
          - string
          - 'null'
          description: The reporting state for the box number.
        amount:
          type:
          - number
          - 'null'
          description: The amount for the box number.
          format: decimal
      additionalProperties: false
      description: The contract for invoice box number.
    CustomFieldDataType:
      title: CustomFieldDataType
      enum:
      - Text
      - Number
      - DateTime
      - Currency
      - Boolean
      - Table
      - FuzzyDate
      type: string
    BasicErrorMessage:
      type: object
      properties:
        Error:
          type:
          - string
          - 'null'
      additionalProperties: false
    CreditMemoInvoiceApplicationDetail:
      type: object
      properties:
        invoice_id:
          type: integer
          description: The invoice identifier for this application.
          format: int32
        invoice_number:
          type:
          - string
          - 'null'
          description: The number of this invoice.
        invoice_amount:
          type: number
          description: The total amount for this invoice.
          format: decimal
        invoice_balance:
          type: number
          description: The remaining balance of this invoice.
          format: decimal
        credit_memo_amount_applied:
          type: number
          description: The credit memo amount applied to this invoice.
          format: decimal
        post_date:
          type:
          - string
          - 'null'
          description: The post date of this invoice application.
          format: date-time
      additionalProperties: false
    CreditMemoInvoiceApplicationSummary:
      type: object
      properties:
        invoice_number:
          type:
          - string
          - 'null'
          description: The number of this invoice.
        invoice_date:
          type: string
          description: The date of this invoice.
          format: date-time
        credit_memo_amount_applied:
          type: number
          description: The credit memo amount applied to this invoice.
          format: decimal
        invoice_id:
          type:
          - integer
          - 'null'
          description: The invoice identifier for this application.
          format: int32
      additionalProperties: false
    Int32CreatedResult:
      type: object
      properties:
        record_id:
          type: integer
          format: int32
      additionalProperties: false
    CreditMemoDetail:
      required:
      - amount
      type: object
      properties:
        credit_memo_id:
          type: integer
          description: The credit memo identifier.
          format: int32
        vendor_id:
          type: integer
          description: The id of the vendor for this credit memo.
          format: int32
        vendor_name:
          type:
          - string
          - 'null'
          description: The name of the vendor for this credit memo.
        date:
          type:
          - string
          - 'null'
          description: The date for the credit memo.
          format: date-time
        reversal_date:
          type:
          - string
          - 'null'
          description: The reversal date for the credit memo.
          format: date-time
        amount:
          type: number
          description: The amount of this credit memo.
          format: decimal
        credit_applied:
          type:
          - number
          - 'null'
          description: The credit amount applied from this credit memo.
          format: decimal
        credit_remaining:
          type:
          - number
          - 'null'
          description: The credit amount remaining from this credit memo.
          format: decimal
        credit_memo_number:
          type:
          - string
          - 'null'
          description: The credit memo number.
        description:
          type:
          - string
          - 'null'
          description: The description for this credit memo.
        status:
          $ref: '#/components/schemas/CreditMemoStatus'
        post_status:
          $ref: '#/components/schemas/PostStatus'
        post_date:
          type:
          - string
          - 'null'
          description: The post date for this credit memo.
          format: date-time
        distributions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Distribution'
          description: The distributions of this credit memo.
        custom_fields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CustomField'
          description: The custom fields on this credit memo.
        invoice_applications:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CreditMemoInvoiceApplicationDetail'
          description: The invoice applications for this credit memo.
        form_1099_box_numbers:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/InvoiceBoxNumber'
          description: The form 1099 box numbers credit memo.
        date_added:
          type:
          - string
          - 'null'
          description: The created date of the credit memo.
          format: date-time
        date_modified:
          type:
          - string
          - 'null'
          description: The modified date of the credit memo.
          format: date-time
        added_by:
          type:
          - string
          - 'null'
          description: The creator of the credit memo.
        modified_by:
          type:
          - string
          - 'null'
          description: The modifier of the credit memo.
      additionalProperties: false
      description: Class for credit memo summary contract
    CreateCreditMemoInvoiceApplication:
      required:
      - credit_memo_amount_to_apply
      - invoice_id
      - post_date
      type: object
      properties:
        credit_memo_amount_to_apply:
          type: number
          description: The credit amount to apply to the invoice.
          format: decimal
        invoice_id:
          type: integer
          description: The invoice to apply to.
          format: int32
        post_date:
          type: string
          description: The post date of the application.
          format: date-time
      additionalProperties: false
      description: Create invoice application
    CreateCreditMemo:
      required:
      - amount
      - date
      - distributions
      - post_date
      - vendor_id
      type: object
      properties:
        vendor_id:
          type: integer
          description: The identifier for the vendor to make the credit memo.
          format: int32
        date:
          type: string
          description: The date for the credit memo.
          format: date-time
        amount:
          type: number
          description: The amount of this credit memo.
          format: decimal
        credit_memo_number:
          maxLength: 2147483647
          minLength: 1
          type:
          - string
          - 'null'
          description: The credit memo number.
        description:
          type:
          - string
          - 'null'
          description: The description for this credit memo.
        post_status:
          $ref: '#/components/schemas/PostStatus'
        post_date:
          type: string
          description: The post date for this credit memo.
          format: date-time
        invoice_applications:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CreateCreditMemoInvoiceApplication'
          description: The invoice applications of this credit memo.
        distributions:
          type: array
          items:
            $ref: '#/components/schemas/CreateDistribution'
          description: The distributions of this credit memo.
        custom_fields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CreateCustomField'
          description: The custom fields on this credit memo.
        form_1099_box_numbers:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/InvoiceBoxNumber'
          description: The 1099 box numbers on this credit memo.
      additionalProperties: false
      description: Contract for creating credit memo.
    DistributionSplit:
      required:
      - transaction_code_values
      type: object
      properties:
        distribution_split_id:
          type: integer
          description: The distribution split identifier.
          format: int32
        ui_project_id:
          type:
          - string
          - 'null'
          description: The user-visible identifier of the project.
        transaction_code_values:
          type: array
          items:
            $ref: '#/components/schemas/TransactionCodeValue'
          description: The distribution transaction code values. The values should be in the same order as the codes defined in the database.
        amount:
          type:
          - number
          - 'null'
          description: The distribution journal entry amount. Only one of Amount or Percent can be specified.
          format: decimal
        percent:
          type:
