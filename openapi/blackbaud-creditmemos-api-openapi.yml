    delete:
      operationId: DeleteCreditMemo
      summary: Credit memo (Delete)
      description: Delete a credit memo if applicable.
      parameters:
      - name: credit_memo_id
        in: path
        required: true
        schema:
          type: integer
        description: The identifier of the credit memo to delete.
      responses:
        '200':
          description: Returned when the operation is successful.
        '400':
          description: Returned when specified credit memo cannot be deleted in its current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Invalid Request
                Details:
                - The value 'fake' is not valid for transaction_status.
        '403':
          description: Returned when the user does not have permission to remove credit memos, the credit memo has been posted, or the credit memo has invoice applications.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
        '404':
          description: Returned when no journal entry batch is found with the specified ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Creditmemos
    patch:
      operationId: EditCreditMemo
      summary: Credit memo (Edit)
      description: Edits an existing credit memo.
      parameters:
      - name: credit_memo_id
        in: path
        required: true
        schema:
          type: integer
        description: The identifier of the credit memo to edit.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditCreditMemo'
            example:
              vendor_id: 24
              date: '2019-04-22T12:00:00Z'
              amount: 500
              credit_memo_number: '8675309'
              description: Example edit credit memo
              post_status: DoNotPost
