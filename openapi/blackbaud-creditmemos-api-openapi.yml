                  transaction_code_values:
                  - name: Grants
                    value: None
                    id: 0
                    inactive: false
                  amount: 500
                  percent: 100
                  account_class: string
                amount: 500
                account_number: 01-5000-00
                type_code: Credit
                custom_fields: []
