openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: Accounts Payable Creditmemos API'
  description: This API is used to manage accounts payable, including vendors and invoices.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/57a342f1d7dcde1c28a749fe
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/accountspayable/v1
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Creditmemos
paths:
  /creditmemos:
    post:
      operationId: CreateCreditMemo
      summary: Credit memo (Create)
      description: Creates a credit memo, and returns the id of the created credit memo.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCreditMemo'
            example:
              vendor_id: 1214
              date: '2019-03-20T12:00:00Z'
              amount: 100
              credit_memo_number: '8439712005'
              description: my description
              post_status: DoNotPost
              post_date: '2019-03-20T12:00:00Z'
              invoice_applications:
              - credit_memo_amount_to_apply: 50
                invoice_id: 1245
                post_date: '2019-03-20T12:00:00Z'
              distributions:
              - distribution_id: 0
                distribution_splits:
                - distribution_split_id: 0
                  ui_project_id: '1100'
                  transaction_code_values:
                  - name: Grants
                    value: None
                    id: 1
                    inactive: false
                  amount: 100
                  percent: 100
                  account_class: Unrestricted Net Assets
                amount: 100
                account_number: 01-1000-00
                type_code: Debit
                custom_fields: []
              - distribution_id: 0
                distribution_splits:
                - distribution_split_id: 0
                  ui_project_id: '1100'
                  transaction_code_values:
                  - name: Grants
                    value: None
                    id: 1
                    inactive: false
                  amount: 100
                  percent: 100
                  account_class: Unrestricted Net Assets
                amount: 100
                account_number: 01-2000-00
                type_code: Credit
                custom_fields: []
              custom_fields:
              - field_name: Location
                value: AD - Administration building
                comments: my custom fields comments
                date: '2019-03-20T12:00:00Z'
              form_1099_box_numbers:
              - number: 01 - Rents
                state: SC
                amount: 60
        description: The credit memo to create. Note that invoices must have paired distributions where every debit distribution has a matching credit distribution of the same amount.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the ID of the created credit memo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Int32CreatedResult'
              example:
                record_id: 843
        '400':
          description: Returned when the request is not in the correct format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Failed to save {record}
                Details:
                - The total percent distributed must equal 100%.
        '403':
          description: Returned when the user does not have permission to create a credit memo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Creditmemos
    get:
      operationId: ListCreditMemos
      summary: Credit memos (List)
      description: Returns a list of credit memos.
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: "Represents the number of records to return. \nThe default is 100. \nThe maximum allowed value is 500."
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: "Represents the number of records to skip. \nFor use with pagination."
      - name: vendor_name
        in: query
        required: false
        schema:
          type: string
        description: Filter by vendor name.
      - name: post_status
        in: query
        required: false
        schema:
          type: string
          enum:
          - DoNotPost
          - NotYetPosted
          - Posted
        description: Filter by credit memo post status.
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - Applied
          - Unapplied
          - PartiallyApplied
          - Deleted
        description: Filter by credit memo status.
      - name: from_date
        in: query
        required: false
        schema:
          type: string
        description: Represents a filter for results added on or after the specified date.
      - name: to_date
        in: query
        required: false
        schema:
          type: string
        description: Represents a filter for results added on or after the specified date.
      - name: from_post_date
        in: query
        required: false
        schema:
          type: string
        description: Represents a filter for results posted on or after the specified date.
      - name: to_post_date
        in: query
        required: false
        schema:
          type: string
        description: Represents a filter for results posted on or after the specified date.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the list of credit memos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditMemoSummaryApiCollection'
              example:
                count: 2
                value:
                - credit_memo_id: 183
                  vendor_id: 1031
                  vendor_name: A+ Office Supplies
                  date: '2017-08-31T12:00:00Z'
                  description: my description
                  status: Applied
                  amount: 150
                  balance: 0
                  number: '545464'
                  post_status: NotYetPosted
                  post_date: '2017-08-31T12:00:00Z'
                  invoice_applications:
                  - invoice_number: '9712009'
                    invoice_date: '2019-01-25T12:00:00Z'
                    credit_memo_amount_applied: 50
                    invoice_id: 4561
                  - invoice_number: '9712008'
                    invoice_date: '2019-01-19T12:00:00Z'
                    credit_memo_amount_applied: 100
                    invoice_id: 185973
                  date_added: '2017-08-31T12:57:58Z'
                  date_modified: '2019-03-20T03:01:52Z'
                  added_by: BentonAu
                  modified_by: Supervisor
                - credit_memo_id: 184
                  vendor_id: 1031
                  vendor_name: A+ Office Supplies
                  date: '2017-08-31T12:00:00Z'
                  description: my description
                  status: Applied
                  amount: 150
                  balance: 0
                  number: '545464'
                  post_status: NotYetPosted
                  post_date: '2017-08-31T12:00:00Z'
                  invoice_applications:
                  - invoice_number: '9712006'
                    invoice_date: '2019-01-25T12:00:00Z'
                    credit_memo_amount_applied: 50
                    invoice_id: 4563
                  - invoice_number: '9712009'
                    invoice_date: '2019-01-19T12:00:00Z'
                    credit_memo_amount_applied: 100
                    invoice_id: 4891
                  date_added: '2017-09-01T12:57:58Z'
                  date_modified: '2019-03-20T03:01:52Z'
                  added_by: BentonAu
                  modified_by: Supervisor
        '400':
          description: Returned when the request is not in the correct format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Failed to save {record}
                Details:
                - The total percent distributed must equal 100%.
        '403':
          description: Returned when the user does not have permission to view credit memos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Creditmemos
  /creditmemos/customfields:
    get:
      operationId: ListCreditMemoCustomFields
      summary: Credit memo custom field (List)
      description: Returns a list of custom field options.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the list of custom fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldOptionsPagedResponse'
              example:
                count: 3
                results:
                - custom_field_id: 1
                  name: Solicit for Donations
                  type: Boolean
                  is_required: false
                - custom_field_id: 45
                  name: Demo Custom Field
                  type: Table
                  is_required: false
                  table_values:
                  - d1 - Demo 1
                  - d2 - Demo 2
                - custom_field_id: 2
                  name: Member\Volunteer
                  type: Boolean
                  is_required: false
      tags:
      - Creditmemos
  /creditmemos/{credit_memo_id}:
    get:
      operationId: GetCreditMemo
      summary: Credit memo
      description: Returns detailed credit memo information.
      parameters:
      - name: credit_memo_id
        in: path
        required: true
        schema:
          type: integer
        description: The identifier of the credit memo to retrieve.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the specified credit memo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditMemoDetail'
              example:
                credit_memo_id: 183
                vendor_id: 31
                vendor_name: A+ Office Supplies
                date: '2017-08-31T12:00:00Z'
                amount: 150
                credit_applied: 150
                credit_remaining: 0
                credit_memo_number: '8435779966'
                description: my description
                status: Applied
                post_status: NotYetPosted
                post_date: '2017-08-31T12:00:00Z'
                distributions:
                - distribution_id: 140738
                  distribution_splits:
                  - distribution_split_id: 161971
                    ui_project_id: '1100'
                    transaction_code_values:
                    - name: Grants
                      value: None
                      id: 1
                      inactive: false
                    - name: Spendable/Non-Spendable
                      value: Spendable
                      id: 2
                      inactive: false
                    - name: Performance
                      value: ''
                      id: 3
                      inactive: false
                    - name: The Raiser's Edge
                      value: ''
                      id: 4
                      inactive: false
                    - name: ''
                      value: ''
                      id: 0
                      inactive: false
                    amount: 150
                    percent: 100
                    account_class: Unrestricted Net Assets
                  amount: 150
                  account_number: 01-5410-00
                  type_code: Credit
                  custom_fields: []
                - distribution_id: 140739
                  distribution_splits:
                  - distribution_split_id: 161972
                    ui_project_id: ''
                    transaction_code_values:
                    - name: Grants
                      value: None
                      id: 1
                      inactive: false
                    - name: Spendable/Non-Spendable
                      value: Spendable
                      id: 2
                      inactive: false
                    - name: Performance
                      value: ''
                      id: 3
                      inactive: false
                    - name: The Raiser's Edge
                      value: ''
                      id: 4
                      inactive: false
                    - name: ''
                      value: ''
                      id: 0
                      inactive: false
                    amount: 150
                    percent: 100
                    account_class: Unrestricted Net Assets
                  amount: 150
                  account_number: 01-2000-00
                  type_code: Debit
                  custom_fields: []
                custom_fields: []
                invoice_applications:
                - invoice_id: 4545
                  invoice_number: '9712009'
                  invoice_amount: 100
                  invoice_balance: 0
                  credit_memo_amount_applied: 100
                  post_date: '2019-01-25T12:00:00Z'
                - invoice_id: 4546
                  invoice_number: '9712006'
                  invoice_amount: 100
                  invoice_balance: 50
                  credit_memo_amount_applied: 50
                  post_date: '2019-01-25T12:00:00Z'
                form_1099_box_numbers:
                - number: 3 -Other income
                  state: SC
                  amount: 60
                date_added: '2017-08-31T12:57:58Z'
                date_modified: '2019-01-25T10:29:31Z'
                added_by: BentonAu
                modified_by: Supervisor
        '403':
          description: Returned when the user does not have permission to view the specified credit memo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
        '404':
          description: Returned when no credit memo is found with the specified ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
