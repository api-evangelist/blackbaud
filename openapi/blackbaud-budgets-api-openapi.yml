openapi: 3.2.0
info:
  title: Blackbaud Budgets API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Budgets across 2 of this provider''s published API definitions: blackbaud-general-ledger-api-openapi.yml, blackbaud-grantsconnect-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/generalledger/v1
- url: https://api.sky.blackbaud.com/grants-connect
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Budgets
paths:
  /budgets:
    post:
      operationId: CreateBudget
      summary: Budget (Create)
      description: Returns the identifier for the newly created budget scenario.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBudget'
            example:
              scenario_id: Scenario2
              start_period: 1
              end_period: 3
              start_fiscal_year: '2018'
              end_fiscal_year: '2018'
              budget_type: PeriodRange
              lines:
              - account_number: 01-1000-00
                project_id: '1100'
                grant_description: None
                notes: Some note
                total: 30
                periods:
                - amount: 10
                  sequence: 1
                  year_id: '2018'
                - amount: 10
                  sequence: 2
                  year_id: '2018'
                - amount: 10
                  sequence: 3
                  year_id: '2018'
        description: The budget scenario to create.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the identifier for the new budget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedResult_Int32'
              example:
                record_id: 843
        '400':
          description: Returned when specified journal entries are not in the correct format or are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Failed to save {record}
                Details:
                - The total percent distributed must equal 100%.
                ErrorPath: null
        '403':
          description: Returned when the user does not have permission to create budgets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Budgets
    get:
      operationId: ListBudgets
      summary: Budget (List)
      description: Returns a top level overview of every budget scenario.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains budget views.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection_BudgetScenarioView'
              example:
                count: 121
                value:
                - budget_scenario_id: 368
                  description: 5% Above Operating Cost
                  start_fiscal_year: '2015'
                  end_fiscal_year: '2015'
                  start_date: '2015-01-01T00:00:00Z'
                  end_date: '2015-12-31T00:00:00Z'
                  status: Active
                  budget_type: FiscalYear
                  locked: Unlocked
                  scenario_id: '11'
                - budget_scenario_id: 367
                  description: 5% Above Operating Cost
                  start_fiscal_year: '2018'
                  end_fiscal_year: '2018'
                  start_date: '2018-01-01T00:00:00Z'
                  end_date: '2018-12-31T00:00:00Z'
                  status: Active
                  budget_type: FiscalYear
                  locked: Unlocked
                  scenario_id: '11'
        '403':
          description: Returned when the user does not have permission to view budgets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Budgets
    servers:
    - url: https://api.sky.blackbaud.com/generalledger/v1
  /budgets/scenarios:
    post:
      operationId: CreateBudgetScenario
      summary: Budget scenario (Create)
      description: Returns the identifier for the newly created scenario id.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScenarioId'
            example:
              value: Scenario3
              description: New scenario id
              status: Active
        description: The budget scenario id to create.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the identifier for the new scenario id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedResult_Int32'
              example:
                record_id: 843
        '400':
          description: Returned when specified journal entries are not in the correct format or are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Invalid Request
                Details:
                - The value 'fake' is not valid for transaction_status.
                ErrorPath: null
        '403':
          description: Returned when the user does not have permission to create budget scenarios.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Budgets
    get:
      operationId: ListBudgetScenarios
      summary: Budget scenario (List)
      description: Returns details for every scenario ID.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains budget details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection_ScenarioId'
              example:
                count: 37
                value:
                - id: 2016
                  value: '123456'
                  description: '321654897'
                  inactive: false
                - id: 2011
                  value: Benton
                  description: Benton
                  inactive: false
                - id: 2013
                  value: db1
                  description: db2
                  inactive: false
        '403':
          description: Returned when the user does not have permission to view budgets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Budgets
    servers:
    - url: https://api.sky.blackbaud.com/generalledger/v1
  /budgets/{scenario_id}:
    patch:
      operationId: EditBudget
      summary: Budget (Edit)
      description: Returns the identifier for the newly edited budget scenario.
      parameters:
      - name: scenario_id
        in: path
        required: true
        schema:
          type: integer
        description: The identifier for the budget scenario.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditBudgetLineArray'
            example:
            - account_number: 01-1000-00
              project_id: '1100'
              grant_description: None
              total: 30
              periods:
              - amount: 10
                sequence: 1
                year_id: '2018'
              - amount: 10
                sequence: 2
                year_id: '2018'
              - amount: 10
                sequence: 3
                year_id: '2018'
              notes: Some note
        description: The new lines for a budget scenario.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the identifier for the edited budget.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedResult_Int32'
              example:
                record_id: 843
        '400':
          description: Returned when specified budget lines are not in the correct format or are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Invalid Request
                Details:
                - The value 'fake' is not valid for transaction_status.
                ErrorPath: null
        '403':
          description: Returned when the user does not have permission to edit budgets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
        '404':
          description: Returned when no budget is found with the specified ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Budgets
    get:
      operationId: GetBudget
      summary: Budget (Get)
      description: Returns details for every fiscal period in a budget scenario.
      parameters:
      - name: scenario_id
        in: path
        required: true
        schema:
          type: integer
        description: The identifier for the budget scenario.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains budget details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection_BudgetScenarioDetail'
              example:
                count: 12
                value:
                - category: Expenses
                  fiscal_year: '2017'
                  total_amount: 1200
                  fiscal_period: 1
                  period_amount: 100
                - category: Expenses
                  fiscal_year: '2017'
                  total_amount: 1200
                  fiscal_period: 2
                  period_amount: 100
                - category: Expenses
                  fiscal_year: '2017'
                  total_amount: 1200
                  fiscal_period: 3
                  period_amount: 100
        '403':
          description: Returned when the user does not have permission to view budgets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
        '404':
          description: Returned when no budget is found with the specified ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Budgets
    servers:
    - url: https://api.sky.blackbaud.com/generalledger/v1
  /budgets/{scenario_id}/accounts:
    get:
      operationId: ListBudgetAccounts
      summary: Budget account (List)
      description: Returns details for every fiscal period and account in scenario.
      parameters:
      - name: scenario_id
        in: path
        required: true
        schema:
