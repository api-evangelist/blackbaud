openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: Grantmaking Requests API'
  description: This API manages grantmaking information.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/grantmaking
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/grantmaking
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Requests
paths:
  /api/v1/requests:
    post:
      operationId: AssignRequestCustomProperties
      summary: Updates a Request in the Grantmaking system
      description: Updates a Request in the Grantmaking system.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestUpdateRequest'
            example:
              id: string
              custom:
              - name: string
                value: {}
        description: A Blackbaud.CFS.MiddlewareService.DataAccess.Models.SKYAPI.Request.RequestUpdateRequest.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestUpdateResponse'
              example:
                status: string
                message: string
      tags:
      - Requests
  /api/v1/requests/classifications:
    get:
      operationId: GetRequestClassifications
      summary: Gets the classifications for Requests
      description: Fetches the coding tables associated with the Requests. Includes coding sheet properties when applicable.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationResponse'
              example:
                classifications:
                - code_table_id: 0
                  code_table:
                  - id: 0
                    code: string
                    description: string
                    description_with_code: string
                    full_path_description_code: string
                    full_path_description: string
                    depth: 0
                    parent_id: 0
                    is_active: true
                    full_path: string
                    full_path_with_code: string
      tags:
      - Requests
  /api/v1/requests/ids:
    post:
      operationId: GetRequestsById
      summary: Return Requests with the provided IDs
      description: Fetches Requests from the Grantmaking system.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestGetByIdRequest'
            example:
              ids:
              - string
              custom_fields:
              - string
              per_page: 0
              page: 0
        description: A Blackbaud.CFS.MiddlewareService.DataAccess.Models.SKYAPI.Request.RequestGetByIdRequest containg the Request IDs and any desired custom fields./
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestSearchResponse'
              example:
                requests:
                - id: string
                  project_title: string
                  request_date: string
                  approval_date: string
                  disposition: string
                  disposition_date: string
                  request_amount: 0
                  recommended_amount: 0
                  grant_amount: 0
                  paid_amount: 0
                  balance: 0
                  organization:
                    organization_id: string
                    name: string
                  contact:
                    email: string
                    contact_id: string
                    name: string
                  status:
                    classification_id: 0
                    code: string
                    description: string
                  status_date: string
                  type:
                    classification_id: 0
                    code: string
                    description: string
                  reference_number: string
                  project_start_date: string
                  project_end_date: string
                  declination_reason:
                    classification_id: 0
                    code: string
                    description: string
                  declination_notes: string
                  is_complete: true
                  complete_date: string
                  grant_fiscal_year: 0
                  term_months: 0
                  complete_notes: string
                  meeting_date: string
                  meeting_minutes: string
                  docket_number: string
                  branch:
                    classification_id: 0
                    code: string
                    description: string
                  staff:
                    login_id: string
                    name: string
                  secondary_staff:
                    login_id: string
                    name: string
                  subdivision: string
                  payments_count: 0
                  alert: string
                  change_date: string
                  create_date: string
                  codings:
                  - id: 0
                    code_table:
                      id: 0
                      description: string
                    level_1:
                      classification_id: 0
                      code: string
                      description: string
                    level_2:
                      classification_id: 0
                      code: string
                      description: string
                    level_3:
                      classification_id: 0
                      code: string
                      description: string
                    level_4:
                      classification_id: 0
                      code: string
                      description: string
                    level_5:
                      classification_id: 0
                      code: string
                      description: string
                    allocation_percentage: 0
                    allocation_amount: 0
                    primary_flag: true
                  application_id: 0
                  codes_ids: string
                  custom_fields: {}
      tags:
      - Requests
  /api/v1/requests/search:
    post:
      operationId: SearchRequest
      summary: Search for Requests which meet the provided criteria
      description: Fetches Grantmaking Requests that meet the provided search criteria.
      requestBody:
