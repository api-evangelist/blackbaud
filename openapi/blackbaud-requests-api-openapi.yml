          application/json:
            schema:
              $ref: '#/components/schemas/RequestSearchRequest'
            example:
              id: string
              request_date:
                start_date: string
                end_date: string
                is: string
              branch_id: 0
              disposition: string
              disposition_date:
                start_date: string
                end_date: string
                is: string
              grant_amount:
                min_value: 0
                max_value: 0
                is: 0
              project_start_date:
                start_date: string
                end_date: string
                is: string
              project_end_date:
                start_date: string
