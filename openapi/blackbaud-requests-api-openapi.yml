components:
  schemas:
    CodeInfo:
      type: object
      properties:
        id:
          type: integer
          description: The ID of the coding table value
          format: int32
        code:
          type:
          - string
          - 'null'
          description: The code value of the coding table value
        description:
          type:
          - string
          - 'null'
          description: The description value of the coding table value
        description_with_code:
          type:
          - string
          - 'null'
          description: The code and the description shown to the user
        full_path_description_code:
          type:
          - string
          - 'null'
          description: The code and the description shown to the user preceded by the parent values
        full_path_description:
          type:
          - string
          - 'null'
          description: The description shown to the user
        depth:
          type: integer
          description: The level that this code resides in within the coding table hierarchy
          format: int32
        parent_id:
          type: integer
          description: The ID of the parent code to this one, 0 if this is a top level code
          format: int32
        is_active:
          type: boolean
          description: To determine if this is an active code
          x-bb-suppressions:
          - parameter_property_name
        full_path:
          type:
          - string
          - 'null'
          description: The full path to the description in the coding table hierarchy
        full_path_with_code:
          type:
          - string
          - 'null'
          description: The full path including code and description to the code in the coding table hierarchy
      additionalProperties: false
      description: Model for coding options data
    RequestGetByIdRequest:
      required:
      - ids
      type: object
      properties:
        ids:
          type: array
          items:
            type: string
          description: The IDs of the requests to fetch.
        custom_fields:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Represents the list of custom fields to return on the entities in the result.
        per_page:
          maximum: 100
          minimum: 1
          type: integer
          description: The page size for paged output.
          format: int32
        page:
          type: integer
          description: The page number for paged output.
          format: int32
      additionalProperties: false
      description: A request model for getting Requests by ID.
    ContactReference:
      type: object
      properties:
        email:
          type:
          - string
          - 'null'
          description: The contact's email address.
        contact_id:
          type:
          - string
          - 'null'
          description: The related contact's ID.
        name:
          type:
          - string
          - 'null'
          description: The contact's full name.
      additionalProperties: false
      description: Represents related Contact information.
    RequestUpdateResponse:
      type: object
      properties:
        status:
          type:
          - string
          - 'null'
          description: A string indicating the status of the operation.
        message:
          type:
          - string
          - 'null'
          description: A string containing a message regarding the operation.
      additionalProperties: false
      description: A response model for request update.
    CustomSearchCriteria:
      type: object
      properties:
        field_name:
          type:
          - string
          - 'null'
          description: A string custom field name criteria.
        date_criteria:
          $ref: '#/components/schemas/DateSearchCriteria'
        decimal_criteria:
          $ref: '#/components/schemas/DecimalSearchCriteria'
        string_criteria:
          $ref: '#/components/schemas/StringSearchCriteria'
        integer_criteria:
          type:
          - integer
          - 'null'
          description: An integer criteria value.
          format: int32
        boolean_criteria:
          type:
          - boolean
          - 'null'
          description: A boolean criteria value.
      additionalProperties: false
      description: A model with custom field search criteria.
    Staff:
      type: object
      properties:
        login_id:
          type:
          - string
          - 'null'
          description: The staff member's login ID.
        name:
          type:
          - string
          - 'null'
          description: The staff member's name.
      additionalProperties: false
      description: Represents a Grantmaking staff user.
    DateSearchCriteria:
      type: object
      properties:
        start_date:
          type:
          - string
          - 'null'
          description: An earliest date criteria.
          format: date-time
        end_date:
          type:
          - string
          - 'null'
          description: A latest date criteria.
          format: date-time
        is:
          type:
          - string
          - 'null'
          description: An exact match criteria.
          format: date-time
      additionalProperties: false
      description: A model with date search criteria.
    RequestSearchResponse:
      type: object
      properties:
        requests:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ApiRequest'
          description: The results of the request search.
      additionalProperties: false
      description: A response model for request search.
    ClassificationResponse:
      type: object
      properties:
        classifications:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CodeInfoList'
          description: The classifications for the entity type.
      additionalProperties: false
      description: A response model for classifications.
    CodeInfoList:
      type: object
      properties:
        code_table_id:
          type: integer
          description: Gets or sets the table ID.
          format: int32
        code_table:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CodeInfo'
          description: Gets or sets the list of coding values in the table.
      additionalProperties: false
      description: Coding table model.
    IdCodeDescription:
      type: object
      properties:
        classification_id:
          type: integer
          description: Classification's ID.
          format: int32
        code:
          type:
          - string
          - 'null'
          description: Classification's code.
        description:
          type:
          - string
          - 'null'
          description: Classification's description.
      additionalProperties: false
      description: Represents a Classification value.
    DecimalSearchCriteria:
      type: object
      properties:
        min_value:
          type:
          - number
          - 'null'
          description: A lowest value criteria.
          format: double
        max_value:
          type:
          - number
          - 'null'
          description: A highest value criteria.
          format: double
        is:
          type:
          - number
          - 'null'
          description: An exact match criteria.
          format: double
      additionalProperties: false
      description: A model with decimal search criteria.
    SimpleCustomProperty:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          description: The name of the custom property.
        value:
          description: The value of the custom property.
      additionalProperties: false
      description: A simple representation of a custom property.
    ApiRequest:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          description: The Request's ID.
        project_title:
          type:
          - string
          - 'null'
          description: The Request's project title.
        request_date:
          type:
          - string
          - 'null'
          description: The Request's request date.
          format: date-time
        approval_date:
          type:
          - string
          - 'null'
          description: The Request's approval date.
          format: date-time
        disposition:
          type:
          - string
          - 'null'
          description: The Request's disposition.
        disposition_date:
          type:
          - string
          - 'null'
          description: The Request's disposition date.
          format: date-time
        request_amount:
          type:
          - number
          - 'null'
          description: The Request's request amount.
          format: double
        recommended_amount:
          type:
          - number
          - 'null'
          description: The Request's recommended amount.
          format: double
        grant_amount:
          type:
          - number
          - 'null'
          description: The Request's grant amount.
          format: double
        paid_amount:
          type:
          - number
          - 'null'
          description: The Request's paid amount.
          format: double
        balance:
          type:
          - number
          - 'null'
          description: The Request's balance.
          format: double
        organization:
          $ref: '#/components/schemas/OrganizationReference'
        contact:
          $ref: '#/components/schemas/ContactReference'
        status:
          $ref: '#/components/schemas/IdCodeDescription'
        status_date:
          type:
          - string
          - 'null'
          description: The Request's status date.
          format: date-time
        type:
          $ref: '#/components/schemas/IdCodeDescription'
        reference_number:
          type:
          - string
          - 'null'
          description: The Request's reference number.
        project_start_date:
          type:
          - string
          - 'null'
          description: The Request's project start date.
          format: date-time
        project_end_date:
          type:
          - string
          - 'null'
          description: The Request's project end date.
          format: date-time
        declination_reason:
