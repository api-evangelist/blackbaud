    get:
      operationId: v1usersget
      summary: Users by role(s)
      description: 'Returns a paginated collection of users, limited to 100 users per page.


        Use the record number as the ```marker``` value to return the next set of results. For example: ```marker=101``` will return the second set of results.


        Results are dependent on the directory settings of each user.


        Requires at least one of the following roles in the Education Management system:


        Billing Clerk


        Password Manager


        Contact Card Manager


        Platform Manager


        Admissions Manager'
      parameters:
      - name: roles
        in: query
        required: true
        schema:
          type: string
        description: Comma-delimited list of role IDs to get users for.
      - name: first_name
        in: query
        required: false
        schema:
          type: string
        description: Filter results by first name.
      - name: last_name
        in: query
        required: false
        schema:
          type: string
        description: Filter results by last name.
      - name: email
        in: query
        required: false
        schema:
          type: string
        description: Filter results by e-mail.
      - name: maiden_name
        in: query
        required: false
        schema:
          type: string
        description: Filter results by maiden name.
      - name: grad_year
        in: query
        required: false
        schema:
          type: string
        description: The beginning date in a school year (ex. 2017).
      - name: end_grad_year
        in: query
        required: false
        schema:
          type: string
        description: The end date in a school year (ex. 2018). Enter a grad_year and end_grad_year to find matching results in the date range.
      - name: marker
        in: query
        required: false
        schema:
          type: integer
        description: The record number start at to return the next batch of data.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserReadCollection'
              example:
                count: 1
                next_link: /v1/users/?roles=4180&marker=101
                value:
                - id: 1
                  deceased: false
                  display: John Smith
                  email: example@example.com
                  email_active: true
                  first_name: John
                  last_name: Smith
                  lost: false
                  maiden_name: ''
                  middle_name: Nolan
                  nick_name: Jonny
                  preferred_name: SuperStar
                  preferred_last_name: Smith
                  dob: '2002-10-15T12:00:00Z'
                  prefix: Mr.
                  suffix: III
      tags:
      - Users
    servers:
    - url: https://api.sky.blackbaud.com/school
