openapi: 3.2.0
info:
  title: Blackbaud Users API
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Users across 4 of this provider''s published API definitions: blackbaud-education-core-api-openapi.yml, blackbaud-grantsconnect-api-openapi.yml, blackbaud-oneroster-api-openapi.yml, blackbaud-school-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/afe-edcor
- url: https://api.sky.blackbaud.com/grants-connect
- url: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster
- url: https://api.sky.blackbaud.com/school
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Users
paths:
  /v1/users/bbid/connect:
    patch:
      operationId: V1UsersBbidConnectPatch
      summary: User BBID (Connect) (PREVIEW)
      description: 'Connects a set of user records to BBID accounts and can send login invite emails.


        Requires at least one of the following roles in the Education Management system:


        Platform Manager


        Admissions Manager


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V1UsersBbidConnectPatchRequest'
            example:
            - id: 1
              email: abc@example.com
              send_invite: false
            - id: 2
              email: ''
              send_invite: true
        description: An array of BBID connection request objects
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1UsersBbidConnectPatch200ApplicationJsonResponse'
              example:
              - id: 1
                email: abc@example.com
                response: Success
                status: '200'
              - id: 2
                email: ContactCardEmail@example.com
                response: Success
                status: '200'
      tags:
      - Users
    servers:
    - url: https://api.sky.blackbaud.com/afe-edcor
  /v1/users/bbid/disconnect:
    patch:
      operationId: V1UsersBbidDisconnectPatch
      summary: User BBID (Disconnect) (PREVIEW)
      description: 'Disconnects a set of BBID accounts


        Requires at least one of the following roles in the Education Management system:


        Platform Manager


        Admissions Manager


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: user_ids
        in: query
        required: false
        schema:
          type: array
        description: An array of user IDs to disconnect.
      - name: bbid_emails
        in: query
        required: false
        schema:
          type: array
        description: An array of BBID emails to disconnect.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1UsersBbidDisconnectPatch200ApplicationJsonResponse'
              example:
              - id: 1
                email: abc@example.com
                response: Success
                status: '200'
              - id: 2
                email: ContactCardEmail@example.com
                response: Success
                status: '200'
      tags:
      - Users
    servers:
    - url: https://api.sky.blackbaud.com/afe-edcor
  /v1/users/search:
    post:
      operationId: V1UsersSearchPost
      summary: User (Search) (PREVIEW)
      description: 'Returns a list of users that meet specified criteria


        Requires at least one of the following roles in the Education Management system:


        Platform Manager


        Admissions Manager


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSearchRequest'
            example:
              first_name: Terry
              last_name: Brown
              birth_date:
                day: 1
                month: 1
                year: 2001
              email: joe@example.com
              user_ids:
              - 100451
              - 100542
              host_ids:
              - XX100001
              - XX100002
              state_ids:
              - SC100001
              - SC100002
              student_ids:
              - HS100001
              - HS100002
              usernames:
              - joe@example.com
              - sue@example.com
        description: User search request object with specified criteria
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1UsersSearchPost200ApplicationJsonResponse'
              example:
              - id: 1
                email: joe@example.com
                first_name: Terry
                last_name: Brown
                birth_date: '2001-01-01T12:00:00Z'
                username: joe@example.com
                host_id: XX100001
                student_id: HS100001
                state_id: SC100001
      tags:
      - Users
    servers:
    - url: https://api.sky.blackbaud.com/afe-edcor
