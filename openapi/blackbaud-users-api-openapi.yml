  /v1/users/customfields:
    get:
      operationId: V1UsersCustomfieldsGet
      summary: Users custom fields list by base role(s)
      description: 'Returns a paginated collection of users with custom admin fields, limited to 100 users per page.

        This includes both user custom fields and administration view only custom fields.


        Use the last user ```id``` number as the ```marker``` value to return the next set of results.

        For example: ```marker=23232323``` will return a second set of results beginning with the next user ID in the result set.


        Requires at least one of the following roles in the Education Management system:


        Platform Manager


        Admissions Manager


        Contact Card Manager'
      parameters:
      - name: base_role_ids
        in: query
        required: true
        schema:
          type: string
        description: 'A comma-delimited list of base role IDs to get users for. Example: ```base_role_ids=14,16``` for Students and Parents.'
      - name: marker
        in: query
        required: false
        schema:
          type: integer
        description: The user's ```id``` to start at to return the next batch of data. Results will start with the next user in the result set.
      - name: field_ids
        in: query
        required: false
        schema:
          type: string
        description: A comma-delimited list of field IDs to filter the result set down to. Only matching custom fields will be returned from that result set for all users in that set even if they don't have any data for the given ```field_ids```.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserAdminCustomFieldCollection'
              example:
                count: 2
                value:
                - id: 1
                  first_name: John
                  last_name: Smith
                  preferred_name: Jonny
                  custom_fields:
                  - data_type_id: 2
                    data_type: int
                    data_type_description: Check Box List
                    field_id: 0
                    field_name: Enrollment Type
                    int_value: 1
                    last_modified_user_id: 12345
                    last_modified_date: '2018-08-30T12:00:00Z'
                    status: true
                    unique: true
                    required: true
                    table_id: 1
                    table_value_id: 1
                    table_value: one
                    table_value_abbreviation: one
                  - data_type_id: 9
                    data_type: bit
                    data_type_description: Yes/No
                    field_id: 0
                    field_name: After Care
                    bit_value: true
                    last_modified_user_id: 12345
                    last_modified_date: '2018-08-30T12:00:00Z'
                    status: true
                    unique: false
                    required: false
                  - data_type_id: 7
                    data_type: nvarchar
                    data_type_description: Text Input
                    field_id: 0
                    field_name: Authorized Pickup
                    text_value: GrandMother
                    last_modified_user_id: 12345
                    last_modified_date: '2018-08-30T12:00:00Z'
                    status: false
                    unique: false
                    required: false
                  preferred_last_name: Smith
                - id: 2
                  first_name: Sally
                  last_name: Johnson
                  preferred_name: Sal
