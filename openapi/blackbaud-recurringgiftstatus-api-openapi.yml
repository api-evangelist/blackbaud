paths:
  /recurringgiftstatus/{revenue_id}:
    patch:
      operationId: EditRecurringGiftStatus
      summary: Edit a recurring gift status
      description: Edit gift status for recurring gift templates.
      parameters:
      - name: revenue_id
        in: path
        required: true
        schema:
          type: string
        description: The revenue id.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditRecurringGiftStatus'
            example:
              status: Active
              reason_code: Ready2go! - Ready to give
              installments:
              - id: f3493f5c-c3bc-4baa-a03f-60a7f40ec1d5
                date: '2023-04-04'
                write_off_amount: 0
                balance: 0
                number: 0
                activity: ''
              rg_frequency: Annually
              rg_end_date: '2023-12-31T12:00:00Z'
              skipped_installment_id: ''
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully edits the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to edit the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Recurringgiftstatus
    servers:
    - url: https://api.sky.blackbaud.com/alt-revmg
