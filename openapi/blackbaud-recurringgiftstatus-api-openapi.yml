    EditRecurringGiftStatus:
      type: object
      properties:
        status:
          type: string
          description: The set new status. Available values are <i>active</i>, <i>held</i>, <i>terminated</i>, <i>canceled</i>, <i>lapsed</i>
        reason_code:
          type: string
          description: The reason code for status change. This simple list can be queried at https://api.sky.blackbaud.com/alt-adnmg/simplelists/b894d7f9-d108-4528-a37e-ab620a40ad75?parameters=type,{statuscode}.
