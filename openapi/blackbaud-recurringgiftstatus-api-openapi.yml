          type: array
          items:
            $ref: '#/components/schemas/EditRecurringGiftStatusInstallments'
          description: Installments.
        rg_frequency:
          type: string
          description: The frequency. Read-only in the SOAP API. Available values are <i>annually</i>, <i>semi-annually</i>, <i>quarterly</i>, <i>monthly</i>, <i>single installment</i>, <i>semi-monthly</i>, <i>biweekly</i>
        rg_end_date:
          type: string
          description: 'The end date. Read-only in the SOAP API. Uses the format YYYY-MM-DDThh:mm:ss. An example date: <i>1955-11-05T22:04:00</i>.'
          format: date-time
        skipped_installment_id:
          type: string
          description: The skippedinstallmentid.
