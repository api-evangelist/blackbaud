openapi: 3.2.0
info:
  title: Blackbaud Addresses API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Addresses across 3 of this provider''s published API definitions: blackbaud-altru-constituent-api-openapi.yml, blackbaud-constituent-api-openapi.yml, blackbaud-crm-constituent-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/alt-conmg
- url: https://api.sky.blackbaud.com/constituent/v1
- url: https://api.sky.blackbaud.com/crm-conmg
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Addresses
paths:
  /addresses:
    post:
      operationId: CreateConstituentAddress
      summary: Create a constituent address
      description: This operation is used to add an address.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewConstituentAddress'
            example:
              constituent_id: 4B358EDA-9374-4DED-BE55-7C404BB5E4AB
              address_type: ''
              address_block: ''
              city: ''
              state: ''
              postcode: ''
              country: ''
              do_not_mail: false
              cart: ''
              lot: ''
              dpc: ''
              start_date:
                year: 2014
                month: 4
                day: 13
              end_date:
                year: 2024
                month: 4
                day: 13
              primary: false
              historical_start_date: '2014-11-04T10:04:00Z'
              recent_move: false
              old_address: ''
              spouse_name: ''
              update_matching_spouse_addresses: false
              omit_from_validation: false
              county: ''
              congressional_district: ''
              state_house_district: ''
              state_senate_district: ''
              local_precinct: ''
              info_source: ''
              region: ''
              last_validation_attempt_date: '2019-11-04T10:04:00Z'
              validation_message: ''
              certification_data: 0
              zip_lookup_countries:
              - country_id: 4B358EDA-9374-4DED-BE55-7C404BB5E3AB
                country_name: us
              household: false
              household_member: false
              update_matching_household_addresses: false
              validation_countries:
              - country_id: ''
                browsable: false
              do_not_mail_reason: ''
              info_source_comments: ''
              confidential: false
              constituent_data_review_rollback_reason: ''
              forced_primary: false
              can_edit_primary: false
              invalid_fields: ''
              origin: User
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully creates the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Addresses
    get:
      operationId: ListConstituentAddressesAllConstituents
      summary: Address list (All constituents)
      description: 'Returns a paginated list of addresses.


        The default sorting behavior is to list addresses in ascending order based on when they were created.


        However, the last_modified parameter overrides the default sorting behavior to list addresses in ascending order based on when they were last modified. The last_modified and date_added parameters also add the sort_token parameter to the next_link URL to ensure that addresses are stably sorted and that order persists when changes occur while working through a paginated list.


        If the last_modified and date_added parameters are both specified, the sorting behavior is to list addresses based on when they were last modified.


        Note: This endpoint returns data with an average latency of about 30 minutes.'
      parameters:
      - name: date_added
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for addresses created on or after the specified date. The filter respects time offsets from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for addresses modified on or after the specified date. The filter respects time offsets from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: sort_token
        in: query
        required: false
        schema:
          type: string
        description: Represents a token filter to provide the next stable-sorted list of addresses. This will be provided on the next_link collection response property when last_modified or sort_token filters are specified on the request.
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
        description: Set this parameter to "true" to include inactive addresses in the response.
      - name: constituent_id
        in: query
        required: false
        schema:
          type: array
        description: Represents a list of constituent identifiers. Returns addresses if any of the specified constituent identifiers match any of the addresses' associated constituents. For example, "constituent_id=280&amp;constituent_id=1232" returns addresses with either "280" or "1232" constituent identifiers.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to return. The default is 500. The maximum is 5000.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip. For use with pagination.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a> of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Address">address</a> entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfAddressRead'
              example:
                count: 774
                next_link: https://api.sky.blackbaud.com/constituent/v1/addresses?offset=4&limit=4
                value:
                - id: '184'
                  address_lines: '248 Twin Lane

                    Building #3299'
                  city: Birmingham
                  constituent_id: '185'
                  country: United States
                  county: Bailey
                  date_added: '1999-05-20T18:52:54Z'
                  date_modified: '2016-10-19T19:42:38.775Z'
                  do_not_mail: false
                  end: '2025-03-26T00:00:00Z'
                  inactive: false
                  postal_code: '35220'
                  preferred: true
                  seasonal_end:
                    d: 26
                    m: 8
                  seasonal_start:
                    d: 12
                    m: 6
                  start: '2003-03-26T00:00:00Z'
                  state: AL
                  type: Home
                - id: '185'
                  address_lines: 2457 Morrison Drive
                  city: Savannah
                  constituent_id: '186'
                  country: United States
                  date_added: '1999-05-20T18:52:55Z'
                  date_modified: '2016-10-19T19:42:38.775Z'
                  do_not_mail: false
                  inactive: false
                  postal_code: '31406'
                  preferred: true
                  seasonal_end:
                    d: 26
                    m: 8
                  seasonal_start:
                    d: 12
                    m: 6
                  start: '2001-02-26T00:00:00Z'
                  state: GA
                  type: Home
                - id: '186'
                  address_lines: 125 Smokerise Way
                  city: Charleston
                  constituent_id: '187'
                  country: United States
                  county: Charleston
                  date_added: '1999-05-20T18:52:55Z'
                  date_modified: '2016-10-19T19:42:38.775Z'
                  do_not_mail: false
                  inactive: false
                  postal_code: '29401'
                  preferred: true
                  start: '1994-03-26T00:00:00Z'
                  state: SC
                  type: Home
                - id: '187'
                  address_lines: 4859 Philpot Lane
                  city: Minneapolis
                  constituent_id: '188'
                  country: United States
                  date_added: '1999-05-20T18:52:56Z'
                  date_modified: '2016-10-19T19:42:38.775Z'
                  do_not_mail: false
                  inactive: false
                  postal_code: '55403'
                  preferred: true
                  state: MN
                  type: Home
        '400':
          description: Returned when the specified request parameters are not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to view the addresses.
      tags:
      - Addresses
    servers:
    - url: https://api.sky.blackbaud.com/alt-conmg
  /addresses/search:
    get:
      operationId: SearchConstituentAddresses
      summary: Search for constituent addresses
      description: This provides the ability to search for a constituent's addresses.
      parameters:
      - name: key_name
        in: query
        required: false
        schema:
          type: string
        description: last/org name
      - name: first_name
        in: query
        required: false
        schema:
          type: string
        description: first name
      - name: lookup_id
        in: query
        required: false
        schema:
          type: string
        description: lookup id
      - name: address_block
        in: query
        required: false
        schema:
          type: string
        description: address
      - name: city
        in: query
        required: false
        schema:
          type: string
        description: city
      - name: state
        in: query
        required: false
        schema:
          type: string
        description: state SimpleDataListID=7fa91401-596c-4f7c-936d-6e41683121d7.
      - name: post_code
        in: query
        required: false
        schema:
          type: string
        description: post code
      - name: country
        in: query
        required: false
        schema:
          type: string
        description: country SimpleDataListID=c9649672-353d-42e8-8c25-4d34bbabfbba.
      - name: only_primary_address
        in: query
        required: false
        schema:
          type: boolean
        description: only search primary addresses
      - name: exact_match_only
        in: query
        required: false
        schema:
          type: boolean
        description: match all criteria exactly
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Limits the number of records to return.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of result entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstituentAddressSearchCollection'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to view the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Addresses
    servers:
    - url: https://api.sky.blackbaud.com/alt-conmg
  /addresses/{address_id}:
    delete:
      operationId: DeleteConstituentAddress
      summary: Delete a constituent address
      description: This deletion handles only the basic deletion rules for an address (currently none).
      parameters:
      - name: address_id
        in: path
        required: true
        schema:
          type: string
        description: The address id
      responses:
        '200':
          description: Returned when the operation successfully deletes the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to delete the resource.
      tags:
      - Addresses
    patch:
      operationId: EditConstituentAddress
      summary: Edit a constituent address
      description: This operation is used to edit an address.
      parameters:
      - name: address_id
        in: path
        required: true
        schema:
          type: string
        description: The address id.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditConstituentAddress'
            example:
              address_type: ''
              address_block: ''
              city: ''
              state_: ''
              postcode: ''
              country_: ''
              cart: ''
              dpc: ''
              lot: ''
              start_date:
                year: 2014
                month: 4
                day: 13
              end_date:
                year: 2024
                month: 4
                day: 13
              primary: false
              do_not_mail: false
              omit_from_validation: false
              county: ''
              congressional_district: ''
              state_house_district: ''
              state_senate_district: ''
              local_precinct: ''
              info_source: ''
              region: ''
              last_validation_attempt_date: '2019-11-04T10:04:00Z'
              validation_message: ''
              certification_data: 0
              ncoa_last_submit_date: '2019-11-04T10:04:00Z'
              ncoa_return: ''
              ncoa_footnote: ''
              ncoa_dpv_footnote: ''
              ncoa_move_date:
                year: 2024
                month: 4
                day: 13
              ncoa_dma_suppression: false
              ncoa_mail_grade: ''
              zip_lookup_countries:
              - country_id: ''
                country_name: ''
              validation_countries:
              - country_id: ''
                browsable: false
              update_contacts: false
              has_contacts: false
              do_not_mail_reason: ''
              household: false
              household_member: false
              update_matching_household_addresses: false
              matching_household_members:
              - constituent_id: ''
                name: ''
                relationship_to_primary: ''
              historical_start_date: '2014-11-04T10:04:00Z'
              historical_end_date: '2024-11-04T10:04:00Z'
              date_added: '2014-11-04T11:04:00Z'
              info_source_comments: ''
              confidential: false
              constituent_data_review_rollback_reason: ''
              forced_primary: false
              can_edit_primary: false
              invalid_fields: ''
              origin: User
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully edits the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to edit the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
