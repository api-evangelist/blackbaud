    get:
      operationId: GetConstituentAddress
      summary: Get a constituent address
      description: This operation is used to edit an address.
      parameters:
      - name: address_id
        in: path
        required: true
        schema:
          type: string
        description: The address id.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstituentAddress'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to get the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Addresses
    servers:
    - url: https://api.sky.blackbaud.com/alt-conmg
  /addresses/{address_id}/view:
    get:
      operationId: ViewConstituentAddress
      summary: View a constituent address
      description: This operation is used for viewing basic address inoperationation.
      parameters:
      - name: address_id
        in: path
        required: true
        schema:
          type: string
        description: The address id.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstituentAddressView'
      tags:
      - Addresses
    servers:
    - url: https://api.sky.blackbaud.com/alt-conmg
components:
  schemas:
    ConstituentAddressView:
      type: object
      properties:
        address_type:
          maxLength: 200
          minLength: 0
          type: string
          description: The type.
        country_id:
          type: string
          description: The country ID.
        country:
          maxLength: 100
          minLength: 0
          type: string
          description: The country.
        address_block:
          maxLength: 150
          minLength: 0
          type: string
          description: The address.
        city:
          maxLength: 50
          minLength: 0
          type: string
          description: The city.
        state:
          maxLength: 100
          minLength: 0
          type: string
          description: The state.
        post_code:
          maxLength: 12
          minLength: 0
          type: string
          description: The post code.
        primary:
          type: boolean
          description: Indicates whether is primary.
        do_not_mail:
          type: boolean
          description: Indicates whether do not mail.
        do_not_mail_reason_code:
          maxLength: 200
          minLength: 0
          type: string
          description: The do not mail reason code.
        confidential:
          type: boolean
          description: Indicates whether is confidential.
        start_date:
          type: string
          description: 'The start date. Uses the format YYYY-MM-DDThh:mm:ss. An example date: <i>1955-11-05T22:04:00</i>.'
          format: date-time
        end_date:
          type: string
          description: 'The end date. Uses the format YYYY-MM-DDThh:mm:ss. An example date: <i>1955-11-05T22:04:00</i>.'
          format: date-time
        date_added:
          type: string
          description: 'The date added. Uses the format YYYY-MM-DDThh:mm:ss. An example date: <i>1955-11-05T22:04:00</i>.'
          format: date-time
        seasonal_start_date:
          $ref: '#/components/schemas/MonthDay'
        seasonal_end_date:
          $ref: '#/components/schemas/MonthDay'
        info_source_code:
          maxLength: 100
          minLength: 0
          type: string
          description: The information source.
        info_source_comments:
          maxLength: 256
          minLength: 0
          type: string
          description: The comments.
        state_abbreviation:
          maxLength: 50
          minLength: 0
          type: string
          description: The state abbreviation.
      additionalProperties: false
      description: ViewConstituentAddress
      x-display-name: Address Information View Form
      x-display-id: Address Information View Form
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          description: A URI reference [RFC3986] that identifies the problem type. This specification encourages that, when dereferenced, it provide human-readable documentation for the problem type (e.g., using HTML [W3C.REC-html5-20141028]). When this member is not present, its value is assumed to be "about:blank".
        title:
          type: string
          description: A short, human-readable summary of the problem type. It SHOULD NOT change from occurrence to occurrence of the problem, except for purposes of localization (e.g., using proactive content negotiation; see [RFC7231], Section 3.4).
        status:
          type: integer
          description: The HTTP status code ([RFC7231], Section 6) generated by the origin server for this occurrence of the problem.
          format: int32
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        instance:
          type: string
          description: A URI reference that identifies the specific occurrence of the problem. It may or may not yield further information if dereferenced.
        trace_id:
          type: string
          description: A request ID that can be provided to Blackbaud Support that may help with further troubleshooting.
        span_id:
          type: string
          description: A request ID that can be provided to Blackbaud Support that may help with further troubleshooting.
      additionalProperties: false
      description: A machine-readable format for specifying errors in HTTP API responses based on https://tools.ietf.org/html/rfc7807.
      x-display-name: Problem details
      x-display-id: ProblemDetails
    NewConstituentAddress:
      required:
      - constituent_id
      - country
      type: object
      properties:
        constituent_id:
          type: string
          description: The constituent ID.
        address_type:
          type: string
          description: The type. This code table can be queried at https://api.sky.blackbaud.com/alt-adnmg/codetables/addresstypecode/entries
        address_block:
          maxLength: 150
          minLength: 0
          type: string
          description: The address.
        city:
          maxLength: 50
          minLength: 0
          type: string
          description: The city.
        state:
          type: string
          description: The state. This simple list can be queried at https://api.sky.blackbaud.com/alt-adnmg/simplelists/7fa91401-596c-4f7c-936d-6e41683121d7?parameters=countryid,{countryid}.
        postcode:
          maxLength: 12
          minLength: 0
          type: string
          description: The zip.
        country:
          type: string
          description: The country. This simple list can be queried at https://api.sky.blackbaud.com/alt-adnmg/simplelists/c9649672-353d-42e8-8c25-4d34bbabfbba.
        do_not_mail:
          type: boolean
          description: Indicates whether do not send mail to this address.
        cart:
          maxLength: 10
          minLength: 0
          type: string
          description: The cart.
        lot:
          maxLength: 5
          minLength: 0
          type: string
          description: The lot.
        dpc:
          maxLength: 8
          minLength: 0
          type: string
          description: The dpc.
        start_date:
          $ref: '#/components/schemas/MonthDay'
        end_date:
          $ref: '#/components/schemas/MonthDay'
        primary:
          type: boolean
          description: Indicates whether set as primary address.
        historical_start_date:
          type: string
          description: 'The start date. Uses the format YYYY-MM-DDThh:mm:ss. An example date: <i>1955-11-05T22:04:00</i>.'
          format: date-time
        recent_move:
          type: boolean
          description: Indicates whether recently moved/changed from this address?.
        old_address:
          type: string
          description: The old address. This simple list can be queried at https://api.sky.blackbaud.com/alt-adnmg/simplelists/bc075172-8103-4ccb-8285-658180e603a1?parameters=constituent_id,{constituent_id}.
        spouse_name:
          maxLength: 154
          minLength: 0
          type: string
          description: The spouse name. Read-only in the SOAP API.
        update_matching_spouse_addresses:
          type: boolean
          description: Indicates whether update matching address information for spouse.
        omit_from_validation:
          type: boolean
          description: Indicates whether omit this address from validation.
        county:
          type: string
          description: The county. This code table can be queried at https://api.sky.blackbaud.com/alt-adnmg/codetables/countycode/entries
        congressional_district:
          type: string
          description: The congressional district. This code table can be queried at https://api.sky.blackbaud.com/alt-adnmg/codetables/congressionaldistrictcode/entries
        state_house_district:
          type: string
          description: The state house district. This code table can be queried at https://api.sky.blackbaud.com/alt-adnmg/codetables/statehousedistrictcode/entries
        state_senate_district:
          type: string
          description: The state senate district. This code table can be queried at https://api.sky.blackbaud.com/alt-adnmg/codetables/statesenatedistrictcode/entries
        local_precinct:
          type: string
          description: The local precinct. This code table can be queried at https://api.sky.blackbaud.com/alt-adnmg/codetables/localprecinctcode/entries
        info_source:
          type: string
          description: The information source. This code table can be queried at https://api.sky.blackbaud.com/alt-adnmg/codetables/infosourcecode/entries
        region:
          type: string
          description: The region. This code table can be queried at https://api.sky.blackbaud.com/alt-adnmg/codetables/regioncode/entries
        last_validation_attempt_date:
          type: string
          description: 'The last attempt. Uses the format YYYY-MM-DDThh:mm:ss. An example date: <i>1955-11-05T22:04:00</i>.'
          format: date-time
        validation_message:
          maxLength: 100
          minLength: 0
          type: string
          description: The validation message.
        certification_data:
          type: integer
          description: The certification data.
          format: int32
        zip_lookup_countries:
          type: array
          items:
            $ref: '#/components/schemas/NewConstituentAddressZipLookupCountries'
          description: Zip lookup countries.
        household:
          type: boolean
          description: Indicates whether household. Read-only in the SOAP API.
        household_member:
          type: boolean
          description: Indicates whether household member. Read-only in the SOAP API.
        update_matching_household_addresses:
          type: boolean
          description: Indicates whether copy address information to household members.
        validation_countries:
          type: array
          items:
            $ref: '#/components/schemas/NewConstituentAddressValidationCountries'
          description: Validation countries.
