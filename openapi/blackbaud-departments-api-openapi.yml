    Department:
      type: object
      properties:
        id:
          type: integer
          description: The identifier for this fob.
          format: int32
        description:
          type:
          - string
          - 'null'
          description: The description of the fob.
        value:
          type:
          - string
          - 'null'
          description: The value of the fob.
        inactive:
          type: boolean
          description: Whether or not the department is active.
      additionalProperties: false
      description: Contract for department.
    DepartmentApiCollection:
      type: object
      properties:
        count:
          type: integer
          format: int32
        value:
