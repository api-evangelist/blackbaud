paths:
  /departments:
    get:
      operationId: ListAccountsPayableDepartments
      summary: Accounts payable department (List)
      description: Returns a list of accounts payable departments.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains a list of departments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentApiCollection'
              example:
                count: 3
                value:
                - id: 291
                  description: 00 - None
                  value: 00 - None
                  inactive: false
                - id: 289
                  description: 01 - Administration
                  value: 01 - Administration
                  inactive: false
                - id: 288
                  description: 02 - Development
                  value: 02 - Development
                  inactive: false
      tags:
      - Departments
components:
