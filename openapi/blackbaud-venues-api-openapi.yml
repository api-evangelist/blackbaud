openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: School Venues API'
  description: This API is used to provide access to school information such as users, academics, admissions, athletics, content, lists, and general school info.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/school
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/school
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Venues
paths:
  /v1/venues/buildings:
    get:
      operationId: V1VenuesBuildingsGet
      summary: Core buildings
      description: 'Returns a collection of buildings.


        Requires the ''Team Schedule Manager'', ''Coach'', ''Athletic Group Manager'' or ''Pending Coach'' role in the K12 system.'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildingReadCollection'
              example:
                count: 1
                value:
                - building_id: 104509
                  building_name: Harker Hall
                  building_types:
                  - Academics
                  - Events
                  rooms:
                  - room_id: 554980
                    room_number: '101'
                    name: Science Room A
                    code: A101
                    capacity: '200'
                    room_type: Academics
                    room_type_id: 11788
                    notes: Saving a note
      tags:
      - Venues
components:
  schemas:
    BuildingReadCollection:
      type: object
      properties:
        count:
          type: integer
          description: The number of items in the collection
          format: int32
          readOnly: true
        next_link:
          type:
          - string
          - 'null'
          description: For paginated responses, the URI for the next page of results
        value:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/BuildingRead'
          description: The set of items included in the response. This may be a subset of the items in the collection
      additionalProperties: false
      description: A Collection
    BuildingRead:
      type: object
      properties:
        building_id:
          type:
          - integer
          - 'null'
          description: ID of the building
          format: int32
        building_name:
          type:
          - string
          - 'null'
          description: Building Name
        building_types:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/BuildingTypeEnum'
          description: Building group types
        rooms:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/BuildingRoomRead'
          description: Collection of rooms within the building
      additionalProperties: false
      description: ''
    BuildingTypeEnum:
      title: BuildingTypeEnum
      enum:
      - Academics
      - Activities
      - Advisory
      - ResidenceLife
      - Athletics
      - Events
      type: string
      description: Denotes how the building is used.
    BuildingRoomRead:
      type: object
      properties:
        room_id:
          type:
          - integer
          - 'null'
          description: Identifier for the room
          format: int32
        room_number:
          type:
          - string
          - 'null'
          description: Room number
        name:
          type:
          - string
          - 'null'
          description: Room name
        code:
          type:
          - string
          - 'null'
          description: Room code
        capacity:
          type:
          - string
          - 'null'
          description: Room capacity
        room_type:
          type:
          - string
          - 'null'
          description: Denotes how the room is used
        room_type_id:
          type:
          - integer
          - 'null'
          description: Identifier for the room type
          format: int32
        notes:
          type:
          - string
          - 'null'
          description: The notes for the room
        building:
          $ref: '#/components/schemas/IdDescriptorField'
        type:
          $ref: '#/components/schemas/IdDescriptorField'
      additionalProperties: false
      description: ''
    IdDescriptorField:
      type: object
      properties:
        id:
          type: integer
          description: ID of the field
          format: int32
        description:
          type:
          - string
          - 'null'
          description: Description of the field
      additionalProperties: false
      description: ''
  securitySchemes:
    Bb-Api-Subscription-Key:
      type: apiKey
      name: Bb-Api-Subscription-Key
      in: header
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://app.blackbaud.com/oauth/authorize
          tokenUrl: https://oauth2.sky.blackbaud.com/token
          scopes: {}
