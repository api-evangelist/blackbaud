openapi: 3.2.0
info:
  title: Blackbaud Prospectsteps API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Prospectsteps across 2 of this provider''s published API definitions: blackbaud-altru-prospect-api-openapi.yml, blackbaud-crm-prospect-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/alt-prsmg
- url: https://api.sky.blackbaud.com/crm-prsmg
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Prospectsteps
paths:
  /prospectsteps:
    post:
      operationId: CreateProspectSteps
      summary: Create a prospect steps
      description: Add dataoperation for step records.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewProspectSteps'
            example:
              prospect_plan_id: 2fd00e64-4580-415e-a550-6afb622386c9
              interaction_type: Phone call
              objective: prospect step
              owner_id: 67027938-df87-4796-9a1c-99c326d4bb00
              status: Planned
              interaction_type_code_id: 5156e605-0958-441d-9d65-0b1b95c39356
              actual_date: '2006-07-29T10:00:00Z'
              prospect_plan_status: Future Prospect
              comment: this is step add
              interaction_type_code_id_value_translation: Phone call
              additional_fundraisers:
              - id: 5156e605-0958-441d-9d65-0b1b95c39356
                fundraiser_id: 310c7a77-bc72-4f32-ae62-1c5f2c9b6b58
              participants:
              - id: ac681ec7-110f-4f54-b88c-25c062472ac4
                constituent_id: 12e89c4a-204d-479e-b7a3-81cd3752e73f
              interaction_category: Prospect Management
              interaction_subcategory: Recipient Scholarship/Donor Info Sent
              expected_start_time:
                hour: 1
                minute: 26
              expected_end_time:
                hour: 3
                minute: 26
              is_all_day_event: false
              time_zone_entry: Pacific Standard Time
              actual_start_time:
                hour: 1
                minute: 26
              actual_end_time:
                hour: 3
                minute: 26
              prospect_id: 449c9705-20ca-499c-bac6-224716ee699d
              location: 818 Dunwoody Blvd  Minneapolis, MN  55403
              other_location: Minneapolis
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully creates the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Prospectsteps
    servers:
    - url: https://api.sky.blackbaud.com/alt-prsmg
  /prospectsteps/{interaction_id}:
    patch:
      operationId: EditProspectSteps
      summary: Edit a prospect steps
      description: Edit operation for a step.
      parameters:
      - name: interaction_id
        in: path
        required: true
        schema:
          type: string
        description: The interaction id.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditProspectSteps'
            example:
              prospect_plan_id: 2fd00e64-4580-415e-a550-6afb622386c9
              interaction_type: Phone call
              objective: objective of adding prospect step
              owner_id: 67027938-df87-4796-9a1c-99c326d4bb00
              status: Planned
              interaction_type_code_id: 5156e605-0958-441d-9d65-0b1b95c39356
              actual_date: '2006-07-29T10:00:00Z'
              prospect_plan_status: Future Prospect
              comment: this is step add
              interaction_type_code_id_value_translation: Phone call
              additional_fundraisers:
              - id: 5156e605-0958-441d-9d65-0b1b95c39356
                fundraiser_id: 310c7a77-bc72-4f32-ae62-1c5f2c9b6b58
              participants:
              - id: ac681ec7-110f-4f54-b88c-25c062472ac4
                constituent_id: 12e89c4a-204d-479e-b7a3-81cd3752e73f
              interaction_category: Prospect Management
              interaction_subcategory: Recipient Scholarship/Donor Info Sent
              expected_start_time:
                hour: 1
                minute: 26
              expected_end_time:
                hour: 3
                minute: 26
              is_all_day_event: false
              time_zone_entry: Pacific Standard Time
              actual_start_time:
                hour: 1
                minute: 26
              actual_end_time:
                hour: 3
                minute: 26
              plan_is_active: false
              prospect_id: 449c9705-20ca-499c-bac6-224716ee699d
              location: 818 Dunwoody Blvd  Minneapolis, MN  55403
              other_location: Minneapolis
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully edits the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to edit the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Prospectsteps
    servers:
    - url: https://api.sky.blackbaud.com/alt-prsmg
  /prospectsteps/{prospect_plan_id}/plannedlist:
    get:
      operationId: ListProspectSteps
      summary: List prospect steps
      description: List of planned/pending steps for a given plan.
      parameters:
      - name: prospect_plan_id
        in: path
        required: true
        schema:
          type: string
        description: The prospect plan id.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Limits the number of records to return.
      - name: session_key
        in: query
        required: false
        schema:
          type: string
        description: A unique key provided by user for paging results. The same key will be returned in a successful response.
      - name: infinity_session
        in: query
        required: false
        schema:
          type: string
        description: Values for cookies related to the Infinity load balancer session.
      - name: more_rows_range_key
        in: query
        required: false
        schema:
          type: string
        description: Key for accessing cached results on subsequent calls to this data list.
      - name: start_row_index
        in: query
        required: false
        schema:
          type: integer
        description: Number of rows to skip,get result after these rows.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of result entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProspectStepsListCollection'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to view the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Prospectsteps
    servers:
    - url: https://api.sky.blackbaud.com/alt-prsmg
  /prospectsteps/{step_id}:
    delete:
      operationId: DeleteProspectSteps
      summary: Delete a prospect steps
      description: Deletes a step from a plan.
      parameters:
      - name: step_id
        in: path
        required: true
        schema:
          type: string
        description: The step id
      responses:
        '200':
          description: Returned when the operation successfully deletes the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to delete the resource.
      tags:
      - Prospectsteps
    servers:
    - url: https://api.sky.blackbaud.com/alt-prsmg
