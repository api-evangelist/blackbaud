openapi: 3.0.1
info:
  title: 'Blackbaud SKY API: Billing Management'
  description: Billing Management provides APIs that expose data and functionality from the billing office.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/tms-bmapi
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations,
      examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/tms-bmapi
paths:
  /v1/batchimports/charges:
    post:
      operationId: CreateChargeImportBatch
      summary: Charges batch (Create)
      description: Creates an batch import request to create a batch of charges in Billing Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateChargeImportBatchMessage'
            example:
              batch_id: My unique batch ID
              charges:
              - fee_type_id: 124
                amount: 52.4
                student_user_id: 12
                charge_date: '2024-01-31'
                charge_due_date: '2024-02-29'
                batch_transaction_id: 'My unique charge ID #1'
              - fee_type_id: 125
                amount: 52.45
                student_user_id: 62
                charge_date: '2024-01-31'
                charge_due_date: '2024-02-29'
                batch_transaction_id: 'My unique charge ID #2'
        description: The batch import request containing charge data
      responses:
        '200':
          description: The Guid of the created batch (or existing one if the batch was already created).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
              example:
                id: 11103fcc-7ec2-4d9e-a290-84136dfc50ad
        '400':
          description: The request was bad or malformed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Default400ResponseTypes'
              example:
                type: urn:blackbaud:invalid-address-type
                title: One or more validation errors occurred.
                status: 400
                detail: The type Home is not valid for this address.
                values:
                  type: Home
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
  /v1/batchimports/credits:
    post:
      operationId: CreateCreditImportBatch
      summary: Credits batch (Create) (PREVIEW)
      description: 'Creates an batch import request to create a batch of credits in Billing Management


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCreditImportBatchMessage'
            example:
              batch_id: My unique batch ID
              credits:
              - fee_type_id: 124
                amount: 52.4
                student_user_id: 12
                credit_date: '2024-01-31'
                batch_transaction_id: 'My unique credit ID #1'
              - fee_type_id: 125
                amount: 52.45
                student_user_id: 62
                credit_date: '2024-01-31'
                batch_transaction_id: 'My unique credit ID #2'
        description: The batch import request containing credit data
      responses:
        '200':
          description: The Guid of the created batch (or existing one if the batch was already created).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
              example:
                id: 11103fcc-7ec2-4d9e-a290-84136dfc50ad
        '400':
          description: The request was bad or malformed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Default400ResponseTypes'
              example:
                type: urn:blackbaud:invalid-address-type
                title: One or more validation errors occurred.
                status: 400
                detail: The type Home is not valid for this address.
                values:
                  type: Home
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
  /v1/batchimports/{id}:
    get:
      operationId: GetTransactionBatchImportSummary
      summary: Batch summary (Get)
      description: Gets a summary of a batch import, with its current status, mappings, processing exceptions and the number
        of transactions created.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The Guid of the batch
      responses:
        '200':
          description: The summary of the batch import.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionBatchImportSummary'
              example:
                status: ProcessedWithExceptions
                successfully_processed_record_count: 1
                mappings:
                - batch_transaction_id: 'Your transaction ID #1'
                  transaction_id: 524
                processing_exceptions:
                - batch_transaction_id: 'Your transaction ID #2'
                  errors:
                  - property_name: UserId
                    error_message: No statement recipient set for user.
        '400':
          description: The request was bad or malformed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Default400ResponseTypes'
              example:
                type: urn:blackbaud:invalid-address-type
                title: One or more validation errors occurred.
                status: 400
                detail: The type Home is not valid for this address.
                values:
                  type: Home
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '404':
          description: The requested item(s) were not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:resource-not-found
                title: The requested resource could not be found.
                status: 404
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
  /v1/generalledger/batches:
    get:
      operationId: GetGeneralLedgerBatchList
      summary: Post to GL batches (List) (PREVIEW)
      description: 'Returns a page of up to 50 post to general ledger batches, most recently created first. When a continuation_token
        is returned, pass it back unmodified to retrieve the following page, and keep going until no token is returned. A
        page may contain fewer batches than the page size - even none at all - while still returning a token, so use the presence
        of the token rather than the number of batches to decide whether to continue. A continuation_token is intended for
        continuing a traversal that is already in progress; it should not be stored and reused later.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: continuation_token
        in: query
        required: false
        schema:
          type: string
        description: The token returned by a previous request, used to fetch the following page. Omit to start from the first
          page.
      responses:
        '200':
          description: A page of post to general ledger batches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryBatchDataPagedResult'
              example:
                items:
                - id: 8f3c1e04-9b2a-4c77-9f61-2d5b6a0e7c31
                  date_added: '2026-08-20T02:02:11Z'
                - id: c41d7b58-3e6f-4a19-8b0d-7f92ac13de60
                  date_added: '2026-08-19T09:47:03Z'
                continuation_token: i65WSs7PLcgvzixJDcnPTs1TsqpWKoEwlLSDPF2s6vIsin0d_UPSAgKdshzhwNZWOSjEykg5JMjZytDAQNkzOMzKSNnT1d_KzNTU1FA50NnNykJJR6koMS89FWRobibISCUdpdzECiUrJTcoUKqtrY0FAA==
                has_more: true
        '400':
          description: The request was bad or malformed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Default400ResponseTypes'
              example:
                type: urn:blackbaud:invalid-address-type
                title: One or more validation errors occurred.
                status: 400
                detail: The type Home is not valid for this address.
                values:
                  type: Home
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
  /v1/generalledger/batches/{batch_id}/distributions:
    get:
      operationId: GetGeneralLedgerBatchDistributionList
      summary: Post to GL batch distributions (List) (PREVIEW)
      description: 'Returns a page of up to 50 general ledger distributions belonging to a post to general ledger batch, in
        ascending order by their unique identifier. Sort by line_number client side if the batch''s own line ordering matters
        for display. When a continuation_token is returned, pass it back unmodified to retrieve the following page, and keep
        going until no token is returned. A page may contain fewer distributions than the page size - even none at all - while
        still returning a token, so use the presence of the token rather than the number of distributions to decide whether
        to continue. A continuation_token is intended for continuing a traversal that is already in progress; it should not
        be stored and reused later.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier of the batch whose distributions are returned
      - name: continuation_token
        in: query
        required: false
        schema:
          type: string
        description: The token returned by a previous request, used to fetch the following page. Omit to start from the first
          page.
      responses:
        '200':
          description: A page of general ledger distributions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryBatchDistributionDataPagedResult'
              example:
                items:
                - id: 91422
                  line_number: 1
                  account_number: 1000-00
                  account_name: Cash
                  project_description: Annual Fund
                  debit_amount: 250
                  credit_amount: 0
                  post_date: '2026-08-20T12:00:00Z'
                  journal_name: BILLING
                  journal_reference: INV-8842
                  transaction_id: 55120
                  distribution_id: 91422
                - id: 91423
                  line_number: 2
                  account_number: 4000-00
                  account_name: Tuition Revenue
                  project_description: Annual Fund
                  debit_amount: 0
                  credit_amount: 250
                  post_date: '2026-08-20T12:00:00Z'
                  journal_name: BILLING
                  journal_reference: INV-8842
                  transaction_id: 55120
                  distribution_id: 91423
                continuation_token: eyJwYWdlIjoyLCJiYXRjaF9pZCI6IjhmM2MxZTA0LTliMmEtNGM3Ny05ZjYxLTJkNWI2YTBlN2MzMSJ9
                has_more: true
        '400':
          description: The request was bad or malformed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Default400ResponseTypes'
              example:
                type: urn:blackbaud:invalid-address-type
                title: One or more validation errors occurred.
                status: 400
                detail: The type Home is not valid for this address.
                values:
                  type: Home
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '404':
          description: The requested item(s) were not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:resource-not-found
                title: The requested resource could not be found.
                status: 404
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
  /v1/generalledger/batches/{batch_id}/status:
    patch:
      operationId: EditGeneralLedgerBatchPostRunStatus
      summary: Update GL batch post-run status (PREVIEW)
      description: 'Allows a general ledger system to report the result of a post run for a post to general ledger batch,
        updating its status and recording the identifier for the run. Returns an error if the batch does not exist, has been
        deleted, or has already been posted.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier of the batch whose post run status is being reported
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGeneralLedgerBatchPostRunStatusMessage'
            example:
              status: Posted
              reference_id: My reference ID for this batch
        description: The post run status and identifier
      responses:
        '200':
          description: Whether the post run status was successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WasEditSuccessfulResponse'
              example:
                was_successful: true
        '400':
          description: The request was bad or malformed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Default400ResponseTypes'
              example:
                type: urn:blackbaud:invalid-address-type
                title: One or more validation errors occurred.
                status: 400
                detail: The type Home is not valid for this address.
                values:
                  type: Home
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '404':
          description: The requested item(s) were not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:resource-not-found
                title: The requested resource could not be found.
                status: 404
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '410':
          description: The requested item has been deleted.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:resource-gone
                title: The requested resource is gone.
                status: 410
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '409':
          description: The request conflicts with the current state of the requested item.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:conflict
                title: The request failed conflict validation.
                status: 409
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
  /v1/types/fees:
    get:
      operationId: GetFeeTypes
      summary: Fee types (Get)
      description: Returns information about the fee types that are allowed for batch imports.
      responses:
        '200':
          description: The available fee types.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeTypeDataEnumerableResponse'
              example:
                items:
                - id: 524
                  description: Lunch Fee
components:
  schemas:
    CreateChargeDataMessage:
      required:
      - amount
      - batch_transaction_id
      - charge_date
      - charge_due_date
      - fee_type_id
      - student_user_id
      type: object
      properties:
        fee_type_id:
          type: integer
          description: The fee type ID of the charge to be created
          format: int32
        amount:
          type: number
          description: The charge amount
          format: double
        student_user_id:
          type: integer
          description: The student's user ID to create the charge for
          format: int32
        charge_date:
          type: string
          description: The date of the charge
          format: date
        charge_due_date:
          type: string
          description: The due date of the charge
          format: date
        charge_comments:
          maxLength: 1000
          minLength: 0
          type: string
          description: The comments for the charge.
          nullable: true
        batch_transaction_id:
          maxLength: 100
          minLength: 0
          type: string
          description: 'Your unique identifier for the charge. Character limit: 100'
      additionalProperties: false
      description: A message containing all the information needed to create a charge
    CreateChargeImportBatchMessage:
      required:
      - batch_id
      - charges
      type: object
      properties:
        batch_id:
          maxLength: 100
          minLength: 0
          type: string
          description: 'Your unique identifier for the batch. Character limit: 100'
        charges:
          maxItems: 100
          type: array
          items:
            $ref: '#/components/schemas/CreateChargeDataMessage'
          description: 'The charges to be created in the batch. Batch size limit: 100'
      additionalProperties: false
      description: A request containing all the information needed to create a batch of charges
    CreateCreditDataMessage:
      required:
      - amount
      - batch_transaction_id
      - credit_date
      - fee_type_id
      - student_user_id
      type: object
      properties:
        fee_type_id:
          type: integer
          description: The fee type ID of the credit to be created
          format: int32
        amount:
          type: number
          description: The credit amount
          format: double
        student_user_id:
          type: integer
          description: The student's user ID to create the credit for
          format: int32
        credit_date:
          type: string
          description: The date of the credit
          format: date
        credit_comments:
          maxLength: 1000
          minLength: 0
          type: string
          description: The comments for the credit.
          nullable: true
        batch_transaction_id:
          maxLength: 100
          minLength: 0
          type: string
          description: 'Your unique identifier for the credit. Character limit: 100'
      additionalProperties: false
      description: A message containing all the information needed to create a credit
    CreateCreditImportBatchMessage:
      required:
      - batch_id
      - credits
      type: object
      properties:
        batch_id:
          maxLength: 100
          minLength: 0
          type: string
          description: 'Your unique identifier for the batch. Character limit: 100'
        credits:
          maxItems: 100
          type: array
          items:
            $ref: '#/components/schemas/CreateCreditDataMessage'
          description: 'The credits to be created in the batch. Batch size limit: 100'
      additionalProperties: false
      description: A request containing all the information needed to create a batch of credits
    CreatedTransactionMapping:
      type: object
      properties:
        batch_transaction_id:
          type: string
          description: Your unique identifier for a transaction
          nullable: true
        transaction_id:
          type: integer
          description: The transaction's ID in Billing Management
          format: int32
      additionalProperties: false
      description: The mapping between your transaction ID and the transaction created in Billing Management
    Default400ResponseTypes:
      type: object
      properties:
        type:
          type: string
          description: A URI reference [RFC3986] that identifies the problem type. This specification encourages that, when
            dereferenced, it provide human-readable documentation for the problem type (e.g., using HTML [W3C.REC-html5-20141028]).
            When this member is not present, its value is assumed to be "about:blank".<br/><br/>Available values:<table><tr><th>type</th><th>detail</th></tr><tr><td>urn:blackbaud:model-validation-error</td><td>A
            model validation rule was violated, such as a missing required field.</td></tr><tr><td>urn:blackbaud:validation-error</td><td>The
            request was invalid.</td></tr></table>
          nullable: true
        title:
          type: string
          description: A short, human-readable summary of the problem type. It SHOULD NOT change from occurrence to occurrence
            of the problem, except for purposes of localization (e.g., using proactive content negotiation; see [RFC7231],
            Section 3.4).
          nullable: true
        status:
          type: integer
          description: The HTTP status code ([RFC7231], Section 6) generated by the origin server for this occurrence of the
            problem.
          format: int32
          nullable: true
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
          nullable: true
        instance:
          type: string
          description: A URI reference that identifies the specific occurrence of the problem. It may or may not yield further
            information if dereferenced.
          nullable: true
        trace_id:
          type: string
          description: A request ID that can be provided to Blackbaud Support that may help with further troubleshooting.
        span_id:
          type: string
          description: A request ID that can be provided to Blackbaud Support that may help with further troubleshooting.
      additionalProperties: {}
      description: A machine-readable format for specifying errors in HTTP API responses based on https://tools.ietf.org/html/rfc7807.
      x-bb-error-types:
      - urn:blackbaud:model-validation-error
      - urn:blackbaud:validation-error
    FeeTypeData:
      type: object
      properties:
        id:
          type: integer
          description: The fee type's ID
          format: int32
        description:
          type: string
          description: The fee type's description
          nullable: true
      additionalProperties: false
      description: The fee type information
    FeeTypeDataEnumerableResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FeeTypeData'
          description: An array of <typeparamref name="T" />T
          nullable: true
      additionalProperties: false
      description: A response containing an array of <typeparamref name="T">T</typeparamref>
    IdResponse:
      type: object
      properties:
        id:
          type: string
          description: The ID of the record
          format: uuid
      additionalProperties: false
      description: A response containing the record's ID.
    ImportBatchStatus:
      title: ImportBatchStatus
      enum:
      - Accepted
      - Processed
      - Error
      - ProcessedWithExceptions
      type: string
      description: Status of a transaction batch import
    JournalEntryBatchData:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the batch
          format: uuid
        date_added:
          type: string
          description: The date and time the batch was added to the system, in UTC
          format: date-time
      additionalProperties: false
      description: Represents a post to general ledger batch
    JournalEntryBatchDataPagedResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/JournalEntryBatchData'
          description: The records in this page
          nullable: true
        continuation_token:
          type: string
          description: 'The token used to request the following page, or null when this is the last page. Pass it back

            unmodified. A page can contain fewer records than requested, or none at all, and still return a

            token, so use the presence of this token rather than the number of records to decide whether to

            continue. A token is intended for continuing a traversal that is already in progress; it should

            not be stored and reused later.'
          nullable: true
        has_more:
          type: boolean
          description: Whether a following page is available. Equivalent to checking whether the continuation_token field
            is present.
          readOnly: true
      additionalProperties: false
      description: A single page of records along with the token used to request the following page.
    JournalEntryBatchDistributionData:
      type: object
      properties:
        id:
          type: integer
          description: The unique identifier of the distribution
          format: int32
        line_number:
          type: integer
          description: The line number of the distribution within the batch
          format: int32
        account_number:
          type: string
          description: The account number the distribution was posted against
          nullable: true
        account_name:
          type: string
          description: The name of the account the distribution was posted against
          nullable: true
        project_description:
          type: string
          description: The description of the project associated with the distribution
          nullable: true
        debit_amount:
          type: number
          description: The debit amount of the distribution
          format: double
        credit_amount:
          type: number
          description: The credit amount of the distribution
          format: double
        post_date:
          type: string
          description: The date the distribution was posted
          format: date-time
        journal_name:
          type: string
          description: The name of the journal the distribution was posted to
          nullable: true
        journal_reference:
          type: string
          description: The journal reference of the distribution
          nullable: true
        transaction_id:
          type: integer
          description: The identifier of the transaction that produced the distribution
          format: int32
        distribution_id:
          type: integer
          description: The unique identifier of the distribution
          format: int32
      additionalProperties: false
      description: Represents a single general ledger distribution line belonging to a post to general ledger batch
    JournalEntryBatchDistributionDataPagedResult:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/JournalEntryBatchDistributionData'
          description: The records in this page
          nullable: true
        continuation_token:
          type: string
          description: 'The token used to request the following page, or null when this is the last page. Pass it back

            unmodified. A page can contain fewer records than requested, or none at all, and still return a

            token, so use the presence of this token rather than the number of records to decide whether to

            continue. A token is intended for continuing a traversal that is already in progress; it should

            not be stored and reused later.'
          nullable: true
        has_more:
          type: boolean
          description: Whether a following page is available. Equivalent to checking whether the continuation_token field
            is present.
          readOnly: true
      additionalProperties: false
      description: A single page of records along with the token used to request the following page.
    JournalEntryBatchStatus:
      title: JournalEntryBatchStatus
      enum:
      - Approved
      - Deleted
      - Open
      - PendingApproval
      - Posted
      type: string
      description: Status of a journal entry batch
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          description: A URI reference [RFC3986] that identifies the problem type. This specification encourages that, when
            dereferenced, it provide human-readable documentation for the problem type (e.g., using HTML [W3C.REC-html5-20141028]).
