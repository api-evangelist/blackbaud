components:
  schemas:
    SaveDataFormRecordRequest:
      required:
      - values
      type: object
      properties:
        values:
          type: object
          description: Field ID to value map for the form.
        field_meta:
          type: object
          description: Optional per-field { type, translation } overrides.
        context_record_id:
          type: string
          description: Parent/context record ID (e.g. the constituent a child form attaches to).
          nullable: true
        ts_long:
          type: integer
          description: Optimistic-concurrency token from a prior GET.
          format: int64
          nullable: true
    SaveDataFormRecordResponse:
      type: object
      properties:
        id:
          type: string
          nullable: true
        ts_long:
          type: integer
          format: int64
          nullable: true
    LoadDataFormRecordResponse:
      type: object
      properties:
        form_id:
          type: string
          nullable: true
        last_updated:
          type: string
          nullable: true
        ts_long:
          type: integer
          format: int64
          nullable: true
        values:
          type: object
    BatchInstance:
      required:
      - batch_number
      type: object
      properties:
        batch_number:
          maxLength: 100
          minLength: 0
          type: string
          description: The batch number.
        description:
          maxLength: 1000
          minLength: 0
          type: string
          description: The description.
        owner:
          type: string
          description: The owner. This simple list can be queried at https://api.sky.blackbaud.com/alt-adnmg/simplelists/ae93a4b2-05a4-437f-b379-2b912e459d8c?parameters=batch_template_id,{batch_template_id}.
        projected_number_of_records:
          type: integer
          description: 'The projected #.'
          format: int32
        projected_total_amount:
          type: number
          description: The projected amount.
          format: double
        batch_template_id:
          type: string
          description: The batch design. Read-only in the SOAP API.
        display_total_amount:
          type: boolean
          description: Indicates whether display total amount. Read-only in the SOAP API.
        can_change_batch_numbers:
          type: boolean
          description: Indicates whether can change batch numbers. Read-only in the SOAP API.
        projected_total_amount_decimal:
          type: number
          description: The projected amount. Read-only in the SOAP API.
          format: double
        auto_save_on_row_change:
          type: boolean
          description: Indicates whether auto save.
      additionalProperties: false
      description: GetBatchInstance
      x-display-name: Batch Edit Form 2
      x-display-id: Batch Edit Form 2
    PostResponse:
      type: object
      properties:
        id:
          type: string
