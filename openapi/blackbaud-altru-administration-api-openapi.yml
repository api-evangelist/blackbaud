paths:
  /applicationusers/thirdpartyauth/bulk:
    patch:
      operationId: EditApplicationUserThirdPartyAuthBulk
      summary: Edit third-party authentication application users in bulk
      description: A data form used to add multiple third-party authentication application users to the system.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditApplicationUserThirdPartyAuthBulk'
            example:
              add_linked_cms_users: false
              users:
              - display_name: Robert Smith
                email_address: robert.smith@example.com
                site_id: 30af73c5-cfb1-4ec7-a450-9d5f7c9b9f13
                currency_set: 9d848188-1743-4cf4-8bf9-7cafedb8f5b3
                cms_user_id: 2ec7ac5a-a41b-4a8e-9128-89dcd5f0f108
              send_invitation: false
        description: ConfigurationMessage object representing operation intended to be edited
      responses:
        '200':
          description: Returned when the operation succeeds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditApplicationUserThirdPartyAuthBulk'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to update the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /applicationusers/{application_user_id}:
    patch:
      operationId: EditApplicationUser
      summary: Edit an application user
      description: Data form used to edit an application user with CMS fields
      parameters:
      - name: application_user_id
        in: path
        required: true
        schema:
          type: string
        description: The application user ID.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditApplicationUser'
            example:
              constituent_id: 9c3d4e2c-8d1f-4b28-a707-f3f424f8f84b
              username: robert.smith
              site_id: e8617fc5-6ce0-41eb-aa89-17268ca4f2f0
              currency_set: 8adf7694-8a17-4f5b-a6e1-0c13cc9ff4c9
              cms_username: a6bfab5b-3d95-47dc-bf00-457f164326bd
        description: ConfigurationMessage object representing operation intended to be updated
      responses:
        '200':
          description: Returned when the operation succeeds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditApplicationUser'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to update the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    get:
      operationId: GetApplicationUser
      summary: Get an application user
      description: Data form used to edit an application user with CMS fields
      parameters:
      - name: application_user_id
        in: path
        required: true
        schema:
          type: string
        description: The application user ID.
      responses:
        '200':
          description: Returned when the operation succeeds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditApplicationUser'
        '403':
          description: Returned when the user does not have permission to read the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /appusersystemroles:
