  /dataforms/{form_id}/defaults:
    get:
      operationId: GetDataFormDefaults
      summary: Get data form defaults
      description: Loads the default field values for a new record on the Infinity add data form identified by form_id, without
        creating a record. Use context_record_id to resolve defaults that depend on a parent record for child forms. The returned
        values map is keyed by the form's field IDs.
      parameters:
      - name: form_id
        in: path
        required: true
        schema:
          type: string
        description: The GUID of the Infinity add data form to load defaults for.
      - name: context_record_id
        in: query
        required: false
        schema:
          type: string
        description: Optional parent/context record ID for child forms.
      responses:
        '200':
          description: The form defaults were loaded. Default field values are returned in the values map, keyed by the form's
            field IDs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadDataFormRecordResponse'
        '400':
          description: The request was invalid (for example, form_id is not a valid GUID).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /dataforms/{form_id}/records:
    post:
      operationId: CreateDataFormRecord
      summary: Create a data form record
      description: Saves a new record through the Infinity add data form identified by form_id. Field values are supplied
        in the values map keyed by the form's field IDs; use field_meta to override a field's data type (for example guid)
        or supply a code-table translation. context_record_id attaches the new record to a parent record for child forms.
      parameters:
      - name: form_id
        in: path
        required: true
        schema:
          type: string
        description: The GUID of the Infinity add data form to save through.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveDataFormRecordRequest'
            example:
              values:
                NAME: Spring Membership Drive
                DESCRIPTION: Annual spring membership campaign
                STARTDATE: '2026-03-01T12:00:00Z'
                SITEID: 1a2b3c4d-1111-4a00-9c00-0000000000aa
              field_meta:
                SITEID:
                  type: guid
              context_record_id: b7e6d5c4-2222-4000-8000-0000000000bb
        description: The field values to save, keyed by the form's field IDs.
      responses:
        '200':
          description: The record was created. Returns the new record ID and its optimistic-concurrency token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveDataFormRecordResponse'
        '400':
          description: The request was invalid (for example, form_id is not a valid GUID, or ts_long was not an integer).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /dataforms/{form_id}/records/{record_id}:
    get:
      operationId: GetDataFormRecord
      summary: Get a data form record
      description: Loads an existing record through the Infinity data form identified by form_id. The values map is keyed
        by the form's field IDs. The returned ts_long is an optimistic-concurrency token to send back on a subsequent update.
      parameters:
      - name: form_id
        in: path
        required: true
        schema:
          type: string
        description: The GUID of the Infinity data form to load through.
      - name: record_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the record to load.
      - name: context_record_id
        in: query
        required: false
        schema:
          type: string
        description: Optional parent/context record ID for child forms.
      responses:
        '200':
          description: The record was loaded. Field values are returned in the values map, keyed by the form's field IDs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoadDataFormRecordResponse'
        '400':
          description: The request was invalid (for example, form_id is not a valid GUID).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    patch:
      operationId: UpdateDataFormRecord
      summary: Update a data form record
      description: Saves changes to an existing record through the Infinity edit data form identified by form_id. Supply the
        field values to change in the values map, keyed by the form's field IDs. Include ts_long (the optimistic-concurrency
        token from a prior GET) so the save can detect a concurrent edit.
      parameters:
      - name: form_id
        in: path
        required: true
        schema:
          type: string
        description: The GUID of the Infinity edit data form to save through.
      - name: record_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the record to update.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveDataFormRecordRequest'
            example:
              values:
                DESCRIPTION: Annual spring membership campaign (revised)
              ts_long: 72339069014638600
        description: The field values to change, keyed by the form's field IDs, plus the ts_long concurrency token from a
          prior GET.
      responses:
        '200':
          description: The record was updated.
        '400':
          description: The request was invalid (for example, form_id is not a valid GUID, or ts_long was not an integer).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /datalists/{data_list_id}:
    get:
      operationId: LoadDataList
      summary: Load a data list
      description: Loads an Infinity data list identified by its GUID. The caller supplies the data list ID in the path. Arbitrary
        additional query-string parameters are passed through as data list filter fields, using the raw Infinity field name
        and value (no per-field configuration or type conversion). Columns are returned under their raw Infinity field names.
        Optional context_record_id scopes record-bound lists. Paging is controlled with limit/session_key/start_row_index/more_rows_range_key/infinity_session.
      parameters:
      - name: data_list_id
        in: path
        required: true
        schema:
          type: string
        description: The GUID of the Infinity data list to load.
      - name: context_record_id
        in: query
        required: false
        schema:
          type: string
        description: Optional record GUID for record-scoped data lists.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Maximum number of rows to return.
      - name: session_key
        in: query
        required: false
        schema:
          type: string
        description: Pagination session key from a prior response.
      - name: start_row_index
        in: query
        required: false
        schema:
          type: integer
        description: Zero-based start row for get-more-rows paging.
      - name: more_rows_range_key
        in: query
        required: false
        schema:
          type: string
        description: Range key from a prior response for get-more-rows paging.
      - name: infinity_session
        in: query
        required: false
        schema:
          type: string
        description: Opaque Infinity session/affinity token from a prior response.
      responses:
        '200':
          description: Data list loaded successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Datalists-data_list_id-Get200ApplicationJsonResponse'
              example:
                count: 0
                value:
                - {}
                total_available_rows: 0
                session_key: string
                more_rows_range_key: string
                infinity_session: string
                data_no_longer_available: true
        '400':
          description: Bad request (e.g. data_list_id is not a valid GUID).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: string
                title: string
                status: 0
                detail: string
                instance: string
                trace_id: string
                span_id: string
