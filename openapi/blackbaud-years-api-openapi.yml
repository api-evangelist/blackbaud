openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: School Years API'
  description: This API is used to provide access to school information such as users, academics, admissions, athletics, content, lists, and general school info.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/school
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/school
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Years
paths:
  /v1/years:
    get:
      operationId: v1yearsget
      summary: Core years
      description: 'Returns a collection of core school years.


        Requires at least one of the following roles in the Education Management system:


        Academic Group Manager


        Schedule Manager


        Platform Manager


        Any Manager Role'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YearCollection'
              example:
                count: 1
                value:
                - id: 1
                  begin_date: '2018-08-30T12:00:00Z'
                  current_year: true
                  end_date: '2019-06-10T12:00:00Z'
                  published: true
                  school_year_label: 2018-2019
      tags:
      - Years
components:
  schemas:
    Year:
      type: object
      properties:
        id:
          type:
          - integer
          - 'null'
          description: The ID of a school year
          format: int32
        begin_date:
          type:
          - string
          - 'null'
          description: 'The begin date in a school year date range. Uses <a href="https://tools.ietf.org/html/rfc3339" target="_blank">ISO-8601</a> (24H) format: 2003-04-21T10:29:43'
          format: date-time
        current_year:
          type:
          - boolean
          - 'null'
          description: Returns True if Current Year is enabled for the respective school year
        end_date:
          type:
          - string
          - 'null'
          description: 'The end date in a school year date range. Uses <a href="https://tools.ietf.org/html/rfc3339" target="_blank">ISO-8601</a> (24H) format: 2003-04-21T10:29:43'
          format: date-time
        published:
          type:
          - boolean
          - 'null'
          description: Gets or sets the published flag
        school_year_label:
          type:
          - string
          - 'null'
          description: The label used to identify the range of dates in a school year
        begin_billing_year_date:
          type:
          - string
          - 'null'
          description: 'The begin billing year date in a school year date range. Uses <a href="https://tools.ietf.org/html/rfc3339" target="_blank">ISO-8601</a> (24H) format: 2003-04-21T10:29:43'
          format: date-time
        end_billing_year_date:
          type:
          - string
          - 'null'
          description: 'The end billing year date in a school year date range. Uses <a href="https://tools.ietf.org/html/rfc3339" target="_blank">ISO-8601</a> (24H) format: 2003-04-21T10:29:43'
          format: date-time
      additionalProperties: false
      description: An object with school year information
    YearCollection:
      type: object
      properties:
        count:
          type: integer
          description: The number of items in the collection
          format: int32
          readOnly: true
        next_link:
          type:
          - string
          - 'null'
          description: For paginated responses, the URI for the next page of results
        value:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Year'
          description: The set of items included in the response. This may be a subset of the items in the collection
      additionalProperties: false
      description: A Collection
  securitySchemes:
    Bb-Api-Subscription-Key:
      type: apiKey
      name: Bb-Api-Subscription-Key
      in: header
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://app.blackbaud.com/oauth/authorize
          tokenUrl: https://oauth2.sky.blackbaud.com/token
          scopes: {}
