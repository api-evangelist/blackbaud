          - string
          - 'null'
        sex:
          type:
          - string
          - 'null'
        americanIndianOrAlaskaNative:
          type:
          - boolean
          - 'null'
        asian:
          type:
          - boolean
          - 'null'
        blackOrAfricanAmerican:
          type:
          - boolean
          - 'null'
        nativeHawaiianOrOtherPacificIslander:
          type:
          - boolean
          - 'null'
        white:
          type:
          - boolean
          - 'null'
        demographicRaceTwoOrMoreRaces:
          type:
          - boolean
          - 'null'
        hispanicOrLatinoEthnicity:
          type:
          - boolean
          - 'null'
        countryOfBirthCode:
          type:
          - string
          - 'null'
        stateOfBirthAbbreviation:
          type:
          - string
          - 'null'
        cityOfBirth:
          type:
          - string
          - 'null'
        publicSchoolResidenceStatus:
          type:
          - string
