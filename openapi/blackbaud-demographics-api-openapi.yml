          - string
          - 'null'
        imsx_messageRefIdentifier:
          type:
          - string
          - 'null'
        imsx_operationRefIdentifier:
          type:
          - string
          - 'null'
        imsx_description:
          type:
          - string
          - 'null'
        imsx_codeMinor:
          type:
          - string
          - 'null'
      additionalProperties: false
    DemographicOutputModel:
      type: object
      properties:
        demographic:
          $ref: '#/components/schemas/ORDemographicModel'
      additionalProperties: false
    DemographicsOutputModel:
      type: object
      properties:
        demographics:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ORDemographicModel'
        statusInfoSet:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/StatusInfoModel'
      additionalProperties: false
    ORDemographicModel:
      type: object
      properties:
        birthDate:
