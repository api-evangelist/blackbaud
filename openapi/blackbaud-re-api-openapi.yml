          type:
          - string
          - 'null'
          description: The Raiser's Edge user name.
        constituent_id:
          type:
          - integer
          - 'null'
          description: The constituent ID associated with a user.
          format: int32
        is_fundraiser:
          type: boolean
          description: Indicates whether the user is a fundraiser.
