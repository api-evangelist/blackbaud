      required:
      - appeal_description
      - constituent_id
      type: object
      properties:
        constituent_id:
          maximum: 2147483647
          minimum: 1
          type: integer
          description: The immutable system record ID of the constituent associated with the constituent appeal.
          format: int32
        import_id:
          maxLength: 20
          minLength: 0
          type:
          - string
          - 'null'
          description: The import ID of the constituent appeal.
        appeal_description:
          maxLength: 100
          minLength: 0
          type: string
          description: The appeal description; used to look up the appeal record ID.
        package_description:
          maxLength: 50
          minLength: 0
          type:
          - string
          - 'null'
          description: The package description; used to look up the package record ID.
        response_description:
          type:
          - string
          - 'null'
          description: The long description of the response for the constituent appeal.
        comments:
          maxLength: 50
          minLength: 0
          type:
          - string
          - 'null'
          description: The comments associated with the constituent appeal.
        appeal_date:
          type:
          - string
          - 'null'
          description: The date for the constituent appeal.
          format: date
        mailing_id:
          type:
          - integer
          - 'null'
          description: The mailing ID of the constituent appeal.
          format: int32
        market_finder_number:
          maxLength: 19
          minLength: 0
          type:
          - string
          - 'null'
          description: The market finder number associated with the constituent appeal.
        marketing_segment:
          maxLength: 255
          minLength: 0
          type:
          - string
          - 'null'
          description: The marketing segment associated with the constituent appeal.
        marketing_source_code:
          maxLength: 50
          minLength: 0
          type:
          - string
          - 'null'
