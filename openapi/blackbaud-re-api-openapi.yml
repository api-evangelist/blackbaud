  /v1/re/codetables:
    post:
      operationId: CreateCodeTable
      summary: Create a code table
      description: Creates a new code table.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CodeTableCreate'
            example:
              name: Country
        description: The code table to add.
      responses:
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '200':
          description: Returned when the operation succeeds. The response body contains the new code table ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: '987'
      tags:
      - Re
    get:
      operationId: GetCodeTableList
      summary: Get code table list
      description: Returns a list of code tables.
      parameters:
      - name: name
        in: query
        required: false
        schema:
          type: string
        description: The name of the code table used for filtering.
      - name: include_hidden_system
        in: query
        required: false
        schema:
          type: boolean
        description: Indicates whether to include hidden system code tables.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      - name: offset
        in: query
        required: false
        schema:
          type: integer
      responses:
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '200':
          description: Returned when the operation succeeds. The response body contains the code table list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeTableCollection'
              example:
                count: 1
                value:
                - code_tables_id: 5
                  name: Country
                  user_defined: false
                  has_short_description: true
                  short_description_length: 5
                  hidden_system_table: true
      tags:
      - Re
  /v1/re/codetables/{code_table_id}/tableentries:
    post:
