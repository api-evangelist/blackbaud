      description: Returns a list of table entries.
      parameters:
      - name: code_table_id
        in: path
        required: true
        schema:
          type: integer
        description: The code table ID.
      - name: long_description
        in: query
        required: false
        schema:
          type: string
        description: The long description of the table entry.
      - name: short_description
        in: query
        required: false
        schema:
          type: string
        description: The short description of the table entry.
      - name: numeric_value
        in: query
        required: false
        schema:
          type: number
        description: The numeric value of the table entry.
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
        description: Indicates whether to include inactive table entries.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      - name: offset
        in: query
        required: false
        schema:
          type: integer
      responses:
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '200':
          description: Returned when the operation succeeds. The response body contains the table entry list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableEntryCollection'
              example:
                count: 1
                value:
                - table_entries_id: 6
                  is_active: true
                  long_description: Employee
                  short_description: EMP
                  numeric_value: 0
                  sequence: 3
                  is_system_entry: false
                  code_tables_id: 43
                  date_added: '0001-01-01T12:00:00Z'
                  date_changed: '0001-01-01T12:00:00Z'
                  added_by_id: 12345
                  last_changed_by_id: 12345
                  code_tables_name: Constituent Codes
      tags:
      - Re
