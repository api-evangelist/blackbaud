  /v1/re/constituentidmap/{constituentid}:
    get:
      operationId: GetConstituentIdMapByConstituentId
      summary: Get a constituent record id from constituent id
      description: Returns a constituent system record id mapping for a given constituent id.
      parameters:
      - name: constituentid
        in: path
        required: true
        schema:
          type: string
        description: The constituent ID.
      responses:
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '200':
          description: Returned when the operation succeeds. The response body contains the system record id and the constituent id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstituentIdMap'
              example:
                constituent_id: C00001
                system_record_id: 1
                fundraiser_status: None
        '404':
          description: Returned when the specified constituent is not found.
      tags:
      - Re
  /v1/re/constituents/customsearch:
    get:
      operationId: GetCustomSearchConstituent
      summary: Get constituent list (search)
      description: Searches for constituent records using the given filter criteria.
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to return. The default is 500. The maximum is 1000.
      - name: first_name
        in: query
        required: false
        schema:
          type: string
        description: First name.
      - name: last_name
        in: query
        required: false
        schema:
          type: string
        description: Last name.
      - name: alias_type
        in: query
        required: false
        schema:
          type: string
        description: Alias type.
      - name: lookup_id
        in: query
        required: false
        schema:
          type: string
        description: Lookup ID.
      - name: address_lines
        in: query
        required: false
        schema:
          type: string
        description: Address lines.
      - name: city
        in: query
        required: false
        schema:
          type: string
        description: Address city.
      - name: state
        in: query
        required: false
        schema:
          type: string
        description: Address state.
      - name: post_code
        in: query
        required: false
        schema:
          type: string
        description: Address postal code.
      - name: email
        in: query
        required: false
        schema:
