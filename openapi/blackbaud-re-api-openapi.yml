openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: NXT Data Integration Re API'
  description: This API supports an expanded set of endpoints optimized for data integration scenarios.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/nxt-data-integration
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/nxt-data-integration
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Re
paths:
  /v1/re/appeals:
    post:
      operationId: CreateAppeal
      summary: Create an appeal
      description: Creates a new appeal.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppealCreate'
            example:
              appeal_id: PGLETTER
              campaign_id: 3
              appeal_category_id: 1347
              description: Planned Giving Letter
              goal: 20000
              start_date: '0001-01-01T12:00:00Z'
              end_date: '0001-01-01T12:00:00Z'
              inactive: false
              default_fund_id: 202
              notes: We send several planned giving letters throughout the year.
              number_solicited: 716
              default_gift_amount: 0
        description: The appeal to add.
      responses:
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '200':
          description: Returned when the operation succeeds. The response body contains the new appeal ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: '987'
      tags:
      - Re
    get:
      operationId: GetAppealList
      summary: Get appeal list
      description: Returns a list of appeals.
      parameters:
      - name: appeal_id
        in: query
        required: false
        schema:
          type: string
        description: The unique appeal id.
      - name: description
        in: query
        required: false
        schema:
          type: string
        description: The appeal description.
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
        description: Indicates whether to include inactive appeals.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      - name: offset
        in: query
        required: false
        schema:
          type: integer
      responses:
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '200':
          description: Returned when the operation succeeds. The response body contains a collection and count of filtered appeals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppealCollection'
              example:
                count: 1
                value:
                - appeal_category: '1340'
                  campaign: ANNUAL
                  id: 987
                  appeal_id: PGLETTER
                  campaign_id: 3
                  appeal_category_id: 1347
                  description: Planned Giving Letter
                  goal: 20000
                  start_date: '0001-01-01T12:00:00Z'
                  end_date: '0001-01-01T12:00:00Z'
                  inactive: false
                  default_fund_id: 202
                  notes: We send several planned giving letters throughout the year.
                  number_solicited: 716
                  default_gift_amount: 0
      tags:
      - Re
  /v1/re/appeals/{id}:
    delete:
      operationId: DeleteAppeal
      summary: Delete an appeal
      description: Deletes an appeal.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: The appeal system ID.
      responses:
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '200':
          description: Returned when the operation successfully deletes the appeal.
      tags:
      - Re
    patch:
      operationId: EditAppeal
      summary: Edit an appeal
      description: Edit the details about an appeal.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: The table entry system ID.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AppealEdit'
            example:
              appeal_id: PGLETTER
              campaign_id: 3
              appeal_category_id: 1347
              description: Planned Giving Letter
              goal: 20000
              start_date: '0001-01-01T12:00:00Z'
              end_date: '0001-01-01T12:00:00Z'
              inactive: false
              default_fund_id: 202
              notes: We send several planned giving letters throughout the year.
              number_solicited: 716
              default_gift_amount: 0
        description: Description of changes for the appeal.
      responses:
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '200':
          description: Returned when the operation succeeds.
      tags:
      - Re
    get:
      operationId: GetAppeal
      summary: Get an appeal
      description: Returns details about an appeal.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: The appeal system ID.
      responses:
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '200':
          description: Returned when the operation succeeds. The response body contains the appeal record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appeal'
              example:
                appeal_category: '1340'
                campaign: ANNUAL
                id: 987
                appeal_id: PGLETTER
                campaign_id: 3
                appeal_category_id: 1347
                description: Planned Giving Letter
                goal: 20000
                start_date: '0001-01-01T12:00:00Z'
                end_date: '0001-01-01T12:00:00Z'
                inactive: false
                default_fund_id: 202
                notes: We send several planned giving letters throughout the year.
                number_solicited: 716
                default_gift_amount: 0
        '404':
          description: Returned when the specified appeal is not found.
      tags:
      - Re
