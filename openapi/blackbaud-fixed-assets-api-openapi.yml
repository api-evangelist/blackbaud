    get:
      operationId: ListAssets
      summary: Get asset list
      description: Returns a paginated list of assets.
      parameters:
      - name: search_text
        in: query
        required: false
        schema:
          type: string
        description: 'Text to match.

          Can match asset number.'
      - name: convention
        in: query
        required: false
        schema:
          type: string
          enum:
          - HalfYear
          - MidQuarter
          - MidMonth
          - FullYear
          - ZeroInFirstYear
          - FullMonth
          - ZeroInFirstMonth
        description: Filter the results by convention.
      - name: is_disposed
        in: query
        required: false
        schema:
          type: string
          enum:
          - 'Yes'
          - 'No'
        description: Filter the results for disposed assets.
      - name: to_date
        in: query
        required: false
        schema:
          type: string
        description: Filter the assets before a certain date.
      - name: from_date
        in: query
        required: false
        schema:
          type: string
        description: Filter the assets after a certain date.
      - name: date_added
        in: query
        required: false
        schema:
          type: string
        description: Filter the results added on or after the specified date.
      - name: added_by
        in: query
        required: false
        schema:
          type: string
        description: Filter the results by who added the asset.
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: Filter the results modified on or after the specified date.
      - name: last_modified_by
        in: query
        required: false
        schema:
          type: string
        description: Filter the results by who last modified the asset.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: "Represents the number of records to skip. \nFor use with pagination."
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: "The number of records to return.\nThe default is 100. \nThe maximum allowed value is 500."
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the list of assets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetSummaryApiCollection'
              example:
                count: 150
                value:
                - asset_number: 1
                  user_defined_id: '1001'
                  serial_number: '1234'
                  inservice_date: '2024-01-10T10:43:21Z'
                  description: Campus
                  location: Administration Building
                  department: 01 - Administration
                  acquisition_date: '2024-01-10T10:43:21Z'
                  asset_class: 1510 Land - Operating
                  asset_id: 1234
                  vendor_name: A+ Office Supplies
                  acquisition_value: 80000
                  depreciation_method: Do not depreciate
                  convention: Half-year
                  salvage_value: 12.36
                  is_disposed: true
                - asset_number: 1
                  user_defined_id: '1001'
                  serial_number: '1234'
                  inservice_date: '2024-01-10T10:43:21Z'
                  description: Furniture
                  location: Administration Building
                  department: 01 - Administration
                  acquisition_date: '2024-01-10T10:43:21Z'
                  asset_class: 1510 Land - Operating
                  asset_id: 1233
                  vendor_name: Daylight Doughnuts
                  acquisition_value: 80000
                  depreciation_method: Do not depreciate
                  convention: Half-year
                  salvage_value: 12.36
                  is_disposed: true
        '400':
          description: Returned when the request is not in the correct format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Invalid Request
                Details:
                - The value 'fake' is not valid for transaction_status.
        '403':
          description: Returned when the user does not have permission to view assets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights
                  to view it.
