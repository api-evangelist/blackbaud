openapi: 3.0.1
info:
  title: 'Blackbaud SKY API: Fixed Assets'
  description: This API is used to manage fixed assets, including transactions.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/fas-proxy
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations,
      examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/fixedassets
paths:
