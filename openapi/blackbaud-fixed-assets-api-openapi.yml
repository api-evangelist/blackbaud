  /v1/transactions:
    get:
      operationId: ListTransactions
      summary: Get transaction list
      description: Returns a paginated list of transactions.
      parameters:
      - name: search_text
        in: query
        required: false
        schema:
          type: string
        description: 'Text to match.

          Can match transaction number.'
      - name: asset_description
        in: query
        required: false
        schema:
          type: string
        description: Filter the results by asset description.
      - name: post_status
        in: query
        required: false
        schema:
          type: string
          enum:
          - DoNotPost
          - NotYetPosted
          - Posted
        description: Filter the results using the transaction post status.
      - name: transaction_type
        in: query
        required: false
        schema:
          type: string
          enum:
          - AccumulatedDepreciation
          - AnnualDepreciation
          - AssetAcquisition
          - AssetDisposal
          - AssetImprovement
          - PeriodDepreciation
          - YTDDepreciation
        description: Filter the results using the transaction type.
      - name: to_date
