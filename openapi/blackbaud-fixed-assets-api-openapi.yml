components:
  schemas:
    AccountSummary:
      type: object
      properties:
        number:
          type: string
          description: The account number.
          nullable: true
        description:
          type: string
          description: The account description.
          nullable: true
        status:
          type: integer
          description: The account status.
          format: int32
        class:
          type: string
          description: The account class.
          nullable: true
      additionalProperties: false
      description: Contract for account summary details.
    Address:
      type: object
      properties:
        AddressDescription:
          type: string
          nullable: true
        ContactName:
          type: string
          nullable: true
        ShortAddress:
          type: string
          nullable: true
          readOnly: true
        Country:
          type: string
          nullable: true
        City:
          type: string
          nullable: true
        State:
          type: string
          nullable: true
        Zip:
          type: string
          nullable: true
        AddressLine:
          type: string
          nullable: true
        Suburb:
          type: string
          nullable: true
        NzCity:
          type: string
          nullable: true
        County:
          type: string
          nullable: true
        FormatAs:
          type: string
          nullable: true
        FullAddress:
          type: string
          nullable: true
        Id:
          type: integer
          format: int32
        WarningOverrides:
          type: array
          items:
            type: integer
            format: int32
          nullable: true
      additionalProperties: false
    AdjustmentSummary:
      type: object
      properties:
        post_date:
          type: string
          description: The post date.
          format: date-time
          nullable: true
        post_status:
          $ref: '#/components/schemas/FaPostStatus'
        adjustment_date:
          type: string
          description: The adjustment date.
          format: date-time
          nullable: true
        reason:
          type: string
          description: The reason.
          nullable: true
        note:
          type: string
          description: The note.
          nullable: true
        reversing_id:
          type: integer
          description: The reversing identifier.
          format: int32
          nullable: true
        previous_distributions:
          type: array
          items:
            $ref: '#/components/schemas/GlDistributionAccount'
          description: The previous distribution.
          nullable: true
        adjusted_distributions:
          type: array
          items:
            $ref: '#/components/schemas/GlDistributionAccount'
          description: The adjustment distribution.
          nullable: true
      additionalProperties: false
      description: Contract for adjustment summary.
    AssetClasses:
      type: object
      properties:
        class_id:
          type: integer
          format: int32
        class_description:
          type: string
          nullable: true
        depreciation_method:
          type: integer
          format: int32
        convention:
          type: integer
          format: int32
          nullable: true
        useful_life:
          type: integer
          format: int32
          nullable: true
        salvage_value:
          type: number
          format: decimal
          nullable: true
      additionalProperties: false
    AssetResponse:
