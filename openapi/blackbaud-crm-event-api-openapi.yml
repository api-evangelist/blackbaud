              name: Alumni Dinner
              description: Fall alumni dinner
              start_date: '2019-04-18T12:00:00Z'
              start_time:
                hour: 3
                minute: 30
              end_date: ''
              end_time:
                hour: 5
                minute: 30
              capacity: 100
              main_event_id: ''
              event_location_id: ''
              event_location_contact_id: ''
              copy_from_event_id: ''
              copy_tasks: false
              copy_invitations: false
              copy_invitees: false
              copy_designations: false
              copy_expenses: false
              copy_prices: false
              copy_attributes: false
              attribute_defined: false
              sites:
