          minLength: 0
          type: string
          description: The description.
        start_date:
          type: string
          description: 'The start date. Uses the format YYYY-MM-DDThh:mm:ss. An example date: <i>1955-11-05T22:04:00</i>.'
          format: date-time
        start_time:
          $ref: '#/components/schemas/HourMinute'
        end_date:
          type: string
          description: 'The end date. Uses the format YYYY-MM-DDThh:mm:ss. An example date: <i>1955-11-05T22:04:00</i>.'
          format: date-time
        end_time:
          $ref: '#/components/schemas/HourMinute'
        capacity:
          type: integer
          description: The capacity.
          format: int32
        main_event_id:
          type: string
          description: The main event.
        event_location_id:
          type: string
          description: The location.
        event_location_contact_id:
