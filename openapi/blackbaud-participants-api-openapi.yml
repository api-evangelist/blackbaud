info:
  title: 'Blackbaud SKY API: Event Participants API'
  description: This API manages event information and related entities such as participant.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/event
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/event
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Participants
paths:
  /v1/participants/{participant_id}:
    delete:
      operationId: DeleteParticipant
      summary: Delete a participant
      description: Deletes a participant.
      parameters:
      - name: participant_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the participant.
      responses:
        '200':
          description: Returned when the operation succeeds.
        '400':
          description: Returned when the specified participant ID is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Participants-participant_id-Delete400ApplicationJsonResponse'
              example:
              - message: The request body is not in the appropriate format.
                error_name: BadRequest
                error_code: 400
                raw_message: The request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to delete the participant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Participants-participant_id-Delete403ApplicationJsonResponse'
              example:
              - message: The user does not have the necessary permissions for this task.
                error_name: Forbidden
                error_code: 403
                raw_message: The user does not have the necessary permissions for this task.
      tags:
      - Participants
    patch:
      operationId: EditParticipant
      summary: Edit a participant
      description: Edits the details about a participant.
      parameters:
      - name: participant_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the participant.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditParticipant'
            example:
              host_id: '181'
              rsvp_status: Attending
              attended: false
              invitation_status: Invited
              rsvp_date:
                d: 1
                m: 1
                y: 2020
              invitation_date:
                d: 1
                m: 1
                y: 2020
              participation_level:
                id: '1493'
                name: Coordinator
                is_inactive: false
              summary_note: Major donor who invites a lot of people.
        description: An object that represents the changes to the participant.
      responses:
        '200':
          description: Returned when the operation succeeds.
        '400':
          description: Returned when the specified request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Participants-participant_id-Patch400ApplicationJsonResponse'
              example:
              - message: The request body is not in the appropriate format.
                error_name: BadRequest
                error_code: 400
                raw_message: The request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to edit the participant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Participants-participant_id-Patch403ApplicationJsonResponse'
              example:
              - message: The user does not have the necessary permissions for this task.
                error_name: Forbidden
                error_code: 403
                raw_message: The user does not have the necessary permissions for this task.
        '404':
          description: Returned when the specified participant is not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Participants-participant_id-Patch404ApplicationJsonResponse'
              example:
              - message: The requested resource could not be found.
                error_name: ResourceNotFound
                error_code: 404
                raw_message: The requested resource could not be found.
      tags:
      - Participants
    get:
      operationId: GetParticipant
      summary: Get a participant
      description: Returns information about a specific participant.
      parameters:
      - name: participant_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the participant.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the participant record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participant'
              example:
                id: '2'
                constituent_id: '34'
                event_id: '5'
                date_added: '2017-09-15T01:00:00Z'
                date_modified: '2017-09-15T01:00:00Z'
                host_id: '181'
                rsvp_status: Attending
                attended: false
                invitation_status: Invited
                rsvp_date:
                  d: 1
                  m: 1
                  y: 2020
                invitation_date:
                  d: 1
                  m: 1
                  y: 2020
                participation_level:
                  id: '1493'
                  name: Coordinator
                  is_inactive: false
                summary_note: Major donor who invites a lot of people.
        '400':
          description: Returned when the route does not contain a valid ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Participants-participant_id-Get400ApplicationJsonResponse'
              example:
              - message: The request body is not in the appropriate format.
