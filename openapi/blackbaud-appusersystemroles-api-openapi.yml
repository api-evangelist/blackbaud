openapi: 3.2.0
info:
  title: Blackbaud Appusersystemroles API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Appusersystemroles across 2 of this provider''s published API definitions: blackbaud-altru-administration-api-openapi.yml, blackbaud-crm-administration-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/alt-adnmg
- url: https://api.sky.blackbaud.com/crm-adnmg
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Appusersystemroles
paths:
  /appusersystemroles:
    post:
      operationId: CreateAppUserSystemRole
      summary: Create an application user system role
      description: Data form used to add a system role to an application user from the application user page.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAppUserSystemRole'
            example:
              app_user_id: f1a0dd8e-2f58-4c8a-84f3-1fbc5776f7db
              system_role_id: 920f8f5e-f4c5-4d83-b100-b352fb24cf77
              security_mode: All records
              site_hierarchy:
              - site_id: f4e61fea-c0bf-44f6-9db9-a8d67e3241dc
                parent_site_id: 1063cebb-c4fa-4cb0-9005-eb4a2738bc7c
                name: Headquarters
                sequence: 0
                system_role_app_user_site_id: 6a9ef6e1-cf67-478e-8584-f987cef9e4b4
              sites:
              - id: d95d32f8-fc4c-49e7-a9ab-a24dc5da466f
                site_id: f4e61fea-c0bf-44f6-9db9-a8d67e3241dc
              branch_site: f4e61fea-c0bf-44f6-9db9-a8d67e3241dc
              constituent_security_mode: All records
              constituent_security_groups:
              - id: d867ed31-bf50-4b93-8c07-5f16829b5306
                constituent_security_attribute: fe29430c-f7be-4f86-a9e0-4fcbfdb6ce26
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation succeeds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Appusersystemroles
    servers:
    - url: https://api.sky.blackbaud.com/alt-adnmg
components:
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          description: A URI reference [RFC3986] that identifies the problem type. This specification encourages that, when dereferenced, it provide human-readable documentation for the problem type (e.g., using HTML [W3C.REC-html5-20141028]). When this member is not present, its value is assumed to be "about:blank".
        title:
          type: string
          description: A short, human-readable summary of the problem type. It SHOULD NOT change from occurrence to occurrence of the problem, except for purposes of localization (e.g., using proactive content negotiation; see [RFC7231], Section 3.4).
        status:
          type: integer
          description: The HTTP status code ([RFC7231], Section 6) generated by the origin server for this occurrence of the problem.
          format: int32
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        instance:
          type: string
          description: A URI reference that identifies the specific occurrence of the problem. It may or may not yield further information if dereferenced.
        trace_id:
          type: string
          description: A request ID that can be provided to Blackbaud Support that may help with further troubleshooting.
        span_id:
          type: string
          description: A request ID that can be provided to Blackbaud Support that may help with further troubleshooting.
      additionalProperties: false
      description: A machine-readable format for specifying errors in HTTP API responses based on https://tools.ietf.org/html/rfc7807.
      x-display-name: Problem details
      x-display-id: ProblemDetails
    NewAppUserSystemRole:
      required:
      - app_user_id
      - system_role_id
      - security_mode
      - constituent_security_mode
      type: object
      properties:
        app_user_id:
          type: string
          description: The application user ID.
        system_role_id:
          type: string
          description: The system role ID.
        security_mode:
          type: string
          description: The record access mode.
        site_hierarchy:
          type: array
          items:
            $ref: '#/components/schemas/NewAppUserSystemRoleSiteHierarchy'
          description: Site hierarchy values.
        sites:
          type: array
          items:
            $ref: '#/components/schemas/NewAppUserSystemRoleSite'
          description: Assigned sites.
        branch_site:
          type: string
          description: The branch site.
        constituent_security_mode:
          type: string
          description: The constituent record access mode.
        constituent_security_groups:
          type: array
          items:
            $ref: '#/components/schemas/NewAppUserSystemRoleConstituentSecurityGroup'
          description: Constituent security groups.
      additionalProperties: false
      description: CreateAppUserSystemRole
      x-display-name: Application User System Role Add Form
      x-display-id: F2B751BF-8ED3-48E4-9EC2-4D7FB5E46B01
    NewAppUserSystemRoleSite:
      type: object
      properties:
        id:
          type: string
          description: The site row ID.
        site_id:
          type: string
          description: The site ID.
      additionalProperties: false
      description: NewAppUserSystemRoleSite
      x-display-name: Assigned sites
      x-display-id: SITES
    NewAppUserSystemRoleSiteHierarchy:
      type: object
      properties:
        site_id:
          type: string
          description: The site ID.
        parent_site_id:
          type: string
          description: The parent site ID.
        name:
          type: string
          description: The site name.
        sequence:
          type: integer
          description: The sequence.
          format: int32
        system_role_app_user_site_id:
          type: string
          description: The system role app user site ID.
      additionalProperties: false
      description: NewAppUserSystemRoleSiteHierarchy
      x-display-name: Site hierarchy values
      x-display-id: SITEHIERARCHY
    PostResponse:
      type: object
      properties:
        id:
          type: string
          description: The newly created ID.
      additionalProperties: false
      description: Defines the shape of a post response object.
    NewAppUserSystemRoleConstituentSecurityGroup:
      required:
      - constituent_security_attribute
      type: object
      properties:
        id:
          type: string
          description: The constituent security group row ID.
        constituent_security_attribute:
          type: string
          description: The constituent security group.
      additionalProperties: false
      description: NewAppUserSystemRoleConstituentSecurityGroup
      x-display-name: Constituent security groups
      x-display-id: CONSTITUENTSECURITYGROUPS
  securitySchemes:
    Bb-Api-Subscription-Key:
      type: apiKey
      name: Bb-Api-Subscription-Key
      in: header
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://app.blackbaud.com/oauth/authorize
          tokenUrl: https://oauth2.sky.blackbaud.com/token
          scopes: {}
