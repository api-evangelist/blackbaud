security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Eventgroups
paths:
  /v1/eventgroups:
    get:
      operationId: GetEventGroups
      summary: Get event groups (PREVIEW)
      description: 'Returns a list of event groups.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
        description: Represents whether to include inactive entries.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of event groups.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventGroupCollection'
              example:
                count: 3
                value:
                - id: '1'
                  name: Auctions
                  is_inactive: false
                - id: '2'
                  name: Dinner Events
                  is_inactive: false
                - id: '3'
                  name: Golf Events
                  is_inactive: true
        '400':
          description: Returned when the request filters are improperly formatted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1EventgroupsGet400ApplicationJsonResponse'
              example:
              - message: The request body is not in the appropriate format.
                error_name: BadRequest
                error_code: 400
                raw_message: The request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have rights to view event groups.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1EventgroupsGet403ApplicationJsonResponse'
              example:
              - message: The user does not have the necessary permissions for this task.
                error_name: Forbidden
                error_code: 403
                raw_message: The user does not have the necessary permissions for this task.
      tags:
      - Eventgroups
