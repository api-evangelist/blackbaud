components:
  schemas:
    NodeType:
      enum:
      - OneToOne
      - OneToMany
      - Summary
      type: string
      description: Classifications of nodes in the available fields trees.<p>Members:</p><ul><li><i>OneToOne</i> - A nodes which has a 1:1 relationship with its parent node.</li><li><i>OneToMany</i> - A node which has a 1:many relationship with its parent node.</li><li><i>Summary</i> - A node which provides summary information about records returned from its parent node.</li></ul>
    GetNodeResponse:
      type: object
      properties:
        node_id:
          type: integer
          description: The ID of the node.
          format: int32
        nodes:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/QueryNode'
          description: The requested QueryNodes
        fields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/QueryField'
          description: The requested QueryFields
      additionalProperties: false
      description: 'Response containing a requested node.

        (deprecated — use v2 with string IDs).'
    QueryNodesRequestV2:
      required:
      - node_ids
      type: object
      properties:
        node_ids:
          type: array
          items:
            type: string
          description: The set of nodes to retrieve.
      additionalProperties: false
      description: A request for a set of available fields tree nodes.
    GetFieldsResponse:
      type: object
      properties:
        nodes:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/QueryNode'
          description: The requested QueryNodes
        fields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/QueryField'
          description: The requested QueryFields
      additionalProperties: false
      description: 'Response model for GetRootNodesForQueryType and GetChildrenOfQueryNode

        (deprecated — use v2 with string IDs).'
    AvailableFieldsSearchResultV2:
      type: object
      properties:
        result_type:
          $ref: '#/components/schemas/AvailableFieldsSearchResultType'
        id_sequence:
          type:
          - array
          - 'null'
          items:
            type: string
          description: The sequence of node and field IDs from the root node to the matching node or field.
        result_path:
          type:
          - array
          - 'null'
          items:
            type: string
          description: The path of nodes leading to and including the matched node or field.
        unique_id:
          type:
          - string
          - 'null'
