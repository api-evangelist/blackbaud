openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: Query Querytypes API'
  description: This API supports defining and executing queries for NXT products
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/query
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/query
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Querytypes
paths:
  /querytypes:
    get:
      operationId: GetQueryTypes
      summary: Query type list
      description: Gets the list of available query types.
      parameters:
      - name: product
        in: query
        required: true
        schema:
          type: string
          enum:
          - RE
          - FE
        description: The Blackbaud product for the request<p>Members:</p><ul><li><i>RE</i> - The Raiser's Edge</li><li><i>FE</i> - The Financial Edge</li></ul>
      - name: module
        in: query
        required: true
        schema:
          type: string
          enum:
          - None
          - GeneralLedger
          - AccountsPayable
          - AccountsReceivable
          - FixedAssets
          - CashReceipts
        description: The module for the request (RE requests must use 'None', FE requests require one of the other values)<p>Members:</p><ul><li><i>None</i></li><li><i>GeneralLedger</i></li><li><i>AccountsPayable</i></li><li><i>AccountsReceivable</i></li><li><i>FixedAssets</i></li><li><i>CashReceipts</i></li></ul>
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetQueryTypesResponse'
              example:
                query_types:
                - id: 18
                  name: Constituent
                - id: 20
                  name: Gift
        '400':
          description: Returned when the request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/QueryDefinitionServiceErrorCodes'
              example:
                type: urn:blackbaud:missing-product
                title: One or more validation errors occurred.
                status: 400
                detail: Product was not supplied.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have permission to access the resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:forbidden
                title: The requested action is forbidden.
                status: 403
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
      tags:
      - Querytypes
  /querytypes/{query_type_id}/availablefields:
    get:
      operationId: GetRootNodesForQueryType
      summary: Available fields tree (Root)
      description: Gets the list of nodes at the root of the available fields tree for a query type. **DEPRECATED** — Use the v2 endpoint instead.
      parameters:
      - name: query_type_id
        in: path
        required: true
        schema:
          type: integer
        description: The query type ID
      - name: product
        in: query
        required: true
        schema:
          type: string
          enum:
          - RE
          - FE
        description: The Blackbaud product for the request<p>Members:</p><ul><li><i>RE</i> - The Raiser's Edge</li><li><i>FE</i> - The Financial Edge</li></ul>
      - name: module
        in: query
        required: true
        schema:
          type: string
          enum:
          - None
          - GeneralLedger
          - AccountsPayable
          - AccountsReceivable
          - FixedAssets
          - CashReceipts
        description: The module for the request (RE requests must use 'None', FE requests require one of the other values)<p>Members:</p><ul><li><i>None</i></li><li><i>GeneralLedger</i></li><li><i>AccountsPayable</i></li><li><i>AccountsReceivable</i></li><li><i>FixedAssets</i></li><li><i>CashReceipts</i></li></ul>
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetFieldsResponse'
              example:
                nodes:
                - id: 2159
                  name: Adjustments
                  node_type: OneToMany
                - id: 12099
                  name: Amendments
                  node_type: OneToMany
                - id: 2169
                  name: Appeals
                  node_type: OneToMany
                fields:
                - id: 8452
                  available_field_name: Acknowledge
                  selected_field_name: Gift Acknowledge
                  value_type: Text
                  one_to_many: false
                  output_sort_can_add_edit: false
                  criteria_can_add_edit: false
                  execute_by_id_supported: false
                  allowed_filter_operators:
                  - Equals
                  - DoesNotEqual
                  - RelativeComparisons
                  - OneOf
                  - StringComparisons
                  - Blank
                  - Ask
                  - OneOfEach
                  node_path:
                  - id: '306'
                    name: Gifts
                    node_type: OneToMany
                    gift_processing_options_supported: false
                  summary_value_type: Text
                - id: 8453
                  available_field_name: Acknowledge date
                  selected_field_name: Gift Acknowledge date
                  value_type: Text
                  one_to_many: false
                  output_sort_can_add_edit: false
                  criteria_can_add_edit: false
                  execute_by_id_supported: false
                  allowed_filter_operators:
                  - Equals
                  - DoesNotEqual
                  - RelativeComparisons
                  - OneOf
                  - Blank
                  - Ask
                  - OneOfEach
                  node_path:
                  - id: '306'
                    name: Gifts
                    node_type: OneToMany
                    gift_processing_options_supported: false
                - id: 84857
                  available_field_name: Added By
                  selected_field_name: Gift Added By
                  value_type: Lookup
                  one_to_many: false
                  output_sort_can_add_edit: true
                  criteria_can_add_edit: true
                  execute_by_id_supported: false
                  allowed_filter_operators:
                  - Equals
                  - DoesNotEqual
                  - RelativeComparisons
                  - Blank
                  - Ask
                  - OneOfEach
                  node_path:
                  - id: '306'
                    name: Gifts
                    node_type: OneToMany
                    gift_processing_options_supported: false
        '400':
          description: Returned when the request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/QueryDefinitionServiceErrorCodes'
              example:
                type: urn:blackbaud:missing-product
                title: One or more validation errors occurred.
                status: 400
                detail: Product was not supplied.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have permission to access the resource.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:forbidden
                title: The requested action is forbidden.
                status: 403
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '404':
