  /querytypes/{query_type_id}/availablefields/search:
    get:
      operationId: SearchAvailableFields
      summary: Available field search (PREVIEW)
      description: 'Searches for available fields. **DEPRECATED** — Use the v2 endpoint instead.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: query_type_id
        in: path
        required: true
        schema:
          type: integer
        description: The query type ID
      - name: product
        in: query
        required: true
        schema:
          type: string
          enum:
          - RE
          - FE
        description: The Blackbaud product for the request<p>Members:</p><ul><li><i>RE</i> - The Raiser's Edge</li><li><i>FE</i> - The Financial Edge</li></ul>
      - name: module
        in: query
        required: true
        schema:
          type: string
          enum:
          - None
          - GeneralLedger
          - AccountsPayable
          - AccountsReceivable
          - FixedAssets
          - CashReceipts
        description: The module for the request (RE requests must use 'None', FE requests require one of the other values)<p>Members:</p><ul><li><i>None</i></li><li><i>GeneralLedger</i></li><li><i>AccountsPayable</i></li><li><i>AccountsReceivable</i></li><li><i>FixedAssets</i></li><li><i>CashReceipts</i></li></ul>
      - name: search_text
        in: query
        required: false
        schema:
          type: string
        description: Filters to available nodes and fields where the name contains the specified value (case-insensitive).
      - name: field_context
        in: query
        required: false
        schema:
          type: string
          enum:
          - None
          - Filter
          - Sort
          - Select
          - ChildSelectFilter
          - ChildSelectSort
        description: If the fields are to be used as filter fields, sort fields, or output fields.
      - name: result_layout
        in: query
        required: false
        schema:
          type: string
          enum:
          - MultiRow
          - SingleRow
        description: If the fields are to be used in a query with result layout multi-row or single-row.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: '50'
        description: Represents the number of matches to return.  Default 50, max 200.
      - name: continuation_token
        in: query
        required: false
        schema:
          type: string
        description: A continuation token provided from a previous search to pick up where the previous search left off returning results.
      - name: root_node_id
        in: query
        required: false
        schema:
          type: string
        description: When provided, restricts results to fields that are descendants of the node with this ID.
      - name: exclude_child_nodes
        in: query
        required: false
        schema:
          type: boolean
        description: When true, child nodes are not recursed into. Direct fields and child node name matches are still returned.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailableFieldsSearchResponse'
              example:
                available_fields:
                - result_type: Field
                  id_sequence:
                  - 10516
                  - 10533
                  - 10534
                  - 90072
                  result_path:
                  - Spouse
                  - Relationships
                  - Assigned Solicitors
                  - Fund
                - result_type: Node
                  id_sequence:
                  - 10516
                  - 10533
                  - 13188
                  result_path:
                  - Spouse
                  - Relationships
                  - Funds
                continuation_token: 10516:10533:13188
                limit: 2
        '400':
          description: Returned when the request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AvailableFieldsSearchErrorCodes'
              example:
                type: urn:blackbaud:missing-product
                title: One or more validation errors occurred.
                status: 400
                detail: Product was not supplied.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
      tags:
      - Querytypes
