                  send_reminder: true
                  acknowledgements:
                  - gift_legacy_id: null
                    letter:
                      value: Thanks
                      id: '1'
                - gift_splits:
                  - id: null
                    amount:
                      value: 100
                    fund_id: '100'
                  gift_date: '2021-01-01'
                  gift_post_date: '2021-01-01'
                  amount:
                    value: 100
                  gift_type: PledgePayment
                  constituent:
                    id: '280'
                  apply_payments:
                  - installments:
                    - installment_id: '1234'
                      amount_applied: 100
                    parent_id: '2034'
                  comments: Payment for pledge
                  gift_post_status: NotPosted
                  payments:
                  - gift_legacy_id: null
                    amount:
                      value: 100
                    method: Check
                    check_dt:
                      y: 2024
                      m: 2
                      d: 28
                    reference_dt:
                      y: 2024
                      m: 2
