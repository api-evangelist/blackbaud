components:
  schemas:
    BatchGiftNote:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          description: ID of the note
        batch_gift_id:
          type:
          - string
          - 'null'
          description: ID of the batch gift to which this note belongs
        batch_id:
          type:
          - string
          - 'null'
          description: ID of the batch to which this note belongs
        note_type:
          $ref: '#/components/schemas/CodeTableEntry'
        date:
          $ref: '#/components/schemas/FuzzyDate'
        description:
          type:
          - string
          - 'null'
          description: Short description of the note
        notes:
          type:
          - string
          - 'null'
          description: The full text of the note
        author:
          type:
          - string
          - 'null'
          description: 'The name of the author of the note. If not supplied, this will default to the name of the

            user making the request.'
        sequence:
          type:
          - integer
          - 'null'
          description: The sequence
          format: int32
      additionalProperties: false
      description: Represents a note associated with a batch gift
    BatchGiftExtensionListItem:
      type: object
      properties:
        extension_id:
          type:
          - string
          - 'null'
          description: The unique extension type identifier.
        display:
          type:
          - string
          - 'null'
          description: Display label for the extension.
        exceptions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ExtensionException'
          description: Validation exceptions reported by the extension service.
        e_tag:
          type:
          - string
          - 'null'
          description: The ETag of the extension document for optimistic concurrency.
      additionalProperties: false
      description: Summary of an extension document for display in the batch gift list.
    BatchGiftAddWithTributeLookup:
      required:
      - amount
      - constituent
      - gift_type
      type: object
      properties:
        gift_splits:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/BatchGiftSplitAdd'
          description: The gift splits belonging to this batch gift.
        batch_id:
          type:
          - string
          - 'null'
          description: ID of the batch to which this gift should be added.
        tributes:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TributeLookup'
          description: A collection of tribute lookups.
        notes:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/BatchGiftNote'
          description: Notes for this batch gift.
        row_sequence:
          type:
          - integer
          - 'null'
          description: The row sequence within the batch (display/sort order) that will be persisted for this gift.
          format: int32
        marketing_source_code:
          maxLength: 255
          minLength: 0
          type:
          - string
          - 'null'
          description: 'The gift''s marketing source code. Character limit: 255.'
        mailing_id:
          type:
          - string
          - 'null'
          description: The gift's mailing identifier.
        finder_number:
          maximum: 10000000000000000000
          minimum: 0
          type:
          - number
          - 'null'
          description: The gift's finder number. Digits behind the decimal are ignored.
          format: double
        amount:
          $ref: '#/components/schemas/Currency'
        gift_type:
          $ref: '#/components/schemas/GiftType'
        constituent:
          $ref: '#/components/schemas/GiftConstituent'
        apply_payments:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ApplyPayment'
          description: Applies partial payments to multiple pledges.
        charge_first_payment:
          type:
          - boolean
          - 'null'
          description: True if a recurring gift payment should be charged immediately. Only applicable for recurring gifts.
        parent_gift_id:
          type:
          - string
          - 'null'
          description: 'The linked parent gift ID. For a recurring gift payment this is the parent recurring gift;

            for a matching gift pledge it is the matched gift the pledge is matching.'
        custom_fields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/GiftCustomFieldAdd'
          description: Gets or sets the custom fields.
        processes_manually:
          type:
          - boolean
          - 'null'
          description: 'Indicates whether the gift processes payments manually (true) or automatically (false).

            When null, defaults based on payment method: CC/DD = false (automated), all others = true (manual).'
          example: false
        pledge_installments:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PledgeInstallmentAdd'
          description: Pledge installments
        gift_date:
          type:
          - string
          - 'null'
          description: The date the gift was given.
          format: date-time
        vehicle:
          $ref: '#/components/schemas/Vehicle'
        lookup_id:
          type:
          - string
          - 'null'
          description: The gift's lookup ID.
          example: Lookup-12345
        comments:
          maxLength: 255
          minLength: 0
          type:
          - string
          - 'null'
          description: 'Comments associated with the gift. Character limit: 255.'
          example: This is a comment
        gift_post_status:
          $ref: '#/components/schemas/GiftPostStatus'
        gift_post_date:
          type:
          - string
          - 'null'
          description: The post date of the gift. Must be set if post status is NotPosted or Posted. Must be null if post status is DoNotPost.
          format: date-time
        issuer_details:
          $ref: '#/components/schemas/IssuerDetails'
        origin:
          type:
          - string
          - 'null'
          description: The gift's origin.
        payments:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/GiftPaymentRecord'
          description: The gift's payments. Required for Recurring Gift type.
        schedule:
          $ref: '#/components/schemas/Schedule'
        adjustment_notes:
          type:
          - string
          - 'null'
          description: The gift's adjustment notes. Used by the Adjustment Gift type.
          example: Refunded gift
        receipts:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/GiftReceipt'
          description: The gift's receipts.
        fundraiser_credits:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/FundraiserCredit'
          description: The gift's fundraiser credits.
        soft_credits:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SoftCredit'
          description: The gift's soft credits.
        send_reminder:
          type:
          - boolean
          - 'null'
          description: Gets or sets the send reminder flag for pledge gifts. If no value is provided, it will default to true for pledges, false otherwise.
          example: false
        acknowledgements:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/GiftAcknowledgement'
          description: The gift's acknowledgements.
        gift_subtype:
          $ref: '#/components/schemas/GiftSubtype'
        anonymous:
          type:
          - boolean
          - 'null'
          description: Notes whether the gift should remain anonymous or not, i.e. do not publicly show the donor's name.
          example: false
        gift_code:
          $ref: '#/components/schemas/CodeTableEntry'
        gift_status:
          $ref: '#/components/schemas/GiftStatus'
        gift_status_date:
          $ref: '#/components/schemas/FuzzyDate'
        gift_constituency:
          $ref: '#/components/schemas/CodeTableEntry'
      additionalProperties: false
      description: Represents a batch gift to be added, with lookup for tribute
