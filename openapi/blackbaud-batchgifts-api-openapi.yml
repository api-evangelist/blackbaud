openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: Gift v2 Batchgifts API'
  description: This API manages gift information and related entities.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/gft-gifts
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/gft-gifts
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Batchgifts
paths:
  /v2/batchgifts/{batchGiftId}:
    patch:
      operationId: EditBatchGift
      summary: Edit Batch Gift (PREVIEW)
      description: 'Updates a batch gift


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: batchGiftId
        in: path
        required: true
        schema:
          type: string
        description: The ID of the batch gift.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchGiftEdit'
        description: The changes to the batch gift.
      responses:
        '200':
          description: Returned when when the gift was updated successfully. Any resolvable exceptions will be returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftValidationErrors'
              example:
                errors:
                - legacy_gift_id: '12345'
                  lookup_id: Lookup-12345
                  error_code: GiftDateOutOfValidRange
                  error_message: The provided date '{0}' does not fall within the valid range for a date.
                  affected_field: GiftDate
                  hard_exception: false
                  batch_id: '12345'
        '403':
          description: Forbidden
        '400':
          description: Returned when the specified batch gift ID or the request body is not in the correct format OR the batch is already approved OR exceptions prevented the change from being applied
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/AddEditBatchGift400ResponseTypesProblemDetails'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The date field is required.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '404':
          description: Returned when a batch gift with the provided ID does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The date field is required.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
      tags:
      - Batchgifts
    get:
      operationId: GetBatchGift
      summary: Get Batch Gift (PREVIEW)
      description: 'Returns a single batch gift by ID


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: batchGiftId
        in: path
        required: true
        schema:
          type: string
        description: ID of the batch gift to return
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchGiftRead'
        '403':
          description: Forbidden
        '400':
          description: Returned when no batch gift ID was provided or the ID was not in the correct format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/GetBatchGift400ResponseTypesProblemDetails'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The date field is required.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '404':
          description: Returned when a batch gift with the provided ID does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The date field is required.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
      tags:
      - Batchgifts
  /v2/batchgifts/{batchId}:
    post:
      operationId: AddGiftsToBatch
      summary: Add Gifts to Batch (PREVIEW)
      description: 'Add multiple gifts to an existing unapproved batch


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: batchId
        in: path
        required: true
        schema:
          type: string
        description: The identifier of the batch
      - name: default_constituency
        in: query
        required: false
        schema:
          type: boolean
        description: Flag indicating to default constituency. Defaults to true.
      - name: default_soft_credits
        in: query
        required: false
        schema:
          type: boolean
        description: Flag indicating to default soft credits. Defaults to false.
      - name: default_fundraiser_credits
        in: query
        required: false
        schema:
          type: boolean
        description: Flag indicating to default fundraiser credits. Defaults to false.
