            - gift_splits:
              - id: null
                amount:
                  value: 100
                fund_id: '100'
              marketing_source_code: WEB
              mailing_id: '456'
              finder_number: 7896
              amount:
                value: 100
              gift_type: Stock
              constituent:
                id: '280'
              custom_fields:
              - category: '19'
                comment: comment
                date: '2021-01-01T12:00:00Z'
                description: description
              gift_date: '2021-01-01T12:00:00Z'
              comments: New gift from Bobby
