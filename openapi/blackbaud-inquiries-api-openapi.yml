components:
  schemas:
    HouseholdRelationshipUser:
      required:
      - first_name
      - last_name
      type: object
      properties:
        first_name:
          minLength: 1
          type: string
          description: The first name of the user.
        middle_name:
          type:
          - string
          - 'null'
          description: The middle name of the user.
        last_name:
          minLength: 1
          type: string
          description: The last name of the user.
        preferred_name:
          type:
          - string
          - 'null'
          description: The preferred name of the user.
        email:
          type:
          - string
          - 'null'
          description: The email of the user.
        prefix:
          type:
          - string
          - 'null'
          description: The prefix of the user.
        suffix:
          type:
          - string
          - 'null'
          description: The suffix of the user.
        gender:
          type:
          - string
          - 'null'
          description: The gender ID or description of the user.
        pronouns:
          type:
          - string
          - 'null'
          description: The pronouns ID or description of the user.
        living_status:
          type:
          - string
          - 'null'
          description: The living status ID or description of the user.
        wireless_phone:
          type:
          - string
          - 'null'
          description: Wireless phone information.
        business:
          $ref: '#/components/schemas/HouseholdBusiness'
      additionalProperties: false
      description: HouseholdRelationshipUser model for a household relationship user in an inquiry household.
    UserLanguage:
      type: object
      properties:
        language:
          type:
          - string
          - 'null'
          description: The language id or description
      additionalProperties: false
      description: User language model
    TableValueBase:
      type: object
      properties:
        id:
          type:
          - integer
          - 'null'
          description: The ID of the table value
          format: int32
        description:
          type:
          - string
          - 'null'
          description: The description of the table value
      additionalProperties: false
      description: 'Table value base model. Used for table entry fields (i.e. dropdown controls) to provide both ID and Description information for the selected value. General system tables can be retrieved by School API endpoints: GET Types table types and GET Types table values.'
    Household:
      required:
      - relationship1
      type: object
      properties:
        address_same_as_student:
          type: boolean
          description: Is the address shared with the student.
        home_address:
          $ref: '#/components/schemas/UserAddress'
        home_phone:
          type:
          - string
          - 'null'
          description: Home phone information.
        resides_with:
          type: boolean
          description: True if the candidate lives with the relationship.
        relationship1:
          $ref: '#/components/schemas/HouseholdRelationship'
        relationship2:
          $ref: '#/components/schemas/HouseholdRelationship'
      additionalProperties: false
      description: Household model with household information.
    TableValue:
      type: object
      properties:
        abbreviation:
          type:
          - string
          - 'null'
          description: The abbreviation of the table value
        id:
          type:
          - integer
          - 'null'
          description: The ID of the table value
          format: int32
        description:
          type:
          - string
          - 'null'
          description: The description of the table value
      additionalProperties: false
      description: 'Table value model. Used for table entry fields (i.e. dropdown controls) to provide both ID and Description information for the selected value. General system tables can be retrieved by School API endpoints: GET Types table types and GET Types table values.'
    InquiryReferrerEdit:
      type: object
      properties:
        is_existing_family:
          type: boolean
          description: True if the referral was by existing family.
        family_name:
          type:
          - string
          - 'null'
          description: The name of the referring family.
        notes:
          type:
          - string
          - 'null'
          description: The additional referral notes.
      additionalProperties: false
      description: An object with referred by information.
    HouseholdBusiness:
      type: object
      properties:
        job_title:
          type:
          - string
          - 'null'
          description: The job title at the business.
        name:
          type:
          - string
          - 'null'
          description: The name of the business.
        business_phone:
          type:
          - string
          - 'null'
          description: Business phone information.
        business_fax:
          type:
          - string
          - 'null'
          description: Business fax information.
        business_address:
          $ref: '#/components/schemas/UserAddress'
      additionalProperties: false
      description: HouseholdBusiness model for household business information.
    CustomFieldText:
      type: object
      properties:
        field_identifier:
          type:
          - string
          - 'null'
          description: 'Specifies the field. Uses the field identifier format: field_# (e.g. text_field_1 or text_field_7).'
        field_name:
          type:
          - string
          - 'null'
          description: The user-defined name (e.g. Tee shirt size) for the custom field.
        field_value:
          type:
          - string
          - 'null'
          description: The value to store in the specified field.
      additionalProperties: false
      description: An object with custom candidate field information
    HouseholdRelationship:
      required:
      - relationship_to_student
      - user
      type: object
      properties:
        relationship_to_student:
          minLength: 1
          type: string
          description: The relationship to the student.
        is_custodial_parent:
          type: boolean
          description: True if this is the primary relationship.
        user:
          $ref: '#/components/schemas/HouseholdRelationshipUser'
      additionalProperties: false
      description: HouseholdRelationship model for the Inquiry Candidate relationship information.
    HouseholdReadModel:
