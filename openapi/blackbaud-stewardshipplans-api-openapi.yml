        '403':
          description: Returned when the user does not have permission to edit the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Stewardshipplans
    get:
      operationId: GetStewardshipPlan
      summary: Get a stewardship plan
      description: This operation is for editing a given stewardship plan's steward.
      parameters:
      - name: stewardship_plan_steward_id
