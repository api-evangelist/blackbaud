                start_date: ''
              name: ''
              sites:
              - id: ''
                site_id: ''
              site_required: false
              plan_type_id: ''
              plan_sub_type_id: ''
              start_date: ''
              steps:
              - id: ''
                category: ''
                objective: ''
                target_date: ''
                date_locked: false
                target_start_time: ''
                target_end_time: ''
                time_zone_entry: ''
                all_day_event: false
                contact_person: ''
                contact_method: ''
                constituent_id: ''
                associated_plans_text: ''
                associated_plans:
                - id: ''
                  prospect_plan_id: ''
                  plan_name: ''
                  has_site_security: false
                template: ''
                recurs: Single Occurrence
                status_code: ''
                next_target_date: ''
                start_date: ''
                end_date: ''
                link_type_code: ''
                event_id: ''
                mailing_id: ''
                benefit_id: ''
                actual_date: ''
                actual_start_time: ''
                actual_end_time: ''
