  /stewardshipplans/{stewardship_plan_id}:
    delete:
      operationId: DeleteStewardshipPlan
      summary: Delete a stewardship plan
      description: Deletes a stewardship plan.
      parameters:
      - name: stewardship_plan_id
        in: path
        required: true
        schema:
          type: string
        description: The stewardship plan id
      responses:
        '200':
          description: Returned when the operation successfully deletes the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to delete the resource.
      tags:
      - Stewardshipplans
    servers:
    - url: https://api.sky.blackbaud.com/alt-prsmg
  /stewardshipplans/{stewardship_plan_steward_id}:
    patch:
      operationId: EditStewardshipPlan
      summary: Edit a stewardship plan
      description: This operation is for editing a given stewardship plan's steward.
      parameters:
      - name: stewardship_plan_steward_id
        in: path
        required: true
        schema:
          type: string
        description: The stewardship plan steward id.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditStewardshipPlan'
            example:
              constituent_id: 54ca4ff4-ae49-46c6-846f-50641c4b521e
              role_code_id: ''
              start_date: '2022-12-23T12:00:00Z'
              end_date: '2023-12-23T12:00:00Z'
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully edits the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
