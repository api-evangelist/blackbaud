openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: OneRoster Teachers API'
  description: OneRoster v1.1 API. For details on the OneRoster Version 1.1 Specification, click here. The Authorization page provides steps to setup and test these endpoints.
  version: v1p1
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/afe-rostr
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Teachers
paths:
  /teachers:
    get:
      operationId: getAllTeachers
      summary: Teachers all
      description: 'Returns a collection of teacher user data.


        Roles returned include:


        Teacher


        Pending Teacher'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersOutputModel'
              example:
                users:
                - username: john.doe@myschool.com
                  enabledUser: 'true'
                  givenName: John
                  familyName: Doe
                  middleName: Michael
                  role: teacher
                  identifier: '123456'
                  email: john.doe@myschool.com
                  sms: '6037778888'
                  phone: '6032221111'
                  orgs:
                  - sourcedId: org-sch-222-456
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/orgs/org-sch-222-456
                    type: org
                  sourcedId: usr-222-123456
                  status: active
                  dateLastModified: '2022-12-12T11:00:00Z'
                  metadata:
                    stateId: NH-987-654
                    address1: 5555 Main Street
                    address2: Apartment 255
                    city: Nashua
                    state: NH
                    postCode: 03060-6006
                    title: Dean of Curricula
                - username: jane.doe@myschool.com
                  enabledUser: 'true'
                  givenName: Jane
                  familyName: Doe
                  role: teacher
                  identifier: '654321'
                  email: jane.doe@myschool.com
                  sms: '6179998888'
                  phone: '6173334444'
                  orgs:
                  - sourcedId: org-sch-222-456
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/orgs/org-sch-222-456
                    type: org
                  sourcedId: usr-222-654321
                  status: active
                  dateLastModified: '2022-12-12T11:00:00Z'
                  metadata:
                    stateId: NH-987-654
                    address1: 321 Washington Street
                    city: Lowell
                    state: MA
                    postCode: 03111-7007
                    title: Head of Admissions
      tags:
      - Teachers
  /teachers/{id}:
    get:
      operationId: getTeacher
      summary: Teacher by id
      description: 'Returns a single teacher user for the specified ```id```.


        Roles returned include:


        Teacher


        Pending Teacher'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: sourcedId for the teacher
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOutputModel'
              example:
                user:
                  username: john.doe@myschool.com
                  enabledUser: 'true'
                  givenName: John
                  familyName: Doe
                  middleName: Michael
                  role: teacher
                  identifier: '123456'
                  email: john.doe@myschool.com
                  sms: '6037778888'
                  phone: '6032221111'
                  orgs:
                  - sourcedId: org-sch-222-456
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/orgs/org-sch-222-456
                    type: org
                  sourcedId: usr-222-123456
                  status: active
                  dateLastModified: '2022-12-12T11:00:00Z'
                  metadata:
                    stateId: NH-987-654
                    address1: 5555 Main Street
                    address2: Apartment 255
                    city: Nashua
                    state: NH
                    postCode: 03060-6006
                    title: Head of Admissions
      tags:
      - Teachers
  /teachers/{teacher_id}/classes:
    get:
      operationId: getClassesForTeacher
      summary: Classes for a teacher
      description: Returns a collection of classes for the specified ```teacher_id```.
      parameters:
      - name: teacher_id
        in: path
        required: true
        schema:
          type: string
        description: sourcedId for the teacher
      responses:
        '200':
          description: OK - It was possible to read the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassOutputModel'
              example:
                class:
                  title: Introduction to Physics
                  classCode: Phys 100 - 1
                  classType: Scheduled
                  location: Room 2B
                  grades:
                  - '10'
                  - '11'
                  subjects:
                  - Science
                  course:
                    sourcedId: crs-222-2023-456-12345
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/course/crs-222-2023-456-12345
                    type: course
                  school:
                    sourcedId: org-sch-222-456
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/orgs/org-sch-222-456
                    type: org
                  terms:
                  - sourcedId: as-trm-222-1234
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/academicSessions/as-trm-22-1234
                    type: academicSession
                  periods:
                  - B
                  sourcedId: cls-222-123456
                  status: active
                  dateLastModified: '2022-09-26T01:30:00Z'
                  metadata:
                    department_0: org-dpt-222-3456
                    lead_section: cls-222-123456
      tags:
      - Teachers
