components:
  schemas:
    AddressView:
      type: object
      properties:
        id:
          type: string
          description: Address ID
          nullable: true
          readOnly: true
        description:
          type: string
          description: Description
          nullable: true
          readOnly: true
        street_address:
          type: string
          description: Street Address
          nullable: true
          readOnly: true
        country:
          type: string
          description: Country
          nullable: true
          readOnly: true
        post_code:
          type: string
          description: PostCode
          nullable: true
          readOnly: true
        state:
          type: string
          description: State
          nullable: true
          readOnly: true
        city:
          type: string
          description: City
          nullable: true
          readOnly: true
      additionalProperties: false
      description: Address View
    BankAccountStatus:
      title: BankAccountStatus
      enum:
      - Active
      - Inactive
      type: string
      description: Bank Account status
    BillingItemListItem:
      required:
      - id
      - name
      - status
      - type
      type: object
      properties:
        id:
          minLength: 1
          type: string
          description: The ID.
        lookup_id:
          type: string
          description: The lookup ID.
          nullable: true
          readOnly: true
        name:
          minLength: 1
          type: string
          description: The name.
        status:
          $ref: '#/components/schemas/ItemStatus'
        type:
          $ref: '#/components/schemas/BillingItemType'
        description:
          type: string
          description: The description.
          nullable: true
        interfund_set_id:
          type: string
          description: The ID of the interfund set.
          nullable: true
        valid_from_date:
          type: string
          description: The from date.
          format: date-time
          nullable: true
        valid_to_date:
          type: string
          description: The to date.
          format: date-time
          nullable: true
        flat_rate:
          $ref: '#/components/schemas/FlatRate'
        variable_rate:
          $ref: '#/components/schemas/VariableRate'
        product_info:
          $ref: '#/components/schemas/ProductInfoView'
        refund_item:
          $ref: '#/components/schemas/RefundItem'
        added_by:
          type: string
          description: The user name who created the record.
          nullable: true
        date_added:
          type: string
          description: The record create date.
          format: date-time
        last_changed_by:
          type: string
          description: The user name who last changed the record.
          nullable: true
        last_changed_date:
          type: string
          description: The record last changed date.
          format: date-time
        taxable:
          type: boolean
          description: Whether the billing item is subject to tax.
        assess_finance_charges:
          type: boolean
          description: Whether the billing item is subject to finance and late charges.
        allow_trade_discount:
          type: boolean
          description: Whether the billing item is eligible for trade discount.
        allow_terms_discount:
          type: boolean
          description: Whether the billing item is eligible for terms discount.
      additionalProperties: false
      description: Listed billing item
    BillingItemType:
      title: BillingItemType
      enum:
      - FlatRate
      - VariableRate
      - AdvanceDeposit
      - FinanceCharge
      - SalesTax
      - RefundItem
      - Product
      type: string
      description: Billing item type
    BillingItemViewList:
      required:
      - billing_items
      - limit
      - offset
      type: object
      properties:
        billing_items:
          type: array
          items:
            $ref: '#/components/schemas/BillingItemListItem'
          description: Billing items
        limit:
