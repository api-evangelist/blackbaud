openapi: 3.0.1
info:
  title: 'Blackbaud SKY API: Receivables'
  description: This API manages receivables, including clients, billing items, credits, charges, and invoices.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/receivables
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations,
      examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/receivables
paths:
  /v1/billingitems:
    get:
      operationId: ListBillingItems
      summary: List of billing items by page
      description: This returns a list of billing items limited by page size.
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: '25'
        description: The maximum number of items to return.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: How many items to skip before returning the results.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a list of billing items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingItemViewList'
              example:
                billing_items:
                - id: da534d5f-f981-4be5-911d-d2c450d8dda8
                  lookup_id: ''
                  name: Test name
                  status: Active
                  type: RefundItem
                  description: Test description
                  valid_from_date: '2020-02-24T12:00:00Z'
                  valid_to_date: '2020-08-24T12:00:00Z'
                  flat_rate:
                    amount: 25
                    allow_changes_to_amount: false
                  variable_rate:
                    unit_of_measure_entry:
                      id: 1c079590-7790-4456-9d0f-5fa50d7aacff
                      value: Each
                    quantity: 1
                    quantity_decimals: 2
                    unit_price: 1.5
                    unit_price_decimals: 2
                    allow_changes_quantity_and_unit_price: false
                    trade_discount_percent: 0
                    trade_discount_amount: 0
                    amount: 1.5
                  product_info:
                    unit_of_measure: Each
                    quantity_decimals: 2
                    unit_price_decimals: 2
                    allow_changes_quantity_and_unit_price: true
                    pricing_schedule:
                    - effective_date: '0001-01-01T12:00:00Z'
                      description: Example Description
                      pricing_type: SinglePrice
                      unit_price: 25
                      ranges:
                      - minimum_quantity: 0
                        maximum_quantity: 100
                        unit_price: 25
                        sequence: 1
                  refund_item:
                    allow_add_payable: true
                    banks_id: 334
                    bank_account_id: 1c079590-7790-4456-9d0f-5fa50d7aacff
                    bank_account_name: Test Bank Account
                    bank_account_active_status: Active
                  date_added: '0001-01-01T12:00:00Z'
                  last_changed_date: '0001-01-01T12:00:00Z'
                  taxable: false
                  assess_finance_charges: false
                  allow_trade_discount: false
                  allow_terms_discount: false
                limit: 10
                offset: 20
        '400':
          description: Returned when the request is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponseTypes'
              example:
                type: urn:blackbaud:validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: 'Transaction is missing required custom fields

                  '
                values:
                  errors:
                    property_name: custom_fields
                    error_message: Transaction is missing required custom fields
                    error_code: TransactionHasRequiredCustomFields
                trace_id: e566235f7b89ec65570213e86c42b059
                span_id: fda5afb92a47816e
        '403':
          description: Returned when the user does not have permission to view billing items.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ForbiddenProblemDetails'
              example:
                type: urn:blackbaud:forbidden
                title: The requested action is forbidden.
                status: 403
                extensions: {}
  /v1/billingitems/{id}:
    get:
      operationId: GetBillingItem
      summary: Get a billing item
      description: This gets a billing item by ID.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the billing item.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a billing item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingItemListItem'
              example:
                id: da534d5f-f981-4be5-911d-d2c450d8dda8
                lookup_id: ''
                name: Test name
                status: Active
                type: RefundItem
                description: Test description
                valid_from_date: '2020-02-24T12:00:00Z'
                valid_to_date: '2020-08-24T12:00:00Z'
                flat_rate:
                  amount: 25
                  allow_changes_to_amount: false
                variable_rate:
                  unit_of_measure_entry:
                    id: 1c079590-7790-4456-9d0f-5fa50d7aacff
                    value: Each
                  quantity: 1
                  quantity_decimals: 2
                  unit_price: 1.5
                  unit_price_decimals: 2
                  allow_changes_quantity_and_unit_price: false
                  trade_discount_percent: 0
                  trade_discount_amount: 0
                  amount: 1.5
                product_info:
                  unit_of_measure: Each
                  quantity_decimals: 2
                  unit_price_decimals: 2
                  allow_changes_quantity_and_unit_price: true
                  pricing_schedule:
                  - effective_date: '0001-01-01T12:00:00Z'
                    description: Example Description
                    pricing_type: SinglePrice
                    unit_price: 25
                    ranges:
                    - minimum_quantity: 0
                      maximum_quantity: 100
                      unit_price: 25
                      sequence: 1
                refund_item:
                  allow_add_payable: true
                  banks_id: 334
                  bank_account_id: 1c079590-7790-4456-9d0f-5fa50d7aacff
                  bank_account_name: Test Bank Account
                  bank_account_active_status: Active
                date_added: '0001-01-01T12:00:00Z'
                last_changed_date: '0001-01-01T12:00:00Z'
                taxable: false
                assess_finance_charges: false
                allow_trade_discount: false
                allow_terms_discount: false
        '404':
          description: Returned when the specified billing item is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: Workflow Correlation Id was required but not supplied.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '400':
          description: Returned when the request is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponseTypes'
              example:
                type: urn:blackbaud:validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: 'Transaction is missing required custom fields

                  '
                values:
                  errors:
                    property_name: custom_fields
                    error_message: Transaction is missing required custom fields
                    error_code: TransactionHasRequiredCustomFields
                trace_id: e566235f7b89ec65570213e86c42b059
                span_id: fda5afb92a47816e
        '403':
          description: Returned when the user does not have permission to view the billing item.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ForbiddenProblemDetails'
              example:
                type: urn:blackbaud:forbidden
                title: The requested action is forbidden.
                status: 403
                extensions: {}
