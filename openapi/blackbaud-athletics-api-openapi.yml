  /v1/athletics/teams/{team_id}/schedule:
    post:
      operationId: V1AthleticsTeamsByTeam_idSchedulePost
      summary: Athletics game create
      description: 'Creates a new athletic game for the specified ```team_id```.


        Requires at least one of the following roles in the Education Management system:


        Athletic Group Manager


        Team Schedule Manager


        Schedule Manager


        Coach


        Pending Coach'
      parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: integer
        description: ID of the team for the game to be created
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameCreate'
            example:
              schedule_type: 0
              title: Game Title
              game_date: '2021-10-05T01:30:00Z'
              game_date_end: '2021-10-05T03:30:00Z'
              home_away_type: 1
              location_id: 5489
              dismissal_time: '2026-10-06'
              departure_time: '2026-10-06'
              departure_note: We are departing at lunch
              pickup_time: '2026-10-06'
              pickup_note: We will return at end of school
              league_ind: true
              scrimmage_ind: false
              tournament_ind: false
              invitational_ind: true
              playoff_ind: false
              additional_notes: Please read this.
              send_notifications: true
              skip_validation: false
              transportation:
              - transportation_id: 54095
                full_day: false
                begin_use: '2021-10-05T12:00:00Z'
                end_use: '2021-10-05T04:15:00Z'
              opponents:
              - opponent_id: 94508
        description: Information about the game to be created
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostIdResponse'
              example:
                id: 0
      tags:
      - Athletics
    patch:
      operationId: V1AthleticsTeamsByTeam_idSchedulePatch
      summary: Athletics game update
      description: 'Updates the game data for the specified ```team_id``` and athletic ```game_id```.


        Requires at least one of the following roles in the Education Management system:


        Athletic Group Manager


        Team Schedule Manager


        Schedule Manager


        Coach


        Pending Coach'
      parameters:
      - name: team_id
        in: path
        required: true
        schema:
          type: integer
        description: ID of the team for the game to be updated
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameUpdate'
            example:
