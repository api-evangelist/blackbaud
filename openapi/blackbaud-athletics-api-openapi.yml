openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: School Athletics API'
  description: This API is used to provide access to school information such as users, academics, admissions, athletics, content, lists, and general school info.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/school
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/school
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Athletics
paths:
  /v1/athletics/highlights/{highlight_id}:
    get:
      operationId: V1AthleticsHighlightsByHighlight_idGet
      summary: Athletics highlights by ID
      description: 'Returns an athletic game''s highlights for the specified ```highlight_id```.


        This ID can be obtained via the GET athletics schedules endpoint for a game if highlights exist for that game.


        If Public access is not added via group page access, the endpoint requires at least one of the following roles in the Education Management system to return content


        Athletic Group Manager


        Team Schedule Manager


        Schedule Manager


        Page Manager


        Coach


        Pending Coach'
      parameters:
      - name: highlight_id
        in: path
        required: true
        schema:
          type: integer
        description: ID of the highlight to be returned.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Highlight'
              example:
                id: 1234
                athletic_schedule_id: 9876
                author: John Smith
                headline: We won!
                brief_description: Our team won the big game!
                long_description: The next opponent we face on Saturday is much tougher.
                publish_date: '2021-10-10T12:00:00Z'
                expire_date: '2021-10-15T12:00:00Z'
                photos:
                - id: 2345
                  caption: Photo caption
                  large_filename: Large Filename
                  large_filename_url: /images/large_filename.jpg
                  thumb_filename: Thumb Filename
                  thumb_filename_url: images/thumb_filename.jpg
      tags:
      - Athletics
  /v1/athletics/locations:
    post:
      operationId: V1AthleticsLocationsPost
      summary: Athletics location create
      description: 'Creates a new athletic location.


        The location can optionally be tied to an opponent using the ```opponent_id``` from the GET opponents endpoint.


        Requires at least one of the following roles in the Education Management system:


        Athletic Group Manager


        Team Schedule Manager


        Schedule Manager


        Coach


        Pending Coach'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationCreateModel'
            example:
              opponent_id: 864549
              name: South City Main Field
              directions: Go straight, take left at light
              travel_time: 15
              address_line1: 123a Main Street
              address_line2: ''
              address_line3: ''
              city: Springfield
              state: Texas
              state_short: TX
              country: USA
              zip: 12345-0954
              province: ''
              map_url: http://www.somemap.com/
        description: The location to be created
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostIdResponse'
              example:
                id: 0
      tags:
      - Athletics
    get:
      operationId: V1AthleticsLocationsGet
      summary: Athletics locations
      description: 'Returns a collection of athletic locations.


        Requires at least one of the following roles in the Education Management system:


        Athletic Group Manager


        Team Schedule Manager


        Schedule Manager


        Coach


        Pending Coach'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationCollection'
              example:
                count: 1
                value:
                - id: 75389
                  name: South City Main Field
                  address_line1: 123 Main Street
                  address_line2: ''
                  address_line3: ''
                  city: Springfield
                  state: Texas
                  state_short: TX
                  country: USA
                  zip: 12345-0954
                  province: ''
                  map_url: http://www.somemap.com/
                  directions: Go straight, take left at light
                  travel_time: 15
                  opponent_id: 8765
      tags:
      - Athletics
  /v1/athletics/opponents:
    post:
      operationId: V1AthleticsOpponentsPost
      summary: Athletics opponent create
      description: 'Creates a new athletic opponent.


        Requires at least one of the following roles in the Education Management system:


        Athletic Group Manager


        Team Schedule Manager


        Schedule Manager


        Page Manager


        Coach


        Pending Coach'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpponentUpdateModel'
            example:
              name: South City Jets
              phone1: (123) 456-9568
              ad_first_name: Pat
              ad_last_name: Malone
              ad_email: AthleticDirector@southcity.edu
              fax: (987) 654-4321
              phone2: ''
              asst_ad_first_name: Chris
              asst_ad_last_name: Humphrey
              asst_ad_email: AsstAthleticDirector@southcity.edu
              address_id: 195095
              address_line1: 123 Main Street
              address_line2: ''
              address_line3: ''
              city: Springfield
              state_short: ''
              country: Canada
              province: ''
              zip: 12345-0954
              conference_id: 45958
        description: The opponent to be created
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostIdResponse'
              example:
                id: 0
      tags:
      - Athletics
    get:
      operationId: V1AthleticsOpponentsGet
      summary: Athletics opponents
      description: 'Returns a collection of athletic opponents.


        Requires at least one of the following roles in the Education Management system:


        Athletic Group Manager


        Team Schedule Manager


        Page Manager


        Coach


        Pending Coach'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpponentFlyweightCollection'
              example:
                count: 1
                value:
                - id: 75389
                  name: Oregon Dark Stars
                  in_use: true
      tags:
      - Athletics
  /v1/athletics/result:
    post:
      operationId: V1AthleticsResultPost
      summary: Athletics game result
      description: 'Creates a result/score for the specified athletic game ``` schedule_id ```.


        Existing schedule IDs can be retrieved via the GET athletics schedules endpoint as well as after calling POST athletics game.


        NOTE: There are two types of game results: Team vs team scores (schedule_type: 0) and Team placement or team total points scores (schedule_type: 1). The score reporting for the two types is distinctly different.

        For team vs team scores


        Each opponent will list in the opponents array with a value for ```win_loss```, ```score``` and ```score_versus```.


        Example:


        ```


        {

        "schedule_id": 1331482,

        "send_notification": false,

        "schedule_type": 0,

        "opponents": [

        {

        "opponent_id": 41406,

        "win_loss": "Win",

        "score": "5",

        "score_versus": "2",

        },

        {

        "opponent_id": 41407,

        "win_loss": "Loss",

        "score": "1",

        "score_versus": "3",

        }

        ]

        }

        ```

        For team placement or team total points scores


        The Home team and each opponent will list in the opponents array with a value for ```score``` but only the home team will have a value for ```win_loss``` and ```score_versus``` can be omitted for all. The home team�s ```opponent_id``` will be -1 in the opponents array.


        Example:


        ```

        {

        "schedule_id": 1331482,

        "send_notification": false,

        "schedule_type": 1,

        "opponents": [

        {

        "opponent_id": -1,

        "score": "1st",

        "win_loss": "Win"

        },

        {

        "opponent_id": 41406,

        "score": "2nd",

        "win_loss": ""

        },

        {

        "opponent_id": 41407,

        "score": "3rd",

        "win_loss": ""

        }

        ]

        }


        ```


        Requires at least one of the following roles in the Education Management system:


        Team Schedule Manager


        Page Manager


        Coach


        Pending Coach'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResultCreate'
            example:
              schedule_id: 12345
              schedule_type: 0
              send_notification: false
              opponents:
              - opponent_id: 7654
                score: '5'
                win_loss: Win
                score_versus: '2'
      responses:
        '200':
          description: OK
      tags:
      - Athletics
  /v1/athletics/rosters:
    get:
      operationId: V1AthleticsRostersGet
      summary: Athletics rosters
      description: 'Returns the athletic rosters for a selected year. Uses current school year by default.


        Requires the following role in the Education Management system:


        Schedule Manager


        Athletic Group Manager'
      parameters:
      - name: school_year
        in: query
        required: false
        schema:
          type: string
        description: The ID or label of the school year. Defaults to the current school year.
      - name: school_level
        in: query
        required: false
        schema:
          type: integer
        description: Limits rosters returned to school level specified.
      - name: section_ids
        in: query
        required: false
        schema:
          type: string
        description: Limits rosters returned to sections specified.Provide comma-delimited list of section_id values.
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: 'Limits rosters returned to sections that were modified on or after the date provided. Use ISO-8601 date-time format: 2024-09-01T00:00:00-5:00.'
      - name: include_dropped
        in: query
        required: false
        schema:
          type: boolean
          default: 'false'
        description: Set to True to include dropped students in the rosters. Defaults to false, if omitted.
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
          default: 'false'
        description: Set to True to include inactive sections. Defaults to false.
      responses:
        '200':
          description: A List of Athletic rosters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1AthleticsRostersGet200ApplicationJsonResponse'
              example:
              - section:
                  id: 1
                  name: Fencing – 2 (Boys)
                  identifier: 2 (Boys)
                  offering:
                    id: 1
                    name: Fencing
                    type:
                      id: 9
                      description: Athletics
                    course_code: CHR240
                    description: Fun with pointy sticks
                    length: 1
                    credits: 0.5
                    status: Active
                    publish_to_website: true
                    record_attendance: true
                    school_level:
                      id: 1
                      abbreviation: US
                      name: Upper School
                    school_year: 2023 - 2024
                  duration:
                    id: 1
                    name: Fall
                  school_year:
                    id: 1234
                    begin_date: '2019-08-30T12:00:00Z'
                    current_year: true
                    end_date: '2020-08-30T12:00:00Z'
                    published: true
                    begin_billing_year_date: '2019-08-30T12:00:00Z'
                    end_billing_year_date: '2020-08-30T12:00:00Z'
                  lead_section_id: 1
                  modified: '2024-09-30T01:30:05Z'
                  sport:
                    id: 1
                    description: Fencing
                  gender: Co-Ed
                  level_of_play:
                    id: 1
                    description: Varsity
                roster:
                - player:
                    id: 1
                    accolades: Best jumper
                    first_name: Player
                    height: 5'1
                    hometown: Mushroom Kingdom
                    jersey: 1
                    last_name: One
                    position: First
                    returning_letter: true
                    team_captain: true
                    weight: '250'
                    preferred_name: Best
                    photos:
                      large_filename_url: //some.cdn.com/pathTo/largeFilename1
                      thumb_filename_url: //some.cdn.com/pathTo/thumbFilename1
                    publish_name: true
                    publish_height: true
                    publish_weight: true
                    publish_photo: true
                    level_of_play:
                      id: 1
                      description: Varsity
                    sport:
                      id: 1
                      description: Fencing
                    gender: Co-Ed
                  user:
                    id: 1
                    email: JohnJr@domain.com
