  /v1/athletics/schedules:
    get:
      operationId: V1AthleticsSchedulesGet
      summary: Athletics schedules
      description: 'Returns a collection of athletic games for the current school year.


        Use the ```start_date``` and/or ```end_date``` to filter to a specific timeframe.


        Returns data for a specific team by setting the ```team_id``` using the GET teams endpoint.


        Returns both games and practices by setting ```include_practice``` to true.


        Requires at least one of the following roles in the Education Management system:


        Athletic Group Manager


        Team Schedule Manager


        Schedule Manager


        Coach


        Pending Coach'
      parameters:
      - name: start_date
        in: query
        required: false
        schema:
          type: string
        description: Filter games/practices after this date
      - name: end_date
        in: query
        required: false
        schema:
          type: string
        description: Filter games/practices before this date
      - name: school_year
        in: query
        required: false
        schema:
          type: string
        description: Filter on a specific school year. Defaults to current school year.
      - name: include_practice
        in: query
        required: false
        schema:
          type: boolean
          default: 'false'
        description: Set to ```true``` to include practices with games. Defaults to false.
      - name: team_id
        in: query
        required: false
        schema:
          type: integer
          default: '0'
        description: Filter games/practices for a specific team. Defaults to all teams.
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: Set date to limit results to games with information changed on and after that date.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleItemCollection'
              example:
                count: 1
                value:
                - id: 12345
                  alumni: false
