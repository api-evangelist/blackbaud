openapi: 3.0.1
info:
  title: 'Blackbaud SKY API: List Management'
  description: This API manages saved lists
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/lst-lstmg
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations,
      examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/lst-lstmg
paths:
  /lists:
    post:
      operationId: CreateList
      summary: Creates a new list (PREVIEW)
      description: 'Saves a new list


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveListRequest'
            example:
              list_type: vendor
              name: Active vendors
              definition:
                filter:
                  filter_items:
                  - field:
                      value:
                        value: active
                        label: Active
                      field_id: status
                      operator: Equal
                output:
                  items:
                  - field_id: vendor_display_name
                  - field_id: status
                sort:
                  sort_fields:
                  - field_id: vendor_display_name
                    sort_order: asc
              record_count: 175
              description: Vendors with an active status
        description: The list.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListModel'
              example:
                id: 71B4ADAB-235D-4FB9-97FB-22CB80737E1C
                list_type: vendor
                name: Active vendors
                public_name: Active vendors
                definition:
                  filter:
                    filter_items:
                    - field:
                        value:
                          value: active
                          label: Active
                        field_id: status
                        operator: Equal
                  output:
                    items:
                    - field_id: vendor_display_name
                    - field_id: status
                  sort:
                    sort_fields:
                    - field_id: vendor_display_name
                      sort_order: asc
                created_by_user_id: 6B44131E-2935-4C0B-A7FB-5D4FA9729F50
                created_date: '2022-04-12T12:00:00Z'
                last_changed_by_user_id: 6B44131E-2935-4C0B-A7FB-5D4FA9729F50
                last_changed_by_user_name: Michael Simpson
                last_changed_date: '2022-04-12T12:00:00Z'
                record_count: 175
                description: Vendors with an active status
                is_owner: true
  /lists/{list_id}:
    delete:
      operationId: DeleteList
      summary: Deletes an existing list (PREVIEW)
      description: 'Deletes an existing, saved list


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: list_id
        in: path
        required: true
        schema:
          type: string
        description: The list identifier.
      responses:
        '200':
          description: OK
    patch:
      operationId: EditList
      summary: Edits an existing list (PREVIEW)
      description: 'Edits an existing, saved list


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: list_id
        in: path
        required: true
        schema:
          type: string
        description: The list identifier.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditListRequest'
            example:
              name: Active vendors
              definition:
                filter:
                  filter_items:
                  - field:
                      value:
                        value: active
                        label: Active
                      field_id: status
                      operator: Equal
                output:
                  items:
                  - field_id: vendor_display_name
                  - field_id: status
                sort:
                  sort_fields:
                  - field_id: vendor_display_name
                    sort_order: asc
              record_count: 175
              description: Vendors with an active status
              if_match_last_changed_date: '1999-12-31T12:00:00Z'
        description: The updated list definition.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListModel'
              example:
                id: 71B4ADAB-235D-4FB9-97FB-22CB80737E1C
                list_type: vendor
                name: Active vendors
                public_name: Active vendors
                definition:
                  filter:
                    filter_items:
                    - field:
                        value:
                          value: active
                          label: Active
                        field_id: status
                        operator: Equal
                  output:
                    items:
                    - field_id: vendor_display_name
                    - field_id: status
                  sort:
                    sort_fields:
                    - field_id: vendor_display_name
                      sort_order: asc
                created_by_user_id: 6B44131E-2935-4C0B-A7FB-5D4FA9729F50
                created_date: '2022-04-12T12:00:00Z'
                last_changed_by_user_id: 6B44131E-2935-4C0B-A7FB-5D4FA9729F50
                last_changed_by_user_name: Michael Simpson
                last_changed_date: '2022-04-12T12:00:00Z'
                record_count: 175
                description: Vendors with an active status
                is_owner: true
    get:
      operationId: GetList
      summary: Gets a list (PREVIEW)
      description: 'Returns a saved list


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: list_id
        in: path
        required: true
        schema:
          type: string
        description: The list identifier.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListModel'
              example:
                id: 71B4ADAB-235D-4FB9-97FB-22CB80737E1C
                list_type: vendor
                name: Active vendors
                public_name: Active vendors
                definition:
                  filter:
                    filter_items:
                    - field:
                        value:
                          value: active
                          label: Active
                        field_id: status
                        operator: Equal
                  output:
                    items:
                    - field_id: vendor_display_name
                    - field_id: status
                  sort:
                    sort_fields:
                    - field_id: vendor_display_name
                      sort_order: asc
                created_by_user_id: 6B44131E-2935-4C0B-A7FB-5D4FA9729F50
