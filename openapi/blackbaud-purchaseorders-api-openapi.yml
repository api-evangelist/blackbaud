components:
  schemas:
    PurchaseOrderSummaryApiCollection:
      type: object
      properties:
        count:
          type: integer
          format: int32
        value:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/PurchaseOrderSummary'
      additionalProperties: false
      description: Collection Response
    DomainErrorMessage:
      type: object
      properties:
        Error:
          type:
          - string
          - 'null'
        Details:
          type:
          - array
          - 'null'
          items:
            type: string
        ErrorPath:
          type:
          - string
          - 'null'
      additionalProperties: false
    CustomFieldDataType:
      title: CustomFieldDataType
      enum:
      - Text
      - Number
      - DateTime
      - Currency
      - Boolean
      - Table
      - FuzzyDate
      type: string
    LineItemType:
      title: LineItemType
      enum:
      - Regular
      - Miscellaneous
      - Comment
      type: string
      description: Line item possible enummarated types.
    BasicErrorMessage:
      type: object
      properties:
        Error:
          type:
          - string
          - 'null'
      additionalProperties: false
    CreateLineItem:
      required:
      - distributions
      - extended_cost
      - post_status
      - quantity_ordered
      - type
      - unit_cost
      type: object
      properties:
        type:
          $ref: '#/components/schemas/LineItemType'
        product_id:
          type:
          - integer
          - 'null'
          description: The product identifier of the line item.
          format: int32
        vendor_part_number:
          type:
          - string
          - 'null'
          description: The vendor part number of the line item.
        description:
          type:
          - string
          - 'null'
          description: The description of the line item.
        quantity_ordered:
          type: number
          description: The quantity ordered of the line item.
          format: decimal
        unit_of_measure:
          type:
          - string
          - 'null'
          description: The unit of measure of the line item.
        unit_cost:
          type: number
          description: The unit of cost of the line item.
          format: decimal
        extended_cost:
          type: number
          description: The extended cost of the line item.
          format: decimal
        post_status:
          $ref: '#/components/schemas/PostStatus'
        post_date:
          type:
          - string
          - 'null'
          description: 'The post date of the line item.

            Is required for line items with the status NotYetPosted'
          format: date-time
        comments:
          type:
          - string
          - 'null'
          description: The comments of the line item.
        notes:
          type:
          - string
          - 'null'
          description: The notes of the line item.
        deliver_to:
          type:
          - string
          - 'null'
          description: The staff member to deliver to for the line item.
        requested_by:
          type:
          - string
          - 'null'
          description: The staff member that requested the line item.
        department:
          type:
          - string
          - 'null'
          description: The department of the line item.
        distributions:
          type: array
          items:
            $ref: '#/components/schemas/CreateDistribution'
          description: The distributions of the line item.
        interfund_set:
          type:
          - string
          - 'null'
          description: The interfund set for this line item's distributions.
      additionalProperties: false
      description: Line item summary
    PurchaseOrderStatus:
      title: PurchaseOrderStatus
      enum:
      - UnprintedPurchaseOrder
      - OpenPurchaseOrder
      - UprintedChangeOrder
      - ReprintOrder
      - CanceledOrder
      - UnprintedCancellationNotice
      - ClosedOrder
      - DeletedOrder
      type: string
      description: A collection of possible enum values for a purchase order's status.
    Int32CreatedResult:
      type: object
      properties:
        record_id:
          type: integer
          format: int32
      additionalProperties: false
    PurchaseOrderSummary:
      type: object
      properties:
        purchase_order_id:
          type: integer
          description: The purchase order's identifier.
          format: int32
        order_number:
          type:
          - integer
          - 'null'
          description: The order number of the purchase order.
          format: int64
        order_date:
          type:
          - string
          - 'null'
          description: The date of the purchase order.
          format: date-time
        type:
          $ref: '#/components/schemas/PurchaseOrderType'
        order_total:
          type: number
          description: The total of the purchase order.
          format: decimal
        receipted_total:
          type: number
          description: The receipted total of the purchase order.
          format: decimal
        order_status:
          $ref: '#/components/schemas/PurchaseOrderStatus'
        vendor_name:
          type:
          - string
          - 'null'
          description: The vendor name assocaited with the purchase order.
        vendor_id:
          type: integer
          description: The vendor id of the purchase order.
          format: int32
        terms:
          type:
          - string
          - 'null'
          description: The term of the purchase order.
        date_added:
          type:
