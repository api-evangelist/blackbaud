openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: Accounts Payable Purchaseorders API'
  description: This API is used to manage accounts payable, including vendors and invoices.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/57a342f1d7dcde1c28a749fe
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/accountspayable/v1
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Purchaseorders
paths:
  /purchaseorders:
    post:
      operationId: CreatePurchaseOrder
      summary: Purchase Order (Create)
      description: Creates a new purchasee order.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePurchaseOrder'
            example:
              order_number: 8675309
              order_date: '2018-09-05T12:00:00Z'
              type: Regular
              order_status: UnprintedPurchaseOrder
              vendor_id: 42
              terms: Net 10
              ship_to_address_id: 17
              department: 01 Facilities
              buyer: Benton AU
              ship_via: Truck
              fob: Transit
              ordered_by: Alex W.
              order_from_contact_id: 32
              attention: Thomas O.
              comments: A po comment.
              expiration_date: '2018-09-05T02:35:54Z'
              custom_fields:
              - field_name: Purchase order text field
                value: my text value
                comments: custom field comments
                type: Text
                is_required: false
                date: '2018-09-05T12:00:00Z'
              line_items:
              - type: Regular
                product_id: 1
                vendor_part_number: L -1001
                description: Laptop Computer
                quantity_ordered: 1
                unit_of_measure: Each
                unit_cost: 300
                extended_cost: 300
                post_status: NotYetPosted
                post_date: '2018-08-30T12:00:00Z'
                comments: a comment
                notes: a note
                deliver_to: Alex W
                requested_by: Benton AU
                department: 01 Facilities
                distributions:
                - distribution_id: 0
                  distribution_splits:
                  - distribution_split_id: 0
                    ui_project_id: '1100'
                    transaction_code_values:
                    - name: Jurisdiction
                      value: None
                      id: 1
                      inactive: false
                    - name: Spendable ?
                      value: Spendable
                      id: 2
                      inactive: false
                    amount: 100
                    percent: 100
                    account_class: Unrestricted Net Assets
                  amount: 100
                  description: Debit distribution
                  account_number: 01-5000-00
                  type_code: Debit
                  custom_fields: []
                - distribution_id: 0
                  distribution_splits:
                  - distribution_split_id: 0
                    ui_project_id: '1100'
                    transaction_code_values:
                    - name: Jurisdiction
                      value: None
                      id: 1
                      inactive: false
                    - name: Spendable?
                      value: Spendable
                      id: 2
                      inactive: false
                    amount: 100
                    percent: 100
                    account_class: Unrestricted Net Assets
                  amount: 100
                  description: Credit distribution
                  account_number: 01-2000-00
                  type_code: Credit
                  custom_fields: []
                interfund_set: '00'
        description: The purchase order to create
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the ID of the created purchase number.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Int32CreatedResult'
              example:
                record_id: 843
        '400':
          description: Returned when the request is not in the correct format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Failed to save {record}
                Details:
                - The total percent distributed must equal 100%.
        '403':
          description: Returned when the user does not have permission to create an purchase order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Purchaseorders
    get:
      operationId: ListPurchaseOrders
      summary: Purchase order (List)
      description: Returns a list of purchase order summaries.
      parameters:
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to return.
      - name: search_text
        in: query
        required: false
        schema:
          type: string
        description: 'Text to match.

          Can match vendor_name or order_number.

          A blank search will match all purchase orders.'
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - Template
          - Blanket
          - Regular
        description: Type of purchase order.
      - name: from_date
        in: query
        required: false
        schema:
          type: string
        description: The minimum order date to include records.
      - name: to_date
        in: query
        required: false
        schema:
          type: string
        description: The maximum order date to include records.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains a list of purchase orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderSummaryApiCollection'
              example:
                count: 245
                value:
                - purchase_order_id: 24
                  order_number: 12345678901
                  order_date: '2025-01-01T12:00:00Z'
                  type: Template
                  order_total: 74.98
                  receipted_total: 0
                  order_status: ClosedOrder
                  vendor_name: A+ Office Supplies
                  vendor_id: 31
                  terms: Due on Receipt
                  date_added: '2015-12-01T10:58:37Z'
                  added_by: BentonAu
                  date_modified: '2018-08-08T03:10:44Z'
                  modified_by: Stacy
                - purchase_order_id: 1044
                  order_number: 129
                  order_date: '2018-08-16T12:00:00Z'
                  type: Template
                  order_total: 0
                  receipted_total: 0
                  order_status: UnprintedPurchaseOrder
                  vendor_name: Test vendor 2015
                  vendor_id: 71
                  terms: ''
                  date_added: '2016-01-13T12:27:43Z'
                  added_by: Mike
                  date_modified: '2018-08-16T02:13:10Z'
                  modified_by: Nancy
        '400':
          description: Returned when the request is not in the correct format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Invalid Request
                Details:
                - The value 'fake' is not valid for transaction_status.
        '403':
          description: Returned when the user does not have permission to view purchase orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Purchaseorders
  /purchaseorders/customfields:
    get:
      operationId: ListPurchaseOrderCustomFieldsOptions
      summary: Purchase Order custom field options (List)
      description: Returns a list of custom field options.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the list of custom fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomFieldOptionsPagedResponse'
              example:
                count: 24
                results:
                - custom_field_id: 8
                  name: Paid
                  type: Boolean
                  is_required: false
                - custom_field_id: 46
                  name: Demo Custom Field 2
                  type: Table
                  is_required: false
                  table_values:
                  - d1 - Demo 1
                  - d2 - Demo 2
                - custom_field_id: 47
                  name: Cheese Invoice Vendor Name
                  type: Table
                  is_required: false
                  table_values:
                  - MARY - Mary Rowe
                  - MARTY - Marty Rowe
                  - ANDREW - Andrew Rowe
                  - CONNOR - Connor Rowe
                - custom_field_id: 9
                  name: 'WI/Invoice #'
                  type: Number
                  is_required: false
      tags:
      - Purchaseorders
  /purchaseorders/{purchase_order_id}:
    get:
      operationId: GetPurchaseOrder
      summary: Purchase Order (Get)
      description: Returns the specified purchase order.
      parameters:
      - name: purchase_order_id
        in: path
        required: true
        schema:
          type: integer
        description: The identifier of the purchase order to retrieve.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the specified purchase order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseOrderDetail'
              example:
                ship_to_address: Administration Building
                department: 07 - Technology Services
                buyer: Chris Gentry (Tech Dpt)
                ship_via: UPS
                fob: Shipping
                ordered_by: Alex W.
                ordered_from_contact_id: 27
                attention: Chris Gentry (Tech Dpt)
                comments: comments
                custom_fields:
                - field_name: PO Text Attribute
                  value: A note
                  comments: '123'
                  type: Text
                  is_required: false
                  date: '2018-09-08T12:00:00Z'
                - field_name: PO Number Attribute
                  value: '123'
                  comments: '456'
                  type: Number
                  is_required: false
                  date: '2018-09-08T12:00:00Z'
                purchase_order_id: 10
                order_number: 102
                order_date: '2012-07-01T12:00:00Z'
                type: Regular
                order_total: 4839.75
                receipted_total: 4839.75
                order_status: UnprintedPurchaseOrder
                vendor_name: Computer Services, Inc.
                vendor_id: 17
                terms: 1.5 /10 Net 30
                date_added: '2012-10-12T12:26:20Z'
                added_by: Supervisor
                date_modified: '2012-10-12T01:12:01Z'
                modified_by: Supervisor
        '404':
          description: Returned when the specified purchase order could not be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
        '403':
          description: Returned when the user does not have permission to view purchase orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Purchaseorders
  /purchaseorders/{purchase_order_id}/lineitems:
    post:
      operationId: CreateLineItems
      summary: Line item (Create)
      description: Adds line items to an existing purchase order.
      parameters:
      - name: purchase_order_id
        in: path
        required: true
        schema:
          type: integer
        description: The identifier of the purchase order on which to create line items.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Purchaseorders-purchase_order_id-LineitemsPostRequest-1'
            example:
            - type: Regular
              product_id: 1
              vendor_part_number: L-1001
              description: Laptop Computer
              quantity_ordered: 1
              unit_of_measure: Each
              unit_cost: 300
              extended_cost: 300
              post_status: NotYetPosted
              post_date: '2018-08-30T12:00:00Z'
              comments: a comment
              notes: a note
              deliver_to: Alex W
              requested_by: Benton AU
              department: 01 Facilities
              distributions:
              - distribution_id: 0
                distribution_splits:
                - distribution_split_id: 0
                  ui_project_id: '1100'
                  transaction_code_values:
                  - name: Jurisdiction
                    value: None
                    id: 1
                    inactive: false
                  - name: Spendable?
                    value: Spendable
                    id: 2
                    inactive: false
                  amount: 100
                  percent: 100
                  account_class: Unrestricted Net Assets
                amount: 100
                description: Debit distribution
                account_number: 01-5000-00
                type_code: Debit
                custom_fields: []
              - distribution_id: 0
                distribution_splits:
                - distribution_split_id: 0
                  ui_project_id: '1100'
                  transaction_code_values:
                  - name: Jurisdiction
                    value: None
                    id: 1
                    inactive: false
                  - name: Spendable ?
                    value: Spendable
                    id: 2
                    inactive: false
                  amount: 100
                  percent: 100
                  account_class: Unrestricted Net Assets
                amount: 100
                description: Credit distribution
                account_number: 01-2000-00
                type_code: Credit
                custom_fields: []
              interfund_set: '00'
        description: Line items to add to the purchase order.
      responses:
        '200':
          description: Returned when the operation is successful.
        '400':
          description: Returned when the request is not in the correct format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Failed to save {record}
                Details:
                - The total percent distributed must equal 100%.
        '403':
          description: Returned when the user does not have permission to create an purchase order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                Error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Purchaseorders
    get:
      operationId: ListLineItemsSinglePurchaseOrder
      summary: Line Items (List)
      description: Returns a list of line items.
      parameters:
      - name: purchase_order_id
        in: path
        required: true
        schema:
          type: integer
        description: The identifier of purchase order containing the line items being returned.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to return.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the list of line items.
          content:
            application/json:
