openapi: 3.0.1
info:
  title: 'Blackbaud SKY API: Fundraising'
  description: This API manages information contained within the fundraising hierarchy and related entities such as campaigns,
    funds, and appeals.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/58bdd6c8d7dcde06046081d7
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations,
      examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/fundraising/v1
paths:
  /appeals:
    get:
      operationId: ListAppeals
      summary: Appeal list
      description: "Returns a paginated list of appeals.\r\n<p />\r\nThe default sorting behavior is to list appeals in ascending\
        \ order based on when they were created.\r\n<p />\r\nHowever, the <code>last_modified</code> parameter overrides the\
        \ default sorting behavior to list appeals in ascending order based on when they were last modified. The <code>last_modified</code>\
        \ parameter also adds the <code>sort_token</code> parameter to the <code>next_link</code> URL to ensure that appeals\
        \ are stably sorted and that order persists when changes occur while working through a paginated list.\r\n<p />\r\n\
        If the <code>last_modified</code> and <code>date_added</code> parameters are both specified, the sorting behavior\
        \ is to list appeals based on when they were last modified.\r\n<p />"
      parameters:
      - name: date_added
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for appeals created on or after the specified date. The filter respects time offsets
          from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for appeals modified on or after the specified date. The filter respects time offsets
          from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: sort_token
        in: query
        required: false
        schema:
          type: string
        description: Represents a token filter to provide the next stable-sorted list of appeals. This will be provided on
          the next_link collection response property when last_modified or sort_token filters are specified on the request.
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
        description: Set this parameter to "true" to include inactive appeals in the response.
      - name: appeal_id
        in: query
        required: false
        schema:
          type: array
        description: Represents a list of appeal identifiers. Returns appeals if any of the specified appeal identifiers match
          any of their appeals.  For example, "appeal_id=280&amp;appeal_id=1232" returns appeals with either "280" or "1232"
          appeal identifiers.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to return. The default is 500. The maximum is 5000.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip. For use with pagination.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a>
            of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/fundraising#Appeal">appeal</a> entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection[AppealRead]'
              example:
                count: 23
                next_link: https://api.sky.blackbaud.com/fundraising/v1/appeals?offset=3&limit=3
                value:
                - id: '1'
                  category: Annual
                  date_added: '1999-06-25T11:59:57Z'
                  date_modified: '2007-06-18T14:44:52.623Z'
                  description: Annual Newsletter
                  goal:
                    value: 250000
                  inactive: false
                  lookup_id: NEWSLETTER
                - id: '2'
                  category: Capital
                  date_added: '1999-05-19T15:18:25Z'
                  date_modified: '2007-06-18T14:40:31.863Z'
                  description: Celebrity Auction
                  end_date: '2004-12-31T00:00:00Z'
                  goal:
                    value: 100000
                  inactive: false
                  lookup_id: AUCTION
                  start_date: '2004-01-01T00:00:00Z'
                - id: '3'
                  date_added: '1999-06-25T12:04:15Z'
                  date_modified: '2007-06-18T13:58:06.237Z'
                  description: Year End Appeal
                  goal:
                    value: 500000
                  inactive: false
                  lookup_id: YEAREND
        '400':
          description: Returned when the specified request parameters are not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to view the appeals.
  /appeals/attachments:
    post:
      operationId: CreateAppealAttachment
      summary: Appeal attachment (Create)
      description: Creates an appeal attachment.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentAdd'
            example:
              date: '2015-01-25T04:00:00Z'
              name: Pledge Thank You Letter
              parent_id: '2396'
              tags:
              - Letter
              type: Link
              url: http://file.com/
        description: An object that represents the attachment to add.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the ID of the new attachment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: '1281'
        '400':
          description: Returned when the request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to create the attachment.
        '404':
          description: Returned when the specified appeal is not found.
  /appeals/attachments/{attachment_id}:
    delete:
      operationId: DeleteAppealAttachment
      summary: Appeal attachment (Delete)
      description: Deletes an appeal attachment.
      parameters:
      - name: attachment_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the attachment to delete.
      responses:
        '200':
          description: Returned when the operation successfully deletes the attachment.
        '400':
          description: Returned when the specified attachment ID in the request URL is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to delete the attachment.
    patch:
      operationId: EditAppealAttachment
      summary: Appeal attachment (Edit)
      description: Edits an appeal attachment.
      parameters:
      - name: attachment_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the attachment to edit.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentEdit'
            example:
              date: '2015-01-25T04:00:00Z'
              name: Pledge Thank You Letter
              tags:
              - Letter
              url: http://example.com/
        description: An object that represents the attachment to edit.
      responses:
        '200':
          description: Returned when the operation successfully edits the attachment.
        '400':
          description: Returned when the specified attachment ID in the request URL is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to edit the attachment.
        '404':
          description: Returned when the specified attachment is not found.
  /appeals/categories:
    get:
      operationId: ListAppealCategories
      summary: Appeal categories
      description: Returns a list of appeal categories.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/fundraising/#Collection">collection</a>
            of string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection[String]'
              example:
                count: 10
                value:
                - Annual
                - Capital
                - Continuous
                - Direct Mail
                - Event
                - Major Donors
                - Membership
                - NotAnnual
                - Prospect
                - Semi-Annual
        '403':
          description: Returned when the user does not have permission to view the appeal categories.
  /appeals/customfields:
    post:
      operationId: CreateAppealCustomField
      summary: Appeal custom field (Create)
      description: Adds a new custom field.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomFieldAdd'
            example:
              category: Major Donors Only?
              comment: a comment
              date: '2016-01-22T00:00:00Z'
              parent_id: '2'
              value: 'true'
        description: An object representing the custom field to add.
      responses:
        '200':
          description: Returned when the operation succeeds and a new custom field has been created. The response body contains
            the ID of the newly added custom field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: '1281'
        '400':
          description: Returned when the request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to create the custom field.
        '404':
          description: Returned when the specified appeal is not found.
  /appeals/customfields/categories:
    get:
      operationId: ListAppealCustomFieldCategories
      summary: Appeal custom field categories
      description: Gets the list of custom field categories.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/fundraising#Collection">collection</a>
            of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/fundraising#CustomFieldCategory">custom
            field category</a> entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection[CustomFieldCategoryRead]'
              example:
                count: 2
                value:
                - name: Donor list used?
                  type: Boolean
                - name: Priority
                  type: CodeTableEntry
  /appeals/customfields/categories/values:
    get:
      operationId: ListAppealCustomFieldCategoryValues
      summary: Appeal custom field category values
      description: Gets the list of custom field category values.
      parameters:
      - name: category_name
        in: query
        required: false
        schema:
          type: string
        description: The name of the category for which the values should be returned.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a>
            of string custom field category values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection[String]'
              example:
                count: 5
                value:
                - Very High
                - High
                - Medium
                - Low
                - Very Low
  /appeals/customfields/{custom_field_id}:
    delete:
      operationId: DeleteAppealCustomField
      summary: Appeal custom field (Delete)
      description: Deletes the custom field with the specified ID.
      parameters:
      - name: custom_field_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the custom field to be deleted.
      responses:
        '200':
          description: Returned when the operation succeeds and the custom field has been deleted.
        '400':
          description: Returned when the specified custom field ID in the request URL is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to delete the custom field.
    patch:
      operationId: EditAppealCustomField
      summary: Appeal custom field (Edit)
      description: Edits an existing custom field.
      parameters:
      - name: custom_field_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the custom field to be edited.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomFieldEdit'
            example:
              comment: a comment
              date: '2016-01-22T00:00:00Z'
              value: strategic planning
        description: An object representing updated properties of the custom field to add.
      responses:
        '200':
          description: Returned when the operation succeeds and the custom field has been edited.
        '400':
          description: Returned when the request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to edit the custom field.
        '404':
          description: Returned when the specified custom field is not found.
  /appeals/{appeal_id}:
