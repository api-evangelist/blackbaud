        description: The immutable system record ID of the appeal for which information is to be retrieved.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified <a href='https://developer.blackbaud.com/skyapi/api/entity-reference/fundraising#Appeal'>appeal</a>
            entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppealRead'
              example:
                id: '26'
                category: Annual
                date_added: '2001-11-16T11:26:53.52Z'
                date_modified: '2017-03-23T13:10:46.64Z'
                description: Direct Mailing
                end_date: '2004-12-31T00:00:00Z'
                goal:
                  value: 0
                inactive: false
                lookup_id: DIRECT MAIL
                start_date: '2004-01-01T00:00:00Z'
        '400':
          description: Returned when the specified appeal ID in the request URL is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to view the appeal.
        '404':
          description: Returned when the specified appeal is not found.
