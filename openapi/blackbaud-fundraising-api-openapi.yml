  /funds:
    get:
      operationId: ListFunds
      summary: Fund list
      description: "Returns a paginated list of funds.\r\n<p />\r\nThe default sorting behavior is to list funds in ascending\
        \ order based on when they were created.\r\n<p />\r\nHowever, the <code>last_modified</code> parameter overrides the\
        \ default sorting behavior to list funds in ascending order based on when they were last modified. The <code>last_modified</code>\
        \ parameter also adds the <code>sort_token</code> parameter to the <code>next_link</code> URL to ensure that funds\
        \ are stably sorted and that order persists when changes occur while working through a paginated list.\r\n<p />\r\n\
        If the <code>last_modified</code> and <code>date_added</code> parameters are both specified, the sorting behavior\
        \ is to list funds based on when they were last modified.\r\n<p />"
      parameters:
      - name: date_added
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for funds created on or after the specified date. The filter respects time offsets
          from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for funds modified on or after the specified date. The filter respects time offsets
          from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: sort_token
        in: query
        required: false
        schema:
          type: string
        description: Represents a token filter to provide the next stable-sorted list of funds. This will be provided on the
          next_link collection response property when last_modified or sort_token filters are specified on the request.
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
        description: Set this parameter to "true" to include inactive funds in the response.
      - name: fund_id
        in: query
        required: false
        schema:
          type: array
        description: Represents a list of fund identifiers. Returns funds if any of the specified fund identifiers match any
          of their funds.  For example, "fund_id=280&amp;fund_id=1232" returns funds with either "280" or "1232" fund identifiers.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to return. The default is 500. The maximum is 5000.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip. For use with pagination.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a>
            of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/fundraising#Fund">fund</a> entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection[FundRead]'
              example:
                count: 52
                next_link: https://api.sky.blackbaud.com/fundraising/v1/funds?offset=3&limit=3
                value:
                - id: '2'
                  category: Annual
                  date_added: '1999-06-25T10:30:09Z'
                  date_modified: '2000-08-30T16:05:17.97Z'
                  description: 1999 Annual Fund
                  end_date: '1999-12-31T00:00:00Z'
                  goal:
                    value: 100000
                  inactive: false
                  lookup_id: 99ANNUAL
                  start_date: '1999-01-01T00:00:00Z'
                  type: Donor Advised Fund
                - id: '3'
                  category: Capital
                  date_added: '1999-06-25T10:30:54Z'
                  date_modified: '2004-01-30T10:05:10.233Z'
                  description: 2000 Annual Fund
                  end_date: '2000-12-31T00:00:00Z'
                  goal:
                    value: 100000
                  inactive: false
                  lookup_id: 2000ANNUAL
                  start_date: '2000-01-01T00:00:00Z'
                - id: '4'
                  date_added: '1999-06-25T10:31:28Z'
                  date_modified: '2002-07-30T14:33:30.463Z'
                  description: Acquisition Fund
                  goal:
                    value: 500000
                  inactive: false
                  lookup_id: ACQUISITION
                  start_date: '2000-01-01T00:00:00Z'
        '400':
          description: Returned when the specified request parameters are not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to view the funds.
