openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: Constituent Educations API'
  description: This API manages constituent information and related entities such as addresses, phones, emails, and notes.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/56b76470069a0509c8f1c5b3
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/constituent/v1
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Educations
paths:
  /educations:
    post:
      operationId: CreateConstituentEducation
      summary: Education (Create)
      description: Creates a constituent education.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EducationAdd'
            example:
              campus: Rochester
              class_of: '2016'
              constituent_id: '7856'
              date_entered:
                m: 8
                y: 2011
              date_graduated:
                m: 6
                y: 2016
              date_left:
                m: 5
                y: 2016
              degree: Bachelor of Science
              gpa: 3.8
              known_name: Barusu
              majors:
              - Software Engineering
              minors:
              - Japanese
              primary: false
              school: RIT
              social_organization: Society of Software Engineers
              status: Graduated
              type: 5-Year
        description: An object that represents the education to create.
      responses:
        '200':
          description: Returned when the operation successfully creates a education. The response body contains the ID of the new education.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: '1281'
        '400':
          description: Returned when the specified request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to create the education.
      tags:
      - Educations
    get:
      operationId: ListConstituentEducationsAllConstituents
      summary: Education list (All constituents)
      description: 'Returns a paginated list of education items.


        The default sorting behavior is to list education items in ascending order based on when they were created.


        However, the last_modified parameter overrides the default sorting behavior to list education items in ascending order based on when they were last modified. The last_modified parameter also adds the sort_token parameter to the next_link URL to ensure that education items are stably sorted and that order persists when changes occur while working through a paginated list.


        If the last_modified and date_added parameters are both specified, the sorting behavior is to list education items based on when they were last modified.


        Note: This endpoint returns data with an average latency of about 30 minutes. In addition, historic records have a default date_added timestamp of 1600-01-01 00:00:00.000 +00:00. The timestamp for newer records reflects when the records were added.'
      parameters:
      - name: date_added
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for education items created on or after the specified date. The filter respects time offsets from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for education items modified on or after the specified date. The filter respects time offsets from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: sort_token
        in: query
        required: false
        schema:
          type: string
        description: Represents a token filter to provide the next stable-sorted list of education items. This will be provided on the next_link collection response property when last_modified or sort_token filters are specified on the request.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to return. The default is 500. The maximum is 5000.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip. For use with pagination.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a> of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Education">education</a> entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfEducationRead'
              example:
                count: 193
                next_link: https://api.sky.blackbaud.com/constituent/v1/educations?offset=2&limit=2
                value:
                - id: '17'
                  campus: Indiana
                  class_of: '1970'
                  constituent_id: '205'
                  date_added: '1999-06-30T13:37:28Z'
                  date_entered:
                    d: 11
                    m: 5
                    y: 1965
                  date_graduated:
                    d: 11
                    m: 12
                    y: 1970
                  date_modified: '1999-07-01T15:03:24Z'
                  degree: MBA
                  primary: false
                  school: Indiana University
                  type: Graduate School
                - id: '18'
                  class_of: '1970'
                  constituent_id: '225'
                  date_added: '1999-06-30T13:37:28Z'
                  date_entered:
                    d: 20
                    m: 8
                    y: 1966
                  date_graduated:
                    d: 14
                    m: 6
                    y: 1970
                  date_modified: '2003-01-17T20:12:29.217Z'
                  degree: BS
                  majors:
                  - Biology
                  minors:
                  - Chemistry
                  primary: false
                  school: New Jersey Institute of Technology
                  type: Four Year College
        '400':
          description: Returned when the specified request parameters are not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to view the education items.
      tags:
      - Educations
  /educations/customfields:
    post:
      operationId: CreateEducationCustomField
      summary: Education custom field (Create)
      description: Creates an education custom field.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomFieldAdd'
            example:
              category: Graduated?
              comment: Due to graduate in December.
              date: '2022-10-10T00:00:00Z'
              parent_id: '1283'
              value: false
        description: An object that represents the custom field to create.
      responses:
        '200':
          description: Returned when the operation successfully creates a custom field. The response body contains the ID of the new custom field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: '1281'
        '400':
          description: Returned when the request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to create the custom field.
        '404':
          description: Returned when the specified education record is not found.
      tags:
      - Educations
  /educations/customfields/categories/details:
    get:
      operationId: ListEducationCustomFieldCategoryDetails
      summary: Education custom field category details
      description: Returns a list of education custom field category details.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a> of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#CustomFieldCategory">custom field categories</a>.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfCustomFieldCategoryRead'
              example:
                count: 4
                value:
                - name: Leadership Positions
                  type: Text
                  one_per_record: false
                - name: Athletics
                  type: CodeTableEntry
                  code_table_id: '1001'
                  one_per_record: false
                - name: Alumni Sponsor
                  type: ConstituentId
                  one_per_record: true
                - name: Date graduated
                  type: Date
                  one_per_record: false
        '403':
          description: Returned when the user does not have permission to view the custom field category details.
      tags:
      - Educations
  /educations/customfields/categories/values:
    get:
      operationId: ListEducationCustomFieldCategoryValues
      summary: Education custom field code table category values
      description: Returns a list of values for the specified code table category.
      parameters:
      - name: category_name
        in: query
        required: false
        schema:
          type: string
        description: The name of the custom field category to get values for.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a> of string custom field category values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfString'
              example:
                count: 5
                values:
                - Basketball
                - Hockey
                - Cheerleading
                - Cycling
                - Diving Team
        '403':
          description: Returned when the user does not have permission to view the custom field category values.
      tags:
      - Educations
  /educations/customfields/{custom_field_id}:
    delete:
      operationId: DeleteEducationCustomField
      summary: Education custom field (Delete)
      description: Deletes an education custom field.
      parameters:
      - name: custom_field_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the education custom field to delete.
      responses:
        '200':
          description: Returned when the operation is successful and the education custom field has been deleted.
        '400':
          description: Returned when the specified ID is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to delete the education custom field with the specified ID.
      tags:
      - Educations
    patch:
      operationId: EditEducationCustomField
      summary: Education custom field (Edit)
      description: Edits an education custom field.
      parameters:
      - name: custom_field_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the custom field to edit.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomFieldEdit'
            example:
              comment: Graduated with honors.
              date: '2022-12-28T00:00:00Z'
              value: true
        description: An object that represents the properties of the custom field to edit.
      responses:
        '200':
          description: Returned when the operation successfully edits the custom field.
        '400':
          description: Returned when the specified custom field ID in the request URL or the specified request parameters are not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to edit the custom field.
        '404':
          description: Returned when the specified custom field is not found.
      tags:
      - Educations
  /educations/degreeclasses:
    get:
      operationId: ListEducationDegreeClasses
      summary: Education degree classes
      description: Returns a list of available degree classes. This endpoint only applies to databases that are formatted for the UK.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains a <a href="/constituent-entity-reference#Collection">collection</a> of string degree class.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfString'
              example:
                count: 5
                value:
                - First Class Honours
                - Second Class Honours, upper division
                - Second Class Honours, lower division
                - Third-class honours
                - Ordinary degree
        '403':
          description: Returned when the user does not have permission to view constituent educations.
      tags:
      - Educations
  /educations/degrees:
    get:
      operationId: ListEducationDegrees
      summary: Education degrees
      description: Returns a list of available degrees.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains a <a href="/constituent-entity-reference#Collection">collection</a> of string degrees.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfString'
              example:
                count: 11
                value:
                - AA
                - AB
                - AS
                - BA
                - BFA
                - BS
                - Duke
                - JD
                - MBA
                - MD
                - MPA
        '403':
          description: Returned when the user does not have permission to view constituent educations.
      tags:
      - Educations
  /educations/departments:
    get:
      operationId: ListEducationDepartments
      summary: Education departments
      description: Returns a list of available departments. This endpoint only applies to databases that are formatted for the UK.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains a <a href="/constituent-entity-reference#Collection">collection</a> of string departments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfString'
              example:
                count: 8
                value:
                - Department of Business
                - Department of Computer Science
                - Department of Engineering
                - Department of Finance
                - Department of History
                - Department of Law
                - Department of Literature
                - Department of Science
        '403':
          description: Returned when the user does not have permission to view constituent educations.
      tags:
      - Educations
  /educations/faculties:
    get:
      operationId: ListEducationFaculties
      summary: Education faculties
      description: Returns a list of available facilities. This endpoint only applies to databases that are formatted for the UK.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains a <a href="/constituent-entity-reference#Collection">collection</a> of string faculties.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfString'
              example:
                count: 8
                value:
                - Faculty of Business
                - Faculty of Computer Science
                - Faculty of Engineering
                - Faculty of Finance
                - Faculty of History
                - Faculty of Law
                - Faculty of Literature
                - Faculty of Science
        '403':
          description: Returned when the user does not have permission to view constituent educations.
      tags:
      - Educations
  /educations/schools:
    get:
      operationId: ListEducationSchools
      summary: Education schools
      description: Returns a list of available schools.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains a <a href="/constituent-entity-reference#Collection">collection</a> of string schools.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfString'
              example:
                count: 15
                value:
                - Bates College
                - Berry College
                - Boston College
                - Boston University
                - Bowdoin College
                - California Inst. of Technology
                - Cambridge
                - Carleton College
                - Case Western Reserve
                - Center Preparatory School
                - Clemson
                - Clemson University
                - College of Charleston
                - County Day School
                - Dakota State
        '403':
          description: Returned when the user does not have permission to view constituent educations.
      tags:
      - Educations
  /educations/statuses:
    get:
      operationId: ListEducationStatuses
      summary: Education statuses
      description: Returns a list of available education statuses.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains a <a href="/constituent-entity-reference#Collection">collection</a> of string statuses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfString'
              example:
                count: 8
                value:
                - Current Student
                - Dismissed
                - Graduated
                - Internship Program
                - Leave
                - Probation
                - Registered
                - Transferred Out
        '403':
          description: Returned when the user does not have permission to view constituent educations.
      tags:
      - Educations
  /educations/subjects:
    get:
      operationId: ListEducationSubjects
      summary: Education subjects
      description: Returns a list of available subjects.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains a <a href="/constituent-entity-reference#Collection">collection</a> of string subjects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfString'
              example:
                count: 16
                value:
                - Accounting
                - Art
                - Biology
                - Business
                - Chemistry
                - Computer Science
                - Criminal Justice
                - Diet and Nutrition
                - Drama
                - Elementary Education
                - Engineering
                - English Literature
                - Finance
                - History
                - International Business
                - Jewish Studies
                - Law
        '403':
          description: Returned when the user does not have permission to view constituent educations.
      tags:
      - Educations
  /educations/types:
    get:
      operationId: ListEducationTypes
      summary: Education types
      description: Returns a list of available school types.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains a <a href="/constituent-entity-reference#Collection">collection</a> of string education types.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfString'
              example:
                count: 8
                value:
                - Community College
                - Excellent
                - Four Year College
                - Graduate School
                - High School
                - Junior College
                - K-12
                - K-5
        '403':
          description: Returned when the user does not have permission to view constituent educations.
      tags:
      - Educations
  /educations/{education_id}:
    delete:
      operationId: DeleteConstituentEducation
      summary: Education (Delete)
      description: Deletes a constituent education.
      parameters:
      - name: education_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the education to delete.
      responses:
        '200':
          description: Returned when the operation is successful and the education has been deleted.
        '400':
          description: Returned when the specified ID is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to delete the education with the specified ID.
      tags:
      - Educations
    patch:
      operationId: EditConstituentEducation
      summary: Education (Edit)
      description: Edits a constituent education.
      parameters:
      - name: education_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the education to edit.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EducationEdit'
            example:
              campus: Rochester
              class_of: '2016'
              date_entered:
                m: 8
                y: 2011
              date_graduated:
                m: 6
                y: 2016
              date_left:
                m: 5
                y: 2016
              degree: Bachelor of Science
              gpa: 3.8
              known_name: Barusu
              majors:
              - Software Engineering
              minors:
              - Japanese
              primary: false
              school: RIT
              social_organization: Society of Software Engineers
              status: Graduated
              type: 5-Year
        description: An object that represents the properties of the education to edit.
      responses:
        '200':
          description: Returned when the operation successfully edits the education.
        '400':
          description: Returned when the specified education ID in the request URL or the specified request parameters are not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to edit the education.
        '404':
          description: Returned when the specified education is not found.
      tags:
      - Educations
  /educations/{education_id}/customfields:
    get:
      operationId: ListEducationCustomFieldsSingleEducation
      summary: Education custom field list (Single education)
      description: Returns a list of custom fields on an education record.
      parameters:
      - name: education_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the education record to retrieve custom fields for.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a> of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#CustomField">custom field</a> entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfCustomFieldRead'
              example:
                count: 5
                value:
                - id: '92'
                  category: Athletics
                  date: '2021-10-04T00:00:00Z'
                  parent_id: '1'
                  type: CodeTableEntry
                  value: Golf Team
                - id: '93'
                  category: Leadership Positions
                  comment: Served as president for 2 years.
                  date: '2022-11-14T00:00:00Z'
                  parent_id: '1'
                  type: Text
                  value: President
                - id: '94'
                  category: Fuzzy date
                  parent_id: '1'
                  type: FuzzyDate
                  value:
                    d: 13
                    m: 9
                    y: 2022
                - id: '95'
                  category: Graduated?
                  date: '2019-12-12T00:00:00Z'
                  parent_id: '1'
                  type: Boolean
                  value: true
                - id: '96'
                  category: Date graduated
                  parent_id: '1'
                  type: Date
                  value: '2016-07-21T00:00:00Z'
        '403':
          description: Returned when the user does not have permission to view the education custom fields.
      tags:
      - Educations
components:
  schemas:
    ApiCollectionOfString:
      description: Fetching data all at once quickly becomes unmanageable. The collection entity helps by returning paginated chunks of large data sets. This entity includes helpful metadata and properties to paginate and iterate through the data.
      type: object
      properties:
        count:
          format: int32
          description: The number of items available for retrieval into the collection after applying any request parameters. The <b>limit</b> and <b>offset</b> parameters do not affect the <b>count</b>, but to facilitate paging, they may affect the number of items in the <b>value</b> result set.
          type: integer
        next_link:
          description: For paginated responses, the URI for the next page of results.
          type: string
        value:
          description: The set of items included in the response. This may be a subset of the items in the collection.
          type: array
          items:
            type: string
      x-hidden: true
      x-base-type: '#/definitions/ApiCollection'
    ApiCollectionOfEducationRead:
      description: Fetching data all at once quickly becomes unmanageable. The collection entity helps by returning paginated chunks of large data sets. This entity includes helpful metadata and properties to paginate and iterate through the data.
      type: object
      properties:
        count:
          format: int32
          description: The number of items available for retrieval into the collection after applying any request parameters. The <b>limit</b> and <b>offset</b> parameters do not affect the <b>count</b>, but to facilitate paging, they may affect the number of items in the <b>value</b> result set.
          type: integer
        next_link:
          description: For paginated responses, the URI for the next page of results.
          type: string
        value:
          description: The set of items included in the response. This may be a subset of the items in the collection.
          type: array
          items:
            $ref: '#/components/schemas/EducationRead'
      x-hidden: true
      x-base-type: '#/definitions/ApiCollection'
    CustomFieldAdd:
      description: While records provide many fields to track information, organizations often require additional details. To track this specialized information, use custom fields.
      required:
      - category
      type: object
      properties:
        category:
          description: The custom field category. Available values are the entries in the <b>Custom Field Categories</b> table of the parent object.
          type: string
        comment:
          description: 'The comment on the custom field. Character limit: 50.'
          maxLength: 50
          minLength: 0
          type: string
        date:
          format: date-time
          description: The date on the custom field. Uses <a href="https://tools.ietf.org/html/rfc3339">ISO-8601 format:</a><i>1969-11-21T10:29:43</i>.
          type: string
          x-supports-datetime-offset: false
        parent_id:
          description: The parent object's immutable system record ID.
          type: string
        value:
          description: The value of the custom field. The <code>type</code> property determines the format. Character limit depends on data type. Number types only support values greater than 0.
          type: object
      x-hidden: true
      x-display-name: Create custom field
      x-display-id: CreateCustomField
      x-additional-info: "<a name=\"CustomFieldTypes\"></a>\n<p>&nbsp;</p>\n<p>\n    Available values for the <b>type</b> of a <b>custom field</b>:\n</p>\n\n<div class=\"table-responsive\">\n    <table class=\"table table-striped table-hover\">\n        <thead>\n            <tr>\n                <th class=\"col-xs-3\"><strong>Type</strong></th>\n                <th class=\"col-xs-9\"><strong>Description</strong></th>\n            </tr>\n        </thead>\n        <tbody>\n            <tr>\n                <td>Boolean</td>\n                <td>Defines the custom field as a boolean value.</td>\n            </tr>\n            <tr>\n                <td>CodeTableEntry</td>\n                <td>Defines the custom field as a string value that represents a code table entry description.</td>\n            </tr>\n            <tr>\n                <td>ConstituentId</td>\n                <td>Defines the custom field as a constituent identifier value.</td>\n            </tr>\n            <tr>\n                <td>Currency</td>\n                <td>Defines the custom field as a decimal value.</td>\n            </tr>\n            <tr>\n                <td>Date</td>\n                <td>\n                    Defines the custom field as a date value in <a href=\"https://tools.ietf.org/html/rfc3339\">ISO-8601 format:</a> <i>1969-11-21T10:29:43</i>.\n                </td>\n            </tr>\n            <tr>\n                <td>FuzzyDate</td>\n                <td>\n                    Defines the custom field as a fuzzy date value.\n                </td>\n            </tr>\n            <tr>\n                <td>Number</td>\n                <td>Defines the custom field as an integer value.</td>\n            </tr>\n            <tr>\n                <td>Text</td>\n                <td>Defines the custom field as a string value. Character limit: 255.</td>\n            </tr>\n        </tbody>\n    </table>\n</div>"
    CustomFieldCategoryRead:
      description: The system includes many different types of custom fields. Custom field categories store the metadata to appropriately match how you use a given custom field with an available type.
      type: object
      properties:
        name:
          description: The name of the custom field category.
          type: string
        type:
          description: The type of data that custom fields with this category represent. Available values are listed below.
          enum:
          - Text
          - Number
          - Date
