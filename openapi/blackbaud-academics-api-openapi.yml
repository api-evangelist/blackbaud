      tags:
      - Academics
  /v1/academics/courses/{course_id}/customfields/list:
    post:
      operationId: V1AcademicsCoursesByCourse_idCustomfieldsListPost
      summary: Academics courses custom fields list create
      description: 'Add custom field data to a course


        Requires at least one of the following roles in the Education Management system:


        Academic group manager


        Platform Manager'
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: integer
        description: The ID of the course.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V1AcademicsCourses-course_id-CustomfieldsListPostRequest-1'
            example:
            - field_id: 1
              data_type_id: 1
              int_value: 1
            - field_id: 2
              data_type_id: 2
              text_value: texting
            - field_id: 3
              data_type_id: 3
              decimal_value: 3.14
            - field_id: 4
              data_type_id: 4
              bit_value: true
        description: Object that describes the list of custom fields that will be created for the course.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1AcademicsCourses-course_id-CustomfieldsListPost200ApplicationJsonResponse'
              example: 0
      tags:
      - Academics
    patch:
      operationId: V1AcademicsCoursesByCourse_idCustomfieldsListPatch
      summary: Academics courses custom fields list update
      description: 'Update the custom field data for a course


        Requires at least one of the following roles in the Education Management system:


        Academic group manager


        Platform Manager'
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: integer
        description: The ID of the course.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V1AcademicsCourses-course_id-CustomfieldsListPatchRequest-1'
            example:
            - id: 1
              field_id: 1
              data_type_id: 1
              int_value: 1
            - id: 1
              field_id: 2
              data_type_id: 2
              text_value: texting
            - id: 3
              field_id: 3
              data_type_id: 3
              decimal_value: 3.14
            - id: 4
              field_id: 4
              data_type_id: 4
              bit_value: true
        description: Object that describes the list of custom fields that will be updated for the course.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1AcademicsCourses-course_id-CustomfieldsListPatch200ApplicationJsonResponse'
              example: 0
      tags:
      - Academics
  /v1/academics/departments:
    get:
      operationId: V1AcademicsDepartmentsGet
      summary: Academics departments
      description: 'Returns a collection of academic departments.


        Requires at least one of the following roles in the Education Management system:


        Academic Group Manager


        Platform Manager


        Any Manager Role'
      parameters:
      - name: level_id
        in: query
        required: false
        schema:
          type: integer
        description: Provide a school level ID to limit results to departments valid for the specified school level.
      - name: include_nonacademic
        in: query
        required: false
        schema:
          type: boolean
        description: Set to true to include non-academic departments in results. Defaults to false.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentCollection'
              example:
                count: 2
                value:
                - id: 123
                  level_description: Upper School
                  name: Math
                  sort: 10
                  is_academic: true
                  description: ''
                  school_levels:
                  - id: 1
                    description: Upper School
                    abbreviation: US
                - id: 124
                  level_description: Upper School
                  name: English
                  sort: 20
                  is_academic: true
                  description: All English for Lower school campus
                  school_levels:
                  - id: 1
                    description: Upper School
                    abbreviation: US
      tags:
      - Academics
  /v1/academics/enrollments/changes:
    get:
      operationId: V1AcademicsEnrollmentsChangesGet
      summary: Academics Student Enrollments Changes
      description: 'Returns a collection of students with enrollment changes on or after the date parameter.


        The maximum period of time that can be specified is 30 days from start_date, if end_date is not provided or is greater than 30 days from start_date it will be set to start_date + 30 days.


        Requires at least one of the following roles in the Education Management system:


        Schedule Manager


        Academic Group Manager'
      parameters:
      - name: start_date
        in: query
        required: true
        schema:
          type: string
        description: The DateTime of changes to academics enrollments to begin with
      - name: end_date
        in: query
        required: false
        schema:
          type: string
        description: The DateTime of changes to academics enrollments to end with.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentChangesCollection'
              example:
                count: 0
                next_link: string
                value:
                - id: 0
                  preferred_name: string
                  first_name: string
                  last_name: string
                  changes:
                  - section_id: 0
                    course_code: string
                    section_name: string
                    modified_date_time: string
                    modified_by: 0
                    action: string
      tags:
      - Academics
