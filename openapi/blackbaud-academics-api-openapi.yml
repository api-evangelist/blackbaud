openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: School Academics API'
  description: This API is used to provide access to school information such as users, academics, admissions, athletics, content, lists, and general school info.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/school
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/school
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Academics
paths:
  /v1/academics/courserequests:
    get:
      operationId: V1AcademicsCourserequestsGet
      summary: Academics course requests
      description: 'Course requests for all of the offering types that allow requests are returned, including Academics, Activities, Advisories and Athletics.


        Requires the following role in the Education Management system:


        Schedule Manager'
      parameters:
      - name: school_year
        in: query
        required: false
        schema:
          type: string
        description: Provide the ID or label of the school year of the course request. Defaults to the current school year.
      - name: school_level
        in: query
        required: false
        schema:
          type: string
        description: Provide the ID of a school level to limit results to requests for courses in that school level.
      - name: course_id
        in: query
        required: false
        schema:
          type: string
        description: Provide a course ID (offering ID) to limit results to requests for that course.
      - name: status
        in: query
        required: false
        schema:
          type: string
        description: 'Provide a status to limit results to requests with that request status. Allowed values: Pending, Approved, Denied.'
      - name: enrollment_status
        in: query
        required: false
        schema:
          type: string
        description: 'Provide an enrolled status to limit results to requests where the student is enrolled or not. Allowed values: NotEnrolled, Enrolled, Dropped.'
      - name: include_recommendations
        in: query
        required: false
        schema:
          type: boolean
          default: 'false'
        description: Set to true to include recommendations for each request. Defaults to false.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: '1'
        description: The page number for pagination.
      - name: size
        in: query
        required: false
        schema:
          type: integer
          default: '5000'
        description: The number of items per page.
      responses:
        '200':
          description: A List of Course Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1AcademicsCourserequestsGet200ApplicationJsonResponse'
              example:
              - id: 1
                user:
                  id: 1
                  email: JohnJr@domain.com
                  first_name: John
                  last_name: Smith
                  maiden_name: Brannigan
                  middle_name: Robert
                  preferred_name: Jack
                  preferred_last_name: Brannigan
                  prefix: Mr.
                  suffix: Jr.
                course:
                  id: 1
                  name: Fencing
                  type:
                    id: 1
                    description: Academics
                  course_code: CHR240
                  description: Fun with pointy sticks
                  length: 1
                  credits: 0.5
                  school_level:
                    id: 1
                    abbreviation: US
                    name: Upper School
                  school_year: 2023 - 2024
                start_term:
                  id: 1
                  name: Fall
                preference: 1
                status: Approved
                enrollment_status: Enrolled
                type: Request
                is_required: false
                is_recommendation: true
                request_date: '2024-09-30T01:30:05Z'
                requested_by:
                  id: 1
                  email: JohnJr@domain.com
                  first_name: John
                  last_name: Smith
                  maiden_name: Brannigan
                  middle_name: Robert
                  preferred_name: Jack
                  preferred_last_name: Brannigan
                  prefix: Mr.
                  suffix: Jr.
                recommended_by:
                  id: 1
                  email: JohnJr@domain.com
                  first_name: John
                  last_name: Smith
                  maiden_name: Brannigan
                  middle_name: Robert
                  preferred_name: Jack
                  preferred_last_name: Brannigan
                  prefix: Mr.
                  suffix: Jr.
                reviewer:
                  id: 1
                  email: JohnJr@domain.com
                  first_name: John
                  last_name: Smith
                  maiden_name: Brannigan
                  middle_name: Robert
                  preferred_name: Jack
                  preferred_last_name: Brannigan
                  prefix: Mr.
                  suffix: Jr.
                fulfilled_by_alternate: false
                note: Test Course
                alternates:
                - course:
                    id: 1
                    name: Fencing
                    type:
                      id: 1
                      description: Academics
                    course_code: CHR240
                    description: Fun with pointy sticks
                    length: 1
                    credits: 0.5
                    school_level:
                      id: 1
                      abbreviation: US
                      name: Upper School
                    school_year: 2023 - 2024
                  start_term:
                    id: 1
                    name: Fall
                  preference: 1
      tags:
      - Academics
  /v1/academics/courses:
    get:
      operationId: V1AcademicsCoursesGet
      summary: Academics courses
      description: 'Returns a collection of academic courses, filtered by department and/or school level.


        Requires at least one of the following roles in the Education Management system:


        Academic Group Manager


        Platform Manager'
      parameters:
      - name: department_id
        in: query
        required: false
        schema:
          type: integer
        description: Identifier for a specific department.
      - name: level_id
        in: query
        required: false
        schema:
          type: integer
        description: Identifier for a specific school level.
      - name: exclude_inactive
        in: query
        required: false
        schema:
          type: boolean
          default: 'false'
        description: Set to True to exclude inactive courses. Defaults to false, if omitted.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseCollection'
              example:
                count: 1
                value:
                - offering_id: 1010
                  course_length: 1
                  course_code: Math101
                  course_title: Intro To Algebra
