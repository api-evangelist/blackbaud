  /v1/academics/rosters:
    get:
      operationId: V1AcademicsRostersGet
      summary: Academics rosters
      description: 'Returns the academic rosters for a selected year. Uses current school year by default.


        Requires the following role in the Education Management system:


        Schedule Manager


        Academic Group Manager'
      parameters:
      - name: school_year
        in: query
        required: false
        schema:
          type: string
        description: "The ID or label of the school year. \nDefaults to the current school year."
      - name: school_level
        in: query
        required: false
        schema:
          type: integer
        description: Limits rosters returned to school level specified.
      - name: section_ids
        in: query
        required: false
        schema:
          type: string
        description: "Limits rosters returned to sections specified. \nProvide comma-delimited list of section_id values."
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: "Limits rosters returned to sections that were modified on or after the date provided. \n Use ISO-8601 date-time format: 2024-09-01T00:00:00-5:00."
      - name: include_dropped
        in: query
        required: false
        schema:
          type: boolean
          default: 'false'
        description: Set to True to include dropped students in the rosters. Defaults to false, if omitted.
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
          default: 'false'
        description: Set to True to include inactive sections. Defaults to false.
      responses:
        '200':
