  /v1/academics/schedules/master:
    get:
      operationId: V1AcademicsSchedulesMasterGet
      summary: Academics master schedule
      description: 'Returns a collection of Master Schedule days within the date range provided.


        Requires at least one of the following roles in the Education Management system:


        Academic Group Manager


        Schedule Manager


        SKY API Basic'
      parameters:
      - name: level_num
        in: query
        required: true
        schema:
          type: integer
        description: Level Number indicates which school you are working with.
      - name: start_date
        in: query
        required: true
        schema:
          type: string
        description: Start of the date range (inclusive).  The earliest possible start_date is 1/1/1900, any date entered before that date will be overwritten with 1/1/1900.
      - name: end_date
        in: query
        required: true
        schema:
          type: string
        description: End of the date range (inclusive). If the end_date is earlier than the start_date the end_date wil be overwritten with the start_date plus 7 days.
      - name: offering_type
        in: query
        required: false
        schema:
          type: integer
        description: Filters the results by a specific group type. Defaults to "All" offering types.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterScheduleDayCollection'
              example:
                count: 2
                value:
                - calendar_day: '2019-06-06T12:00:00Z'
                  schedule_sets:
                  - schedule_set_id: 85214793
                    day_label: Thursday
                    blocks:
                    - block_id: 9876454
                      block: E Block
                      start_time: '2019-06-06T02:25:00Z'
                      end_time: '2019-06-06T03:05:00Z'
                      offering_type: 1
                      is_canceled: false
                - calendar_day: '2019-06-07T12:00:00Z'
                  schedule_sets:
                  - schedule_set_id: 12345098
                    holiday_label: Very Special Holiday
                    blocks: []
      tags:
      - Academics
  /v1/academics/schedules/sets:
    get:
      operationId: V1AcademicsSchedulesSetsGet
      summary: Academics schedule sets by level
      description: 'Returns a collection of Schedule Sets for the specified ```level_num```.


        Requires at least one of the following roles in the Education Management system:


        Academic Group Manager


        Schedule Manager'
      parameters:
      - name: level_num
        in: query
        required: true
        schema:
          type: integer
        description: Level Number indicates which school you are working with.
      - name: school_year
        in: query
        required: false
        schema:
          type: string
        description: The school year to get Schedule Sets for. Corresponds to ```school_year_label``` in the <a href="https://developer.sky.blackbaud.com/docs/services/school/operations/v1yearsget">Year list</a>. Defaults to the current school year.
      - name: group_type
        in: query
        required: false
        schema:
          type: integer
          default: '1'
        description: The Group Type to filter the collection of Schedule Sets. Defaults to the 'Academics' (1).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleSetCollection'
              example:
                count: 1
                value:
                - schedule_set_id: 100200300
                  title: Thur Afternoons
                  meeting_time: true
                  rotation: true
                  begin_date: '2018-07-01T12:00:00Z'
                  end_date: '2019-06-15T12:00:00Z'
      tags:
      - Academics
  /v1/academics/schedules/sets/{schedule_set_id}:
    get:
      operationId: V1AcademicsSchedulesSetsBySchedule_set_idGet
      summary: Academics schedule set
      description: 'Returns details about the specified ```schedule_set_id```.


        Requires at least one of the following roles in the Education Management system:


        Academic Group Manager


        Schedule Manager'
      parameters:
      - name: schedule_set_id
        in: path
        required: true
        schema:
          type: integer
        description: ID of the Schedule Set you seek.
      responses:
        '200':
          description: OK
          content:
            application/json:
