openapi: 3.0.1
info:
  title: 'Blackbaud SKY API: Prospect'
  description: This API enables you to manage prospects, track cultivation stages, and monitor prospect status to drive fundraising
    outcomes.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/prospect
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations,
      examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/prospect
paths:
  /v1/constituents/{constituent_id}/prospect:
    get:
      operationId: GetProspectIdByConstituentId
      summary: Get the prospect identifier for a constituent (PREVIEW)
      description: 'Translates a constituent ID to its associated prospect ID.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: constituent_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the constituent.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProspectIdRead'
              example:
                prospect_id: '28'
  /v1/constituents/{constituent_id}/prospect/contributionsummary:
    get:
      operationId: GetConstituentProspectContributionSummary
      summary: Get prospect contribution summary (PREVIEW)
      description: 'Returns the contribution summary for a constituent, including philanthropic, political, and other giving
        totals.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: constituent_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the constituent.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProspectContributionSummary'
              example:
                philanthropic_giving: 25000
                philanthropic_gift_count: 12
                political_giving: 5000
                political_gift_count: 3
                other_giving: 1500
                other_gift_count: 2
  /v1/constituents/{constituent_id}/prospect/financialdata/assets:
    post:
      operationId: CreateConstituentProspectFinancialDataAsset
      summary: Create a prospect financial data asset (PREVIEW)
      description: 'Creates a new financial data asset for a constituent.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: constituent_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the constituent.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProspectFinancialDataAssetWriteModel'
            example:
              amount: 250000
              notes: Primary residence
              date_acquired:
                y: 2015
                m: 6
                d: 15
              date_assessed:
                y: 2024
                m: 1
              info_type_id: '100'
              info_source_id: '200'
        description: The financial data asset to create.
      responses:
        '200':
          description: OK
    get:
      operationId: ListConstituentProspectFinancialDataAssets
      summary: List prospect financial data assets (PREVIEW)
      description: 'Returns a paginated list of financial data assets for a constituent.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: constituent_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the constituent.
      - name: top
        in: query
        required: false
        schema:
          type: integer
        description: The number of records to return.
      - name: skip
        in: query
        required: false
        schema:
          type: integer
        description: The number of records to skip.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProspectFinancialDataAssetCollection'
              example:
                count: 2
                value:
                - id: 1
                  amount: 250000
                  notes: Primary residence
                  date_acquired:
                    y: 2015
                    m: 6
                    d: 15
                  date_assessed:
                    y: 2024
                    m: 1
                  info_type_id: '100'
                  info_type: Real Estate
                  info_source_id: '200'
                  info_source: Public Record
                  date_added: '2020-03-10T12:00:00Z'
                  date_last_changed: '2024-01-05T12:00:00Z'
                - id: 2
                  amount: 50000
                  date_acquired:
                    y: 2020
                  date_assessed:
                    y: 2023
                    m: 12
                    d: 1
                  info_type_id: '101'
                  info_type: Securities
                  info_source_id: '201'
                  info_source: Self-reported
                  date_added: '2021-05-20T12:00:00Z'
                  date_last_changed: '2023-12-01T12:00:00Z'
  /v1/constituents/{constituent_id}/prospect/financialdata/assets/{asset_id}:
    delete:
      operationId: DeleteConstituentProspectFinancialDataAsset
      summary: Delete a prospect financial data asset (PREVIEW)
      description: 'Deletes a financial data asset for a constituent.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: constituent_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the constituent.
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the financial data asset to delete.
      responses:
        '200':
          description: OK
    patch:
      operationId: EditConstituentProspectFinancialDataAsset
      summary: Edit a prospect financial data asset (PREVIEW)
      description: 'Updates an existing financial data asset for a constituent.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: constituent_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the constituent.
      - name: asset_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the financial data asset to update.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProspectFinancialDataAssetWriteModel'
            example:
              amount: 250000
              notes: Primary residence
              date_acquired:
                y: 2015
                m: 6
                d: 15
              date_assessed:
                y: 2024
                m: 1
              info_type_id: '100'
              info_source_id: '200'
        description: The financial data asset details to update.
      responses:
        '200':
          description: OK
  /v1/constituents/{constituent_id}/prospect/financialdata/summary:
    get:
      operationId: GetConstituentProspectFinancialDataSummary
      summary: Get prospect financial data summary (PREVIEW)
      description: 'Returns the financial data summary (aggregated amounts by type) for a constituent.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: constituent_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the constituent.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialDataSummary'
              example:
                assets:
                - amount: 1500000
                  info_type_id: '100'
                  info_type: Real Estate
                - amount: 500000
                  info_type_id: '200'
                  info_type: Stock Holdings
  /v1/constituents/{constituent_id}/prospect/givingpreferences:
    get:
      operationId: GetConstituentProspectGivingPreferences
      summary: Get prospect giving preferences (PREVIEW)
      description: 'Returns the giving preferences for a constituent, including interests and causes they will not give to.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: constituent_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the constituent.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProspectGivingPreferences'
              example:
                prospect_id: '280'
                interests:
                - description: Arts and Culture
                  comments: Especially performing arts
                - description: Education
                  comments: Higher education programs
                will_not_give_to:
                - description: Political
                  comments: No political donations
  /v1/constituents/{constituent_id}/prospect/othergifts:
    get:
      operationId: GetConstituentProspectOtherGifts
      summary: Get prospect other gifts (PREVIEW)
      description: 'Returns a paginated list of gifts to other organizations for a constituent, with an optional giving type
        filter.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: constituent_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the constituent.
      - name: top
        in: query
        required: false
        schema:
          type: integer
        description: The number of records to return.
      - name: skip
        in: query
        required: false
        schema:
          type: integer
        description: The number of records to skip.
      - name: giving_type
        in: query
        required: false
        schema:
          type: string
        description: The giving type filter (Philanthropic, Political, or Other).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProspectOtherGiftsCollection'
              example:
                count: 2
                value:
                - id: '101'
                  organization_name: United Way
                  amount_given: 5000
                  date_given:
                    y: 2024
                    m: 3
                    d: 15
                  organization_type: Foundation
                  reason: Annual Campaign
                  comments: Recurring donation
                - id: '102'
                  organization_name: Red Cross
                  amount_given: 1000
                  date_given:
                    y: 2023
                    m: 12
                  organization_type: Nonprofit
                  reason: Disaster Relief
  /v1/constituents/{constituent_id}/prospectclassification:
    get:
      operationId: GetConstituentProspectClassification
      summary: Get a prospect classification (PREVIEW)
      description: 'Returns the prospect classification of a constituent.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: constituent_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the constituent to retrieve the prospect classification for.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProspectClassificationRead'
              example:
                constituent_id: '280'
                classification_id: '3'
                classification: Major Giving
    patch:
      operationId: EditConstituentProspectClassification
      summary: Update a prospect classification (PREVIEW)
      description: 'Updates the prospect classification of a constituent.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: constituent_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the constituent to update the prospect classification for.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProspectClassificationWrite'
            example:
              classification: Major Giving
        description: The prospect classification details to update.
      responses:
        '200':
          description: OK
  /v1/constituents/{constituent_id}/prospectstatus:
    get:
      operationId: GetConstituentProspectStatus
      summary: Get a prospect status (PREVIEW)
      description: 'Returns the current prospect status of a constituent.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: constituent_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the constituent to retrieve the current prospect status for.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProspectStatusRead'
              example:
                id: '28'
                constituent_id: '280'
                status_id: '1142'
                status: Cultivation
                start_date: '2026-05-22T12:00:00Z'
                days_elapsed: 7
                comments: They seem interested
                author_id: 16faa6e3-54ac-4e8e-b42b-1ecab94fe21a
                author_name: Fundraiser McFundraiser
                is_past_due: false
    patch:
      operationId: EditConstituentProspectStatus
      summary: Update a prospect status (PREVIEW)
      description: 'Updates the current prospect status of a constituent.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: constituent_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the constituent to update the current prospect status for.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProspectStatusWrite'
            example:
              status: Cultivation
              start_date: '2026-06-01T12:00:00Z'
              comments: Updated status
        description: The prospect status details to update.
      responses:
        '200':
          description: OK
  /v1/constituents/{constituent_id}/prospectstatushistories:
    get:
      operationId: GetConstituentProspectStatusHistories
      summary: List constituent prospect statuses (PREVIEW)
      description: 'Returns a constituent''s prospect status history.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: constituent_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the constituent to retrieve information for.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: The number of records to return. Defaults to 500.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: The number of records to skip. Defaults to 0.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProspectStatusHistoryReadApiCollection'
              example:
                count: 3
                value:
                - author_id: 16faa6e3-54ac-4e8e-b42b-1ecab94fe21a
                  author_name: Supervisor
                  comments: No longer engaging this prospect
                  constituent_id: '1'
                  days_elapsed: 295
                  id: '28'
                  is_past_due: false
                  start_date: '2024-01-01T12:00:00Z'
                  status_id: '1142'
                  status_description: Closed
                - author_id: a1b2c3d4-5678-9abc-def0-1234567890ab
                  author_name: Blackbaud Prospect Processing
                  comments: Doing some research on this prospect
                  constituent_id: '1'
                  days_elapsed: 365
                  id: '27'
                  is_past_due: true
                  start_date: '2023-01-01T12:00:00Z'
                  status_id: '1148'
                  status_description: Research
                - author_id: b2c3d4e5-6789-abcd-ef01-234567890abc
                  author_name: Blackbaud Prospect Processing
                  constituent_id: '1'
                  days_elapsed: 108
                  id: '20'
                  is_past_due: false
                  start_date: '2022-09-15T12:00:00Z'
                  status_id: '1301'
                  status_description: Strategy
  /v1/prospect/financialdata/informationsources:
    get:
      operationId: ListProspectInformationSources
      summary: List prospect information sources (PREVIEW)
      description: 'Returns the available information sources for the tenant.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
          default: 'false'
        description: Whether to include inactive sources. Default is false.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InformationSourceCollection'
              example:
                information_sources:
                - id: '1'
                  description: Self-reported
                  is_active: true
                  sequence: 1
                - id: '2'
                  description: Public records
                  is_active: true
                  sequence: 2
  /v1/prospect/financialdata/types:
    get:
      operationId: ListProspectFinancialDataTypes
      summary: List prospect financial data types (PREVIEW)
      description: 'Returns the available financial data types for the tenant.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
          default: 'false'
        description: Whether to include inactive types. Default is false.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialDataTypeCollection'
              example:
                financial_data_types:
                - id: '100'
                  description: Real Estate
                  is_active: true
                  sequence: 1
                - id: '200'
                  description: Stock Holdings
                  is_active: true
                  sequence: 2
  /v1/prospects/{prospect_id}/constituent:
    get:
      operationId: GetConstituentIdByProspectId
      summary: Get the constituent identifier for a prospect (PREVIEW)
      description: 'Translates a prospect ID to its associated constituent ID.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: prospect_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the prospect.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstituentIdRead'
              example:
                constituent_id: '280'
  /v1/prospectstatushistories/{id}:
    delete:
      operationId: DeleteProspectStatusHistory
      summary: Delete a prospect status history record (PREVIEW)
      description: 'Deletes a prospect status history record.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the prospect status history record.
      responses:
        '200':
          description: OK
    patch:
      operationId: EditProspectStatusHistory
      summary: Edit a prospect status history record (PREVIEW)
      description: 'Updates a prospect status history record.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the prospect status history record.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProspectStatusHistoryWrite'
            example:
              status: Cultivation
              start_date: '2024-01-15T12:00:00Z'
              comments: Updated status
        description: The prospect status history details to update.
      responses:
        '200':
          description: OK
    get:
      operationId: GetProspectStatusHistory
      summary: Get a prospect status history record (PREVIEW)
      description: 'Returns a single prospect status history record.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the prospect status history record.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProspectStatusHistoryRead'
              example:
                author_id: 899e035e-91ab-49df-bb15-5dad17bef5b2
                author_name: John Smith
                comments: Moved to cultivation phase
                constituent_id: '280'
                days_elapsed: 503
                id: '123'
                is_past_due: false
                start_date: '2024-01-15T12:00:00Z'
                status_id: '2'
                status_description: Cultivation
components:
  schemas:
    ConstituentIdRead:
      type: object
      properties:
        constituent_id:
          type: string
          description: The immutable system record ID of the constituent.
          nullable: true
      additionalProperties: false
      description: Contains the constituent ID associated with a prospect.
    FinancialDataSummary:
      type: object
      properties:
        assets:
          type: array
          items:
            $ref: '#/components/schemas/FinancialDataSummaryAsset'
          description: The list of financial data summary assets.
          nullable: true
      additionalProperties: false
      description: Represents the financial data summary for a constituent.
    FinancialDataSummaryAsset:
      type: object
      properties:
        amount:
          type: number
          description: The amount.
          format: double
          nullable: true
        info_type_id:
          type: string
          description: The info type identifier.
          nullable: true
        info_type:
          type: string
          description: The info type description.
          nullable: true
      additionalProperties: false
      description: A single asset in the financial data summary.
    FinancialDataType:
      type: object
      properties:
        id:
          type: string
          description: The identifier.
          nullable: true
        description:
          type: string
          description: The description.
          nullable: true
        is_active:
          type: boolean
          description: Whether the type is active.
          nullable: true
        sequence:
          type: integer
          description: The display sequence.
          format: int32
          nullable: true
      additionalProperties: false
      description: A single financial data type entry.
    FinancialDataTypeCollection:
      type: object
      properties:
        financial_data_types:
          type: array
          items:
            $ref: '#/components/schemas/FinancialDataType'
          description: The list of financial data types.
          nullable: true
      additionalProperties: false
      description: Represents the available financial data types for a tenant.
    FuzzyDate:
      type: object
      properties:
        y:
          type: integer
          description: The year.
          format: int32
          nullable: true
        m:
          type: integer
          description: The month.
          format: int32
          nullable: true
        d:
          type: integer
          description: The day.
          format: int32
          nullable: true
      additionalProperties: false
      description: Represents a fuzzy date that may contain only a year, year and month, month and day (no year), or a complete
        date.
    InformationSource:
      type: object
      properties:
        id:
          type: string
          description: The identifier.
          nullable: true
        description:
          type: string
          description: The description.
          nullable: true
        is_active:
          type: boolean
          description: Whether the source is active.
          nullable: true
        sequence:
          type: integer
          description: The display sequence.
          format: int32
          nullable: true
      additionalProperties: false
      description: A single information source entry.
    InformationSourceCollection:
      type: object
      properties:
        information_sources:
          type: array
          items:
            $ref: '#/components/schemas/InformationSource'
          description: The list of information sources.
          nullable: true
      additionalProperties: false
      description: Represents the available information sources for a tenant.
    ProspectClassificationRead:
      type: object
      properties:
        constituent_id:
          type: string
          description: The immutable system record ID of the constituent associated with the prospect classification.
          nullable: true
        classification_id:
          type: string
          description: The identifier of the prospect classification code table entry.
          nullable: true
        classification:
          type: string
          description: The classification description.
          nullable: true
      additionalProperties: false
      description: The prospect classification for a constituent.
    ProspectClassificationWrite:
      required:
      - classification
      type: object
      properties:
        classification:
          minLength: 1
          type: string
          description: The prospect classification description (e.g. 'Major Gifts', 'Planned Giving').
      additionalProperties: false
      description: Model for updating a prospect classification.
    ProspectContributionSummary:
      type: object
      properties:
        philanthropic_giving:
          type: number
          description: The total philanthropic giving amount.
          format: double
        philanthropic_gift_count:
          type: integer
          description: The philanthropic gift count.
          format: int32
        political_giving:
          type: number
          description: The total political giving amount.
          format: double
        political_gift_count:
          type: integer
          description: The political gift count.
          format: int32
        other_giving:
          type: number
          description: The total other giving amount.
          format: double
        other_gift_count:
          type: integer
          description: The other gift count.
          format: int32
      additionalProperties: false
      description: Represents a constituent's prospect contribution summary.
    ProspectFinancialDataAssetCollection:
      type: object
      properties:
        count:
          type: integer
          description: The total number of records available.
          format: int32
        value:
          type: array
          items:
            $ref: '#/components/schemas/ProspectFinancialDataAssetRead'
          description: The collection of financial data assets.
          nullable: true
      additionalProperties: false
      description: Represents a paginated collection of financial data assets.
    ProspectFinancialDataAssetRead:
      type: object
      properties:
        id:
          type: integer
          description: The identifier of the financial data asset.
          format: int32
          nullable: true
        amount:
          type: number
          description: The amount of the financial data asset.
          format: double
          nullable: true
        notes:
          type: string
          description: Notes about the financial data asset.
          nullable: true
        date_acquired:
          $ref: '#/components/schemas/FuzzyDate'
        date_assessed:
          $ref: '#/components/schemas/FuzzyDate'
        info_type_id:
          type: string
          description: The info type identifier.
          nullable: true
        info_type:
          type: string
          description: The info type description.
          nullable: true
