openapi: 3.2.0
info:
  title: Blackbaud Prospect API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Prospect across 3 of this provider''s published API definitions: blackbaud-altru-prospect-api-openapi.yml, blackbaud-crm-prospect-api-openapi.yml, blackbaud-prospect-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/alt-prsmg
- url: https://api.sky.blackbaud.com/crm-prsmg
- url: https://api.sky.blackbaud.com/prospect
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Prospect
paths:
  /prospect/{constituent_id}/stewardshipplans:
    get:
      operationId: ListStewardshipPlans
      summary: List stewardship plans
      description: This operation returns all stewardship plans related to a constituent.
      parameters:
      - name: constituent_id
        in: path
        required: true
        schema:
          type: string
        description: The constituent id.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Limits the number of records to return.
      - name: session_key
        in: query
        required: false
        schema:
          type: string
        description: A unique key provided by user for paging results. The same key will be returned in a successful response.
      - name: infinity_session
        in: query
        required: false
        schema:
          type: string
        description: Values for cookies related to the Infinity load balancer session.
      - name: more_rows_range_key
        in: query
        required: false
        schema:
          type: string
        description: Key for accessing cached results on subsequent calls to this data list.
      - name: start_row_index
        in: query
        required: false
        schema:
          type: integer
        description: Number of rows to skip,get result after these rows.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of result entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StewardshipPlanListCollection'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to view the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Prospect
    servers:
    - url: https://api.sky.blackbaud.com/alt-prsmg
  /v1/prospect/financialdata/informationsources:
    get:
      operationId: ListProspectInformationSources
      summary: List prospect information sources (PREVIEW)
      description: 'Returns the available information sources for the tenant.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
          default: 'false'
        description: Whether to include inactive sources. Default is false.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InformationSourceCollection'
              example:
                information_sources:
                - id: '1'
                  description: Self-reported
                  is_active: true
                  sequence: 1
                - id: '2'
                  description: Public records
                  is_active: true
                  sequence: 2
      tags:
      - Prospect
    servers:
    - url: https://api.sky.blackbaud.com/prospect
  /v1/prospect/financialdata/types:
    get:
      operationId: ListProspectFinancialDataTypes
      summary: List prospect financial data types (PREVIEW)
      description: 'Returns the available financial data types for the tenant.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
          default: 'false'
        description: Whether to include inactive types. Default is false.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinancialDataTypeCollection'
              example:
                financial_data_types:
                - id: '100'
                  description: Real Estate
                  is_active: true
                  sequence: 1
                - id: '200'
                  description: Stock Holdings
                  is_active: true
                  sequence: 2
      tags:
      - Prospect
    servers:
    - url: https://api.sky.blackbaud.com/prospect
components:
  schemas:
    StewardshipPlanListSummary:
      type: object
      properties:
        id:
          type: string
          description: The ID.
        name:
          type: string
          description: The plan name.
        manager:
          type: string
          description: The plan manager.
        sites_list:
          type: string
          description: The sites.
        constituent_name:
          type: string
          description: The constituent.
        plan_type:
          type: string
          description: The plan type.
        plan_sub_type:
          type: string
          description: The plan subtype.
        start_date:
          type: string
          description: 'The start date. Uses the format YYYY-MM-DDThh:mm:ss. An example date: <i>1955-11-05T22:04:00</i>.'
          format: date-time
        date_added:
          type: string
          description: 'The date added. Uses the format YYYY-MM-DDThh:mm:ss. An example date: <i>1955-11-05T22:04:00</i>.'
          format: date-time
      additionalProperties: false
      description: ListStewardshipPlans
      x-display-name: Stewardship Plans List
      x-display-id: Stewardship Plans List
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          description: A URI reference [RFC3986] that identifies the problem type. This specification encourages that, when dereferenced, it provide human-readable documentation for the problem type (e.g., using HTML [W3C.REC-html5-20141028]). When this member is not present, its value is assumed to be "about:blank".
        title:
          type: string
          description: A short, human-readable summary of the problem type. It SHOULD NOT change from occurrence to occurrence of the problem, except for purposes of localization (e.g., using proactive content negotiation; see [RFC7231], Section 3.4).
        status:
          type: integer
          description: The HTTP status code ([RFC7231], Section 6) generated by the origin server for this occurrence of the problem.
          format: int32
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        instance:
          type: string
          description: A URI reference that identifies the specific occurrence of the problem. It may or may not yield further information if dereferenced.
        trace_id:
          type: string
          description: A request ID that can be provided to Blackbaud Support that may help with further troubleshooting.
        span_id:
          type: string
          description: A request ID that can be provided to Blackbaud Support that may help with further troubleshooting.
      additionalProperties: false
      description: A machine-readable format for specifying errors in HTTP API responses based on https://tools.ietf.org/html/rfc7807.
      x-display-name: Problem details
      x-display-id: ProblemDetails
    StewardshipPlanListCollection:
      type: object
      properties:
        count:
          type: integer
          description: The number of items available for retrieval into the collection after applying any request parameters.
          format: int32
        value:
          type: array
          items:
            $ref: '#/components/schemas/StewardshipPlanListSummary'
          description: The set of items included in the response. This may be a subset of the items in the collection.
        infinity_session:
          type: string
          description: Values for cookies related to the Infinity load balancer session.
          format: string
        session_key:
          type: string
          description: Session key for paging provided by user in request query parameter.
          format: string
        total_available_rows:
          type: integer
          description: The number of total rows available.
          format: int32
        more_rows_range_key:
          type: string
          description: Key for accessing cached results on subsequent calls to this data list.
          format: string
        data_no_longer_available:
          type: boolean
          description: Indicates data is no longer available in the context of this session.
          format: boolean
      additionalProperties: false
      description: A collection of items. Data lists can contain paginated results.
    StewardshipPlanListSummary_2:
      type: object
      properties:
        id:
          type: string
          description: The ID.
        name:
          type: string
          description: The plan name.
        manager:
          type: string
          description: The plan manager.
        sites_list:
          type: string
          description: The sites.
        constituent_name:
          type: string
          description: The constituent.
        plan_type:
          type: string
          description: The plan type.
        plan_sub_type:
          type: string
          description: The plan subtype.
        start_date:
          type: string
          description: 'The start date. Uses the format YYYY-MM-DDThh:mm:ss. An example date: <i>1955-11-05T22:04:00</i>.'
          format: date-time
        date_added:
          type: string
          description: 'The date added. Uses the format YYYY-MM-DDThh:mm:ss. An example date: <i>1955-11-05T22:04:00</i>.'
          format: date-time
        isactive:
          type: boolean
          description: Indicates whether isactive.
      additionalProperties: false
      description: ListStewardshipPlans
      x-display-name: Stewardship Plans List
      x-display-id: Stewardship Plans List
    InformationSource:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          description: The identifier.
        description:
          type:
          - string
          - 'null'
          description: The description.
        is_active:
          type:
          - boolean
          - 'null'
          description: Whether the source is active.
        sequence:
          type:
          - integer
          - 'null'
          description: The display sequence.
          format: int32
      additionalProperties: false
      description: A single information source entry.
    FinancialDataTypeCollection:
      type: object
      properties:
        financial_data_types:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/FinancialDataType'
          description: The list of financial data types.
      additionalProperties: false
      description: Represents the available financial data types for a tenant.
    FinancialDataType:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          description: The identifier.
        description:
          type:
          - string
          - 'null'
          description: The description.
        is_active:
          type:
          - boolean
          - 'null'
          description: Whether the type is active.
        sequence:
          type:
