  /v1/candidates/{candidate_id}:
    patch:
      operationId: V1CandidatesByCandidate_idPatch
      summary: Candidate (Edit)
      description: 'Updates candidate information for the specified entering year.


        Requires the following role in the Education Management system:


        Admissions Manager


        Admissions Staff'
      parameters:
      - name: candidate_id
        in: path
        required: true
        schema:
          type: integer
        description: The user ID of the candidate.
      - name: school_year
        in: query
        required: false
        schema:
          type: string
        description: The ID or description of the school year the candidate is entering. Defaults to current admission year.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateUpdateRequest'
            example:
              entering_year: 2024 - 2025
              entering_grade: Ninth grade
              status: active
              inactive_status_reason: Denied Acceptance
              staff_id: 1
              consultants:
              - 1
              has_i20_form: false
              source: Recruiter
              referral: Friend
              referral_text: A friend at the school
              languages_at_home: English, Korean
              requested_financial_aid: false
              has_iep: false
              has504: false
              has_private_evaluation: false
              reapply:
                has_previously_applied: true
                school_comment: A schooled comment
                candidate_comment: A candid comment
              skipped_grade:
                has_skipped_grade: true
                school_comment: A schooled comment
                candidate_comment: A candid comment
              withdrawn:
                has_withdrawn: true
                school_comment: A schooled comment
                candidate_comment: A candid comment
              special_concerns:
                has_special_concerns: true
                school_comment: A schooled comment
                candidate_comment: A candid comment
              tutoring:
                requires_tutoring: true
                reason: At remedial math levels
              custom_fields_text:
              - field_identifier: text_field_7
                field_name: Favorite color
                field_value: Burnt sienna
              custom_fields_date:
              - field_identifier: date_field_7
                field_name: Favorite day
                field_value: '2023-03-29'
              custom_fields_defined:
              - field_identifier: defined_field_7
                field_name: T-shirt size
                field_value: Medium
        description: The candidate details to update.
      responses:
        '200':
          description: Returns user id on success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Candidates-candidate_id-Patch200ApplicationJsonResponse'
              example: 0
      tags:
      - Candidates
