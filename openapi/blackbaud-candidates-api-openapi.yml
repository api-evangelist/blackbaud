openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: Enrollment Management Candidates API'
  description: Blackbaud Education Management API for Enrollment Management
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/afe-edems
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/afe-edems
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Candidates
paths:
  /v1/candidates:
    post:
      operationId: V1CandidatesPost
      summary: Candidate (Create)
      description: 'Creates a candidate record for the user for a specified school year.


        Requires the following role in the Education Management system:


        Admissions Manager


        Admissions Staff


        Platform Manager


        SKY API Data Sync'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCandidateRequest'
            example:
              user_id: 1
              entering_year: 2024 - 2025
              entering_grade: 1st grade
              checklist_type: 1
      responses:
        '200':
          description: Returns user id on success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1CandidatesPost200ApplicationJsonResponse'
              example: 0
      tags:
      - Candidates
    get:
      operationId: V1CandidatesGet
      summary: Candidate list (Get)
      description: 'Returns a collection of admission candidates.


        Requires the following role in the Education Management system:


        Admissions Manager


        Admissions Staff


        Platform Manager


        SKY API Data Sync'
      parameters:
      - name: school_year
        in: query
        required: false
        schema:
          type: string
        description: Specify the ID or label of a school year to limit results to candidates for that entry year. Defaults to current admissions year.
      - name: status
        in: query
        required: false
        schema:
          type: string
        description: Specify the ID or description of the candidate status to limit results to candidates with that status.
      - name: modified_date
        in: query
        required: false
        schema:
          type: string
        description: 'Specify a date to limit results to candidates modified on or after that date. Use ISO-8601 date format: 2025-04-30'
      - name: size
        in: query
        required: false
        schema:
          type: integer
          default: '3000'
        description: The number of records per page (Default record size is 3000).
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: '1'
        description: The page of results to start from (Default start page is 1).
      - name: school_level
        in: query
        required: false
        schema:
          type: integer
        description: Provide the ID of the school level to limit results to candidates for that school level.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateReadCollection'
