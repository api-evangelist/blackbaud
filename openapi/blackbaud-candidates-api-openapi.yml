components:
  schemas:
    CandidateInterviewRead:
      type: object
      properties:
        id:
          type:
          - integer
          - 'null'
          description: The ID of the candidate interview
          format: int32
        type:
          $ref: '#/components/schemas/TableValueBase'
        start_time:
          type:
          - string
          - 'null'
          description: The start time of the interview
          format: date-time
        end_time:
          type:
          - string
          - 'null'
          description: The end time of the interview
          format: date-time
        interviewer:
          $ref: '#/components/schemas/UserBaseRead'
        interviewer_other:
          type:
          - string
          - 'null'
          description: Information for non-user interviewer
        accompanying_adults:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/UserBaseRead'
          description: An array of accompanying adult objects
        rating:
          type:
          - integer
          - 'null'
          description: The rating of the interview
          format: int32
        is_rescheduled:
          type:
          - boolean
          - 'null'
          description: True if interview was rescheduled
        did_not_show:
          type:
          - boolean
          - 'null'
          description: True if candidate did not show for interview
        comment:
          type:
          - string
          - 'null'
          description: The comment for the interview
      additionalProperties: false
      description: An object with candidate interview information
    Referral:
      type: object
      properties:
        id:
          type:
          - integer
          - 'null'
          description: The ID of the referral table value
          format: int32
        description:
          type:
          - string
          - 'null'
          description: The description of the referral
        comment:
          type:
          - string
          - 'null'
          description: The comment for the referral
      additionalProperties: false
      description: An object with candidate referral information
    UserBaseRead:
      type: object
      properties:
        id:
          type:
          - integer
          - 'null'
          description: The user ID of the user
          format: int32
        prefix:
          type:
          - string
          - 'null'
          description: The prefix of the user
        first_name:
          type:
          - string
          - 'null'
          description: The first name of the user
        middle_name:
          type:
          - string
          - 'null'
          description: The middle name of the user
        last_name:
          type:
          - string
          - 'null'
          description: The last name of the user
        suffix:
          type:
          - string
          - 'null'
          description: The suffix of the user
        preferred_name:
          type:
          - string
          - 'null'
          description: The preferred first name of the user
        preferred_last_name:
          type:
          - string
          - 'null'
          description: The preferred last name of the user
        maiden_name:
          type:
          - string
          - 'null'
          description: The former or maiden name of the user
        email:
          type:
          - string
          - 'null'
          description: The email of the user
      additionalProperties: false
      description: User base model
    SpecialConcerns:
      type: object
      properties:
        has_special_concerns:
          type:
          - boolean
          - 'null'
          description: True if the candidate has special concerns
        school_comment:
          type:
          - string
          - 'null'
          description: The school’s comment
        candidate_comment:
          type:
          - string
          - 'null'
          description: The candidate’s comment
      additionalProperties: false
      description: An object with candidate special concern information
    TableValueBase:
      type: object
      properties:
        id:
          type:
          - integer
          - 'null'
          description: The ID of the table value
          format: int32
        description:
          type:
          - string
          - 'null'
          description: The description of the table value
      additionalProperties: false
      description: 'Table value base model. Used for table entry fields (i.e. dropdown controls) to provide both ID and Description information for the selected value. General system tables can be retrieved by School API endpoints: GET Types table types and GET Types table values.'
    EducationalSupport:
      type: object
      properties:
        has_educational_support:
          type:
          - boolean
          - 'null'
          description: True if the candidate has educational support
        documentational_url:
          type:
          - string
          - 'null'
          description: The url of the educational support document file
        school_comment:
          type:
          - string
          - 'null'
          description: The school’s comment
        candidate_comment:
          type:
          - string
          - 'null'
          description: The candidate’s comment
      additionalProperties: false
      description: An object with educational support information
    Tutoring:
      type: object
      properties:
        requires_tutoring:
          type:
          - boolean
          - 'null'
          description: True if the candidate requires tutoring
        reason:
          type:
          - string
          - 'null'
          description: The reason the candidate requires tutoring
      additionalProperties: false
      description: An object with candidate tutoring information
    CandidateVisitRead:
      type: object
      properties:
        id:
          type:
          - integer
          - 'null'
          description: The ID of the candidate visit
          format: int32
        type:
          $ref: '#/components/schemas/TableValueBase'
        start_time:
          type:
          - string
          - 'null'
          description: The start time of the visit
          format: date-time
        end_time:
          type:
          - string
          - 'null'
          description: The end time of the visit
          format: date-time
        guide:
          $ref: '#/components/schemas/UserBaseRead'
        guide_other:
          type:
          - string
          - 'null'
          description: Information for non-user guide
        accompanying_adults:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/UserBaseRead'
          description: An array of accompanying adult objects
        is_rescheduled:
          type:
          - boolean
          - 'null'
          description: True if visit was rescheduled
        did_not_show:
          type:
          - boolean
          - 'null'
          description: True if candidate did not show for visit
        comment:
          type:
          - string
          - 'null'
          description: The comment for the visit
      additionalProperties: false
      description: An object with candidate visit information
    TableValue:
      type: object
      properties:
        abbreviation:
          type:
          - string
          - 'null'
          description: The abbreviation of the table value
        id:
          type:
          - integer
          - 'null'
          description: The ID of the table value
          format: int32
        description:
          type:
          - string
          - 'null'
          description: The description of the table value
      additionalProperties: false
      description: 'Table value model. Used for table entry fields (i.e. dropdown controls) to provide both ID and Description information for the selected value. General system tables can be retrieved by School API endpoints: GET Types table types and GET Types table values.'
    CreateCandidateRequest:
      required:
      - checklist_type
      - entering_grade
      - entering_year
      - user_id
      type: object
      properties:
        user_id:
