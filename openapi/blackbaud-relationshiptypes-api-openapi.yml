paths:
  /relationshiptypes:
    get:
      operationId: ListRelationshipTypes
      summary: Relationship types
      description: Returns a list of relationship types.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a> of string relationship types.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfString'
              example:
                count: 74
                value:
                - Attorney
                - Aunt
                - Benefactor
                - Benefit Provider
                - Benefit Recipient
                - Board Member
