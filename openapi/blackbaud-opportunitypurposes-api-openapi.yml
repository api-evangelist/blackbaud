openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: Opportunity Opportunitypurposes API'
  description: This API manages opportunity information and related entities such as opportunity fundraisers, opportunity attachments, and opportunity custom fields.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/58e3b2597c1af25c58b9c4e3
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/opportunity/v1
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Opportunitypurposes
paths:
  /opportunitypurposes:
    get:
      operationId: ListOpportunityPurposes
      summary: Opportunity purposes
      description: Returns the list of opportunity purposes.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/opportunity#Collection">collection</a> of string opportunity purposes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection_String'
              example:
                count: 10
                value:
                - Annual Fund
                - Discretionary
                - Infrastructure
                - Major Gift
                - Multiple
                - One
                - Provide Housing
                - Provide Relief
                - Research Endowment
                - Undetermined
        '403':
          description: Returned when the user does not have permission to view the opportunity purposes.
      tags:
      - Opportunitypurposes
components:
  schemas:
    ApiCollection_String:
      description: Fetching data all at once quickly becomes unmanageable. The collection entity helps by returning paginated chunks of large data sets. This entity includes helpful metadata and properties to paginate and iterate through the data.
      type: object
      properties:
        count:
          format: int32
          description: The number of items available for retrieval into the collection after applying any request parameters. The <b>limit</b> and <b>offset</b> parameters do not affect the <b>count</b>, but to facilitate paging, they may affect the number of items in the <b>value</b> result set.
          type: integer
        next_link:
          description: For paginated responses, the URI for the next page of results.
          type: string
        value:
          description: The set of items included in the response. This may be a subset of the items in the collection.
          type: array
          items:
            type: string
      x-hidden: true
      x-base-type: '#/definitions/ApiCollection'
  securitySchemes:
    Bb-Api-Subscription-Key:
      type: apiKey
      name: Bb-Api-Subscription-Key
      in: header
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://app.blackbaud.com/oauth/authorize
          tokenUrl: https://oauth2.sky.blackbaud.com/token
          scopes: {}
