tags:
- name: Candidatestatuses
paths:
  /v1/candidatestatuses:
    get:
      operationId: V1CandidatestatusesGet
      summary: Candidate status change list (Get)
      description: 'Returns the candidate status changes for a year.


        Requires the following role in the Education Management system:


        Admissions Manager


        Admissions Staff'
      parameters:
      - name: school_year
        in: query
        required: false
        schema:
          type: string
        description: The ID or label of the entering school year. Defaults to current admissions year.
      - name: status_type
        in: query
        required: false
        schema:
          type: string
        description: The ID or description of a candidate status type. Limits results to status changes of that type.
      - name: start_date
        in: query
        required: false
        schema:
          type: string
        description: Limits results to status changes occurring on or after the specified date.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateStatusChangeCollection'
              example:
                count: 1
                value:
                - candidate:
                    id: 1
                    prefix: Mr.
                    first_name: Kianna
                    middle_name: Mark
                    last_name: Reed
                    suffix: Jr.
                    preferred_name: ''
                    preferred_last_name: Reed
                    maiden_name: ''
                    email: kianna@example.com
                  type:
                    id: 1
                    description: Inquiry
                  date: '2024-03-31T12:00:00Z'
      tags:
      - Candidatestatuses
  /v1/candidatestatuses/{candidate_id}:
    get:
      operationId: V1CandidatestatusesByCandidate_idGet
      summary: Candidate status change list - single candidate (Get)
      description: 'Returns the status history for a candidate.


        Requires the following role in the Education Management system:


        Admissions Manager


        Admissions Staff'
      parameters:
      - name: candidate_id
        in: path
        required: true
        schema:
          type: integer
        description: The user ID of the candidate.
      - name: school_year
        in: query
        required: false
        schema:
          type: string
        description: The ID or label of the entering school year. Defaults to current admissions year.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateStatusChangeCollection'
              example:
                count: 1
                value:
                - candidate:
                    id: 1
                    prefix: Mr.
                    first_name: Kianna
                    middle_name: Mark
                    last_name: Reed
                    suffix: Jr.
                    preferred_name: ''
                    preferred_last_name: Reed
                    maiden_name: ''
                    email: kianna@example.com
                  type:
                    id: 1
                    description: Inquiry
                  date: '2024-03-31T12:00:00Z'
      tags:
      - Candidatestatuses
