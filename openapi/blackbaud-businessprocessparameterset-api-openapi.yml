paths:
  /businessprocessparameterset/search:
    get:
      operationId: SearchBusinessProcessParameters
      summary: Search for Business Process Parameters
      description: Searches for a specified business process parameter set
      parameters:
      - name: name
        in: query
        required: false
        schema:
          type: string
        description: The name.
      - name: business_process_catalog_id
        in: query
        required: false
        schema:
          type: string
        description: The business process type.
      - name: owner_id
        in: query
        required: false
        schema:
          type: string
        description: The owner ID.
      - name: site_id
        in: query
        required: false
        schema:
          type: string
        description: The site.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Limits the number of records to return.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of result entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessProcessParameterSearchCollection'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to view the resource.
        '404':
          description: Returned when the specified resource is not found.
