    OnlineDataHealthStatus:
      enum:
      - Matched
      - PossibleDuplicate
      - NewNamedGuest
      - NewConstituent
      - FormerPossibleDuplicate
      - ManuallyChanged
      type: string
      description: The possible states for a participant's online data health status.<p>Available values:</p><ul><li><i>Matched</i>
        - Indicates that a constituent from an online registration was matched to an existing constituent record.</li><li><i>PossibleDuplicate</i>
        - Indicates that a new constituent was created from online registrations because there were records that matched on
        name but not on contact information.</li><li><i>NewNamedGuest</i> - Indicates that a named guest record was created
        because the constituent was already registered as a participant, or there was not enough contact information from
        online registrations to create a constituent record.</li><li><i>NewConstituent</i> - Indicates the constituent record
        was created because the system didn't find existing records that matched constituent information from online registrations.</li><li><i>FormerPossibleDuplicate</i>
        - Indicates the possible duplicate has been resolved or the system determined there are no more possible duplicates.</li><li><i>ManuallyChanged</i>
        - Indicates the constituent from online registrations that was linked to the participant was manually changed by a
        user.</li></ul>
