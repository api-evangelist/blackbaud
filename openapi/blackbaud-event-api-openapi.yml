components:
  schemas:
    AdministrativeArea:
      type: object
      properties:
        id:
          type: string
          description: The record ID of the administrative area.
          nullable: true
        name:
          type: string
          description: The name of the administrative area.
          nullable: true
        short_description:
          type: string
          description: The short description of the administrative area.
          nullable: true
      additionalProperties: false
      description: Defines the data model used for an address' administrative area. E.g. state in the US.
    Attachment:
      required:
      - type
      type: object
      properties:
        id:
          type: string
          description: The immutable system record ID of the attachment.
          nullable: true
        parent_id:
          type: string
          description: The parent object's immutable system record ID.
          nullable: true
        file_size:
          type: integer
          description: The file size in bytes. For physical attachments only.
          format: int64
          nullable: true
        file_url:
          type: string
          description: The URL for the file. For physical attachments only. Contains a time-bound signature that limits access
            to 30 minutes.
          format: uri
          nullable: true
        content_type:
          type: string
          description: The content type. For physical attachments only.
          nullable: true
        thumbnail_uri:
          type: string
          description: The URL for a thumbnail. For physical attachments that are images only. Contains a time-bound signature
            that limits access to 30 minutes.
          format: uri
          nullable: true
        tags:
          type: array
          items:
            type: string
          description: 'The tags associated with the attachment. Tags supplement the attachment’s name and description and
            identify it based on how an organization categorizes attachments. Available values are the entries in the <b>Document
            Tags</b> table. Character limit: 100.'
          nullable: true
        date:
          type: string
          description: 'The date of the attachment. Uses <a href="https://tools.ietf.org/html/rfc3339">ISO-8601 format</a>:
            <i>1969-11-21</i>. This property defaults to the current date if not supplied.'
          format: date
        name:
          type: string
          description: 'The name of the attachment. Character limit: 150.'
          nullable: true
        url:
          type: string
          description: The URL for the attachment. This is required for link attachments but does not apply to physical attachments.
          nullable: true
        file_id:
          type: string
          description: 'The identifier of the file. Character limit: 36. For physical attachments only.'
          nullable: true
        file_name:
          type: string
          description: The file name. For physical attachments only.
          nullable: true
        type:
          $ref: '#/components/schemas/AttachmentType'
        thumbnail_id:
          type: string
          description: 'The identifier of the thumbnail. Character limit: 36. For physical attachments only.'
          nullable: true
      additionalProperties: false
      description: A link or a physical attachment for an event. Physical attachments are uploaded files such as images, PDFs,
        or Word documents that are saved locally or on the network. They are stored and managed in the system. Link attachments
        are links to files such as images, blog posts, or YouTube videos that are online or in a cloud storage account. They
        are stored and managed externally.
    AttachmentCollection:
      type: object
      properties:
        count:
          type: integer
          description: The total number of items in the collection before limit/offset.
          format: int32
        value:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
          description: The set of items included in the response. This may be a subset of the items in the collection.
          nullable: true
      additionalProperties: false
      description: All attachments for an event.
    AttachmentDocumentUpload:
      required:
      - file_name
      type: object
      properties:
        file_name:
          minLength: 1
          type: string
          description: The file name. For physical attachments only.
        upload_thumbnail:
          type: boolean
          description: Indicates that a thumbnail needs to be created.
          nullable: true
      additionalProperties: false
      description: 'An object that represents the physical attachment to upload.

        An attachment is information you save to a record, such as images, PDFs, or Word files.'
    AttachmentFileDefinition:
      type: object
      properties:
        file_id:
          type: string
          description: The identifier of the file.
          nullable: true
        file_upload_request:
          $ref: '#/components/schemas/AttachmentFileRequestMetadata'
        thumbnail_id:
          type: string
          description: The identifier of the thumbnail.
          nullable: true
        thumbnail_upload_request:
          $ref: '#/components/schemas/AttachmentFileRequestMetadata'
      additionalProperties: false
      description: Contains metadata for uploading a document and unique document identifier for physical attachments.
    AttachmentFileRequestMetadata:
      type: object
      properties:
        headers:
          type: array
          items:
            $ref: '#/components/schemas/Header'
          description: The headers to supply when making the request.
          nullable: true
        method:
          type: string
          description: The http method to use for the request.
          nullable: true
        url:
          type: string
          description: The url to use for the request.
          nullable: true
      additionalProperties: false
      description: 'The AttachmentFileRequestMetadata entity specifies metadata for requests to upload physical

        attachments, including the URL for files, headers and the HTTP method to use.'
    AttachmentTagCollection:
      type: object
      properties:
        count:
          type: integer
          description: The total number of items in the collection before limit/offset.
          format: int32
        value:
          type: array
          items:
            type: string
          description: The set of items included in the response. This may be a subset of the items in the collection.
          nullable: true
      additionalProperties: false
      description: Defines a collection of attachment tags.
    AttachmentType:
      enum:
      - Link
      - Physical
      type: string
      description: The attachment type.<p>Available values:</p><ul><li><i>Link</i> - Link attachments are links to files,
        such as images, blog posts, or YouTube videos, that are online or in a cloud storage account. They are stored and
        managed externally.</li><li><i>Physical</i> - Physical attachments are uploaded files, such as images, PDFs, or Word
        documents, that are saved locally or on the network. They are stored and managed in the system.</li></ul>
    BenefitCollection:
      type: object
      properties:
        count:
          type: integer
          description: The total number of items in the collection.
          format: int32
        benefits:
          type: array
          items:
            $ref: '#/components/schemas/BenefitsResponse'
          description: The set of benefits included in the response.
          nullable: true
      additionalProperties: false
      description: Defines a collection of benefits.
    BenefitsDetailsRequest:
      required:
      - benefit_id
      - parent_id
      type: object
      properties:
        parent_id:
          maximum: 2147483647
          minimum: 1
          type: integer
          description: Gets or sets the unique identifier for the parent entity.
          format: int32
        benefit_id:
          maximum: 2147483647
          minimum: 1
          type: integer
          description: Gets or sets the unique identifier for the benefit code table entry.
          format: int32
        benefits_id:
          type: integer
          description: Gets or sets the unique identifier for the parent benefit table BenefitsId.
          format: int32
        count:
          type: integer
          description: Gets or sets the quantity of benefits.
          format: int32
        unit_cost:
          type: number
          description: Gets or sets the cost per unit of the benefit.
          format: double
        total_benefit_value:
          type: number
          description: Gets or sets the total value of the benefit calculated from count and unit cost.
          format: double
        sent:
          $ref: '#/components/schemas/FuzzyDate'
        comments:
          type: string
          description: Gets or sets additional comments or notes about the benefit.
          nullable: true
        is_receipt_amount_update:
          type: boolean
          description: Gets or sets a value indicating whether this represents a receipt amount update.
          x-bb-suppressions:
          - parameter_property_name
        receipt_amount_update:
          type: boolean
          description: Gets or sets a value indicating whether this represents a receipt amount update.
      additionalProperties: false
      description: Represents a request model for benefit details, containing information about benefits associated with a
        parent including quantities, costs, and status.
    BenefitsResponse:
      type: object
      properties:
        benefits_id:
          type: integer
          description: Gets or sets the unique identifier for the benefit.
          format: int32
        parent_id:
          type: integer
          description: Gets or sets the unique identifier for the parent.
          format: int32
        benefit_id:
          type: integer
          description: Gets or sets the unique identifier for the benefit code table entry.
          format: int32
        description:
          type: string
          description: Gets or sets the description of the benefit.
          nullable: true
        count:
          type: integer
          description: Gets or sets the quantity of benefits.
          format: int32
        unit_cost:
          type: number
          description: Gets or sets the cost per unit of the benefit.
          format: double
        total_benefit_value:
          type: number
          description: Gets or sets the total value of the benefit calculated from count and unit cost.
          format: double
        sent:
          $ref: '#/components/schemas/FuzzyDate'
        comments:
          type: string
          description: Gets or sets additional comments or notes about the benefit.
          nullable: true
        sum_of_total_benefits:
          type: number
          description: Gets or sets sum of TotalBenefitValue for all benefits associated with the parent.
          format: double
        benefits_include_notes:
          type: boolean
          description: Gets or sets whether to include benefit notes in acknowledgment letters.
        benefits_notes:
          type: string
          description: Gets or sets the text of the benefit notes from the parent entity.
          nullable: true
      additionalProperties: false
      description: Represents the benefits associated with a parent, including benefit details, costs, and fulfillment information.
    ConstituentEventParticipation:
      type: object
