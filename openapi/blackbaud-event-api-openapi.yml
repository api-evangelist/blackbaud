  /v1/eventlist:
    get:
      operationId: GetEventList
      summary: Get event list
      description: Returns a paginated list of events.
      parameters:
      - name: name
        in: query
        required: false
        schema:
          type: string
        description: A filter for results that match the specified name.
      - name: lookup_id
        in: query
        required: false
        schema:
          type: string
        description: A filter for results that match the custom identifier for the event record.
      - name: category
        in: query
        required: false
        schema:
          type: string
        description: A filter for results that match the specified category.
      - name: event_id
        in: query
        required: false
        schema:
          type: string
        description: A filter for results that match the specified ID.
      - name: start_date_from
        in: query
        required: false
        schema:
          type: string
        description: 'A filter for results with an event start date between the specified start_date_from and start_date_to.
          Uses <a href="https://tools.ietf.org/html/rfc3339">ISO-8601 format</a>: <i>1969-11-21</i>.'
      - name: start_date_to
        in: query
        required: false
        schema:
          type: string
        description: 'A filter for results with an event start date between the specified start_date_from and start_date_to.
          Uses <a href="https://tools.ietf.org/html/rfc3339">ISO-8601 format</a>: <i>1969-11-21</i>.'
      - name: date_added
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for results created on or after the specified date. Includes an offset from UTC
          in <a href="https://tools.ietf.org/html/rfc3339">ISO-8601 format</a>: <i>1969-11-21T10:29:43-04:00</i>.'
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for results modified on or after the specified date. Includes an offset from UTC
          in <a href="https://tools.ietf.org/html/rfc3339">ISO-8601 format</a>: <i>1969-11-21T10:29:43-04:00</i>.'
      - name: fields
        in: query
        required: false
        schema:
          type: array
        description: Represents a list of fields to include on the returned records.  For example, "fields=id,lookup_id,name,start_date".
          The id field will always be returned.  See the sample response output for the full list of available fields.
      - name: sort
        in: query
        required: false
        schema:
          type: array
        description: Represents a list of fields to sort the results by.
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
        description: A filter to include or exclude inactive events.
      - name: group
        in: query
        required: false
        schema:
          type: string
        description: A filter for results that match the specified group.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to return. The default is 500. The maximum is 10,000.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection and count of filtered
            events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventListEntryCollection'
              example:
                count: 12
                value:
                - id: '1'
                  lookup_id: WALK
                  name: Walk-A-Thon
                  start_date: '2008-07-26'
                  start_time: '2026-09-15'
                  end_date: '2008-07-26'
                  end_time: '2026-09-15'
                  attending_count: 90
                  invited_count: 100
                  revenue: 100000
                  goal: 150000
                  percent_of_goal: 67
                  date_added: '2017-09-15T01:00:00Z'
                  date_modified: '2017-09-15T01:00:00Z'
                  capacity: 120
                  inactive: false
                  attended_count: 85
                  category:
                    id: '314'
                    name: Walk/Run Event
                    inactive: false
                  group:
                    id: '1505'
                    name: Walk-A-Thon for Relief
                    is_inactive: false
                  expenses: 1298
                  net: 431
                  location_name: Cobblestone House
                  payments_balance: 100
                - id: '2'
                  lookup_id: Playground
                  name: Playground Grand Opening Party
                  start_date: '2017-12-28'
                  start_time: '2026-09-15'
                  end_date: '2017-12-28'
                  end_time: '2026-09-15'
                  attending_count: 450
                  invited_count: 500
                  revenue: 500000
                  goal: 450000
                  percent_of_goal: 111
                  date_added: '2017-09-15T01:00:00Z'
                  date_modified: '2017-09-15T01:00:00Z'
                  capacity: 500
                  inactive: false
                  attended_count: 430
                  category:
                    id: '159'
                    name: Social
                    inactive: false
                  group:
                    id: '1505'
                    name: Walk-A-Thon for Relief
                    is_inactive: false
                  expenses: 1412
                  net: 9812
                  location_name: Cobblestone House
                  payments_balance: 200
        '400':
          description: Returned when the specified request parameters are not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1EventlistGet400ApplicationJsonResponse'
              example:
              - message: The request body is not in the appropriate format.
                error_name: BadRequest
                error_code: 400
                raw_message: The request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have rights to view the event records.
          content:
            application/json:
              schema:
