  /v1/events/{event_id}/participants:
    post:
      operationId: CreateParticipant
      summary: Create a participant
      description: 'Creates a new participant for an event.<br><br>Note: Host participants and standalone participants have
        the <b>Host</b> registrant type. To create a participant with the <b>Guest</b> registrant type, include a <i>host_id</i>.
        <ol>  <li>To create a <b>Host</b> participant, pass a <i>constituent_id</i> (must be a constituent record) and do
        not pass a <i>host_id</i>. </li>  <li>To create a <b>Guest</b> participant that will be linked to an existing record,
        pass a <i>constituent_id</i> (constituent or non-constituent record) and pass the participant ID of the <b>Host</b>
        as the <i>host_id</i>. </li>  <li>To create a <b>Guest</b> participant that will create a new non-constituent record,
        do not pass a <i>constituent_id</i> (a new unnamed guest will be created as a non-constituent) and pass the participant
        ID of the <b>Host</b> as the <i>host_id</i>. </li></ol>'
      parameters:
      - name: event_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the event.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateParticipant'
            example:
              constituent_id: '34'
              host_id: '181'
              rsvp_status: Attending
