openapi: 3.0.1
info:
  title: 'Blackbaud SKY API: Event'
  description: This API manages event information and related entities such as participant.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/event
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations,
      examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/event
paths:
  /v1/constituents/{constituent_id}/eventparticipation:
    get:
      operationId: GetConstituentEventParticipation
      summary: Get a constituent's event participation (PREVIEW)
      description: 'Returns a constituent''s event participation.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: constituent_id
        in: path
        required: true
        schema:
          type: string
        description: The constituent ID or contact ID of the participant, including non-constituent IDs.
      - name: search_text
        in: query
        required: false
        schema:
          type: string
        description: The text to use to search for the event name or participation level name.
      - name: start_date_from
        in: query
        required: false
        schema:
          type: string
        description: 'The beginning of the date range to filter event occurrences by. Uses <a href="https://tools.ietf.org/html/rfc3339">ISO-8601
          format</a>: <i>1969-11-21</i>.'
      - name: start_date_to
        in: query
        required: false
        schema:
          type: string
        description: 'The end of the date range to filter event occurrences by. Uses <a href="https://tools.ietf.org/html/rfc3339">ISO-8601
          format</a>: <i>1969-11-21</i>.'
      - name: invitation_status
        in: query
        required: false
        schema:
          type: array
        description: The invitation statuses to filter to.
      - name: rsvp_status
        in: query
        required: false
        schema:
          type: array
        description: The RSVP statuses to filter to.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to return. The default is 500. The maximum is 10,000.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified event participation
            entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstituentEventParticipationCollection'
              example:
                count: 15
                value:
                - participant_id: '48'
                  event_id: '6'
                  event_name: Volunteer Dinner
                  event_start_date: '2020-03-14'
                  event_end_date: '2020-03-15'
                  invitation_status: Invited
                  rsvp_status: Attending
                  attended: true
                  participation_level:
                    id: '1772'
                    name: Volunteer
                    is_inactive: false
                  total_registration_fees: 50
                  total_paid: 100
                - participant_id: '3524'
                  event_id: '8'
                  event_name: Walk-A-Thon
                  event_start_date: '2020-05-14'
                  invitation_status: NotApplicable
                  rsvp_status: Attending
                  attended: false
                  participation_level:
                    id: '1241'
                    name: Attendee
                    is_inactive: false
                  total_registration_fees: 0
                  total_paid: 0
        '400':
          description: Returned when the route does not contain a valid ID or the applied filters are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Constituents-constituent_id-EventparticipationGet400ApplicationJsonResponse'
              example:
              - message: The request body is not in the appropriate format.
                error_name: BadRequest
                error_code: 400
                raw_message: The request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have the rights to view the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Constituents-constituent_id-EventparticipationGet403ApplicationJsonResponse'
              example:
              - message: The user does not have the necessary permissions for this task.
                error_name: Forbidden
                error_code: 403
                raw_message: The user does not have the necessary permissions for this task.
        '404':
          description: Returned when the specified constituent is not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Constituents-constituent_id-EventparticipationGet404ApplicationJsonResponse'
              example:
              - message: The requested resource could not be found.
                error_name: ResourceNotFound
                error_code: 404
                raw_message: The requested resource could not be found.
  /v1/eventattachmenttags:
    get:
      operationId: GetEventAttachmentTags
      summary: Get event attachment tags
      description: Returns a list of available attachment tags.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the event attachment tags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentTagCollection'
              example:
                count: 7
                value:
                - Certificate
                - Document
                - Logo
                - PDF
                - Photo
                - Slideshow
                - Spreadsheet
        '403':
          description: Returned when the user does not have the rights to view event attachment tags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1EventattachmenttagsGet403ApplicationJsonResponse'
              example:
              - message: The user does not have the necessary permissions for this task.
                error_name: Forbidden
                error_code: 403
                raw_message: The user does not have the necessary permissions for this task.
  /v1/eventattachmentupload:
    post:
      operationId: CreateEventAttachmentUpload
      summary: Create an event attachment upload
      description: Creates a document upload location and unique document identifier for physical attachments. Use the returned
        url to upload a physical file for an attachment, then call the Create an event attachment endpoint. Maximum file size
        is 100MB.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentDocumentUpload'
            example:
              file_name: venue_photo.jpg
              upload_thumbnail: true
        description: An object that represents the document to upload.
      responses:
        '200':
          description: Returned when the operation successfully posts a document. The response body contains the properties
            of the posted document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentFileDefinition'
              example:
                file_id: e8ce3494-d961-4eef-9938-acf0a2d9a831
                file_upload_request:
                  headers:
                  - name: x-ms-blob-type
                    value: BlockBlob
                  - name: x-ms-version
                    value: '2015-12-11'
                  method: PUT
                  url: https://fil-pusa01.app.blackbaud.net/files/blobs/s21pusa01afilv2blkbsa01/files-private/8d6df4c4-d9ab-45d4-9369-46aa5748a235?sv=2024-11-04&st=2024-11-01T16%3A31%3A22Z&se=2024-11-01T17%3A01%3A27Z&sr=b&sp=rw&sig=vGujNuZ5hnW1I69g3rYVpelNWk0O1Ma3F9ElL3GnvZg%3D
                thumbnail_id: 5b181d20-9b5f-44ab-8e63-46d14424dfe5
                thumbnail_upload_request:
                  headers:
                  - name: x-ms-blob-type
                    value: BlockBlob
                  - name: x-ms-version
                    value: '2015-12-11'
                  method: PUT
                  url: https://fil-pusa01.app.blackbaud.net/files/blobs/s21pusa01afilv2blkbsa01/files-private/08baedaf-b384-4ab2-abc0-3a72a79d3a7a?sv=2024-11-04&st=2024-11-01T16%3A31%3A22Z&se=2024-11-01T17%3A01%3A27Z&sr=b&sp=rw&sig=Pp7Pb0XHTaMu7n4lnPV7bwXBgOBOT2GJExqHoDQEM5s%3D
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1EventattachmentuploadPost400ApplicationJsonResponse'
              example:
              - message: The request body is not in the appropriate format.
                error_name: BadRequest
                error_code: 400
                raw_message: The request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have the rights to create event attachment uploads.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1EventattachmentuploadPost403ApplicationJsonResponse'
              example:
              - message: The user does not have the necessary permissions for this task.
                error_name: Forbidden
                error_code: 403
                raw_message: The user does not have the necessary permissions for this task.
  /v1/eventcategories:
    post:
      operationId: CreateEventCategory
      summary: Create an event category
      description: Creates a new event category.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventCategory'
            example:
              name: Dinner
        description: An object that represents the event category to create.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the ID of the new event category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdResponse'
              example:
                id: '4343'
        '400':
          description: Returned when the specified request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1EventcategoriesPost400ApplicationJsonResponse'
              example:
              - message: The request body is not in the appropriate format.
                error_name: BadRequest
                error_code: 400
                raw_message: The request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to create the event category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1EventcategoriesPost403ApplicationJsonResponse'
              example:
              - message: The user does not have the necessary permissions for this task.
                error_name: Forbidden
                error_code: 403
                raw_message: The user does not have the necessary permissions for this task.
    get:
      operationId: GetEventCategories
      summary: Get event categories
      description: Returns a list of active event categories.
      parameters:
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
        description: Represents whether to include inactive entries.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of event categories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventCategoryCollection'
              example:
                count: 12
                value:
                - id: '1293'
                  name: Annual Fundraiser
                  inactive: false
                - id: '1179'
                  name: Golf Tournament
                  inactive: false
                - id: '2906'
                  name: Social
                  inactive: false
        '400':
          description: Returned when the request filters are improperly formatted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1EventcategoriesGet400ApplicationJsonResponse'
              example:
              - message: The request body is not in the appropriate format.
                error_name: BadRequest
                error_code: 400
                raw_message: The request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have rights to view event categories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1EventcategoriesGet403ApplicationJsonResponse'
              example:
              - message: The user does not have the necessary permissions for this task.
                error_name: Forbidden
                error_code: 403
                raw_message: The user does not have the necessary permissions for this task.
  /v1/eventcategories/{event_category_id}:
    delete:
      operationId: DeleteEventCategory
      summary: Delete an event category
      description: Deletes an event category.
      parameters:
      - name: event_category_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the event category.
      responses:
        '200':
          description: Returned when the operation successfully deletes an event category.
        '400':
          description: Returned when the specified event category ID is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Eventcategories-event_category_id-Delete400ApplicationJsonResponse'
              example:
              - message: The request body is not in the appropriate format.
                error_name: BadRequest
                error_code: 400
                raw_message: The request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to delete the event category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Eventcategories-event_category_id-Delete403ApplicationJsonResponse'
              example:
              - message: The user does not have the necessary permissions for this task.
                error_name: Forbidden
                error_code: 403
                raw_message: The user does not have the necessary permissions for this task.
    patch:
      operationId: EditEventCategory
      summary: Edit an event category
      description: Edits the details about an event category.
      parameters:
      - name: event_category_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the event category.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditEventCategory'
            example:
              name: Alumni Dinner
              inactive: false
        description: An object that represents the changes to the event category.
      responses:
        '200':
          description: Returned when the operation succeeds.
        '400':
          description: Returned when the specified request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Eventcategories-event_category_id-Patch400ApplicationJsonResponse'
              example:
              - message: The request body is not in the appropriate format.
                error_name: BadRequest
                error_code: 400
                raw_message: The request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to edit the event category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Eventcategories-event_category_id-Patch403ApplicationJsonResponse'
              example:
              - message: The user does not have the necessary permissions for this task.
                error_name: Forbidden
                error_code: 403
                raw_message: The user does not have the necessary permissions for this task.
        '404':
          description: Returned when the specified event category is not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Eventcategories-event_category_id-Patch404ApplicationJsonResponse'
              example:
              - message: The requested resource could not be found.
                error_name: ResourceNotFound
                error_code: 404
                raw_message: The requested resource could not be found.
