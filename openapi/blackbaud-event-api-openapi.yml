          type: boolean
        description: A filter to include or exclude participants based on whether they have a primary email address that's
          not marked Do not email.
      - name: phone_call_eligible_filter
        in: query
        required: false
        schema:
          type: boolean
        description: A filter to include or exclude participants based on whether they have a primary phone number that's
          not marked Do not call.
      - name: invitation_status
        in: query
        required: false
        schema:
          type: array
        description: 'A filter for results that match the specified invitation status.

          For example, <i>invitation_status=NotInvited</i> returns participants with a status of <i>Not Invited</i>.<br/><br/>Available
          values:<ul><li>NotApplicable</li><li>NotInvited</li><li>Invited</li></ul>'
      - name: rsvp_status
        in: query
        required: false
        schema:
          type: array
        description: 'A filter for results that match the specified RSVP status.

          For example, <i>rsvp_status=Attending,NotApplicable</i> returns participants with a status of <i>Attending</i> or
          <i>Not Applicable</i>.<br/><br/>Available values:<ul><li>NoResponse</li><li>Attending</li><li>Declined</li><li>Interested</li><li>Canceled</li><li>Waitlisted</li><li>NotApplicable</li></ul>'
      - name: date_added
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for results created on or after the specified date. Includes an offset from UTC
          in <a href="https://tools.ietf.org/html/rfc3339">ISO-8601 format</a>: <i>1969-11-21T10:29:43-04:00</i>.'
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for results modified on or after the specified date. Includes an offset from UTC
          in <a href="https://tools.ietf.org/html/rfc3339">ISO-8601 format</a>: <i>1969-11-21T10:29:43-04:00</i>.'
      - name: fees_paid_filter
        in: query
        required: false
        schema:
          type: boolean
        description: A filter to include or exclude participants that have paid or not paid their fees.
      - name: fields
        in: query
        required: false
        schema:
          type: array
        description: 'Represents a list of fields to include on the returned records. Supported request fields include: <i>id,
          constituent_id, name, phone, email, participation_level, attended, rsvp_status, invitation_status, rsvp_date, total_fees,
          total_paid, host, guests, name_tag, seat, seating_notes, seating_group, memberships, lookup_id, is_constituent,
          summary_note, date_added, date_modified, donations, revenue, participant_options, registration_form, online_data_health,
          fees. </i> See the sample response output for all the return fields.'
      - name: sort
        in: query
        required: false
        schema:
          type: array
        description: 'Represents a list of fields to sort the results by.

          Returns a list that sorts participants based on the supplied fields. Results are in ascending order by default,
          and a ''-'' sign denotes descending order.

          For example, <i>sort=invitation_status,-name</i> sorts participants by the <i>invitation_status</i> field in ascending
          order and then by the <i>name</i> field in descending order.

          If no fields are provided, results are sorted by participant last name in ascending order.'
      - name: participant_option_id
        in: query
        required: false
        schema:
          type: string
        description: A filter for participants who are assigned to a specific participant option.
      - name: participant_option_values
        in: query
        required: false
        schema:
          type: array
        description: A filter for results that match values for a specific participant option. For example, <i>participant_option_values=true</i>
          returns participants who selected <i>true</i> if you also include the <i>participant_option_id</i> for a boolean
          type option in the request. If you include a <i>participant_option_id</i> for a list type option, include the ID
          for the value to return. For example, <i>participant_option_values=1476f7ea-816e-4a97-9f33-b99a5acb26cd</i> returns
          participants who selected the value associated with id <i>1476f7ea-816e-4a97-9f33-b99a5acb26cd</i>.
      - name: registration_form_include_type
        in: query
        required: false
        schema:
          type: string
          enum:
          - Any
          - Specific
          - None
        description: A filter for participants who are registered through online registration forms. For example, <i>registration_form_include_type=Specific</i>
          returns participants who registered for forms you indicate in the <i>registration_form_ids</i> filter.<p>Available
          values:</p><ul><li><i>Any</i> - Filters for participants from any online registration form.</li><li><i>Specific</i>
          - Filters for participants from specific online registration forms.</li><li><i>None</i> - Filters for participants
          that were not created from an online registration form.</li></ul>
      - name: registration_form_ids
        in: query
        required: false
        schema:
          type: array
        description: A filter for participants who registered through specific online registration forms.
      - name: online_data_health
        in: query
        required: false
        schema:
          type: array
        description: A filter for results that match the specified online data health statuses. For example, <i>online_data_health=PossibleDuplicate,Matched</i>
          returns participants with a status of <i>Possible Duplicate</i> or <i>Matched</i>.<br/><br/>Available values:<ul><li>Matched</li><li>PossibleDuplicate</li><li>NewNamedGuest</li><li>NewConstituent</li><li>FormerPossibleDuplicate</li><li>ManuallyChanged</li></ul>
      - name: event_fee_include_type
        in: query
        required: false
        schema:
          type: string
          enum:
          - Any
          - Specific
          - None
        description: A filter for participants who have event fees. For example, <i>event_fee_include_type_filter=Specific</i>
          returns participants who have event fees you indicate in the <i>event_fee_ids_filter</i> filter.<p>Available values:</p><ul><li><i>Any</i>
          - Filters for participants with any fee</li><li><i>Specific</i> - Filters for participants with specific fees.</li><li><i>None</i>
          - Filters for participants with no fees.</li></ul>
      - name: event_fee_ids
        in: query
        required: false
        schema:
          type: array
        description: A filter for participants who have specific event fees.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to return. The default is 500. The maximum is 10,000.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip.
