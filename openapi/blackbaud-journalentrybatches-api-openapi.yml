openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: General Ledger Journalentrybatches API'
  description: This API is used to manage the general ledger, including accounts, projects, and journal entries. This API has a maximum request size limit of 8mb.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/56eb17a0a9db9516c46bff6f
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/generalledger/v1
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Journalentrybatches
paths:
  /journalentrybatches:
    post:
      operationId: CreateJournalEntryBatch
      summary: Journal entry batch (Create) (Deprecated)
      description: This endpoint has been deprecated. While it remains available for existing integrations, it is no longer supported and will not receive updates or enhancements. To improve performance and reliability, this endpoint has been replaced by CreateJournalEntryBatchProcess.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJournalEntryBatch'
            example:
              description: New Batch
              batch_status: Open
              create_interfund_sets: true
              create_bank_account_adjustments: true
              journal_entries:
              - type_code: Debit
                account_number: 01-1000-00
                post_date: '2018-07-02T00:00:00Z'
                encumbrance: Regular
                reverse_date: '2020-04-03T00:00:00Z'
                journal: Journal Entry
                reference: Debit reference
                amount: 10
                notes: New Note
                tax_entity_id: 427
                distributions:
                - ui_project_id: '1100'
                  account_class: Unrestricted Net Assets
                  transaction_code_values:
                  - name: Grants
                    value: None
                    id: 0
                  amount: 10
                  percent: 100
              - type_code: Credit
                account_number: 01-1000-00
                post_date: '2018-07-02T00:00:00Z'
                encumbrance: Regular
                reverse_date: '2020-04-03T00:00:00Z'
                journal: Journal Entry
                reference: Credit reference
                amount: 10
                notes: Credit Note
                tax_entity_id: 427
                distributions:
                - ui_project_id: '1100'
                  account_class: Unrestricted Net Assets
                  transaction_code_values:
                  - name: Grants
                    value: None
                    id: 0
                  amount: 10
                  percent: 100
                custom_fields:
                - field_name: Unique Auth Text
                  value: My text
                  comments: a comment
                  date: '2018-07-02T00:00:00Z'
        description: The journal entry batch to add.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the identifier of the created batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedResult_Int32'
              example:
                record_id: 843
        '400':
          description: Returned when the request is not in the correct format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Invalid Request
                Details:
                - The value 'fake' is not valid for transaction_status.
                ErrorPath: null
        '403':
          description: Returned when the user does not have permission to view journal entry batches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Journalentrybatches
    get:
      operationId: ListJournalEntryBatches
      summary: Journal entry batch (List)
      description: Returned when the operation is successful. The response body contains a list of journal entry batch summaries. However, journal_entries values are always empty.
      parameters:
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: 'Represents the number of records to skip.

          For use with pagination.'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: "Represents the number of records to return. \nThe default is 100. \nThe maximum allowed value is 500."
      - name: status
        in: query
        required: false
        schema:
          type: string
        description: The batch status.
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: Returns modified records based on or after a specified date.
      - name: search_text
        in: query
        required: false
        schema:
          type: string
        description: Text to match. Can match ui_batch_id or description. A blank search will match all journal entry batches.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains list of journal entry batches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection_JournalEntryBatch'
              example:
                count: 1632
                value:
                - batch_id: 2239
                  ui_batch_id: '1632'
                  description: Etap JE Import
                  batch_status: Open
                  create_interfund_sets: true
                  create_bank_account_adjustments: true
                  date_added: '2018-07-03T14:24:03.493Z'
                  added_by: James Bradley
                  date_modified: '2018-07-03T14:24:03.73Z'
                  modified_by: James Bradley
                - batch_id: 2238
                  ui_batch_id: '1631'
                  description: Test-SwordKnight
                  batch_status: Open
                  create_interfund_sets: false
                  create_bank_account_adjustments: false
                  date_added: '2018-07-02T15:53:55.083Z'
                  added_by: Stacy Carlos
                  date_modified: '2018-07-02T15:53:55.083Z'
                  modified_by: Stacy Carlos
        '400':
          description: Returned when the request is not in the correct format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Invalid Request
                Details:
                - The value 'fake' is not valid for transaction_status.
                ErrorPath: null
        '403':
          description: Returned when the user does not have permission to view journal entry batches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Journalentrybatches
  /journalentrybatches/attachments:
    post:
      operationId: CreateJournalEntryBatchAttachment
      summary: Journal entry batch attachment (Create)
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAttachment'
            example:
              parent_id: 1
              name: Attachment Name
              url: https://www.google.com
              type: Link
              media_type: Manual
          multipart/form-data: {}
        description: The attachment to create.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the file id of the saved attachment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedResult_Int32'
              example:
                record_id: 843
        '400':
          description: Returned when the request is not in the correct format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Invalid Request
                Details:
                - The value 'fake' is not valid for transaction_status.
                ErrorPath: null
        '403':
          description: Returned when the user does not have permission to add attachments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
        '404':
          description: Returned when no journal entry batch is found with the specified ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Journalentrybatches
  /journalentrybatches/customfields:
    get:
      operationId: ListJournalEntryCustomFields
      summary: Journal entry custom field (List)
      description: Returns a list of custom field options.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the list of custom fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedResponse_CustomFieldOptions'
              example:
                count: 6
                results:
                - custom_field_id: 4
                  name: 'Reference Account #'
                  type: Number
                  is_required: false
                  table_values:
                  - Test user 1
                - custom_field_id: 5
                  name: Budget Manager
                  type: Table
                  is_required: false
                  table_values:
                  - Bill Smith
                  - David Kilmer
                - custom_field_id: 10
                  name: Accountability Grouping
                  type: Table
                  is_required: false
                  table_values:
                  - Education
                  - Food
                  - Adminstrative Costs
                  - Shelter
                  - Supplies
      tags:
      - Journalentrybatches
  /journalentrybatches/process:
    post:
      operationId: CreateJournalEntryBatchProcess
      summary: Journal entry batch process (Create)
      description: Returns the process id of the request to create a new journal entry batch.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJournalEntryBatchProcess'
            example:
              description: New Batch
              batch_status: Open
              create_interfund_sets: true
              create_bank_account_adjustments: true
              journal_entries:
              - type_code: Debit
                account_number: 01-1000-00
                post_date: '2018-07-02T00:00:00Z'
                encumbrance: Regular
                reverse_date: '2020-04-03T00:00:00Z'
                journal: Journal Entry
                reference: Debit reference
                amount: 10
                notes: New Note
                tax_entity_id: 427
                distributions:
                - ui_project_id: '1100'
                  account_class: Unrestricted Net Assets
                  transaction_code_values:
                  - name: Grants
                    value: None
                    id: 0
                  amount: 10
                  percent: 100
              - type_code: Credit
                account_number: 01-1000-00
                post_date: '2018-07-02T00:00:00Z'
                encumbrance: Regular
                reverse_date: '2020-04-03T00:00:00Z'
                journal: Journal Entry
                reference: Credit reference
                amount: 10
                notes: Credit Note
                tax_entity_id: 427
                distributions:
                - ui_project_id: '1100'
                  account_class: Unrestricted Net Assets
                  transaction_code_values:
                  - name: Grants
                    value: None
                    id: 0
                  amount: 10
                  percent: 100
                custom_fields:
                - field_name: Unique Auth Text
                  value: My text
                  comments: a comment
                  date: '2018-07-02T00:00:00Z'
        description: The process request to create a journal entry batch.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains the process id of the request to create a new journal entry batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntryBatchProcessDetails'
              example:
                process_id: 843
        '400':
          description: Returned when the request is not in the correct format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Invalid Request
                Details:
                - The value 'fake' is not valid for transaction_status.
                ErrorPath: null
        '403':
          description: Returned when the user does not have permission to create an journal entry batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Journalentrybatches
  /journalentrybatches/{batch_id}:
    delete:
      operationId: DeleteJournalEntryBatch
      summary: Journal entry batch (Delete)
      description: Removes a journal entry batch.
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: integer
        description: The identifier of the journal entry batch to delete.
      responses:
        '200':
          description: Returned when the operation is successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Void'
              example: {}
        '400':
          description: Returned when specified batch cannot be deleted in its current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Invalid Request
                Details:
                - The value 'fake' is not valid for transaction_status.
                ErrorPath: null
        '403':
          description: Returned when the user does not have permission to remove journal entry batches, the batch has been posted, or the batch has already been deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
        '404':
          description: Returned when no journal entry batch is found with the specified ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Journalentrybatches
    patch:
      operationId: EditJournalEntryBatch
      summary: Journal entry batch (Edit)
      description: Returns the identifier of the edited batch
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: integer
        description: The identifier for journal entry batch to edit
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditJournalEntryBatch'
            example:
              description: edited description
              create_interfund_sets: false
              create_bank_account_adjustments: true
              batch_status: Approved
        description: The changes for the journal entry batch
      responses:
        '200':
          description: Returned when the operation successfully edits the journal entry batch. The response body contains the journal entry batch id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedResult_Int32'
              example:
                record_id: 843
        '400':
          description: Returned when the specified journal entry batch ID in the request URL body or the specified request parameters are not in the appropriate format, or the specified journal entry batch is already posted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomainErrorMessage'
              example:
                Error: Invalid Request
                Details:
                - The value 'fake' is not valid for transaction_status.
                ErrorPath: null
        '403':
          description: Returned when the user does not have permission to edit the journal entry batch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
        '404':
          description: Returned when the specified journal entry batch is not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Journalentrybatches
    get:
      operationId: GetJournalEntryBatch
      summary: Journal entry batch (Get)
      description: Returns the journal entry batch details. This endpoint is deprecated and is only suitable for batches with a low volume of journal entries. For more options getting journal entry batch information use the Journal entry batch summary (Get) and Journal entries (List) endpoints instead.
