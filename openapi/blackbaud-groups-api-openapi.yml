openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: CSRconnect Groups API'
  description: This API is for YourCause CSRconnect from Blackbaud.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/csr-connect
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/csr-connect
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Groups
paths:
  /v1/groups/programs:
    get:
      operationId: ListGroupPrograms
      summary: Get group programs (PREVIEW)
      description: 'Returns all of the group programs configured by the client. In addition to the general details about the group program, the payload contains the following:


        group_creators indicates which employees are allowed to create a group within the specific program. A value of "1" indicates that only super admins can create group pages and a value of "2" indicates that any employee can create a page for the program.


        group_membership_type defines the method of "join" for all pages in the program. A value of "1" indicates that all group pages in the program are closed and require a request to join that must be approved by the group administrator. A value of "2" indicates that all group pages are open and can be freely joined without approval. A value of "3" indicates that the creator of each group determines at the time of page creation whether the group is open or closed.


        group_members_privacy_type defines the user privacy setting for each group in the program. A value of "1" indicates that all groups are private and the group page will not show a list of members. A value of "2" indicates that all group pages are public and display a list of members. When a group page is public, each user may opt out of being shown in the member list.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      responses:
        '400':
          description: Returned when the specified request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: The request was invalid or missing required parameters.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: Authentication credentials were missing or invalid.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Forbidden
                status: 403
                detail: You do not have permission to access this resource.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: The requested resource could not be found.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of group programs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupProgramsResponse'
              example:
                group_programs:
                - id: a3f1e2d4-bc09-4e5f-9a87-1234567890ab
                  affiliate_id: 200
                  name: Employee Resource Groups
                  call_to_action: Find your community
                  summary: Connect with colleagues who share your interests.
                  group_creators:
                  - 2
                  group_membership_type: 2
                  group_members_privacy_type: 2
                  featured_group_ids:
                  - 101
                  - 102
                  tags:
                  - name: Region
                    options:
                    - North America
                    - EMEA
                  image_url: https://example.com/images/program.png
                  show_disclaimer: true
                  disclaimer_text: By joining you agree to the group guidelines.
                  total_groups: 12
                  total_group_members: 480
      tags:
      - Groups
  /v1/groups/programs/{group_program_id}/search:
    post:
      operationId: SearchGroups
      summary: Search groups (PREVIEW)
      description: 'Searches for a group page within a specific group program. Use the group programs endpoint to obtain the group_program_id.


        In the body of the request, provide the term, page, and limit. term is the string the API uses to search the group page name. page is the page of paginated results to pull. limit is the number of results per page, capped at 25.


        include_virtual is optional. When true, groups with no defined location are included. The default value is false.


        To search by location, use the optional distance_in_miles, latitude, and longitude params. Passing a latitude and longitude returns groups within a 50 mile radius by default; use distance_in_miles to change the radius.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: group_program_id
        in: path
        required: true
        schema:
          type: string
        description: The unique identifier of the group program to search within.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupSearchRequest'
            example:
              term: volunteers
              page: 1
              limit: 10
              include_virtual: false
              distance_in_miles: 50
              latitude: 33.759
              longitude: -84.387
        description: The request body containing the search criteria.
      responses:
        '400':
          description: Returned when the specified request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: The request was invalid or missing required parameters.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: Authentication credentials were missing or invalid.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Forbidden
                status: 403
                detail: You do not have permission to access this resource.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: The requested resource could not be found.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '200':
          description: Returned when the operation succeeds. The response body contains a paginated collection of groups.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupSearchResponse'
              example:
                page: 1
                limit: 10
                page_count: 3
                total_count: 25
                groups:
                - group_id: 101
                  creator_affiliate_employee_id: 5001
                  name: Atlanta Volunteers
                  description: A group for Atlanta-based volunteers.
                  image_url: https://example.com/images/group.png
                  address1: 285 Peachtree Center Ave NE
                  city: Atlanta
                  state: GA
                  postal_code: '30303'
                  latitude: 33.759
                  longitude: -84.387
                  membership_type: 2
                  open: true
                  tags: volunteer,community
      tags:
      - Groups
  /v1/groups/{group_id}:
    get:
      operationId: GetGroupDetails
      summary: Get group information (PREVIEW)
      description: 'Returns an object containing all the primary details for a Groups page in CSRconnect. The group_id is the unique identifier of the group page. This ID can be obtained by searching a group program.


        membership_type defines the method of "join" for all pages in the program. A value of "1" indicates that all group pages in the program are closed and require a request to join that must be approved by the group administrator. A value of "2" indicates that all group pages in the program are open and can be freely joined without approval. A value of "3" indicates that the creator of each group determines at the time of page creation whether the group is open or closed.


        open indicates the membership choice when membership_type is "3". If true, the creator made the page open and any employee can join. If false, the creator made the page closed and employees must request to join. For membership_type values "1" or "2", the value reflects that closed or open setting.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: integer
        description: The unique identifier of the group page.
      responses:
        '400':
          description: Returned when the specified request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: The request was invalid or missing required parameters.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: Authentication credentials were missing or invalid.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Forbidden
                status: 403
                detail: You do not have permission to access this resource.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '404':
          description: Returned when the specified group is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: The requested resource could not be found.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '200':
          description: Returned when the operation succeeds. The response body contains the group details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupDetailsResponse'
              example:
                group_id: 101
                creator_affiliate_employee_id: 5001
                name: Atlanta Volunteers
                description: A group for Atlanta-based volunteers.
                image_url: https://example.com/images/group.png
                address1: 285 Peachtree Center Ave NE
                address2: Suite 100
                city: Atlanta
                state: GA
                postal_code: '30303'
                latitude: 33.759
                longitude: -84.387
                membership_type: 2
                open: true
                tags: volunteer,community
                date_added: '2024-01-15T12:00:00Z'
                group_program_id: a3f1e2d4-bc09-4e5f-9a87-1234567890ab
                total_members: 42
      tags:
      - Groups
  /v1/groups/{group_id}/join:
    post:
      operationId: AssignEmployeeToGroup
      summary: Assign an employee to a group (PREVIEW)
      description: 'Assigns an employee to a group page. In the body of the request you pass the following:


        affiliate_employee_id is the ID of the employee you are assigning to the group page.


        If the group program has a disclaimer and disclaimer text, accepted_disclaimer indicates that the employee has accepted that disclaimer.


        send_me_email_notifications indicates a user decision to accept email communications from the administrator of the group page.


        show_membership indicates a user decision to have their name shown as a member on the group page for other group members to see.


        The response success value is false when the employee is already a member, or when the group program requires a disclaimer that was not accepted.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: integer
        description: The unique identifier of the group to join.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinGroupRequest'
            example:
              affiliate_employee_id: 5001
              accepted_disclaimer: true
              send_me_email_notifications: true
              show_membership: true
        description: The request body containing the employee and their membership preferences.
      responses:
        '400':
          description: Returned when the specified request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: The request was invalid or missing required parameters.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: Authentication credentials were missing or invalid.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Forbidden
                status: 403
                detail: You do not have permission to access this resource.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: The requested resource could not be found.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '200':
          description: Returned when the operation completes. The response body indicates whether the employee was assigned to the group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinGroupResponse'
              example:
                success: true
      tags:
      - Groups
  /v1/groups/{group_id}/members/{affiliate_employee_id}:
    delete:
      operationId: DeleteGroupMember
      summary: Remove an employee from a group (PREVIEW)
