components:
  schemas:
    GroupDetailsResponse:
      type: object
      properties:
        group_id:
          type: integer
          description: The unique identifier of the group page.
          format: int32
        creator_affiliate_employee_id:
          type: integer
          description: The affiliate employee ID of the employee who created the group.
          format: int32
        name:
          type:
          - string
          - 'null'
          description: The name of the group.
        description:
          type:
          - string
          - 'null'
          description: The description of the group.
        image_url:
          type:
          - string
          - 'null'
          description: The URL of the group's image.
        address1:
          type:
          - string
          - 'null'
          description: The first line of the group's address.
        address2:
          type:
          - string
          - 'null'
          description: The second line of the group's address.
        city:
          type:
          - string
          - 'null'
          description: The city of the group's address.
        state:
          type:
          - string
          - 'null'
          description: The state or province of the group's address.
        postal_code:
          type:
          - string
          - 'null'
          description: The postal or ZIP code of the group's address.
        latitude:
          type:
          - number
          - 'null'
          description: The latitude of the group's location.
          format: double
        longitude:
          type:
          - number
          - 'null'
          description: The longitude of the group's location.
          format: double
        membership_type:
          type:
          - integer
          - 'null'
          description: 'The membership type for the group. Available values: 1 – closed (requires approval to join);

            2 – open (freely joinable); 3 – determined per group by its creator.'
          format: int32
        open:
          type: boolean
          description: 'Indicates whether the group can be joined freely. When false,

            employees must request to join and be approved by the group administrator.'
        tags:
          type:
          - string
          - 'null'
          description: The tags associated with the group.
        date_added:
          type: string
          description: The date and time the group was added to the system.
          format: date-time
        group_program_id:
          type:
          - string
          - 'null'
          description: The unique identifier of the group program the group belongs to.
        total_members:
          type: integer
          description: The total number of members in the group.
          format: int32
      additionalProperties: false
      description: Represents the primary details of a group page in CSRconnect.
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
          description: A URI reference (RFC 3986) that identifies the problem type. When dereferenced, it should provide human-readable documentation for the problem. Defaults to "about:blank" when not present.<br/><br/>Available values:<table><tr><th>type</th><th>detail</th></tr><tr><td>about:blank</td><td>Type is not defined</td></tr></table>
        title:
          type:
          - string
          - 'null'
          description: A short, human-readable summary of the problem type.
        status:
          type:
          - integer
          - 'null'
          description: The HTTP status code for this occurrence of the problem.
          format: int32
        detail:
          type:
          - string
          - 'null'
          description: A human-readable explanation specific to this occurrence of the problem.
        instance:
          type:
          - string
          - 'null'
          description: A URI reference that identifies the specific occurrence of the problem. It may or may not yield further information if dereferenced.
        trace_id:
          type: string
          description: A request ID that can be provided to Blackbaud Support that may help with further troubleshooting.
        span_id:
          type: string
          description: A request ID that can be provided to Blackbaud Support that may help with further troubleshooting.
      additionalProperties: {}
      description: A machine-readable format for specifying errors in HTTP API responses based on https://tools.ietf.org/html/rfc7807.
    GroupSummaryResponse:
      type: object
      properties:
        group_id:
          type: integer
          description: The unique identifier of the group page.
          format: int32
        creator_affiliate_employee_id:
          type: integer
          description: The affiliate employee ID of the employee who created the group.
          format: int32
        name:
          type:
          - string
          - 'null'
          description: The name of the group.
        description:
          type:
          - string
          - 'null'
          description: The description of the group.
        image_url:
          type:
          - string
          - 'null'
          description: The URL of the group's image.
        address1:
          type:
          - string
          - 'null'
          description: The first line of the group's address.
        address2:
          type:
          - string
          - 'null'
          description: The second line of the group's address.
        city:
          type:
          - string
          - 'null'
          description: The city of the group's address.
        state:
          type:
          - string
          - 'null'
          description: The state or province of the group's address.
        postal_code:
          type:
          - string
          - 'null'
          description: The postal or ZIP code of the group's address.
        latitude:
          type:
          - number
          - 'null'
          description: The latitude of the group's location.
          format: double
        longitude:
          type:
          - number
          - 'null'
          description: The longitude of the group's location.
          format: double
        membership_type:
          type:
          - integer
          - 'null'
          description: 'The membership type for the group. Available values: 1 – closed (requires approval to join);

            2 – open (freely joinable); 3 – determined per group by its creator.'
          format: int32
        open:
          type: boolean
          description: 'Indicates whether the group can be joined freely. When false, employees must

            request to join and be approved by the group administrator.'
        tags:
          type:
          - string
          - 'null'
          description: The tags associated with the group.
      additionalProperties: false
      description: Represents a group returned in a group search.
    GroupSearchRequest:
      required:
      - term
      type: object
      properties:
        term:
          type:
          - string
          - 'null'
          description: The term used to search for groups by name.
        page:
          type: integer
          description: The number of the result's page to return.
          format: int32
        limit:
          maximum: 25
          minimum: 1
          type: integer
          description: The maximum number of groups to return per page. Maximum value is 25.
          format: int32
          default: 10
        include_virtual:
          type: boolean
          description: When true, groups with no defined location are included in the results. Defaults to false.
        distance_in_miles:
          type:
          - number
          - 'null'
          description: 'The search radius in miles when searching by location. Requires latitude and longitude, and

            defaults to 50 miles when a location is provided without a radius.'
          format: double
        latitude:
          maximum: 90
          minimum: -90
          type:
          - number
          - 'null'
          description: The latitude to search from. Must be provided together with longitude.
          format: double
        longitude:
          maximum: 180
          minimum: -180
          type:
          - number
          - 'null'
          description: The longitude to search from. Must be provided together with latitude.
          format: double
      additionalProperties: false
      description: Represents the request parameters for searching groups within a group program.
    GroupProgramsResponse:
      type: object
      properties:
        group_programs:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/GroupProgramResponse'
          description: The list of group programs.
      additionalProperties: false
      description: Represents the response containing the group programs configured for the affiliate.
    JoinGroupRequest:
      required:
      - affiliate_employee_id
      type: object
      properties:
        affiliate_employee_id:
          type: integer
          description: The employee ID from the affiliate's system for the employee joining the group.
          format: int32
        accepted_disclaimer:
          type: boolean
          description: 'Indicates that the employee has accepted the group program''s disclaimer. Required only when the

            group program has disclaimer text configured.'
        send_me_email_notifications:
          type: boolean
          description: Indicates the employee's decision to accept email communications from the group administrator.
        show_membership:
          type: boolean
          description: 'Indicates the employee''s decision to have their name shown as a member on the group page for

            other group members to see.'
      additionalProperties: false
      description: Represents the request body for assigning an employee to a group.
    GroupTagResponse:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          description: The name of the tag.
        options:
          type:
          - array
          - 'null'
          items:
            type: string
          description: The available options for the tag.
      additionalProperties: false
      description: Represents a tag configured for a group program.
    JoinGroupResponse:
      type: object
      properties:
        success:
          type: boolean
          description: 'Indicates whether the employee was successfully assigned to the group. false

            when the employee is already a member, or the group program requires a disclaimer that was not accepted.'
      additionalProperties: false
      description: Represents the outcome of a request to assign an employee to a group.
    GroupSearchResponse:
      type: object
      properties:
        page:
          type: integer
          description: The current page number of the search results.
          format: int32
        limit:
          type: integer
          description: The number of groups returned per page.
          format: int32
        page_count:
          type: integer
          description: The total number of pages in the search results.
          format: int64
        total_count:
          type: integer
          description: The total number of groups matching the search criteria.
          format: int64
        groups:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/GroupSummaryResponse'
          description: The list of groups returned for the current page.
        continuation_token:
          type:
          - string
          - 'null'
          description: 'A token to retrieve the next page of results. Currently always null as the upstream API does

            not support cursor-based pagination.'
      additionalProperties: false
      description: Represents the paginated results of a group search within a group program.
    GroupProgramResponse:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          description: The unique identifier of the group program.
        affiliate_id:
          type: integer
          description: The affiliate ID the group program belongs to.
          format: int32
        name:
          type:
          - string
          - 'null'
          description: The name of the group program.
        call_to_action:
          type:
          - string
          - 'null'
          description: The call to action displayed for the group program.
        summary:
          type:
          - string
          - 'null'
          description: A short summary of the group program.
        group_creators:
          type:
          - array
          - 'null'
          items:
            type: integer
            format: int32
          description: 'Identifies which employees may create a group within the program. 1 – only super admins;

            2 – any employee.'
        group_membership_type:
          type: integer
          description: 'The method of joining for all pages in the program. 1 – closed (requires approval); 2 – open

            (freely joinable); 3 – determined per group by its creator.'
          format: int32
        group_members_privacy_type:
          type: integer
          description: 'The member privacy setting for each group in the program. 1 – private (member list hidden);

            2 – public (member list visible, members may opt out).'
          format: int32
        featured_group_ids:
          type:
          - array
          - 'null'
          items:
            type: integer
            format: int32
          description: The IDs of the groups featured within the program.
        tags:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/GroupTagResponse'
          description: The tags configured for the group program.
        image_url:
          type:
          - string
          - 'null'
          description: The URL of the group program's image.
        show_disclaimer:
          type: boolean
          description: Indicates whether a disclaimer is shown when joining a group in this program.
        disclaimer_text:
          type:
          - string
          - 'null'
          description: The disclaimer text shown when joining a group in this program.
        total_groups:
          type: integer
          description: The total number of groups in the program.
          format: int32
        total_group_members:
          type: integer
          description: The total number of members across all groups in the program.
          format: int32
      additionalProperties: false
      description: Represents a single group program.
    LeaveGroupResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Indicates whether the employee was successfully removed from the group.
      additionalProperties: false
      description: Represents the outcome of a request to remove an employee from a group.
  securitySchemes:
    Bb-Api-Subscription-Key:
      type: apiKey
      name: Bb-Api-Subscription-Key
      in: header
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://app.blackbaud.com/oauth/authorize
          tokenUrl: https://oauth2.sky.blackbaud.com/token
          scopes: {}
