openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: School Dorms API'
  description: This API is used to provide access to school information such as users, academics, admissions, athletics, content, lists, and general school info.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/school
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/school
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Dorms
paths:
  /v1/dorms/all:
    get:
      operationId: V1DormsAllGet
      summary: Dorms by school level
      description: 'Requires at least one of the following roles in the Education Management system:


        Dorm Group Manager


        Dorm Supervisor


        Pending Dorm Supervisor'
      parameters:
      - name: level_number
        in: query
        required: true
        schema:
          type: integer
        description: Identifier for the school level.
      - name: school_year
        in: query
        required: false
        schema:
          type: string
        description: Identifier for the school year (Defaults to current school year).
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
          default: 'false'
        description: Identifier whether to include inactive dorms.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DormCollection'
              example:
                count: 2
                value:
