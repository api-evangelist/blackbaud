  /v1/dorms/rosters:
    get:
      operationId: V1DormsRostersGet
      summary: Dorms rosters
      description: 'Returns the dorm rosters for a selected year. Uses current school year by default.


        Requires the following role in the Education Management system:


        Schedule Manager


        Dorm Group Manager'
      parameters:
      - name: school_year
        in: query
        required: false
        schema:
          type: string
        description: The ID or label of the school year. Defaults to the current school year.
      - name: school_level
        in: query
        required: false
        schema:
          type: integer
        description: Limits rosters returned to school level specified.
      - name: section_ids
        in: query
        required: false
        schema:
          type: string
        description: Limits rosters returned to sections specified.Provide comma-delimited list of section_id values.
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: 'Limits rosters returned to sections that were modified on or after the date provided. Use ISO-8601 date-time format: 2024-09-01T00:00:00-5:00.'
      responses:
        '200':
          description: A List of Dorms rosters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1DormsRostersGet200ApplicationJsonResponse'
              example:
              - section:
                  id: 1
                  name: Fencing – 2 (Boys)
                  identifier: 2 (Boys)
                  offering:
                    id: 1
                    name: Fencing
                    type:
                      id: 4
                      description: Dorm
                    course_code: CHR240
                    description: Fun with pointy sticks
                    length: 1
                    credits: 0.5
                    school_level:
                      id: 1
                      abbreviation: US
                      name: Upper School
                    school_year: 2023 - 2024
                  duration:
                    id: 1
                    name: Fall
                  school_year:
                    id: 1234
                    begin_date: '2019-08-30T12:00:00Z'
                    current_year: true
                    end_date: '2020-08-30T12:00:00Z'
                    published: true
                    begin_billing_year_date: '2019-08-30T12:00:00Z'
                    end_billing_year_date: '2020-08-30T12:00:00Z'
                  lead_section_id: 1
                  modified: '2024-09-30T01:30:05Z'
                roster:
                - room:
                    room_id: 1
                    room_number: B-401
                    name: Block-A
                    code: 2A
                    capacity: '100'
                    notes: Saving a note
                  user:
                    id: 1
                    email: JohnJr@domain.com
                    first_name: John
                    last_name: Smith
                    maiden_name: Brannigan
                    middle_name: Robert
                    preferred_name: Jack
                    preferred_last_name: Brannigan
                    prefix: Mr.
                    suffix: Jr.
                  enroll_date: '2024-09-30T01:30:05Z'
                  depart_date: '2024-09-30T01:30:05Z'
                  leader:
                    is_leader: true
                    is_head: true
                    is_faculty: true
                    type: Teacher
                  photo:
                    large_filename_url: //some.cdn.com/pathTo/largeFilename
                    thumb_filename_url: //some.cdn.com/pathTo/thumbFilename
                  status: Enrolled
      tags:
      - Dorms
