openapi: 3.2.0
info:
  title: Blackbaud Volunteerschedules API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Volunteerschedules across 2 of this provider''s published API definitions: blackbaud-altru-volunteer-api-openapi.yml, blackbaud-crm-volunteer-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/alt-volmg
- url: https://api.sky.blackbaud.com/crm-volmg
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Volunteerschedules
paths:
  /volunteerschedules:
    post:
      operationId: CreateVolunteerSchedule
      summary: Create a volunteer schedule
      description: Used for assigning volunteers to a given job occurrence.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewVolunteerSchedule'
            example:
              job_occurrence_id: 78bde37e-df28-4841-ac78-1bcd6e3dc18f
              single_day_edit: false
              job_name: CPR Class Instructor
              occurrence_name: CPR Class Instructor
              start_date: ''
              end_date: ''
              start_time: ''
              end_time: ''
              volunteers:
              - volunteer_id: fde70688-8012-4dc9-a642-ceb311a1261b
                volunteer_assignment_id: 7322f6c1-ccba-45e6-87cf-d3fe6fd6408b
                assign: false
                volunteer_name: ''
                match: ''
              needed: 0
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully creates the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Volunteerschedules
    servers:
    - url: https://api.sky.blackbaud.com/alt-volmg
  /volunteerschedules/{job_occurrence_id}/list:
    get:
      operationId: ListVolunteerSchedules
      summary: List volunteer schedules
      description: This operation returns all dates with openings for an occurrence including assignments, used by the job occurrence schedule calendar.
      parameters:
      - name: job_occurrence_id
        in: path
        required: true
        schema:
          type: string
        description: The job occurrence id.
      - name: start_date
        in: query
        required: false
        schema:
          type: string
        description: Format - date (as full-date in RFC3339). start date
      - name: end_date
        in: query
        required: false
        schema:
          type: string
        description: Format - date (as full-date in RFC3339). end date
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Limits the number of records to return.
      - name: session_key
        in: query
        required: false
        schema:
          type: string
        description: A unique key provided by user for paging results. The same key will be returned in a successful response.
      - name: infinity_session
        in: query
        required: false
        schema:
          type: string
        description: Values for cookies related to the Infinity load balancer session.
      - name: more_rows_range_key
        in: query
        required: false
        schema:
          type: string
        description: Key for accessing cached results on subsequent calls to this data list.
      - name: start_row_index
        in: query
        required: false
        schema:
          type: integer
        description: Number of rows to skip,get result after these rows.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of result entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolunteerScheduleListCollection'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to view the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Volunteerschedules
    servers:
    - url: https://api.sky.blackbaud.com/alt-volmg
components:
  schemas:
    NewVolunteerSchedule:
      required:
      - job_occurrence_id
      - start_date
      - end_date
      type: object
      properties:
        job_occurrence_id:
          type: string
          description: The job occurrence ID.
        single_day_edit:
          type: boolean
          description: Indicates whether single day edit.
        job_name:
          maxLength: 50
          minLength: 0
          type: string
          description: The job. Read-only in the SOAP API.
        occurrence_name:
          maxLength: 30
          minLength: 0
          type: string
          description: The occurrence. Read-only in the SOAP API.
        start_date:
          type: string
          description: 'The dates. Uses the format YYYY-MM-DDThh:mm:ss. An example date: <i>1955-11-05T22:04:00</i>.'
          format: date-time
        end_date:
          type: string
          description: 'The end date. Uses the format YYYY-MM-DDThh:mm:ss. An example date: <i>1955-11-05T22:04:00</i>.'
          format: date-time
        starttime:
          $ref: '#/components/schemas/HourMinute'
        endtime:
          $ref: '#/components/schemas/HourMinute'
        volunteers:
          type: array
          items:
            $ref: '#/components/schemas/NewVolunteerScheduleVolunteers'
          description: Volunteers.
        needed:
          type: integer
          description: The needed. Read-only in the SOAP API.
          format: int32
      additionalProperties: false
      description: CreateVolunteerSchedule
      example:
        job_occurrence_id: 78bde37e-df28-4841-ac78-1bcd6e3dc18f
        single_day_edit: false
        job_name: CPR Class Instructor
        occurrence_name: CPR Class Instructor
        start_date: ''
        end_date: ''
        start_time: ''
        end_time: ''
        volunteers:
        - volunteer_id: fde70688-8012-4dc9-a642-ceb311a1261b
          volunteer_assignment_id: 7322f6c1-ccba-45e6-87cf-d3fe6fd6408b
          assign: false
          volunteer_name: ''
          match: ''
        needed: 0
      x-display-name: Assign Volunteers Add Data Form
      x-display-id: Assign Volunteers Add Data Form
    VolunteerScheduleListCollection:
      type: object
      properties:
        count:
          type: integer
          description: The number of items available for retrieval into the collection after applying any request parameters.
          format: int32
        value:
          type: array
          items:
            $ref: '#/components/schemas/VolunteerScheduleListSummary'
          description: The set of items included in the response. This may be a subset of the items in the collection.
        infinity_session:
          type: string
          description: Values for cookies related to the Infinity load balancer session.
          format: string
        session_key:
          type: string
          description: Session key for paging provided by user in request query parameter.
          format: string
        total_available_rows:
          type: integer
          description: The number of total rows available.
          format: int32
        more_rows_range_key:
          type: string
          description: Key for accessing cached results on subsequent calls to this data list.
          format: string
        data_no_longer_available:
          type: boolean
          description: Indicates data is no longer available in the context of this session.
          format: boolean
      additionalProperties: false
      description: A collection of items. Data lists can contain paginated results.
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          description: A URI reference [RFC3986] that identifies the problem type. This specification encourages that, when dereferenced, it provide human-readable documentation for the problem type (e.g., using HTML [W3C.REC-html5-20141028]). When this member is not present, its value is assumed to be "about:blank".
        title:
          type: string
          description: A short, human-readable summary of the problem type. It SHOULD NOT change from occurrence to occurrence of the problem, except for purposes of localization (e.g., using proactive content negotiation; see [RFC7231], Section 3.4).
        status:
          type: integer
          description: The HTTP status code ([RFC7231], Section 6) generated by the origin server for this occurrence of the problem.
          format: int32
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        instance:
          type: string
          description: A URI reference that identifies the specific occurrence of the problem. It may or may not yield further information if dereferenced.
        trace_id:
          type: string
          description: A request ID that can be provided to Blackbaud Support that may help with further troubleshooting.
        span_id:
          type: string
          description: A request ID that can be provided to Blackbaud Support that may help with further troubleshooting.
      additionalProperties: false
      description: A machine-readable format for specifying errors in HTTP API responses based on https://tools.ietf.org/html/rfc7807.
      x-display-name: Problem details
      x-display-id: ProblemDetails
    VolunteerScheduleListSummary:
      type: object
      properties:
        job_id:
          type: string
          description: The jobid.
        start_date:
          type: string
          description: 'The startdate. Uses the format YYYY-MM-DDThh:mm:ss. An example date: <i>1955-11-05T22:04:00</i>.'
          format: date-time
        name:
          type: string
          description: The name.
        start_time:
          $ref: '#/components/schemas/HourMinute'
        end_time:
          $ref: '#/components/schemas/HourMinute'
        description:
          type: string
          description: The description.
      additionalProperties: false
      description: ListVolunteerSchedules
      x-display-name: Job Occurrence Schedule Openings Calendar Datalist
      x-display-id: Job Occurrence Schedule Openings Calendar Datalist
    HourMinute:
      type: object
      properties:
        hour:
          type: integer
          description: The hour.
          format: int32
        minute:
          type: integer
          description: The minute.
          format: int32
      description: HourMinute
      x-display-name: Hour Minute
      x-display-id: Hour Minute
    NewVolunteerScheduleVolunteers:
      type: object
      properties:
        volunteer_id:
          type: string
          description: volunteerid
        volunteer_assignment_id:
          type: string
          description: volunteerassignmentid
        assign:
          type: boolean
          description: assign
        volunteer_name:
          type: string
          description: volunteer name
        match:
          type: string
          description: percent match
      description: NewVolunteerScheduleVolunteers
      x-display-name: volunteers
      x-display-id: volunteers
    PostResponse:
      type: object
      properties:
        id:
          type: string
          description: The newly created ID.
      additionalProperties: false
      description: Defines the shape of a post response object.
  securitySchemes:
    Bb-Api-Subscription-Key:
      type: apiKey
      name: Bb-Api-Subscription-Key
      in: header
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://app.blackbaud.com/oauth/authorize
          tokenUrl: https://oauth2.sky.blackbaud.com/token
          scopes: {}
