tags:
- name: Eventattachmenttags
paths:
  /v1/eventattachmenttags:
    get:
      operationId: GetEventAttachmentTags
      summary: Get event attachment tags
      description: Returns a list of available attachment tags.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the event attachment tags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentTagCollection'
              example:
                count: 7
                value:
                - Certificate
                - Document
                - Logo
                - PDF
                - Photo
                - Slideshow
                - Spreadsheet
        '403':
          description: Returned when the user does not have the rights to view event attachment tags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1EventattachmenttagsGet403ApplicationJsonResponse'
              example:
              - message: The user does not have the necessary permissions for this task.
                error_name: Forbidden
                error_code: 403
                raw_message: The user does not have the necessary permissions for this task.
      tags:
      - Eventattachmenttags
components:
  schemas:
    AttachmentTagCollection:
      type: object
      properties:
        count:
          type: integer
          description: The total number of items in the collection before limit/offset.
