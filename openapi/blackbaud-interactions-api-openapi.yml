openapi: 3.2.0
info:
  title: Blackbaud Interactions API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Interactions across 2 of this provider''s published API definitions: blackbaud-altru-constituent-api-openapi.yml, blackbaud-crm-constituent-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/alt-conmg
- url: https://api.sky.blackbaud.com/crm-conmg
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Interactions
paths:
  /interactions:
    post:
      operationId: CreateConstituentInteraction
      summary: Create a constituent interaction
      description: Add dataoperation for interaction records.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewConstituentInteraction'
            example:
              constituent_id: ''
              interaction_type: ''
              objective: ''
              fundraiser_id: ''
              expected_date: ''
              actual_date: ''
              status: Pending
              comment: ''
              event_id: ''
              constituent_name: ''
              participants:
              - id: ''
                constituent_id: ''
              interaction_category: ''
              interaction_subcategory: ''
              sites:
              - id: ''
                siteid: ''
              site_required: false
              selected_constituent_id: ''
              expected_start_time: ''
              expected_end_time: ''
              is_all_day_event: false
              time_zone_entry: ''
              actual_start_time: ''
              actual_end_time: ''
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully creates the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Interactions
    servers:
    - url: https://api.sky.blackbaud.com/alt-conmg
  /interactions/{constituent_interaction_id}:
    delete:
      operationId: DeleteConstituentInteraction
      summary: Delete a constituent interaction
      description: This delete method handles the basic deletion rules for a constituent interaction.
      parameters:
      - name: constituent_interaction_id
        in: path
        required: true
        schema:
          type: string
        description: The constituent interaction id
      responses:
        '200':
          description: Returned when the operation successfully deletes the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to delete the resource.
      tags:
      - Interactions
    patch:
      operationId: EditConstituentInteraction
      summary: Edit a constituent interaction
      description: Edit operation for a non-move interaction.
      parameters:
      - name: constituent_interaction_id
        in: path
        required: true
        schema:
          type: string
        description: The constituent interaction id.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditConstituentInteraction'
            example:
              interaction_type: Phone call
              objective: Introductory call
              fundraiser_id: 0DE9D2A3-82EE-4979-AA40-AF9C9DF2C0A2
              expected_date: '2015-02-17T12:00:00Z'
              actual_date: '2015-02-17T12:00:00Z'
              status: Completed
              comment: ''
              step: false
              event_id: ''
              participants:
              - id: d4873d67-c341-442c-bdc4-2cdb47bff7e2
                constituent_id: 83ED6E63-4687-447A-B94F-35611ADF47B3
              constituent_id: ''
              constituent_name: ''
              interaction_category: ''
              interaction_subcategory: ''
              sites:
              - id: a62483d4-cb71-46ae-9f06-da0644d0629f
                site_id: D0AD4D30-800D-4F81-A5BA-DDA2A60C85A9
              expected_start_time:
                hour: 1
                minute: 26
              expected_end_time:
                hour: 3
                minute: 33
              all_day_event: false
              time_zone_entry: ''
              actual_start_time:
                hour: 2
                minute: 19
              actual_end_time:
                hour: 6
                minute: 40
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully edits the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to edit the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Interactions
    get:
      operationId: GetConstituentInteraction
      summary: Get a constituent interaction
      description: Edit operation for a non-move interaction.
      parameters:
      - name: constituent_interaction_id
        in: path
        required: true
        schema:
          type: string
        description: The constituent interaction id.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstituentInteraction'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to get the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Interactions
    servers:
    - url: https://api.sky.blackbaud.com/alt-conmg
components:
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          description: A URI reference [RFC3986] that identifies the problem type. This specification encourages that, when dereferenced, it provide human-readable documentation for the problem type (e.g., using HTML [W3C.REC-html5-20141028]). When this member is not present, its value is assumed to be "about:blank".
        title:
          type: string
          description: A short, human-readable summary of the problem type. It SHOULD NOT change from occurrence to occurrence of the problem, except for purposes of localization (e.g., using proactive content negotiation; see [RFC7231], Section 3.4).
        status:
          type: integer
          description: The HTTP status code ([RFC7231], Section 6) generated by the origin server for this occurrence of the problem.
          format: int32
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        instance:
          type: string
          description: A URI reference that identifies the specific occurrence of the problem. It may or may not yield further information if dereferenced.
        trace_id:
          type: string
          description: A request ID that can be provided to Blackbaud Support that may help with further troubleshooting.
        span_id:
          type: string
          description: A request ID that can be provided to Blackbaud Support that may help with further troubleshooting.
      additionalProperties: false
      description: A machine-readable format for specifying errors in HTTP API responses based on https://tools.ietf.org/html/rfc7807.
      x-display-name: Problem details
      x-display-id: ProblemDetails
    HourMinute:
      type: object
      properties:
        hour:
          type: integer
          description: The hour.
          format: int32
        minute:
          type: integer
          description: The minute.
          format: int32
      description: HourMinute
      x-display-name: Hour Minute
      x-display-id: Hour Minute
    EditConstituentInteractionSites:
      required:
