openapi: 3.2.0
info:
  title: Blackbaud Funds API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Funds across 2 of this provider''s published API definitions: blackbaud-fundraising-api-openapi.yml, blackbaud-general-ledger-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/fundraising/v1
- url: https://api.sky.blackbaud.com/generalledger/v1
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Funds
paths:
  /funds:
    get:
      operationId: ListFunds
      summary: Fund list
      description: 'Returns a paginated list of funds.


        The default sorting behavior is to list funds in ascending order based on when they were created.


        However, the last_modified parameter overrides the default sorting behavior to list funds in ascending order based on when they were last modified. The last_modified parameter also adds the sort_token parameter to the next_link URL to ensure that funds are stably sorted and that order persists when changes occur while working through a paginated list.


        If the last_modified and date_added parameters are both specified, the sorting behavior is to list funds based on when they were last modified.'
      parameters:
      - name: date_added
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for funds created on or after the specified date. The filter respects time offsets from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for funds modified on or after the specified date. The filter respects time offsets from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: sort_token
        in: query
        required: false
        schema:
          type: string
        description: Represents a token filter to provide the next stable-sorted list of funds. This will be provided on the next_link collection response property when last_modified or sort_token filters are specified on the request.
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
        description: Set this parameter to "true" to include inactive funds in the response.
      - name: fund_id
        in: query
        required: false
        schema:
          type: array
        description: Represents a list of fund identifiers. Returns funds if any of the specified fund identifiers match any of their funds.  For example, "fund_id=280&amp;fund_id=1232" returns funds with either "280" or "1232" fund identifiers.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to return. The default is 500. The maximum is 5000.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip. For use with pagination.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a> of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/fundraising#Fund">fund</a> entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection_FundRead'
              example:
                count: 52
                next_link: https://api.sky.blackbaud.com/fundraising/v1/funds?offset=3&limit=3
                value:
                - id: '2'
                  category: Annual
                  date_added: '1999-06-25T10:30:09Z'
                  date_modified: '2000-08-30T16:05:17.97Z'
                  description: 1999 Annual Fund
                  end_date: '1999-12-31T00:00:00Z'
                  goal:
                    value: 100000
                  inactive: false
                  lookup_id: 99ANNUAL
                  start_date: '1999-01-01T00:00:00Z'
                  type: Donor Advised Fund
                - id: '3'
                  category: Capital
                  date_added: '1999-06-25T10:30:54Z'
                  date_modified: '2004-01-30T10:05:10.233Z'
                  description: 2000 Annual Fund
                  end_date: '2000-12-31T00:00:00Z'
                  goal:
                    value: 100000
                  inactive: false
                  lookup_id: 2000ANNUAL
                  start_date: '2000-01-01T00:00:00Z'
                - id: '4'
                  date_added: '1999-06-25T10:31:28Z'
                  date_modified: '2002-07-30T14:33:30.463Z'
                  description: Acquisition Fund
                  goal:
                    value: 500000
                  inactive: false
                  lookup_id: ACQUISITION
                  start_date: '2000-01-01T00:00:00Z'
        '400':
          description: Returned when the specified request parameters are not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to view the funds.
      tags:
      - Funds
    servers:
    - url: https://api.sky.blackbaud.com/fundraising/v1
  /funds/attachments:
    post:
      operationId: CreateFundAttachment
      summary: Fund attachment (Create)
      description: Creates a fund attachment.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentAdd'
            example:
              date: '2015-01-25T04:00:00Z'
              name: Pledge Thank You Letter
              parent_id: '2396'
              tags:
              - Letter
              type: Link
              url: http://file.com/
        description: An object that represents the attachment to add.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the ID of the new attachment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: '1281'
        '400':
          description: Returned when the request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to create the attachment.
        '404':
          description: Returned when the specified fund is not found.
      tags:
      - Funds
    servers:
    - url: https://api.sky.blackbaud.com/fundraising/v1
  /funds/attachments/{attachment_id}:
    delete:
      operationId: DeleteFundAttachment
      summary: Fund attachment (Delete)
      description: Deletes a fund attachment.
      parameters:
      - name: attachment_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the attachment to delete.
      responses:
        '200':
          description: Returned when the operation successfully deletes the attachment.
        '400':
          description: Returned when the specified attachment ID in the request URL is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to delete the attachment.
      tags:
      - Funds
    patch:
      operationId: EditFundAttachment
      summary: Fund attachment (Edit)
      description: Edits a fund attachment.
      parameters:
      - name: attachment_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the attachment to edit.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachmentEdit'
            example:
              date: '2015-01-25T04:00:00Z'
              name: Pledge Thank You Letter
              tags:
              - Letter
              url: http://example.com/
        description: An object that represents the attachment to edit.
      responses:
        '200':
          description: Returned when the operation successfully edits the attachment.
        '400':
          description: Returned when the specified attachment ID in the request URL is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to edit the attachment.
        '404':
          description: Returned when the specified attachment is not found.
      tags:
      - Funds
    servers:
    - url: https://api.sky.blackbaud.com/fundraising/v1
  /funds/categories:
    get:
      operationId: ListFundCategories
      summary: Fund categories
      description: Returns a list of fund categories.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/fundraising/#Collection">collection</a> of string.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection_String'
              example:
                count: 9
                value:
                - Annual
                - Capital
                - Endowment
                - Event
                - Membership
                - Operating
                - Restricted
                - Scholarship
                - Unrestricted
        '403':
          description: Returned when the user does not have permission to view the fund categories.
      tags:
      - Funds
    servers:
    - url: https://api.sky.blackbaud.com/fundraising/v1
  /funds/customfields:
    post:
      operationId: CreateFundCustomField
      summary: Fund custom field (Create)
      description: Adds a new custom field.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomFieldAdd'
            example:
              category: Major Donors Only?
              comment: a comment
              date: '2016-01-22T00:00:00Z'
              parent_id: '2'
              value: 'true'
        description: An object representing the custom field to add.
      responses:
        '200':
          description: Returned when the operation succeeds and a new custom field has been created. The response body contains the ID of the newly added custom field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: '1281'
        '400':
          description: Returned when the request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to create the custom field.
        '404':
          description: Returned when the specified fund is not found.
      tags:
      - Funds
    servers:
    - url: https://api.sky.blackbaud.com/fundraising/v1
  /funds/customfields/categories:
    get:
      operationId: ListFundCustomFieldCategories
      summary: Fund custom field categories
      description: Gets the list of custom field categories.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/fundraising#Collection">collection</a> of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/fundraising#CustomFieldCategory">custom field category</a> entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection_CustomFieldCategoryRead'
              example:
                count: 2
                value:
                - name: Restrictions
                  type: Text
                - name: Priority
                  type: CodeTableEntry
      tags:
      - Funds
    servers:
    - url: https://api.sky.blackbaud.com/fundraising/v1
  /funds/customfields/categories/values:
    get:
      operationId: ListFundCustomFieldCategoryValues
      summary: Fund custom field category values
      description: Gets the list of custom field category values.
      parameters:
      - name: category_name
        in: query
        required: false
        schema:
          type: string
        description: The name of the category for which the values should be returned.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a> of string custom field category values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection_String'
              example:
                count: 5
                value:
                - Very High
                - High
                - Medium
                - Low
                - Very Low
      tags:
      - Funds
    servers:
    - url: https://api.sky.blackbaud.com/fundraising/v1
  /funds/customfields/{custom_field_id}:
    delete:
      operationId: DeleteFundCustomField
      summary: Fund custom field (Delete)
      description: Deletes the custom field with the specified ID.
      parameters:
      - name: custom_field_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the custom field to be deleted.
      responses:
        '200':
          description: Returned when the operation succeeds and the custom field has been deleted.
        '400':
          description: Returned when the specified custom field ID in the request URL is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to delete the custom field.
      tags:
      - Funds
    patch:
      operationId: EditFundCustomField
      summary: Fund custom field (Edit)
      description: Edits an existing custom field.
      parameters:
      - name: custom_field_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the custom field to be edited.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomFieldEdit'
            example:
              comment: a comment
              date: '2016-01-22T00:00:00Z'
              value: strategic planning
        description: An object representing updated properties of the custom field to add.
      responses:
        '200':
          description: Returned when the operation succeeds and the custom field has been edited.
        '400':
          description: Returned when the request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to edit the custom field.
        '404':
          description: Returned when the specified custom field is not found.
      tags:
      - Funds
    servers:
    - url: https://api.sky.blackbaud.com/fundraising/v1
  /funds/{fund_id}:
    get:
      operationId: GetFund
      summary: Fund (Get)
      description: Returns information about the fund with the specified ID.
      parameters:
      - name: fund_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the fund for which information is to be retrieved.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified <a href='https://developer.blackbaud.com/skyapi/api/entity-reference/fundraising#Fund'>fund</a> entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundRead'
              example:
                id: '26'
                category: Annual
                date_added: '2001-11-16T11:26:53.52Z'
                date_modified: '2017-03-23T13:10:46.64Z'
                description: 2004 Annual Fund
                end_date: '2004-12-31T00:00:00Z'
                goal:
                  value: 500000
                inactive: false
                lookup_id: 2004ANNUAL
                start_date: '2004-01-01T00:00:00Z'
                type: Donor Advised Fund
        '400':
          description: Returned when the specified fund ID in the request URL is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to view the fund.
        '404':
          description: Returned when the specified fund is not found.
      tags:
      - Funds
    servers:
    - url: https://api.sky.blackbaud.com/fundraising/v1
  /funds/{fund_id}/attachments:
    get:
      operationId: ListFundAttachmentsSingleFund
      summary: Fund attachment list (Single fund)
      description: Returns a list of attachments for a fund.
      parameters:
      - name: fund_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the fund to retrieve attachments for.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/fundraising#Collection">collection</a> of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/fundraising#Attachment">attachment</a> entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection_AttachmentRead'
              example:
                count: 4
                value:
                - id: 53b9a13d-3e01-4d76-a6d4-ea99a7c4e0e0
                  date: '2015-01-25T04:00:00Z'
                  name: Pledge Thank You Letter
                  parent_id: '2396'
                  tags:
                  - Letter
                  type: Link
                  url: http://file.com/
                - id: 3cd91f4b-9cf9-4c06-b7de-42dc41e6d82e
                  date: '2014-03-21T04:00:00Z'
