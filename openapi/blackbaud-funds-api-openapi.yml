components:
  schemas:
    ApiCollection_AttachmentRead:
      description: Fetching data all at once quickly becomes unmanageable. The collection entity helps by returning paginated chunks of large data sets. This entity includes helpful metadata and properties to paginate and iterate through the data.
      type: object
      properties:
        count:
          format: int32
          description: The number of items available for retrieval into the collection after applying any request parameters. The <b>limit</b> and <b>offset</b> parameters do not affect the <b>count</b>, but to facilitate paging, they may affect the number of items in the <b>value</b> result set.
          type: integer
        next_link:
          description: For paginated responses, the URI for the next page of results.
          type: string
        value:
          description: The set of items included in the response. This may be a subset of the items in the collection.
          type: array
          items:
            $ref: '#/components/schemas/AttachmentRead'
      x-hidden: true
      x-base-type: '#/definitions/ApiCollection'
    CustomFieldEdit:
      description: While records provide many fields to track information, organizations often require additional details. To track this specialized information, use custom fields.
      type: object
      properties:
        comment:
          description: 'The comment on the custom field. Character limit: 50.'
          maxLength: 50
          minLength: 0
          type: string
        date:
          format: date-time
          description: The date on the custom field. Uses <a href="https://tools.ietf.org/html/rfc3339">ISO-8601 format:</a><i>1969-11-21T10:29:43</i>.
          type: string
          x-supports-datetime-offset: false
        value:
          description: The value of the custom field. The <code>type</code> property determines the format. Character limit depends on data type.
          type: object
      x-hidden: true
      x-display-name: Edit custom field
      x-display-id: EditCustomField
      x-additional-info: "<a name=\"CustomFieldTypes\"></a>\n<p>&nbsp;</p>\n<p>\n    Available values for the <b>type</b> of a <b>custom field</b>:\n</p>\n\n<div class=\"table-responsive\">\n    <table class=\"table table-striped table-hover\">\n        <thead>\n            <tr>\n                <th class=\"col-xs-3\"><strong>Type</strong></th>\n                <th class=\"col-xs-9\"><strong>Description</strong></th>\n            </tr>\n        </thead>\n        <tbody>\n            <tr>\n                <td>Boolean</td>\n                <td>Defines the custom field as a boolean value.</td>\n            </tr>\n            <tr>\n                <td>CodeTableEntry</td>\n                <td>Defines the custom field as a string value that represents a code table entry description.</td>\n            </tr>\n            <tr>\n                <td>ConstituentId</td>\n                <td>Defines the custom field as a constituent identifier value.</td>\n            </tr>\n            <tr>\n                <td>Currency</td>\n                <td>Defines the custom field as a decimal value.</td>\n            </tr>\n            <tr>\n                <td>Date</td>\n                <td>\n                    Defines the custom field as a date value in <a href=\"https://tools.ietf.org/html/rfc3339\">ISO-8601 format:</a> <i>1969-11-21T10:29:43</i>.\n                </td>\n            </tr>\n            <tr>\n                <td>FuzzyDate</td>\n                <td>\n                    Defines the custom field as a fuzzy date value.\n                </td>\n            </tr>\n            <tr>\n                <td>Number</td>\n                <td>Defines the custom field as an integer value.</td>\n            </tr>\n            <tr>\n                <td>Text</td>\n                <td>Defines the custom field as a string value. Character limit: 255.</td>\n            </tr>\n        </tbody>\n    </table>\n</div>"
    AttachmentAdd:
      description: Many cultivation activities collect related collateral, such as correspondence and prospect research. Attachments can save this data on the appropriate record to maintain a complete view of those activities.
      required:
      - parent_id
      - type
      type: object
      properties:
        date:
          format: date-time
          description: The date of the attachment. Uses <a href="https://tools.ietf.org/html/rfc3339">ISO-8601 format:</a><i>1969-11-21T10:29:43-04:00</i>. This property defaults to the current date and time if not supplied.
          type: string
          x-supports-datetime-offset: true
        file_id:
          description: 'The identifier of the file. Character limit: 36. For physical attachments only.'
          maxLength: 36
          minLength: 0
          type: string
        file_name:
          description: 'The name of the file. Character limit: 255. For physical attachments only.'
          maxLength: 255
          minLength: 0
          type: string
        name:
          description: 'The name of the attachment. Character limit: 150.'
          maxLength: 150
          minLength: 0
          type: string
        parent_id:
          description: The parent object's immutable system record ID.
          type: string
        tags:
          description: 'The tags associated with the attachment. Tags supplement the attachment’s name and description and identify it based on how an organization categorizes attachments. Available values are the entries in the <b>Document Tags</b> table. Character limit: 100.'
          type: array
          items:
            type: string
        thumbnail_id:
          description: 'The identifier of the thumbnail. Character limit: 36. For physical attachments only.'
          maxLength: 36
          minLength: 0
          type: string
        type:
