tags:
- name: Fiscalyears
paths:
  /fiscalyears:
    get:
      operationId: ListFiscalYears
      summary: Fiscal year (List)
      description: Returns the list of fiscal year details.
      responses:
        '200':
          description: ' Returned when the operation is successful. The response body contains the fiscal year details.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollection_FiscalYear'
              example:
                count: 21
                value:
                - fiscal_year_id: 1
                  year: '2000'
                  description: Fiscal Year 2000
                  start_date: '2000-01-01T00:00:00Z'
                  end_date: '2000-12-31T00:00:00Z'
                  status: Purged
                  fiscal_periods:
                  - fiscal_period_id: 1
                    start_date: '2000-01-01T00:00:00Z'
                    end_date: '2000-01-31T00:00:00Z'
                    sequence: 1
                    closed: true
                  - fiscal_period_id: 2
                    start_date: '2000-02-01T00:00:00Z'
                    end_date: '2000-02-29T00:00:00Z'
                    sequence: 2
                    closed: true
                  - fiscal_period_id: 3
                    start_date: '2000-03-01T00:00:00Z'
                    end_date: '2000-03-31T00:00:00Z'
                    sequence: 3
                    closed: true
                  - fiscal_period_id: 4
                    start_date: '2000-04-01T00:00:00Z'
                    end_date: '2000-04-30T00:00:00Z'
                    sequence: 4
                    closed: true
                  - fiscal_period_id: 5
                    start_date: '2000-05-01T00:00:00Z'
                    end_date: '2000-05-31T00:00:00Z'
                    sequence: 5
                    closed: true
                  - fiscal_period_id: 6
                    start_date: '2000-06-01T00:00:00Z'
                    end_date: '2000-06-30T00:00:00Z'
                    sequence: 6
                    closed: true
                  - fiscal_period_id: 7
                    start_date: '2000-07-01T00:00:00Z'
                    end_date: '2000-07-31T00:00:00Z'
                    sequence: 7
                    closed: true
                  - fiscal_period_id: 8
                    start_date: '2000-08-01T00:00:00Z'
                    end_date: '2000-08-31T00:00:00Z'
                    sequence: 8
                    closed: true
                  - fiscal_period_id: 9
                    start_date: '2000-09-01T00:00:00Z'
                    end_date: '2000-09-30T00:00:00Z'
                    sequence: 9
                    closed: true
                  - fiscal_period_id: 10
                    start_date: '2000-10-01T00:00:00Z'
                    end_date: '2000-10-31T00:00:00Z'
                    sequence: 10
                    closed: true
                  - fiscal_period_id: 11
                    start_date: '2000-11-01T00:00:00Z'
                    end_date: '2000-11-30T00:00:00Z'
                    sequence: 11
                    closed: true
                  - fiscal_period_id: 12
                    start_date: '2000-12-01T00:00:00Z'
                    end_date: '2000-12-31T00:00:00Z'
                    sequence: 12
                    closed: true
        '403':
          description: Returned when the user does not have permission to view fiscal year details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicErrorMessage'
              example:
                error: The specified record could not be found. The record has either been deleted or you do not have rights to view it.
      tags:
      - Fiscalyears
