openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: OneRoster Courses API'
  description: OneRoster v1.1 API. For details on the OneRoster Version 1.1 Specification, click here. The Authorization page provides steps to setup and test these endpoints.
  version: v1p1
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/afe-rostr
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Courses
paths:
  /courses:
    get:
      operationId: getAllCourses
      summary: Courses all
      description: Returns a collection of courses.
      responses:
        '200':
          description: OK - It was possible to read the collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursesOutputModel'
              example:
                courses:
                - title: Introduction to Physics
                  schoolYear:
                    sourcedId: as-syr-222-2023
                    href: https://edu.nxt.blackbaud.com/ims/oneroster/v11/academicSessions/as-syr-222-2023
                    type: academicSession
                  courseCode: Phys 100
                  grades:
                  - 09
                  - '10'
                  subjects:
                  - Science
                  org:
                    sourcedId: org-sch-222-456
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/orgs/org-sch-222-456
                    type: org
                  sourcedId: crs-222-456-12345
                  status: active
                  dateLastModified: '2022-09-26T01:30:00Z'
                  metadata:
                    department_0: org-dpt-222-3456
                - title: History
                  schoolYear:
                    sourcedId: as-syr-222-2023
                    href: https://edu.nxt.blackbaud.com/ims/oneroster/v11/academicSessions/as-syr-222-2023
                    type: academicSession
                  courseCode: '2'
                  grades:
                  - 09
                  - '10'
                  - '11'
                  subjects:
                  - History
                  org:
                    sourcedId: org-sch-222-456
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/orgs/org-sch-222-456
                    type: org
                  sourcedId: crs-222-123654
                  status: active
                  dateLastModified: '2022-09-26T01:30:00Z'
                  metadata:
                    department_0: org-dpt-222-4567
      tags:
      - Courses
  /courses/{id}:
    get:
      operationId: getCourse
      summary: Course by id
      description: Returns a specific course.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: sourcedId for the course
      responses:
        '200':
          description: OK - It was possible to read the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseOutputModel'
              example:
                course:
                  title: Introduction to Physics
                  schoolYear:
                    sourcedId: as-syr-222-2023
                    href: https://edu.nxt.blackbaud.com/ims/oneroster/v11/academicSessions/as-syr-222-2023
                    type: academicSession
                  courseCode: Phys 100
                  grades:
                  - 09
                  - '10'
                  subjects:
                  - Science
                  org:
                    sourcedId: org-sch-222-456
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/orgs/org-sch-222-456
                    type: org
                  sourcedId: crs-222-456-12345
                  status: active
                  dateLastModified: '2022-09-26T01:30:00Z'
                  metadata:
                    department_0: org-dpt-222-3456
      tags:
      - Courses
components:
  schemas:
    StatusInfoModel:
      type: object
      properties:
        imsx_codeMajor:
          type:
          - string
          - 'null'
        imsx_severity:
          type:
          - string
          - 'null'
        imsx_messageRefIdentifier:
          type:
          - string
          - 'null'
        imsx_operationRefIdentifier:
          type:
          - string
          - 'null'
        imsx_description:
          type:
          - string
          - 'null'
        imsx_codeMinor:
          type:
          - string
          - 'null'
      additionalProperties: false
    CoursesOutputModel:
      type: object
      properties:
        courses:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/CourseModel'
        statusInfoSet:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/StatusInfoModel'
      additionalProperties: false
    CourseModel:
      type: object
      properties:
        title:
          type:
          - string
          - 'null'
        schoolYear:
          $ref: '#/components/schemas/GuidRefModel'
        courseCode:
          type:
          - string
          - 'null'
        grades:
          type:
          - array
          - 'null'
          items:
            type: string
        subjects:
          type:
          - array
          - 'null'
          items:
            type: string
        org:
          $ref: '#/components/schemas/GuidRefModel'
        subjectCodes:
          type:
          - array
          - 'null'
          items:
            type: string
        resources:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/GuidRefModel'
        sourcedId:
          type:
          - string
          - 'null'
        status:
          type:
          - string
          - 'null'
        dateLastModified:
          type:
          - string
          - 'null'
          format: date-time
        metadata:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
      additionalProperties: false
    GuidRefModel:
      type: object
      properties:
        sourcedId:
          type:
          - string
          - 'null'
        href:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
      additionalProperties: false
    CourseOutputModel:
      type: object
      properties:
        course:
          $ref: '#/components/schemas/CourseModel'
        statusInfoSet:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/StatusInfoModel'
      additionalProperties: false
  securitySchemes:
    Bb-Api-Subscription-Key:
      type: apiKey
      name: Bb-Api-Subscription-Key
      in: header
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://app.blackbaud.com/oauth/authorize
          tokenUrl: https://oauth2.sky.blackbaud.com/token
          scopes: {}
