openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: School Directories API'
  description: This API is used to provide access to school information such as users, academics, admissions, athletics, content, lists, and general school info.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/school
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/school
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Directories
paths:
  /v1/directories:
    get:
      operationId: V1DirectoriesGet
      summary: Directories
      description: 'Returns a collection of directories the logged in user has access to

        Requires at least one of the following roles in the Education Management System:


        Parent


        Faculty


        Student'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryModelCollection'
              example:
                count: 2
                value:
                - id: 1
                  name: Faculty
                  sort: 1
                - id: 2
                  name: Coaches
                  sort: 2
      tags:
      - Directories
  /v1/directories/{directory_id}:
    get:
      operationId: V1DirectoriesByDirectory_idGet
      summary: Directories results
      description: 'Returns a collection of directory results the logged in user has access to

        ```search``` is an optional search string to filter directory results.

        ```search_all``` allows the search string to be used for all fields.


        When set to ```false```, only searches name fields. defaults to ```true```.


        Requires at least one of the following roles in the Education Management System:


        Parent


        Faculty


        Student'
      parameters:
      - name: directory_id
        in: path
        required: true
        schema:
          type: integer
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: search_all
        in: query
        required: false
        schema:
          type: boolean
          default: 'true'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DirectoryResultCollection'
              example:
                count: 1
                value:
                - user_id: 12345
                  first_name: Tony
                  last_name: Stark
                  email: example@example.com
                  address_line1: 1 Blackbaud Way
                  address_line2: ''
                  address_line3: ''
                  city: Bedford
                  state: NH
                  zip: '03303'
                  country: USA
                  home_phone: 555-555-5555
                  cell_phone: 556-555-5555
                  home_phone2: ''
                  has_relationships: true
                  prefix: ''
                  preferred_name: Iron Man
                  profile_photo: //media.myschoolcdn.com/ftpimages/236/user/large_user_12345_1.jpg
                  middlename: ''
                  maiden_name: ''
                  suffix: ''
                  grad_year: '2022'
                  grade: '10'
                  grade_display: Tenth
                  department: ''
                  department_display: ''
                  spouse_id: 0
                  child_names: ''
                  grade_numeric: 10
                  grade_numeric_display: '10'
                  total_count: 1
                  deceased: false
                  student: true
                  preferred_address_id: 0
                  preferred_address_lat: 0
                  preferred_address_lng: 0
                  job_title: ''
      tags:
      - Directories
components:
  schemas:
    DirectoryModel:
      type: object
      properties:
        id:
          type: integer
          description: The Id of the directory
          format: int32
        name:
          type:
          - string
          - 'null'
          description: the name of the directory
        sort:
          type: integer
          description: The sort order that the directory should be displayed
          format: int32
      additionalProperties: false
      description: ''
    DirectoryModelCollection:
      type: object
      properties:
        count:
          type: integer
          description: The number of items in the collection
          format: int32
          readOnly: true
        next_link:
          type:
          - string
          - 'null'
          description: For paginated responses, the URI for the next page of results
        value:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/DirectoryModel'
          description: The set of items included in the response. This may be a subset of the items in the collection
      additionalProperties: false
      description: A Collection
    DirectoryResultCollection:
      type: object
      properties:
        count:
          type: integer
          description: The number of items in the collection
          format: int32
          readOnly: true
        next_link:
          type:
          - string
          - 'null'
          description: For paginated responses, the URI for the next page of results
        value:
          type:
          - array
          - 'null'
          items:
