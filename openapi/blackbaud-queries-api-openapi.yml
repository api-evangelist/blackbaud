    QueryNodeBase:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          description: 'The ID of the node. Format: plain numeric string for static nodes (e.g., "10516"),

            or "{parentNodeId}_{uniqueId}" for dynamic nodes (e.g., "10516_2212").'
        name:
          type:
          - string
          - 'null'
          description: The name of the node to display
        node_type:
          $ref: '#/components/schemas/NodeType'
        gift_processing_options_supported:
          type: boolean
          description: 'Whether this node is eligible to carry a node-level GiftProcessingOptions override as a plain

            Gifts collection node. RE only; always false for FE.'
        select_from_query_type_ids:
          type:
          - array
          - 'null'
          items:
            type: integer
            format: int32
          description: 'The query type IDs that a child select anchored on this node may reference via select-from, i.e.

            "only select from the records found by this other query". An empty or absent collection means

            select-from is not supported on this node. Currently populated only for gift nodes - both the plain

            Gifts collection nodes and the gift summary nodes - which may reference Gift queries. RE only;

            always empty for FE.'
        web_view_only:
          type: boolean
          description: 'Whether the node is only available in web view, mirroring the field-level

            WebViewOnly flag. Lives on the base so it reaches every node shape a caller

            sees: the available fields tree (QueryNodeV2), the ancestor chain on a saved query''s

            fields (NodePath), and a single-row subquery''s own node

            (ChildSelectQueryNode). The node is still returned everywhere; the flag is passed

            through so the SPA can surface it (cloud icon and help doc link) the same way it does for fields.'
      additionalProperties: false
      description: Base class containing common properties for query nodes
    SortOrder:
      enum:
      - Ascending
      - Descending
      type: string
      description: Whether to sort ascending or descending<p>Members:</p><ul><li><i>Ascending</i> - Sort ascending</li><li><i>Descending</i> - Sort descending</li></ul>
    ExecuteQueryByIdRequest:
      required:
      - id
      type: object
      properties:
        id:
          type: integer
          description: Query identifier
          format: int32
        ux_mode:
          $ref: '#/components/schemas/UXMode'
        output_format:
          $ref: '#/components/schemas/OutputFormat'
        formatting_mode:
          $ref: '#/components/schemas/FormattingMode'
        sql_generation_mode:
          $ref: '#/components/schemas/SqlGenerationMode'
        use_static_query_id_set:
          type: boolean
          description: 'When false, the query is run dynamically regardless of its format (dynamic or static).

            When true, the results only include the records in the static query''s saved ID set.

            True is only valid for static queries that have a saved ID set.  For a static query to have a saved ID set, one of the following must be true:

            - The query was created or its format was changed to static in database view.

            - The query was created or its format was changed to static via the web view UI.

            - The query was created via the query API, POST /queries/refreshstaticquery was called for it, and that job completed successfully.'
        results_file_name:
          type:
          - string
          - 'null'
          description: Name of the file to be downloaded, without the file extension.
        ask_fields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AskFieldInformation'
          description: "A collection to provide ask field values. The order of this list should correspond to \nthe order of filter fields with the operator set to Ask."
        display_code_table_long_description:
          type:
          - boolean
          - 'null'
          description: 'Display code table entries by long description (instead of short description).

            Optional override of the same-named stored setting in UserOptions.'
        time_zone_offset_in_minutes:
          type:
          - integer
          - 'null'
          description: Optional time zone offset in minutes to account for the user's offset from UTC, used for relative date filter values.
          format: int32
      additionalProperties: false
      description: Request model for executing a query by ID.
