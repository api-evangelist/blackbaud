        date_added:
          type: string
          description: When the query was added
          format: date-time
        last_changed_by:
          type:
          - string
          - 'null'
          description: The name of the user that last changed the query
        date_changed:
          type: string
          description: When the query was last changed
          format: date-time
        select_from_query_name:
