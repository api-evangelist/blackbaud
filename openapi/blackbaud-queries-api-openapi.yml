openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: Query Queries API'
  description: This API supports defining and executing queries for NXT products
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/query
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/query
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Queries
paths:
  /queries:
    post:
      operationId: AddQuery
      summary: Query
      description: Adds a query.
      parameters:
      - name: product
        in: query
        required: true
        schema:
          type: string
          enum:
          - RE
          - FE
        description: The Blackbaud product for the request<p>Members:</p><ul><li><i>RE</i> - The Raiser's Edge</li><li><i>FE</i> - The Financial Edge</li></ul>
      - name: module
        in: query
        required: true
        schema:
          type: string
          enum:
          - None
          - GeneralLedger
          - AccountsPayable
          - AccountsReceivable
          - FixedAssets
          - CashReceipts
        description: The module for the request (RE requests must use 'None', FE requests require one of the other values)<p>Members:</p><ul><li><i>None</i></li><li><i>GeneralLedger</i></li><li><i>AccountsPayable</i></li><li><i>AccountsReceivable</i></li><li><i>FixedAssets</i></li><li><i>CashReceipts</i></li></ul>
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryAdd'
        description: The query to add.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: 53CEEC04-3FAA-47D2-B112-D4A997A7F99D
        '400':
          description: Returned when the request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/QueryWriteErrorCodes'
              example:
                type: urn:blackbaud:missing-product
                title: One or more validation errors occurred.
                status: 400
                detail: Product was not supplied.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have permission to add the query.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:forbidden
                title: The requested action is forbidden.
                status: 403
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
      tags:
      - Queries
    get:
      operationId: GetQueryList
      summary: Query list
      description: Gets a list of queries.
      parameters:
      - name: product
        in: query
        required: true
        schema:
          type: string
          enum:
          - RE
          - FE
        description: The Blackbaud product for the request<p>Members:</p><ul><li><i>RE</i> - The Raiser's Edge</li><li><i>FE</i> - The Financial Edge</li></ul>
      - name: module
        in: query
        required: true
        schema:
          type: string
          enum:
          - None
          - GeneralLedger
          - AccountsPayable
          - AccountsReceivable
          - FixedAssets
          - CashReceipts
        description: The module for the request (RE requests must use 'None', FE requests require one of the other values)<p>Members:</p><ul><li><i>None</i></li><li><i>GeneralLedger</i></li><li><i>AccountsPayable</i></li><li><i>AccountsReceivable</i></li><li><i>FixedAssets</i></li><li><i>CashReceipts</i></li></ul>
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip.
      - name: query_type_id
        in: query
        required: false
        schema:
          type: integer
        description: Filter down to results with a specific query type
      - name: category
        in: query
        required: false
        schema:
          type: integer
        description: The category ID of the query used for filtering.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: '50'
        description: Represents the number of records to return.  Default 50, max 200.
      - name: search_text
        in: query
        required: false
        schema:
          type: string
        description: Filters to queries where the name contains the specified value (case-insensitive).
      - name: merged_queries_only
        in: query
        required: false
        schema:
          type: boolean
          default: 'false'
        description: Whether to filter down to only merged queries
      - name: my_queries_only
        in: query
        required: false
        schema:
          type: boolean
          default: 'false'
        description: Whether to filter down to only queries I created
      - name: query_type_ids
        in: query
        required: false
        schema:
          type: array
        description: Filter down to results with a list of specific query types
      - name: query_format
        in: query
        required: false
        schema:
          type: string
          enum:
          - Dynamic
          - Static
        description: Filter down to results with a specific query format
      - name: sort_descending
        in: query
        required: false
        schema:
          type: boolean
          default: 'false'
        description: Represents the direction to sort by.
      - name: sort_column
        in: query
        required: false
        schema:
          type: string
          enum:
          - Name
          - DateLastRun
          - DateChanged
          - ElapsedMs
          - DateAdded
          - AddedBy
          - LastChangedBy
          - Records
        description: Represents the column to sort by.  Default is Name.
      - name: list_queries
        in: query
        required: false
        schema:
          type: string
          enum:
          - Unset
          - NoListQueries
        description: Filter for excluding Query List queries (only applicable to RE).
      - name: my_fav_queries_only
        in: query
        required: false
        schema:
          type: boolean
          default: 'false'
        description: Whether to filter down to only my favorite queries.
      - name: date_added
        in: query
        required: false
        schema:
          type: string
        description: Filter down to results with a specific date when records were created.
      - name: added_by
        in: query
        required: false
        schema:
          type: string
        description: Filter down to results with a specific added by legacy user ID.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetQueryListResponse'
              example:
                queries:
                - id: 1
                  type: Constituent
                  added_by: Supervisor
                  date_added: '2022-12-19T09:42:48Z'
                  last_changed_by: Supervisor
                  date_changed: '2022-12-24T10:10:00Z'
                  category: General
                  query_list: false
                  can_modify: true
                  can_execute: true
                  view_supported: false
                  edit_supported: false
                  supported_execution_modes: Both
                  favorite: false
                  created_by_query: true
                  has_ask_fields: false
                  name: Board Members
                  description: Constituents who are board members
                  format: Static
                  others_can_execute: true
                  others_can_modify: true
                  category_id: 1
                  output_limit:
                    type: TopNumberRows
                    limit: 100
                  date_last_run: '2023-01-05T12:00:00Z'
                  elapsed_ms: 59
                  num_records: 100
                  type_id: 18
                  suppress_duplicates: true
                  constituent_filters:
                    include_inactive: true
                    include_deceased: true
                    include_no_valid_addresses: true
                  result_layout: MultiRow
                - id: 2
                  type: Appeal
                  added_by: Robert Hernandez
                  date_added: '2022-08-23T11:14:53Z'
                  last_changed_by: Jane Smith
                  date_changed: '2023-02-13T04:33:08Z'
                  select_from_query_name: Recent appeals
                  category: Important queries
                  query_list: false
                  can_modify: false
                  can_execute: true
                  view_supported: true
                  edit_supported: true
                  supported_execution_modes: Both
                  favorite: false
                  created_by_query: true
                  has_ask_fields: false
                  name: Appeal search for Supervisor
                  description: Used by the Search Screen for output and sorting.
                  format: Dynamic
                  others_can_execute: false
                  others_can_modify: false
                  category_id: 2
                  date_last_run: '2023-02-13T12:00:00Z'
                  elapsed_ms: 600
                  num_records: 493
                  type_id: 7
                  select_from_query_id: 5
                  suppress_duplicates: false
                  constituent_filters:
                    include_inactive: true
                    include_deceased: true
                    include_no_valid_addresses: true
                  result_layout: MultiRow
                any_query_types: true
                count: 55
                limit: 50
                offset: 0
        '400':
          description: Returned when the request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/GetQueryListErrorCodes'
              example:
                type: urn:blackbaud:missing-product
                title: One or more validation errors occurred.
                status: 400
                detail: Product was not supplied.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have permission to access the query list.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:forbidden
                title: The requested action is forbidden.
                status: 403
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
      tags:
      - Queries
  /queries/execute:
    post:
      operationId: StartQueryExecutionJob
      summary: Query execution job (Ad-hoc)
      description: Creates a background job to execute a query provided with the request. For RE requests, the Analysis - Query - Export permission is required to use this endpoint.
      parameters:
      - name: product
        in: query
        required: true
        schema:
          type: string
          enum:
          - RE
          - FE
        description: The Blackbaud product for the request<p>Members:</p><ul><li><i>RE</i> - The Raiser's Edge</li><li><i>FE</i> - The Financial Edge</li></ul>
      - name: module
        in: query
        required: true
        schema:
          type: string
          enum:
          - None
          - GeneralLedger
          - AccountsPayable
          - AccountsReceivable
          - FixedAssets
          - CashReceipts
        description: The module for the request (RE requests must use 'None', FE requests require one of the other values)<p>Members:</p><ul><li><i>None</i></li><li><i>GeneralLedger</i></li><li><i>AccountsPayable</i></li><li><i>AccountsReceivable</i></li><li><i>FixedAssets</i></li><li><i>CashReceipts</i></li></ul>
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteQueryRequest'
        description: The ExecuteQueryRequest
      responses:
        '200':
          description: The response body contains the background job identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteQueryResponse'
        '400':
          description: Returned when the request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ExecuteQueryErrorCodes'
              example:
                type: urn:blackbaud:invalid-address-type
                title: One or more validation errors occurred.
                status: 400
                detail: The type Home is not valid for this address.
                values:
                  type: Home
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have permission to execute the query.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:forbidden
                title: The requested action is forbidden.
                status: 403
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
      tags:
      - Queries
  /queries/executebyid:
    post:
      operationId: StartQueryExecutionJobByID
      summary: Query execution job (by ID)
      description: Creates a background job to execute a query specified by ID. For RE requests, the Analysis - Query - Export permission is required to use this endpoint.
      parameters:
      - name: product
        in: query
        required: true
        schema:
          type: string
          enum:
          - RE
          - FE
        description: The Blackbaud product for the request<p>Members:</p><ul><li><i>RE</i> - The Raiser's Edge</li><li><i>FE</i> - The Financial Edge</li></ul>
      - name: module
        in: query
        required: true
        schema:
          type: string
          enum:
          - None
          - GeneralLedger
          - AccountsPayable
          - AccountsReceivable
          - FixedAssets
          - CashReceipts
        description: The module for the request (RE requests must use 'None', FE requests require one of the other values)<p>Members:</p><ul><li><i>None</i></li><li><i>GeneralLedger</i></li><li><i>AccountsPayable</i></li><li><i>AccountsReceivable</i></li><li><i>FixedAssets</i></li><li><i>CashReceipts</i></li></ul>
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteQueryByIdRequest'
            example:
              id: 1
              ux_mode: Asynchronous
              output_format: Csv
              formatting_mode: UI
              sql_generation_mode: Query
              use_static_query_id_set: false
              ask_fields:
              - filter_values:
                - Robert
                operator: Equals
              time_zone_offset_in_minutes: 120
        description: The ExecuteQueryByIdRequest
      responses:
        '200':
          description: The response body contains the background job identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteQueryResponse'
        '400':
          description: Returned when the request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ExecuteQueryByIdErrorCodes'
              example:
                type: urn:blackbaud:invalid-address-type
                title: One or more validation errors occurred.
                status: 400
                detail: The type Home is not valid for this address.
                values:
                  type: Home
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have permission to execute the query.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:forbidden
                title: The requested action is forbidden.
                status: 403
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '404':
          description: Returned when a query with the given identifier does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:resource-not-found
                title: The requested resource could not be found.
                status: 404
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
      tags:
      - Queries
  /queries/refreshstaticquery:
    post:
      operationId: StartRefreshStaticQueryByID
      summary: Refresh static query execution job
      description: Creates a background job to refresh the saved keys for a static query specified by ID.
      parameters:
      - name: product
        in: query
        required: true
        schema:
          type: string
          enum:
          - RE
          - FE
        description: The Blackbaud product for the request<p>Members:</p><ul><li><i>RE</i> - The Raiser's Edge</li><li><i>FE</i> - The Financial Edge</li></ul>
      - name: module
        in: query
        required: true
        schema:
          type: string
          enum:
          - None
          - GeneralLedger
          - AccountsPayable
          - AccountsReceivable
          - FixedAssets
          - CashReceipts
        description: The module for the request (RE requests must use 'None', FE requests require one of the other values)<p>Members:</p><ul><li><i>None</i></li><li><i>GeneralLedger</i></li><li><i>AccountsPayable</i></li><li><i>AccountsReceivable</i></li><li><i>FixedAssets</i></li><li><i>CashReceipts</i></li></ul>
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshStaticQueryRequest'
            example:
              id: 1
              ux_mode: Asynchronous
              ask_fields:
              - filter_values:
                - Sample
                operator: Equals
              time_zone_offset_in_minutes: 120
        description: The RefreshStaticQueryRequest
      responses:
        '200':
          description: The response body contains the background job identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteQueryResponse'
        '400':
          description: Returned when the request is invalid.
          content:
            application/problem+json:
              schema:
