nique within organization address processing.</td></tr><tr><td>urn:blackbaud:invalid-duplicate-contact-type-value</td><td>All contact types must be unique within contact address processing.</td></tr><tr><td>urn:blackbaud:head-of-household-processing-requires-single-row-layout</td><td>head_of_household_option is not supported for multi-row result layout queries.</td></tr><tr><td>urn:blackbaud:addr-sal-formatting-options-require-single-row</td><td>addr_sal_formatting_options at {0} is only supported for queries using a single row result layout.</td></tr><tr><td>urn:blackbaud:addr-sal-formatting-options-invalid-field</td><td>addr_sal_formatting_options at {0} is only valid on a configurable Addressee or Salutation query field.</td></tr><tr><td>urn:blackbaud:addr-sal-type-id-required</td><td>{0} requires a type_id when source is SpecificAddrSalType.</td></tr><tr><td>urn:blackbaud:addr-sal-type-id-invalid</td><td>{0} may only set type_id when source is SpecificAddrSalType.</td></tr><tr><td>urn:blackbaud:addr-sal-individual-name-required</td><td>{0} is required when addr_sal_ind_format is FromIndividual.</td></tr><tr><td>urn:blackbaud:addr-sal-individual-name-invalid</td><td>{0} may only be set when addr_sal_ind_format is FromIndividual.</td></tr><tr><td>urn:blackbaud:addr-sal-config-type-required</td><td>{0} is required when addr_sal_ind_format is FromConfiguration.</td></tr><tr><td>urn:blackbaud:addr-sal-config-type-invalid</td><td>{0} may only be set when addr_sal_ind_format is FromConfiguration.</td></tr><tr><td>urn:blackbaud:field-context-not-allowed</td><td>Query field {0} referenced at {1} is not allowed to be used as a {2} field.</td></tr><tr><td>urn:blackbaud:select-from-query-result-layout-not-allowed</td><td>A multi-row query cannot select from a single-row query.</td></tr><tr><td>urn:blackbaud:merge-query-result-layout-not-allowed</td><td>A multi-row merged query cannot merge a single-row query.</td></tr><tr><td>urn:blackbaud:required-field</td><td>The required field ''{0}'' does not have a value.</td></tr><tr><td>urn:blackbaud:null-collection-item</td><td>One or more items in the ''{0}'' collection are null.</td></tr><tr><td>urn:blackbaud:duplicate-values</td><td>The ''{0}'' collection has duplicate values.</td></tr><tr><td>urn:blackbaud:invalid-value</td><td>''{0}'' is not a valid value for {1}.</td></tr><tr><td>urn:blackbaud:invalid-string-length</td><td>The value provided for {0} must be {1} characters or less.</td></tr><tr><td>urn:blackbaud:invalid-integer-value</td><td>{0} is not a valid value for {1}.</td></tr><tr><td>urn:blackbaud:empty-or-white-space-value</td><td>The field ''{0}'' is empty or whitespace.</td></tr><tr><td>urn:blackbaud:flexible-date-not-valid</td><td>The flexible date field ''{0}'' is not valid.</td></tr></table>'
