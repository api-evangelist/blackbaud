    UXMode:
      enum:
      - Synchronous
      - Asynchronous
      type: string
      description: "User experience mode<p>Members:</p><ul><li><i>Synchronous</i> - Use this mode when an end-user is waiting on the job results.  The consumer will poll the job status until completion.\n            If the job gets throttled, you will receive a 429 response and the job will not be queued.  NOTE:  You\n            must poll the job status using GET Query execution job at least every 10 seconds until the job completes\n            or the job will be cancelled due to inactivity.</li><li><i>Asynchronous</i> - Use this mode when no end-user is waiting on the job results.  The consumer will poll the job status until completion.\n            If the job gets throttled, the job will still be queued, up to a cap on the number of queued jobs.  (There are no polling\n            requirements in this mode.)</li></ul>"
