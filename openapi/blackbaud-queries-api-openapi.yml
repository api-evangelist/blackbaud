          - string
          - 'null'
          description: The name of a query used as a base select for the query
        category:
          type:
          - string
          - 'null'
          description: The category in which this query appears
        query_list:
          type: boolean
          description: True if the query is a Query List query. Applies To Raiser's Edge only.
        can_modify:
          type: boolean
          description: True if the user that requested the query can modify it
        can_execute:
          type: boolean
          description: True if the user that requested the query can execute it
        view_supported:
          type: boolean
          description: True if viewing the query is supported
        edit_supported:
          type: boolean
          description: True if editing the query is supported (based on its current query fields).
        supported_execution_modes:
          $ref: '#/components/schemas/ExecutionModes'
        favorite:
          type: boolean
          description: True if this is a favorite query for user.
        created_by_query:
          type: boolean
          description: True if the query was created within the query module. False otherwise.
        has_ask_fields:
          type: boolean
          description: True if the query includes any filter fields with the ask operator
        name:
          type:
          - string
          - 'null'
          description: The unique name of the query
        description:
          type:
          - string
          - 'null'
          description: Description of the query
        format:
          $ref: '#/components/schemas/QueryFormat'
        others_can_execute:
          type: boolean
          description: Whether users other than the user that created the query can execute the query
        others_can_modify:
          type: boolean
          description: Whether users other than the user that created the query can modify the query
        category_id:
          type: integer
          description: The category identifier in which this query appears. Default to 1 for the General query category.
          format: int32
        output_limit:
          $ref: '#/components/schemas/OutputLimit'
        date_last_run:
          type:
          - string
          - 'null'
          description: The date the query was last executed
          format: date-time
        elapsed_ms:
          type:
          - integer
          - 'null'
          description: The elapsed milliseconds for the last execution
          format: int32
        num_records:
          type:
          - integer
          - 'null'
          description: The number of records resulting from the last execution
          format: int32
        type_id:
          type: integer
          description: The ID of the query type
          format: int32
        select_from_query_id:
          type:
          - integer
          - 'null'
          description: The ID of a query used as a base select for this query
          format: int32
        suppress_duplicates:
          type: boolean
          description: Whether to suppress duplicate (base) records in the query results
        constituent_filters:
          $ref: '#/components/schemas/ConstituentFilters'
        result_layout:
          $ref: '#/components/schemas/ResultLayout'
      additionalProperties: false
      description: Summary model of a query definition
    MatchingGiftCreditOption:
      enum:
      - Donor
      - MatchingGiftCompany
      - Both
      type: string
      description: Match Credit Options<p>Members:</p><ul><li><i>Donor</i></li><li><i>MatchingGiftCompany</i></li><li><i>Both</i></li></ul>
    OutputFormat:
      enum:
      - Csv
      - Json
      - Jsonl
      - Xlsx
      type: string
      description: Output format<p>Members:</p><ul><li><i>Csv</i> - Comma-separated values</li><li><i>Json</i> - JSON array</li><li><i>Jsonl</i> - JSON lines</li><li><i>Xlsx</i> - Excel</li></ul>
    AskFieldInformation:
      type: object
      properties:
        filter_values:
          type:
          - array
