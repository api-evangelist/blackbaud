      operationId: DeleteQuery
      summary: Query
      description: Delete a query by ID.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Query ID
      - name: product
        in: query
        required: true
        schema:
          type: string
          enum:
          - RE
