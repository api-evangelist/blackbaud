components:
  schemas:
    AddrSalIndFormat:
      enum:
      - FromIndividual
      - FromConfiguration
      - UseIndividualName
      type: string
      description: How the individual name portion of an Addressee/Salutation field is determined.<p>Members:</p><ul><li><i>FromIndividual</i> - Look up the addressee/salutation type from the record, using AddrSalFormattingOptions.IndividualNameIfPresent if present and AddrSalFormattingOptions.IndividualNameOtherwise otherwise. Default when unspecified, matching the DBView UI default.</li><li><i>FromConfiguration</i> - Use the system-configured addressee/salutation type identified by AddrSalFormattingOptions.ConfigAddrSalToUse.</li><li><i>UseIndividualName</i> - Use the record's full name (last-name-first).</li></ul>
    SoftCreditSubOption:
      enum:
      - UseAmountInGrid
      - FullAmountToAll
      - SplitEvenly
      type: string
      description: Soft credit suboptions for the distributions<p>Members:</p><ul><li><i>UseAmountInGrid</i></li><li><i>FullAmountToAll</i></li><li><i>SplitEvenly</i></li></ul>
    OutputLimit:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/OutputLimitType'
        limit:
          type: integer
          description: The number or percent of rows to save (depending on the specified OutputLimitType)
          format: int32
      additionalProperties: false
      description: A limit on the number of rows saved for a static query
    NodeType:
      enum:
      - OneToOne
      - OneToMany
      - Summary
      type: string
      description: Classifications of nodes in the available fields trees.<p>Members:</p><ul><li><i>OneToOne</i> - A nodes which has a 1:1 relationship with its parent node.</li><li><i>OneToMany</i> - A node which has a 1:many relationship with its parent node.</li><li><i>Summary</i> - A node which provides summary information about records returned from its parent node.</li></ul>
    HeadOfHouseholdOption:
      enum:
      - BothHouseholdMembers
      - HeadOfHouseholdOnly
      type: string
      description: Head of Household processing options<p>Members:</p><ul><li><i>BothHouseholdMembers</i></li><li><i>HeadOfHouseholdOnly</i></li></ul>
    AddressTypeEnum:
      enum:
      - SpecificAddressType
      - SpousePreferred
      - SpousePrimaryBusiness
      - PrimaryBusiness
      - FirstInList
      - Preferred
      - None
      type: string
      description: Denotes which address to use for the address processing when one isn't found<p>Members:</p><ul><li><i>SpecificAddressType</i></li><li><i>SpousePreferred</i></li><li><i>SpousePrimaryBusiness</i></li><li><i>PrimaryBusiness</i></li><li><i>FirstInList</i></li><li><i>Preferred</i></li><li><i>None</i></li></ul>
    SummaryFieldRead:
      required:
      - query_field_id
      - summary_instance
      type: object
      properties:
        filter_fields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/FilterFieldRead'
          description: The filters on this summary field
        query_field_id:
          type: integer
          description: The query field ID of the summary field
          format: int32
        summary_instance:
          type: integer
          description: 'An additional identifier to differentiate multiple instances of the same summary field (query_field_id) used on a query.

            The combinations of query_field_id and summary_instance must be unique in the collection of summary_fields on a query.

            This value becomes part of the field name in the query UI (again, to differentiate multiple instances of the same summary field on the query),

            so it is recommended to start your sequence at 1 for each query_field_id and proceed sequentially for any additional instances of the same query_field_id.'
          format: int32
      additionalProperties: false
      description: Definition of a summary field.  Select, output, and sort fields reference these by query_field_id and summary_instance.
    ExecuteQueryDefinition:
      required:
      - type_id
      type: object
      properties:
        select_fields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SelectFieldWrite'
          description: The select fields of the query (SELECT clause)
        filter_fields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/FilterFieldWrite'
          description: The filter fields of the query (WHERE clause)
        sort_fields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SortFieldWrite'
          description: The sort fields of the query (ORDER BY clause)
        summary_fields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SummaryFieldWrite'
          description: The summary fields of the query, which are typically aggregations or totals related to the query record type.
        child_selects:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ChildSelectWrite'
          description: PREVIEW.  Subqueries for a query using the SingleRow result_layout.  (This is a PREVIEW property that may change or get removed at any time.)
        type_id:
          type: integer
          description: The query type ID
          format: int32
        sql_generation_mode:
          $ref: '#/components/schemas/SqlGenerationMode'
        gift_processing_options:
          $ref: '#/components/schemas/GiftProcessingOptions'
        advanced_processing_options:
          $ref: '#/components/schemas/AdvancedProcessingOptions'
        address_processing_configuration:
          $ref: '#/components/schemas/AddressProcessingConfiguration'
        select_from_query_id:
          type:
          - integer
          - 'null'
          description: The ID of a query used as a base select for this query
          format: int32
        suppress_duplicates:
          type: boolean
          description: Whether to suppress duplicate (base) records in the query results
        constituent_filters:
          $ref: '#/components/schemas/ConstituentFilters'
        result_layout:
          $ref: '#/components/schemas/ResultLayout'
      additionalProperties: false
      description: Query fields for a query execution request
    QueryAdd:
      required:
      - format
      - name
      - type_id
      type: object
      properties:
        name:
          minLength: 1
          type: string
          description: The unique name of the query
        format:
          $ref: '#/components/schemas/QueryFormat'
        type_id:
          type: integer
          description: The type identifier of the query corresponding to types like as Constituent or Invoice
          format: int32
        select_fields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SelectFieldWrite'
          description: The select fields of the query (SELECT clause)
        filter_fields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/FilterFieldWrite'
          description: The filter fields of the query (WHERE clause)
        sort_fields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SortFieldWrite'
          description: The sort fields of the query (ORDER BY clause)
        merged_query_details:
          $ref: '#/components/schemas/MergedQueryDetails'
        gift_processing_options:
          $ref: '#/components/schemas/GiftProcessingOptions'
        advanced_processing_options:
          $ref: '#/components/schemas/AdvancedProcessingOptions'
        summary_fields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SummaryFieldWrite'
          description: 'Any summary fields present in the query, which are typically aggregations or totals related to the query record type.

            The objects present in this collection must have unique combinations of query_field_id and summary_instance.'
        address_processing_configuration:
          $ref: '#/components/schemas/AddressProcessingConfiguration'
        child_selects:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ChildSelectWrite'
          description: "PREVIEW.  A tree of subqueries for a query using the SingleRow result_layout.  (This is a PREVIEW property that may change or get removed at any time.)\nThe structure of this tree must align with the structure of the available fields tree for this query's type.\nThe fields referenced by a node (ChildSelectWrite) will be used to determine the available fields tree node\nrepresented by that node and all of its parent nodes.  These rules must be followed:\n- All select fields referenced by a given node must be from the same node of the available fields tree.\n  The depth of that node in the available fields tree must match the depth of the node in the child_selects tree.\n- Filter and sort fields may reference either the node's own available fields tree node or a strict descendant of it\n  (for example, a Gifts node may filter or sort by Fund, Campaign, or Appeal).\n- Nodes along the same path (that have a parent-child, grandparent-grandchild, etc. relationship) must have the same\nrelationship as in the available fields tree.  For example, in a Constituent query, if you have a top-level node referencing\nfields from the Gifts node, any child nodes underneath that node can only reference fields from available fields tree nodes\nthat are children of the Gifts node.\n- Multiple instances of nodes with a 1:many relationship to their parent are allowed (for example, you can have multiple Gifts\nnodes in a Constituent query).  Only one instance of a node with a 1:1 relationship with its parent is allowed (for example, you\ncan only have one Constituent Information node in a Constituent query).  Summary nodes (for example, Last Gift), while 1:1,\nalso support multiple instances since you can define different sets of criteria that define first/last/largest/etc.  See the\nnode_type property of available fields tree nodes."
        description:
          type:
          - string
          - 'null'
          description: Description of the query
        others_can_execute:
          type: boolean
          description: Whether users other than the user that created the query can execute the query
        others_can_modify:
          type: boolean
          description: Whether users other than the user that created the query can modify the query
        category_id:
          type: integer
          description: The category identifier in which this query appears. Default to 1 for the General query category.
          format: int32
        output_limit:
          $ref: '#/components/schemas/OutputLimit'
        date_last_run:
          type:
          - string
          - 'null'
          description: The date the query was last executed
          format: date-time
        elapsed_ms:
          type:
          - integer
          - 'null'
          description: The elapsed milliseconds for the last execution
          format: int32
        num_records:
          type:
          - integer
          - 'null'
          description: The number of records resulting from the last execution
          format: int32
        select_from_query_id:
          type:
          - integer
          - 'null'
          description: The ID of a query used as a base select for this query
          format: int32
        suppress_duplicates:
          type: boolean
          description: Whether to suppress duplicate (base) records in the query results
        constituent_filters:
          $ref: '#/components/schemas/ConstituentFilters'
        result_layout:
          $ref: '#/components/schemas/ResultLayout'
      additionalProperties: false
      description: Model of a query add
    MergedQueryDetailsRead:
      type: object
      properties:
        query1_name:
          type:
          - string
          - 'null'
          description: The name of the first merged query
        query2_name:
          type:
          - string
          - 'null'
          description: The name of the second merged query
        query1_id:
          type: integer
          description: The ID of the first merged query
          format: int32
        query2_id:
          type: integer
          description: The ID of the second merged query
          format: int32
        operator:
          $ref: '#/components/schemas/MergeOperator'
      additionalProperties: false
      description: Details for queries that merge two other queries to create a base select
    ChildSelectWrite:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          description: 'A name for this subquery.

            Only applicable for nodes that have a 1:many or summary relationship with their parent.

            If no value is provided for an applicable node, the system will assign a default name to the node.

            The default name will consist of the name of the corresponding node from the available fields tree, followed by a unique sequence number.'
        count:
          type:
          - integer
          - 'null'
          description: 'The number of child items to include in the query results.

            Required for nodes that have a 1:many relationship with their parent.'
          format: int32
        gift_processing_options:
          $ref: '#/components/schemas/ChildSelectGiftProcessingOptions'
        select_from_query_id:
          type:
          - integer
          - 'null'
          description: 'The ID of a query whose results this subquery selects from, i.e. "only include records found by

            this other query". Behaves the same way as the query-level select-from, but scoped to this node.

            Only valid on nodes that report a non-empty

            SelectFromQueryTypeIds, and the referenced query must be of one of

            those types (currently Gift nodes referencing Gift queries).

            Negative IDs are web view queries; positive IDs are database view queries.

            On a gift summary node the select-from restricts the candidate gifts before the node picks from

            them, so a filtered First Gift reports the earliest gift found by the referenced query rather

            than the earliest gift overall. A Summary node''s select fields are collapsed onto an ancestor

            during mapping (GenericQueryMapper.MapChildSelectsForExecuteAsync), so the ID reaches SQL

            generation through a carrier rather than a per-node context, exactly as

            GiftProcessingOptions does.'
          format: int32
        select_fields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SelectFieldWrite'
          description: The select fields of the subquery (SELECT clause)
        filter_fields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/FilterFieldWrite'
          description: 'The filters of the subquery (WHERE clause).

            Only applicable for nodes that have a 1:many or summary relationship with their parent.

            Filter fields may reference the node''s own available fields tree node or a strict descendant of it

            (for example, a Gifts node may filter by Fund, Campaign, or Appeal).'
        sort_fields:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/SortFieldWrite'
          description: 'The sort fields of the subquery (ORDER BY clause).

            Only applicable for nodes that have a 1:many relationship with their parent.

            Sort fields may reference the node''s own available fields tree node or a strict descendant of it

            (for example, a Gifts node may sort by Fund name).'
        child_selects:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/ChildSelectWrite'
          description: Subqueries under this subquery
      additionalProperties: false
      description: A subquery for a single-row result query.
    AddrSalNameSource:
      enum:
      - Name
      - PrimaryAddresseeType
      - PrimarySalutationType
      - SpecificAddrSalType
      type: string
      description: Well-known sources for the individual name used when formatting an Addressee or Salutation field.<p>Members:</p><ul><li><i>Name</i> - Use the constituent's <Name> as the final fallback. Default when unspecified, since unlike SpecificAddrSalType it requires no additional data.</li><li><i>PrimaryAddresseeType</i> - Use the record's primary addressee type.</li><li><i>PrimarySalutationType</i> - Use the record's primary salutation type.</li><li><i>SpecificAddrSalType</i> - Use the Addr/Sal Types code table entry identified by AddrSalNameOption.TypeId.</li></ul>
    ExecuteQueryRequest:
      required:
      - query
      type: object
      properties:
        query:
          $ref: '#/components/schemas/ExecuteQueryDefinition'
        ux_mode:
          $ref: '#/components/schemas/UXMode'
        output_format:
          $ref: '#/components/schemas/OutputFormat'
        formatting_mode:
          $ref: '#/components/schemas/FormattingMode'
        results_file_name:
          type:
          - string
          - 'null'
          description: Name of the file to be downloaded, without the file extension.
        display_code_table_long_description:
          type:
          - boolean
          - 'null'
          description: 'Display code table entries by long description (instead of short description).

            Optional override of the same-named stored setting in UserOptions.'
        time_zone_offset_in_minutes:
          type:
          - integer
          - 'null'
          description: Optional time zone offset in minutes to account for the user's offset from UTC, used for relative date filter values.
          format: int32
      additionalProperties: false
      description: Request for executing a query
    ResultLayout:
      enum:
      - MultiRow
      - SingleRow
      type: string
      description: "Layout of the query result: single-row or multi-row.<p>Members:</p><ul><li><i>MultiRow</i> - Result layout for queries that may return multiple rows of data for each base table row. (RE7 Query)\n            Queries using this layout will use select_fields to specify the desired output.</li><li><i>SingleRow</i> - Result layout for queries that always return a single row of data for each base table row. (RE7 Export)\n            Queries using this layout will use child_selects to specify the desired output.</li></ul>"
    QueryField:
      type: object
      properties:
        id:
          type: integer
          description: ID of the field
          format: int32
        available_field_name:
          type:
          - string
          - 'null'
          description: The name of the field to display in the available fields list
        selected_field_name:
          type:
          - string
          - 'null'
          description: The name of the field to display when the field is selected for filter, output, or sort
        unique_id:
          type:
          - string
          - 'null'
          description: The attribute type ID, or the specific type ID
        attribute_type_of_data:
          $ref: '#/components/schemas/AttributeValueType'
        value_type:
          $ref: '#/components/schemas/QueryValueType'
        one_to_many:
          type: boolean
          description: Indicates if the field has a one-to-many relationship with the query's base type.
        output_sort_can_add_edit:
          type: boolean
          description: True if add/edit is supported on the output and sort tabs
        criteria_can_add_edit:
          type: boolean
          description: True if add/edit is supported on the criteria tab
        execute_by_id_supported:
          type: boolean
          description: True if a query that references this field can be executed by ID
        allowed_filter_operators:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AllowedFilterOperators'
          description: The set of allowed filter operators for this field.
        additional_properties:
          description: Additional properties of the query field
        node_path:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/QueryNodeBase'
          description: 'The chain of ancestor nodes for this field, ordered from the field''s immediate parent up to the root node.

            Each entry exposes the node''s ID, localized name, and node type. The field itself is not included.'
        summary_value_type:
          $ref: '#/components/schemas/QueryValueType'
        summary_has_available_fields:
          type:
          - boolean
          - 'null'
          description: Whether the field is a Summary field that has child filters available.
          readOnly: true
        summary_has_default_filters:
          type:
          - boolean
          - 'null'
          description: Whether the field is an FE Summary field that has default filters applied.
          readOnly: true
        address_processing:
          type: boolean
          description: Whether the field is an RE Address Processing field.
        web_view_only:
          type: boolean
          description: Whether the field is only available in web view.
        help_text:
          type:
          - string
          - 'null'
          description: Optional help text describing how the field behaves, suitable for display in a popover.
      additionalProperties: false
      description: A field available for use in a query
    AddrSalFormattingOptions:
      type: object
      properties:
        addr_sal_ind_format:
          $ref: '#/components/schemas/AddrSalIndFormat'
        individual_name_if_present:
          $ref: '#/components/schemas/AddrSalNameOption'
        individual_name_otherwise:
          $ref: '#/components/schemas/AddrSalNameOption'
        config_addr_sal_to_use:
          type:
          - integer
          - 'null'
          description: 'The Addr/Sal Types code table entry to use for all individual records.

            Used when AddrSalIndFormat is FromConfiguration.'
          format: int32
        addr_sal_org_format:
          $ref: '#/components/schemas/AddrSalOrgFormat'
        include_constituent_id:
          type: boolean
          description: Whether to include the constituent ID alongside the organization name.
      additionalProperties: false
      description: 'User-configurable formatting options for a configurable Addressee or Salutation query field

        (see FieldFormatterType).'
    ChildSelectGiftProcessingOptions:
      type: object
      properties:
        exclude_zero_amount_gifts:
          type:
          - boolean
          - 'null'
          description: Excludes gifts with a zero amount.
        use_sale_date_for_stock:
          type:
          - boolean
          - 'null'
          description: Uses the sale date instead of the gift date for sold stock/property gifts.
        use_sale_amount_for_stock:
          type:
          - boolean
          - 'null'
          description: Uses the sale amount instead of the gift amount for sold stock/property gifts.
        subtract_broker_fees_for_stock:
          type:
          - boolean
          - 'null'
          description: 'Subtracts the broker fee from the sale amount for sold stock/property gifts.

            Only meaningful when UseSaleAmountForStock is also set.'
        use_gift_balance:
          type:
          - boolean
          - 'null'
          description: Uses the pledge balance instead of the gift amount for pledge/matching gift pledges.
        calculate_gift_balance_based_on_filters:
          type:
          - boolean
          - 'null'
          description: 'Calculates the gift balance using only payments matching the pledge''s date range, campaign,

            fund, and appeal, instead of all payments against the pledge.

            Accepted by validation, but has no effect on generated SQL: the RE7

            Gift_GetAmtSingle/Gift_GetPledgeBalance function chain''s @InstallmentPayFilterView and

            @CFAGroupByWhere parameters -- the only hook that could carry this filter into the legacy

            balance calculation -- were deprecated in 2002 (Gift_GetPledgeBalance''s filter-aware code is

            commented out; the live code sums every installment payment against the pledge

            unconditionally). Supporting this would require new, standalone SQL (matched/unmatched-payment

            CTEs) independent of that function chain, mirroring Standard Reports'' own

            GiftSqlCommandHelper implementation.'
        soft_credit_option:
          $ref: '#/components/schemas/SoftCreditOption'
        soft_credit_sub_option:
          $ref: '#/components/schemas/SoftCreditSubOption'
        matching_gift_credit_option:
          $ref: '#/components/schemas/MatchingGiftCreditOption'
        use_gross_amount_for_covenants:
          type: boolean
          description: Gift processing gross amount option for UK Gift Aid (Net or Gross amount)
      additionalProperties: false
      description: 'Node-level gift processing options specific to Gift Types checkboxes. Only valid on plain Gifts

        collection ChildSelect nodes whose metadata marks them as supporting GiftProcessingOptions --

        these fields have no query-level equivalent, unlike the base GiftProcessingOptions fields.'
    SortFieldWrite:
      type: object
      properties:
        query_field_id:
          type: integer
          description: ID of the query field
          format: int32
        unique_id:
          type:
          - string
          - 'null'
          description: The attribute type ID, or the specific type ID
        sort_order:
          $ref: '#/components/schemas/SortOrder'
        summary_instance:
          type:
          - integer
          - 'null'
          description: For sort fields referencing summary fields, the summary_instance of the summary field.
          format: int32
      additionalProperties: false
      description: A query field used for sorting the results (ORDER BY clause)
    FilterOperator:
      enum:
      - Equals
      - DoesNotEqual
      - GreaterThan
      - GreaterThanOrEqualTo
      - LessThan
      - LessThanOrEqualTo
      - OneOf
      - NotOneOf
      - Between
      - NotBetween
      - BeginsWith
      - DoesNotBeginWith
      - Contains
      - DoesNotContain
      - Like
      - NotLike
      - Blank
      - NotBlank
      - Ask
      - SoundsLike
      - Any
      - OneOfEach
      - InQueryResults
      - NotInQueryResults
      type: string
      description: Available filter operators<p>Members:</p><ul><li><i>Equals</i></li><li><i>DoesNotEqual</i></li><li><i>GreaterThan</i></li><li><i>GreaterThanOrEqualTo</i></li><li><i>LessThan</i></li><li><i>LessThanOrEqualTo</i></li><li><i>OneOf</i></li><li><i>NotOneOf</i></li><li><i>Between</i></li><li><i>NotBetween</i></li><li><i>BeginsWith</i></li><li><i>DoesNotBeginWith</i></li><li><i>Contains</i></li><li><i>DoesNotContain</i></li><li><i>Like</i></li><li><i>NotLike</i></li><li><i>Blank</i></li><li><i>NotBlank</i></li><li><i>Ask</i></li><li><i>SoundsLike</i></li><li><i>Any</i></li><li><i>OneOfEach</i></li><li><i>InQueryResults</i></li><li><i>NotInQueryResults</i></li></ul>
    FilterFieldWrite:
      type: object
      properties:
        query_field_id:
          type: integer
          description: ID of the query field
          format: int32
        unique_id:
          type:
          - string
          - 'null'
          description: The attribute type ID, or the specific type ID
        compare_type:
          $ref: '#/components/schemas/CompareType'
        filter_values:
          type:
          - array
          - 'null'
          items:
            type: object
          description: "Values for the filter.\n\nThe filter operator determines the required number of values:\n- Blank, NotBlank, Ask, Any: No values\n- OneOf, NotOneOf, OneOfEach: One or more values\n- Between, NotBetween: Two values in the desired order\n- All others: One value\n\nThe value_type of the query field determines the type of the value(s):\n- Text: string, int32, or double, depending on the field\n- Boolean: boolean\n- Date: date-time or one of the relative date values for Date fields listed below\n- FuzzyDate: FuzzyDate (an object with optional properties \"day\", \"month\", and \"year\") or one of the relative date values for FuzzyDate fields listed below. \n    The query field's additional_properties entry for yearRequired indicates whether or not the year is required when filtering by a specific FuzzyDate.\n- TableEntry, Lookup, Search, and StaticEntry: An object with properties \"id\" and \"description\" on GET; int32 on POST/PATCH (the ID of the record on which to filter)\n- Summary: Not yet supported\n\nRelative date values for Date fields:\n- Today\n- Yesterday\n- Tomorrow\n- ThisWeek\n- LastWeek\n- NextWeek\n- ThisMonth\n- LastMonth\n- NextMonth\n- MonthToDate\n- ThisQuarter\n- LastQuarter\n- NextQuarter\n- QuarterToDate\n- ThisYear\n- LastYear\n- NextYear\n- YearToDate\n\nSupplementary relative date values for Date fields (FE only):\n- EarliestFiscalYear\n- FiscalYearToDate\n- ThisFiscalPeriod\n- LastFiscalPeriod\n- NextFiscalPeriod\n- ThisFiscalYear\n- LastFiscalYear\n- NextFiscalYear\n\nRelative date values for FuzzyDate fields (RE only):\n- ThisMonth\n- LastMonth\n- NextMonth\n- ThisYear\n- LastYear\n- NextYear\n- January\n- February\n- March\n- April\n- May\n- June\n- July\n- August\n- September\n- October\n- November\n- December\n\nThe month values will match any fuzzy dates with that month (any year).\n\nThe valid values for Lookup, Search, and StaticEntries fields can be found using the Get lookup values endpoint.\nNote that that the filter_values returned when reading a query may contain a different type of value than the\ntype of value required when writing (described above).  For example, Lookup fields return an object containing\nthe ID and description on read, but should only contain the ID on write."
        operator:
          $ref: '#/components/schemas/FilterOperator'
        left_parenthesis:
          type: boolean
          description: Whether this field begins a group of filters enclosed in parentheses
        right_parenthesis:
          type: boolean
          description: Whether this field ends a group of filters enclosed in parentheses
        summary_instance:
          type:
          - integer
          - 'null'
          description: For filter fields referencing summary fields, the summary_instance of the summary field.
          format: int32
      additionalProperties: false
      description: A query field used for filtering records (WHERE clause)
    OutputLimitType:
      enum:
      - RandomSampling
      - TopNumberRows
      - TopPercentRows
      type: string
      description: The method of limiting the number of rows for a static query<p>Members:</p><ul><li><i>RandomSampling</i> - A random sampling of rows</li><li><i>TopNumberRows</i> - Top n rows</li><li><i>TopPercentRows</i> - Top n% of rows</li></ul>
    QuerySummary:
      type: object
      properties:
        id:
          type: integer
