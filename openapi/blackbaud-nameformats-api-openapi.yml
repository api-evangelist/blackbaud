openapi: 3.2.0
info:
  title: 'Blackbaud SKY API: Constituent Nameformats API'
  description: This API manages constituent information and related entities such as addresses, phones, emails, and notes.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/56b76470069a0509c8f1c5b3
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations, examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/constituent/v1
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Nameformats
paths:
  /nameformats:
    post:
      operationId: CreateConstituentNameFormat
      summary: Name format (Create)
      description: Creates a name format.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameFormatAdd'
            example:
              configuration_id: '47'
              constituent_id: '281'
              custom_format: false
              type: Email Greeting
        description: An object that represents the name format to create.
      responses:
        '200':
          description: Returned when the operation successfully creates an name format. The response body contains the ID of the new name format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
              example:
                id: '1281'
        '400':
          description: Returned when the request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to create the name format.
        '404':
          description: Returned when the specified constituent is not found.
      tags:
      - Nameformats
  /nameformats/{name_format_id}:
    delete:
      operationId: DeleteConstituentNameFormat
      summary: Name format (Delete)
      description: Deletes a constituent name format.
      parameters:
      - name: name_format_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the constituent name format to delete.
      responses:
        '200':
          description: Returned when the operation successfully deletes the name format.
        '400':
          description: Returned when the specified name format ID in the request URL is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to delete the name format.
      tags:
      - Nameformats
    patch:
      operationId: EditConstituentNameFormat
      summary: Name format (Edit)
      description: Edits a name format for a constituent.
      parameters:
      - name: name_format_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the name format to edit.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameFormatEdit'
            example:
              configuration_id: '47'
              custom_format: false
              type: Email Greeting
        description: An object that represents the properties of the name format to edit.
      responses:
        '200':
          description: Returned when the operation successfully edits the name format.
        '400':
          description: Returned when the specified name format ID in the request URL or the specified request parameters are not in the appropriate format.
        '404':
          description: Returned when the specified name format is not found.
      tags:
      - Nameformats
components:
  schemas:
    NameFormatAdd:
      description: Name formats define how to address constituents in communications. How you refer to individuals sets the tone of your communications with them and how well they receive your interactions.
      required:
      - constituent_id
      - type
      type: object
      properties:
        configuration_id:
          description: The name format configuration identifier. Required when custom_format is false.
          type: string
        constituent_id:
          description: The immutable system record ID of the constituent associated with the name format.
          type: string
        custom_format:
          description: Whether the name format uses a custom format. Defaults to false.
          type: boolean
        formatted_name:
          description: 'The name format formatted name. Required when custom_format is true. Character limit: 255.'
          maxLength: 255
          minLength: 0
          type: string
        type:
          description: The name format type. Available values are the entries in the <a href="https://developer.sky.blackbaud.com/docs/services/56b76470069a0509c8f1c5b3/operations/ListNameFormatTypes"><b>Addr/Sal Types</b></a> table.
          type: string
      x-hidden: true
      x-display-name: Create name format
      x-display-id: CreateNameFormat
    PostResponse:
      description: Defines the shape of a post response object.
      type: object
      properties:
        id:
          description: The newly created ID
          type: string
      x-hidden: true
    NameFormatEdit:
      description: Name formats define how to address constituents in communications. How you refer to individuals sets the tone of your communications with them and how well they receive your interactions.
      type: object
      properties:
        configuration_id:
          description: The name format configuration identifier. Required when custom_format is false.
          type: string
        custom_format:
          description: Whether the name format uses a custom format.
          type: boolean
        formatted_name:
          description: 'The name format formatted name. Required when custom_format is true. Character limit: 255.'
          maxLength: 255
          minLength: 0
          type: string
        type:
          description: The name format type. Available values are the entries in the <a href="https://developer.sky.blackbaud.com/docs/services/56b76470069a0509c8f1c5b3/operations/ListNameFormatTypes"><b>Addr/Sal Types</b></a> table. This value cannot be set to null.
          type: string
      x-hidden: true
      x-display-name: Edit name format
      x-display-id: EditNameFormat
  securitySchemes:
    Bb-Api-Subscription-Key:
      type: apiKey
      name: Bb-Api-Subscription-Key
      in: header
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://app.blackbaud.com/oauth/authorize
          tokenUrl: https://oauth2.sky.blackbaud.com/token
          scopes: {}
