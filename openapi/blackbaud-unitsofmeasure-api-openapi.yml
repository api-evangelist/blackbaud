    get:
      operationId: ListUnitsOfMeasure
      summary: Unit of measure (List)
      description: Returns a list of units of measure.
      responses:
        '200':
          description: Returned when the operation is successful. The response body contains a list of units of measure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnitOfMeasureApiCollection'
              example:
                count: 2
                value:
                - id: 272
                  description: Box
                  value: Box
                  inactive: false
                - id: 1785
                  description: Carton
                  value: Carton
                  inactive: false
      tags:
      - Unitsofmeasure
