      x-bb-error-types:
      - urn:blackbaud:model-validation-error
      - urn:blackbaud:invalid-empty-value
      - urn:blackbaud:cannot-delete-running-job
    EditJob400ProblemDetails:
      type: object
      properties:
        values:
          $ref: '#/components/schemas/MappingProblemValues'
        type:
          type: string
          description: A URI reference [RFC3986] that identifies the problem type. This specification encourages that, when
            dereferenced, it provide human-readable documentation for the problem type (e.g., using HTML [W3C.REC-html5-20141028]).
            When this member is not present, its value is assumed to be "about:blank".<br/><br/>Available values:<table><tr><th>type</th><th>detail</th></tr><tr><td>urn:blackbaud:model-validation-error</td><td>A
            model validation rule was violated, such as a missing required field.</td></tr><tr><td>urn:blackbaud:invalid-empty-value</td><td>InvalidEmptyValue</td></tr><tr><td>urn:blackbaud:header-row-not-supported-for-jsonl-file</td><td>HeaderRowNotSupportedForJsonlFile</td></tr><tr><td>urn:blackbaud:missing-header-row-for-csv-file</td><td>MissingHeaderRowForCsvFile</td></tr><tr><td>urn:blackbaud:unsupported-import-file-type</td><td>UnsupportedImportFileType</td></tr><tr><td>urn:blackbaud:job-not-in-pending-state</td><td>JobNotInPendingState</td></tr><tr><td>urn:blackbaud:mapping-has-errors</td><td>The
