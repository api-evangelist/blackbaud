          $ref: '#/components/schemas/RequestMetadata'
      additionalProperties: false
      description: Contract object returned when getting new file upload information for an import job.
    Job:
      required:
      - date_added
      - file_name
      - id
      - status
      - user_id
      type: object
      properties:
        id:
          type: string
          description: The ID of the job.
          nullable: true
        sequence:
          type: integer
          description: The sequence number of the job.
          format: int32
          nullable: true
        file_name:
          type: string
          description: The file name of the job.
          nullable: true
        status:
          $ref: '#/components/schemas/JobStatus'
        validation_mode:
          $ref: '#/components/schemas/ValidationMode'
        rows_processed:
          type: integer
          description: The number of rows in the job's file.
          format: int32
          nullable: true
        rows_committed:
          type: integer
          description: The number of rows committed by this job to date.
          format: int32
          nullable: true
        rows_rejected:
          type: integer
          description: The number of invalid rows for the job.
          format: int32
          nullable: true
        exception_count:
          type: integer
          description: The number of unaddressed exceptions for the job.
          format: int32
          nullable: true
        gift_batch_ids:
          type: array
          items:
            type: string
          description: 'The IDs of the gift batches created during this job, in creation order.

            Null for jobs that did not create gift batches.'
          nullable: true
        output_queries:
          type: array
          items:
            $ref: '#/components/schemas/OutputQueryResult'
          description: 'The output queries created during this job.

            Null for jobs that did not create output queries.'
          nullable: true
        run_duration:
          type: integer
          description: 'The duration of the job''s run in seconds, computed as the difference of end_date and start_date.

            Null if the job has not finished running yet or if start_date or end_date is missing.'
          format: int32
          nullable: true
          readOnly: true
        start_date:
          type: string
          description: Date and time when the job first started running.
          format: date-time
          nullable: true
        end_date:
          type: string
          description: Date and time when the job ended.
          format: date-time
          nullable: true
        failure_message:
          type: string
          description: The message associated with a failed job.
          nullable: true
        failure_code:
          $ref: '#/components/schemas/JobFailureCode'
        failure_sub_code:
          type: string
          description: 'Reserved for a finer-grained reason within Blackbaud.Import.Process.Service.Models.Job.FailureCode.
            Always null today; populated in

            a future enhancement so that adding sub-reasons does not require a contract change.'
          nullable: true
        exception_file_from_job_id:
          type: string
          description: 'If the import is from an exception file, this will be the ID of the import job that produced the exception
            file.

            This is the immediate parent in the re-import chain, not the chain''s root.'
          nullable: true
        exception_file_from_job_sequence:
          type: integer
          description: 'The sequence number of the import job identified by Blackbaud.Import.Process.Service.Models.Job.ExceptionFileFromJobId,
            letting consumers

            correlate an exception-file re-import with the import that produced the file without a second call.

            Null when this job did not import an exception file, or when the referenced job could not be

            retrieved (for example it had been purged).'
          format: int32
          nullable: true
        user_id:
          type: string
          description: The ID of the user who created the job and owns it.
          nullable: true
        user_name:
          type: string
          description: 'The display name of the user who created the job, or null when the name is unknown

            (for example, a service-created job or a user whose name claims were unavailable).'
          nullable: true
        date_added:
          type: string
          description: Date and time when the job was created.
          format: date-time
        field_mappings:
          type: array
          items:
            $ref: '#/components/schemas/FieldMapping'
          description: The field mappings from the header row to the target fields. Only applies to CSV imports.
          nullable: true
        mapping_validation_messages:
          type: array
          items:
            $ref: '#/components/schemas/MappingValidationMessage'
          description: 'The mapping validation messages from the job''s header row. Only applies to CSV imports.

            Contains only Blackbaud.Import.Process.Service.Models.MappingValidationMessageType.Warning messages; blocking
            mapping errors

            prevent a job from being created or edited, so a persisted job never carries mapping errors.'
          nullable: true
      additionalProperties: false
      description: Summary information for import jobs.
    JobFailureCode:
      title: JobFailureCode
      enum:
      - InternalError
      - Canceled
      - InvalidExceptionFile
      - InvalidImportFile
      - MappingError
      - FileAccessError
      - ImportConfigurationInvalid
      - ExceptionFileAlreadyReimported
      - NoRowsFound
