openapi: 3.0.1
info:
  title: 'Blackbaud SKY API: Import'
  description: Manages import jobs for Raiser's Edge NXT.
  version: '1.0'
  x-apievangelist-provenance:
    source: https://developer.sky.blackbaud.com/developer/apis/import
    method: assembled from Blackbaud's public API Management developer data API (operations, parameters, representations,
      examples, stored definitions); nothing authored
    assembled: '2026-10-14'
servers:
- url: https://api.sky.blackbaud.com/import
paths:
  /jobs:
    post:
      operationId: CreateJob
      summary: Create a job (PREVIEW)
      description: 'Creates a new import job. As a best practice, review the field mappings in the response before uploading
        the import file; uploading the file should be the last step before starting the job.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddJobRequest'
        description: The import job data.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the created job ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddJobResponse'
        '400':
          description: Returned when the request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/CreateJob400ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create jobs.
    get:
      operationId: GetJobs
      summary: Get jobs (PREVIEW)
      description: 'Gets import jobs for the current environment.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - Pending
          - Enqueued
          - Starting
          - Running
          - Completed
          - CompletedWithExceptions
          - Failed
        description: 'Filters jobs by status. When omitted, jobs in the `Pending` status are excluded

          from results; to retrieve `Pending` jobs, set this filter to `Pending` explicitly.'
      - name: continuation_token
        in: query
        required: false
        schema:
          type: string
        description: The continuation token to get the next page of results.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: '100'
        description: The maximum number of records to return.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the collection of jobs for the environment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetJobsResult'
        '400':
          description: Returned when the request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/GetJobs400ResponseTypes'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The date field is required.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have permission to list jobs.
  /jobs/start:
    post:
      operationId: StartJob
      summary: Start a job (PREVIEW)
      description: 'Starts a pending import job. Call this after the import file has been uploaded. The uploaded file must
        not exceed the maximum import file size (50 MB by default). A larger file is rejected with an `import-file-too-large`
        error whose `values` member carries `max_file_size_bytes` (and `file_size_bytes` when known); the job stays pending,
        so you can request a new upload request (`GET jobs/{job_id}/uploadrequest`), upload a smaller file, and start the
        job again.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartJobRequest'
            example:
              job_id: aa52b48c-4784-4a0f-907b-987454826fd6
        description: The job to start.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains status of the job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartJobResponse'
              example:
                status: Enqueued
        '400':
          description: Returned when the request is invalid, including when the uploaded import file is larger than the maximum
            import file size.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/StartJob400ProblemDetails'
        '403':
          description: Returned when the user does not have permission to start the requested job.
        '404':
          description: Returned when the requested job was not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:resource-not-found
                title: The requested resource could not be found.
                status: 404
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
  /jobs/{job_id}:
    delete:
      operationId: DeleteJob
      summary: Delete a job (PREVIEW)
      description: 'Deletes an import job.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the job to delete.
      responses:
        '200':
          description: Returned when the operation succeeds.
        '400':
          description: Returned when the request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/DeleteJob400ResponseTypes'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The date field is required.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have permission to delete the requested job.
    patch:
      operationId: EditJob
      summary: Edit a job (PREVIEW)
      description: 'Edits an import job. Changing `file_name` or `header_row` invalidates any previously uploaded import file;
        the replacement file must be uploaded using the `file_upload_request` returned in the response, not upload information
        obtained from an earlier request. `file_upload_request` is only included in the response when the edit changed `file_name`
        or `header_row`; it is omitted otherwise, and any previously uploaded file remains valid. As a best practice, review
        the field mappings in the response before uploading the import file; uploading the file should be the last step before
        starting the job.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the job to edit.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditJobRequest'
        description: The job changes to apply.
      responses:
        '200':
          description: Returned when the operation succeeds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditJobResponse'
        '400':
          description: Returned when the request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/EditJob400ProblemDetails'
        '403':
          description: Returned when the user does not have permission to edit the requested job.
        '412':
          description: Returned when the concurrency check fails. The request should be retried.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:precondition-failed
                title: The requested action failed on precondition.
                status: 412
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
    get:
      operationId: GetJob
      summary: Get a job (PREVIEW)
      description: 'Gets an import job.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the job to get.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          description: Returned when the request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/GetJob400ResponseTypes'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The date field is required.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have permission to get the requested job.
        '404':
          description: Returned when the requested job was not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:resource-not-found
                title: The requested resource could not be found.
                status: 404
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
  /jobs/{job_id}/exceptionfiledownloadinfo:
    get:
      operationId: GetExceptionFileDownloadInfo
      summary: Get exception file download URI (PREVIEW)
      description: 'Gets the download URI for an import job''s exception file.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the import job.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the exception file download URI.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportFileDownloadInformation'
              example:
                file_download_uri: https://example.com/download/aa52b48c-4784-4a0f-907b-987454826fd6
        '400':
          description: Returned when the request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/GetExceptionFileDownloadInfo400ResponseTypes'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The date field is required.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have permission to access the requested job.
        '404':
          description: Returned when the requested job was not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:resource-not-found
                title: The requested resource could not be found.
                status: 404
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
  /jobs/{job_id}/uploadrequest:
    get:
      operationId: GetJobUploadRequest
      summary: Get import file upload request (PREVIEW)
      description: 'Gets new upload information — the URL, HTTP method, and headers to send — for a pending import job''s
        import file. Requesting new upload information invalidates any previously uploaded import file; the import file must
        be uploaded as described in this response, not with upload information obtained from an earlier request.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the job to get new upload information for.
      responses:
        '200':
          description: 'Returned when the operation succeeds. The response body describes how to upload the import file: the
            upload URL, HTTP method, and required headers.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportFileUploadRequestInformation'
              example:
                file_upload_request:
                  url: https://example.com/upload/aa52b48c-4784-4a0f-907b-987454826fd6
                  method: PUT
                  headers:
                  - name: x-ms-blob-type
                    value: BlockBlob
        '400':
          description: Returned when the request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/GetJobUploadUri400ResponseTypes'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The date field is required.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have permission to access the requested job.
        '404':
          description: Returned when the requested job was not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:resource-not-found
                title: The requested resource could not be found.
                status: 404
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
  /jobs/{job_id}/uploaduri:
    get:
      operationId: GetJobUploadUri
      summary: Get import file upload URI (PREVIEW)
      description: 'Deprecated: use GetJobUploadRequest, which also returns the HTTP method and headers required for the upload.
        Gets a new file upload URI for a pending import job. Requesting a new upload URI invalidates any previously uploaded
        import file; the import file must be uploaded using the URI from this response, not an upload URI obtained from an
        earlier request.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
        description: The ID of the job to get the refreshed upload URI for.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains new import file upload URI.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportFileUploadInformation'
              example:
                file_upload_uri: https://example.com/upload/aa52b48c-4784-4a0f-907b-987454826fd6
        '400':
          description: Returned when the request is invalid.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/GetJobUploadUri400ResponseTypes'
              example:
                type: urn:blackbaud:model-validation-error
                title: One or more validation errors occurred.
                status: 400
                detail: The date field is required.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Returned when the user does not have permission to access the requested job.
        '404':
          description: Returned when the requested job was not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: urn:blackbaud:resource-not-found
                title: The requested resource could not be found.
                status: 404
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
  /jsonimportschema:
    get:
      operationId: GetJsonImportSchema
      summary: Get JSON import schema (PREVIEW)
      description: 'Returns the JSON schema for JSONL import files.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the JSON import schema.
          content:
            application/schema+json:
              schema:
                $ref: '#/components/schemas/JsonimportschemaGet200ApplicationSchema-jsonResponse'
        '403':
          description: Returned when the user does not have permission to access imports.
components:
  schemas:
    AddJobRequest:
      required:
      - file_name
      type: object
      properties:
        file_name:
          minLength: 1
          type: string
          description: The name of the file to be imported by this job
        header_row:
          type: string
          description: The header row to use in this import job. Required when importing a CSV file.
          nullable: true
        validation_mode:
          $ref: '#/components/schemas/ValidationMode'
      additionalProperties: false
      description: The contract object for adding an import job.
    AddJobResponse:
      required:
      - id
      type: object
      properties:
        id:
          type: string
          description: The ID of the created job.
          nullable: true
        file_upload_request:
          $ref: '#/components/schemas/RequestMetadata'
        field_mappings:
          type: array
          items:
            $ref: '#/components/schemas/FieldMapping'
          description: The field mappings from the header row to the target fields. Only applies to CSV imports.
          nullable: true
        mapping_validation_messages:
          type: array
          items:
            $ref: '#/components/schemas/MappingValidationMessage'
          description: 'The mapping validation messages from the created job''s header row. Only applies to CSV imports.

            Contains only Blackbaud.Import.Process.Service.Models.MappingValidationMessageType.Warning messages; blocking
            mapping errors

            are returned as a 400 response rather than on a successful (200) response.'
          nullable: true
      additionalProperties: false
      description: Contract object returned when adding a new job.
    CreateJob400ProblemDetails:
      type: object
      properties:
        values:
          $ref: '#/components/schemas/MappingProblemValues'
        type:
          type: string
          description: A URI reference [RFC3986] that identifies the problem type. This specification encourages that, when
            dereferenced, it provide human-readable documentation for the problem type (e.g., using HTML [W3C.REC-html5-20141028]).
            When this member is not present, its value is assumed to be "about:blank".<br/><br/>Available values:<table><tr><th>type</th><th>detail</th></tr><tr><td>urn:blackbaud:model-validation-error</td><td>A
            model validation rule was violated, such as a missing required field.</td></tr><tr><td>urn:blackbaud:header-row-not-supported-for-jsonl-file</td><td>HeaderRowNotSupportedForJsonlFile</td></tr><tr><td>urn:blackbaud:missing-header-row-for-csv-file</td><td>MissingHeaderRowForCsvFile</td></tr><tr><td>urn:blackbaud:unsupported-import-file-type</td><td>UnsupportedImportFileType</td></tr><tr><td>urn:blackbaud:mapping-has-errors</td><td>The
            header row produced a mapping with one or more validation errors. The field mappings and validation messages are
            returned on the response's `values` member.</td></tr><tr><td>urn:blackbaud:at-least-one-field-must-be-mapped</td><td>AtLeastOneFieldMustBeMapped</td></tr><tr><td>urn:blackbaud:property-not-supported</td><td>This
            operation does not support specification of '{0}'.</td></tr><tr><td>urn:blackbaud:invalid-value</td><td>'{0}'
            is not a valid value for {1}.</td></tr></table>
          nullable: true
        title:
          type: string
          description: A short, human-readable summary of the problem type. It SHOULD NOT change from occurrence to occurrence
            of the problem, except for purposes of localization (e.g., using proactive content negotiation; see [RFC7231],
            Section 3.4).
          nullable: true
        status:
          type: integer
          description: The HTTP status code ([RFC7231], Section 6) generated by the origin server for this occurrence of the
            problem.
          format: int32
          nullable: true
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
          nullable: true
        instance:
          type: string
          description: A URI reference that identifies the specific occurrence of the problem. It may or may not yield further
            information if dereferenced.
          nullable: true
        trace_id:
          type: string
          description: A request ID that can be provided to Blackbaud Support that may help with further troubleshooting.
        span_id:
          type: string
          description: A request ID that can be provided to Blackbaud Support that may help with further troubleshooting.
      additionalProperties: {}
      description: 'The `application/problem+json` response returned from the create-job endpoint when the request

        is invalid. The `type` member identifies which validation failure occurred; refer to the

        documented error types for the specific cause and any additional data.'
      x-bb-error-types:
      - urn:blackbaud:model-validation-error
      - urn:blackbaud:header-row-not-supported-for-jsonl-file
      - urn:blackbaud:missing-header-row-for-csv-file
      - urn:blackbaud:unsupported-import-file-type
      - urn:blackbaud:mapping-has-errors
      - urn:blackbaud:at-least-one-field-must-be-mapped
      - urn:blackbaud:property-not-supported
      - urn:blackbaud:invalid-value
    DeleteJob400ResponseTypes:
      type: object
      properties:
        type:
          type: string
          description: A URI reference [RFC3986] that identifies the problem type. This specification encourages that, when
            dereferenced, it provide human-readable documentation for the problem type (e.g., using HTML [W3C.REC-html5-20141028]).
            When this member is not present, its value is assumed to be "about:blank".<br/><br/>Available values:<table><tr><th>type</th><th>detail</th></tr><tr><td>urn:blackbaud:model-validation-error</td><td>A
            model validation rule was violated, such as a missing required field.</td></tr><tr><td>urn:blackbaud:invalid-empty-value</td><td>InvalidEmptyValue</td></tr><tr><td>urn:blackbaud:cannot-delete-running-job</td><td>CannotDeleteRunningJob</td></tr></table>
