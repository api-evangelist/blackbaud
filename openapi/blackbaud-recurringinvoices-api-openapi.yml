      - urn:blackbaud:validation-error
    ContactType:
      title: ContactType
      enum:
      - Unknown
      - Person
      - Organization
      type: string
      description: Contact type
    FlatRate:
      type: object
      properties:
        amount:
          type:
          - number
          - 'null'
          description: The default flat rate.
          format: decimal
        allow_changes_to_amount:
          type: boolean
          description: Whether the user can edit the billing item amount after it's applied. For example, on a charge.
      additionalProperties: false
      description: The flat rate item details.
    RecurringInvoiceStatus:
      title: RecurringInvoiceStatus
      enum:
      - Ungenerated
      - PartiallyGenerated
      - Generated
      type: string
      description: The recurring invoice status
    VariableRate:
      required:
      - quantity
      - quantity_decimals
      - unit_price_decimals
      type: object
      properties:
        unit_of_measure_entry:
          $ref: '#/components/schemas/ReceivablesCodeTableEntry'
        quantity:
          type: number
          description: The quantity sold for a specified unit.
          format: decimal
        quantity_decimals:
          type: integer
          description: The number of decimals to input and round the quantity.
          format: int32
        unit_price:
          type:
          - number
          - 'null'
          description: The price per unit.
          format: decimal
        unit_price_decimals:
          type: integer
          description: The number of decimals to input and round the unit price.
          format: int32
        allow_changes_quantity_and_unit_price:
          type: boolean
          description: The user is allowed to edit the Billing Item's unit price after it is applied, such as on a Charge.
        trade_discount_percent:
          type: number
          description: Trade Discount Percentage for Charge and Line Item calculations.
          format: decimal
        trade_discount_amount:
          type: number
          description: Calculated Trade Discount Amount for Charge and Line Item calculations.
          format: decimal
          readOnly: true
        amount:
          type: number
          description: Amount calculated from other property values
          format: decimal
          readOnly: true
      additionalProperties: false
      description: The details for an item with variable quantity.
    RecurringInvoiceScheduleType:
      title: RecurringInvoiceScheduleType
      enum:
      - Fixed
      - Unlimited
      type: string
      description: Recurring invoice schedule type
    RecurringInvoiceListItem:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
          description: ID
        client_id:
          type:
          - string
          - 'null'
          description: The ID of the client.
        client_name:
          type:
          - string
          - 'null'
          description: The client name.
        lookup_id:
          type:
          - string
          - 'null'
          description: The ID of the invoice lookup.
        invoice_amount:
          type: number
          description: The invoice amount.
          format: decimal
        added_by:
          type:
          - string
          - 'null'
          description: The user name who created the record.
        purchase_order_number:
          type:
          - string
          - 'null'
          description: The client purchase order number or purchase order number.
        purchaser:
          type:
          - string
          - 'null'
          description: The purchase order name.
        purchase_date:
          type:
          - string
          - 'null'
          description: The purchase date.
          format: date-time
        recurring_invoice_status:
          $ref: '#/components/schemas/RecurringInvoiceStatus'
        next_invoice_date:
          type:
          - string
          - 'null'
          description: The next invoice date for recurring invoice.
          format: date-time
        invoices_scheduled:
          type:
          - integer
          - 'null'
          description: The total number of invoices to send (both generated and scheduled) for Fixed schedules. Null for Unlimited schedules.
          format: int32
        schedule_type:
          $ref: '#/components/schemas/RecurringInvoiceScheduleType'
        date_added:
          type: string
          description: The record create date.
          format: date-time
        last_changed_by:
          type:
          - string
          - 'null'
          description: The user name who last changed the record.
        last_changed_date:
          type: string
          description: The record last changed date.
          format: date-time
      additionalProperties: false
      description: Recurring invoice
    ReceivablesCodeTableEntry:
      required:
      - id
      - value
      type: object
      properties:
        id:
          type: string
          description: The ID of the code table entry.
        value:
          minLength: 1
          type: string
          description: The value of the code table entry.
      additionalProperties: false
      description: The request containing info for a code table entry.
    RecurringInvoiceListItemList:
      required:
      - limit
      - offset
      - recurring_invoices
      type: object
      properties:
        recurring_invoices:
          type: array
          items:
