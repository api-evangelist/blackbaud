openapi: 3.2.0
info:
  title: Blackbaud Phones API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Phones across 3 of this provider''s published API definitions: blackbaud-altru-constituent-api-openapi.yml, blackbaud-constituent-api-openapi.yml, blackbaud-crm-constituent-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/alt-conmg
- url: https://api.sky.blackbaud.com/constituent/v1
- url: https://api.sky.blackbaud.com/crm-conmg
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Phones
paths:
  /phones:
    post:
      operationId: CreateConstituentPhone
      summary: Create a constituent phone
      description: This operation is used to add phone records.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewConstituentPhone'
            example:
              constituent_id: ''
              phone_type: ''
              number: ''
              primary: false
              do_not_call: false
              spouse_name: ''
              update_matching_spouse_phone: false
              household: false
              household_member: false
              update_matching_household_phone: false
              start_time: ''
              end_time: ''
              info_source: ''
              info_source_comments: ''
              country: ''
              seasonal_start_date: ''
              seasonal_end_date: ''
              start_date: ''
              do_not_call_reason: ''
              confidential: false
              country_codes:
              - country_id: ''
                country_code: ''
              constituent_data_review_rollback_reason: ''
              forced_primary: false
              can_edit_primary: false
              invalid_fields: ''
              origin: User
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully creates the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Phones
    get:
      operationId: ListConstituentPhonesAllConstituents
      summary: Phone list (All constituents)
      description: 'Returns a paginated list of phones.


        The default sorting behavior is to list phones in ascending order based on when they were created.


        However, the last_modified parameter overrides the default sorting behavior to list phones in ascending order based on when they were last modified. The last_modified parameter also adds the sort_token parameter to the next_link URL to ensure that phones are stably sorted and that order persists when changes occur while working through a paginated list.


        If the last_modified and date_added parameters are both specified, the sorting behavior is to list phones based on when they were last modified.


        Note: This endpoint returns data with an average latency of about 30 minutes. In addition, historic records have a default date_added timestamp of 1600-01-01 00:00:00.000 +00:00. The timestamp for newer records reflects when the records were added.'
      parameters:
      - name: date_added
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for phones created on or after the specified date. The filter respects time offsets from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for phones modified on or after the specified date. The filter respects time offsets from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
        description: Set this parameter to "true" to include inactive phones in the response.
      - name: sort_token
        in: query
        required: false
        schema:
          type: string
        description: Represents a token filter to provide the next stable-sorted list of phones. This will be provided on the next_link collection response property when last_modified or sort_token filters are specified on the request.
      - name: constituent_id
        in: query
        required: false
        schema:
          type: array
        description: Represents a list of constituent identifiers. Returns phones if any of the specified constituent identifiers match any of the phones' associated constituents. For example, "constituent_id=280&amp;constituent_id=1232" returns phones with either "280" or "1232" constituent identifiers.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to return. The default is 500. The maximum is 5000.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip. For use with pagination.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a> of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Phone">phone</a> entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfPhoneRead'
              example:
                count: 574
                next_link: https://api.sky.blackbaud.com/constituent/v1/phones?offset=4&limit=4
                value:
                - id: '1'
                  constituent_id: '281'
                  date_added: '1600-01-01T00:00:00Z'
                  date_modified: '2016-10-19T19:42:38.775Z'
                  do_not_call: true
                  inactive: false
                  number: 404-977-5810
                  primary: false
                  type: Business
                - id: '3'
                  constituent_id: '186'
                  date_added: '1600-01-01T00:00:00Z'
                  date_modified: '2016-10-19T19:42:38.775Z'
                  do_not_call: false
                  inactive: false
                  number: 912-555-1215
                  primary: false
                  type: Home
                - id: '4'
                  constituent_id: '187'
                  date_added: '1600-01-01T00:00:00Z'
                  date_modified: '2016-10-19T19:42:38.775Z'
                  do_not_call: false
                  inactive: false
                  number: 843-798-6698
                  primary: false
                  type: Home
                - id: '5'
                  constituent_id: '188'
                  date_added: '1600-01-01T00:00:00Z'
                  date_modified: '2016-10-19T19:42:38.775Z'
                  do_not_call: false
                  inactive: false
                  number: 612-321-0047
                  primary: false
                  type: Home
        '400':
          description: Returned when the specified request parameters are not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to view the phones.
      tags:
      - Phones
    servers:
    - url: https://api.sky.blackbaud.com/alt-conmg
  /phones/{phone_id}:
    delete:
      operationId: DeleteConstituentPhone
      summary: Delete a constituent phone
      description: This deletion handles only the basic deletion rules for a phone (currently none).
      parameters:
      - name: phone_id
        in: path
        required: true
        schema:
          type: string
        description: The phone id
      responses:
        '200':
          description: Returned when the operation successfully deletes the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to delete the resource.
      tags:
      - Phones
    patch:
      operationId: EditConstituentPhone
      summary: Edit a constituent phone
      description: This operation is used to edit phone records.
      parameters:
      - name: phone_id
        in: path
        required: true
        schema:
          type: string
        description: The phone id.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditConstituentPhone'
            example:
              phone_type: Business
              number: '8439195648'
              primary: true
              do_not_call: false
              spouse_name: ''
              spouse_has_matching_phone: false
              update_matching_spouse_phone: false
              household: false
              household_member: false
              update_matching_household_phone: false
              matching_household_members: []
              start_time:
                hour: 3
                minute: 30
              end_time:
                hour: 5
                minute: 30
              info_source: ''
              info_source_comments: ''
              country: ''
              seasonal_start_date:
                month: 3
                day: 21
              seasonal_end_date:
                month: 3
                day: 21
              start_date: ''
              end_date: ''
              do_not_call_reason: ''
              confidential: false
              country_codes:
              - countryid: ''
                countrycode: ''
              constituent_data_review_rollback_reason: ''
              forced_primary: false
              can_edit_primary: false
              invalid_fields: ''
              origin_code: User
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully edits the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to edit the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Phones
    get:
      operationId: GetConstituentPhone
      summary: Get a constituent phone
      description: This operation is used to edit phone records.
      parameters:
      - name: phone_id
        in: path
        required: true
        schema:
          type: string
        description: The phone id.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstituentPhone'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to get the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Phones
    servers:
    - url: https://api.sky.blackbaud.com/alt-conmg
