          - 'null'
          description: The ID of the checklist step for the candidate
          format: int32
        type:
          $ref: '#/components/schemas/StudentChecklistStepType'
        status:
          type:
          - string
          - 'null'
          description: The student's status for this step.
        date_completed:
          type:
          - string
          - 'null'
          description: The date the step was completed
          format: date-time
        file:
          type:
          - string
          - 'null'
          description: The file submitted for the step
        comment:
          type:
          - string
          - 'null'
          description: The comment for the step
      additionalProperties: false
      description: Student checklist step
    UserBaseRead:
      type: object
      properties:
        id:
          type:
          - integer
          - 'null'
          description: The user ID of the user
          format: int32
        prefix:
          type:
          - string
          - 'null'
          description: The prefix of the user
        first_name:
          type:
          - string
          - 'null'
          description: The first name of the user
        middle_name:
          type:
          - string
          - 'null'
          description: The middle name of the user
        last_name:
          type:
          - string
          - 'null'
          description: The last name of the user
        suffix:
          type:
          - string
          - 'null'
          description: The suffix of the user
        preferred_name:
          type:
          - string
          - 'null'
          description: The preferred first name of the user
        preferred_last_name:
          type:
          - string
          - 'null'
          description: The preferred last name of the user
        maiden_name:
          type:
          - string
          - 'null'
          description: The former or maiden name of the user
        email:
          type:
          - string
          - 'null'
          description: The email of the user
      additionalProperties: false
      description: User base model
    V1StudentchecklistsGet200ApplicationJsonResponse:
      type: array
      items:
        $ref: '#/components/schemas/StudentChecklist'
      x-apim-inline: true
    TableValueBase:
      type: object
      properties:
        id:
          type:
          - integer
          - 'null'
          description: The ID of the table value
          format: int32
        description:
          type:
          - string
          - 'null'
          description: The description of the table value
      additionalProperties: false
      description: 'Table value base model. Used for table entry fields (i.e. dropdown controls) to provide both ID and Description information for the selected value. General system tables can be retrieved by School API endpoints: GET Types table types and GET Types table values.'
    StudentChecklist:
      type: object
      properties:
        id:
          type:
          - integer
          - 'null'
          description: The ID of the student�s student checklist
          format: int32
        candidate:
          $ref: '#/components/schemas/UserBaseRead'
        type:
          $ref: '#/components/schemas/StudentChecklistType'
      additionalProperties: false
