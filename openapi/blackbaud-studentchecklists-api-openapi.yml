- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Studentchecklists
paths:
  /v1/studentchecklists:
    get:
      operationId: V1StudentchecklistsGet
      summary: Student checklist list (Get)
      description: 'Returns list of student checklists for a school year.


        Requires the following role in the Education Management system:


        Admissions Manager


        Admissions Staff'
      parameters:
      - name: school_year
        in: query
        required: false
        schema:
          type: string
        description: The ID or label of a school year. Defaults to current admissions year.
      - name: student_checklist_type_id
        in: query
        required: false
        schema:
          type: integer
        description: Provide the ID of the student checklist type to limit results to that checklist.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1StudentchecklistsGet200ApplicationJsonResponse'
              example:
              - id: 17
                candidate:
                  id: 1574394
                  first_name: Samantha
                  middle_name: J.
                  last_name: Hill
                  email: SamanthH@sis.org
                type:
                  id: 17
                  name: Re-Enrollment Checklist
                  is_inactive: true
                  is_archived: true
                  school_year:
                    id: 530
                    description: 2019 - 2020
              - id: 17
                candidate:
                  id: 1574551
                  first_name: Tina
                  last_name: Young
                  email: tiny@sisacademy.com
                type:
                  id: 17
                  name: Re-Enrollment Checklist
                  is_inactive: true
                  is_archived: true
                  school_year:
                    id: 530
                    description: 2019 - 2020
      tags:
      - Studentchecklists
  /v1/studentchecklists/{student_id}:
    get:
      operationId: V1StudentchecklistsByStudent_idGet
      summary: Student checklist list - single student (Get)
      description: 'Returns a student''s checklists and their steps for a specified year.


        Requires the following role in the Education Management system:


        Admissions Manager


        Admissions Staff'
      parameters:
      - name: student_id
        in: path
        required: true
        schema:
          type: integer
        description: The user ID of the student
      - name: school_year
        in: query
        required: false
        schema:
          type: string
        description: The ID or label of the school year. Defaults to current admissions year.
      - name: student_checklist_type_id
        in: query
        required: false
        schema:
          type: integer
        description: The ID of student checklist type
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Studentchecklists-student_id-Get200ApplicationJsonResponse'
              example:
              - checklist:
                  id: 1
                  type:
                    id: 1
                    name: Re-enrollment
                    is_inactive: false
                    is_archived: false
                    school_year:
                      id: 1
                      description: 2024 - 2025
                steps:
                - id: 1
                  type:
                    id: 1
                    name: Update medical history
                    type: Medical form
                    description: Provide necessary medical info
                    due_date: '2022-03-31T12:00:00Z'
                    is_inactive: false
                    is_required: false
                    link: www.example.com
                    link_text: Medical form
                    file: filename.doc
                  status: Awaiting
                  date_completed: '2022-03-31T12:00:00Z'
                  file: med_history.pdf
                  comment: Comment
      tags:
      - Studentchecklists
  /v1/studentchecklists/{student_id}/{student_checklist_id}/steps/{step_id}:
    patch:
      operationId: V1StudentchecklistsByStudent_idByStudent_checklist_idStepsByStep_idPatch
      summary: Student checklist step (Edit)
      description: 'Updates a step on a student checklist.


        Requires the following role in the Education Management system:


        Admissions Manager


        Admissions Staff'
      parameters:
      - name: student_id
        in: path
        required: true
        schema:
          type: integer
        description: The user ID of the student
      - name: step_id
        in: path
        required: true
        schema:
          type: integer
        description: The ID of the student�s instance of the checklist step
      - name: student_checklist_id
        in: path
        required: true
        schema:
          type: integer
        description: The ID of the student's instance of the student checklist
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentChecklistStepUpdate'
            example:
              status: Submitted
              date_completed: '2025-08-31T12:00:00Z'
              comment: A stependous comment
        description: The step model to update
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Studentchecklists-student_id-student_checklist_id-Steps-step_id-Patch200ApplicationJsonResponse'
              example: 0
      tags:
      - Studentchecklists
components:
  schemas:
    StudentChecklistStep:
      type: object
