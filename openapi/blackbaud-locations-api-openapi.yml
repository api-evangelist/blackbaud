openapi: 3.2.0
info:
  title: Blackbaud Locations API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Locations across 2 of this provider''s published API definitions: blackbaud-altru-event-api-openapi.yml, blackbaud-crm-event-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/alt-evtmg
- url: https://api.sky.blackbaud.com/crm-evtmg
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Locations
paths:
  /locations:
    post:
      operationId: LocationAdd
      summary: Location add
      description: Operation for adding an event location record.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewEventLocation'
            example:
              name: Blackbaud, Inc
              max_capacity: 50
              address_block: 65 Fairchild Street
              city: Charleston
              post_code: '29492'
              phone_number: '8004439441'
              country: United States
              state: SC
              rooms:
              - id: a62483d4-cb71-46ae-9f06-da0644d0629f
                name: '401'
                capacity: 2
                in_use: false
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully creates the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Locations
    servers:
    - url: https://api.sky.blackbaud.com/alt-evtmg
  /locations/list:
    get:
      operationId: LocationLists
      summary: Location lists
      description: Displays a list of event locations.
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Limits the number of records to return.
      - name: session_key
        in: query
        required: false
        schema:
          type: string
        description: A unique key provided by user for paging results. The same key will be returned in a successful response.
      - name: infinity_session
        in: query
        required: false
        schema:
          type: string
        description: Values for cookies related to the Infinity load balancer session.
      - name: more_rows_range_key
        in: query
        required: false
        schema:
          type: string
        description: Key for accessing cached results on subsequent calls to this data list.
      - name: start_row_index
        in: query
        required: false
        schema:
          type: integer
        description: Number of rows to skip,get result after these rows.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of result entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventLocationListCollection'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to view the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Locations
    servers:
    - url: https://api.sky.blackbaud.com/alt-evtmg
  /locations/search:
    get:
      operationId: LocationSearch
      summary: Location search
      description: Search screen for event location records.
      parameters:
      - name: name
        in: query
        required: false
        schema:
          type: string
        description: name
      - name: address_block
        in: query
        required: false
        schema:
          type: string
        description: address
      - name: city
        in: query
        required: false
        schema:
          type: string
        description: city
      - name: state
        in: query
        required: false
        schema:
          type: string
        description: state SimpleDataListID=7fa91401-596c-4f7c-936d-6e41683121d7.
      - name: post_code
        in: query
        required: false
        schema:
          type: string
        description: zip/postal code
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Limits the number of records to return.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of result entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventLocationSearchCollection'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to view the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Locations
    servers:
    - url: https://api.sky.blackbaud.com/alt-evtmg
  /locations/{event_location_id}:
    patch:
      operationId: EditEventLocation
      summary: Edit an event location
      description: Operation for editing an event location record.
      parameters:
      - name: event_location_id
        in: path
        required: true
        schema:
          type: string
        description: The event location id.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditEventLocation'
            example:
              name: Blackbaud, Inc
              max_capicity: 50
              address_block: 65 Fairchild Street
              city: Charleston
              post_code: '29492'
              phone_number: '8004439441'
              country: United States
              state: South Carolina
              rooms:
              - id: a62483d4-cb71-46ae-9f06-da0644d0629f
                name: '401'
                capacity: 2
                in_use: false
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully edits the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to edit the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Locations
    get:
      operationId: GetEventLocation
      summary: Get an event location
      description: Operation for editing an event location record.
      parameters:
      - name: event_location_id
        in: path
        required: true
        schema:
          type: string
        description: The event location id.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventLocation'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to get the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Locations
    delete:
      operationId: LocationDelete
      summary: Location delete
      description: Deletes an event location from the system.
      parameters:
      - name: event_location_id
        in: path
        required: true
        schema:
          type: string
        description: The event location id
      responses:
        '200':
          description: Returned when the operation successfully deletes the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to delete the resource.
      tags:
      - Locations
    servers:
    - url: https://api.sky.blackbaud.com/alt-evtmg
