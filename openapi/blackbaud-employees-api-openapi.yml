  /v1/employees/{affiliate_employee_id}/groups:
    get:
      operationId: ListEmployeeGroups
      summary: Get all groups by employee (PREVIEW)
      description: 'Returns all of the groups for a single employee. Passing the affiliate_employee_id returns a paginated set of results containing the information for each group the employee is associated with. limit is the number of results per page, capped at 25.


        In the response, group_admin and group_member identify the employee''s level of association with the group. creator_affiliate_employee_id exposes the employee that created the group page.


        show_membership indicates a user decision to have their name shown as a member on the group page for other group members to see.


        has_pending_membership indicates that the user requested to join the group but the request has not been accepted by the group admin.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: affiliate_employee_id
        in: path
        required: true
        schema:
          type: integer
        description: The employee ID from the affiliate's system.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: '1'
        description: The number of the result's page to return.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: '10'
        description: The maximum number of groups to include per page. Maximum value is 25.
      responses:
        '400':
          description: Returned when the specified request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: The request was invalid or missing required parameters.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: Authentication credentials were missing or invalid.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Forbidden
                status: 403
                detail: You do not have permission to access this resource.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '404':
          description: Returned when the specified employee is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Not Found
                status: 404
                detail: The requested resource could not be found.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '200':
          description: Returned when the operation succeeds. The response body contains a paginated collection of groups.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeGroupsResponse'
              example:
                page: 1
                limit: 10
                page_count: 1
                total_count: 2
                groups:
                - group_id: 101
                  creator_affiliate_employee_id: 5001
                  name: Atlanta Volunteers
                  description: A group for Atlanta-based volunteers.
                  image_url: https://example.com/images/group.png
                  address1: 285 Peachtree Center Ave NE
                  city: Atlanta
                  state: GA
                  postal_code: '30303'
                  latitude: 33.759
                  longitude: -84.387
                  open: true
                  tags: volunteer,community
                  date_added: '2024-01-15T12:00:00Z'
                  group_program_id: a3f1e2d4-bc09-4e5f-9a87-1234567890ab
                  total_members: 42
                  group_admin: false
                  group_member: true
                  has_pending_membership: false
                  show_membership: true
      tags:
      - Employees
  /v1/employees/{affiliate_employee_id}/metrics:
    get:
      operationId: GetEmployeeMetrics
      summary: Get participation data for an employee (PREVIEW)
      description: 'Returns giving and volunteering participation metrics for a specific employee.


        The start and end params control the date range for the metrics summary. Pass standard date format (mm/dd/yy). Data is available for records created after 2014.


        The dateType param should be defined as "donated" or "created" and applies only to donation metrics. This controls which donations are included in the metrics summary by the date the record was created or the date of the actual donation. For example a user can record an offline donation on 01/01/19 but the donation date of that offline donation was 12/15/18. The created date is 01/01/19 and the donation date was 12/15/18. For a company match or incentive request that requires approval, the date the employee submits the request will be the create date and the date the request is approved and becomes a donation is the donation date.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: affiliate_employee_id
        in: path
        required: true
        schema:
          type: integer
        description: The employee ID from the affiliate’s system
      responses:
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: Authentication credentials were missing or invalid.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '400':
          description: Returned when the specified request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: The request was invalid or missing required parameters.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of participation totals for giving and volunteering activity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeMetricsResponse'
              example:
                employee_donations:
                - donation_type: OneTime
                  total_amount: 500
                  total_transactions: 3
                company_donations:
                - donation_type: Match
                  total_amount: 500
                  total_transactions: 3
                volunteer_participations:
                  events:
                    total_hours: 8.5
                    total_events: 2
                  activities:
                    total_hours: 4
                    total_activities: 1
                  npo_events:
                    total_hours: 3
                    total_events: 1
        '403':
          description: Returned when the user does not have rights to view participation metrics.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Forbidden
                status: 403
