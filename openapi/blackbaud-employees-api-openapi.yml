  /v1/employees/{affiliate_employee_id}/customquestions/{response_id}:
    get:
      operationId: GetEmployeeCustomQuestions
      summary: Get an employee's custom question responses (PREVIEW)
      description: 'Returns an employee’s responses to a custom question set.


        When an employee signs up for an event or records individual volunteer activity, they may be prompted to answer a set of questions related to their participation. This endpoint returns an array of the questions and responses for a given employee and responseId.


        The responseId can be obtained from the participation or RIA entry payload via the customQuestionSetResponseId property. See the Volunteer section in this reference for details on retrieving participation and RIA entry information.


        ***This endpoint is in PREVIEW and may be changed or removed at any time.***'
      parameters:
      - name: affiliate_employee_id
        in: path
        required: true
        schema:
          type: integer
        description: The employee ID from the affiliate’s system
      - name: response_id
        in: path
        required: true
        schema:
          type: integer
        description: The ID of the Custom Question set response
      responses:
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Unauthorized
                status: 401
                detail: Authentication credentials were missing or invalid.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '400':
          description: Returned when the specified request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
              example:
                type: about:blank
                title: Bad Request
                status: 400
                detail: The request was invalid or missing required parameters.
                trace_id: 0092384aa2c24842a550a0137bbf3172
                span_id: f7c9d108335d479588f5f165ca17a5e3
        '200':
          description: Returned when the operation succeeds. The response body contains the questions and the employee's response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomQuestionsResponse'
              example:
                questions:
                - question: What is your t-shirt size?
                  answer: Large
                - question: Do you have any dietary restrictions?
                  answer: Vegetarian
        '403':
