openapi: 3.2.0
info:
  title: Blackbaud Segments API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Segments across 2 of this provider''s published API definitions: blackbaud-altru-marketing-api-openapi.yml, blackbaud-crm-marketing-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/alt-mktmg
- url: https://api.sky.blackbaud.com/crm-mktmg
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Segments
paths:
  /segments:
    post:
      operationId: CreateMarketingSegment
      summary: Create a marketing segment
      description: Adds a segment.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewMarketingSegment'
            example:
              query_view_catalog: ''
              name: ''
              description: ''
              site_id: ''
              site_required: false
              segment_category: ''
              code: ''
              code_value: ''
              smart_queries_exist: false
              selections:
              - selection_id: ''
              groups:
              - segment_group_id: ''
                sequence: 0
              segment_type_code: 0
              segment_part_definition_id: ''
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully creates the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Segments
    servers:
    - url: https://api.sky.blackbaud.com/alt-mktmg
  /segments/recordsources:
    get:
      operationId: ListMarketingSegments
      summary: List marketing segments
      description: Displays a list of all possible record sources available for use in segmentations and lists.
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Limits the number of records to return.
      - name: session_key
        in: query
        required: false
        schema:
          type: string
        description: A unique key provided by user for paging results. The same key will be returned in a successful response.
      - name: infinity_session
        in: query
        required: false
        schema:
          type: string
        description: Values for cookies related to the Infinity load balancer session.
      - name: more_rows_range_key
        in: query
        required: false
        schema:
          type: string
        description: Key for accessing cached results on subsequent calls to this data list.
      - name: start_row_index
        in: query
        required: false
        schema:
          type: integer
        description: Number of rows to skip,get result after these rows.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of result entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketingSegmentListCollection'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to view the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Segments
    servers:
    - url: https://api.sky.blackbaud.com/alt-mktmg
  /segments/{segment_id}:
    delete:
      operationId: DeleteMarketingSegment
      summary: Delete a marketing segment
      description: Removes a segment from the system.
      parameters:
      - name: segment_id
        in: path
        required: true
        schema:
          type: string
        description: The segment id
      responses:
        '200':
          description: Returned when the operation successfully deletes the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to delete the resource.
      tags:
      - Segments
    patch:
      operationId: EditMarketingSegment
      summary: Edit a marketing segment
      description: Operation used for editing a segment.
      parameters:
      - name: segment_id
        in: path
        required: true
        schema:
          type: string
        description: The segment id.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditMarketingSegment'
            example:
              name: ''
              description: ''
              site_id: ''
              site_required: false
              segment_category: ''
              code: ''
              segment_part_definition_id: ''
              code_value: ''
              query_view_catalog: ''
              selections:
              - selection_id: ''
                name: ''
                description: ''
                record_type: ''
                record_type_id: ''
                query_view_id: ''
                query_id: ''
                query_type: Other
                can_edit: false
                user_granted_rights: false
              groups:
              - segment_group_id: ''
                name: ''
                sequence: 0
              smart_queries_exist: false
              in_use: false
              date_changed: ''
              allow_code_update: false
              form_id: ''
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully edits the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to edit the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Segments
    get:
      operationId: GetMarketingSegment
      summary: Get a marketing segment
      description: Operation used for editing a segment.
      parameters:
      - name: segment_id
        in: path
        required: true
        schema:
          type: string
        description: The segment id.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketingSegment'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to get the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Segments
    servers:
    - url: https://api.sky.blackbaud.com/alt-mktmg
components:
