tags:
- name: Solicitcodes
paths:
  /solicitcodes:
    post:
      operationId: CreateConstituentSolicitCode
      summary: Create a constituent solicit code
      description: Assign a solicit code to a constituent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewConstituentSolicitCode'
            example:
              constituent_id: 17818cc6-b622-4b30-8d2a-098c5ba4bd0b
              solicit_code: Do not mail
              start_date: ''
              end_date: ''
              comments: ''
              consent_preference: No response
              source_evidence: ''
              source_file: ''
              privacy_policy: ''
              supporting_information: ''
              consent_statement: ''
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully creates the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Solicitcodes
    servers:
    - url: https://api.sky.blackbaud.com/alt-conmg
  /solicitcodes/{constituent_solicit_code_id}:
    delete:
      operationId: DeleteConstituentSolicitCode
      summary: Delete a constituent solicit code
      description: This record operation is used to delete the constituent solicit code.
      parameters:
      - name: constituent_solicit_code_id
        in: path
        required: true
        schema:
          type: string
        description: The constituent solicit code id
      responses:
        '200':
          description: Returned when the operation successfully deletes the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to delete the resource.
      tags:
      - Solicitcodes
    patch:
      operationId: EditConstituentSolicitCode
      summary: Edit a constituent solicit code
      parameters:
      - name: constituent_solicit_code_id
        in: path
        required: true
        schema:
          type: string
        description: The constituent solicit code id.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditConstituentSolicitCode'
            example:
              solicit_code: Do not phone
              start_date: ''
              end_date: ''
              comments: ''
              consent_preference: No response
              source_evidence: ''
              source_file: ''
              privacy_policy: ''
              supporting_information: ''
              consent_statement: ''
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully edits the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to edit the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Solicitcodes
    get:
      operationId: GetConstituentSolicitCode
      summary: Get a constituent solicit code
      description: Edit a constituent solicit code
      parameters:
      - name: constituent_solicit_code_id
        in: path
        required: true
        schema:
          type: string
        description: The constituent solicit code id.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the specified resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstituentSolicitCode'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to get the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Solicitcodes
    servers:
    - url: https://api.sky.blackbaud.com/alt-conmg
  /solicitcodes/list:
    get:
      operationId: ListMarketingSolicitCodes
      summary: List marketing solicit codes
      description: Solicit code list
      parameters:
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
        description: include inactive
      - name: site_filter_mode
        in: query
        required: false
        schema:
          type: string
          enum:
          - All sites
          - My site
          - My site's branch
          - Selected sites
        description: sites
      - name: sites_selected
        in: query
        required: false
        schema:
          type: string
        description: Format - XML. sites selected
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Limits the number of records to return.
      - name: session_key
        in: query
        required: false
        schema:
          type: string
        description: A unique key provided by user for paging results. The same key will be returned in a successful response.
      - name: infinity_session
        in: query
        required: false
        schema:
          type: string
        description: Values for cookies related to the Infinity load balancer session.
      - name: more_rows_range_key
        in: query
        required: false
        schema:
          type: string
        description: Key for accessing cached results on subsequent calls to this data list.
      - name: start_row_index
        in: query
        required: false
        schema:
          type: integer
        description: Number of rows to skip,get result after these rows.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of result entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketingSolicitCodeListCollection'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to view the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Solicitcodes
    servers:
    - url: https://api.sky.blackbaud.com/alt-mktmg
  /solicitcodes/search:
    get:
      operationId: SearchMarketingSolicitCodes
      summary: Search for marketing solicit codes
      description: Search for a solict codes.
      parameters:
      - name: description
        in: query
        required: false
        schema:
          type: string
        description: name
      - name: site_id
        in: query
        required: false
        schema:
          type: string
        description: site
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
        description: include inactive
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Limits the number of records to return.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of result entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketingSolicitCodeSearchCollection'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to view the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Solicitcodes
    servers:
    - url: https://api.sky.blackbaud.com/alt-mktmg
  /v1/solicitcodes:
    get:
      operationId: ListSolicitCodes
      summary: Solicit codes
      description: Returns a list of available solicit code types.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/communication-preference#SolicitCodeCollection">collection</a> of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/communication-preference#SolicitCode">solicit codes</a>.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitCodeCollection'
              example:
                count: 3
                value:
                - description: Don't call me on Thursdays
                - description: Unavailable between 3-5pm on business days
                - description: Only reach out through fax
      tags:
      - Solicitcodes
    servers:
    - url: https://api.sky.blackbaud.com/commpref
