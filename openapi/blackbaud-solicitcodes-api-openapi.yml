info:
  title: Blackbaud Solicitcodes API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Solicitcodes across 5 of this provider''s published API definitions: blackbaud-altru-constituent-api-openapi.yml, blackbaud-altru-marketing-api-openapi.yml, blackbaud-communication-preference-api-openapi.yml, blackbaud-crm-constituent-api-openapi.yml, blackbaud-crm-marketing-api-openapi.yml. Each path carries the servers of the definition it was published in.'
