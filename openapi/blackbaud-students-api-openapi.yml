- url: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Students
paths:
  /students:
    get:
      operationId: getAllStudents
      summary: Students all
      description: Returns a collection of student user data.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersOutputModel'
              example:
                users:
                - username: mary.jones@myschool.com
                  userIds:
                  - type: stateId
                    identifier: NH-345-678
                  - type: StudentId
                    identifier: '100021'
                  enabledUser: 'true'
                  givenName: Mary
                  familyName: Jones
                  middleName: Jane
                  role: student
                  identifier: '66778899'
                  email: mary.jones@myschool.com
                  sms: '6031234567'
                  phone: '6031234567'
                  agents:
                  - sourcedId: usr-p-222-66778900
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/users/ousr-p-222-66778900
                    type: user
                  orgs:
                  - sourcedId: org-sch-222-456
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/orgs/org-sch-222-456
                    type: org
                  grades:
                  - '12'
                  sourcedId: usr-222-66778899
                  status: active
                  dateLastModified: '2022-12-12T11:00:00Z'
                  metadata:
                    grade: 12th Grade
                    stateId: NH-345-678
                    address1: 1234 Elm Street
                    address2: Apartment 3C
                    address3: basement
                    city: Manchester
                    state: NH
                    postCode: 03101-1001
                    microsoft.userFlags: iep,ell,freeLunch
                    title: Sr. Customer Support Analyst
                - username: jim.smith@myschool.com
                  enabledUser: 'true'
                  givenName: Jim
                  familyName: Smith
                  role: student
                  identifier: '987654'
                  email: jim.smith@myschool.com
                  orgs:
                  - sourcedId: org-sch-222-456
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/orgs/org-sch-222-456
                    type: org
                  grades:
                  - '11'
                  sourcedId: usr-222-987654
                  status: active
                  dateLastModified: '2022-12-12T11:00:00Z'
                  metadata:
                    grade: 11th Grade
                    microsoft.userFlags: reducedLunch
                    title: Salesperson
      tags:
      - Students
  /students/{id}:
    get:
      operationId: getStudent
      summary: Student by id
      description: Returns a single student user for the specified ```id```.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: sourcedId for the student
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOutputModel'
              example:
                user:
                  username: mary.jones@myschool.com
                  userIds:
                  - type: stateId
                    identifier: NH-345-678
                  - type: StudentId
                    identifier: '100021'
                  enabledUser: 'true'
                  givenName: Mary
                  familyName: Jones
                  middleName: Jane
                  role: student
                  identifier: '66778899'
                  email: mary.jones@myschool.com
                  sms: '6031234567'
                  phone: '6031234567'
                  agents:
                  - sourcedId: usr-p-222-66778900
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/users/ousr-p-222-66778900
                    type: user
                  orgs:
                  - sourcedId: org-sch-222-456
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/orgs/org-sch-222-456
                    type: org
                  grades:
                  - '12'
                  sourcedId: usr-222-66778899
                  status: active
                  dateLastModified: '2022-12-12T11:00:00Z'
                  metadata:
                    grade: 12th Grade
                    stateId: NH-345-678
                    address1: 1234 Elm Street
                    address2: Apartment 3C
                    address3: basement
                    city: Manchester
                    state: NH
                    postCode: 03101-1001
                    microsoft.userFlags: iep,ell,freeLunch
                    title: Salesperson
      tags:
      - Students
