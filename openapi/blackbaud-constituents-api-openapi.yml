  /constituents/constituentcodes:
    get:
      operationId: ListConstituentCodesAllConstituents
      summary: Constituent code list (All constituents)
      description: 'Returns a paginated list of constituent codes.


        The default sorting behavior is to list constituent codes in ascending order based on when they were created.


        However, the last_modified parameter overrides the default sorting behavior to list constituent codes in ascending order based on when they were last modified. The last_modified and date_added parameters also add the sort_token parameter to the next_link URL to ensure that constituent codes are stably sorted and that order persists when changes occur while working through a paginated list.


        If the last_modified and date_added parameters are both specified, the sorting behavior is to list constituent codes based on when they were last modified.


        Note: This endpoint returns data with an average latency of about 30 minutes. In addition, historic records have a default date_added timestamp of 1600-01-01 00:00:00.000 +00:00. The timestamp for newer records reflects when the records were added.'
      parameters:
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
        description: Set this parameter to "true" to include inactive constituent codes in the response.
      - name: date_added
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for constituent codes created on or after the specified date. The filter respects time offsets from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for constituent codes modified on or after the specified date. The filter respects time offsets from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: sort_token
        in: query
        required: false
        schema:
          type: string
        description: Represents a token filter to provide the next stable-sorted list of constituent codes. This will be provided on the next_link collection response property when last_modified or sort_token filters are specified on the request.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to return. The default is 500. The maximum is 5000.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip. For use with pagination.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a> of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#ConstituentCode">constituent code</a> entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfConstituentCodeRead'
              example:
                count: 286
                next_link: https://api.sky.blackbaud.com/constituent/v1/constituents/constituentcodes?offset=3&limit=3
                value:
                - id: '2'
                  constituent_id: '186'
                  date_added: '1600-01-01T00:00:00Z'
                  date_modified: '1600-01-01T00:00:00Z'
                  description: Board Member
                - id: '3'
                  constituent_id: '187'
                  date_added: '1600-01-01T00:00:00Z'
                  date_modified: '1600-01-01T00:00:00Z'
                  description: Trustee
                - id: '6'
                  constituent_id: '189'
                  date_added: '1600-01-01T00:00:00Z'
                  date_modified: '1600-01-01T00:00:00Z'
                  description: Student
                  end:
                    d: 21
                    m: 5
                    y: 1989
                  start:
                    d: 1
                    m: 9
                    y: 1985
        '400':
          description: Returned when the specified request parameters are not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to view the constituent codes.
      tags:
      - Constituents
    servers:
    - url: https://api.sky.blackbaud.com/constituent/v1
