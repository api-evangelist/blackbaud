    MatchingGiftPlan:
      description: Matching gift plans describe how an organization matches a constituent's gifts to your organization, such as the matching factor, the minimum and maximum amounts matched, and the plan's fiscal year. Tracking matching gift plans helps you identify and pursue additional revenue from employers and other matching organizations.
