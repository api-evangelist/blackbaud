    get:
      operationId: ListConstituents
      summary: Constituent list
      description: 'Returns a paginated list of constituents.


        The default sorting behavior is to list constituents in ascending alphabetical order based on the full name of organizations and the last name of individuals. However, some parameters override the default sorting behavior. The sort parameter sorts based on the fields that it specifies, and the sort_token parameter sorts based on the next stable-sorted list of results. (These parameters cannot be provided together.) If the sort and sort_token parameters are not provided, then the last_modified parameter sorts constituents in ascending order based on when they were last modified and the date_added parameter sorts constituents in ascending order based on when they were created. (If the last_modified and date_added parameters are both specified, sorting is based on the last-modified date.)


        Some parameters also add the sort_token parameter to the next_link URL to ensure that constituents are stably sorted and that the order persists even if changes occur while working through a paginated list. The last_modified, date_added, and sort parameters all add the sort_token parameter to the next_link URL, although the sort parameter only adds the sort_token parameter when it sorts by just the date_added field or just the date_modified field.


        Note: This endpoint returns data with an average latency of about 30 minutes.'
      parameters:
      - name: constituent_code
        in: query
        required: false
        schema:
          type: array
        description: Represents a list of constituent codes. Returns constituents if any of the specified constituent codes match any of their assigned constituent codes, even if the current date is not within the date range for that constituent code. For example, "constituent_code=Board Member&amp;constituent_code=Volunteer" returns constituents with either "Board Member" or "Volunteer" constituent codes.
      - name: constituent_id
        in: query
        required: false
        schema:
          type: array
        description: Represents a list of constituent identifiers. Returns constituents if any of the specified constituent identifiers match any of their constituents. For example, "constituent_id=280&amp;constituent_id=1232" returns constituents with either "280" or "1232" constituent identifiers.
      - name: custom_field_category
        in: query
        required: false
        schema:
          type: array
        description: Represents a list of custom field categories. Returns constituents if any of the specified custom field categories match any of their active custom fields. For example, "custom_field_category=Interests&amp;custom_field_category=Anniversary" returns constituents with either "Interests" or "Anniversary" custom fields.
      - name: fields
        in: query
        required: false
        schema:
          type: array
        description: Represents the fields to include on the returned records. For example, "fields=id,first,last,deceased_date". The <code>id</code> field will always be returned.
      - name: fundraiser_status
        in: query
        required: false
        schema:
          type: array
        description: Represents a comma-separated list of fundraiser statuses. Returns constituents if any of the specified fundraiser statuses match the constituent's fundraiser status. For example, "fundraiser_status=Active,None" returns constituents whose fundraiser status that matches Active or None.  Valid values for this filter are Active, Inactive, and None.
      - name: include_deceased
        in: query
        required: false
        schema:
          type: boolean
        description: Set this parameter to "true" to include deceased constituents in the response. Default value is "false".
      - name: include_inactive
        in: query
        required: false
        schema:
          type: boolean
        description: Set this parameter to "true" to include inactive constituents in the response. Default value is "false".
      - name: list_id
        in: query
        required: false
        schema:
          type: string
        description: Defines a list identifier used to filter the set of constituents to those included in the specified list. If this value is set, other specified filters will be ignored.
      - name: postal_code
        in: query
        required: false
        schema:
          type: array
        description: Represents a comma-separated list of postal codes. Returns constituents if any of the specified postal codes match the postal code for their preferred address. For example, "postal_code=99577,14623" returns constituents whose preferred address has a postal code that matches or starts with 99577 or 14623, such as 99577, 14623, or 99577-0727.
      - name: date_added
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for results created on or after the specified date. Adds the sort_token parameter to the next_link URL to ensure that constituents are stably sorted. The filter respects time offsets from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for results modified on or after the specified date. Adds the sort_token parameter to the next_link URL to ensure that constituents are stably sorted. The filter respects time offsets from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: sort_token
        in: query
        required: false
        schema:
          type: string
        description: Represents a token filter to provide the next stable-sorted list of results and to ensure that the order persists even if changes occur while working through a paginated list. The token is provided on the next_link collection response property when the request specifies the sort_token filter. The last_modified, date_added, and sort parameters also add the token to the next_link URL, although the sort parameter only adds the token when it sorts by just the date_added field or just the date_modified field.
      - name: sort
        in: query
        required: false
        schema:
          type: array
        description: 'Represents a list of fields to sort the results by. Returns a list that sorts constituents based on the supplied fields. Results are in ascending order by default, and a ''-'' sign denotes descending order. For example, "sort=date_added,-last" sorts constituents by the "date_added" field in ascending order and then by the "last" field in descending order.

          If only the date_modified field or only the date_added field is provided, then this adds the sort_token parameter to the next_link URL to ensure that constituents are stably sorted.'
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to return. The default is 500. The maximum is 5000.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip. For use with pagination.
