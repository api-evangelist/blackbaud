heck\"></i></td>\n                <td><i class=\"fa fa-check\"></i></td>\n                <td><i class=\"fa fa-check\"></i></td>\n                <td><i class=\"fa fa-check\"></i></td>\n            </tr>\n            <tr>\n                <td>county</td>\n                <td><i class=\"fa fa-check\"></i></td>\n                <td><i class=\"fa fa-check\"></i></td>\n                <td><i class=\"fa fa-check\"></i></td>\n                <td></td>\n                <td></td>\n            </tr>\n            <tr>\n                <td>country</td>\n                <td><i class=\"fa fa-check\"></i></td>\n                <td><i class=\"fa fa-check\"></i></td>\n                <td><i class=\"fa fa-check\"></i></td>\n                <td><i class=\"fa fa-check\"></i></td>\n                <td><i class=\"fa fa-check\"></i></td>\n            </tr>\n        </tbody>\n    </table>\n</div>\n\n<div class=\"footnotes\">\n    <p class=\"footnote\">* <b>Australia</b> &mdash; For <code>GET</code> operations, the <code>city</code> property returns city or suburb data. For <code>POST</code> and <code>PATCH</code> operations, you can use either the <code>suburb</code> or <code>city</code> properties, but not both. An error occurs if you provide values for both properties.</p>\n    <p class=\"footnote\">! <b>Canada</b> &mdash; Use the <code>state</code> property to track provinces.</p>\n</div>"
    RatingRead:
      description: Ratings indicate the estimated wealth of constituents and their capacity to give. Ratings information such as overall wealth ratings, suggested ask amounts, and total identified assets can help to determine where to focus efforts, whether to pursue prospects or major gifts, and how much to ask from donors.
      type: object
      properties:
        id:
          description: The immutable system record ID of the rating.
          type: string
        category:
          description: The category of the rating. Available values are the entries in the <a href="https://developer.sky.blackbaud.com/docs/services/56b76470069a0509c8f1c5b3/operations/ListRatingCategories"><b>Rating Categories</b></a> table.
          type: string
        comment:
          description: A comment about the rating.
          type: string
        constituent_id:
          description: The immutable system record ID of the constituent associated with the rating.
          type: string
        date:
          format: date-time
          description: 'The date of the rating. Uses <a href="https://tools.ietf.org/html/rfc3339">ISO-8601 format: </a><i>1969-11-21T10:29:43</i>.'
          type: string
          x-supports-datetime-offset: false
        inactive:
          description: This computed field indicates that the rating is active if the <code>category</code> is active.
          type: boolean
        source:
          description: The source of the rating.
          type: string
        type:
          description: This computed field indicates the type of data that the rating represents based on the <code>category</code> property. Available values <a href="#RatingTypes">are listed below</a>.
          enum:
          - Text
          - Number
          - DateTime
          - Currency
          - Boolean
          - CodeTable
          - Unknown
          type: string
        value:
          description: The value of the rating. The <code>type</code> property determines the format.
          type: object
      x-display-name: Rating
      x-display-id: Rating
      x-additional-info: "<a name=\"RatingTypes\"></a>\n<p>&nbsp;</p>\n<p>\n  Available values for the <b>type</b> of a <b>rating</b>:\n</p>\n\n<div class=\"table-responsive\">\n  <table class=\"table table-striped table-hover\">\n    <thead>\n      <tr>\n          <th class=\"col-xs-3\"><strong>Type</strong></th>\n          <th class=\"col-xs-9\"><strong>Description</strong></th>\n      </tr>\n    </thead>\n    <tbody>\n      <tr>\n        <td>Boolean</td>\n        <td>Defines the rating value as a boolean JSON data type.</td>\n      </tr>\n      <tr>\n        <td>CodeTable</td>\n        <td>Defines the rating value as a string JSON data type that refers to a code table entry.</td>\n      </tr>\n      <tr>\n        <td>Currency</td>\n        <td>Defines the rating value as a number JSON data type.</td>\n      </tr>\n      <tr>\n        <td>DateTime</td>\n        <td>\n          Defines the rating value as a string JSON data type in <a href=\"https://tools.ietf.org/html/rfc3339\">ISO-8601 format: </a><i>1969-11-21T10:29:43</i>.\n        </td>\n      </tr>\n      <tr>\n        <td>Number</td>\n        <td>Defines the rating value as a number JSON data type.</td>\n      </tr>\n      <tr>\n        <td>Text</td>\n        <td>Defines the rating value as a string JSON data type.</td>\n      </tr>\n    </tbody>\n  </table>\n</div>\n"
