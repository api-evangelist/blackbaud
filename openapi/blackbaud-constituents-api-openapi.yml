  /constituents/{constituent_id}/matchinggift:
    patch:
      operationId: EditConstituentMatchingGiftSetup
      summary: Organization matching gift setup (Edit)
      description: 'Edits the matching gift setup for an organization constituent.

        Omitted fields keep their stored value; an explicit null clears the field.

        The ''organization_matches_gifts'' field is the one exception: it is a plain boolean

        toggle with no cleared state, so an explicit null for it is rejected as a bad request.'
      parameters:
      - name: constituent_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the organization constituent.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationMatchingGiftSetupEdit'
            example:
              organization_matches_gifts: true
              matching_factor: 2
              max_match_annual: 15000
              match_notes: Doubles gifts during the annual campaign.
              fiscal_year_start:
                month: 7
                day: 1
        description: An object that represents the properties of the matching gift setup to edit.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains the effective matching gift setup.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMatchingGiftSetup'
              example:
                constituent_id: '280'
                organization_matches_gifts: true
                matching_factor: 1
                match_notes: Matches gifts to educational institutions.
                min_match_per_gift: 25
                max_match_per_gift: 5000
                min_match_annual: 25
                max_match_annual: 10000
                min_match_total: null
                max_match_total: null
                fiscal_year_start:
                  month: 1
                  day: 1
        '400':
          description: Returned when the specified constituent ID in the request URL or the specified request parameters are not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to edit the matching gift setup.
        '404':
          description: Returned when the specified constituent is not found or is not an organization.
      tags:
      - Constituents
    get:
      operationId: GetConstituentMatchingGiftSetup
      summary: Organization matching gift setup (Get)
      description: Returns the matching gift setup for an organization constituent.
      parameters:
      - name: constituent_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the organization constituent.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains an organization matching gift setup entity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationMatchingGiftSetup'
              example:
                constituent_id: '280'
                organization_matches_gifts: true
                matching_factor: 1
                match_notes: Matches gifts to educational institutions.
                min_match_per_gift: 25
                max_match_per_gift: 5000
                min_match_annual: 25
                max_match_annual: 10000
                min_match_total: null
                max_match_total: null
                fiscal_year_start:
                  month: 1
                  day: 1
        '400':
          description: Returned when the specified constituent ID in the request URL is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to view the matching gift setup.
        '404':
          description: Returned when the specified constituent is not found or is not an organization.
      tags:
      - Constituents
    servers:
    - url: https://api.sky.blackbaud.com/constituent/v1
