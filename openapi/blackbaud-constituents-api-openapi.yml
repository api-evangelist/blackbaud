  /v1/constituents/{constituent_id}/consents:
    get:
      operationId: ListConstituentConsent
      summary: Constituent consent list
      description: Returns a list of constituent consent records.
      parameters:
      - name: constituent_id
        in: path
        required: true
        schema:
          type: string
        description: The immutable system record ID of the constituent to retrieve consent records for.
      - name: most_recent_only
        in: query
        required: false
        schema:
          type: boolean
        description: Set this parameter to "true" to include only the most recent record for each channel category combination in the response.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Format - int32. Set this parameter to return only the specified number of records in the response. Defaults to return all records.
      - name: skip
        in: query
        required: false
        schema:
          type: integer
        description: Format - int32. Set this parameter to skip the specified number of records in the response. Defaults to skip no records.
      - name: channels
        in: query
        required: false
        schema:
          type: array
        description: Set this parameter to return records of the specified channels. For example, "channels=Phone&channels=Email" returns consent records with either "Phone" or "Email" as the channel. Defaults to return consent records with any channel.
      - name: categories
        in: query
        required: false
        schema:
          type: array
        description: Set this parameter to return records of the specified categories. For example, "categories=Fundraising&categories=Newsletter" returns consent records with either "Fundraising" or "Newsletter" as the category. Defaults to return consent records with any category.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/communication-preference#ConstituentConsentReadCollection">collection</a> of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/communication-preference#ConstituentConsentRead">consent records</a>.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConstituentConsentReadCollection'
              example:
                count: 3
                value:
                - id: '1'
                  channel: Email
                  category: Fundraising
                  source: Web form
                  consent_date: '2018-07-31T00:00:00Z'
                  constituent_consent_response: OptIn
                  privacy_notice: Sample privacy notice
                  consent_statement: Sample consent statement
                  date_added: '2018-07-30T20:39:00Z'
                  user_name: Joe Bob
                - id: '15'
                  channel: Phone
                  category: Fundraising
                  source: Phone call inbound
                  consent_date: '2018-06-22T00:00:00Z'
                  constituent_consent_response: OptOut
                  privacy_notice: Sample privacy notice
                  consent_statement: Sample consent statement
                  date_added: '2018-06-23T18:59:00Z'
                  user_name: Joe Bob
                - id: '121'
                  channel: Email
                  category: Newsletter
                  source: Phone call outbound
                  consent_date: '2018-05-03T00:00:00Z'
                  constituent_consent_response: NoResponse
                  privacy_notice: Sample privacy notice
                  consent_statement: Sample consent statement
                  date_added: '2018-05-02T11:56:00Z'
                  user_name: Joe Bob
        '400':
          description: Returned when constituent_id is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Constituents-constituent_id-ConsentsGet400ApplicationJsonResponse'
              example:
              - message: The request body is not in the appropriate format.
                error_name: BadRequest
                error_code: 400
                raw_message: The request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have rights to view the constituent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Constituents-constituent_id-ConsentsGet403ApplicationJsonResponse'
              example:
              - message: The user does not have permission to create a record.
                error_name: Forbidden
                error_code: 403
                raw_message: The user does not have permission to create a record.
        '404':
          description: Returned when the specified constituent cannot be found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/V1Constituents-constituent_id-ConsentsGet404ApplicationJsonResponse'
              example:
              - message: The requested record was not found.
                error_name: NotFound
                error_code: 404
                raw_message: The requested record was not found.
      tags:
      - Constituents
