  /constituents/duplicatesearch:
    get:
      operationId: GetDuplicateSearchResults
      summary: Constituent (Duplicate search)
      description: Returns possible duplicate records. Searches individual, organization, and related contact records and ranks results based on search filters. Records that match multiple filters rank higher as potential duplicates.
      parameters:
      - name: last_org_name
        in: query
        required: true
        schema:
          type: string
        description: A required filter for records that match the specified last name or organization name.
      - name: search_individuals
        in: query
        required: false
        schema:
          type: boolean
        description: A filter indicating whether to search for duplicate individual or organization records. This property defaults to <i>true</i> if no value is provided.
      - name: search_aliases
        in: query
        required: false
        schema:
          type: boolean
        description: A filter indicating whether to search by the alias specified in the last_org_name parameter. This property defaults to <i>false</i> if no value is provided.
      - name: search_contacts
        in: query
        required: false
        schema:
          type: boolean
        description: A filter indicating whether to search relationship contact records. This property defaults to <i>false</i> if no value is provided.
      - name: first_name
        in: query
        required: false
        schema:
          type: string
        description: A filter for individual records that match the specified first name.
      - name: middle_name
        in: query
        required: false
        schema:
          type: string
        description: A filter for individual records that match the specified middle name.
      - name: suffix
        in: query
        required: false
        schema:
          type: string
        description: A filter for individual records that match the specified suffix.
      - name: address_block
        in: query
        required: false
        schema:
          type: string
        description: A filter for records that match the specified address block.
      - name: city
        in: query
        required: false
        schema:
          type: string
        description: A filter for records that match the specified city.
      - name: state
        in: query
        required: false
        schema:
          type: string
        description: A filter for records that match the specified state.
      - name: post_code
        in: query
        required: false
        schema:
          type: string
        description: A filter for records that match the specified postcode.
      - name: email
        in: query
        required: false
        schema:
          type: array
        description: A filter for records that match the specified email addresses.
      - name: phone
        in: query
        required: false
        schema:
          type: array
        description: A filter for records that match the specified phone numbers.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: The number of records to return when paging results (Default = 3).
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: The number of records to skip when paging results.
      responses:
        '200':
          description: The response body contains a <a href ="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a> of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#DuplicateSearchResult"> duplicate search result</a> entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfDuplicateSearchResultRead'
              example:
                count: 3
                value:
                - id: '280'
                  constituent_id: '600'
                  name: Dr. Robert Carlos Hernandez
                  formatted_address: '27 Parkview Road

                    Manchester, NH  03109'
                  deceased: false
                  is_constituent: true
                  date_added: '1999-05-20T14:57:55Z'
                  rank: '0.85'
                  display_name: Robert C. Hernandez
                - id: '864'
                  constituent_id: '600'
                  name: Mr. Robert C. Hernandez
