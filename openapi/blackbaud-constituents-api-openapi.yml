          description: Returned when the operation successfully converts a non-constituent to a constituent. The response body contains the ID of the constituent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse_2'
              example:
                id: '1281'
        '400':
          description: Returned when the specified request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to convert the non-constituent to a constituent.
      tags:
      - Constituents
    servers:
    - url: https://api.sky.blackbaud.com/constituent/v1
  /constituents/customfields:
    post:
      operationId: CreateConstituentCustomField
      summary: Constituent custom field (Create)
      description: Creates a constituent custom field.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomFieldAdd'
            example:
              category: Anniversary
              comment: Celebrated yearly
              date: '2007-03-26T00:00:00Z'
              parent_id: '280'
              value: '1986-01-22T00:00:00Z'
        description: An object that represents the custom field to create.
      responses:
        '200':
          description: Returned when the operation successfully creates a custom field. The response body contains the ID of the new custom field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse_2'
              example:
                id: '1281'
        '400':
          description: Returned when the request body is not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to create the custom field.
        '404':
          description: Returned when the specified constituent is not found.
      tags:
      - Constituents
    get:
      operationId: ListConstituentCustomFieldsAllConstituents
      summary: Constituent custom field list (All constituents)
      description: 'Returns a paginated list of constituent custom fields.


        The default sorting behavior is to list constituent custom fields in ascending order based on when they were created.


        However, the last_modified parameter overrides the default sorting behavior to list constituent custom fields in ascending order based on when they were last modified. The last_modified parameter also adds the sort_token parameter to the next_link URL to ensure that constituent custom fields are stably sorted and that order persists when changes occur while working through a paginated list.


        If the last_modified and date_added parameters are both specified, the sorting behavior is to list constituent custom fields based on when they were last modified.


        Note: This endpoint returns data with an average latency of about 30 minutes. In addition, historic records have a default date_added timestamp of 1600-01-01 00:00:00.000 +00:00. The timestamp for newer records reflects when the records were added.'
      parameters:
      - name: date_added
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for constituent custom fields created on or after the specified date. The filter respects time offsets from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: last_modified
        in: query
        required: false
        schema:
          type: string
        description: 'Represents a filter for constituent custom fields modified on or after the specified date. The filter respects time offsets from UTC per the ISO-8601 format: 2016-05-05T17:59:31.1600745-04:00.'
      - name: sort_token
        in: query
        required: false
        schema:
          type: string
        description: Represents a token filter to provide the next stable-sorted list of constituent custom fields. This will be provided on the next_link collection response property when last_modified or sort_token filters are specified on the request.
      - name: category
        in: query
        required: false
        schema:
          type: array
        description: Represents a filter for a custom field category. Although the field is an array, the endpoint only returns custom fields that match a single specified category. For example, <i>category=Interests</i> returns custom fields with the <i>Interests</i> category.
      - name: value
        in: query
        required: false
        schema:
          type: array
        description: 'Represents a filter for custom field values. Must be used in conjunction with the <code>category</code> filter. Returns any custom fields in the specified category that match any of the specified values. For example, <i>category=Interests&amp;value=Baseball&amp;value=Tennis</i> returns <i>Interests</i> custom fields with the <i>Baseball</i> or <i>Tennis</i> values. Filtering by fuzzy date values must be in one of the following formats: <i>YYYYMMDD</i>, <i>YYYY</i>, <i>YYYYMM</i>, or <i>MMDD</i>.  Any four digit value that starts with 13 or higher will be considered a year.  Any four digit value that starts with 01-12 will be considered to be in <i>MMDD</i> format.'
      - name: include_count
        in: query
        required: false
        schema:
          type: boolean
        description: Represents an option to include the count of all records. Default is true.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to return. The default is 500. The maximum is 5000.
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: Represents the number of records to skip. For use with pagination.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#Collection">collection</a> of <a href="https://developer.blackbaud.com/skyapi/api/entity-reference/constituent#CustomField">custom field</a> entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCollectionOfCustomFieldRead'
              example:
                count: 229
                next_link: https://api.sky.blackbaud.com/constituent/v1/constituents/customfields?offset=3&limit=3
                value:
                - id: '1'
                  category: Business Hours
                  comment: Weekdays only
                  date_added: '1600-01-01T00:00:00Z'
                  date_modified: '1600-01-01T00:00:00Z'
                  parent_id: '281'
                  type: Text
                - id: '2'
                  category: Organization Type
                  date_added: '1600-01-01T00:00:00Z'
                  date_modified: '1600-01-01T00:00:00Z'
                  parent_id: '281'
                  type: CodeTableEntry
                - id: '3'
                  category: Business Hours
                  comment: Customer Service Center
                  date_added: '1600-01-01T00:00:00Z'
                  date_modified: '1600-01-01T00:00:00Z'
                  parent_id: '300'
                  type: Text
        '400':
          description: Returned when the specified request parameters are not in the appropriate format.
        '403':
          description: Returned when the user does not have permission to view the custom fields.
      tags:
      - Constituents
    servers:
    - url: https://api.sky.blackbaud.com/constituent/v1
