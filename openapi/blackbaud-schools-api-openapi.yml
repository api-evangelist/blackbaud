      - Schools
  /schools/{id}:
    get:
      operationId: getSchool
      summary: School by id
      description: Returns a specific school.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: sourcedId for the school
      responses:
        '200':
          description: OK - It was possible to read the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgOutputModel'
              example:
                org:
                  name: Upper School
                  type: school
                  identifier: US
                  children:
                  - sourcedId: org-dpt-222-456
                    href: https://api.sky.blackbaud.com/afe-rostr/ims/oneroster/v1p1/orgs/org-dpt-222-456
                    type: department
                  sourcedId: org-sch-222-3456
