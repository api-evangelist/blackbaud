        message: Record set notification
        record_type: Event
        record_id_set_register_id: 16c6841d-5146-4f3d-a221-23c3a28284f3
        application_user_record_type_id: 69885701-3be0-487e-b501-aa65be2c34b9
        application_user_id_set_register_id: 8479838c-9d6d-499e-9f45-5e3b6d9e9dd2
