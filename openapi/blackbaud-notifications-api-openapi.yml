tags:
- name: Notifications
paths:
  /notifications:
    post:
      operationId: CreateNotification
      summary: Create a notification
      description: Operation for adding notification parameters for altru.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewNotification'
            example:
              name: altru notification
              message: Record set notification
              record_type: Event
              record_id_set_register_id: 16c6841d-5146-4f3d-a221-23c3a28284f3
              application_user_record_type_id: 69885701-3be0-487e-b501-aa65be2c34b9
              application_user_id_set_register_id: 8479838c-9d6d-499e-9f45-5e3b6d9e9dd2
              apply_to: All users
              display_notification_window: false
              display_in_daily_sales: false
              valid_until: '2019-11-21T12:00:00Z'
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully creates the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Notifications
    servers:
    - url: https://api.sky.blackbaud.com/alt-adnmg
components:
  schemas:
    PostResponse:
      type: object
      properties:
        id:
          type: string
          description: The newly created ID.
      additionalProperties: false
      description: Defines the shape of a post response object.
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          description: A URI reference [RFC3986] that identifies the problem type. This specification encourages that, when dereferenced, it provide human-readable documentation for the problem type (e.g., using HTML [W3C.REC-html5-20141028]). When this member is not present, its value is assumed to be "about:blank".
        title:
          type: string
          description: A short, human-readable summary of the problem type. It SHOULD NOT change from occurrence to occurrence of the problem, except for purposes of localization (e.g., using proactive content negotiation; see [RFC7231], Section 3.4).
        status:
          type: integer
          description: The HTTP status code ([RFC7231], Section 6) generated by the origin server for this occurrence of the problem.
          format: int32
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
        instance:
          type: string
          description: A URI reference that identifies the specific occurrence of the problem. It may or may not yield further information if dereferenced.
        trace_id:
          type: string
          description: A request ID that can be provided to Blackbaud Support that may help with further troubleshooting.
        span_id:
          type: string
          description: A request ID that can be provided to Blackbaud Support that may help with further troubleshooting.
      additionalProperties: false
      description: A machine-readable format for specifying errors in HTTP API responses based on https://tools.ietf.org/html/rfc7807.
      x-display-name: Problem details
      x-display-id: ProblemDetails
    NewNotification:
      required:
      - name
      - record_type
      - apply_to
      type: object
      properties:
        name:
          maxLength: 100
          minLength: 0
          type: string
          description: The name.
        message:
          type: string
          description: The message.
        record_type:
          type: string
          description: The record type. This simple list can be queried at https://api.sky.blackbaud.com/alt-adnmg/simplelists/93e92ab4-bb35-44c0-9f11-3b2ffb1b5cc1.
        record_id_set_register_id:
          type: string
          description: The selection.
        application_user_record_type_id:
          type: string
          description: The application user record type ID. Read-only in the SOAP API.
        application_user_id_set_register_id:
          type: string
          description: The selection.
        apply_to:
          type: string
          description: The displays for. Available values are <i>all users</i>, <i>selected users</i>
        display_notification_window:
          type: boolean
          description: Indicates whether display in notification window.
        display_in_daily_sales:
          type: boolean
          description: Indicates whether display in daily sales.
        valid_until:
          type: string
          description: 'The end date. Uses the format YYYY-MM-DDThh:mm:ss. An example date: <i>1955-11-05T22:04:00</i>.'
          format: date-time
      additionalProperties: false
      description: CreateNotification
      example:
