            example:
              name: 2018 Annual Fund
              description: 2018 annual campaign fund
              designation_level_name: ''
              has_administrator: false
              designation_level_category: ''
              stewardship_package_process: ''
              administrator_id: ''
              lookup_id: ''
              designation_report_code_1: ''
              designation_report_code_2: ''
              site_id: ''
              site_required: false
              vanity_name: ''
              time_period: Annually
              endowed: false
              fully_funded: false
              income_to_principal: false
              income_to_principal_percent: 0
              statement_wording: ''
              endowment_min_amount: 0
              endowment_target_date: ''
              endowment_min_amount_date_met: ''
              base_currency_id: ''
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully edits the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to edit the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
