openapi: 3.2.0
info:
  title: Blackbaud Fundraisingpurposes API
  version: '1.0'
  x-refined-note:
  - x-apievangelist-provenance differs across the merged source definitions and was not carried
  description: 'Operations tagged Fundraisingpurposes across 2 of this provider''s published API definitions: blackbaud-altru-fundraising-api-openapi.yml, blackbaud-crm-fundraising-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.sky.blackbaud.com/alt-fndmg
- url: https://api.sky.blackbaud.com/crm-fndmg
security:
- Bb-Api-Subscription-Key: []
  OAuth2: []
tags:
- name: Fundraisingpurposes
paths:
  /fundraisingpurposes:
    post:
      operationId: CreateFundraisingPurpose
      summary: Create a fundraising purpose
      description: Operation for adding a fundraising purpose record.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewFundraisingPurpose'
            example:
              name: 2018 Annual Fund
              description: 2018 annual campaign fund
              designation_level_type: Fund
              designation_level_category: Annual
              stewardship_package_process: ''
              administrator_id: ''
              lookup_id: 2018ANNUAL
              designation_report_code_1: ''
              designation_report_code_2: ''
              site_id: ''
              site_required: false
              vanity_name: ''
              time_period: Annually
              endowed: false
              fully_funded: false
              income_to_principal: false
              income_to_principal_percent: 0
              statement_wording: ''
              endowment_min_amount: 0
              endowment_target_date: ''
              endowment_min_amount_date_met: ''
              base_currency_id: ''
        description: ConfigurationMessage object representing operation intended to be created
      responses:
        '200':
          description: Returned when the operation successfully creates the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to create the resource.
        '404':
          description: Returned when the specified resource is not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      tags:
      - Fundraisingpurposes
    servers:
    - url: https://api.sky.blackbaud.com/alt-fndmg
  /fundraisingpurposes/search:
    get:
      operationId: SearchFundraisingPurposes
      summary: Search for fundraising purposes
      description: Search screen for finding fundraising purpose records.
      parameters:
      - name: name
        in: query
        required: false
        schema:
          type: string
        description: name
      - name: designation_level_category
        in: query
        required: false
        schema:
          type: string
        description: category This code table can be queried at https://api.sky.blackbaud.com/alt-adnmg/codetables/DESIGNATIONLEVELCATEGORYCODE/entries
      - name: exact_match_only
        in: query
        required: false
        schema:
          type: boolean
        description: match all criteria exactly
      - name: type
        in: query
        required: false
        schema:
          type: string
        description: type SimpleDataListID=5135618a-3055-4e02-ab1e-a2c091ad05e5.
      - name: user_id
        in: query
        required: false
        schema:
          type: string
        description: lookup id
      - name: site_id
        in: query
        required: false
        schema:
          type: string
        description: site
      - name: hierarchy
        in: query
        required: false
        schema:
          type: boolean
        description: is hierarchy
      - name: for_financial_info_batch
        in: query
        required: false
        schema:
          type: boolean
        description: for financial information batch
      - name: combined_search
        in: query
        required: false
        schema:
          type: string
        description: search for
      - name: vanity_name
        in: query
        required: false
        schema:
          type: string
        description: public name
      - name: only_show_unused_purposes
        in: query
        required: false
        schema:
          type: boolean
        description: only include purposes that are not used in the following branch
      - name: unused_in_designation_id
        in: query
        required: false
        schema:
          type: string
        description: branch
      - name: limit
        in: query
        required: false
        schema:
          type: integer
        description: Limits the number of records to return.
      responses:
        '200':
          description: Returned when the operation succeeds. The response body contains a collection of result entities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FundraisingPurposeSearchCollection'
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to view the resource.
        '404':
          description: Returned when the specified resource is not found.
      tags:
      - Fundraisingpurposes
    servers:
    - url: https://api.sky.blackbaud.com/alt-fndmg
  /fundraisingpurposes/{fundraising_purpose_id}:
    delete:
      operationId: DeleteFundraisingPurpose
      summary: Delete a fundraising purpose
      description: This delete method handles the basic deletion rules for a fundraising purpose.
      parameters:
      - name: fundraising_purpose_id
        in: path
        required: true
        schema:
          type: string
        description: The fundraising purpose id
      responses:
        '200':
          description: Returned when the operation successfully deletes the resource.
        '400':
          description: Returned when the request body is not in the appropriate format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Returned when the user does not have permission to delete the resource.
      tags:
      - Fundraisingpurposes
    patch:
      operationId: EditFundraisingPurpose
      summary: Edit a fundraising purpose
      description: Operation used for editing a fundraising purpose.
      parameters:
      - name: fundraising_purpose_id
        in: path
        required: true
        schema:
          type: string
        description: The fundraising purpose id.
      requestBody:
        content:
